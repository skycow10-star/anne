[`38-28`, `"하지만 막으실 수 없어요. 저는 열여섯 살 반이고, 언젠가 린드 부인이 말씀하신 대로 '노새처럼 고집이 세거든요.'" 앤이 웃었다. "아, 아주머니, 저를 불쌍하게 여기지 마세요. 동정받는 건 싫고, 그럴 필요도 없어요. 정든 초록 지붕 집에 남는다고 생각만 해도 마음속 깊이 기뻐요. 누구도 아주머니와 저만큼 이 집을 사랑할 수는 없어요. 그러니 우리가 지켜야 해요."`],
[`38-29`, `"이 축복받은 아이야!" 마릴라가 마침내 물러서며 말했다. "새 삶을 얻은 것 같구나. 끝까지 버텨서 너를 대학에 보내야 마땅하겠지만, 그럴 수 없다는 걸 알기에 그러지 않으마. 대신 꼭 갚아 주마, 앤."`],
[`38-30`, `앤 셜리가 대학 진학을 포기하고 집에 남아 가르치기로 했다는 소문이 에이번리에 퍼지자, 말들이 무성했다. 마릴라의 눈에 대해 모르는 선량한 사람들 대부분은 앤이 어리석다고 생각했다. 앨런 부인은 그렇지 않았다. 부인은 앤에게 그 뜻을 칭찬하는 말을 해 주었고, 앤은 기쁨의 눈물을 글썽였다. 마음씨 좋은 린드 부인도 그렇지 않았다. 어느 저녁 린드 부인은 초록 지붕 집에 올라왔다가, 따뜻하고 향기로운 여름 해 질 녘에 현관에 앉아 있는 앤과 마릴라를 보았다. 두 사람은 땅거미가 내리고 하얀 나방들이 뜰을 날고 박하 향이 이슬 젖은 공기를 채울 때 그곳에 앉아 있기를 좋아했다.`],
[`38-31`, `레이첼 부인은 피곤함과 안도가 뒤섞인 긴 숨을 내쉬며 문 옆 돌 벤치에 그 듬직한 몸을 내려놓았다. 벤치 뒤에는 분홍색과 노란색의 키 큰 접시꽃들이 늘어서 있었다.`],
[`38-32`, `"아이고, 앉으니 살겠네. 하루 종일 서 있었는데, 두 발로 이백 파운드를 끌고 다니려니 보통 일이 아니에요. 뚱뚱하지 않다는 건 큰 축복이에요, 마릴라. 고마운 줄 아시길 바라요. 그래, 앤, 대학 가겠다는 생각을 접었다면서? 그 말 듣고 정말 기뻤다. 여자가 편하게 지닐 만큼의 교육은 이제 충분히 받았잖니. 여자애들이 남자들이랑 대학에 가서 라틴어니 그리스어니 하는 쓸데없는 걸 머리에 잔뜩 집어넣는 건 난 찬성 못 한다."`],
[`38-33`, `"하지만 저 라틴어랑 그리스어는 그래도 공부할 거예요, 린드 부인." 앤이 웃으며 말했다. "여기 초록 지붕 집에서 문과 과정을 공부할 거예요. 대학에서 배울 걸 다 공부할 거예요."`],
[`38-34`, `린드 부인은 경악하여 두 손을 들어 올렸다.`],
[`38-35`, `"앤 셜리, 그러다 죽겠다."`],
[`38-36`, `"전혀요. 오히려 쑥쑥 클걸요. 아, 무리하지는 않을 거예요. '조사이어 앨런의 아내'가 말한 대로 '적당히' 할 거예요. 기나긴 겨울 저녁엔 시간이 많을 테고, 저는 수예 같은 데는 재주가 없거든요. 아시다시피 저는 카모디에서 가르칠 거예요."`],
[`38-37`, `"그건 모르겠다. 너는 바로 여기 에이번리에서 가르치게 될 것 같은데. 이사들이 너한테 학교를 맡기기로 했단다."`],
[`38-38`, `"린드 부인!" 앤이 깜짝 놀라 벌떡 일어나며 외쳤다. "아니, 길버트 블라이스한테 주기로 약속했다고 들었는데요!"`],
[`38-39`, `"그랬지. 그런데 길버트가 네가 지원했다는 말을 듣자마자 이사들을 찾아갔다지 뭐냐. 어젯밤 학교에서 회의가 있었거든. 길버트는 자기 지원을 철회하고, 네 지원을 받아 달라고 했대. 자기는 화이트샌즈에서 가르치겠다면서. 물론 네가 마릴라와 함께 있고 싶어 한다는 걸 알고 너를 위해 학교를 양보한 거지. 정말 친절하고 사려 깊은 일이라고 생각한다, 내 말이. 희생도 대단하고. 화이트샌즈에선 하숙비를 내야 하고, 길버트가 제 힘으로 돈을 벌어 대학에 가야 한다는 건 다들 아니까. 그래서 이사들이 너를 뽑기로 했단다. 토머스가 집에 와서 그 말을 할 때 나는 좋아서 죽는 줄 알았다."`],
[`38-40`, `"제가 그걸 받아도 될지 모르겠어요." 앤이 중얼거렸다. "그러니까… 길버트가 저를… 저를 위해 그런 희생을 하게 두면 안 될 것 같아요."`],
[`38-41`, `"이제 와서 막을 수는 없을 거다. 길버트는 벌써 화이트샌즈 이사들과 계약서에 서명했으니까. 지금 네가 거절해도 길버트한테 아무 도움이 안 돼. 당연히 학교를 맡아야지. 이제 파이 집안 아이들이 안 다니니 잘 지낼 거다. 조시가 마지막이었는데, 그게 다행이지, 내 말이. 지난 이십 년 동안 에이번리 학교엔 파이 집안 아이가 꼭 하나씩은 다녔는데, 그 애들이 세상에 온 사명은 선생님들한테 이 땅이 그들의 집이 아니라는 걸 일깨워 주는 거였나 보다. 아이고, 저기 배리 씨네 지붕창에서 깜빡깜빡하는 건 뭐냐?"`],
[`38-42`, `"다이애나가 건너오라고 신호하는 거예요." 앤이 웃었다. "옛날 놀이를 아직도 하거든요. 잠깐 실례할게요. 무슨 일인지 다녀올게요."`],
[`38-43`, `앤은 사슴처럼 토끼풀 비탈을 달려 내려가 유령의 숲의 전나무 그늘 속으로 사라졌다. 린드 부인이 너그러운 눈으로 그 뒷모습을 바라보았다.`],
[`38-44`, `"어떤 면에선 아직 어린애 같은 구석이 많네요."`],
[`38-45`, `"다른 면에선 어른다운 구석이 훨씬 많지요." 잠시 예전의 깐깐함을 되찾은 마릴라가 맞받았다.`],
[`38-46`, `그러나 깐깐함은 더 이상 마릴라를 대표하는 성격이 아니었다. 그날 밤 린드 부인이 남편 토머스에게 말한 대로.`],
[`38-47`, `"마릴라 커스버트는 부드러워졌어요. 그렇다니까요."`],
[`38-48`, `다음 날 저녁, 앤은 매슈의 무덤에 새 꽃을 놓고 스코틀랜드 장미에 물을 주러 작은 에이번리 묘지에 갔다. 앤은 해가 질 때까지 그곳에 머물렀다. 그 작은 곳의 평화와 고요가 좋았다. 미루나무들은 나지막하고 다정한 말소리처럼 바스락거렸고, 무덤 사이로 풀이 제멋대로 자라 속삭였다. 마침내 그곳을 떠나 '반짝이는 호수'로 이어지는 긴 언덕을 걸어 내려갈 때는 해가 진 뒤였다. 에이번리 전체가 꿈같은 저녁 빛 속에 앞에 펼쳐져 있었다. '옛 평화가 깃든 곳'이었다. 공기에는 꿀처럼 달콤한 토끼풀 들판을 스쳐 온 바람 같은 싱그러움이 있었다. 집집의 나무 사이로 여기저기 등불이 반짝였다. 그 너머로는 안개 낀 보랏빛 바다가 끝없이 아련하게 웅얼거렸다. 서쪽 하늘은 부드럽게 뒤섞인 빛깔로 찬란했고, 연못은 그 모든 빛을 더욱 부드러운 색조로 비추었다. 그 모든 아름다움이 앤의 가슴을 설레게 했고, 앤은 고마운 마음으로 영혼의 문을 활짝 열었다.`],
[`38-49`, `"정든 세상아." 앤이 속삭였다. "너는 정말 아름다워. 네 안에 살아 있어서 기뻐."`],
[`38-50`, `언덕을 반쯤 내려왔을 때, 키 큰 청년 하나가 휘파람을 불며 블라이스 씨네 집 앞 대문에서 나왔다. 길버트였다. 앤을 알아본 길버트의 입술에서 휘파람이 멎었다. 길버트는 정중하게 모자를 들어 인사했지만, 앤이 멈춰 서서 손을 내밀지 않았다면 말없이 지나쳐 갔을 것이다.`],
[`38-51`, `"길버트." 앤이 뺨을 붉히며 말했다. "나를 위해 학교를 양보해 줘서 고마워. 정말 고마운 일이었어. 그리고 내가 그걸 정말 고맙게 여긴다는 걸 알아줬으면 해."`],
[`38-52`, `길버트는 내민 손을 반갑게 잡았다.`],
[`38-53`, `"딱히 고마워할 일도 아니야, 앤. 너한테 작은 도움이라도 될 수 있어서 기뻤어. 이제부터 우리 친구가 되는 거야? 내 옛날 잘못, 정말 용서해 준 거야?"`],
[`38-54`, `앤은 웃으며 손을 빼려 했지만 잘되지 않았다.`],
[`38-55`, `"그날 연못 선착장에서 이미 용서했어. 나도 몰랐지만. 내가 얼마나 고집 센 꼬마 바보였는지. 그 뒤로 나는… 이왕 다 털어놓을게… 그 뒤로 줄곧 후회했어."`],
[`38-56`, `"우리는 가장 좋은 친구가 될 거야." 길버트가 기뻐하며 말했다. "우리는 좋은 친구가 되도록 태어났어, 앤. 너는 운명을 충분히 오래 거슬렀어. 우리는 여러 가지로 서로 도울 수 있을 거야. 너도 공부를 계속할 거지? 나도 그래. 자, 집까지 바래다줄게."`],
[`38-57`, `앤이 부엌에 들어서자 마릴라가 궁금한 얼굴로 바라보았다.`],
[`38-58`, `"오솔길로 너랑 같이 올라온 사람이 누구냐, 앤?"`],
[`38-59`, `"길버트 블라이스요." 앤은 얼굴이 붉어지는 게 속상했다. "배리 씨네 언덕에서 만났어요."`],
[`38-60`, `"너랑 길버트 블라이스가 대문 앞에서 반 시간이나 서서 이야기할 만큼 친한 사이인 줄은 몰랐구나." 마릴라가 건조하게 웃으며 말했다.`],
[`38-61`, `"친하지 않았어요. 우리는 좋은 적이었죠. 하지만 앞으로는 좋은 친구가 되는 편이 훨씬 현명하겠다고 결정했어요. 정말 반 시간이나 있었어요? 몇 분밖에 안 된 것 같은데. 하지만 아주머니, 우리는 5년 동안 못 나눈 이야기를 따라잡아야 하거든요."`],
[`38-62`, `그날 밤 앤은 기쁜 만족감을 벗 삼아 오래도록 창가에 앉아 있었다. 바람은 벚나무 가지 사이에서 부드럽게 가르랑거렸고, 박하 향이 올라왔다. 골짜기의 뾰족한 전나무들 위로 별이 반짝였고, 늘 보던 나무 틈새로 다이애나의 불빛이 비쳤다.`],
[`38-63`, `퀸스에서 돌아와 이곳에 앉아 있던 밤 이후로 앤의 지평선은 좁아졌다. 그러나 앞에 놓인 길이 좁다 해도, 그 길을 따라 조용한 행복의 꽃들이 피어나리라는 것을 앤은 알았다. 진실한 일과 가치 있는 포부와 마음 맞는 우정의 기쁨이 앤의 것이 될 것이다. 그 무엇도 앤에게서 타고난 상상력이나 꿈의 이상 세계를 빼앗을 수는 없었다. 그리고 언제나 길모퉁이가 있었다!`],
[`38-64`, `"'하느님은 하늘에 계시고, 세상은 모두 평안하도다.'" 앤이 나지막이 속삭였다.`],
  ]
};

  {w:`anne`, in:1, f:`anne_happy`, o:`matthew`,
   e:`아저씨가 수염 속으로 살짝 웃으셨어. 내 상상 놀이에 같이 올라타 준 어른은 아저씨가 처음이야!`,
   l:`아저씨의 수염 속에서 웃음이 번졌다. 내 상상 놀이에 기꺼이 올라타 준 어른은 그분이 처음이었다.`},
  {t:`goto`, to:`m9`},
  {id:`c3c`, w:`matthew`, cam:`right`, f:`anne_happy`, o:`matthew`, eff:{album:`matthewTalk`},
   e:`"나, 나 말이냐? 글쎄다… 나는 말 돌보는 거랑, 해 질 녘에 조용히 밭을 보는 게 좋구나. 누가 내 얘기를 물어봐 준 건 참 오랜만이구나."`,
   l:`"나, 나 말이냐? 글쎄다… 말을 돌보는 일이랑, 해 질 녘 조용히 밭을 바라보는 게 좋지. 누가 내 이야기를 물어 준 게 참 오랜만이구나."`},
  {w:`anne`, in:1, f:`anne_happy`, o:`matthew`,
   e:`아저씨의 귀가 살짝 빨개졌어. 수줍은 사람도 누가 궁금해해 주면 기쁜가 봐.`,
   l:`아저씨의 귓불이 살짝 붉어졌다. 아무리 수줍은 사람이라도 누군가 자신을 궁금해해 주면 기쁜 법이다.`},
  {id:`m9`, w:`anne`, cam:``, f:`anne_dreamy`, o:`matthew`, bk:[27],
   e:`"그런데 아저씨, 이 섬의 길은 왜 빨간색이에요? 스펜서 부인께 여쭤 봤더니 제발 그만 물어보라고 하셨어요."`,
   l:`"그런데 이 섬의 길들은 왜 빨간 거예요? 스펜서 부인께 여쭤 봤더니 제발 질문 좀 그만하라고 하셨어요. 하지만 질문을 안 하면 어떻게 알아내겠어요?"`},
  {w:`matthew`, f:`anne_happy`, o:`matthew`, bk:[28], b:`"글쎄다, 모르겠구나."`},
  {w:`anne`, f:`anne_happy`, o:`matthew`, bk:[29],
   e:`"그럼 언젠가 알아내야 할 것 중 하나네요! 알아낼 게 이렇게 많다니 정말 신나요. 그런데… 제가 말을 너무 많이 하나요? 싫으시면 그만할게요."`,
   l:`"그럼 그건 언젠가 알아낼 일 중 하나네요. 알아낼 것이 이토록 많다니, 살아 있다는 게 그저 기뻐요. 그런데… 제가 말을 너무 많이 하나요? 원하시면 그만할게요. 어렵긴 하지만요."`},
  {w:`matthew`, f:`anne_happy`, o:`matthew`, bk:[30,31],
   b:`"아, 하고 싶은 만큼 얼마든지 이야기하렴. 나는 괜찮단다."`},
  {w:`anne`, in:1, f:`anne_happy`, o:`matthew`, bk:[32],
   e:`와! 말하고 싶을 때 마음껏 말해도 된다니! "아이들은 조용히 해야 한다"는 말을 백만 번은 들었는데. 아저씨랑 나는 분명 잘 지낼 거야.`,
   l:`말하고 싶을 때 마음껏 말해도 된다니. "아이는 눈에 띄되 소리 내지 말라"는 말을 백만 번은 들어 온 내게 그것은 해방과도 같았다. 아저씨와 나는 틀림없이 잘 지낼 것이다.`},
  {w:`anne`, f:`anne_sad`, o:`matthew`, bk:[36,37], cam:`left`,
   e:`"지금 저는 거의 완벽하게 행복해요. 하지만 완전히 행복할 수는 없어요. 아저씨, 이건 무슨 색이에요?" 나는 땋은 머리 한 가닥을 들어 보였어.`,
   l:`"지금 저는 거의 완벽하게 행복해요. 하지만 완전히 행복할 수는 없어요. 왜냐하면… 이건 무슨 색이라고 하시겠어요?" 나는 윤기 나는 땋은 머리 한 가닥을 어깨 너머로 넘겨 아저씨 눈앞에 들어 보였다.`},
  {w:`matthew`, f:`anne_sad`, o:`matthew`, bk:[38], b:`"빨간색이지, 아니냐?"`},
  {w:`anne`, f:`anne_sad`, o:`matthew`, bk:[39,40], cam:`in`,
   e:`"네, 빨간색이에요. 주근깨랑 마른 몸은 상상으로 없앨 수 있어요. 하지만 빨간 머리만은 아무리 상상해도 안 없어져요. 이건 제 평생의 슬픔이 될 거예요."`,
   l:`"네, 빨간색이에요. 주근깨도, 초록 눈도, 깡마른 몸도 상상으로 지울 수 있어요. 하지만 빨간 머리만은 도저히 지울 수가 없어요. '내 머리는 까마귀 날개처럼 새까맣다' 아무리 되뇌어도 소용없어요. 이건 제 평생의 슬픔이 될 거예요."`},
  {w:`anne`, f:`anne_dreamy`, o:`matthew`, bk:[42,43,44,45],
   e:`"아저씨라면 뭐가 되고 싶으세요? 눈부시게 아름다운 사람, 눈부시게 똑똑한 사람, 천사처럼 착한 사람 중에서요." 아저씨는 "글쎄다, 나는… 잘 모르겠구나." 하시며 머리가 어질어질하신 것 같았어.`,
   l:`"고를 수 있다면 어떤 사람이 되고 싶으세요? 천상의 아름다움을 지닌 사람, 눈부시게 영리한 사람, 아니면 천사처럼 착한 사람?" "글쎄다, 나는… 잘 모르겠구나." 아저씨는 회전목마에서 막 내린 사람처럼 어지러워 보였다.`},
  /* ---------- 가로수길 ---------- */
  {bg:`ch1_avenue`, w:`anne`, f:`anne_surprised`, cam:`shake`, o:`matthew`, bk:[46,47],
   e:`"저도 못 고르겠어요. 스펜서 부인 말씀으로는… 아, 커스버트 아저씨! 아, 아저씨!! 아저씨!!!"`,
   l:`"저도 정하지 못하겠어요. 스펜서 부인 말씀으로는… 아, 커스버트 씨! 아, 커스버트 씨!! 아, 커스버트 씨!!!"`},
  {w:`anne`, in:1, f:`anne_dreamy`, o:`matthew`, bk:[48], cam:`up`,
   e:`모퉁이를 돌자, 커다란 사과나무들이 길 위를 지붕처럼 덮은 길이 나타났어. 머리 위는 온통 눈처럼 하얀 꽃이었고, 저 끝에서는 노을이 커다란 장미창처럼 빛나고 있었어.`,
   l:`모퉁이를 돌자 '가로수길'이 나타났다. 가지를 활짝 편 거대한 사과나무들이 길 위를 아치처럼 온통 덮고 있었다. 머리 위로는 눈처럼 희고 향기로운 꽃의 차양이 끝없이 이어졌고, 저 멀리 노을 진 하늘이 대성당 통로 끝의 커다란 장미창처럼 빛났다.`},
  {w:`anne`, in:1, f:`anne_dreamy`, o:`matthew`, bk:[49], cam:`in`,
   e:`나는 두 손을 꼭 모으고 하늘만 올려다봤어. 너무 아름다워서 한마디도 할 수 없었어. 마을을 지나고 3마일을 더 가도록 말이야. 나 같은 수다쟁이가!`,
   l:`나는 두 손을 모아 쥔 채 머리 위의 하얀 장관만 올려다보았다. 뉴브리지 마을을 지나고 다시 3마일을 달리는 동안 나는 한마디도 하지 않았다. 떠드는 만큼이나 열렬하게, 나는 침묵할 수도 있었다.`},
  {w:`matthew`, f:`anne_dreamy`, o:`matthew`, bk:[50], cam:`right`,
   e:`"꽤 피곤하고 배고픈 모양이구나. 이제 1마일만 더 가면 된단다."`,
   l:`"꽤 피곤하고 배가 고픈 모양이구나. 하지만 이제 멀지 않았다. 1마일만 더 가면 돼."`},
  {w:`anne`, f:`anne_dreamy`, o:`matthew`, bk:[51,52,54], cam:`left`,
   e:`"아저씨, 아까 그 하얀 곳은 뭐였어요? 예쁘다는 말로는 모자라요. 상상으로도 더 멋지게 만들 수 없는 곳은 처음이었어요. 가슴이 이상하게 아팠는데, 기분 좋은 아픔이었어요."`,
   l:`"아, 커스버트 씨. 아까 그 하얀 곳은 뭐였어요? '예쁘다'로도 '아름답다'로도 모자라요. 상상으로도 더 낫게 만들 수 없는 건 처음 봤어요. 가슴이 묘하게 아팠는데, 그건 기분 좋은 아픔이었어요."`},
  {w:`matthew`, f:`anne_dreamy`, o:`matthew`, bk:[53],
   e:`"글쎄다, 가로수길을 말하는 모양이구나. 꽤 예쁜 곳이지."`,
   l:`"글쎄다, 가로수길을 말하는 모양이구나. 꽤 예쁜 곳이지."`},
  {w:`anne`, in:1, f:`anne_dreamy`, o:`matthew`, bk:[56],
   e:`가로수길? 그런 이름에는 아무 뜻도 없잖아! 나는 마음에 안 드는 이름이 있으면 언제나 새 이름을 지어 줘. 이 길에도 꼭 맞는 이름을 지어 줘야겠어.`,
   l:`가로수길이라니, 그런 이름에는 아무 뜻도 담겨 있지 않다. 나는 마음에 들지 않는 이름을 만나면 언제나 새 이름을 상상해 붙여 주었다. 이 길에도 꼭 맞는 이름이 필요했다.`},
  {t:`name`, id:`N1`, key:`avenue`, label:`가로수길에 붙인 이름`, canon:`기쁨의 하얀 길`, f:`anne_dreamy`, o:`matthew`,
   q:{e:`✍️ 앤이 되어 이 길에 이름을 지어 주세요! 어떤 이름이 어울릴까요?`, l:`✍️ 앤이 되어, 이 꽃길에 꼭 맞는 이름을 지어 주세요.`},
   ph:`예: 꽃구름 터널`,
   note:{e:`원작의 앤은 이 길을 '기쁨의 하얀 길'이라고 불렀어요. 고아원에 있던 친구 '헵지바 젠킨스'도 마음속으로는 '로잘리아 드비어'라고 불렀대요.`,
         l:`원작에서 앤은 이 길을 '기쁨의 하얀 길'이라 명명합니다. 마음에 들지 않는 이름은 늘 새로 상상해 붙이는 것이 앤의 버릇이었지요. 고아원 친구 헵지바 젠킨스는 앤의 마음속에서 로잘리아 드비어였습니다.`}},
  {w:`anne`, f:`anne_happy`, o:`matthew`, bk:[56], eff:{item:`namecard`},
   e:`"다른 사람들은 가로수길이라고 부르겠지만, 저는 언제까지나 '{avenue}'{avenue|이라고} 부를 거예요!"`,
   l:`"다른 사람들은 그곳을 가로수길이라 부르겠지만, 저는 언제까지나 '{avenue}'{avenue|이라고} 부를 거예요."`},
  {w:`anne`, f:`anne_happy`, o:`matthew`, bk:[56],
   e:`"정말 1마일만 가면 집이에요? 기쁘기도 하고 아쉽기도 해요. 저는 진짜 집을 가져 본 적이 한 번도 없거든요. 집에 간다고 생각하니까 또 그 기분 좋은 아픔이 느껴져요."`,
   l:`"정말 1마일만 더 가면 집이에요? 기쁘기도 하고 아쉽기도 해요. 즐거운 일이 끝날 때면 늘 아쉽거든요. 하지만 저는 진짜 집을 가져 본 적이 한 번도 없어요. 진짜 집에 간다는 생각만으로도 그 기분 좋은 아픔이 또 느껴져요."`},
  /* ---------- 연못 ---------- */
  {bg:`ch1_pond`, w:`anne`, in:1, cam:`out`, f:`anne_dreamy`, o:`matthew`, bk:[57],
   e:`언덕을 넘자 길고 구불구불한 연못이 나타났어. 물빛이 장미색, 연둣빛, 보랏빛으로 계속 바뀌었어. 늪에서는 개구리들이 맑게 노래하고, 건너편 작은 회색 집 창문에는 불빛이 반짝였어.`,
   l:`언덕 마루를 넘자 강처럼 길고 구불구불한 연못이 내려다보였다. 물은 크로커스빛, 장밋빛, 투명한 초록빛으로 시시각각 바뀌었고, 아직 아무도 이름 붙이지 못한 빛깔도 어른거렸다. 늪에서는 개구리들의 구슬프고도 달콤한 합창이 들려왔고, 건너편 비탈 회색 집 창문에는 불빛 하나가 켜져 있었다.`},
  {w:`matthew`, f:`anne_dreamy`, o:`matthew`, bk:[58], b:`"저건 배리 씨네 연못이란다."`},
  {t:`choice`, id:`C4`, kind:`predict`, label:`연못의 이름`, f:`anne_dreamy`, o:`matthew`,
   q:{e:`그 이름도 마음에 안 드는 앤! 원작의 앤은 이 연못을 뭐라고 불렀을까요?`, l:`앤은 이 이름도 마음에 들지 않습니다. 원작의 앤은 이 연못을 무엇이라 불렀을까요?`},
   note:{e:`원작의 앤은 이 연못을 '반짝이는 호수'라고 불러요. 딱 맞는 이름이 떠오르면 온몸이 찌릿한 '전율'이 느껴진대요.`,
         l:`원작에서 앤은 이 연못을 '반짝이는 호수'라 부릅니다. 꼭 맞는 이름을 찾으면 전율이 일기에 그것이 옳은 이름임을 안다고 말하지요.`},
   opts:[
    {type:`canon`, go:`c4a`, eff:{name:{pond:`반짝이는 호수`}}, e:`'반짝이는 호수'라고 부른다.`, l:`'반짝이는 호수'라 부른다.`, s:{e:`'반짝이는 호수'`, l:`'반짝이는 호수'`}},
    {type:`imag`, go:`c4b`, eff:{name:{pond:`노을 거울 연못`}, album:`mirror`}, e:`'노을 거울 연못'이라고 부른다.`, l:`'노을을 비추는 거울 연못'이라 부른다.`, s:{e:`'노을 거울 연못'`, l:`'노을 거울 연못'`}},
    {type:`bal`, go:`c4c`, eff:{name:{pond:`배리 씨네 연못`}}, e:`주인의 이름을 존중해서 '배리 씨네 연못'이라고 그대로 부른다.`, l:`주인의 이름을 존중하여 '배리 씨네 연못'이라 그대로 부른다.`, s:{e:`'배리 씨네 연못' 그대로`, l:`'배리 씨네 연못' 그대로`}}
   ]},
  {id:`c4a`, w:`anne`, f:`anne_happy`, o:`matthew`, bk:[59],
   e:`"저는 '반짝이는 호수'라고 부를래요. 딱 맞는 이름이 떠오르면 온몸이 찌릿하거든요. 아저씨도 그런 전율을 느껴 보신 적 있어요?"`,
   l:`"저는 이렇게 부를래요. 음, 어디 보자… '반짝이는 호수'. 그래요, 그게 딱 맞는 이름이에요. 전율이 느껴지니까 알아요. 아저씨도 무언가에 전율을 느끼신 적 있어요?"`},
  {t:`goto`, to:`m28`},
  {id:`c4b`, w:`anne`, f:`anne_happy`, o:`matthew`, fx:`dream`,
   e:`"'노을 거울 연못'이요! 저 물에 노을이 거울처럼 비치잖아요. 딱 맞는 이름이 떠오르면 온몸이 찌릿해요. 아저씨도 그런 적 있으세요?"`,
   l:`"'노을을 비추는 거울 연못'이요. 보세요, 하늘이 통째로 물속에 내려앉았잖아요. 꼭 맞는 이름이 떠오르면 전율이 일어요. 아저씨도 무언가에 전율을 느끼신 적 있어요?"`},
  {t:`goto`, to:`m28`},
  {id:`c4c`, w:`anne`, f:`anne_happy`, o:`matthew`, eff:{heart:{matthew:1}},
   e:`"배리 씨네 연못이라… 주인 이름을 딴 거라면 그것도 소중한 이름이네요. 그래도 저 물빛은 정말 찌릿할 만큼 예뻐요. 아저씨도 그런 전율을 느껴 보신 적 있어요?"`,
   l:`"배리 씨네 연못이라… 누군가의 이름을 딴 것이라면 그것도 나름대로 소중한 이름이겠지요. 그래도 저 물빛엔 전율이 일어요. 아저씨도 무언가에 전율을 느끼신 적 있어요?"`},
  {id:`m28`, w:`matthew`, f:`anne_happy`, o:`matthew`, bk:[60,61],

  talk: {
    e: [`린드 부인의 말에 앤이 그렇게 화가 난 까닭은 무엇일까요? "내가 나에게 하는 말"과 "남이 나에게 하는 말"은 어떻게 다를까요?`,
        `매슈 아저씨는 왜 마릴라 아주머니 몰래 앤을 찾아갔을까요?`,
        `앤의 사과는 진심이었을까요, 연극이었을까요? 내가 고른 사과 방법과 비교해 이야기해 봐요.`],
    l: [`"자기가 그렇게 말하는 거랑 남한테서 그런 말을 듣는 건 완전히 달라요." 앤의 이 말에 담긴 마음을 설명해 봅시다.`,
        `마릴라는 왜 린드 부인에게 "아이 생김새를 가지고 놀리시면 안 됐어요"라고 말했을까요? 마릴라의 어린 시절 기억과 연결해 봅시다.`,
        `앤의 극적인 사과는 '벌'이었을까요, '즐거움'이었을까요? 원작의 묘사와 내가 고른 길을 비교해 평가해 봅시다.`]
  },
  nodes: [
  /* ---------- 지난 이야기 ---------- */
  {id:`b1`, bg:`ch2_room`, w:`anne`, in:1, f:`anne_sad`, cam:`in`,
   e:`초록 지붕 집에 도착한 그날 밤, 나는 알게 됐어. 아저씨와 아주머니가 기다린 건 농사일을 도울 남자아이였다는 걸. 나는 밤새 울었어.`,
   l:`초록 지붕 집에 닿은 그날 밤, 나는 진실을 알았다. 커스버트 남매가 기다린 것은 농사일을 거들 사내아이였다는 것을. 나는 절망의 구렁텅이에 빠져 밤새 울었다.`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`marilla_strict`, eff:{met:`marilla`},
   e:`다음 날, 마릴라 아주머니는 나를 돌려보내려고 스펜서 부인 댁에 데려가셨어. 그런데 거기서 블루엣 부인이라는 분이 나를 데려가 아이 보는 일을 시키겠다고 하셨어. 눈빛이 너무 차가워서 무서웠어.`,
   l:`이튿날 마릴라 아주머니는 나를 돌려보내려 스펜서 부인 댁으로 데려갔다. 그런데 그곳에서 블루엣 부인이 나를 데려가 아이 보는 일을 시키겠다고 나섰다. 송곳처럼 날카로운 그 눈빛에 나는 몸이 움츠러들었다.`},
  {w:`anne`, in:1, f:`anne_happy`, o:`marilla_warm`, cam:``,
   e:`그때 마릴라 아주머니가 나를 보시더니 마음을 바꾸셨어. 결국 나는 초록 지붕 집에서 살게 됐어! 아주머니는 착한 아이가 되도록 노력하라고 하셨고, 나는 꼭 그러겠다고 약속했어.`,
   l:`그때 내 얼굴을 바라보던 마릴라 아주머니의 마음이 움직였다. 그리하여 나는 초록 지붕 집에 남게 되었다. 아주머니는 착한 아이가 되도록 노력하라고 당부했고, 나는 그러겠노라 굳게 약속했다.`},
  {w:`anne`, in:1, f:`anne_dreamy`, when:s => s.flags.castle,
   e:`탑도 은빛 분수도 없지만, 동쪽 다락방 창가에 앉아 있으면 여기가 내 성 같아.`,
   l:`탑도 은빛 분수도 없었지만, 동쪽 다락방 창가에 앉아 있노라면 이곳이 나만의 성처럼 느껴졌다.`},
  {w:`anne`, in:1, f:`anne_dreamy`, when:s => s.flags.cherry && !s.flags.castle,
   e:`기차역 벚나무 궁전에서 가져온 꽃잎은 이제 바싹 말라서, 내 책갈피가 되었어.`,
   l:`기차역 산벚나무 궁전에서 가져온 꽃잎은 어느새 바싹 말라 내 책갈피가 되어 있었다.`},
  /* ---------- 두 주 동안의 탐험 ---------- */
  {bg:`ch2_lane`, w:`anne`, in:1, f:`anne_happy`, bk:[`9-2`,`9-3`,`9-4`], cam:`out`,
   e:`그 뒤 두 주 동안, 나는 틈만 나면 탐험을 다녔어. 과수원 아래 오솔길, 시냇물 위 통나무 다리, 얼음처럼 차가운 샘물, 린네풀이 가득 핀 어둑한 숲까지!`,
   l:`그 뒤 두 주 동안 나는 깨어 있는 매 순간을 탐험에 바쳤다. 과수원 아래로 난 오솔길, 시냇물 위의 통나무 다리, 붉은 사암에 둘러싸인 얼음장 같은 샘, 그리고 수줍은 린네풀이 무수히 피어 있는 어스름한 전나무 숲까지.`},
  {w:`anne`, in:1, f:`anne_dreamy`,
   e:`저녁이 되면 언덕 너머 '{pond}' 쪽을 보며 잘 자라고 인사해. 언젠가 '{avenue}'도 다시 걸어 보고 싶어.`,
   l:`해 질 녘이면 언덕 너머 '{pond}' 쪽을 향해 잘 자라는 인사를 건넸다. 언젠가 '{avenue}'{avenue|을} 다시 걸어 볼 날을 꿈꾸면서.`},
  {w:`anne`, in:1, f:`anne_happy`, o:`matthew`, bk:[`9-5`],
   e:`내가 발견한 것들을 이야기하면 매슈 아저씨는 빙그레 웃으며 들어 주셨어. 마릴라 아주머니는 듣다가 재미있어질 것 같으면 꼭 "입 좀 다물어라!" 하셨지만 말이야.`,
   l:`내가 발견한 것들을 이야기하면 매슈 아저씨는 말없이 미소 지으며 귀 기울였다. 마릴라 아주머니는 듣다가 스스로 이야기에 빠져든다 싶으면 어김없이 "입 좀 다물어라"라는 짧은 명령으로 나를 잠재웠지만.`},
  /* ---------- 린드 부인의 방문 ---------- */
  {bg:`ch2`, w:`anne`, in:1, f:`anne_happy`, bk:[`9-6`,`9-13`], cam:``,
   e:`그날 저녁에도 나는 붉은 햇살이 비치는 과수원을 거닐고 있었어. 그런데 아주머니가 나를 부르셨어. 신나서 부엌으로 뛰어 들어갔더니, 처음 보는 아주머니가 앉아 계셨어.`,
   l:`그날 저녁에도 나는 붉은 저녁 햇살이 흩뿌려진 과수원 풀밭을 거닐고 있었다. 마릴라 아주머니가 부르는 소리에 신이 나서 부엌으로 뛰어 들어가자, 낯선 부인 한 분이 앉아 있었다.`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`lynde`, bk:[`9-1`,`9-14`], eff:{met:`lynde`},
   e:`이웃에 사는 레이첼 린드 부인이었어. 동네 일이라면 모르는 게 없다는 분. 바람에 헝클어진 내 빨간 머리가 그 어느 때보다 빨갛게 느껴졌어.`,
   l:`에이번리의 일이라면 모르는 것이 없다는 이웃 레이첼 린드 부인이었다. 모자도 쓰지 않은 채 바람에 헝클어진 내 머리는, 그 순간만큼 빨갛게 타오른 적이 없었다.`},
  {w:`lynde`, f:`anne_sad`, o:`lynde`, bk:[`9-15`], cam:`right`,
   e:`"세상에, 생김새 보고 고른 건 아닌 게 확실하구먼. 지독하게 말랐고 못생겼네, 마릴라. 이런 주근깨는 처음 보네! 머리는 또 홍당무처럼 빨갛고!"`,
   l:`"세상에, 생김새 보고 고른 건 아닌 게 확실하구먼. 지독하게 말랐고 못생겼네, 마릴라. 이리 와 봐라, 얘야. 맙소사, 세상에 이런 주근깨를 본 적이 있나? 머리는 또 홍당무처럼 빨갛고!"`},
  {t:`choice`, id:`C1`, kind:`predict`, label:`린드 부인의 말에`, f:`anne_angry`, o:`lynde`,
   q:{e:`린드 부인의 말에 앤의 얼굴이 새빨개졌어요. 원작의 앤은 어떻게 했을까요?`, l:`린드 부인의 말에 앤의 얼굴이 분노로 달아오릅니다. 원작의 앤은 어떻게 했을까요?`},
   note:{e:`원작의 앤은 발을 쾅쾅 구르며 "아주머니가 미워요!"라고 외치고, 린드 부인에게 "뚱뚱하고 상상력도 없는 분"이라고 되받아쳐요. 그 일로 린드 부인은 몹시 화가 나서 돌아가요.`,
         l:`원작에서 앤은 발을 구르며 "미워요"를 되풀이하고, 린드 부인에게 "뚱뚱하고 굼뜨고 상상력이라곤 한 톨도 없을 것"이라 되받아칩니다. 린드 부인은 기겁하여 돌아가지요.`},
   opts:[
    {type:`canon`, go:`k_c`, e:`발을 쾅쾅 구르며 "아주머니가 미워요!" 하고 소리친다.`, l:`발을 구르며 "아주머니가 미워요!" 하고 외친다.`, s:{e:`발을 구르며 "미워요!" 하고 외쳤다`, l:`발을 구르며 "미워요!"라고 외쳤다`}},
    {type:`imag`, go:`k_i`, e:`"홍당무라뇨! 제 머리는 노을과 단풍과 루비의 색이에요!" 하고 시를 읊듯 맞받아친다.`, l:`"홍당무라니요! 제 머리는 노을과 단풍과 루비를 녹인 빛이에요!" 하고 시를 읊듯 맞선다.`, s:{e:`노을빛 머리라고 시처럼 맞받아쳤다`, l:`노을빛 머리를 시처럼 노래하며 맞섰다`}},
    {type:`bal`, go:`k_b`, e:`주먹을 꼭 쥐고, 떨리는 목소리로 "그런 말씀은 너무 아파요." 하고 말한다.`, l:`주먹을 꼭 쥔 채 떨리는 목소리로 "그런 말씀은 너무 아파요." 하고 말한다.`, s:{e:`떨리는 목소리로 아프다고 말했다`, l:`아프다는 마음을 떨리는 목소리로 전했다`}}
   ]},
  {id:`k_c`, w:`anne`, f:`anne_angry`, o:`lynde`, bk:[`9-16`,`9-17`], cam:`shake`,
   e:`"아주머니가 미워요! 미워요, 미워요!" 나는 발을 쾅쾅 굴렀어. "어떻게 저더러 말라깽이에 못생겼다고 하실 수 있어요? 아주머니는 무례하고 인정머리 없는 분이에요!"`,
   l:`"아주머니가 미워요." 나는 목멘 소리로 외치며 발을 굴렀다. "미워요, 미워요, 미워요! 어떻게 저더러 말라깽이에 못생겼다고 하실 수 있어요? 아주머니는 무례하고 버릇없고 인정머리 없는 분이에요!"`},
  {w:`anne`, f:`anne_angry`, o:`lynde`, bk:[`9-19`,`9-20`,`9-21`], cam:`in`,
   e:`"누가 아주머니한테 뚱뚱하고 상상력도 하나 없다고 하면 좋으시겠어요? 저는 절대 용서 안 할 거예요. 절대, 절대로요!" 쿵! 쿵!`,
   l:`"아주머니더러 뚱뚱하고 굼뜨고 상상력이라곤 한 톨도 없을 거라고 하면 좋으시겠어요? 상처받으셨으면 좋겠어요! 저는 절대로 아주머니를 용서하지 않을 거예요. 절대로, 절대로요!" 쿵! 쿵!`},
  {t:`goto`, to:`k5`},
  {id:`k_i`, w:`anne`, f:`anne_angry`, o:`lynde`, fx:`dream`, cam:`left`, eff:{album:`sunsetHair`},
   e:`"홍당무라뇨! 제 머리는 저녁노을과 가을 단풍과 루비를 한데 모은 색이에요! 아주머니는 평생 상상도 못 하실 색이죠!"`,
   l:`"홍당무라니요! 제 머리는 저녁노을과 가을 단풍과 루비를 한데 녹여 놓은 빛이에요. 상상력 없는 분은 평생 그려 보지도 못할 빛이지요!"`},
  {w:`lynde`, f:`anne_angry`, o:`lynde`, cam:`right`,
   e:`"뭐, 뭐라고? 상상도 못 할 색? 어른한테 이게 무슨 말버릇이야!"`,
   l:`"뭐, 뭐라고? 상상력 없는 사람? 세상에, 어른한테 이게 무슨 말버릇이람!"`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`lynde`,
   e:`린드 부인의 얼굴이 홍당무보다 더 빨개졌어. 아차, 시처럼 말했어도 무례한 건 무례한 거였나 봐.`,
   l:`린드 부인의 얼굴이 홍당무보다 붉게 달아올랐다. 아무리 시처럼 꾸며도, 무례는 무례였던 것이다.`},
  {t:`goto`, to:`k5`},
  {id:`k_b`, w:`anne`, f:`anne_sad`, o:`lynde`, cam:`in`, eff:{album:`quietHurt`, flag:`quiet`},
   e:`나는 주먹을 꼭 쥐었어. "제 생김새는 제가 고른 게 아니에요. 그런 말씀은… 너무 아파요." 목소리가 덜덜 떨렸어.`,
   l:`나는 주먹을 꼭 쥐었다. "제 생김새는 제가 고른 것이 아니에요. 그런 말씀은… 너무 아파요." 목소리가 가늘게 떨렸다.`},
  {w:`lynde`, f:`anne_sad`, o:`lynde`, cam:`right`,
   e:`"어머나, 어른 말에 따박따박 말대꾸를 하네! 마릴라, 애 버릇을 단단히 잡아야겠어."`,
   l:`"어머나, 어른 말에 꼬박꼬박 말대꾸라니! 마릴라, 이 애 버릇은 단단히 잡아야겠구먼."`},
  {w:`anne`, in:1, f:`anne_sad`, cam:`shake`,
   e:`눈물이 터져 나올 것 같아서, 나는 그대로 부엌을 뛰쳐나가 계단을 뛰어 올라갔어.`,
   l:`눈물이 터져 나오려는 것을 참지 못하고, 나는 부엌을 뛰쳐나가 계단을 내달렸다.`},

  {id:`k5`, w:`lynde`, f:`anne_angry`, o:`lynde`, bk:[`9-22`], b:`"세상에 이런 성질머리를 본 적이 있나!"`},
  {w:`marilla`, f:`anne_angry`, o:`marilla_strict`, bk:[`9-18`,`9-23`],
   e:`"앤! 네 방에 올라가서 내가 갈 때까지 거기 있어라."`,
   l:`"앤!" 마릴라 아주머니가 간신히 말문을 되찾았다. "네 방에 올라가서 내가 갈 때까지 거기 있어라."`},
  {w:`anne`, in:1, f:`anne_sad`, bk:[`9-24`], cam:`shake`,
   e:`나는 울음을 터뜨리며 뛰쳐나가 문을 쾅 닫았어. 현관 벽에 걸린 양철 그릇들까지 덜그럭거렸어.`,
   l:`나는 울음을 터뜨리며 복도 문으로 달려가 문을 쾅 닫았다. 현관 벽의 양철 그릇들이 덩달아 덜그럭거렸다. 그리고 회오리바람처럼 계단을 뛰어 올라갔다.`},
  /* ---------- 동쪽 다락방 ---------- */
  {id:`k6`, bg:`ch2_room`, w:`anne`, in:1, f:`anne_sad`, bk:[`9-32`,`9-34`],
   e:`나는 침대에 엎드려 엉엉 울었어. 흙 묻은 신발이 깨끗한 침대보 위에 있는 것도 몰랐어. 아래층에서 린드 부인이 씩씩거리며 가 버리는 소리가 들렸어.`,
   l:`나는 침대에 얼굴을 묻고 서럽게 울었다. 흙 묻은 신발이 깨끗한 침대보를 더럽히는 것도 알지 못했다. 아래층에서 린드 부인이 씩씩거리며 떠나는 소리가 들려왔다.`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`, bk:[`9-37`,`9-39`], cam:`right`,
   e:`"앤, 당장 침대에서 내려와서 내 말 들어라. 이게 무슨 버릇이니! 부끄럽지도 않니?"`,
   l:`"앤, 당장 침대에서 내려와서 내 말 들어라. 이게 무슨 버릇이니, 앤! 부끄럽지도 않니?"`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`, when:s => s.flags.quiet,
   e:`"네 말이 다 틀렸다는 건 아니다. 하지만 어른께 말대꾸하고 손님 앞에서 뛰쳐나간 건 예의가 아니었어."`,
   l:`"네 말이 다 틀렸다는 건 아니다. 하지만 어른께 말대꾸를 하고 손님 앞에서 뛰쳐나간 건 예의가 아니었다."`},
  {t:`choice`, id:`C2`, kind:`talk`, label:`마릴라 아주머니에게`, f:`anne_sad`, o:`marilla_strict`,
   q:{e:`마릴라 아주머니가 화가 나셨어요. 앤은 뭐라고 말할까요?`, l:`굳은 얼굴의 마릴라 앞에서, 앤은 무슨 말을 할까요?`},
   note:{e:`원작의 앤은 "누가 면전에서 말라깽이에 못생겼다고 하면 어떠시겠어요?"라고 되물어요. 그 말에 마릴라는 어릴 적 이모들이 자기를 "까무잡잡하고 못생겼다"고 했던 기억을 떠올려요.`,
         l:`원작에서 앤은 "누가 면전에서 말라깽이에 못생겼다고 하면 어떤 기분이실지 상상해 보세요"라고 애원합니다. 그 순간 마릴라는 어린 시절 이모들에게 들은 "까무잡잡하고 못생겼다"는 말을 떠올리지요.`},
   opts:[
    {type:`canon`, go:`c2a`, eff:{heart:{marilla:1}}, e:`"아주머니도 누가 면전에서 말라깽이에 못생겼다고 하면 어떠실지 상상해 보세요."`, l:`"누가 아주머니 면전에서 말라깽이에 못생겼다고 하면 어떤 기분이실지 상상해 보세요."`, s:{e:`아주머니라면 어떠실지 상상해 보라고 했다`, l:`마릴라에게 입장을 바꿔 상상해 보길 청했다`}},
    {type:`imag`, go:`c2i`, eff:{heart:{marilla:1}}, e:`"아주머니, 사실 저는 마법에 걸렸던 거예요. 빨간 머리 마녀의 저주 때문에 화가 났다고요!"`, l:`"아주머니, 실은 제가 마법에 걸렸던 거예요. 빨간 머리 마녀의 저주가 저를 그렇게 만들었어요!"`, s:{e:`빨간 머리 마녀의 저주 탓이라고 했다`, l:`마녀의 저주 탓이라 둘러댔다`}},
    {type:`bal`, go:`c2b`, eff:{heart:{marilla:2}}, e:`"화낸 건 잘못했어요. 그래도 그 말이 얼마나 아팠는지는 알아주셨으면 좋겠어요."`, l:`"화를 낸 건 제 잘못이에요. 그래도 그 말이 얼마나 아팠는지는 알아주셨으면 해요."`, s:{e:`잘못은 인정하고 아팠던 마음을 말했다`, l:`잘못을 인정하며 아픈 마음을 전했다`}}
   ]},
  {id:`c2a`, w:`anne`, f:`anne_sad`, o:`marilla_strict`, bk:[`9-42`,`9-44`],
   e:`"내가 나한테 못생겼다고 하는 거랑, 남한테 그런 말을 듣는 건 완전히 달라요. 아주머니도 누가 면전에서 그러면 어떠실지 상상해 보세요."`,
   l:`"자기가 그렇게 말하는 거랑 남한테서 그런 말을 듣는 건 완전히 달라요. 누가 아주머니 면전에서 말라깽이에 못생겼다고 하면 어떤 기분이실지 상상해 보세요."`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`marilla_warm`, bk:[`9-45`],
   e:`그 순간 아주머니가 갑자기 먼 곳을 보는 눈빛이 되셨어. 무슨 생각을 하시는 걸까?`,
   l:`그 순간 아주머니의 눈빛이 아득히 먼 곳으로 향했다. 무엇을 떠올린 것일까.`},
  {t:`goto`, to:`c2m`},
  {id:`c2i`, w:`anne`, f:`anne_dreamy`, o:`marilla_strict`, fx:`dream`, eff:{album:`curse`},
   e:`"아주머니, 사실 저는 마법에 걸렸던 거예요. 빨간 머리 마녀의 저주 때문에 저도 모르게 화가 났다고요!"`,
   l:`"아주머니, 실은 제가 마법에 걸렸던 거예요. 빨간 머리 마녀의 저주가 제 혀를 불꽃으로 바꿔 놓았다고요!"`},
  {w:`marilla`, f:`anne_dreamy`, o:`marilla_strict`, fx:`dream`,
   e:`"그래? 그 마녀가 내일은 린드 부인께 사과하는 마법도 걸어 주면 좋겠구나."`,
   l:`"그래? 그렇다면 그 마녀가 내일은 린드 부인께 사과하는 마법도 걸어 주면 좋겠구나."`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`marilla_strict`,
   e:`아주머니 입꼬리가 아주 살짝 올라갔던 것 같은데… 내가 잘못 봤나?`,
   l:`아주머니의 입꼬리가 아주 잠깐 씰룩였던 것 같았다. 내가 잘못 본 것일까.`},
  {t:`goto`, to:`c2m`},
  {id:`c2b`, w:`anne`, f:`anne_sad`, o:`marilla_strict`, eff:{album:`honest`},
   e:`"화낸 건 잘못했어요. 그래도 그 말이 얼마나 아팠는지는 알아주셨으면 좋겠어요."`,
   l:`"화를 낸 건 제 잘못이에요. 그래도 그 말이 얼마나 아팠는지는 알아주셨으면 해요."`},
  {w:`marilla`, f:`anne_surprised`, o:`marilla_warm`, bk:[`9-45`],
   e:`"…그래. 그 마음은 안다. 남의 입에서 나온 그런 말은 오래오래 아프지."`,
   l:`"…그래. 그 마음은 안다. 남의 입에서 나온 그런 말은 오래도록 아프지."`},
  {id:`c2m`, w:`marilla`, f:`anne_sad`, o:`marilla_strict`, bk:[`9-46`], cam:``,
   e:`"린드 부인 말씀이 다 옳았다는 건 아니다. 하지만 그분은 어른이고, 내 손님이었어. 그분께 가서 성질부린 걸 사과하고 용서를 빌어라."`,
   l:`"린드 부인이 한 말이 꼭 옳았다고는 하지 않겠다. 하지만 그분은 낯선 사람이고, 어른이고, 내 손님이었어. 그분께 가서 성질부린 걸 죄송하다고 말씀드리고 용서를 빌어라."`},
  {w:`anne`, f:`anne_angry`, o:`marilla_strict`, bk:[`9-47`,`9-49`], cam:`left`,
   e:`"그건 절대 못 해요! 저를 뱀과 두꺼비가 우글거리는 지하 감옥에 가두셔도 좋아요. 하지만 죄송하지 않은데 죄송하다고 할 수는 없어요!"`,
   l:`"그건 절대 못 해요. 뱀과 두꺼비가 우글거리는 어둡고 축축한 지하 감옥에 가두고 빵과 물만 주셔도 불평하지 않을게요. 하지만 죄송하지 않은데 죄송하다고 할 수는 없잖아요?"`},
  {w:`marilla`, f:`anne_angry`, o:`marilla_strict`, bk:[`9-48`,`9-50`],
   e:`"우리 에이번리엔 지하 감옥이 별로 없단다. 사과할 마음이 생겼다고 말할 수 있을 때까지 이 방에 있거라."`,
   l:`"우리는 사람을 지하 감옥에 가두는 버릇이 없단다. 게다가 에이번리엔 그런 감옥이 좀처럼 없거든. 사과할 마음이 생겼다고 내게 말할 수 있을 때까지 이 방에 있거라."`},
  {w:`anne`, in:1, f:`anne_sad`, when:s => s.flags.castle,
   e:`동쪽 다락방이 내 성이라고 상상했었는데… 오늘은 진짜 감옥 같아.`,
   l:`동쪽 다락방이 나의 성이라 상상했건만, 오늘 밤 이곳은 영락없는 감옥이었다.`},
  {w:`anne`, in:1, f:`anne_sad`, when:s => s.flags.cherry && !s.flags.castle,
   e:`책갈피가 된 벚꽃잎을 꺼내 봤어. 그날 벚나무 궁전에서는 이렇게 외롭지 않았는데.`,
   l:`책갈피가 된 벚꽃잎을 꺼내 보았다. 그날 벚나무 궁전에서는 이토록 외롭지 않았는데.`},
  {w:`anne`, in:1, f:`anne_sad`, when:s => !s.flags.cherry && !s.flags.castle,
   e:`창밖으로 해가 지는 걸 보며 생각했어. 나는 정말 하나도 안 죄송해. …정말 그럴까?`,
   l:`창밖으로 저무는 해를 바라보며 생각했다. 나는 조금도 죄송하지 않다. …정말 그런가?`},
  /* ---------- 다음 날 ---------- */
  {w:`anne`, in:1, f:`anne_sad`, bk:[`10-1`,`10-5`,`10-6`], cam:`in`,
   e:`다음 날, 나는 아침도 점심도 저녁도 방에서 혼자 먹었어. 아니, 거의 못 먹었어. 아래층에서 매슈 아저씨와 마릴라 아주머니가 나 때문에 이야기하시는 소리가 웅얼웅얼 들렸어.`,
   l:`이튿날 아침, 점심, 저녁이 모두 쟁반에 담겨 올라왔다가, 거의 그대로 내려갔다. 아래층에서 나를 두고 매슈 아저씨와 마릴라 아주머니가 주고받는 낮은 목소리가 웅얼웅얼 올라왔다.`},

   note:{e:`원작의 앤은 창가의 노란 의자에 앉아 정원을 내다보며 "상상을 많이 하니까 시간이 좀 가요"라고 말해요. 하지만 무척 외로웠지요.`,
         l:`원작에서 앤은 창가의 노란 의자에 앉아 정원을 내다보며 시간을 보냅니다. "상상을 많이 하니 시간이 가지만, 꽤 외롭다"고 털어놓지요.`},
   opts:[

    {type:`imag`, go:`d_i`, eff:{item:`poem`, flag:`poem`}, e:`'홍당무 공주의 슬픈 노래'라는 시를 지어 공책에 적는다.`, l:`'홍당무 공주의 슬픈 노래'라는 시를 지어 공책에 적어 내려간다.`, s:{e:`'홍당무 공주의 노래'를 지었다`, l:`'홍당무 공주의 노래'를 지었다`}},

   l:`나는 창가의 노란 의자에 앉아 정원을 내다보았다. 상상을 많이 하니 시간이 조금은 흘러갔다. 물론, 꽤 외로웠지만.`},

  {id:`d_i`, w:`anne`, in:1, f:`anne_dreamy`, fx:`dream`, cam:`up`, eff:{album:`poem`},
   e:`나는 공책에 시를 썼어. "홍당무 공주는 탑에 갇혔네 / 노을빛 머리칼을 창밖에 늘어뜨리고…" 쓰다 보니 기분이 조금 나아졌어.`,
   l:`나는 공책에 시를 적어 내려갔다. "홍당무 공주는 탑에 갇혔네 / 노을빛 머리칼을 창밖에 늘어뜨리고 / 바람만이 그 슬픔을 아네…" 쓰다 보니 마음이 조금 가라앉았다.`},

  {id:`d_b`, w:`anne`, in:1, f:`anne_sad`, eff:{album:`note`},

   l:`나는 수프를 몇 숟가락 뜨고, 쪽지에 또박또박 적었다. "아주머니, 화를 내서 죄송해요. 다만 마음을 정리할 시간이 조금 필요해요. — 앤"`},
  {id:`d2`, w:`anne`, in:1, f:`anne_surprised`, o:`matthew`, bk:[`10-7`,`10-8`], cam:`in`,
   e:`해 질 무렵, 누군가 문을 똑똑 두드렸어. 살그머니 문이 열리더니… 매슈 아저씨였어! 아저씨는 위층에 거의 안 올라오신다던데!`,

  {id:`b1`, bg:`ch2`, w:`anne`, in:1, f:`anne_happy`, cam:`in`,
   e:`린드 부인께 사과한 뒤로, 초록 지붕 집에서의 하루하루는 정말 즐거웠어. 마릴라 아주머니는 나한테 새 드레스를 세 벌이나 지어 주셨어. 하지만… 셋 다 수수하고 소매가 쪼그라든 드레스였어. 나는 소매가 풍선처럼 볼록한 드레스를 꼭 입어 보고 싶었는데!`,
   l:`린드 부인께 사과한 뒤로 초록 지붕 집의 나날은 즐거웠다. 마릴라 아주머니는 내게 드레스를 세 벌이나 지어 주었다. 다만 셋 모두 수수하기 짝이 없었고, 소매는 볼품없이 좁았다. 나는 풍선처럼 부푼 소매가 달린 드레스를 얼마나 입고 싶었는지 모른다.`},
  {w:`anne`, in:1, f:`anne_dreamy`, when:s => s.items.includes(`auburn`),
   e:`그래도 린드 부인이 해 주신 말을 떠올리면 힘이 났어. 내 머리가 크면 멋진 적갈색이 될지도 모른대!`,
   l:`그래도 린드 부인이 건넨 희망의 한마디를 떠올리면 기운이 났다. 내 머리가 자라면서 멋진 적갈색이 될지도 모른다니!`},
  {w:`anne`, in:1, f:`anne_happy`, cam:`out`,
   e:`지난 일요일, 나는 처음으로 혼자 주일 학교에 갔어. 그런데 가는 길에 길가에 장미랑 노란 미나리아재비가 가득 피어 있는 거야. 너무 예뻐서 그냥 지나칠 수가 없었어.`,
   l:`지난 일요일, 나는 처음으로 혼자 주일 학교에 갔다. 그런데 가는 길 양옆에 들장미와 노란 미나리아재비가 흐드러지게 피어 있었다. 그토록 고운 것을 그냥 지나칠 수는 없었다.`},
  {t:`choice`, id:`C1`, kind:`act`, label:`교회 가는 길의 들꽃`, f:`anne_happy`,
   q:{e:`길가에 들꽃이 가득 피어 있어요. 앤은 어떻게 할까요?`, l:`길가에 흐드러진 들꽃. 앤은 이 꽃들을 어떻게 할까요?`},
   note:{e:`원작의 앤은 장미와 미나리아재비를 잔뜩 꺾어 모자에 빙 둘러 화관처럼 달았어요. 교회 사람들은 그 모습을 보고 수군거렸고, 그 소문은 린드 부인을 거쳐 마릴라 아주머니 귀에까지 들어가지요. (원작 11장)`,
         l:`원작에서 앤은 들장미와 미나리아재비를 한 아름 꺾어 모자에 둥글게 두릅니다. 교회 사람들은 수군거렸고, 그 소문은 린드 부인을 거쳐 마릴라에게 전해지지요. (원작 11장)`},
   opts:[
    {type:`canon`, go:`a_c`, eff:{item:`wreath`, flag:`wreath`}, e:`장미와 미나리아재비를 잔뜩 꺾어서, 모자에 빙 둘러 화관처럼 단다.`, l:`들장미와 미나리아재비를 한 아름 꺾어, 모자에 화관처럼 빙 둘러 단다.`, s:{e:`모자에 꽃을 빙 둘러 달았다`, l:`모자에 꽃 화관을 둘렀다`}},
    {type:`imag`, go:`a_i`, eff:{item:`wreath`, flag:`wreath`}, e:`꽃으로 모자를 꾸미고, 나는 '들꽃 나라의 여왕'이고 꽃 요정들이 뒤따라온다고 상상한다.`, l:`꽃으로 모자를 꾸미고, 들꽃 나라의 여왕이 되어 꽃 요정들의 행렬을 거느린다고 상상한다.`, s:{e:`들꽃 나라 여왕이 되어 행진했다`, l:`들꽃 나라의 여왕이 되었다`}},
    {type:`bal`, go:`a_b`, eff:{flag:`oneRose`}, e:`가장 예쁜 들장미 한 송이만 꺾어서 모자 리본에 살짝 꽂는다.`, l:`가장 고운 들장미 한 송이만 골라 모자 리본에 살며시 꽂는다.`, s:{e:`장미 한 송이만 살짝 꽂았다`, l:`장미 한 송이만 꽂았다`}}
   ]},
  {id:`a_c`, w:`anne`, in:1, f:`anne_happy`, eff:{album:`wreath`},
   e:`나는 꽃을 한 아름 꺾어서 모자에 빙 둘러 달았어. 분홍과 노랑이 어우러진 꽃 화관 모자! 교회에 들어갈 때 사람들이 나를 쳐다봤지만, 다들 예뻐서 그러는 줄 알았어.`,
   l:`나는 꽃을 한 아름 꺾어 모자에 빙 둘러 달았다. 분홍과 노랑이 어우러진 화관 모자였다. 교회에 들어서자 사람들의 시선이 쏠렸지만, 나는 그것이 감탄의 눈길이라고만 생각했다.`},
  {t:`goto`, to:`a_m`},
  {id:`a_i`, w:`anne`, in:1, f:`anne_dreamy`, fx:`dream`, cam:`up`, eff:{album:`flowerQueen`},
   e:`나는 꽃 모자를 쓰고 '들꽃 나라의 여왕'이 됐어. 뒤에서 꽃 요정들이 치맛자락을 들고 따라오고, 미나리아재비들이 고개 숙여 인사했지. 교회 문을 들어설 때까지 나는 진짜 여왕이었어!`,
   l:`꽃 모자를 쓴 나는 들꽃 나라의 여왕이었다. 꽃 요정들이 옷자락을 받쳐 들고 뒤따르고, 미나리아재비들이 일제히 고개를 숙였다. 교회 문턱을 넘을 때까지 나는 틀림없는 여왕이었다.`},
  {w:`anne`, in:1, f:`anne_surprised`,
   e:`그런데 교회 안에서 사람들이 나를 보고 수군거렸어. 여왕을 처음 봐서 그런 걸까?`,
   l:`그런데 교회 안의 사람들이 나를 보며 수군거렸다. 여왕을 처음 보아서 그런 것일까.`},
  {t:`goto`, to:`a_m`},
  {id:`a_b`, w:`anne`, in:1, f:`anne_happy`,
   e:`나는 제일 예쁜 들장미 한 송이만 골라서 모자 리본에 살짝 꽂았어. 아무도 눈치 못 챌 만큼 작지만, 나한테는 비밀 보석 같았어.`,
   l:`나는 가장 고운 들장미 한 송이만 골라 모자 리본에 살며시 꽂았다. 누구의 눈에도 띄지 않을 만큼 작았지만, 내게는 비밀스러운 보석이었다.`},
  /* ---------- 금요일, 마릴라의 꾸중 ---------- */
  {id:`a_m`, bg:`ch2`, w:`anne`, in:1, f:`anne_surprised`, o:`marilla_strict`, bk:[`12-1`], cam:``,
   e:`그리고 금요일. 린드 부인 댁에 다녀오신 마릴라 아주머니가 나를 부르셨어. 얼굴이 심상치 않았어.`,
   l:`그리고 금요일. 린드 부인 댁에서 돌아온 마릴라 아주머니가 나를 불러 세웠다. 표정이 심상치 않았다.`},
  {w:`marilla`, f:`anne_surprised`, o:`marilla_strict`, bk:[`12-2`], cam:`right`, when:s => s.flags.wreath,
   e:`"앤, 네가 지난 일요일에 장미랑 미나리아재비를 덕지덕지 단 모자를 쓰고 교회에 갔다면서? 대체 무슨 생각으로 그런 거니?"`,
   l:`"앤, 레이첼 부인 말이 네가 지난 일요일에 장미랑 미나리아재비를 덕지덕지 단 우스꽝스러운 모자를 쓰고 교회에 갔다더구나. 대체 무슨 생각으로 그런 장난을 친 거니? 볼 만한 꼴이었겠다!"`},
  {w:`marilla`, f:`anne_surprised`, o:`marilla_strict`, cam:`right`, when:s => s.flags.oneRose,
   e:`"앤, 레이첼 부인 말이 네 모자에 장미가 꽂혀 있더라는구나. 한 송이라 다행이지, 다른 애들처럼 잔뜩 달았으면 큰일 날 뻔했다. 교회에 갈 땐 단정하게 하고 가거라."`,
   l:`"앤, 레이첼 부인 말이 네 모자에 장미가 한 송이 꽂혀 있더라는구나. 한 송이였으니 망정이지, 잔뜩 달고 갔으면 온 동네 이야깃거리가 됐을 거다. 교회에 갈 땐 단정하게 하고 가거라."`},
  {w:`anne`, f:`anne_sad`, o:`marilla_strict`, bk:[`12-3`,`12-5`], when:s => s.flags.wreath,
   e:`"분홍이랑 노랑이 저한테 안 어울리는 건 알아요. 그런데 드레스에 꽃을 다는 거랑 모자에 다는 거랑 뭐가 달라요? 다른 애들은 드레스에 꽃다발을 꽂고 왔는걸요."`,
   l:`"분홍이랑 노랑이 제게 어울리지 않는다는 건 알아요. 하지만 드레스에 꽃을 다는 것과 모자에 다는 것이 무엇이 다른지 모르겠어요. 다른 여자애들은 드레스에 꽃다발을 꽂고 왔는걸요."`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`, bk:[`12-6`,`12-7`], when:s => s.flags.wreath,
   e:`"말대꾸하지 마라. 레이첼 부인이 그 꼴을 보고 바닥으로 꺼지고 싶었단다. 사람들은 내가 너를 그렇게 내보낼 만큼 생각이 없다고 여기겠지!"`,
   l:`"그렇게 말대꾸하지 마라. 레이첼 부인은 네가 들어오는 걸 보고 바닥으로 꺼져 버리고 싶었단다. 사람들은 내가 너를 그런 꼴로 내보낼 만큼 생각이 없는 사람이라고 여기겠지."`},
  {t:`choice`, id:`C2`, kind:`talk`, label:`마릴라 아주머니의 꾸중`, f:`anne_sad`, o:`marilla_strict`,
   q:{e:`마릴라 아주머니가 화가 나셨어요. 앤은 뭐라고 말할까요?`, l:`꾸중하는 마릴라 앞에서, 앤은 무슨 말을 할까요?`},
   note:{e:`원작의 앤은 눈물을 글썽이며 "저는 아주머니께 골칫거리일 뿐이에요. 차라리 고아원에 돌려보내시는 게 나을지도 몰라요"라고 말해요. 마릴라는 아이를 울린 자기 자신에게 짜증이 났대요.`,
         l:`원작에서 앤은 눈물을 글썽이며 "차라리 고아원으로 돌려보내시는 게 나을지도 모른다"고 말합니다. 마릴라는 아이를 울린 자신에게 화가 나서 "말도 안 되는 소리"라며 서둘러 화제를 돌리지요.`},
   opts:[
    {type:`canon`, go:`m_c`, eff:{heart:{marilla:1}}, e:`"죄송해요… 저는 아주머니께 골칫거리인가 봐요. 차라리 고아원에 돌려보내시는 게 나을지도 몰라요."`, l:`"죄송해요… 저는 아주머니께 지독한 골칫거리인가 봐요. 차라리 고아원으로 돌려보내시는 편이 나을지도 몰라요."`, s:{e:`고아원에 돌려보내시라며 울었다`, l:`고아원 이야기를 꺼내며 울먹였다`}},
    {type:`imag`, go:`m_i`, eff:{heart:{marilla:1}}, e:`"그 꽃들이 저를 따라 교회에 가고 싶다고 했어요. 꽃들의 부탁을 거절하는 건 너무 무례하잖아요?"`, l:`"그 꽃들이 저와 함께 교회에 가고 싶다고 속삭였어요. 꽃들의 청을 거절하는 건 너무 무례한 일이잖아요?"`, s:{e:`꽃들이 따라오고 싶어 했다고 했다`, l:`꽃들의 청이었다고 둘러댔다`}},
    {type:`bal`, go:`m_b`, eff:{heart:{marilla:2}}, e:`"그게 왜 잘못인지 몰랐어요. 이제 알았으니까, 다음엔 꾸미기 전에 아주머니께 먼저 여쭤볼게요."`, l:`"그게 왜 잘못인지 미처 몰랐어요. 이제 알았으니, 다음엔 꾸미기 전에 아주머니께 먼저 여쭤볼게요."`, s:{e:`다음엔 먼저 여쭤보겠다고 했다`, l:`다음엔 먼저 묻겠노라 약속했다`}}
   ]},
  {id:`m_c`, w:`anne`, f:`anne_sad`, o:`marilla_strict`, bk:[`12-8`],
   e:`"정말 죄송해요. 아주머니가 싫어하실 줄 몰랐어요. 저는 아주머니께 골칫거리인가 봐요. 차라리 고아원에 돌려보내시는 게… 그건 너무 끔찍하겠지만요. 아마 폐병에 걸려 버릴 거예요. 보세요, 저 이렇게 말랐잖아요."`,
   l:`"아, 정말 죄송해요. 아주머니가 싫어하실 줄은 생각도 못 했어요. 저는 아주머니께 지독한 골칫거리가 될까 봐 겁나요. 차라리 고아원으로 돌려보내시는 게 나을지도 몰라요. 그건 끔찍할 거예요. 아마 폐병에 걸리고 말겠지요. 보시다시피 전 이렇게 말랐으니까요. 그래도 아주머니께 골칫거리가 되는 것보다는 나을 거예요."`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_warm`, bk:[`12-9`],
   e:`"말도 안 되는 소리! 너를 돌려보낼 생각은 조금도 없다. 다른 아이들처럼 얌전히 굴었으면 하는 것뿐이야. 자, 그만 울어라."`,
   l:`"말도 안 되는 소리." 아주머니는 나를 울린 자신에게 짜증이 난 얼굴이었다. "널 고아원에 돌려보낼 생각은 조금도 없다. 그저 다른 아이들처럼 얌전히 굴고 웃음거리가 되지 않았으면 하는 것뿐이야. 이제 그만 울어라."`},
  {t:`goto`, to:`m_m`},
  {id:`m_i`, w:`anne`, f:`anne_dreamy`, o:`marilla_strict`, fx:`dream`, cam:`up`,
   e:`"아주머니, 그 꽃들이 저한테 속삭였어요. '우리도 교회에 가 보고 싶어!' 꽃들의 부탁을 거절하는 건 너무 무례하잖아요?"`,
   l:`"아주머니, 그 꽃들이 제게 속삭였어요. '우리도 교회에 가 보고 싶어!' 꽃들의 간청을 뿌리치는 건 너무 무례한 일이잖아요?"`},
  {w:`marilla`, f:`anne_dreamy`, o:`marilla_strict`,
   e:`"꽃이 교회에 가고 싶으면, 다음 주에 꽃병에 꽂아서 제단에 갖다 놓으마. 네 모자 말고."`,
   l:`"꽃이 그렇게 교회에 가고 싶다면, 다음 주에 꽃병에 꽂아 제단에 올려 주마. 네 모자 위가 아니라."`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`marilla_strict`,
   e:`아주머니는 화난 얼굴이었지만, 이상하게 목소리는 조금 부드러워져 있었어.`,
   l:`아주머니의 얼굴은 여전히 굳어 있었지만, 이상하게도 목소리는 한결 누그러져 있었다.`},
  {t:`goto`, to:`m_m`},
  {id:`m_b`, w:`anne`, f:`anne_sad`, o:`marilla_strict`, eff:{album:`askFirst`},
   e:`"그게 왜 잘못인지 몰랐어요. 꽃이 너무 예뻐서 그랬어요. 이제 알았으니까, 다음엔 꾸미기 전에 아주머니께 먼저 여쭤볼게요."`,
   l:`"그게 왜 잘못인지 미처 몰랐어요. 꽃이 너무 고와서 그랬을 뿐이에요. 이제 알았으니, 다음엔 꾸미기 전에 아주머니께 먼저 여쭤볼게요."`},
  {w:`marilla`, f:`anne_happy`, o:`marilla_warm`,
   e:`"…그래, 그거면 됐다. 너도 이제 조금씩 배우는구나."`,
   l:`"…그래, 그러면 됐다. 너도 이제 조금씩 배워 가는구나."`},
  {id:`m_m`, w:`marilla`, f:`anne_surprised`, o:`marilla_warm`, bk:[`12-9`], cam:`in`,
   e:`"그건 그렇고, 너한테 들려줄 소식이 있다. 다이애나 배리가 오늘 집에 돌아왔단다. 배리 부인한테 치마 본을 빌리러 갈 건데, 같이 가서 다이애나랑 인사하겠니?"`,
   l:`"그건 그렇고, 너한테 들려줄 소식이 있다. 다이애나 배리가 오늘 오후에 집에 돌아왔다더구나. 배리 부인한테 치마 본을 빌리러 갈 건데, 원한다면 같이 가서 다이애나와 인사를 나눠도 좋다."`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`marilla_warm`, bk:[`12-10`], cam:`shake`,
   e:`다이애나! 내가 처음 초록 지붕 집에 왔을 때부터 꼭 친구가 되고 싶었던 그 아이! 나는 벌떡 일어났어. 손에 들고 있던 행주가 바닥에 툭 떨어졌어.`,
   l:`다이애나! 초록 지붕 집에 온 날부터 마음의 친구가 되기를 꿈꾸던 바로 그 아이! 나는 두 손을 맞잡고 벌떡 일어섰다. 꿰매던 행주가 바닥으로 스르르 미끄러졌다.`},
  {w:`anne`, f:`anne_surprised`, o:`marilla_warm`, bk:[`12-11`],
   e:`"아, 아주머니, 무서워요. 막상 그때가 오니까 정말 무서워요. 다이애나가 저를 안 좋아하면 어떡하죠? 그건 제 인생 최고로 비극적인 실망일 거예요!"`,
   l:`"아, 마릴라 아주머니, 무서워요. 막상 그때가 오니 정말로 무서워요. 다이애나가 절 좋아하지 않으면 어떡하죠! 그건 제 인생에서 가장 비극적인 실망이 될 거예요."`},
  {w:`marilla`, f:`anne_surprised`, o:`marilla_strict`, bk:[`12-12`],
   e:`"호들갑 떨지 마라. 그리고 제발 그렇게 어려운 말 좀 쓰지 마. 다이애나는 널 좋아할 거다. 걱정할 사람은 그 애 어머니야. 얌전하게 굴고, 사람 놀라게 하는 말은 하지 말거라."`,
   l:`"자, 호들갑 떨지 마라. 그리고 제발 그런 긴 낱말 좀 쓰지 말았으면 좋겠구나. 다이애나는 널 충분히 좋아할 거다. 신경 써야 할 사람은 그 애 어머니야. 그 부인이 널 싫어하면 다이애나가 아무리 좋아해도 소용없어. 예의 바르고 얌전하게 굴어야 한다. 사람 놀라게 하는 말은 하지 말고."`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`, when:s => s.flags.quiet,
   e:`"린드 부인 앞에서 네가 떨면서도 할 말은 다 했다는 이야기가 벌써 동네에 돌았을지 모른다. 오늘은 말을 아끼거라."`,
   l:`"린드 부인 앞에서 네가 떨면서도 할 말은 다 했다는 이야기가 벌써 동네에 퍼졌을지도 모른다. 오늘만큼은 말을 아끼거라."`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`, when:s => !s.flags.quiet,
   e:`"네가 린드 부인한테 소리친 일을 배리 부인이 들었다면… 뭐라고 생각할지 모르겠구나. 아이고, 얘가 정말 떨고 있네!"`,
   l:`"네가 린드 부인한테 성질부린 일을 배리 부인이 들었다면 너를 어떻게 생각할지 모르겠구나. 아이고, 이 애가 정말로 떨고 있잖아!"`},
  /* ---------- 지름길 ---------- */
  {bg:`ch3_path`, w:`anne`, in:1, f:`anne_sad`, o:`marilla_strict`, bk:[`12-13`,`12-14`,`12-15`], cam:`out`,
   e:`우리는 시냇물을 건너고 전나무 언덕을 올라가는 지름길로 갔어. 나는 얼굴이 하얗게 질려서 덜덜 떨었어. 아주머니도 마음의 친구가 될지 모르는 아이를 만나러 가는 거라면 떨리실 거야!`,
   l:`우리는 시냇물을 건너 전나무 숲 언덕을 오르는 지름길로 과수원 비탈 집을 향했다. 내 얼굴은 하얗게 질려 굳어 있었다. 마음의 친구가 되었으면 하는 아이를 만나러 가는데, 그 어머니가 나를 싫어할지도 모른다면 누구라도 떨리지 않겠는가.`},
  {w:`anne`, in:1, f:`anne_dreamy`, o:`marilla_strict`, when:s => s.flags.castle,
   e:`내 다락방 성에 손님을 초대하는 상상을 해 봤어. 첫 번째 손님은… 다이애나였으면 좋겠어.`,
   l:`나는 다락방 성에 손님을 초대하는 장면을 그려 보았다. 첫 손님이 다이애나라면 얼마나 좋을까.`},
  {w:`anne`, in:1, f:`anne_dreamy`, o:`marilla_strict`, when:s => !s.flags.castle,
   e:`'{pond}'에서 처음 다이애나 이야기를 들었을 때부터, 나는 이 순간만 기다렸어.`,
   l:`'{pond}' 근처에서 처음 다이애나의 이름을 들은 그날부터, 나는 이 순간만을 기다려 왔다.`},
  {t:`choice`, id:`C3`, kind:`predict`, label:`배리 부인께 첫인사`, f:`anne_surprised`, o:`marilla_strict`,
   q:{e:`드디어 배리 부인을 만나요. 원작의 앤은 첫인사를 어떻게 했을까요?`, l:`엄격하기로 이름난 배리 부인 앞. 원작의 앤은 어떻게 인사했을까요?`},
   note:{e:`원작의 앤은 숨을 몰아쉬며 "끝에 e가 붙는 앤이에요!"라고 말해요. 이름 철자만큼은 꼭 제대로 알려 주고 싶었거든요. 그러고는 "몸은 건강하지만 마음은 꽤 구겨졌어요"라고 진지하게 대답했지요.`,
         l:`원작에서 앤은 떨리는 와중에도 "끝에 e가 붙는 앤"이라고 철자부터 바로잡습니다. 이어 "몸은 건강하나 마음은 꽤 구겨져 있다"고 정중히 답한 뒤, 이 정도는 놀랄 만한 말이 아니었냐고 마릴라에게 속삭이지요.`},
   opts:[
    {type:`canon`, go:`p_c`, eff:{heart:{barry:1}}, e:`"끝에 e가 붙는 앤이에요!" 이름 철자부터 알려 드린다.`, l:`"끝에 e가 붙는 앤이에요!" 철자부터 또박또박 알려 드린다.`, s:{e:`"e가 붙는 앤"이라고 인사했다`, l:`철자부터 바로잡으며 인사했다`}},
    {type:`imag`, go:`p_i`, eff:{heart:{barry:0}}, e:`"코델리아… 아니, 앤입니다." 상상 속 이름이 먼저 튀어나온다.`, l:`"코델리아… 아니, 앤입니다." 상상 속의 이름이 먼저 입 밖으로 튀어나온다.`, s:{e:`코델리아라고 할 뻔했다`, l:`상상 속 이름이 먼저 튀어나왔다`}},
    {type:`bal`, go:`p_b`, eff:{heart:{barry:2}}, e:`"처음 뵙겠습니다. 앤 셜리예요." 마릴라 아주머니 말씀대로 짧고 공손하게 인사한다.`, l:`"처음 뵙겠습니다, 앤 셜리입니다." 마릴라의 당부대로 짧고 공손하게 인사한다.`, s:{e:`짧고 공손하게 인사했다`, l:`당부대로 공손히 인사했다`}}
   ]},
  {id:`p_c`, bg:`ch3`, w:`barry`, f:`anne_surprised`, o:`barry`, bk:[`12-15`,`12-16`,`12-17`], cam:`right`, eff:{met:`barry`},
   e:`문을 열어 주신 배리 부인은 키가 크고, 눈과 머리가 까맣고, 입매가 아주 단호해 보이는 분이었어. "어서 와요, 마릴라. 이 아이가 그 여자아이군요?" "네, 앤 셜리예요."`,
   l:`부엌문으로 나온 배리 부인은 키가 크고 눈과 머리카락이 까맸으며, 입매가 무척 단호했다. 아이들에게 엄하기로 소문난 분이었다. "어서 들어와요, 마릴라. 이 아이가 데려다 키운다는 그 여자아이인가 보군요?" "네, 앤 셜리예요."`},
  {w:`anne`, f:`anne_surprised`, o:`barry`, bk:[`12-18`], cam:`in`, eff:{album:`withE`},
   e:`"끝에 e가 붙는 앤이에요!" 나는 숨을 몰아쉬며 말했어. 떨려도 이것만큼은 꼭 제대로 알려 드려야 했거든.`,
   l:`"끝에 e가 붙는 앤이에요." 나는 숨을 몰아쉬며 말했다. 아무리 떨려도 그 중요한 점만큼은 오해가 없어야 했다.`},
  {w:`barry`, f:`anne_surprised`, o:`barry`, bk:[`12-19`,`12-20`],
   e:`부인은 못 들으셨는지 그냥 악수를 하시며 말씀하셨어. "잘 지내니?"`,
   l:`부인은 듣지 못했는지 알아듣지 못했는지, 그저 손을 내밀며 다정하게 말했다. "잘 지내니?"`},
  {w:`anne`, f:`anne_happy`, o:`barry`, bk:[`12-21`],
   e:`"몸은 건강하지만 마음은 꽤 구겨져 있어요. 고맙습니다, 부인." 그러고는 아주머니께 소곤소곤 물었어. "방금 그건 놀랄 만한 말 아니었죠?"`,
   l:`"몸은 건강하지만 마음은 꽤 구겨져 있어요. 고맙습니다, 부인." 나는 진지하게 답한 뒤, 다 들리게 마릴라 아주머니께 속삭였다. "방금 그 말은 놀랄 만한 말 아니었죠, 아주머니?"`},
  {t:`goto`, to:`p_m`},
  {id:`p_i`, bg:`ch3`, w:`barry`, f:`anne_surprised`, o:`barry`, bk:[`12-15`,`12-16`], cam:`right`, eff:{met:`barry`},
   e:`문을 열어 주신 배리 부인은 키가 크고, 눈과 머리가 까맣고, 입매가 아주 단호해 보이는 분이었어. "어서 와요, 마릴라. 이 아이가 그 여자아이군요? 이름이 뭐니?"`,
   l:`부엌문으로 나온 배리 부인은 키가 크고 눈과 머리카락이 까맸으며, 입매가 무척 단호했다. "어서 들어와요, 마릴라. 이 아이가 그 여자아이인가 보군요. 얘야, 이름이 뭐니?"`},
  {w:`anne`, f:`anne_dreamy`, o:`barry`, fx:`dream`, cam:`up`, eff:{album:`cordelia`},
   e:`"코델리아… 아, 아니, 앤입니다! 끝에 e가 붙는 앤이요!" 너무 떨려서 상상 속 이름이 먼저 튀어나와 버렸어.`,
   l:`"코델리아… 아, 아니, 앤입니다! 끝에 e가 붙는 앤이요!" 너무 떨린 나머지, 상상 속의 이름이 먼저 혀끝에서 굴러 나왔다.`},
  {w:`barry`, f:`anne_surprised`, o:`barry`,
   e:`부인은 눈썹을 살짝 올리셨어. "코델… 뭐라고? 마릴라, 이 애 이름이 둘이에요?"`,
   l:`부인의 한쪽 눈썹이 살짝 올라갔다. "코델… 뭐라고요? 마릴라, 이 애는 이름이 둘인가요?"`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`,
   e:`"앤 하나면 충분해요." 아주머니가 나를 흘깃 보셨어. 아, 시작부터 망친 걸까?`,
   l:`"앤 하나면 충분합니다." 아주머니가 나를 흘깃 쏘아보았다. 아, 시작부터 망쳐 버린 걸까.`},
  {t:`goto`, to:`p_m`},
  {id:`p_b`, bg:`ch3`, w:`barry`, f:`anne_surprised`, o:`barry`, bk:[`12-15`,`12-16`], cam:`right`, eff:{met:`barry`},
   e:`문을 열어 주신 배리 부인은 키가 크고, 눈과 머리가 까맣고, 입매가 아주 단호해 보이는 분이었어. "어서 와요, 마릴라. 이 아이가 그 여자아이군요?"`,
   l:`부엌문으로 나온 배리 부인은 키가 크고 눈과 머리카락이 까맸으며, 입매가 무척 단호했다. "어서 들어와요, 마릴라. 이 아이가 데려다 키운다는 그 여자아이인가 보군요?"`},
  {w:`anne`, f:`anne_happy`, o:`barry`, cam:`in`,
   e:`나는 꾸벅 고개를 숙였어. "처음 뵙겠습니다. 앤 셜리예요." 하고 싶은 말이 목까지 차올랐지만, 꾹 참았어.`,
   l:`나는 공손히 고개를 숙였다. "처음 뵙겠습니다, 앤 셜리입니다." 하고 싶은 말이 목까지 차올랐지만 꾹 삼켰다.`},
  {w:`barry`, f:`anne_happy`, o:`barry`,
   e:`"어머, 예의 바른 아이네요." 부인의 단호한 입매가 조금 풀어지셨어. 마릴라 아주머니가 살짝 고개를 끄덕여 주셨어.`,
   l:`"어머, 예의 바른 아이로군요." 부인의 단호한 입매가 조금 풀어졌다. 마릴라 아주머니가 아주 살짝 고개를 끄덕였다.`},
  {id:`p_m`, w:`anne`, in:1, f:`anne_surprised`, o:`diana`, bk:[`12-22`], cam:`left`, eff:{met:`diana`},
   e:`그때 소파에서 책을 읽던 여자아이가 책을 내려놓고 일어났어. 까만 눈, 까만 머리, 장밋빛 뺨에 아주 명랑한 얼굴. 다이애나였어!`,
   l:`그때 소파에 앉아 책을 읽던 아이가 책을 내려놓았다. 어머니를 닮은 까만 눈과 까만 머리카락, 장밋빛 뺨, 그리고 아버지에게서 물려받은 명랑한 표정. 다이애나였다.`},
  {w:`barry`, f:`anne_happy`, o:`barry`, bk:[`12-23`],
   e:`"우리 딸 다이애나예요. 다이애나, 앤을 데리고 정원에 나가서 꽃 좀 보여 주렴. 책만 읽어서 눈 버리지 말고." 그러고는 아주머니께 말씀하셨어. "이 애는 책을 너무 많이 읽어요."`,
   l:`"우리 딸 다이애나예요. 다이애나, 앤을 데리고 정원에 나가서 네 꽃들을 보여 주렴. 그 책에 눈을 혹사하는 것보다 그게 낫겠다." 그리고 우리가 나가자 마릴라 아주머니께 덧붙였다. "이 애는 책을 너무 많이 읽어요. 애 아빠가 부추기니 말릴 수가 없답니다."`},
  {w:`anne`, in:1, f:`anne_happy`, o:`diana`,
   e:`책을 너무 많이 읽는다고? 그건 세상에서 제일 멋진 단점인걸!`,
   l:`책을 너무 많이 읽는다니. 그것이야말로 세상에서 가장 근사한 흠이 아닌가.`},
  /* ---------- 배리 씨네 정원 ---------- */
  {bg:`ch3_garden`, w:`anne`, in:1, f:`anne_surprised`, o:`diana`, bk:[`12-24`,`12-25`], cam:`out`,

   l:`"아, 네." 나는 행복에 겨워 한숨처럼 대답했다. 아주머니의 말에 섞인 비꼬는 기색 따위는 알아차리지도 못했다. "마릴라 아주머니, 저는 지금 이 순간 프린스 에드워드 섬에서 제일 행복한 아이예요. 다이애나랑 내일 '{together}' 하기로 했어요. 다이애나가 책도 빌려주고, '개암나무 골짜기의 넬리'라는 노래도 가르쳐 주고, 연한 파란 비단 드레스를 입은 아가씨 그림도 준대요!"`},
  {w:`anne`, f:`anne_dreamy`, o:`marilla_strict`, bk:[`12-41`],

   l:`"다이애나 생일은 2월이고 제 생일은 3월이에요. 정말 신기한 우연 같지 않아요? 통나무 다리 아래 샘은 '{spring}'{spring|이라고} 부르기로 했어요. 정말 우아한 이름이지 않아요? 아, 저도 다이애나에게 뭔가 줄 것이 있으면 좋을 텐데요."`},
  {w:`marilla`, f:`anne_happy`, o:`marilla_strict`, bk:[`12-42`],

  {bg:`ch2`, w:`anne`, in:1, f:`anne_surprised`, o:`matthew`, bk:[`12-43`,`12-44`], cam:`in`,

  {w:`marilla`, f:`anne_surprised`, o:`marilla_strict`, bk:[`12-45`],

        `필립스 선생님의 벌은 공정했을까요? 내가 선생님이라면 이 일을 어떻게 해결했을지 이야기해 봐요.`,
        `길버트의 사과를 받아 주지 않은 앤의 마음을 이해할 수 있나요? 사과를 받아 주는 데 시간이 필요한 적이 있었나요?`],

  nodes: [
  /* ---------- 지난 이야기 ---------- */
  {id:`b1`, bg:`ch4_birch`, w:`anne`, in:1, f:`anne_happy`, cam:`out`,
   e:`다이애나와 맹세한 뒤로 여름이 금방 지나갔어. 주일 학교 소풍에서 처음으로 아이스크림도 먹었어! 그 전에 마릴라 아주머니의 자수정 브로치를 둘러싸고 큰 오해가 생겨서 소풍을 못 갈 뻔했지만… 다행히 오해는 풀렸어.`,
   l:`다이애나와 맹세를 나눈 뒤 여름은 쏜살같이 흘러갔다. 주일 학교 소풍에서 나는 난생처음 아이스크림이라는 것을 맛보았다. 그 직전, 마릴라 아주머니의 자수정 브로치를 둘러싼 커다란 오해 때문에 소풍을 놓칠 뻔했지만, 다행히 진실은 밝혀졌다.`},
  {w:`anne`, in:1, f:`anne_happy`, bk:[`15-10`,`15-11`],
   e:`그리고 9월, 나는 드디어 에이번리 학교에 다니게 됐어! 아주머니는 내가 수업 시간에 입을 다물고 있을 수 있을지 걱정하셨지만, 학교생활은 생각보다 훨씬 즐거웠어.`,
   l:`그리고 9월, 마침내 에이번리 학교에 다니게 되었다. 아주머니는 내가 수업 시간 내내 입을 다물고 있을 수 있을지 남몰래 걱정했지만, 학교생활은 생각보다 훨씬 즐거웠다.`},
  {w:`anne`, in:1, f:`anne_dreamy`, bk:[`15-14`,`15-15`],
   e:`누가 내 코가 아주 예쁘다고 했대! 태어나서 처음 들은 칭찬이었어. 아주머니께 정말이냐고 여쭤봤더니 "그만하면 됐다." 하고 짧게 대답하셨어. 그래도 웃음을 참으시는 것 같았어.`,
   l:`누군가 내 코가 아주 예쁘다고 했단다. 태어나 처음 들어 보는 칭찬이었다. 아주머니께 정말이냐고 여쭈었더니 "코는 그만하면 됐다"는 짧은 대답이 돌아왔다. 하지만 어쩐지 웃음을 참는 얼굴이었다.`},
  {w:`anne`, f:`anne_happy`, o:`diana`, bk:[`15-1`,`15-2`], cam:`in`,
   e:`"정말 근사한 날이야! 이런 날엔 그냥 살아 있기만 해도 좋지 않니? 아직 태어나지 않은 사람들이 오늘을 놓치는 게 불쌍할 정도야!"`,
   l:`"정말 근사한 날이야!" 나는 숨을 길게 들이쉬었다. "이런 날 그냥 살아 있기만 해도 좋지 않니? 아직 태어나지 않은 사람들이 이날을 놓치는 게 불쌍할 정도야. 그 사람들에게도 좋은 날이 오겠지만, 바로 오늘은 절대 가질 수 없잖아."`},
  {w:`diana`, f:`anne_happy`, o:`diana`, bk:[`15-2`,`15-3`],
   e:`"큰길보다 이 길이 훨씬 좋지. 거긴 덥고 먼지투성이거든." 다이애나는 점심 바구니 속 산딸기 파이 세 개를 여자애 열 명이 나누면 몇 입씩일지 세어 보고 있었어.`,
   l:`"큰길로 돌아가는 것보다 훨씬 낫지. 거긴 먼지투성이에 덥거든." 다이애나는 현실적으로 대꾸하며, 바구니 속 산딸기 파이 세 개를 여자애 열 명이 나누면 몇 입씩 돌아갈지 속으로 셈하고 있었다.`},
  {w:`anne`, in:1, f:`anne_dreamy`, o:`diana`, bk:[`15-4`,`15-5`,`15-7`,`15-8`],
   e:`우리가 학교에 가는 길은 정말 아름다워. 연인의 오솔길을 지나, '{spring}'에서 다이애나를 만나고, 버드나무 연못을 지나면, 앤드루 벨 아저씨네 숲 그늘에 폭 파인 작은 초록 골짜기가 나와. 봄이면 제비꽃이 수백만 송이 핀대!`,
   l:`우리가 학교에 가는 길은 상상력으로도 더 낫게 만들 수 없을 만큼 아름다웠다. 연인의 오솔길을 내려가 '{spring}' 근처에서 다이애나를 만나고, 버드나무 연못을 지나면, 앤드루 벨 씨네 숲 그늘에 초록 보조개처럼 폭 파인 골짜기가 나타났다. 봄이면 제비꽃이 수백만 송이 핀다고 했다.`},
  {t:`name`, id:`N5`, key:`vale`, canon:`제비꽃 골짜기`, max:14, label:`숲 그늘의 작은 골짜기`, f:`anne_dreamy`, o:`diana`,
   q:{e:`✍️ 봄이면 제비꽃이 가득 피는 작은 초록 골짜기. 앤이 되어 이름을 지어 주세요!`, l:`✍️ 숲 그늘에 폭 파인 작은 초록 골짜기. 앤처럼 이름을 붙여 주세요.`},
   ph:`예: 보랏빛 요람`,
   note:{e:`원작의 앤은 이곳을 '제비꽃 골짜기'라고 이름 지어요. 다이애나는 장소에 멋진 이름 붙이는 데는 앤을 따라올 사람이 없다고 감탄하지요. 대신 '자작나무 길'은 다이애나가 지었대요.`,
         l:`원작에서 앤은 이곳을 '제비꽃 골짜기(Violet Vale)'라 부릅니다. 다이애나는 이름 짓기에서 앤을 당할 사람이 없다고 감탄하지요. 반면 '자작나무 길'은 다이애나의 작품인데, 앤은 속으로 더 시적인 이름을 찾을 수 있었을 거라 생각합니다.`}},
  {w:`diana`, f:`anne_happy`, o:`diana`,
   e:`"'{vale}'! 역시 이름 짓는 데는 너를 따라올 사람이 없어. 그 대신 이 자작나무 길은 내가 지은 거 잊지 마!"`,
   l:`"'{vale}'! 역시 장소에 이름 붙이는 데는 너를 당할 사람이 없어. 대신 이 자작나무 길은 내가 지은 거 잊지 마."`},
  {w:`anne`, in:1, f:`anne_dreamy`, o:`diana`, bk:[`15-8`],
   e:`'자작나무 길'은 좀 평범한 이름이지만… 이 길은 세상에서 제일 아름다운 곳 중 하나야. 하얀 자작나무 사이로 햇빛이 에메랄드처럼 걸러져 내려오거든.`,
   l:`'자작나무 길'은 누구라도 떠올릴 법한 이름이었지만, 이 길만큼은 세상에서 가장 아름다운 곳 가운데 하나였다. 하얀 자작나무 사이로 햇빛이 겹겹의 에메랄드 가리개를 지나 다이아몬드의 한가운데처럼 맑게 내려왔다.`},
  /* ---------- 길버트 이야기 ---------- */
  {w:`diana`, f:`anne_surprised`, o:`diana`, bk:[`15-17`,`15-18`], cam:`right`,
   e:`"오늘 길버트 블라이스가 학교에 올 거야. 여름 내내 사촌네 갔다가 돌아왔거든. 엄청 잘생겼어, 앤. 그리고 여자애들을 지독하게 놀려." 다이애나는 그게 싫지만은 않은 말투였어.`,
   l:`"오늘 길버트 블라이스가 학교에 올 것 같아. 여름 내내 뉴브런즈윅 사촌네 있다가 토요일 밤에야 돌아왔거든. 걘 엄청 잘생겼어, 앤. 그리고 여자애들을 지독하게 놀려." 그렇게 시달리는 게 오히려 싫지 않은 눈치였다.`},
  {w:`diana`, f:`anne_surprised`, o:`diana`, bk:[`15-25`],
   e:`"그리고 길버트는 늘 반에서 1등이었어. 이제부터는 1등 지키기가 쉽지 않을걸?"`,
   l:`"그리고 이제 길버트가 너희 반에 들어올 거야. 분명히 말하는데, 길버트는 늘 1등을 해 왔어. 이제부터는 1등 자리 지키기가 그렇게 쉽지 않을걸, 앤."`},
  {t:`choice`, id:`C1`, kind:`talk`, label:`길버트 블라이스라는 아이`, f:`anne_surprised`, o:`diana`,

  {w:`diana`, f:`anne_dreamy`, o:`diana`, fx:`dream`,

   l:`다이애나가 까르르 웃었다. "용은 무슨! 뉴브런즈윅 사촌네 다녀온 거야. 게다가 걘 기사가 아니라 장난꾸러기라니까."`},

  {bg:`ch4`, w:`anne`, in:1, f:`anne_surprised`, o:`diana`, bk:[`15-9`,`15-28`,`15-29`], cam:`in`,
   e:`하얗게 칠한 우리 학교. 책상 뚜껑마다 옛날 학생들이 새긴 이름이 가득해. 필립스 선생님이 뒤쪽에서 프리시 언니의 라틴어를 봐 주는 사이, 다이애나가 속삭였어. "저기 통로 건너편이 길버트야. 잘생겼지?"`,
   l:`하얗게 회칠을 한 에이번리 학교. 책상 뚜껑마다 3대에 걸친 학생들의 머리글자가 빼곡했다. 필립스 선생님이 교실 뒤쪽에서 프리시 앤드루스의 라틴어를 봐 주는 사이, 다이애나가 속삭였다. "통로 건너 바로 네 옆에 앉은 애가 길버트 블라이스야. 잘생기지 않았니?"`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`gilbert`, bk:[`15-30`], cam:`right`, eff:{met:`gilbert`},
   e:`길버트는 앞자리 루비의 노란 머리채를 몰래 의자에 핀으로 꽂고 있었어. 키가 크고, 갈색 곱슬머리에, 장난기 가득한 눈. 루비가 일어서다 "꺅!" 하고 넘어지자, 길버트는 시치미를 뚝 떼고 있다가… 나를 보고 윙크했어!`,
   l:`길버트 블라이스는 앞자리 루비 길리스의 노란 머리채를 의자 등받이에 몰래 핀으로 꽂고 있었다. 키가 크고, 갈색 곱슬머리에, 장난기 어린 담갈색 눈. 루비가 일어서다 비명을 지르며 주저앉자, 길버트는 세상에서 제일 진지한 얼굴로 역사책을 보고 있다가… 나를 향해 익살맞게 윙크했다.`},
  {w:`anne`, f:`anne_angry`, o:`diana`, bk:[`15-31`], when:s => !s.flags.knight,
   e:`"너희 길버트, 잘생기긴 했네." 내가 다이애나에게 소곤거렸어. "그런데 아주 뻔뻔해. 처음 보는 여자애한테 윙크하는 건 예의가 아니야."`,
   l:`"너희 길버트 블라이스, 잘생기긴 했네." 나는 다이애나에게 털어놓았다. "그런데 아주 뻔뻔한 것 같아. 처음 보는 여자애한테 윙크하는 건 예의가 아니야."`},
  {w:`anne`, f:`anne_angry`, o:`diana`, when:s => s.flags.knight,

   l:`"기사는 무슨." 나는 다이애나에게 속삭였다. "기사는 숙녀의 머리채를 의자에 꽂지 않아. 처음 보는 여자애한테 윙크하는 것도 기사도와는 거리가 멀고."`},
  {w:`anne`, in:1, f:`anne_dreamy`, bk:[`15-32`,`15-33`], cam:`up`,
   e:`오후가 되었어. 선생님은 구석에서 프리시 언니에게 문제를 설명하고 계셨고, 아이들은 풋사과를 먹거나 귀뚜라미를 실에 매어 몰고 다녔어. 나는 턱을 괴고 창밖으로 보이는 '{pond}'를 바라보며 꿈나라를 여행하고 있었지.`,
   l:`오후였다. 선생님은 구석에서 프리시에게 대수 문제를 설명하고 있었고, 아이들은 풋사과를 먹고 소곤거리고, 실로 맨 귀뚜라미를 통로에서 몰고 다녔다. 나는 두 손으로 턱을 괴고 서쪽 창 너머 파랗게 빛나는 '{pond}'에 눈을 고정한 채, 화려한 꿈나라 저 멀리를 거닐고 있었다.`},
  {w:`gilbert`, f:`anne_dreamy`, o:`gilbert`, bk:[`15-34`,`15-35`,`15-36`], cam:`right`,

   l:`그때였다. 통로 너머로 뻗어 온 손이 내 기다란 빨간 머리채 끝을 집어 들어 올렸다. 그리고 날카로운 속삭임. "홍당무! 홍당무!"`},
  {w:`anne`, f:`anne_angry`, o:`gilbert`, bk:[`15-37`,`15-38`], cam:`shake`,

   l:`나는 벌떡 일어섰다. 찬란하던 공상은 산산이 부서져 다시는 되살릴 수 없었다. 나는 성난 눈빛을 길버트에게 쏘아 보냈고, 그 불꽃은 곧 그만큼 분한 눈물에 꺼져 들었다.`},

   opts:[

    {type:`bal`, go:`h_b`, eff:{flag:`spoke`, heart:{gilbert:1}}, e:`석판을 꽉 쥔 채 참고, "내 머리로 놀리지 마. 당장 사과해!"라고 또박또박 말한다.`, l:`석판을 움켜쥔 손을 내리고, "내 머리로 놀리지 마. 당장 사과해!"라고 또렷이 말한다.`, s:{e:`참고 "당장 사과해!"라고 말했다`, l:`참고 사과를 요구했다`}}

  {id:`h_c`, w:`anne`, f:`anne_angry`, o:`gilbert`, bk:[`15-40`,`15-41`], cam:`shake`,
   e:`퍽! 나는 석판으로 길버트의 머리를 내리쳤어. 석판이 쩍 갈라졌어. 머리 말고 석판이! 교실 전체가 "어머!" 하고 소리쳤고, 루비는 울음을 터뜨렸고, 토미는 귀뚜라미를 몽땅 놓쳐 버렸어.`,
   l:`퍽! 내 석판이 길버트의 머리 위로 떨어졌고, 석판은, 머리가 아니라 석판은, 한가운데가 쩍 갈라졌다. 언제나 구경거리를 즐기는 에이번리 학교가 겁에 질리면서도 신이 나서 "어머!" 하고 외쳤다. 다이애나는 숨을 삼켰고, 루비 길리스는 울음을 터뜨렸고, 토미 슬론은 귀뚜라미 마차를 몽땅 놓쳐 버렸다.`},

   l:`그 순간 나는 불을 뿜는 용이었다. 콧김에서 불꽃이 튀고, 붉은 비늘이 노을처럼 번쩍였다. 용은 꼬리를 휘둘러… 석판을 제 책상 위에 힘껏 내리쳤다.`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`gilbert`, cam:`shake`,
   e:`쾅! 석판이 쩍 갈라졌어. 정신을 차려 보니 나는 용이 아니라, 교실 한가운데 서서 씩씩거리는 빨간 머리 여자애였어. 교실 전체가 "어머!" 하고 나를 쳐다봤어.`,
   l:`쾅! 석판이 두 동강 났다. 정신을 차려 보니 나는 용이 아니라, 교실 한가운데서 씩씩대는 빨간 머리 소녀일 뿐이었다. 모든 눈이 "어머!" 하는 탄성과 함께 내게 쏠렸다.`},

  {w:`gilbert`, f:`anne_angry`, o:`gilbert`,

   e:`필립스 선생님이 성큼성큼 걸어와 내 어깨를 꽉 잡으셨어. "앤 셜리, 이게 무슨 짓이냐?"`,
   l:`필립스 선생님이 통로를 성큼성큼 걸어와 내 어깨에 묵직하게 손을 얹었다. "앤 셜리, 이게 무슨 짓이냐?"`},
  {w:`anne`, in:1, f:`anne_sad`, o:`phillips`, bk:[`15-44`],
   e:`나는 아무 대답도 할 수 없었어. 온 학교 앞에서 '홍당무'라고 불렸다고 어떻게 말해?`,
   l:`나는 아무 대답도 하지 않았다. 온 학교 앞에서 '홍당무'라고 불렸노라 고백하라는 건 사람으로서 너무 가혹한 일이었다.`},
  {w:`gilbert`, f:`anne_sad`, o:`gilbert`, bk:[`15-45`], cam:`left`, eff:{heart:{gilbert:1}},
   e:`그때 길버트가 당당하게 나섰어. "제 잘못이에요, 필립스 선생님. 제가 놀렸어요."`,
   l:`대신 당당하게 나선 것은 길버트였다. "제 잘못이에요, 필립스 선생님. 제가 놀렸어요."`},
  {w:`phillips`, f:`anne_sad`, o:`phillips`, bk:[`15-46`,`15-47`], cam:`right`,
   e:`하지만 선생님은 길버트의 말은 들은 척도 안 하셨어. "내 학생이 이런 성질을 부리다니 유감이구나. 앤, 오후 내내 칠판 앞에 나가 서 있어라."`,
   l:`그러나 선생님은 길버트의 말에 아무 관심도 기울이지 않았다. "내 학생이 이런 성질머리와 이런 앙심을 드러내다니 유감이구나. 앤, 오늘 오후 내내 칠판 앞 교단에 나가 서 있어라."`},
  {w:`phillips`, f:`anne_sad`, o:`phillips`, when:s => s.flags.spoke,
   e:`"수업 시간에 소리를 지르는 것도 성질을 못 다스린 거다."`,
   l:`"수업 중에 소리를 지르는 것 역시 성질을 다스리지 못한 것이다."`},
  {w:`anne`, in:1, f:`anne_angry`, o:`phillips`, bk:[`15-48`,`15-49`], cam:`in`,
   e:`선생님은 내 머리 위 칠판에 이렇게 쓰셨어. "앤 셜리(Ann Shirley)는 성질이 아주 나쁘다. 앤 셜리는 성질을 다스리는 법을 배워야 한다." 그리고 1학년 꼬마들까지 알아듣게 소리 내어 읽으셨어.`,
   l:`선생님은 분필을 들어 내 머리 위 칠판에 썼다. "앤 셜리(Ann Shirley)는 성질이 아주 나쁘다. 앤 셜리는 성질을 다스리는 법을 배워야 한다." 그리고 글씨를 못 읽는 1학년 꼬마들까지 알아듣도록 소리 내어 읽었다.`},
  {w:`anne`, in:1, f:`anne_angry`, bk:[`15-50`],
   e:`나는 울지도, 고개를 숙이지도 않았어. 화가 너무 뜨거워서 오히려 버틸 수 있었어. 다시는 길버트 블라이스를 쳐다보지 않을 거야! 다시는 말도 안 할 거야!`,
   l:`나는 울지도 고개를 숙이지도 않았다. 가슴속 분노가 아직 너무 뜨거웠고, 바로 그 분노가 끔찍한 굴욕 속에서 나를 버티게 했다. 길버트 블라이스는 쳐다보지도 않았다. 다시는 그 애를 쳐다보지 않을 거야! 다시는 그 애와 말도 하지 않을 거야!`},
  /* ---------- 하굣길 ---------- */
  {bg:`ch4_yard`, w:`gilbert`, f:`anne_angry`, o:`gilbert`, bk:[`15-51`,`15-52`], cam:`right`,
   e:`수업이 끝나고, 길버트가 현관에서 나를 막아섰어. "네 머리 놀려서 정말 미안해, 앤. 진심이야. 이제 그만 화 풀어, 응?"`,
   l:`수업이 끝나자 길버트가 현관문에서 나를 가로막았다. "네 머리를 놀려서 정말 미안해, 앤." 뉘우치는 속삭임이었다. "진심이야. 이제 그만 화 풀어, 응?"`},
  {t:`choice`, id:`C3`, kind:`talk`, label:`길버트의 사과`, f:`anne_angry`, o:`gilbert`,
   q:{e:`길버트가 사과했어요. 앤은 어떻게 할까요?`, l:`현관에서 길을 막아선 길버트의 사과. 앤의 대답은?`},
   note:{e:`원작의 앤은 쳐다보지도 않고 쌀쌀맞게 지나쳐 버려요. "나는 길버트 블라이스를 절대 용서하지 않을 거야!" 이 결심은 아주아주 오래 이어진답니다.`,
         l:`원작에서 앤은 눈길도 주지 않고 쌀쌀맞게 지나쳐 버립니다. "길버트 블라이스를 절대 용서하지 않겠다"는 이 결심은 이야기 끝자락까지 이어지는 긴 냉전의 시작이지요.`},
   opts:[
    {type:`canon`, go:`g_c`, eff:{flag:`grudge`, heart:{gilbert:-1}}, e:`쳐다보지도, 들은 척도 하지 않고 쌀쌀맞게 지나쳐 버린다.`, l:`눈길도 주지 않고, 들은 척도 하지 않으며 쌀쌀맞게 지나친다.`, s:{e:`쳐다보지도 않고 지나쳤다`, l:`쌀쌀맞게 지나쳤다`}},
    {type:`imag`, go:`g_i`, eff:{heart:{gilbert:0}}, e:`"용서받고 싶다면, 은하수에서 별 백 개를 따 오너라!" 여왕처럼 명령한다.`, l:`"용서를 원한다면 은하수의 별 백 개를 따 오너라!" 여왕처럼 시험을 내린다.`, s:{e:`별 백 개를 따 오라고 했다`, l:`별 백 개의 시험을 냈다`}},
    {type:`bal`, go:`g_b`, eff:{flag:`needTime`, heart:{gilbert:1}}, e:`"사과는 들었어. 하지만 아직은 용서 못 해. 시간이 필요해."`, l:`"사과는 들었어. 하지만 아직은 용서할 수 없어. 시간이 필요해."`, s:{e:`아직은 시간이 필요하다고 했다`, l:`용서에는 시간이 필요하다 했다`}}
   ]},
  {id:`g_c`, w:`anne`, in:1, f:`anne_angry`, o:`gilbert`, bk:[`15-53`],
   e:`나는 쳐다보지도, 들은 척도 하지 않고 고개를 꼿꼿이 든 채 지나쳐 버렸어.`,
   l:`나는 눈길 한 번, 들은 척 한 번 없이 쌀쌀맞게 그 곁을 지나쳤다.`},
  {w:`diana`, f:`anne_angry`, o:`diana`, bk:[`15-53`,`15-54`],
   e:`"아, 어떻게 그럴 수가 있어, 앤?" 다이애나가 반쯤은 나무라듯, 반쯤은 감탄하듯 말했어. "나는 절대 저 부탁은 못 뿌리칠 거야." "나는 길버트 블라이스를 절대 용서하지 않을 거야."`,
   l:`"아, 어떻게 그럴 수가 있어, 앤?" 다이애나가 반은 나무라듯, 반은 감탄하듯 숨죽여 말했다. 다이애나라면 길버트의 부탁을 절대 뿌리치지 못했으리라. "나는 길버트 블라이스를 절대 용서하지 않을 거야." 내가 단호하게 말했다.`},
  {t:`goto`, to:`g_m`},
  {id:`g_i`, w:`anne`, f:`anne_dreamy`, o:`gilbert`, fx:`dream`, cam:`up`, eff:{album:`starQuest`},
   e:`나는 여왕처럼 턱을 치켜들었어. "용서받고 싶다면, 은하수에서 별 백 개를 따 오너라. 그 전엔 내 앞에 나타나지 마라!"`,
   l:`나는 여왕처럼 턱을 치켜들었다. "용서를 원한다면 은하수의 별 백 개를 따 오너라. 그 전에는 내 앞에 나타나지 말지어다!"`},
  {w:`gilbert`, f:`anne_dreamy`, o:`gilbert`, fx:`dream`,
   e:`길버트는 잠깐 멍하니 있다가 피식 웃었어. "별 백 개? …알았어. 하나씩 세어 볼게."`,
   l:`길버트는 잠시 멍하니 서 있다가 피식 웃었다. "별 백 개라… 알았어. 하나씩 세어 보지, 뭐."`},
  {w:`diana`, f:`anne_happy`, o:`diana`,
   e:`"앤! 너 정말 별나다! 길버트한테 그런 말 한 애는 네가 처음일 거야!" 다이애나가 감탄했어.`,
   l:`"앤, 너 정말 별나다. 길버트에게 그런 말을 한 애는 네가 처음일 거야." 다이애나가 반쯤 감탄하며 말했다.`},
  {t:`goto`, to:`g_m`},
  {id:`g_b`, w:`anne`, f:`anne_sad`, o:`gilbert`, eff:{album:`needTime`},
   e:`나는 걸음을 멈추고 길버트를 똑바로 봤어. "사과는 들었어. 하지만 아직은 용서 못 해. 그 말이 얼마나 아팠는지 너는 몰라. 시간이 필요해."`,
   l:`나는 걸음을 멈추고 길버트를 똑바로 바라보았다. "사과는 들었어. 하지만 아직은 용서할 수 없어. 그 말이 얼마나 아팠는지 너는 모를 거야. 시간이 필요해."`},
  {w:`gilbert`, f:`anne_sad`, o:`gilbert`,
   e:`길버트는 고개를 끄덕였어. "…알았어. 기다릴게."`,
   l:`길버트는 천천히 고개를 끄덕였다. "…알았어. 기다릴게."`},
  {id:`g_m`, w:`anne`, f:`anne_sad`, o:`diana`, bk:[`15-54`,`15-56`,`15-57`],
   e:`"게다가 선생님은 내 이름을 e도 없이 썼어. 쇠붙이가 내 영혼에 박혔어, 다이애나." "길버트는 나도 까마귀라고 놀려." "까마귀랑 홍당무는 하늘과 땅 차이야!"`,
   l:`"게다가 필립스 선생님은 내 이름을 e도 없이 썼어. 쇠붙이가 내 영혼에 박혔어, 다이애나." 다이애나는 무슨 뜻인지 몰랐지만 끔찍한 일이라는 것만은 알아들었다. "길버트는 나도 까마귀라고 놀려." "까마귀라고 불리는 것과 홍당무라고 불리는 건 하늘과 땅 차이야."`},
  /* ---------- 가문비나무 숲 ---------- */
  {bg:`ch4_spruce`, w:`anne`, in:1, f:`anne_happy`, bk:[`15-58`,`15-59`,`15-60`], cam:`out`,
   e:`다음 날 점심시간. 선생님은 늦게 오는 사람은 벌을 주겠다고 하셨어. 하지만 아이들은 여느 때처럼 벨 아저씨네 가문비나무 숲에 송진 껌을 따러 갔어.`,
   l:`이튿날, 필립스 선생님은 발작처럼 찾아오는 개혁의 열정에 사로잡혀 선언했다. 자기가 돌아왔을 때 자리에 없는 학생은 벌을 받으리라고. 그러나 아이들은 여느 때처럼 벨 씨네 가문비나무 숲으로 송진 껌을 따러 갔다.`},
  {w:`anne`, in:1, f:`anne_dreamy`, bk:[`15-62`], fx:`dream`, cam:`up`, eff:{item:`ricelily`},
   e:`나는 껌은 따지 않고, 숲 저편 허리까지 오는 고사리 사이를 거닐며 혼자 노래를 불렀어. 머리에는 하얀 쌀백합 화관을 쓰고. 꼭 그늘진 숲의 여신이 된 것 같았어.`,
   l:`나는 송진을 따는 대신 숲 저편 끝에서 허리까지 오는 고사리 사이를 거닐며 나직이 노래했다. 머리에는 쌀백합 화관을 쓰고, 마치 그늘진 곳에 사는 숲의 여신처럼.`},
  {w:`anne`, in:1, f:`anne_surprised`, when:s => s.flags.wreath,
   e:`또 머리에 꽃을… 마릴라 아주머니가 아시면 뭐라고 하실까? 그래도 숲속엔 보는 사람이 없으니까 괜찮겠지.`,
   l:`또 머리에 꽃이라니, 마릴라 아주머니가 아시면 뭐라 하실까. 그래도 숲속엔 보는 눈이 없으니 괜찮으리라.`},
  {w:`jimmy`, f:`anne_surprised`, bk:[`15-61`], cam:`shake`, b:`"선생님 온다!"`},
  {w:`anne`, in:1, f:`anne_surprised`, bk:[`15-62`], cam:`in`,
   e:`늙은 가문비나무 꼭대기에서 지미 글로버가 외쳤어! 여자애들은 벌써 뛰어갔고, 나는 제일 늦었어. 하지만 나는 사슴처럼 빨리 달릴 수 있거든. 학교 문 앞에서 남자애들을 따라잡아, 선생님이 막 모자를 거실 때 남자애들 틈에 휩쓸려 들어갔어.`,
   l:`늙은 가문비나무 꼭대기에서 지미 글로버가 외쳤다. 땅에 있던 여자애들은 이미 출발했고, 나무에서 내려와야 했던 남자애들은 그보다 늦었고, 나는 가장 늦었다. 그러나 나는 사슴처럼 달릴 수 있었다. 문 앞에서 남자애들을 따라잡아, 선생님이 막 모자를 걸려는 순간 그 틈에 휩쓸려 교실로 들어섰다.`},
  {bg:`ch4`, w:`phillips`, f:`anne_surprised`, o:`phillips`, bk:[`15-63`,`15-64`], cam:`right`,
   e:`선생님은 열두 명을 다 벌주기는 귀찮으셨나 봐. 대신 헐떡거리며 앉은 나를 보셨어. 쌀백합 화관이 한쪽 귀에 비뚜름하게 걸려 있었지. "앤 셜리, 남자애들하고 어울리는 게 그렇게 좋으면 오늘 오후엔 실컷 어울리게 해 주마. 꽃 떼고, 길버트 블라이스 옆에 앉아라."`,
   l:`선생님은 학생 열두 명을 벌주는 수고는 하고 싶지 않았다. 하지만 체면은 세워야 했기에 희생양을 찾아 두리번거렸고, 숨을 헐떡이며 주저앉은 나를 찾아냈다. 깜빡 잊은 화관이 한쪽 귀 위로 비뚜름하게 걸려 있었다. "앤 셜리, 남자애들하고 어울리는 게 그렇게 좋은 모양이니, 오늘 오후엔 그 취향을 마음껏 즐기게 해 주마. 머리에서 그 꽃 떼고, 길버트 블라이스 옆에 가서 앉아라."`},
  {w:`diana`, f:`anne_sad`, o:`diana`, bk:[`15-65`],
   e:`남자애들이 킥킥거렸어. 다이애나가 하얗게 질린 얼굴로 내 머리에서 화관을 떼어 주고, 내 손을 꼭 잡았어.`,
   l:`남자애들이 킥킥거렸다. 다이애나가 안쓰러움에 하얗게 질린 얼굴로 내 머리에서 화관을 떼어 내고, 내 손을 꼭 쥐었다.`},
  {w:`phillips`, f:`anne_sad`, o:`phillips`, bk:[`15-66`,`15-67`,`15-68`],
   e:`"내 말 못 들었니, 앤?" "들었어요, 선생님. 하지만 진심이신 줄은 몰랐어요." "진심이고말고. 당장 시키는 대로 해."`,
   l:`"내 말 못 들었니, 앤?" "들었어요, 선생님." 나는 천천히 대답했다. "하지만 진심으로 하신 말씀인 줄은 몰랐어요." "진심이고말고." 아이들 모두가 싫어하는 그 비꼬는 말투였다. "당장 시키는 대로 해."`},
  {t:`choice`, id:`C4`, kind:`act`, label:`길버트 옆자리로`, f:`anne_angry`, o:`phillips`,
   q:{e:`늦은 아이는 많은데 앤만 벌을 받았어요. 앤은 어떻게 할까요?`, l:`열두 명 가운데 앤 혼자 받은 벌. 앤은 어떻게 행동할까요?`},
   note:{e:`원작의 앤은 잠깐 버티는 듯하다가, 어쩔 수 없다는 걸 알고 도도하게 일어나 길버트 옆에 앉아요. 그리고 책상에 팔을 괴고 얼굴을 파묻었지요. 앤에게는 세상이 끝난 것 같은 순간이었어요.`,
         l:`원작에서 앤은 잠시 거역할 듯 서 있다가, 어쩔 도리가 없음을 깨닫고 도도하게 통로를 건너 길버트 옆에 앉아 책상에 얼굴을 묻습니다. 작가는 이 장면을 앤에게 "세상의 끝"이었다고 씁니다.`},
   opts:[
    {type:`canon`, go:`s_c`, e:`도도하게 일어나 길버트 옆에 앉아, 책상에 얼굴을 파묻는다.`, l:`도도하게 일어나 길버트 옆에 앉고는, 책상 위 팔에 얼굴을 묻는다.`, s:{e:`길버트 옆에 앉아 얼굴을 파묻었다`, l:`얼굴을 묻은 채 벌을 받았다`}},
    {type:`imag`, go:`s_i`, e:`길버트와 나 사이에 '보이지 않는 유리벽'이 있다고 상상하며 앉는다.`, l:`길버트와 자신 사이에 '보이지 않는 유리벽'을 세웠다고 상상하며 앉는다.`, s:{e:`보이지 않는 유리벽을 세웠다`, l:`상상의 유리벽을 세웠다`}},
    {type:`bal`, go:`s_b`, eff:{flag:`askedFair`}, e:`"늦은 건 남자애들도 똑같은데, 왜 저만 벌을 받아요?" 공손하지만 분명하게 묻는다.`, l:`"늦은 건 다른 아이들도 같은데, 왜 저만 벌을 받나요?" 공손하되 분명하게 묻는다.`, s:{e:`왜 나만 벌을 받냐고 물었다`, l:`벌의 공정함을 물었다`}}

  {id:`s_c`, w:`anne`, in:1, f:`anne_sad`, o:`gilbert`, bk:[`15-69`,`15-70`], cam:`in`,
   e:`잠깐 버텼지만 소용없었어. 나는 고개를 꼿꼿이 들고 통로를 건너가 길버트 옆에 앉았어. 그리고 책상에 얼굴을 파묻었어. 열두 명 중에 나만 벌받은 것도 억울한데, 하필 길버트 옆이라니. 세상이 끝난 것 같았어.`,
   l:`잠시 버텨 보았지만 소용없었다. 나는 도도하게 일어나 통로를 건너 길버트 블라이스 옆에 앉고는, 책상 위 팔에 얼굴을 묻었다. 똑같이 잘못한 열두 명 가운데 혼자만 벌을 받은 것도 억울한데, 남자애 옆에, 그것도 하필 길버트 블라이스 옆에. 세상의 끝이었다.`},

  {id:`s_i`, w:`anne`, in:1, f:`anne_dreamy`, o:`gilbert`, fx:`dream`, cam:`up`, eff:{album:`glassWall`},
   e:`나는 길버트 옆에 앉으며 상상했어. 우리 사이에 보이지 않는 두꺼운 유리벽이 쿵 내려왔다고. 벽 너머의 길버트는 소리도 안 들리고, 나를 건드릴 수도 없어. 나는 유리 성에 갇힌 공주야.`,
   l:`길버트 옆에 앉으며 나는 상상했다. 우리 사이로 보이지 않는 두꺼운 유리벽이 쿵 내려앉았다고. 벽 너머의 소년은 소리도 닿지 않고 손도 미치지 않는다. 나는 유리 성에 홀로 깃든 공주였다.`},
  {w:`anne`, in:1, f:`anne_sad`, o:`gilbert`, bk:[`15-70`],

   l:`그러나 아이들의 킥킥거림만은 유리벽을 뚫고 스며들었다. 나는 끝내 책상에 얼굴을 묻었다.`},

  {w:`phillips`, f:`anne_angry`, o:`phillips`,
   e:`교실이 술렁였어. 선생님 얼굴이 빨개지셨어. "말대꾸까지 하는구나. 어서 앉아!" 나는 길버트 옆에 앉았지만, 이번엔 고개를 숙이지 않았어.`,
   l:`교실이 술렁였다. 선생님의 얼굴이 붉어졌다. "말대꾸까지 하는구나. 어서 앉아!" 나는 길버트 옆에 앉았다. 하지만 이번만큼은 고개를 숙이지 않았다.`},
  {id:`s_m`, w:`anne`, in:1, f:`anne_sad`, o:`gilbert`, bk:[`15-71`], cam:``,
   e:`한참 뒤, 아무도 안 볼 때 길버트가 내 팔꿈치 아래로 뭔가를 슬쩍 밀어 넣었어. 금빛 글씨로 "너는 달콤해"라고 쓰인 작은 분홍 하트 사탕이었어.`,
   l:`한참 뒤 아무도 보지 않을 때, 길버트가 책상에서 무언가를 꺼내 내 팔꿈치 안쪽으로 슬쩍 밀어 넣었다. 금빛 글씨로 '너는 달콤해'라고 적힌 작은 분홍 하트 사탕이었다.`},
  {t:`choice`, id:`C5`, kind:`predict`, label:`분홍 하트 사탕`, f:`anne_angry`, o:`gilbert`,
   q:{e:`길버트가 준 "너는 달콤해" 하트 사탕! 원작의 앤은 이 사탕을 어떻게 했을까요?`, l:`'너는 달콤해'라 적힌 하트 사탕. 원작의 앤은 이것을 어떻게 했을까요?`},
   note:{e:`원작의 앤은 사탕을 손끝으로 집어 바닥에 떨어뜨리고, 구두 뒤꿈치로 짓이겨 가루로 만들어 버려요. 그러고는 길버트에게 눈길 한 번 주지 않았대요.`,
         l:`원작에서 앤은 하트를 손끝으로 조심스럽게 집어 바닥에 떨어뜨리고, 구두 뒤꿈치로 짓이겨 가루로 만든 뒤 아무렇지 않게 원래 자세로 돌아갑니다. 길버트에게는 눈길 한 번 주지 않지요.`},
   opts:[
    {type:`canon`, go:`c_c`, eff:{heart:{gilbert:-1}}, e:`손끝으로 집어 바닥에 떨어뜨리고, 구두 뒤꿈치로 짓이겨 가루로 만든다.`, l:`손끝으로 집어 바닥에 떨어뜨리고, 구두 뒤꿈치로 짓이겨 가루로 만든다.`, s:{e:`사탕을 발로 짓이겼다`, l:`하트를 짓이겨 가루로 만들었다`}},
    {type:`imag`, go:`c_i`, e:`'마녀의 독사과' 같은 저주의 사탕이라 생각하고, 창밖 풀숲으로 휙 던져 버린다.`, l:`마녀의 독사과처럼 저주가 깃든 사탕이라 여기고, 창밖 풀숲으로 던져 버린다.`, s:{e:`저주의 사탕이라며 창밖에 던졌다`, l:`저주의 사탕을 창밖에 던졌다`}},
    {type:`bal`, go:`c_b`, eff:{item:`candy`, heart:{gilbert:1}}, e:`말없이 사탕을 길버트 쪽으로 도로 밀어 돌려준다.`, l:`아무 말 없이 사탕을 길버트 쪽으로 도로 밀어 놓는다.`, s:{e:`사탕을 말없이 돌려주었다`, l:`사탕을 말없이 돌려주었다`}}
   ]},
  {id:`c_c`, w:`anne`, in:1, f:`anne_angry`, o:`gilbert`, bk:[`15-71`], cam:`shake`,
   e:`나는 일어나서 하트 사탕을 손끝으로 집어 바닥에 툭 떨어뜨렸어. 그리고 구두 뒤꿈치로 꾹꾹 짓이겨 가루로 만들었어. 그러고는 길버트를 쳐다보지도 않고 다시 엎드렸지.`,
   l:`나는 일어나 분홍 하트를 손끝으로 조심스럽게 집어 바닥에 떨어뜨렸다. 그리고 구두 뒤꿈치로 짓이겨 가루로 만들고는, 길버트에게 눈길 한 번 주지 않고 원래 자세로 돌아갔다.`},
  {t:`goto`, to:`c_m`},
  {id:`c_i`, w:`anne`, in:1, f:`anne_dreamy`, o:`gilbert`, fx:`dream`,
   e:`이건 분명 마녀의 독사과 같은 저주의 사탕이야! 한 입만 먹으면 길버트를 용서하게 되는 마법이 걸려 있을 거야. 나는 사탕을 창밖 풀숲으로 휙 던져 버렸어.`,
   l:`이것은 분명 마녀의 독사과처럼 저주가 깃든 사탕이리라. 한 입이라도 베어 물면 길버트를 용서하게 되는 마법이 걸려 있을 터였다. 나는 사탕을 창밖 풀숲으로 던져 버렸다.`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`gilbert`,
   e:`풀숲에서 참새 한 마리가 사탕을 콕콕 쪼았어. 참새는 저주에 걸려 길버트를 용서하게 될까?`,
   l:`풀숲에서 참새 한 마리가 사탕을 콕콕 쪼아 댔다. 저 참새는 저주에 걸려 길버트를 용서하게 될까.`},
  {t:`goto`, to:`c_m`},
  {id:`c_b`, w:`anne`, in:1, f:`anne_sad`, o:`gilbert`, eff:{album:`returned`},

   l:`나는 아무 말 없이 사탕을 길버트 쪽으로 도로 밀어 놓았다. 받을 수는 없었다. 그러나 짓밟고 싶지도 않았다. 사탕에게는 아무 죄가 없었으니까.`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`gilbert`,
   e:`길버트는 잠깐 사탕을 보더니, 조용히 주머니에 넣었어. 그리고 다시 분수 문제를 풀었어.`,
   l:`길버트는 잠시 사탕을 내려다보더니 조용히 주머니에 넣었다. 그리고 다시 분수 문제로 고개를 숙였다.`},
  /* ---------- 학교를 그만두다 ---------- */
  {id:`c_m`, bg:`ch4_yard`, w:`anne`, f:`anne_angry`, o:`diana`, bk:[`15-72`,`15-73`,`15-74`], cam:`out`,
   e:`수업이 끝나자, 나는 책상 안의 물건을 몽땅 꺼내 금 간 석판 위에 쌓았어. 길에 나서자 다이애나가 물었어. "그걸 다 왜 가져가?" "나 이제 학교에 안 다닐 거야."`,
   l:`수업이 끝나자 나는 보란 듯이 책상 속 물건을 몽땅 꺼냈다. 책과 공책, 펜과 잉크, 성경과 산수책을 모두 꺼내 석판 위에 가지런히 쌓았다. 길에 나서자 다이애나가 그제야 물었다. "그걸 다 왜 집에 가져가는 거야, 앤?" "나 이제 학교에 안 다닐 거야."`},
  {w:`diana`, f:`anne_sad`, o:`diana`, bk:[`15-78`,`15-80`], eff:{item:`pansy`},
   e:`"아, 앤! 너 정말 너무해. 나는 어떡하라고? 우리 시냇가에 새 소꿉놀이 집도 짓고, 공놀이도 하고, 새 '팬지' 책도 같이 소리 내어 읽기로 했잖아. 제발 돌아와."`,
   l:`"아, 앤!" 다이애나는 금방이라도 울 것 같았다. "너 정말 너무해. 나는 어떡하라고? 선생님은 나를 그 끔찍한 거티 파이 옆에 앉힐 거야. 시냇가에 제일 예쁜 새 소꿉놀이 집도 짓고, 다음 주엔 공놀이도 하고, 새 '팬지' 책을 한 장씩 돌아가며 소리 내어 읽기로 했잖아. 너 소리 내어 읽는 거 정말 좋아하잖아. 제발 돌아와, 앤."`},
  {w:`diana`, f:`anne_sad`, o:`diana`, when:s => !!s.names.together && s.names.together !== `…`,
   e:`"우리 '{together}' 하기로 한 것도 아직 다 못 했잖아…"`,
   l:`"우리 '{together}' 하기로 한 것도 아직 다 못 했잖아…"`},
  {w:`anne`, f:`anne_sad`, o:`diana`, bk:[`15-79`], cam:`in`,
   e:`"너를 위해서라면 세상에서 거의 무슨 일이든 할 수 있어, 다이애나. 하지만 이것만은 안 돼. 제발 부탁하지 마. 내 영혼이 찢어질 것 같아."`,
   l:`"너를 위해서라면 세상에서 거의 무슨 일이든 할 수 있어, 다이애나. 너에게 도움이 된다면 내 팔다리가 갈가리 찢겨도 좋아. 하지만 이것만은 안 돼. 그러니 제발 부탁하지 마. 네가 그러면 내 영혼이 갈기갈기 찢어져."`},
  {w:`anne`, in:1, f:`anne_sad`, o:`diana`, when:s => s.flags.vow || s.flags.pinky || s.flags.lilyCrown,
   e:`'해와 달이 있는 한' 다이애나 편이 되겠다고 맹세했는데… 오늘만은 다이애나의 부탁을 들어줄 수가 없었어.`,
   l:`해와 달이 있는 한 다이애나에게 충실하겠다고 맹세했건만, 오늘만큼은 그 부탁을 들어줄 수가 없었다.`},
  /* ---------- 초록 지붕 집 ---------- */
  {bg:`ch2`, w:`marilla`, f:`anne_angry`, o:`marilla_strict`, bk:[`15-81`,`15-82`,`15-83`,`15-84`],
   e:`"말도 안 되는 소리. 내일 평소처럼 학교에 가거라." "말도 안 되는 소리가 아니에요, 아주머니. 저는 모욕을 당했어요!"`,
   l:`"말도 안 되는 소리." 마릴라 아주머니가 말했다. "전혀 말도 안 되는 소리가 아니에요." 나는 엄숙하고 원망 어린 눈으로 아주머니를 바라보았다. "모르시겠어요? 저는 모욕을 당했어요." "모욕은 무슨! 내일 평소처럼 학교에 가거라."`},
  {w:`anne`, f:`anne_sad`, o:`marilla_strict`, bk:[`15-85`],
   e:`"아니에요. 공부는 집에서 할게요. 최대한 착하게 지내고, 될 수 있으면 입도 꼭 다물게요. 하지만 학교에는 다시 안 가요."`,
   l:`"아, 아니에요." 나는 부드럽게 고개를 저었다. "저는 다시 안 가요, 아주머니. 공부는 집에서 할게요. 할 수 있는 한 착하게 굴고, 될 수만 있다면 내내 입도 다물게요. 하지만 학교에는 다시 안 가요. 정말이에요."`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`, bk:[`15-86`,`15-87`], cam:`right`,
   e:`(아주머니는 속으로 생각하셨대. '지금은 설득해 봐야 소용없겠어. 저 애는 한번 마음먹으면 지독하게 고집을 부릴 거야. 오늘 저녁에 레이첼한테 가서 상의해 봐야겠다.')`,
   l:`마릴라는 앤의 작은 얼굴에서 꺾이지 않는 고집을 보았다. '지금 앤을 설득해 봐야 소용없어. 이야기를 들어 보니 필립스 선생이 꽤 고압적으로 굴었던 것 같지만, 앤한테 그렇게 말할 수는 없지. 자식을 열이나 학교에 보낸 레이첼한테 가서 상의해 봐야겠다.'`},
  {bg:`ch2_lynde`, w:`lynde`, f:`marilla_strict`, o:`lynde`, bk:[`15-88`,`15-91`,`15-92`], cam:``,
   e:`린드 부인은 이불을 뜨고 계셨어. "학교 소동 때문에 왔지? 틸리 볼터가 다 얘기해 줬어." "레이첼, 어떻게 하면 좋겠어?"`,
   l:`린드 부인은 여느 때처럼 부지런하고 쾌활하게 이불을 뜨고 있었다. "학교에서 앤이 일으킨 소동 때문이겠지. 틸리 볼터가 들러서 다 이야기해 줬어." "저 애를 어떻게 해야 할지 모르겠어. 레이첼, 어떻게 하면 좋겠어?"`},
  {w:`lynde`, f:`marilla_strict`, o:`lynde`, bk:[`15-93`], cam:`in`,
   e:`린드 부인은 조언해 달라는 말을 제일 좋아하셨어. "내 생각엔 필립스 선생이 잘못했어. 성질부린 걸로 벌준 건 그렇다 쳐도, 늦은 다른 애들도 똑같이 벌을 받았어야지. 틸리 말로는 아이들이 다 앤 편이래. 앤이 아이들한테 꽤 인기가 있나 봐."`,
   l:`린드 부인은 누가 조언을 청하는 걸 무엇보다 좋아했다. "내가 보기엔 필립스 선생이 잘못했어. 어제 성질부린 걸로 벌준 건 잘한 일이지만, 오늘은 달랐어. 늦은 다른 애들도 앤과 똑같이 벌을 받았어야 했어. 그리고 벌로 여자애를 남자애 옆에 앉히는 건 점잖지 못한 일이야. 틸리 말로는 학생들이 다 앤 편이래. 어쩐 일인지 앤이 아이들한테 아주 인기가 좋은 모양이야."`},
  {w:`lynde`, f:`marilla_strict`, o:`lynde`, when:s => s.flags.askedFair,
   e:`"게다가 앤이 선생한테 '왜 저만 벌을 받냐'고 물었다며? 틸리가 그러는데, 그 말에 아무도 대답을 못 했대. 틀린 말이 아니었으니까."`,
   l:`"게다가 앤이 선생한테 '왜 저만 벌을 받느냐'고 물었다면서? 틸리 말로는 그 물음에 교실 누구도 토를 달지 못했대. 틀린 말이 아니었으니까."`},
  {w:`lynde`, f:`marilla_strict`, o:`lynde`, bk:[`15-95`],
   e:`"앤이 먼저 학교 얘기를 꺼낼 때까지 아무 말도 하지 마. 일주일쯤 지나면 마음이 풀려서 제 발로 학교에 가겠다고 할 거야. 틀림없어."`,
   l:`"앤이 먼저 꺼내기 전까지는 학교의 '학' 자도 꺼내지 마. 장담하는데, 일주일쯤 지나면 마음이 가라앉아서 제 발로 돌아가겠다고 할 거야. 억지로 보냈다간 또 무슨 생떼를 부릴지 누가 알겠어. 소란은 덜 피울수록 좋아."`},
  /* ---------- 가을 해 질 녘 ---------- */
  {bg:`ch2_room`, w:`anne`, in:1, f:`anne_sad`, bk:[`15-97`], cam:`out`,
   e:`그 뒤로 아무도 나한테 학교 얘기를 안 했어. 나는 집에서 공부하고, 집안일을 하고, 보랏빛 가을 저녁이면 다이애나와 놀았어. 길에서 길버트를 만나면 얼음장처럼 차갑게 지나쳤어.`,
   l:`그 뒤로 아무도 내게 학교 이야기를 꺼내지 않았다. 나는 집에서 공부하고, 집안일을 하고, 쌀쌀한 보랏빛 가을 해 질 녘이면 다이애나와 놀았다. 길에서 길버트 블라이스를 만나면 얼음장 같은 경멸을 담아 지나쳤다.`},
  {w:`anne`, in:1, f:`anne_sad`, when:s => s.flags.needTime,
   e:`길버트는 "기다릴게"라고 했었지. 정말로 기다리는 것 같았어. 그래서 더 화가 났는지도 몰라.`,
   l:`"기다릴게." 길버트는 그렇게 말했었다. 그리고 정말로 기다리는 듯했다. 그래서 오히려 더 마음이 복잡했는지도 모른다.`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`, bk:[`15-98`,`15-99`], cam:`in`,
   e:`어느 날 저녁, 사과 바구니를 들고 들어오신 아주머니가 동쪽 창가에서 혼자 엉엉 울고 있는 나를 발견하셨어. "이번엔 또 무슨 일이니, 앤?"`,
   l:`어느 날 저녁, 사과 한 바구니를 들고 과수원에서 들어온 마릴라 아주머니가 해 질 녘 동쪽 창가에서 홀로 서럽게 우는 나를 발견했다. "이번엔 또 무슨 일이니, 앤?"`},
  {t:`choice`, id:`C6`, kind:`predict`, label:`앤이 우는 까닭`, f:`anne_sad`, o:`marilla_strict`,
   q:{e:`앤은 왜 울고 있었을까요? 원작의 앤이 말한 까닭을 맞혀 보세요!`, l:`해 질 녘 창가에서 우는 앤. 원작의 앤은 무엇 때문에 울고 있었을까요?`},
   note:{e:`원작의 앤은 "다이애나가 어른이 되면 결혼해서 저를 두고 떠나 버릴 거예요!"라며 울어요. 아직 일어나지도 않은 일을 상상하며 우는 앤을 보고, 마릴라는 웃음을 참지 못하지요.`,
         l:`원작에서 앤은 먼 훗날 다이애나가 결혼해 떠나는 장면을 결혼식 들러리 드레스의 볼록한 소매까지 생생하게 상상하며 웁니다. 마릴라는 웃음을 터뜨리고 "걱정을 빌려 오려면 가까운 데서 빌려 오라"고 하지요.`},
   opts:[
    {type:`canon`, go:`w_c`, e:`"다이애나가 어른이 되면 결혼해서 저를 두고 떠나 버릴 거예요!"`, l:`"다이애나가 어른이 되면 결혼해서 저를 두고 떠나 버릴 거예요!"`, s:{e:`다이애나의 결혼을 상상하며 울었다`, l:`다이애나의 먼 결혼식을 상상해 울었다`}},
    {type:`imag`, go:`w_i`, e:`"다이애나가 마법에 걸려서 먼 나라 공주가 되어 떠나는 꿈을 꿨어요!"`, l:`"다이애나가 마법에 걸려 먼 나라의 공주가 되어 떠나는 꿈을 꾸었어요!"`, s:{e:`다이애나가 공주가 되어 떠나는 꿈 때문에`, l:`공주가 된 다이애나를 상상해 울었다`}},
    {type:`bal`, go:`w_b`, eff:{flag:`missSchool`}, e:`"학교에 안 가니까… 다이애나랑 함께 있는 시간이 너무 줄었어요."`, l:`"학교에 가지 않으니… 다이애나와 함께할 시간이 너무 줄어들었어요."`, s:{e:`다이애나와 함께할 시간이 줄어서`, l:`다이애나와의 시간이 줄어서 울었다`}}
   ]},
  {id:`w_c`, w:`anne`, f:`anne_sad`, o:`marilla_strict`, bk:[`15-100`],
   e:`"다이애나 때문이에요. 저는 다이애나 없인 못 살아요. 그런데 어른이 되면 다이애나는 결혼해서 저를 두고 떠날 거예요! 저는 다이애나 남편이 미워요. 정말 미치도록 미워요!"`,
   l:`"다이애나 때문이에요." 나는 실컷 흐느꼈다. "저는 다이애나 없이는 절대 못 살아요. 그런데 우리가 어른이 되면 다이애나는 결혼해서 저를 두고 멀리 떠나 버릴 거예요. 그럼 저는 어떡해요? 저는 다이애나 남편이 미워요. 정말 미치도록 미워요."`},
  {w:`anne`, f:`anne_dreamy`, o:`marilla_strict`, bk:[`15-100`], cam:`up`,
   e:`"다 상상해 봤어요. 다이애나는 눈처럼 하얀 드레스에 면사포를 쓰고 여왕처럼 아름다워요. 저는 신부 들러리예요. 소매가 볼록한 예쁜 드레스를 입었지만, 웃는 얼굴 뒤에 찢어지는 가슴을 숨기고… 다이애나에게 작별 인사를 해요. 안녀어어엉…"`,
   l:`"저는 다 상상해 봤어요. 결혼식이랑 모든 걸요. 다이애나는 눈처럼 새하얀 드레스에 면사포를 쓰고 여왕처럼 위엄 있어 보여요. 저는 신부 들러리예요. 소매가 볼록한 예쁜 드레스를 입었지만, 웃는 얼굴 뒤에 찢어지는 가슴을 숨기고 있어요. 그리고 다이애나에게 작별 인사를 해요, 안녀어어엉…"`},
  {t:`goto`, to:`w_m`},
  {id:`w_i`, w:`anne`, f:`anne_dreamy`, o:`marilla_strict`, fx:`dream`, cam:`up`,
   e:`"방금 꿈을 꿨어요! 다이애나가 마법에 걸려서 먼 바다 건너 왕국의 공주가 됐어요. 하얀 배를 타고 떠나는데, 저는 부두에 서서 손수건을 흔들었어요. 안녀어어엉…"`,
   l:`"방금 생생한 꿈을 꾸었어요. 다이애나가 마법에 걸려 바다 건너 왕국의 공주가 되었어요. 하얀 돛배를 타고 떠나는데, 저는 부두에 서서 손수건을 흔들었어요. 안녀어어엉…"`},
  {t:`goto`, to:`w_m`},
  {id:`w_b`, w:`anne`, f:`anne_sad`, o:`marilla_strict`,
   e:`"학교에 안 가니까… 다이애나랑 함께 있는 시간이 너무 줄었어요. 다이애나는 학교에서 '팬지' 책도 읽고 공놀이도 할 텐데, 저만 여기 있어요."`,
   l:`"학교에 가지 않으니… 다이애나와 함께할 시간이 너무 줄었어요. 다이애나는 학교에서 '팬지' 책도 읽고 공놀이도 할 텐데, 저만 여기 혼자 있어요."`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_warm`,
   e:`아주머니는 한참 나를 보시다가, 아주 조용히 말씀하셨어. "…그럼 네가 어떻게 하고 싶은지, 스스로 생각해 보려무나."`,
   l:`아주머니는 한참 나를 바라보다가 아주 조용히 말했다. "…그렇다면 네가 어떻게 하고 싶은지, 스스로 생각해 보려무나."`},
  {id:`w_m`, t:`ending`},

  /* ---------- 결말: 원작 ---------- */
  {id:`E_canon`, bg:`ch2_room`, w:`anne`, in:1, f:`anne_surprised`, o:`marilla_warm`, bk:[`15-101`], cam:`shake`, eff:{album:`e_canon`},
   e:`그런데 아주머니가 얼굴을 휙 돌리시더니, 의자에 털썩 주저앉아 큰 소리로 웃음을 터뜨리셨어! 아주머니가 그렇게 크게 웃는 건 처음 봤어.`,
   l:`그런데 마릴라 아주머니가 씰룩거리는 얼굴을 감추려 얼른 돌아서더니, 끝내 가장 가까운 의자에 털썩 주저앉아 평소와 달리 아주 크고 시원하게 웃음을 터뜨렸다.`},
  {w:`marilla`, f:`anne_surprised`, o:`marilla_warm`, bk:[`15-102`], cam:`in`,
   e:`"원, 앤 셜리. 걱정을 꼭 빌려 와야겠거든, 제발 좀 가까운 데서 빌려 오너라. 너한테 상상력이 있긴 있구나, 정말."`,
   l:`"원, 앤 셜리." 아주머니는 겨우 말을 할 수 있게 되자 말했다. "걱정을 꼭 빌려 와야겠거든, 제발 좀 가까운 데서 빌려 오너라. 너한테 상상력이 있긴 있구나, 정말."`},
  {t:`goto`, to:`E_last`},
  /* ---------- 결말: 상상 ---------- */
  {id:`E_imag`, bg:`ch2_room`, w:`anne`, f:`anne_dreamy`, o:`marilla_warm`, fx:`dream`, cam:`up`, eff:{album:`e_imag`},
   e:`"그래서 결심했어요! 다이애나랑 저는 어른이 되면 바닷가 절벽 위에 하얀 성을 짓고 둘이 함께 살 거예요. 성 이름은 '영원의 성'이고, 탑 꼭대기엔 해와 달 깃발을 달 거예요!"`,
   l:`"그래서 결심했어요. 다이애나와 저는 어른이 되면 바닷가 절벽 위에 하얀 성을 짓고 영원히 함께 살 거예요. 성의 이름은 '영원의 성', 탑 꼭대기엔 해와 달을 수놓은 깃발을 걸 거예요."`},
  {w:`marilla`, f:`anne_dreamy`, o:`marilla_warm`, fx:`dream`, cam:`shake`,
   e:`아주머니는 꾹 참다가 결국 의자에 털썩 앉아 크게 웃음을 터뜨리셨어. "원, 앤 셜리! 그 성엔 부엌도 있겠지? 설거지는 누가 하니?"`,
   l:`아주머니는 꾹꾹 참다가 끝내 의자에 털썩 주저앉아 크게 웃음을 터뜨렸다. "원, 앤 셜리! 그 성에도 부엌은 있겠지? 설거지는 누가 하고?"`},
  {t:`goto`, to:`E_last`},
  /* ---------- 결말: 균형 ---------- */
  {id:`E_bal`, bg:`ch2_room`, w:`anne`, in:1, f:`anne_sad`, o:`marilla_warm`, cam:`in`, eff:{album:`e_bal`},
   e:`나는 그날 밤 오래오래 생각했어. 필립스 선생님은 공평하지 않았어. 길버트도 미웠어. 하지만 그 사람들 때문에 다이애나와 '{vale}'을 지나 걷는 아침까지 포기하는 건… 너무 아까웠어.`,
   l:`그날 밤 나는 오래 생각했다. 필립스 선생님은 공평하지 않았다. 길버트도 여전히 미웠다. 그러나 그들 때문에 다이애나와 '{vale}'{vale|을} 지나 걷던 아침까지 내던지는 것은, 너무나 아까운 일이었다.`},
  {w:`anne`, f:`anne_happy`, o:`marilla_warm`,
   e:`"아주머니, 저… 조금만 더 마음을 가라앉히고 나면, 다시 학교에 가 볼래요. 길버트 때문이 아니라, 다이애나랑 저 자신을 위해서요."`,
   l:`"아주머니, 저… 마음이 조금 더 가라앉으면 다시 학교에 가 볼래요. 길버트 때문이 아니라, 다이애나와 저 자신을 위해서요."`},
  {w:`marilla`, f:`anne_happy`, o:`marilla_warm`, eff:{heart:{marilla:1}},
   e:`아주머니는 아무 말 없이 내 머리를 한 번 쓰다듬으셨어. 린드 부인 말이 딱 맞았네, 하는 얼굴이셨지.`,
   l:`아주머니는 아무 말 없이 내 머리를 한 번 쓰다듬었다. 레이첼 말이 꼭 맞았구나, 하는 얼굴이었다.`},
  {t:`goto`, to:`E_last`},
  /* ---------- 공통 마지막 장면 ---------- */
  {id:`E_last`, bg:`ch1_home`, w:`matthew`, f:`matthew`, bk:[`15-101`], cam:``,
   e:`그때 마당을 지나던 매슈 아저씨가 깜짝 놀라 걸음을 멈추셨어. 다락방 창문 너머로 마릴라 아주머니의 웃음소리가 흘러나오고 있었거든. "…마릴라가 저렇게 웃는 걸 들어 본 게 언제였더라."`,
   l:`마당을 가로지르던 매슈 아저씨가 깜짝 놀라 걸음을 멈추었다. 다락방 창 너머로 마릴라의 웃음소리가 흘러나오고 있었다. 마릴라가 저렇게 웃는 소리를 들어 본 게 대체 언제였던가.`},
  {w:`anne`, in:1, f:`anne_dreamy`, cam:`up`,

   e:`10월의 초록 지붕 집은 정말 아름다워. 골짜기의 자작나무는 햇빛처럼 금빛으로, 과수원 뒤 단풍나무는 왕처럼 진홍빛으로 물들었어. 나는 단풍나무 가지를 한 아름 꺾어 안았어.`,
   l:`10월의 초록 지붕 집은 아름다웠다. 골짜기의 자작나무는 햇빛처럼 금빛으로, 과수원 뒤 단풍나무는 장엄한 진홍빛으로 물들었고, 오솔길의 산벚나무들은 짙은 붉은빛과 청동빛 초록을 걸쳤다. 나는 그 빛깔의 세계 속에서 마음껏 즐거워했다.`},
  {bg:`ch2`, w:`anne`, f:`anne_happy`, o:`marilla_strict`, bk:[`16-3`], cam:`in`,

   l:`"아, 아주머니, 10월이 있는 세상에 살아서 정말 기뻐요. 9월에서 곧장 11월로 건너뛰어 버린다면 끔찍하지 않겠어요? 이 단풍나무 가지 좀 보세요. 가슴이 짜릿하지 않으세요? 여러 번 짜릿하지 않으세요?"`},
  {w:`marilla`, f:`anne_happy`, o:`marilla_strict`, bk:[`16-4`,`16-5`],

   l:`"지저분하게시리." 아름다움에 대한 감각이 그리 발달하지 않은 아주머니가 말했다. "침실은 잠자라고 있는 거다." "아, 꿈꾸라고도 있는 거예요, 아주머니. 예쁜 것들이 있는 방에서는 꿈을 훨씬 더 잘 꿀 수 있거든요."`},

   l:`다시 학교에 가 볼까 마음이 기울던 참이었다. 하지만 아직은 길버트의 얼굴을 마주할 자신이 없었다.`},
  {w:`marilla`, f:`anne_surprised`, o:`marilla_warm`, bk:[`16-6`,`16-8`], cam:`right`,

   l:`"오늘 오후엔 카모디 부인회 모임에 간다. 해 지기 전엔 못 올 테니, 매슈랑 제리 저녁은 네가 차려라. 그리고… 이게 잘하는 짓인지는 모르겠다만… 다이애나를 불러서 오후를 같이 보내고 여기서 차를 마셔도 좋다."`},
  {w:`anne`, f:`anne_happy`, o:`marilla_warm`, bk:[`16-9`,`16-10`], cam:`shake`,
   e:`"아, 아주머니! 정말 근사해요! 아주 어른스러울 거예요! 장미 꽃봉오리 찻잔 써도 돼요?" "절대 안 된다! 그건 목사님 오실 때만 쓰는 거다. 낡은 갈색 찻잔을 써라. 체리 절임이랑 과일 케이크는 내놓아도 된다."`,
   l:`"아, 아주머니!" 나는 두 손을 꼭 맞잡았다. "정말 근사해요! 아주머니도 상상할 줄 아시는군요. 정말 어른스럽고 멋질 거예요. 장미 꽃봉오리 찻잔 세트를 써도 돼요?" "절대 안 된다! 그건 목사님이나 부인회 손님 때만 쓰는 거다. 낡은 갈색 찻잔을 내놓아라. 노란 항아리의 체리 절임은 열어도 좋다. 과일 케이크도 좀 자르고."`},
  {w:`marilla`, f:`anne_happy`, o:`marilla_warm`, bk:[`16-12`], cam:`in`,

   l:`"그리고 지난번 교회 친목회 때 남은 산딸기 주스가 반쯤 든 병이 하나 있다. 거실 벽장 두 번째 칸에 있으니, 원하면 오후에 다이애나랑 쿠키 하나씩 곁들여 마셔도 좋다."`},

   l:`"거실은 '여왕의 연회장'이 될 거예요. 단풍 가지로 벽을 꾸미고, 갈색 찻잔은 황금 잔이라 상상하고, 다이애나는 이웃 나라에서 온 공주님이에요. 저는 물론 앤 여왕 폐하고요."`},
  {w:`marilla`, f:`anne_dreamy`, o:`marilla_strict`,
