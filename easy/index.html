[`15-25`, `"이제부터는 길버트가 너희 반에 들어올 거야." 다이애나가 말했다. "분명히 말하는데, 길버트는 늘 반에서 1등을 해 왔어. 열네 살이 다 됐는데 아직 4권밖에 안 배워. 4년 전에 길버트 아버지가 아프셔서 건강 때문에 앨버타로 가셔야 했는데, 길버트도 따라갔거든. 거기서 3년을 지내는 동안 길버트는 학교를 거의 못 다녔어. 이제부터는 1등 지키기가 그렇게 쉽지 않을걸, 앤."`],
[`15-26`, `"잘됐다." 앤이 얼른 말했다. "고작 아홉 살, 열 살짜리 꼬마들 사이에서 1등 하는 건 별로 자랑스럽지가 않았거든. 어제 '비등'이라는 낱말 철자를 맞혀서 내가 1등 자리로 올라갔어. 조시 파이가 1등이었는데, 글쎄 책을 몰래 훔쳐봤지 뭐야. 필립스 선생님은 못 보셨어. 프리시 앤드루스만 보고 계셨으니까. 하지만 나는 봤어. 그래서 얼음장 같은 경멸의 눈길을 한 번 휙 보내 줬더니, 조시가 홍당무처럼 빨개져서는 결국 철자를 틀리더라."`],
[`15-27`, `"파이네 여자애들은 하나같이 다 반칙쟁이야." 큰길 울타리를 넘으며 다이애나가 분개해서 말했다. "어제 거티 파이가 글쎄 시냇물에 있는 내 자리에 자기 우유병을 갖다 놨다니까. 그런 거 본 적 있어? 이제 거티랑 말 안 해."`],
[`15-28`, `필립스 선생님이 교실 뒤쪽에서 프리시 앤드루스의 라틴어를 봐 주고 있을 때, 다이애나가 앤에게 속삭였다.`],
[`15-29`, `"저기 통로 건너편에 바로 너랑 나란히 앉은 애가 길버트 블라이스야, 앤. 한번 봐 봐. 잘생기지 않았는지."`],
[`15-30`, `앤은 그 말대로 쳐다보았다. 마침 잘 볼 수 있는 기회였다. 길버트 블라이스는 앞자리에 앉은 루비 길리스의 기다란 노란 머리채를 의자 등받이에 몰래 핀으로 꽂아 두느라 정신이 팔려 있었다. 키가 크고, 갈색 곱슬머리에, 장난기 어린 담갈색 눈, 그리고 놀리는 듯한 미소로 입꼬리가 비뚜름하게 올라간 소년이었다. 곧 루비 길리스가 선생님께 산수 답을 보여 드리려고 일어서다가, 머리카락이 뿌리째 뽑힌 줄 알고 작은 비명을 지르며 의자로 도로 넘어졌다. 모두가 루비를 쳐다보았고, 필립스 선생님이 어찌나 무섭게 노려보았는지 루비는 울음을 터뜨렸다. 길버트는 핀을 잽싸게 감추고 세상에서 제일 진지한 얼굴로 역사책을 공부하고 있었다. 그러다 소동이 가라앉자 앤을 바라보며 말할 수 없이 익살맞게 윙크를 했다.`],
[`15-31`, `"너희 길버트 블라이스, 잘생기긴 했네." 앤이 다이애나에게 털어놓았다. "그런데 아주 뻔뻔한 것 같아. 처음 보는 여자애한테 윙크하는 건 예의가 아니야."`],
[`15-32`, `하지만 정말 일이 벌어지기 시작한 것은 오후가 되어서였다.`],
[`15-33`, `필립스 선생님은 구석에서 프리시 앤드루스에게 대수 문제를 설명하고 있었고, 나머지 학생들은 거의 제멋대로였다. 풋사과를 먹거나, 소곤거리거나, 석판에 그림을 그리거나, 실로 맨 귀뚜라미를 통로에서 이리저리 몰고 다녔다. 길버트 블라이스는 앤 셜리가 자기를 쳐다보게 하려고 애를 쓰고 있었지만 완전히 허탕이었다. 그 순간 앤은 길버트 블라이스가 이 세상에 있다는 것은 물론, 에이번리 학교의 다른 모든 학생과 에이번리 학교 자체도 까맣게 잊고 있었기 때문이다. 앤은 두 손으로 턱을 괴고, 서쪽 창 너머로 파랗게 언뜻 보이는 반짝이는 호수에 눈을 고정한 채, 화려한 꿈나라 저 멀리에서 자기만의 멋진 환상 말고는 아무것도 보지도 듣지도 않고 있었다.`],
[`15-34`, `길버트 블라이스는 여자애가 자기를 보게 하려고 애쓰다가 실패하는 일에 익숙하지 않았다. 저 애는 나를 봐야 해. 뾰족한 작은 턱에, 에이번리 학교의 어떤 여자애와도 다른 커다란 눈을 가진 저 빨간 머리 셜리라는 애 말이야.`],
[`15-35`, `길버트는 통로 너머로 손을 뻗어 앤의 기다란 빨간 머리채 끝을 집어 들더니, 팔을 쭉 뻗어 들어 올리고는 날카롭게 속삭였다.`],
[`15-36`, `"홍당무! 홍당무!"`],
[`15-37`, `그러자 앤이 길버트를 쳐다보았다. 그것도 아주 매섭게!`],
[`15-38`, `앤은 쳐다보는 것으로 끝나지 않았다. 벌떡 일어선 것이다. 찬란하던 공상은 산산이 부서져 다시는 되살릴 수 없게 되었다. 앤은 성난 눈빛을 길버트에게 번쩍 쏘아 보냈다. 그 눈에서 불꽃처럼 튀던 분노는 곧 그만큼 분한 눈물에 꺼져 버렸다.`],
[`15-39`, `"이 비열하고 못된 녀석!" 앤이 격렬하게 외쳤다. "네가 감히!"`],
[`15-40`, `그리고 그때, 퍽! 앤이 석판으로 길버트의 머리를 내리쳤고, 석판은, 머리 말고 석판은, 가운데가 쩍 갈라지고 말았다.`],
[`15-41`, `에이번리 학교는 언제나 구경거리를 즐겼다. 이건 특히나 즐거운 구경거리였다. 모두가 겁에 질리면서도 신이 나서 "어머!" 하고 소리쳤다. 다이애나는 숨을 헉 들이켰다. 쉽게 흥분하는 루비 길리스는 울음을 터뜨렸다. 토미 슬론은 입을 떡 벌리고 그 광경을 쳐다보느라 귀뚜라미 마차를 몽땅 놓쳐 버렸다.`],
[`15-42`, `필립스 선생님이 성큼성큼 통로를 걸어와 앤의 어깨에 묵직하게 손을 얹었다.`],
[`15-43`, `"앤 셜리, 이게 무슨 짓이냐?" 선생님이 화난 목소리로 말했다.`],
[`15-44`, `앤은 아무 대답도 하지 않았다. 온 학교 앞에서 자기가 '홍당무'라고 불렸다고 말하라는 건 사람으로서 너무 가혹한 일이었다. 대신 당당하게 나선 것은 길버트였다.`],
[`15-45`, `"제 잘못이에요, 필립스 선생님. 제가 놀렸어요."`],
[`15-46`, `필립스 선생님은 길버트의 말에 아무 관심도 기울이지 않았다.`],
[`15-47`, `"내 학생이 이런 성질머리와 이런 앙심을 드러내다니 유감이구나." 선생님은 엄숙한 말투로 말했다. 마치 자기 학생이라는 사실만으로도 작고 불완전한 인간들의 마음에서 온갖 나쁜 감정이 뿌리째 뽑혀야 마땅하다는 듯이. "앤, 오늘 오후 내내 칠판 앞 교단에 나가 서 있어라."`],
[`15-48`, `앤은 차라리 매를 맞는 편이 백배 나았을 것이다. 이 벌을 받는 동안 앤의 예민한 마음은 채찍을 맞은 것처럼 떨렸다. 앤은 하얗게 질려 굳은 얼굴로 시키는 대로 했다. 필립스 선생님은 분필을 집어 들고 앤의 머리 위 칠판에 이렇게 썼다.`],
[`15-49`, `"앤 셜리(Ann Shirley)는 성질이 아주 나쁘다. 앤 셜리는 성질을 다스리는 법을 배워야 한다." 그리고 글씨를 못 읽는 1학년 꼬마들까지 알아듣도록 그것을 소리 내어 읽었다.`],
[`15-50`, `앤은 그 글귀를 머리 위에 인 채 오후 내내 서 있었다. 울지도 고개를 숙이지도 않았다. 그러기엔 마음속 분노가 아직 너무 뜨거웠고, 그 분노가 끔찍한 굴욕 속에서 앤을 버티게 해 주었다. 앤은 원망 어린 눈과 분노로 새빨개진 뺨으로, 다이애나의 안쓰러워하는 눈길도, 찰리 슬론의 분개한 끄덕임도, 조시 파이의 심술궂은 미소도 똑같이 마주했다. 길버트 블라이스는 쳐다보지도 않았다. 다시는 그 애를 쳐다보지 않을 거야! 다시는 그 애랑 말도 하지 않을 거야!!`],
[`15-51`, `수업이 끝나자 앤은 빨간 머리를 꼿꼿이 쳐들고 걸어 나갔다. 길버트 블라이스가 현관문에서 앤을 가로막으려 했다.`],
[`15-52`, `"네 머리를 놀려서 정말 미안해, 앤." 길버트가 뉘우치며 속삭였다. "진심이야. 이제 그만 화 풀어, 응?"`],
[`15-53`, `앤은 쳐다보지도, 들은 척도 하지 않고 쌀쌀맞게 지나쳐 버렸다. "아, 어떻게 그럴 수가 있어, 앤?" 길을 내려가며 다이애나가 반쯤은 나무라듯, 반쯤은 감탄하듯 숨죽여 말했다. 다이애나는 자기라면 길버트의 부탁을 절대 뿌리치지 못했을 거라고 생각했다.`],
[`15-54`, `"나는 길버트 블라이스를 절대 용서하지 않을 거야." 앤이 단호하게 말했다. "게다가 필립스 선생님은 내 이름을 e도 없이 썼어. 쇠붙이가 내 영혼에 박혔어, 다이애나."`],
[`15-55`, `다이애나는 앤이 무슨 말을 하는지 전혀 몰랐지만, 뭔가 끔찍한 일이라는 것만은 알아들었다.`],
[`15-56`, `"길버트가 네 머리를 놀린 건 신경 쓰지 마." 다이애나가 달래듯 말했다. "걘 모든 여자애를 다 놀려. 내 머리가 너무 까맣다고 나도 놀려. 나를 까마귀라고 부른 게 열두 번은 될 거야. 그리고 길버트가 무슨 일로든 사과하는 건 나도 처음 들어 봤어."`],
[`15-57`, `"까마귀라고 불리는 것과 홍당무라고 불리는 건 하늘과 땅 차이야." 앤이 위엄 있게 말했다. "길버트 블라이스는 내 마음에 견딜 수 없는 상처를 줬어, 다이애나."`],
[`15-58`, `다른 일이 일어나지 않았다면 이 일은 더 큰 상처 없이 그냥 지나갔을지도 모른다. 하지만 일이란 한번 벌어지기 시작하면 줄줄이 이어지기 마련이다.`],
[`15-59`, `에이번리 학생들은 점심시간이면 언덕 너머 벨 씨네 넓은 목초지를 가로질러 그 가문비나무 숲에 가서 송진 껌을 따곤 했다. 거기서는 선생님이 하숙하는 에번 라이트 씨네 집이 잘 보였다. 필립스 선생님이 그 집에서 나오는 게 보이면 아이들은 학교로 달려갔다. 하지만 거리가 라이트 씨네 길보다 세 배는 멀어서, 아이들은 대개 숨을 헐떡이며 3분쯤 늦게 도착하곤 했다.`],
[`15-60`, `다음 날 필립스 선생님은 가끔 발작처럼 찾아오는 '개혁의 열정'에 사로잡혀, 점심을 먹으러 집에 가기 전에 이렇게 선언했다. 자기가 돌아왔을 때 모든 학생이 자리에 앉아 있어야 하며, 늦게 들어오는 사람은 벌을 받을 거라고.`],
[`15-61`, `남자애들은 전부, 그리고 여자애들 몇몇은 여느 때처럼 벨 씨네 가문비나무 숲으로 갔다. 다들 '씹을 것 한 조각'만 따고 금방 돌아올 생각이었다. 하지만 가문비나무 숲은 사람을 홀리고, 노란 송진 덩어리는 사람을 꾀는 법이다. 아이들은 송진을 따고, 꾸물거리고, 이리저리 헤매었다. 그리고 여느 때처럼 시간이 흘렀다는 걸 처음 일깨워 준 것은, 늙은 가문비나무 꼭대기에서 지미 글로버가 외친 소리였다. "선생님 온다!"`],
[`15-62`, `땅에 있던 여자애들이 먼저 출발해서, 간신히, 정말 1초도 남기지 않고 제시간에 학교에 닿았다. 허둥지둥 나무에서 기어 내려와야 했던 남자애들은 그보다 늦었다. 그리고 송진은 따지도 않고 숲 저편 끝에서 허리까지 오는 고사리 사이를 행복하게 거닐며 혼자 조용히 노래를 부르고 있던 앤이 가장 늦었다. 앤은 머리에 쌀백합 화관을 쓰고 있어서, 마치 그늘진 곳에 사는 숲의 여신 같았다. 하지만 앤은 사슴처럼 빨리 달릴 수 있었다. 앤은 정말로 달렸고, 그 결과 짓궂게도 문 앞에서 남자애들을 따라잡아, 필립스 선생님이 막 모자를 걸고 있을 때 남자애들 틈에 휩쓸려 교실로 들어가게 되었다.`],
[`15-63`, `필립스 선생님의 짧은 개혁 의지는 이미 끝나 있었다. 학생 열두 명을 벌주는 수고는 하고 싶지 않았다. 하지만 자기가 한 말을 지키려면 뭔가는 해야 했기에, 선생님은 희생양을 찾아 두리번거리다가 앤을 찾아냈다. 앤은 숨을 헐떡이며 자리에 털썩 주저앉아 있었는데, 깜빡 잊은 백합 화관이 한쪽 귀 위로 비뚜름하게 걸려 있어서 유난히 제멋대로이고 흐트러진 모습이었다.`],
[`15-64`, `"앤 셜리, 남자애들하고 어울리는 게 그렇게 좋은 모양이니, 오늘 오후엔 그 취향을 마음껏 즐기게 해 주마." 선생님이 비꼬듯 말했다. "머리에서 그 꽃 떼고, 길버트 블라이스 옆에 가서 앉아라."`],
[`15-65`, `다른 남자애들이 킥킥거렸다. 다이애나는 안쓰러움에 하얗게 질려서 앤의 머리에서 화관을 떼어 내고 앤의 손을 꼭 쥐었다. 앤은 돌로 변한 것처럼 선생님을 빤히 쳐다보았다.`],
[`15-66`, `"내 말 못 들었니, 앤?" 필립스 선생님이 엄하게 물었다.`],
[`15-67`, `"들었어요, 선생님." 앤이 천천히 말했다. "하지만 진심으로 하신 말씀인 줄은 몰랐어요."`],
[`15-68`, `"진심이고말고." 여전히 비꼬는 말투였다. 아이들 모두가, 특히 앤이 정말 싫어하는 그 말투였다. 그 말투가 앤의 아픈 데를 후벼 팠다. "당장 시키는 대로 해."`],
[`15-69`, `잠깐 동안 앤은 따르지 않을 것처럼 보였다. 하지만 어쩔 수 없다는 걸 깨닫고는 도도하게 일어나 통로를 건너가 길버트 블라이스 옆에 앉더니, 책상 위에 팔을 괴고 얼굴을 파묻었다. 얼굴이 파묻히기 직전에 그 얼굴을 언뜻 본 루비 길리스는 하굣길에 다른 아이들에게 "진짜로 그런 얼굴은 처음 봤어. 새하얀데 무시무시한 빨간 점들이 박혀 있었어"라고 말했다.`],
[`15-70`, `앤에게 그것은 세상의 끝이었다. 똑같이 잘못한 열두 명 가운데서 혼자만 콕 집어 벌을 받은 것도 억울했다. 남자애 옆에 가서 앉으라는 건 더 심했다. 그런데 그 남자애가 하필 길버트 블라이스라니, 그건 상처에 모욕을 쌓아 올리는 것이어서 도저히 견딜 수가 없었다. 앤은 견딜 수 없을 것 같았고, 견디려 애써 봐야 소용없다고 느꼈다. 온몸이 수치와 분노와 굴욕으로 부글부글 끓었다.`],
[`15-71`, `처음에는 다른 학생들이 쳐다보고, 소곤거리고, 킥킥대고, 서로 옆구리를 찔렀다. 하지만 앤은 한 번도 고개를 들지 않았고, 길버트는 온 정신을 오로지 분수 문제에만 쏟는 것처럼 문제를 풀었기 때문에, 아이들은 곧 자기 공부로 돌아갔고 앤은 잊혔다. 필립스 선생님이 역사반을 불러냈을 때 앤도 나갔어야 했다. 하지만 앤은 꼼짝도 하지 않았고, 반을 불러내기 전에 '프리실라에게'라는 시를 쓰고 있던 필립스 선생님은 아직 잘 맞지 않는 운율을 궁리하느라 앤이 없다는 것도 알아차리지 못했다. 한번은 아무도 보지 않을 때, 길버트가 책상에서 '너는 달콤해'라는 금빛 글귀가 적힌 작은 분홍 하트 사탕을 꺼내 앤의 팔꿈치 안쪽으로 슬쩍 밀어 넣었다. 그러자 앤은 일어나서 분홍 하트를 손끝으로 조심스럽게 집어 바닥에 떨어뜨리고, 구두 뒤꿈치로 짓이겨 가루로 만들어 버렸다. 그러고는 길버트에게 눈길 한 번 주지 않고 다시 원래 자세로 돌아갔다.`],
[`15-72`, `수업이 끝나자 앤은 자기 책상으로 성큼성큼 걸어가, 보란 듯이 안에 든 것을 몽땅 꺼냈다. 책과 공책, 펜과 잉크, 성경과 산수책까지 모두 꺼내 금이 간 석판 위에 가지런히 쌓았다.`],
[`15-73`, `"그걸 다 왜 집에 가져가는 거야, 앤?" 길에 나서자마자 다이애나가 물었다. 그전까지는 감히 물어볼 엄두가 나지 않았던 것이다.`],
[`15-74`, `"나 이제 학교에 안 다닐 거야." 앤이 말했다.`],
[`15-75`, `다이애나는 숨을 헉 들이켜고, 진심인지 확인하려고 앤을 빤히 쳐다보았다.`],
[`15-76`, `"마릴라 아주머니가 집에 있게 해 주실까?" 다이애나가 물었다.`],
[`15-77`, `"그러셔야 할 거야." 앤이 말했다. "다시는 그 사람한테 배우러 학교에 가지 않을 거야."`],
[`15-78`, `"아, 앤!" 다이애나는 금방이라도 울 것 같았다. "너 정말 너무해. 나는 어떡하라고? 필립스 선생님은 나를 그 끔찍한 거티 파이 옆에 앉힐 거야. 거티가 혼자 앉아 있으니까 분명 그럴 거야. 제발 돌아와, 앤."`],
[`15-79`, `"너를 위해서라면 세상에서 거의 무슨 일이든 할 수 있어, 다이애나." 앤이 슬프게 말했다. "너한테 도움이 된다면 내 팔다리가 갈가리 찢겨도 좋아. 하지만 이것만은 안 돼. 그러니까 제발 부탁하지 마. 네가 그러면 내 영혼이 갈기갈기 찢어져."`],
[`15-80`, `"놓치게 될 재미있는 일들을 생각해 봐." 다이애나가 슬퍼하며 말했다. "우리 시냇가에 세상에서 제일 예쁜 새 소꿉놀이 집을 지을 거야. 그리고 다음 주엔 공놀이를 할 건데, 너 공놀이 한 번도 안 해 봤잖아, 앤. 엄청엄청 신난다니까. 그리고 새 노래도 배울 거야. 제인 앤드루스가 지금 연습하고 있어. 그리고 앨리스 앤드루스가 다음 주에 새 '팬지' 책을 가져오면, 우리 모두 시냇가에서 한 장씩 돌아가며 소리 내어 읽을 거야. 너 소리 내어 읽는 거 정말 좋아하잖아, 앤."`],
[`15-81`, `그 무엇도 앤의 마음을 조금도 움직이지 못했다. 앤은 마음을 정했다. 다시는 필립스 선생님에게 배우러 학교에 가지 않겠다고. 앤은 집에 돌아와 마릴라에게도 그렇게 말했다.`],
[`15-82`, `"말도 안 되는 소리." 마릴라가 말했다.`],
[`15-83`, `"전혀 말도 안 되는 소리가 아니에요." 앤이 엄숙하고 원망 어린 눈으로 마릴라를 바라보며 말했다. "모르시겠어요, 아주머니? 저는 모욕을 당했어요."`],
[`15-84`, `"모욕은 무슨! 내일 평소처럼 학교에 가거라."`],
[`15-85`, `"아, 아니에요." 앤이 부드럽게 고개를 저었다. "저는 다시 안 가요, 아주머니. 공부는 집에서 할게요. 할 수 있는 한 착하게 굴고, 될 수만 있다면 내내 입도 다물고 있을게요. 하지만 학교에는 다시 안 가요. 정말이에요."`],
[`15-86`, `마릴라는 앤의 작은 얼굴에 꺾이지 않는 고집 같은 것이 어려 있는 것을 보았다. 그 고집을 꺾으려면 꽤 애를 먹으리라는 걸 알았다. 하지만 마릴라는 현명하게도 당장은 더 이상 아무 말도 하지 않기로 했다.`],
[`15-87`, `'오늘 저녁에 레이첼한테 가서 상의해 봐야겠어.' 마릴라는 생각했다. '지금 앤을 설득해 봐야 소용없어. 너무 흥분했으니까. 저 애가 한번 마음먹으면 지독하게 고집을 부릴 수 있겠다는 생각이 들어. 저 애 이야기를 들어 보니, 필립스 선생이 꽤 고압적으로 일을 처리한 것 같아. 하지만 앤한테 그렇게 말할 수는 없지. 레이첼하고 이야기해 봐야겠다. 자식을 열 명이나 학교에 보낸 사람이니 뭘 좀 알 거야. 게다가 지금쯤이면 이야기도 다 들었을 테고.'`],
[`15-88`, `마릴라가 가 보니 린드 부인은 여느 때처럼 부지런하고 쾌활하게 이불을 뜨고 있었다.`],
[`15-89`, `"내가 무슨 일로 왔는지 알겠지." 마릴라가 조금 쑥스러워하며 말했다.`],
[`15-90`, `레이첼 부인이 고개를 끄덕였다.`],
[`15-91`, `"학교에서 앤이 일으킨 소동 때문이겠지." 부인이 말했다. "틸리 볼터가 학교에서 돌아가는 길에 들러서 다 이야기해 줬어."`],
[`15-92`, `"저 애를 어떻게 해야 할지 모르겠어." 마릴라가 말했다. "다시는 학교에 안 가겠다고 우기는 거야. 그렇게까지 흥분한 아이는 처음 봐. 학교에 다니기 시작한 뒤로 언젠가는 말썽이 날 줄 알았어. 일이 너무 순조로워서 오래 못 갈 줄 알았지. 워낙 예민한 애니까. 레이첼, 어떻게 하면 좋겠어?"`],
[`15-93`, `"글쎄, 나한테 조언을 구한다니 말인데, 마릴라." 린드 부인이 상냥하게 말했다. 린드 부인은 누가 조언을 청하는 걸 무엇보다 좋아했다. "나 같으면 처음엔 조금 비위를 맞춰 주겠어. 그게 내 생각이야. 내가 보기엔 필립스 선생이 잘못했어. 물론 아이들한테 그렇게 말하면 안 되지. 그리고 어제 성질부린 걸로 앤을 벌준 건 물론 잘한 일이야. 하지만 오늘은 달랐어. 늦은 다른 애들도 앤과 똑같이 벌을 받았어야 했어. 그게 맞지. 그리고 벌로 여자애를 남자애 옆에 앉히는 건 나는 찬성 못 해. 그건 점잖지 못한 일이야. 틸리 볼터가 정말 분개하더라고. 처음부터 끝까지 앤 편을 들면서, 학생들도 다 그렇다고 했어. 어쩐 일인지 앤이 아이들한테 아주 인기가 좋은 모양이야. 그렇게 잘 어울릴 줄은 생각도 못 했는데."`],
[`15-94`, `"그러니까 정말 집에 있게 하는 게 낫다는 거야?" 마릴라가 깜짝 놀라 물었다.`],
[`15-95`, `"그래. 그러니까 앤이 먼저 학교 이야기를 꺼내기 전까지는 학교의 '학' 자도 꺼내지 말라는 거야. 장담하는데, 마릴라, 일주일쯤 지나면 앤은 마음이 가라앉아서 제 발로 학교에 돌아가겠다고 할 거야. 틀림없어. 그런데 지금 당장 억지로 보내면, 그 애가 다음엔 또 무슨 별난 짓이나 생떼를 부려서 더 큰 말썽을 일으킬지 누가 알겠어. 내 생각엔 소란을 덜 피울수록 좋아. 학교에 안 간다고 해서 앤이 크게 놓치는 것도 없어. 필립스 선생은 선생으로선 영 꽝이거든. 교실 질서는 엉망이지, 그게 맞아. 그리고 꼬맹이들은 내팽개치고, 퀸스에 보낼 큰 학생들한테만 시간을 다 쏟아. 삼촌이 학교 이사가 아니었으면 1년 더 그 자리를 맡지도 못했을 거야. 그냥 이사가 아니라 '바로 그' 이사지. 나머지 두 사람을 코를 꿰어 끌고 다니니까. 정말이지, 이 섬의 교육이 어떻게 되려는지 모르겠어."`],
[`15-96`, `레이첼 부인은 고개를 저었다. 마치 자기가 이 주의 교육을 책임지기만 하면 모든 게 훨씬 잘 돌아갈 거라고 말하는 것 같았다.`],
[`15-97`, `마릴라는 레이첼 부인의 조언을 따랐다. 그리고 학교에 다시 가라는 말은 앤에게 한마디도 하지 않았다. 앤은 집에서 공부하고, 집안일을 하고, 쌀쌀한 보랏빛 가을 해 질 녘이면 다이애나와 놀았다. 하지만 길에서 길버트 블라이스를 만나거나 주일 학교에서 마주치면, 얼음장 같은 경멸을 담아 그냥 지나쳐 버렸다. 앤의 마음을 풀어 주고 싶어 하는 길버트의 기색이 뻔히 보였지만, 그 얼음은 조금도 녹지 않았다. 다이애나가 화해를 시키려고 애써도 소용없었다. 앤은 평생 길버트 블라이스를 미워하기로 마음먹은 게 분명했다.`],
[`15-98`, `그러나 길버트를 미워하는 만큼, 앤은 다이애나를 사랑했다. 좋아하는 것도 싫어하는 것도 똑같이 뜨거운, 그 정열적인 작은 가슴의 온 사랑을 다해서. 어느 날 저녁, 사과 한 바구니를 들고 과수원에서 들어온 마릴라는 해 질 녘 동쪽 창가에 혼자 앉아 서럽게 울고 있는 앤을 발견했다.`],
[`15-99`, `"이번엔 또 무슨 일이니, 앤?" 마릴라가 물었다.`],
[`15-100`, `"다이애나 때문이에요." 앤이 실컷 흐느끼며 말했다. "저는 다이애나를 정말 사랑해요, 아주머니. 다이애나 없이는 절대 못 살아요. 그런데 우리가 어른이 되면 다이애나는 결혼해서 저를 두고 멀리 떠나 버릴 거예요. 그럼 저는 어떡해요? 저는 다이애나 남편이 미워요. 정말 미치도록 미워요. 저는 다 상상해 봤어요. 결혼식이랑 모든 걸요. 다이애나는 눈처럼 새하얀 드레스에 면사포를 쓰고, 여왕처럼 아름답고 위엄 있어 보여요. 그리고 저는 신부 들러리예요. 저도 예쁜 드레스를 입었는데, 소매도 볼록해요. 하지만 웃는 얼굴 뒤에 찢어지는 가슴을 숨기고 있어요. 그리고 다이애나에게 작별 인사를 해요, 안녀어어엉…" 여기서 앤은 완전히 무너져 더 서럽게 울었다.`],
[`15-101`, `마릴라는 씰룩거리는 얼굴을 감추려고 얼른 돌아섰다. 하지만 소용없었다. 마릴라는 가장 가까운 의자에 털썩 주저앉아, 평소와 달리 아주 크고 시원하게 웃음을 터뜨렸다. 그 소리에 마당을 가로지르던 매슈가 깜짝 놀라 걸음을 멈췄다. 마릴라가 저렇게 웃는 소리를 들어 본 게 언제였더라?`],
[`15-102`, `"원, 앤 셜리." 마릴라는 겨우 말을 할 수 있게 되자 말했다. "걱정을 꼭 빌려 와야겠거든, 제발 좀 가까운 데서 빌려 오너라. 너한테 상상력이 있긴 있구나, 정말."`],
  ]
};

/* 원문 책장: 원작 16~17장 — 이 앱을 위해 새로 우리말로 옮김 */
BOOK.ch5 = {
  title: `다이애나를 초대한 다과회의 비극 · 삶의 새로운 재미`,
  orig: `원작 16~17장`,
  paras: [
[`h`, `원작 16장 「다이애나를 초대한 다과회의 비극」`],
[`16-1`, `초록 지붕 집의 10월은 아름다웠다. 골짜기의 자작나무들은 햇빛처럼 금빛으로 물들고, 과수원 뒤의 단풍나무들은 장엄한 진홍빛이 되고, 오솔길을 따라 선 산벚나무들은 짙은 붉은빛과 청동빛 도는 초록으로 더없이 곱게 차려입었다. 그리고 들판은 두 번째로 자란 풀 위로 햇볕을 쬐고 있었다.`],
[`16-2`, `앤은 주위의 온갖 빛깔 속에서 마음껏 즐거워했다.`],
[`16-3`, `"아, 아주머니." 어느 토요일 아침, 앤이 화려한 나뭇가지를 한 아름 안고 춤추듯 들어오며 외쳤다. "10월이 있는 세상에 살아서 정말 기뻐요. 9월에서 곧장 11월로 건너뛰어 버린다면 끔찍하지 않겠어요? 이 단풍나무 가지 좀 보세요. 가슴이 짜릿하지 않으세요? 여러 번 짜릿하지 않으세요? 이걸로 제 방을 꾸밀 거예요."`],
[`16-4`, `"지저분하게시리." 아름다움을 느끼는 감각이 그다지 발달하지 않은 마릴라가 말했다. "넌 바깥 물건들로 방을 너무 어지럽혀, 앤. 침실은 잠자라고 있는 거다."`],
[`16-5`, `"아, 꿈꾸라고도 있는 거예요, 아주머니. 그리고 예쁜 것들이 있는 방에서는 꿈을 훨씬 더 잘 꿀 수 있어요. 이 가지들은 낡은 파란 물주전자에 꽂아서 제 탁자 위에 둘 거예요."`],
[`16-6`, `"그럼 계단에 잎사귀 떨어뜨리지 않게 조심해라. 앤, 나는 오늘 오후에 카모디에서 열리는 부인회 모임에 간다. 아마 해 지기 전엔 못 돌아올 거야. 매슈하고 제리 저녁은 네가 차려 줘야 한다. 그러니 지난번처럼 식탁에 앉을 때까지 차 우리는 걸 잊어버리지 않도록 조심해라."`],
[`16-7`, `"그걸 잊어버린 건 정말 끔찍한 일이었어요." 앤이 미안해하며 말했다. "하지만 그날 오후엔 제비꽃 골짜기 이름을 생각해 내려고 애쓰느라 다른 생각이 다 밀려나 버렸거든요. 매슈 아저씨는 정말 좋으셨어요. 조금도 꾸짖지 않으셨어요. 아저씨가 직접 차를 우리시면서, 조금 기다리는 것도 괜찮다고 하셨어요. 그리고 기다리는 동안 제가 아름다운 요정 이야기를 해 드렸더니, 아저씨는 시간이 하나도 길게 느껴지지 않으셨대요. 정말 아름다운 요정 이야기였어요, 아주머니. 끝을 잊어버려서 제가 끝을 지어냈는데, 아저씨는 어디서부터 지어낸 건지 하나도 모르겠다고 하셨어요."`],
[`16-8`, `"매슈는 네가 한밤중에 일어나서 저녁을 먹겠다고 해도 괜찮다고 할 거다, 앤. 하지만 이번엔 정신 바짝 차려라. 그리고… 이게 잘하는 짓인지는 모르겠다만… 너를 더 들뜨게 만들지도 모르지만… 다이애나를 불러서 오후를 같이 보내고 여기서 차를 마셔도 좋다."`],
[`16-9`, `"아, 아주머니!" 앤이 두 손을 꼭 맞잡았다. "정말 근사해요! 아주머니도 상상할 줄 아시는군요. 그렇지 않으면 제가 바로 그걸 얼마나 바랐는지 아실 리가 없잖아요. 정말 어른스럽고 멋질 거예요. 손님이 오면 차 우리는 걸 잊을 걱정은 없어요. 아, 아주머니, 장미 꽃봉오리 무늬 찻잔 세트를 써도 돼요?"`],
[`16-10`, `"절대 안 된다! 장미 꽃봉오리 찻잔이라니! 원, 다음엔 또 뭘 달라고 할 테냐? 그건 목사님이나 부인회 손님이 올 때만 쓰는 거 알잖니. 낡은 갈색 찻잔 세트를 내놓아라. 하지만 노란 작은 항아리에 든 체리 절임은 열어도 된다. 어차피 이제 먹을 때가 됐어. 슬슬 발효되기 시작한 것 같으니까. 그리고 과일 케이크를 좀 자르고, 쿠키랑 생강 과자도 내놓으렴."`],
[`16-11`, `"제가 식탁 윗자리에 앉아서 차를 따르는 모습이 눈에 선해요." 앤이 황홀한 듯 눈을 감으며 말했다. "그리고 다이애나한테 설탕 넣겠냐고 묻는 거예요! 안 넣는다는 건 알지만, 물론 모르는 척하고 물어볼 거예요. 그리고 과일 케이크 한 조각 더, 체리 절임 한 숟가락 더 먹으라고 권하는 거예요. 아, 아주머니, 생각만 해도 정말 황홀해요. 다이애나가 오면 모자 벗어 놓으라고 손님방에 데려가도 돼요? 그리고 앉을 때는 응접실로 가도 돼요?"`],
[`16-12`, `"안 된다. 너랑 네 손님은 거실이면 충분해. 하지만 지난번 교회 친목회 때 남은 산딸기 주스가 반쯤 든 병이 하나 있다. 거실 벽장 두 번째 칸에 있으니, 원하면 오후에 다이애나랑 쿠키 하나씩 곁들여 마셔도 좋다. 매슈는 배에 감자를 실어 나르느라 아마 저녁 차 시간에 늦게 들어올 테니까."`],
[`16-13`, `앤은 골짜기로 날듯이 내려가 드라이어드의 샘을 지나고 가문비나무 오솔길을 올라 과수원 비탈 집으로 다이애나를 초대하러 갔다. 그 결과, 마릴라가 마차를 타고 카모디로 떠나자마자 다이애나가 건너왔다. 두 번째로 좋은 옷을 차려입고, 차 마시러 초대받은 손님이 갖춰야 할 모습 그대로였다. 다른 때 같으면 노크도 없이 부엌으로 뛰어 들어왔을 텐데, 지금은 현관문을 얌전하게 두드렸다. 그리고 역시 두 번째로 좋은 옷을 입은 앤이 그만큼 얌전하게 문을 열어 주자, 두 아이는 처음 만난 사람들처럼 엄숙하게 악수를 나누었다. 이 어색한 엄숙함은 다이애나가 모자를 벗어 놓으러 동쪽 다락방에 다녀온 뒤 거실에서 발끝을 가지런히 모으고 10분을 앉아 있을 때까지 이어졌다.`],
[`16-14`, `"어머님은 안녕하시니?" 앤이 공손하게 물었다. 그날 아침 배리 부인이 아주 건강하고 기운찬 모습으로 사과를 따는 걸 보지 못한 사람처럼.`],
[`16-15`, `"아주 잘 지내셔, 고마워. 커스버트 아저씨는 오늘 오후에 백합 모래톱으로 감자를 실어 나르시는 모양이지?" 다이애나가 말했다. 다이애나는 그날 아침 매슈의 마차를 얻어 타고 하먼 앤드루스 씨 댁까지 다녀온 참이었다.`],
[`16-16`, `"응. 올해는 우리 감자 농사가 아주 잘됐어. 너희 아버지 감자 농사도 잘됐으면 좋겠다."`],
[`16-17`, `"그럭저럭 잘됐어, 고마워. 너희는 사과를 벌써 많이 땄니?"`],
[`16-18`, `"아, 아주 많이!" 앤은 점잔 빼는 것도 잊고 벌떡 일어났다. "과수원에 가서 빨간 달콤이 사과 좀 따자, 다이애나. 아주머니가 나무에 남은 건 다 따 먹어도 된대. 아주머니는 정말 인심이 후하신 분이야. 차 마실 때 과일 케이크랑 체리 절임도 먹어도 된다고 하셨어. 하지만 손님한테 뭘 먹을지 미리 말하는 건 예의가 아니니까, 마실 건 뭐라고 하셨는지 말 안 할게. 산딸기로 만든 거고 새빨간 색이라는 것만 알려 줄게. 난 새빨간 음료가 정말 좋아. 너도 그렇지? 다른 색보다 두 배는 맛있잖아."`],
[`16-19`, `가지가 땅에 닿도록 열매가 휘어지게 달린 과수원은 정말 즐거워서, 두 아이는 오후 대부분을 그곳에서 보냈다. 서리를 피해 아직 초록빛이 남아 있고 부드러운 가을 햇살이 따뜻하게 머무는 풀밭 구석에 앉아, 사과를 먹으며 쉴 새 없이 이야기를 나누었다. 다이애나는 학교에서 일어난 일을 앤에게 잔뜩 들려주었다. 거티 파이랑 짝이 됐는데 정말 싫다는 것, 거티가 석필로 계속 끽끽 소리를 내서 피가 다 얼어붙는 것 같다는 것. 루비 길리스가 개울가에 사는 메리 조 할머니한테 받은 마법의 조약돌로 사마귀를 모두 없앴다는 것, 정말이라는 것. 사마귀를 조약돌로 문지른 다음, 초승달이 뜰 때 그 돌을 왼쪽 어깨 너머로 던지면 사마귀가 다 사라진다는 것. 찰리 슬론의 이름이 엠 화이트의 이름이랑 같이 현관 벽에 쓰여서 엠 화이트가 엄청 화났다는 것. 샘 볼터가 수업 시간에 필립스 선생님한테 말대꾸를 했다가 회초리를 맞았는데, 샘의 아버지가 학교로 찾아와서 다시 한번 자기 아이들한테 손을 대 보라고 선생님한테 따졌다는 것. 매티 앤드루스가 새 빨간 두건이랑 술 달린 파란 숄을 새로 장만했는데 그걸로 잘난 척하는 꼴이 정말 못 봐주겠다는 것. 리지 라이트가 메이미 윌슨이랑 말을 안 한다는 것. 메이미 윌슨의 다 큰 언니가 리지 라이트의 다 큰 언니의 남자 친구를 가로챘기 때문이라는 것. 그리고 모두들 앤을 무척 보고 싶어 하고 앤이 다시 학교에 오기를 바란다는 것. 그리고 길버트 블라이스가…`],
[`16-20`, `하지만 앤은 길버트 블라이스 이야기는 듣고 싶지 않았다. 앤은 서둘러 일어나서, 이제 들어가서 산딸기 주스를 마시자고 말했다.`],
[`16-21`, `앤은 거실 찬장 두 번째 칸을 살펴보았지만, 거기에 산딸기 주스 병은 없었다. 찾아보니 맨 위 칸 안쪽 깊숙이에 병이 하나 있었다. 앤은 그것을 쟁반에 담아 큰 유리잔 하나와 함께 식탁에 놓았다.`],
[`16-22`, `"자, 어서 마셔, 다이애나." 앤이 공손하게 말했다. "나는 지금은 안 마실래. 사과를 그렇게 먹었더니 생각이 없네."`],
[`16-23`, `다이애나는 잔에 가득 따라서, 그 새빨간 빛깔을 감탄하며 바라보고는 얌전하게 홀짝였다.`],
[`16-24`, `"정말 맛있는 산딸기 주스다, 앤." 다이애나가 말했다. "산딸기 주스가 이렇게 맛있는 줄 몰랐어."`],
[`16-25`, `"마음에 든다니 정말 기뻐. 마시고 싶은 만큼 마셔. 나는 나가서 불 좀 들쑤셔 놓고 올게. 집안 살림을 맡으면 신경 쓸 게 정말 많아, 그렇지?"`],
[`16-26`, `앤이 부엌에서 돌아와 보니 다이애나는 두 번째 잔을 마시고 있었다. 그리고 앤이 더 마시라고 권하자, 세 번째 잔을 마시는 것도 딱히 마다하지 않았다. 잔은 큼직했고, 산딸기 주스는 확실히 아주 맛있었다.`],
[`16-27`, `"이렇게 맛있는 건 처음 마셔 봐." 다이애나가 말했다. "린드 부인 것보다 훨씬 맛있어. 린드 부인은 자기 주스 자랑을 그렇게 하시는데. 린드 부인 것하고는 맛이 하나도 안 비슷해."`],
[`16-28`, `"마릴라 아주머니의 산딸기 주스가 린드 부인 것보다 아마 훨씬 맛있을 거야." 앤이 의리 있게 말했다. "아주머니는 이름난 요리 솜씨를 가지셨거든. 나한테도 요리를 가르쳐 주시려고 하는데, 정말이지, 다이애나, 그건 산을 오르는 것처럼 힘든 일이야. 요리에는 상상할 여지가 거의 없어. 그냥 규칙대로만 해야 하거든. 지난번에 케이크를 만들 때는 밀가루 넣는 걸 잊어버렸어. 너랑 나에 대한 정말 아름다운 이야기를 생각하고 있었거든, 다이애나. 네가 천연두에 걸려서 몹시 아픈데 모두가 너를 버리고 떠나. 하지만 나는 용감하게 네 머리맡으로 가서 너를 간호해 살려 내지. 그리고 내가 천연두에 걸려서 죽어. 나는 묘지의 포플러나무 아래 묻히고, 너는 내 무덤가에 장미 덤불을 심고 네 눈물로 물을 줘. 그리고 너는 너를 위해 목숨을 바친 어린 시절 친구를 절대, 절대 잊지 않아. 아, 정말 슬픈 이야기였어, 다이애나. 케이크 반죽을 섞는 동안 눈물이 뺨 위로 비 오듯 쏟아졌어. 그런데 밀가루를 잊어버려서 케이크는 비참하게 실패했어. 알다시피 케이크에는 밀가루가 꼭 있어야 하잖아. 아주머니는 몹시 화가 나셨는데, 그럴 만도 해. 나는 아주머니께 커다란 골칫거리야. 지난주엔 푸딩 소스 때문에 아주머니가 엄청 창피를 당하셨어. 화요일 점심에 자두 푸딩을 먹었는데, 푸딩이 반이랑 소스가 한 주전자 남았어. 아주머니가 그거면 한 끼 더 먹을 수 있겠다고 하시면서, 찬장 선반에 올려놓고 뚜껑을 덮어 두라고 하셨어. 나는 정말 꼭 덮을 생각이었어, 다이애나. 그런데 그걸 들고 가면서 내가 수녀라고 상상하고 있었어. 물론 나는 개신교도지만 가톨릭 신자라고 상상했지. 찢어진 마음을 묻으려고 수녀원에 들어가는 거야. 그러느라 푸딩 소스 덮는 걸 까맣게 잊어버렸어. 다음 날 아침에 생각이 나서 찬장으로 달려갔어. 다이애나, 그 푸딩 소스에 생쥐가 한 마리 빠져 죽어 있는 걸 봤을 때 내가 얼마나 끔찍했을지 상상해 봐! 나는 숟가락으로 생쥐를 건져서 마당에 내던지고, 숟가락을 물에 세 번 씻었어. 아주머니는 젖을 짜러 나가 계셨는데, 들어오시면 그 소스를 돼지한테 줄지 여쭤볼 생각이었어. 그런데 아주머니가 들어오셨을 때 나는 서리 요정이 되어 숲을 지나며 나무들을 원하는 대로 빨갛게, 노랗게 물들이는 상상을 하고 있었어. 그래서 푸딩 소스 생각은 다시는 안 났고, 아주머니는 나한테 사과를 따 오라고 하셨지. 그런데 그날 아침에 스펜서베일에 사는 체스터 로스 씨 부부가 오셨어. 알지, 아주 멋쟁이 분들이잖아. 특히 체스터 로스 부인이. 아주머니가 나를 부르셨을 때는 점심이 다 차려져 있었고 모두 식탁에 앉아 있었어. 나는 최대한 예의 바르고 품위 있게 굴려고 애썼어. 예쁘지는 않아도 숙녀다운 아이라고 체스터 로스 부인이 생각해 줬으면 했거든. 모든 게 잘되어 가다가, 아주머니가 한 손에는 자두 푸딩을, 다른 손에는 데운 푸딩 소스 주전자를 들고 오시는 걸 봤어. 다이애나, 그건 정말 끔찍한 순간이었어. 모든 게 다 생각났어. 그래서 나는 그 자리에서 벌떡 일어나 소리쳤어. '아주머니, 그 푸딩 소스 쓰시면 안 돼요. 거기 생쥐가 빠져 죽어 있었어요. 아까 말씀드리는 걸 잊어버렸어요.' 아, 다이애나, 백 살까지 산다 해도 그 끔찍한 순간은 절대 못 잊을 거야. 체스터 로스 부인은 나를 빤히 쳐다보기만 하셨고, 나는 창피해서 바닥으로 꺼져 버리고 싶었어. 그분은 완벽한 살림꾼인데, 우리 집을 어떻게 생각하셨을지 상상해 봐. 아주머니는 얼굴이 불처럼 빨개지셨지만 아무 말도 안 하셨어. 그때는. 그냥 소스랑 푸딩을 들고 나가시더니 딸기 절임을 가지고 오셨어. 나한테도 권하셨는데, 한 숟가락도 넘어가지 않았어. 머리 위에 숯불을 쌓는 것 같았어. 체스터 로스 부인이 가신 뒤에 아주머니는 나를 무섭게 꾸짖으셨어. 어머, 다이애나, 왜 그래?"`],
[`16-29`, `다이애나가 몹시 비틀거리며 일어섰다가, 다시 주저앉아 두 손으로 머리를 감쌌다.`],
[`16-30`, `"나… 나 너무 어지러워." 다이애나가 조금 혀 꼬부라진 소리로 말했다. "나… 나… 당장 집에 가야겠어."`],
[`16-31`, `"아, 차도 안 마시고 집에 가다니 그건 꿈도 꾸지 마." 앤이 어쩔 줄 몰라 하며 외쳤다. "지금 바로 차를 차릴게. 지금 당장 가서 차를 우릴게."`],
[`16-32`, `"집에 가야겠어." 다이애나가 멍하지만 단호하게 되풀이했다.`],
[`16-33`, `"그럼 간식이라도 좀 먹어." 앤이 애원했다. "과일 케이크 한 조각이랑 체리 절임이라도 줄게. 소파에 잠깐 누워 있으면 괜찮아질 거야. 어디가 아파?"`],
[`16-34`, `"집에 가야겠어." 다이애나가 말했다. 다이애나는 그 말밖에 하지 않았다. 앤이 아무리 애원해도 소용없었다.`],
[`16-35`, `"차도 안 마시고 집에 가는 손님은 처음 들어 봐." 앤이 슬퍼하며 말했다. "아, 다이애나, 혹시 정말로 천연두에 걸린 건 아닐까? 만약 그렇다면 내가 가서 간호해 줄게. 그건 믿어도 돼. 나는 절대 너를 버리지 않을 거야. 그래도 차 마실 때까지만 있다 가면 좋겠는데. 어디가 아파?"`],
[`16-36`, `"너무 어지러워." 다이애나가 말했다.`],
[`16-37`, `정말로 다이애나는 몹시 비틀거리며 걸었다. 앤은 실망의 눈물을 글썽이며 다이애나의 모자를 가져다주고, 배리 씨네 마당 울타리까지 바래다주었다. 그리고 초록 지붕 집으로 돌아오는 내내 울었다. 집에 와서는 남은 산딸기 주스를 슬프게 찬장에 도로 넣고, 매슈와 제리의 저녁을 차렸다. 신나는 마음은 하나도 남아 있지 않았다.`],
[`16-38`, `다음 날은 일요일이었는데, 새벽부터 해 질 녘까지 비가 억수같이 쏟아져서 앤은 초록 지붕 집 밖으로 한 발짝도 나가지 않았다. 월요일 오후, 마릴라는 앤에게 린드 부인 댁에 심부름을 보냈다. 그런데 금세 앤이 눈물을 뚝뚝 흘리며 오솔길을 날듯이 달려 돌아왔다. 앤은 부엌으로 뛰어 들어와 소파에 엎어지더니 괴로워 몸부림쳤다.`],
[`16-39`, `"이번엔 또 뭐가 잘못됐니, 앤?" 마릴라가 불안하고 당황해서 물었다. "설마 린드 부인한테 또 버릇없이 굴고 온 건 아니겠지."`],
[`16-40`, `앤은 대답 대신 더 많은 눈물을 흘리며 더 거세게 흐느낄 뿐이었다!`],
[`16-41`, `"앤 셜리, 내가 물으면 대답을 해야지. 당장 똑바로 앉아서 왜 우는지 말해 봐라."`],
[`16-42`, `앤은 비극 그 자체인 얼굴로 일어나 앉았다.`],
[`16-43`, `"린드 부인이 오늘 배리 부인을 만나러 갔는데, 배리 부인이 엄청 화가 나 있었대요." 앤이 울부짖었다. "제가 토요일에 다이애나를 술에 취하게 만들어서 창피한 꼴로 집에 보냈대요. 그리고 저는 뼛속까지 나쁘고 못된 아이가 틀림없으니까, 다시는, 다시는 다이애나가 저랑 놀지 못하게 하겠대요. 아, 아주머니, 저는 슬픔에 짓눌려 죽을 것 같아요."`],
[`16-44`, `마릴라는 너무 놀라 멍하니 앤을 쳐다보았다.`],
[`16-45`, `"다이애나를 술에 취하게 했다고!" 마릴라가 겨우 목소리를 되찾아 말했다. "앤, 네가 미친 거냐, 배리 부인이 미친 거냐? 대체 그 애한테 뭘 준 거니?"`],
[`16-46`, `"산딸기 주스밖에 안 줬어요." 앤이 흐느꼈다. "산딸기 주스를 마시고 취할 거라고는 생각도 못 했어요, 아주머니. 다이애나처럼 큰 잔으로 세 잔을 마셨대도요. 아, 그렇게 말하니까 꼭… 꼭… 토머스 아주머니네 남편 같잖아요! 하지만 저는 다이애나를 취하게 하려던 게 아니에요."`],
[`16-47`, `"취하기는 무슨!" 마릴라는 거실 찬장으로 성큼성큼 걸어갔다. 거기 선반 위에 있는 병을 보자마자 마릴라는 그것이 3년 묵은 자기 집 수제 까치밥나무 열매 포도주라는 걸 알아보았다. 그 포도주는 에이번리에서 이름이 나 있었지만, 배리 부인을 비롯한 몇몇 엄격한 사람들은 그걸 몹시 못마땅해했다. 그리고 그와 동시에, 마릴라는 산딸기 주스 병을 앤에게 말한 대로 찬장에 넣지 않고 지하실에 내려놓았다는 것이 생각났다.`],
[`16-48`, `마릴라는 포도주 병을 손에 들고 부엌으로 돌아왔다. 마릴라의 얼굴이 저도 모르게 씰룩거렸다.`],
[`16-49`, `"앤, 넌 정말 말썽에 휘말리는 데는 천재로구나. 다이애나한테 산딸기 주스가 아니라 까치밥나무 열매 포도주를 준 거다. 너는 그 차이도 몰랐니?"`],
[`16-50`, `"저는 맛도 안 봤어요." 앤이 말했다. "저는 주스인 줄 알았어요. 저는 그저… 그저… 손님을 정성껏 대접하고 싶었어요. 다이애나는 몹시 아파서 집에 가야 했어요. 배리 부인은 린드 부인한테 다이애나가 곤드레만드레 취했었다고 했대요. 엄마가 무슨 일이냐고 물으니까 바보처럼 실실 웃더니 쓰러져서 몇 시간이나 잤대요. 배리 부인이 다이애나 입에서 나는 냄새를 맡고 취했다는 걸 아셨대요. 다이애나는 어제 하루 종일 머리가 깨질 듯이 아팠대요. 배리 부인은 정말 화가 많이 나셨어요. 제가 일부러 그랬다고 굳게 믿으실 거예요."`],
[`16-51`, `"나라면 무엇이 됐든 세 잔씩이나 마셔 댄 다이애나의 욕심을 혼내겠다." 마릴라가 짧게 말했다. "그 큰 잔으로 세 잔이면 주스였어도 탈이 났을 거야. 원, 이 일로 내가 포도주 담근다고 흉보던 사람들은 좋은 꼬투리를 잡았겠구나. 목사님이 못마땅해하신다는 걸 안 뒤로는 3년 동안 담그지도 않았는데 말이야. 그 병은 그냥 아플 때 쓰려고 남겨 둔 거였어. 자, 자, 얘야, 울지 마라. 일이 이렇게 된 건 안됐지만, 네 잘못은 없는 것 같다."`],
[`16-52`, `"울어야겠어요." 앤이 말했다. "제 가슴이 찢어졌어요. 운명의 별들이 저를 거슬러 싸우고 있어요, 아주머니. 다이애나랑 저는 영원히 헤어졌어요. 아, 아주머니, 처음 우정을 맹세할 때는 이런 일이 생길 줄 꿈에도 몰랐어요."`],
[`16-53`, `"바보 같은 소리 마라, 앤. 배리 부인도 네 잘못이 아니라는 걸 알면 생각을 고쳐먹을 거다. 아마 네가 짓궂은 장난이나 그 비슷한 걸 쳤다고 생각하는 모양이야. 오늘 저녁에 올라가서 어떻게 된 일인지 말씀드리는 게 좋겠다."`],
[`16-54`, `"다이애나의 상처 입은 어머니를 마주할 생각을 하니 용기가 사라져요." 앤이 한숨을 쉬었다. "아주머니가 가 주셨으면 좋겠어요. 아주머니는 저보다 훨씬 위엄이 있으시잖아요. 아마 제 말보다 아주머니 말씀을 더 빨리 들으실 거예요."`],
[`16-55`, `"그래, 내가 가마." 마릴라는 아마 그편이 더 현명하겠다고 생각하며 말했다. "더는 울지 마라, 앤. 다 괜찮아질 거다."`],
[`16-56`, `과수원 비탈 집에서 돌아올 무렵, 마릴라는 다 괜찮아질 거라는 생각을 바꾸었다. 마릴라를 기다리고 있던 앤이 현관문으로 날아가 맞이했다.`],
[`16-57`, `"아, 아주머니, 얼굴을 보니 소용없었다는 걸 알겠어요." 앤이 슬프게 말했다. "배리 부인이 저를 용서하지 않으신대요?"`],
[`16-58`, `"배리 부인이라니, 원!" 마릴라가 쏘아붙였다. "내가 본 여자들 중에 그렇게 막무가내인 사람은 처음이다. 다 실수였고 네 잘못이 아니라고 말했는데, 내 말을 전혀 안 믿더구나. 그리고 내 포도주 이야기를 꺼내서, 내가 늘 그 포도주는 아무한테도 조금도 해롭지 않다고 했던 걸 두고두고 들먹이더라. 그래서 똑똑히 말해 줬지. 까치밥나무 열매 포도주는 큰 잔으로 세 잔씩 마시라고 만든 게 아니라고. 그리고 내가 맡은 아이가 그렇게 욕심을 부렸으면, 볼기를 단단히 때려서 정신 차리게 했을 거라고."`],
[`16-59`, `몹시 속이 상한 마릴라는 부엌으로 휙 들어가 버렸고, 현관에는 정신이 아득해진 작은 영혼 하나가 남겨졌다. 이윽고 앤은 모자도 쓰지 않고 쌀쌀한 가을 어스름 속으로 걸어 나갔다. 앤은 아주 단호하고 침착하게, 시들어 버린 토끼풀 밭을 내려가 통나무 다리를 건너고, 서쪽 숲 위에 낮게 걸린 창백한 작은 달빛을 받으며 가문비나무 숲을 올라갔다. 머뭇머뭇 두드리는 노크 소리에 문을 연 배리 부인은, 입술이 하얗게 질리고 눈빛이 간절한 탄원자가 문간에 서 있는 것을 보았다.`],
[`16-60`, `배리 부인의 얼굴이 굳어졌다. 배리 부인은 편견과 싫어하는 마음이 강한 사람이었고, 부인의 분노는 차갑고 뚱하게 오래가는 종류여서 언제나 풀기가 가장 어려웠다. 공평하게 말하자면, 부인은 앤이 순전히 미리 작정한 악의로 다이애나를 취하게 했다고 정말로 믿고 있었다. 그리고 그런 아이와 더 친하게 지내다가 어린 딸이 물들지 않도록 지키려고 진심으로 애쓰고 있었다.`],
[`16-61`, `"무슨 일이니?" 부인이 딱딱하게 말했다.`],
[`16-62`, `앤은 두 손을 꼭 맞잡았다.`],
[`16-63`, `"아, 배리 부인, 제발 저를 용서해 주세요. 저는 다이애나를… 다이애나를… 취하게 하려던 게 아니에요. 제가 어떻게 그럴 수 있겠어요? 부인이 친절한 분들에게 입양된 가엾은 고아 소녀이고, 이 세상에 마음의 친구가 단 한 명뿐이라고 상상해 보세요. 그 친구를 일부러 취하게 하시겠어요? 저는 그게 산딸기 주스인 줄로만 알았어요. 산딸기 주스라고 굳게 믿었어요. 아, 제발 다이애나가 다시는 저랑 못 놀게 하겠다는 말씀만은 하지 말아 주세요. 그러시면 제 인생은 슬픔의 먹구름으로 뒤덮이고 말 거예요."`],
[`16-64`, `마음씨 좋은 린드 부인이었다면 눈 깜짝할 사이에 마음이 녹았을 이 말은, 배리 부인을 더 짜증 나게 했을 뿐이었다. 부인은 앤의 어려운 낱말과 극적인 몸짓을 의심스러워했고, 이 아이가 자기를 놀리고 있다고 생각했다. 그래서 차갑고 매정하게 말했다.`],
[`16-65`, `"너는 다이애나가 어울릴 만한 아이가 아닌 것 같구나. 집에 가서 얌전히 지내거라."`],
[`16-66`, `앤의 입술이 떨렸다.`],
[`16-67`, `"작별 인사를 하게 딱 한 번만 다이애나를 만나게 해 주시면 안 될까요?" 앤이 애원했다.`],
[`16-68`, `"다이애나는 아빠랑 카모디에 갔다." 배리 부인은 그렇게 말하고 들어가 문을 닫아 버렸다.`],
[`16-69`, `앤은 절망 속에서 오히려 차분해진 채 초록 지붕 집으로 돌아갔다.`],
[`16-70`, `"마지막 희망이 사라졌어요." 앤이 마릴라에게 말했다. "제가 직접 올라가서 배리 부인을 만났는데, 저를 아주 모욕적으로 대하셨어요. 아주머니, 저는 그분이 교양 있는 분이라고 생각하지 않아요. 이제 기도하는 수밖에 없는데, 그것도 별로 희망이 없어요. 왜냐하면, 아주머니, 배리 부인처럼 고집 센 사람은 하느님도 어떻게 하실 수 없을 것 같거든요."`],
[`16-71`, `"앤, 그런 말 하면 못쓴다." 마릴라는 꾸짖으면서도, 자꾸만 비어져 나오는 웃음을 참느라 애를 먹었다. 그리고 실제로 그날 밤 매슈에게 모든 이야기를 들려주면서 마릴라는 앤의 시련을 두고 실컷 웃었다.`],
[`16-72`, `하지만 잠자리에 들기 전 동쪽 다락방에 살며시 들어가, 울다 지쳐 잠든 앤을 보았을 때 마릴라의 얼굴에는 익숙하지 않은 부드러움이 번졌다.`],
[`16-73`, `"가엾은 것." 마릴라는 눈물 자국 난 아이의 얼굴에서 흘러내린 곱슬머리 한 가닥을 걷어 올려 주며 중얼거렸다. 그리고 몸을 숙여, 베개 위의 발그레한 뺨에 입을 맞추었다.`],
[`h`, `원작 17장 「삶의 새로운 재미」`],
[`17-1`, `다음 날 오후, 부엌 창가에서 조각보를 꿰매던 앤은 우연히 밖을 내다보다가, 드라이어드의 샘가에서 다이애나가 수수께끼처럼 손짓하는 것을 보았다. 앤은 눈 깜짝할 사이에 집을 뛰쳐나가 골짜기로 날듯이 달려 내려갔다. 표정이 풍부한 앤의 눈에는 놀라움과 희망이 뒤엉켜 있었다. 하지만 다이애나의 풀 죽은 얼굴을 보자 희망은 사그라졌다.`],
[`17-2`, `"어머님 마음이 안 풀리셨어?" 앤이 숨을 헐떡이며 물었다.`],
[`17-3`, `다이애나는 슬프게 고개를 저었다.`],
[`17-4`, `"응. 그리고, 아, 앤, 엄마가 다시는 너랑 놀지 말래. 나 울고 또 울면서 네 잘못이 아니라고 말씀드렸는데 소용없었어. 너한테 작별 인사만 하고 오게 해 달라고 엄마를 조르느라 얼마나 힘들었는지 몰라. 딱 10분만 있다 오래. 엄마가 시계를 보면서 재고 계셔."`],
[`17-5`, `"영원한 작별 인사를 하기에 10분은 너무 짧아." 앤이 눈물을 글썽이며 말했다. "아, 다이애나, 앞으로 더 소중한 친구들이 그대를 아껴 주더라도, 어린 시절의 친구인 나를 절대 잊지 않겠다고 굳게 약속해 줄래?"`],
[`17-6`, `"물론이지." 다이애나가 흐느꼈다. "그리고 나는 다른 마음의 친구는 절대 안 사귈 거야. 사귀고 싶지도 않아. 너만큼 누군가를 사랑할 수는 없을 거야."`],
[`17-7`, `"아, 다이애나." 앤이 두 손을 맞잡으며 외쳤다. "너 나를 사랑하니?"`],
[`17-8`, `"그럼, 당연하지. 몰랐어?"`],
[`17-9`, `"응." 앤이 숨을 길게 들이쉬었다. "물론 네가 나를 좋아한다고는 생각했지만, 사랑해 주리라고는 감히 바라지도 못했어. 정말이야, 다이애나, 나는 누가 나를 사랑할 수 있을 거라고 생각해 본 적이 없어. 내가 기억하는 한 나를 사랑해 준 사람은 아무도 없었거든. 아, 정말 놀라워! 이건 그대와 갈라진 어두운 길을 영원히 비춰 줄 한 줄기 빛이야, 다이애나. 아, 한 번만 더 말해 줘."`],
[`17-10`, `"나는 너를 진심으로 사랑해, 앤." 다이애나가 굳건하게 말했다. "앞으로도 언제나 그럴 거야. 그건 믿어도 돼."`],
[`17-11`, `"그리고 나도 언제나 그대를 사랑할게, 다이애나." 앤이 엄숙하게 손을 내밀며 말했다. "앞으로 오랜 세월 동안 그대의 추억은 내 외로운 삶 위에서 별처럼 빛나리라. 우리가 함께 읽은 마지막 이야기에 나오는 것처럼. 다이애나, 작별의 정표로 영원히 간직할 수 있게, 그대의 칠흑 같은 머리카락을 한 타래 주겠어?"`],
[`17-12`, `"자를 게 있어?" 앤의 감동적인 말투에 다시 흘러내린 눈물을 닦으며, 다이애나가 현실로 돌아와 물었다.`],
[`17-13`, `"응. 다행히 앞치마 주머니에 조각보 가위가 있어." 앤이 말했다. 앤은 엄숙하게 다이애나의 곱슬머리 한 가닥을 잘라 냈다. "잘 있거라, 사랑하는 나의 친구여. 이제부터 우리는 이웃에 살면서도 남남처럼 지내야 하리. 하지만 내 마음은 언제나 그대에게 충실하리라."`],
[`17-14`, `앤은 서서 다이애나가 보이지 않을 때까지 지켜보았다. 다이애나가 뒤돌아볼 때마다 슬프게 손을 흔들었다. 그러고는 집으로 돌아왔다. 이 낭만적인 이별 덕분에 앤은 당분간 적잖이 위로를 받았다.`],
[`17-15`, `"다 끝났어요." 앤이 마릴라에게 알렸다. "저는 다시는 친구를 못 사귈 거예요. 사실 전보다 훨씬 더 나빠졌어요. 이젠 케이티 모리스도 비올레타도 없으니까요. 그리고 있다고 해도 예전 같지는 않을 거예요. 진짜 친구를 사귀고 나니까, 상상 속 소녀들로는 어쩐지 마음이 채워지지 않아요. 다이애나랑 저는 샘가에서 정말 가슴 뭉클한 작별을 했어요. 그 이별은 제 기억 속에서 영원히 신성하게 남을 거예요. 저는 생각할 수 있는 가장 애절한 말을 쓰고, '그대'라고 불렀어요. '그대'는 '너'보다 훨씬 낭만적인 것 같아요. 다이애나가 머리카락을 한 타래 줬는데, 작은 주머니에 꿰매 넣어서 평생 목에 걸고 다닐 거예요. 제가 죽으면 꼭 함께 묻어 주세요. 저는 오래 살 것 같지 않거든요. 제가 차갑게 죽어 누워 있는 걸 보면, 배리 부인도 자기가 한 일을 뉘우치고 다이애나를 제 장례식에 오게 해 줄지도 몰라요."`],
[`17-16`, `"말을 그렇게 잘하는 걸 보니 슬퍼서 죽을 걱정은 별로 없겠구나, 앤." 마릴라가 무정하게 말했다.`],
[`17-17`, `그다음 월요일, 앤은 책 바구니를 팔에 걸고 결심한 듯 입술을 꼭 다문 채 자기 방에서 내려와 마릴라를 놀라게 했다.`],
[`17-18`, `"저 다시 학교에 갈래요." 앤이 선언했다. "친구를 무자비하게 빼앗긴 지금, 제 삶에 남은 건 그것뿐이에요. 학교에서는 다이애나를 바라보며 지나간 날들을 곰곰이 떠올릴 수 있으니까요."`],
[`17-19`, `"지나간 날 대신 공부랑 산수 문제나 곰곰이 떠올리려무나." 마릴라가 이렇게 일이 풀린 것이 기쁜 걸 감추며 말했다. "학교에 다시 간다니, 사람 머리에 석판을 깨뜨리는 그런 소동은 더는 듣지 않게 되길 바란다. 얌전히 굴고 선생님 말씀 잘 들어라."`],
[`17-20`, `"모범생이 되도록 노력할게요." 앤이 침울하게 동의했다. "별로 재미는 없을 것 같아요. 필립스 선생님이 미니 앤드루스가 모범생이라고 하셨는데, 미니는 상상력이나 생기라고는 눈곱만큼도 없어요. 그냥 따분하고 굼뜨고, 즐거워 보이는 적이 한 번도 없어요. 하지만 지금은 마음이 너무 우울하니까 오히려 쉽게 될지도 몰라요. 학교는 큰길로 돌아서 갈 거예요. 자작나무 길을 혼자 걷는 건 견딜 수 없어요. 그랬다간 쓰라린 눈물을 흘리고 말 거예요."`],
[`17-21`, `앤은 학교에서 두 팔 벌려 환영을 받았다. 놀이를 할 때는 앤의 상상력이, 노래를 부를 때는 앤의 목소리가, 점심시간에 책을 소리 내어 읽을 때는 앤의 연기 솜씨가 몹시 그리웠던 것이다. 루비 길리스는 성경 읽기 시간에 파란 자두 세 개를 몰래 건네주었다. 엘라 메이 맥퍼슨은 꽃 카탈로그 표지에서 오려 낸 커다란 노란 팬지를 주었다. 에이번리 학교에서 아주 귀하게 여기는 책상 장식이었다. 소피아 슬론은 앞치마 단을 장식하기에 딱 좋은, 정말 우아한 새 레이스 뜨개 무늬를 가르쳐 주겠다고 했다. 케이티 볼터는 석판 닦을 물을 담아 두라고 향수병을 주었고, 줄리아 벨은 가장자리를 물결 모양으로 오린 연분홍 종이에 다음 시를 정성껏 옮겨 적어 주었다.`],
[`17-22`, `"앤에게`],
[`17-23`, `"황혼이 저녁 장막을 드리우고 / 별 하나로 그 자락을 꽂아 둘 때 / 기억해 줘, 너에게는 친구가 있다는 걸 / 그 친구가 아무리 멀리 있어도."`],
[`17-24`, `"인정받는다는 건 정말 기분 좋은 일이에요." 그날 밤 앤은 황홀하게 한숨을 쉬며 마릴라에게 말했다.`],
[`17-25`, `앤을 '인정'해 준 것은 여학생들만이 아니었다. 점심시간이 끝나고 자리에 가 보니, 앤은 필립스 선생님의 지시로 모범생 미니 앤드루스와 함께 앉게 되었는데, 책상 위에 크고 먹음직스러운 '딸기 사과'가 하나 놓여 있었다. 앤은 한 입 베어 물려고 사과를 집어 들었다가, 에이번리에서 딸기 사과가 자라는 곳은 반짝이는 호수 건너편에 있는 블라이스 씨네 오래된 과수원뿐이라는 게 생각났다. 앤은 시뻘겋게 단 숯이라도 되는 듯 사과를 떨어뜨리고, 보란 듯이 손수건으로 손가락을 닦았다. 사과는 다음 날 아침까지 아무도 손대지 않은 채 책상에 놓여 있다가, 학교를 쓸고 불을 지피는 꼬마 티모시 앤드루스가 수고비 삼아 챙겨 갔다. 점심시간이 끝난 뒤 찰리 슬론이 보낸 석필은 그보다 나은 대접을 받았다. 빨강과 노랑 줄무늬 종이로 화려하게 감싼, 보통 석필은 1센트인데 2센트나 하는 석필이었다. 앤은 너그럽게 그것을 받아 주고, 보낸 사람에게 미소를 지어 보였다. 그 미소에 홀딱 반한 소년은 곧장 일곱 번째 하늘까지 기쁨으로 날아올랐고, 그 바람에 받아쓰기에서 어찌나 끔찍한 실수를 저질렀는지 필립스 선생님은 방과 후에 남아서 다시 쓰게 했다.`],
[`17-26`, `하지만,`],
[`17-27`, `"브루투스의 흉상이 빠진 카이사르의 행렬이 / 로마에게 가장 훌륭한 아들을 더욱 떠올리게 했듯이,"`],
[`17-28`, `거티 파이와 짝이 되어 앉아 있는 다이애나 배리에게서만 아무런 선물도 눈길도 오지 않는다는 사실이 앤의 작은 승리를 씁쓸하게 만들었다.`],
[`17-29`, `"다이애나가 나한테 한 번쯤은 웃어 줄 수도 있었을 텐데." 그날 밤 앤은 마릴라에게 슬프게 말했다. 그런데 다음 날 아침, 무시무시하고 신기하게 꼬이고 접힌 쪽지 하나와 작은 꾸러미 하나가 앤에게 건네져 왔다.`],
[`17-30`, `"사랑하는 앤에게." 쪽지에는 이렇게 쓰여 있었다. "엄마가 학교에서도 너랑 놀거나 말하지 말래. 내 잘못이 아니니까 나한테 화내지 마. 나는 예전과 똑같이 너를 사랑해. 내 비밀을 다 털어놓을 네가 너무너무 보고 싶고, 거티 파이는 하나도 안 좋아. 빨간 얇은 종이로 새 책갈피를 하나 만들었어. 요즘 엄청 유행인데, 학교에서 만들 줄 아는 여자애는 셋밖에 없어. 이걸 볼 때마다 기억해 줘.`],
[`17-31`, `"너의 진정한 친구,`],
[`17-32`, `"다이애나 배리."`],
[`17-33`, `앤은 쪽지를 읽고 책갈피에 입을 맞춘 다음, 교실 건너편으로 곧바로 답장을 보냈다.`],
[`17-34`, `"나의 사랑하는 다이애나에게`],
[`17-35`, `"너는 엄마 말씀을 따라야 하니까 당연히 너한테 화나지 않았어. 우리의 영혼은 서로 통할 수 있어. 너의 예쁜 선물은 영원히 간직할게. 미니 앤드루스는 아주 착한 아이야. 상상력은 없지만. 하지만 다이애나의 '마음에 친구'였던 내가 미니의 마음의 친구가 될 수는 없어. 철자가 틀린 건 이해해 줘. 내 철자 실력이 아직 별로 좋지 않거든. 그래도 많이 '느렀어'.`],
[`17-36`, `"죽음이 우리를 갈라놓을 때까지 너의,`],
[`17-37`, `"앤 또는 코델리아 셜리.`],
[`17-38`, `"추신: 오늘 밤엔 네 편지를 베개 밑에 두고 잘 거야.`],
[`17-39`, `"앤 또는 코델리아 셜리."`],
[`17-40`, `마릴라는 앤이 다시 학교에 다니기 시작했으니 또 말썽이 생길 거라고 비관적으로 기다렸다. 하지만 아무 일도 일어나지 않았다. 어쩌면 앤이 미니 앤드루스에게서 '모범생' 정신을 조금 옮아 왔는지도 모른다. 적어도 그 뒤로 앤은 필립스 선생님과 아주 잘 지냈다. 앤은 길버트 블라이스에게는 어느 과목에서도 지지 않겠다고 마음먹고 온 마음을 다해 공부에 뛰어들었다. 두 사람의 경쟁은 곧 모두의 눈에 드러났다. 길버트 쪽에서는 순전히 선의의 경쟁이었다. 하지만 앤 쪽도 그렇다고 하기는 어려웠다. 앤은 원한을 잊지 못하는 칭찬할 수 없는 끈질김을 분명히 가지고 있었다. 앤은 미워하는 것도 사랑하는 것만큼 뜨거웠다. 앤은 공부로 길버트와 겨루겠다는 마음을 굳이 인정하지 않았다. 그걸 인정하면, 앤이 끝까지 무시하고 있는 길버트의 존재를 인정하는 셈이 되기 때문이었다. 하지만 경쟁은 분명히 있었고, 영광은 두 사람 사이를 오락가락했다. 어떤 날은 길버트가 철자 반에서 1등을 했고, 어떤 날은 앤이 긴 빨간 머리를 휙 넘기며 길버트를 철자로 이겼다. 어느 날 아침에는 길버트가 산수 문제를 모두 맞혀 칠판의 우등생 명단에 이름이 올랐다. 그러면 그다음 날 아침에는 전날 저녁 내내 소수와 씨름한 앤이 1등을 차지했다. 어느 끔찍한 날에는 두 사람이 동점이 되어 이름이 나란히 칠판에 쓰였다. 그건 거의 '주목하시오'만큼이나 나빴고, 앤의 굴욕감은 길버트의 흐뭇함만큼이나 뻔히 드러났다. 달마다 치르는 필기시험 때는 긴장감이 엄청났다. 첫 달에는 길버트가 3점 앞섰다. 둘째 달에는 앤이 5점 차로 이겼다. 하지만 앤의 승리는 길버트가 온 학교 앞에서 진심으로 축하해 주는 바람에 빛이 바랬다. 길버트가 패배의 쓴맛을 느꼈더라면 앤에게 훨씬 더 달콤했을 텐데.`],
[`17-41`, `필립스 선생님이 그다지 좋은 선생님은 아니었을지 모른다. 하지만 앤처럼 배우겠다고 굳게 마음먹은 학생이라면 어떤 선생님 아래에서든 실력이 늘 수밖에 없었다. 학기가 끝날 무렵, 앤과 길버트는 둘 다 5학년 반으로 올라가 '교과목'의 기초를 배우게 되었다. 라틴어, 기하, 프랑스어, 대수를 말하는 것이었다. 기하에서 앤은 자신의 워털루를 만났다.`],
[`17-42`, `"정말 끔찍한 과목이에요, 아주머니." 앤이 끙끙거렸다. "저는 절대로 그걸 이해하지 못할 거예요. 상상할 여지가 하나도 없어요. 필립스 선생님은 제가 기하를 이렇게 못하는 학생은 처음 봤대요. 그리고 길… 아니, 다른 애들 중에는 기하를 엄청 잘하는 애들이 있어요. 정말 창피해요, 아주머니. 다이애나도 저보다 잘해요. 하지만 다이애나한테 지는 건 괜찮아요. 지금은 남남처럼 지내지만, 저는 여전히 꺼지지 않는 사랑으로 다이애나를 사랑해요. 다이애나를 생각하면 가끔 정말 슬퍼져요. 하지만 정말이지, 아주머니, 이렇게 흥미로운 세상에서 오래 슬퍼하고 있을 수는 없잖아요, 그렇죠?"`],
  ]
};

/* 원문 책장: 원작 18장 — 이 앱을 위해 새로 우리말로 옮김 */
BOOK.ch6 = {
  title: `앤, 구조에 나서다`,
  orig: `원작 18장`,
  paras: [
[`18-1`, `모든 큰일은 작은 일들과 얽혀 있는 법이다. 얼핏 보면 캐나다의 어느 수상이 정치 순회 일정에 프린스 에드워드 섬을 넣기로 한 결정이, 초록 지붕 집에 사는 어린 앤 셜리의 운명과 무슨 상관이 있으랴 싶을 것이다. 하지만 상관이 있었다.`],
[`18-2`, `수상이 온 것은 1월이었다. 샬럿타운에서 열리는 엄청난 규모의 대중 집회에서 충성스러운 지지자들과, 굳이 와 보겠다는 반대파 사람들 앞에서 연설을 하기 위해서였다. 에이번리 사람들은 대부분 수상 쪽 정당을 지지했다. 그래서 집회가 열리는 날 밤, 남자들은 거의 다, 여자들도 꽤 많이 30마일 떨어진 시내로 나갔다. 레이첼 린드 부인도 갔다. 레이첼 린드 부인은 열렬한 정치광이어서, 비록 반대 정당 편이었지만 자기가 없으면 정치 집회가 제대로 치러질 리 없다고 믿었다. 그래서 부인은 남편 토머스를 데리고, 토머스는 말을 돌보는 데 쓸모가 있었으니까, 그리고 마릴라 커스버트까지 데리고 시내로 갔다. 마릴라도 남몰래 정치에 관심이 있었고, 진짜 살아 있는 수상을 볼 수 있는 유일한 기회일지도 모른다는 생각에 냉큼 따라나섰다. 다음 날 돌아올 때까지 집은 앤과 매슈에게 맡겨 두고.`],
[`18-3`, `그리하여 마릴라와 레이첼 부인이 대중 집회를 한껏 즐기는 동안, 앤과 매슈는 초록 지붕 집의 아늑한 부엌을 둘이서 차지하고 있었다. 옛날식 워털루 난로에서는 불이 환하게 타오르고, 창유리에는 푸르스름하고 하얀 서리꽃이 반짝였다. 매슈는 소파에서 농업 신문을 펼쳐 든 채 꾸벅꾸벅 졸았고, 앤은 식탁에 앉아 굳은 결심으로 공부를 했다. 하지만 시계 선반 쪽으로 이따금 아쉬운 눈길을 보내지 않을 수 없었다. 그날 제인 앤드루스가 빌려준 새 책이 거기 놓여 있었던 것이다. 제인은 그 책이 가슴을 몇 번이고 떨리게 해 줄 거라고 장담했고, 앤은 손가락이 근질거려 견딜 수가 없었다. 하지만 그 책을 펼치면 내일 길버트 블라이스가 이기게 될 것이다. 앤은 시계 선반에 등을 돌리고, 거기 책이 없다고 상상하려고 애썼다.`],
[`18-4`, `"아저씨, 학교 다니실 때 기하 공부해 보셨어요?"`],
[`18-5`, `"글쎄다, 아니, 안 해 봤다." 매슈가 깜짝 놀라 졸음에서 깨며 말했다.`],
[`18-6`, `"해 보셨으면 좋았을 텐데요." 앤이 한숨을 쉬었다. "그러면 제 마음을 알아주실 수 있을 텐데. 기하를 공부해 본 적이 없으면 제대로 공감할 수가 없어요. 기하가 제 인생 전체에 먹구름을 드리우고 있어요. 저는 기하에는 정말 바보예요, 아저씨."`],
[`18-7`, `"글쎄다, 잘 모르겠구나." 매슈가 달래듯 말했다. "너는 뭐든 잘할 것 같은데. 지난주에 카모디 블레어 가게에서 필립스 선생이 그러더라. 네가 학교에서 제일 똑똑한 학생이고 실력이 쑥쑥 늘고 있다고. '쑥쑥 늘고 있다', 바로 그렇게 말하더구나. 테디 필립스를 깎아내리면서 별로 좋은 선생이 아니라는 사람들도 있다만, 내 보기엔 괜찮은 사람 같다."`],
[`18-8`, `매슈는 앤을 칭찬하는 사람이면 누구든 '괜찮은 사람'이라고 생각했을 것이다.`],
[`18-9`, `"선생님이 글자만 안 바꾸시면 기하를 훨씬 잘할 수 있을 거예요." 앤이 투덜거렸다. "저는 정리를 통째로 외워요. 그런데 선생님은 칠판에 그림을 그리시면서 책이랑 다른 글자를 붙이셔서, 저는 완전히 헷갈려 버려요. 선생님이 그렇게 비겁하게 굴면 안 된다고 생각하지 않으세요? 지금은 농업도 배우는데, 길이 왜 빨간지 드디어 알아냈어요. 정말 큰 위안이 됐어요. 마릴라 아주머니랑 린드 부인은 즐겁게 지내고 계실까요? 린드 부인 말로는 오타와에서 나랏일을 이런 식으로 하면 캐나다는 망할 거래요. 투표하는 사람들한테 무서운 경고래요. 여자들도 투표를 할 수 있게 되면 곧 좋은 쪽으로 바뀔 거래요. 아저씨는 어느 당에 투표하세요?"`],
[`18-10`, `"보수당." 매슈가 냉큼 대답했다. 보수당에 투표하는 것은 매슈에게 신앙의 일부나 마찬가지였다.`],
[`18-11`, `"그럼 저도 보수당이에요." 앤이 단호하게 말했다. "잘됐어요. 왜냐하면 길… 그러니까 학교 남자애들 중에 자유당이 있거든요. 필립스 선생님도 자유당일 것 같아요. 프리시 앤드루스 아버지가 자유당이니까요. 루비 길리스가 그러는데, 남자가 구애를 할 때는 언제나 여자 쪽 어머니와는 종교를, 아버지와는 정치를 맞춰야 한대요. 정말이에요, 아저씨?"`],
[`18-12`, `"글쎄다, 잘 모르겠구나." 매슈가 말했다.`],
[`18-13`, `"아저씨는 구애해 보신 적 있어요?"`],
[`18-14`, `"글쎄다, 아니, 해 본 적 없는 것 같구나." 평생 그런 일은 한 번도 생각해 본 적이 없는 게 분명한 매슈가 말했다.`],
[`18-15`, `앤은 두 손으로 턱을 괴고 곰곰이 생각했다.`],
[`18-16`, `"꽤 재미있을 것 같지 않아요, 아저씨? 루비 길리스는 크면 남자 친구를 줄줄이 거느리고 모두 자기한테 홀딱 빠지게 할 거래요. 하지만 저는 그건 너무 정신없을 것 같아요. 저는 제정신인 사람 하나면 충분해요. 그래도 루비 길리스는 그런 일을 아주 잘 알아요. 언니가 많거든요. 린드 부인 말로는 길리스네 딸들은 날개 돋친 듯이 시집을 갔대요. 필립스 선생님은 거의 매일 저녁 프리시 앤드루스네 집에 가세요. 공부를 도와주러 간다고 하시는데, 미란다 슬론도 퀸스 시험 공부를 하고 있고, 미란다가 프리시보다 훨씬 공부를 못하니까 도움이 훨씬 더 필요할 텐데, 미란다한테는 저녁에 한 번도 안 가세요. 세상에는 제가 잘 이해 못 하는 일이 정말 많아요, 아저씨."`],
[`18-17`, `"글쎄다, 나도 다 이해하는지는 모르겠구나." 매슈가 인정했다.`],
[`18-18`, `"자, 이제 공부를 마저 해야겠어요. 다 끝내기 전엔 제인이 빌려준 새 책을 절대 펴지 않을 거예요. 하지만 정말 무시무시한 유혹이에요, 아저씨. 등을 돌리고 있어도 책이 거기 있는 게 훤히 보여요. 제인은 그 책을 읽다가 울다 지쳐서 아플 지경이었대요. 저는 저를 울리는 책이 정말 좋아요. 그래도 그 책을 거실로 가져가서 잼 찬장에 넣고 잠근 다음 열쇠를 아저씨께 드릴게요. 그리고 아저씨, 제 공부가 끝나기 전에는, 제가 무릎 꿇고 애원해도 열쇠를 주시면 안 돼요. 유혹을 이겨 내라고 말하기는 쉽지만, 열쇠가 없으면 훨씬 쉽게 이겨 낼 수 있거든요. 그런 다음 지하실에 내려가서 회색 사과 좀 가져올까요, 아저씨? 회색 사과 드시고 싶지 않으세요?"`],
[`18-19`, `"글쎄다, 먹고 싶을지도 모르겠구나." 매슈가 말했다. 매슈는 회색 사과를 먹은 적이 없었지만, 앤이 그 사과를 무척 좋아한다는 걸 알고 있었다.`],
[`18-20`, `앤이 회색 사과를 한 접시 담아 의기양양하게 지하실에서 올라오는 바로 그때, 바깥의 얼어붙은 판자 길에서 다급한 발소리가 들리더니, 다음 순간 부엌문이 벌컥 열리고 다이애나 배리가 뛰어 들어왔다. 얼굴은 하얗게 질리고 숨을 헐떡였으며, 머리에는 숄을 허겁지겁 두르고 있었다. 앤은 너무 놀라 들고 있던 촛불과 접시를 놓쳐 버렸고, 접시와 촛불과 사과는 한꺼번에 지하실 사다리 아래로 와르르 떨어졌다. 다음 날 마릴라가 바닥에서 녹은 촛농 속에 박힌 그것들을 찾아내어 주워 모으며, 집에 불이 나지 않은 게 천만다행이라고 감사했다.`],
[`18-21`, `"다이애나, 대체 무슨 일이야?" 앤이 외쳤다. "드디어 어머님 마음이 풀리신 거야?"`],
[`18-22`, `"아, 앤, 빨리 좀 와 줘." 다이애나가 애타게 애원했다. "미니 메이가 너무 아파. 크루프래. 메리 조 언니가 그랬어. 아빠랑 엄마는 시내에 가셨고 의사 선생님을 부르러 갈 사람이 아무도 없어. 미니 메이가 정말 심한데 메리 조 언니는 어떻게 해야 할지 몰라. 아, 앤, 나 너무 무서워!"`],
[`18-23`, `매슈는 아무 말 없이 모자와 외투를 집어 들고 다이애나 곁을 스쳐 마당의 어둠 속으로 사라졌다.`],
[`18-24`, `"아저씨는 의사 선생님을 모시러 카모디로 가시려고 밤색 암말에 마구를 채우러 가신 거야." 두건과 웃옷을 서둘러 걸치며 앤이 말했다. "말씀하신 것처럼 확실히 알아. 아저씨랑 나는 마음이 아주 잘 통해서 말하지 않아도 생각을 읽을 수 있거든."`],
[`18-25`, `"카모디에서 의사 선생님을 못 찾으실 거야." 다이애나가 흐느꼈다. "블레어 선생님은 시내에 가셨고, 스펜서 선생님도 가셨을 거야. 메리 조 언니는 크루프에 걸린 사람을 한 번도 본 적이 없고, 린드 부인도 안 계셔. 아, 앤!"`],
[`18-26`, `"울지 마, 다이." 앤이 씩씩하게 말했다. "크루프에는 어떻게 해야 하는지 내가 정확히 알아. 해먼드 아주머니가 쌍둥이를 세 번이나 낳으셨다는 거 잊었니? 쌍둥이를 세 쌍이나 돌보다 보면 저절로 경험이 많이 쌓여. 그 애들은 모두 툭하면 크루프에 걸렸거든. 토근 시럽 병만 가지고 갈게. 너희 집엔 없을지도 모르니까. 자, 가자."`],
[`18-27`, `두 아이는 손을 잡고 서둘러 나가, 연인의 오솔길을 지나 그 너머 눈이 딱딱하게 언 들판을 가로질러 갔다. 숲으로 난 지름길은 눈이 너무 깊었기 때문이다. 앤은 미니 메이가 진심으로 걱정되었지만, 그렇다고 이 상황이 지닌 낭만과, 마음이 통하는 친구와 다시 한번 그 낭만을 나누는 달콤함을 느끼지 못한 것은 결코 아니었다.`],
[`18-28`, `맑고 서리 내린 밤이었다. 온통 칠흑 같은 그림자와 은빛 눈 덮인 비탈뿐이었다. 고요한 들판 위로 커다란 별들이 빛나고, 여기저기 뾰족한 검은 전나무들이 가지에 눈가루를 얹은 채 서 있었으며, 그 사이로 바람이 휘파람을 불었다. 오랫동안 떨어져 있던 마음의 친구와 함께 이 모든 신비와 아름다움 속을 미끄러지듯 달려가는 것은 정말 근사한 일이라고 앤은 생각했다.`],
[`18-29`, `세 살배기 미니 메이는 정말 몹시 아팠다. 부엌 소파에 누워 열에 들떠 뒤척였고, 쉰 숨소리가 온 집 안에 들렸다. 배리 부인이 집을 비운 동안 아이들을 돌보라고 데려다 놓은 메리 조는 개울가 마을에서 온 통통하고 얼굴이 넓적한 프랑스계 처녀였는데, 어쩔 줄 몰라 당황한 나머지 무엇을 해야 할지 생각도 못 하고, 생각이 나더라도 해낼 수 없는 상태였다.`],
[`18-30`, `앤은 솜씨 있고 재빠르게 일을 시작했다.`],
[`18-31`, `"미니 메이는 크루프가 틀림없어. 꽤 심하지만, 더 심한 것도 봤어. 우선 뜨거운 물이 많이 있어야 해. 세상에, 다이애나, 주전자에 물이 한 컵도 안 남았잖아! 자, 내가 가득 채웠어. 메리 조 언니, 난로에 장작 좀 넣어 줘요. 기분 상하게 하려는 건 아니지만, 언니한테 상상력이 조금이라도 있었다면 이걸 미리 생각했을 것 같아요. 이제 내가 미니 메이 옷을 벗기고 눕힐게. 다이애나, 너는 부드러운 플란넬 천을 좀 찾아 줘. 무엇보다 먼저 토근 시럽을 한 번 먹일 거야."`],
[`18-32`, `미니 메이는 토근 시럽을 순순히 받아먹지 않았다. 하지만 앤이 괜히 쌍둥이 세 쌍을 키운 게 아니었다. 토근 시럽은 한 번만이 아니라, 두 아이가 아파하는 미니 메이를 끈기 있게 돌본 그 길고 불안한 밤 동안 여러 번 넘어갔다. 그리고 메리 조는 할 수 있는 일은 뭐든 하려고 정말 애쓰면서, 난로 불을 활활 지피고, 크루프에 걸린 아기들로 가득 찬 병원 하나를 돌보고도 남을 만큼 물을 데웠다.`],
[`18-33`, `매슈가 의사를 데리고 온 것은 새벽 3시였다. 의사를 찾아 스펜서베일까지 가야 했던 것이다. 하지만 다급한 고비는 이미 지나 있었다. 미니 메이는 훨씬 나아져서 곤히 잠들어 있었다.`],
[`18-34`, `"절망해서 포기하기 직전이었어요." 앤이 설명했다. "점점 더 나빠져서 해먼드네 쌍둥이들, 마지막 쌍둥이들보다도 더 심해졌어요. 저는 정말 미니 메이가 숨이 막혀 죽는 줄 알았어요. 병에 든 토근 시럽을 마지막 한 방울까지 다 먹였어요. 마지막 한 숟가락이 넘어갈 때 저는 속으로 말했어요. 다이애나나 메리 조 언니한테는 말하지 않았어요. 지금보다 더 걱정하게 만들고 싶지 않았거든요. 하지만 마음을 달래려면 저 자신한테라도 말해야 했어요. '이것이 마지막 남은 희망이로구나. 하지만 그것마저 헛될까 두렵다.' 그런데 3분쯤 지나자 미니 메이가 가래를 토해 내더니 곧바로 나아지기 시작했어요. 제가 얼마나 안심했는지는 그냥 상상해 주세요, 선생님. 말로는 표현할 수가 없어요. 세상에는 말로 표현할 수 없는 것들이 있잖아요."`],
[`18-35`, `"그래, 알고말고." 의사가 고개를 끄덕였다. 의사는 앤에 대해 말로 표현할 수 없는 무언가를 생각하는 듯한 눈길로 앤을 바라보았다. 하지만 나중에 의사는 그 생각을 배리 씨 부부에게 말로 표현했다.`],
[`18-36`, `"커스버트 씨네 그 빨간 머리 꼬마 아가씨는 정말 영리하기 그지없어요. 그 애가 아기 목숨을 구했다고 분명히 말씀드리죠. 제가 왔을 때는 이미 늦었을 테니까요. 그 나이 아이에게서는 보기 드문 솜씨와 침착함을 지녔더군요. 제게 아기 상태를 설명할 때 그 애 눈빛 같은 건 생전 처음 봤습니다."`],
[`18-37`, `앤은 하얗게 서리가 내린 멋진 겨울 아침에 집으로 돌아갔다. 잠을 못 자서 눈꺼풀이 무거웠지만, 기다란 하얀 들판을 가로지르고 연인의 오솔길 단풍나무들이 이룬 반짝이는 요정의 아치 아래를 걸으며 매슈에게 지칠 줄 모르고 이야기했다.`],
[`18-38`, `"아, 아저씨, 정말 멋진 아침이지 않아요? 하느님이 자기 즐거움을 위해 방금 상상해 내신 세상 같지 않아요? 저 나무들은 숨 한 번이면 날려 버릴 수 있을 것 같아요. 후! 하얀 서리가 있는 세상에 살아서 정말 기뻐요. 아저씨도 그렇죠? 그리고 해먼드 아주머니가 쌍둥이를 세 쌍이나 낳으셔서 결국 정말 다행이에요. 안 그러셨으면 미니 메이를 어떻게 해야 할지 몰랐을 거예요. 해먼드 아주머니가 쌍둥이를 낳으셨다고 짜증을 낸 게 정말 미안해요. 하지만, 아, 아저씨, 너무 졸려요. 학교에 못 가겠어요. 눈을 뜨고 있지도 못하고 엄청 멍청하게 굴 거예요. 그런데 집에 있으면 길… 다른 애들이 1등을 차지할 텐데, 그럼 다시 올라가기가 너무 힘들어요. 물론 힘들수록 다시 올라갔을 때 더 뿌듯하긴 하지만요, 그렇죠?"`],
[`18-39`, `"글쎄다, 너라면 잘 해낼 거다." 매슈가 앤의 하얗게 질린 작은 얼굴과 눈 밑의 거뭇한 그늘을 바라보며 말했다. "어서 들어가 푹 자거라. 집안일은 내가 다 하마."`],
[`18-40`, `앤은 그 말대로 잠자리에 들어 어찌나 오래 깊이 잤는지, 깨어 보니 하얗고 장밋빛 도는 겨울 오후가 한참 기울어 있었다. 부엌으로 내려가니, 그사이 집에 돌아온 마릴라가 앉아서 뜨개질을 하고 있었다.`],
[`18-41`, `"아, 수상 보셨어요?" 앤이 대뜸 외쳤다. "어떻게 생기셨어요, 아주머니?"`],
[`18-42`, `"글쎄, 얼굴 덕에 수상이 된 건 아니더구나." 마릴라가 말했다. "코가 어찌나 크던지! 하지만 연설은 잘하더라. 보수당인 게 자랑스러웠다. 물론 자유당인 레이첼 린드는 시큰둥했지만. 네 점심은 오븐에 있다, 앤. 찬장에서 파란 자두 절임도 꺼내 먹으렴. 배고프겠구나. 어젯밤 일은 매슈한테 들었다. 네가 어떻게 해야 할지 알았다니 정말 다행이었구나. 나라면 전혀 몰랐을 거야. 크루프에 걸린 아이를 한 번도 본 적이 없으니까. 자, 이제 점심 다 먹을 때까지는 말하지 마라. 얼굴을 보니 할 말이 잔뜩 쌓인 것 같다만, 그건 나중에 해도 된다."`],
[`18-43`, `마릴라에게는 앤에게 들려줄 이야기가 있었다. 하지만 바로 말하지 않았다. 지금 말하면 앤이 흥분해서 식욕이니 점심이니 하는 현실적인 일들은 저 멀리 날아가 버릴 걸 알았기 때문이다. 앤이 파란 자두 한 접시를 다 먹고 나서야 마릴라는 말을 꺼냈다.`],
[`18-44`, `"오늘 오후에 배리 부인이 왔었다, 앤. 너를 보고 싶어 했는데, 내가 깨우지 않았지. 부인 말이 네가 미니 메이의 목숨을 구했대. 그리고 포도주 일 때 자기가 그렇게 행동한 걸 정말 미안하게 생각한대. 네가 다이애나를 취하게 하려던 게 아니라는 걸 이제 알았다면서, 네가 용서해 주고 다이애나와 다시 좋은 친구로 지내 주면 좋겠다는구나. 원하면 오늘 저녁에 건너가 보거라. 다이애나는 어젯밤에 지독한 감기에 걸려서 문밖으로 한 발짝도 못 나간대. 자, 앤 셜리, 제발 하늘로 훨훨 날아가 버리지는 마라."`],
[`18-45`, `그 경고가 괜한 말은 아니었다. 벌떡 일어선 앤의 표정과 몸짓은 하늘로 날아오를 듯 들떠 있었고, 얼굴은 마음속 불꽃으로 환하게 빛났다.`],
[`18-46`, `"아, 아주머니, 지금 당장 가도 돼요? 설거지 안 하고요? 돌아와서 할게요. 하지만 이렇게 가슴 떨리는 순간에 설거지처럼 낭만이 없는 일에 매여 있을 수는 없어요."`],
[`18-47`, `"그래, 그래, 어서 가거라." 마릴라가 너그럽게 말했다. "앤 셜리, 너 정신 나갔니? 당장 돌아와서 뭐라도 걸치고 가! 바람한테 소리치는 게 낫겠구나. 모자도 숄도 없이 가 버렸네. 머리카락을 휘날리며 과수원을 가로질러 뛰어가는 것 좀 봐. 감기 걸려 죽지나 않으면 다행이겠다."`],
[`18-48`, `앤은 보랏빛 겨울 해 질 녘, 눈 덮인 들판을 가로질러 춤추듯 집으로 돌아왔다. 저 멀리 남서쪽 하늘에는 저녁 별 하나가 진주처럼 커다랗게 반짝였다. 하늘은 반짝이는 하얀 들판과 가문비나무 우거진 어두운 골짜기 위로 연한 금빛과 신비로운 장밋빛을 띠고 있었다. 눈 덮인 언덕 사이로 썰매 방울 소리가 요정의 종소리처럼 서리 내린 공기를 타고 들려왔지만, 그 음악도 앤의 가슴과 입술에 흐르는 노래보다 달콤하지는 않았다.`],
[`18-49`, `"아주머니 앞에 있는 사람은 완벽하게 행복한 사람이에요." 앤이 선언했다. "저는 완벽하게 행복해요. 그래요, 빨간 머리인데도요. 지금 이 순간 제 영혼은 빨간 머리 따위보다 훨씬 높이 있어요. 배리 부인이 저한테 입을 맞추시고 우시면서, 정말 미안하다고, 이 은혜는 절대 다 갚을 수 없을 거라고 하셨어요. 저는 무척 쑥스러웠어요, 아주머니. 그래도 최대한 공손하게 이렇게 말씀드렸어요. '배리 부인, 저는 부인께 아무 원한도 없어요. 다이애나를 취하게 하려던 게 아니었다는 걸 이번 한 번만 분명히 말씀드릴게요. 그리고 이제부터 지난 일은 망각의 망토로 덮어 버리겠어요.' 꽤 품위 있는 말투였죠, 아주머니? 배리 부인 머리 위에 숯불을 쌓아 드리는 기분이었어요. 그리고 다이애나랑 저는 정말 즐거운 오후를 보냈어요. 다이애나가 카모디에 사는 이모한테 배운 새 코바늘 무늬를 보여 줬어요. 에이번리에서 그 무늬를 아는 사람은 우리 둘밖에 없어서, 절대 다른 사람한테 알려 주지 않기로 엄숙하게 맹세했어요. 다이애나가 장미 화환이 그려진 예쁜 카드도 줬는데, 거기엔 이런 시가 적혀 있었어요.`],
[`18-50`, `'네가 나를 사랑하듯 내가 너를 사랑한다면 / 죽음 말고는 아무것도 우리 둘을 갈라놓지 못하리.'`],
[`18-51`, `그리고 그건 정말이에요, 아주머니. 필립스 선생님께 학교에서 다시 같이 앉게 해 달라고 부탁드릴 거예요. 거티 파이는 미니 앤드루스랑 앉으면 되고요. 차도 정말 근사하게 마셨어요. 배리 부인이 제일 좋은 찻잔 세트를 내놓으셨어요, 아주머니. 꼭 제가 진짜 손님인 것처럼요. 그게 얼마나 가슴 떨렸는지 말로 다 못 해요. 저 때문에 제일 좋은 찻잔을 꺼내 준 사람은 지금까지 아무도 없었거든요. 그리고 과일 케이크랑 파운드케이크랑 도넛이랑 두 가지 잼이 있었어요, 아주머니. 그리고 배리 부인이 저한테 차를 마시겠냐고 물으시고는 '여보, 앤한테 비스킷 좀 건네주지 그래요?' 하셨어요. 어른 대접을 받는 것만으로도 이렇게 좋은데, 진짜 어른이 되면 얼마나 좋을까요, 아주머니."`],
[`18-52`, `"글쎄, 그건 모르겠구나." 마릴라가 짧게 한숨을 쉬며 말했다.`],
[`18-53`, `"아무튼 저는 어른이 되면," 앤이 단호하게 말했다. "꼬마 여자애들한테 언제나 어른한테 하듯 말할 거예요. 그리고 그 애들이 어려운 낱말을 써도 절대 비웃지 않을 거예요. 그게 얼마나 마음을 아프게 하는지 슬픈 경험으로 알거든요. 차를 마시고 나서 다이애나랑 저는 캐러멜 사탕을 만들었어요. 사탕은 별로 잘 안 됐어요. 다이애나도 저도 한 번도 만들어 본 적이 없어서 그런가 봐요. 다이애나가 접시에 버터를 바르는 동안 저한테 젓고 있으라고 했는데, 제가 깜빡하고 태워 버렸어요. 그리고 식히려고 현관 앞에 내놓았더니 고양이가 접시 하나를 밟고 지나가서 그건 버려야 했어요. 그래도 만드는 건 정말 재미있었어요. 그리고 제가 집에 올 때 배리 부인이 될 수 있는 한 자주 놀러 오라고 하셨고, 다이애나는 창가에 서서 제가 연인의 오솔길에 닿을 때까지 손 키스를 날려 보냈어요. 정말이지, 아주머니, 오늘 밤엔 기도하고 싶은 기분이에요. 오늘을 기념해서 특별한 새 기도문을 생각해 낼 거예요."`],
  ]
};

/* 원문 책장: 원작 21장 — 이 앱을 위해 새로 우리말로 옮김 */
BOOK.ch7 = {
  title: `향료의 새로운 출발`,
  orig: `원작 21장`,
  paras: [
[`21-1`, `"아이고, 린드 부인 말씀대로 이 세상엔 만남과 이별밖에 없나 봐요." 6월 마지막 날, 석판과 책을 부엌 식탁에 내려놓고 흠뻑 젖은 손수건으로 빨개진 눈을 닦으며 앤이 구슬프게 말했다. "오늘 학교에 손수건을 하나 더 가져가길 정말 다행이었죠, 아주머니? 필요할 거라는 예감이 들었거든요."`],
[`21-2`, `"네가 필립스 선생님을 그렇게 좋아해서, 떠나신다고 눈물 닦는 데 손수건이 두 장이나 필요할 줄은 몰랐구나." 마릴라가 말했다.`],
[`21-3`, `"선생님을 정말 그렇게 좋아해서 운 건 아닌 것 같아요." 앤이 곰곰이 생각하며 말했다. "다른 애들이 다 우니까 따라 운 거예요. 루비 길리스가 시작했어요. 루비는 늘 필립스 선생님이 싫다고 했는데, 선생님이 작별 인사를 하려고 일어서자마자 울음을 터뜨렸어요. 그러자 여자애들이 하나씩 차례로 울기 시작했어요. 저는 참아 보려고 했어요, 아주머니. 선생님이 저를 길… 남자애 옆에 앉히셨던 일, 칠판에 제 이름을 e도 없이 쓰셨던 일, 제가 기하를 이렇게 못하는 애는 처음 봤다며 제 철자를 비웃으셨던 일, 그렇게 지독하게 비꼬셨던 일들을 다 떠올려 보려고 했어요. 그런데 어쩐지 안 되더라고요. 그래서 저도 울 수밖에 없었어요. 제인 앤드루스는 한 달 내내 필립스 선생님이 가시면 얼마나 좋을지, 절대 눈물 한 방울 안 흘릴 거라고 떠들었거든요. 그런데 제인이 누구보다 심하게 울어서 오빠한테 손수건을 빌려야 했어요. 물론 남자애들은 안 울었죠. 제인은 필요할 줄 몰라서 손수건을 안 가져왔던 거예요. 아, 아주머니, 정말 가슴이 찢어지는 것 같았어요. 필립스 선생님은 '우리가 헤어질 때가 왔습니다'로 시작하는 정말 아름다운 작별 연설을 하셨어요. 정말 감동적이었어요. 선생님 눈에도 눈물이 맺혀 있었어요, 아주머니. 아, 수업 시간에 떠들고, 석판에 선생님 그림을 그리고, 선생님이랑 프리시를 놀렸던 일들이 다 끔찍하게 미안하고 후회됐어요. 미니 앤드루스처럼 모범생이었으면 좋았을 거라는 생각이 들었어요. 미니는 양심에 걸리는 게 하나도 없잖아요. 여자애들은 집에 오는 내내 울었어요. 캐리 슬론이 몇 분마다 '우리가 헤어질 때가 왔습니다' 하고 말하는 바람에, 기분이 좀 나아질 만하면 다시 울음이 터졌어요. 정말 너무 슬퍼요, 아주머니. 그래도 두 달 동안 방학이 기다리고 있는데 완전히 절망의 구렁텅이에 빠질 수는 없잖아요, 그렇죠? 게다가 역에서 오시는 새 목사님과 사모님도 만났어요. 필립스 선생님이 떠나셔서 그렇게 마음이 아팠는데도, 새 목사님한테는 조금 관심이 가지 않을 수 없었어요, 그렇죠? 사모님은 정말 예쁘세요. 물론 여왕처럼 아름다운 건 아니에요. 목사님 사모님이 여왕처럼 아름다우면 안 될 것 같아요. 나쁜 본보기가 될지도 모르니까요. 린드 부인 말로는 뉴브리지 목사님 사모님은 옷을 너무 유행 따라 입어서 아주 나쁜 본보기래요. 우리 새 사모님은 소매가 볼록한 예쁜 파란 모슬린 드레스를 입고, 장미로 장식한 모자를 쓰셨어요. 제인 앤드루스는 볼록한 소매는 목사님 사모님한테는 너무 세속적인 것 같다고 했지만, 저는 그런 박정한 말은 하지 않았어요, 아주머니. 볼록한 소매를 얼마나 갖고 싶은지 저는 아니까요. 게다가 사모님이 되신 지 얼마 안 되셨으니 너그럽게 봐 드려야겠죠? 목사관이 준비될 때까지 린드 부인 댁에서 하숙하신대요."`],
[`21-4`, `그날 저녁 마릴라가 린드 부인 댁에 간 것이, 지난겨울에 빌린 이불 틀을 돌려준다는 겉으로 내세운 이유 말고 다른 동기에서였다면, 그건 에이번리 사람 대부분이 함께 지닌 너그러이 봐줄 만한 약점이었다. 린드 부인이 빌려준 물건들, 때로는 다시 돌아오리라고 기대도 안 했던 물건들이 그날 밤 빌려 간 사람들 손에 들려 줄줄이 돌아왔다. 새 목사님, 그것도 부인이 있는 목사님은 신나는 일이 좀처럼 없는 조용한 시골 마을에서 마땅히 궁금해할 만한 대상이었던 것이다.`],
[`21-5`, `앤이 상상력이 부족하다고 여겼던 늙은 벤틀리 목사님은 18년 동안 에이번리의 목사였다. 처음 왔을 때 홀아비였고, 소문이 해마다 이 사람 저 사람과 그를 결혼시켰는데도 끝까지 홀아비로 지냈다. 지난 2월 목사님은 직을 내려놓고, 신자들의 아쉬움 속에 떠났다. 설교 솜씨는 부족했어도 오랜 세월 함께하며 정이 든 좋은 목사님이었기 때문이다. 그 뒤로 에이번리 교회는 일요일마다 시험 삼아 설교하러 오는 온갖 후보 목사들의 설교를 들으며 갖가지 종교적 '구경'을 즐겼다. 그들의 운명은 교회 어른들의 판단에 달려 있었다. 하지만 커스버트 집안의 낡은 신도석 구석에 얌전히 앉아 있던 작은 빨간 머리 소녀도 그들에 대해 나름의 의견이 있었고, 매슈와 함께 그 의견을 실컷 나누었다. 마릴라는 원칙상 어떤 식으로든 목사를 비평하지 않았으니까.`],
[`21-6`, `"스미스 목사님은 안 됐을 것 같아요, 아저씨." 앤이 마지막으로 이렇게 정리했다. "린드 부인 말로는 말솜씨가 형편없었대요. 하지만 제 생각에 제일 큰 결점은 벤틀리 목사님이랑 똑같았어요. 상상력이 없었어요. 테리 목사님은 상상력이 너무 많았어요. 제가 '유령의 숲' 일 때 그랬던 것처럼 상상력이 마구 달아나게 내버려 두셨어요. 게다가 린드 부인 말로는 신학이 건전하지 않았대요. 그레셤 목사님은 정말 좋은 분이고 신앙심도 깊으셨지만, 재미있는 이야기를 너무 많이 하셔서 교회에서 사람들을 웃게 만드셨어요. 품위가 없으셨어요. 목사님은 품위가 좀 있어야 하잖아요, 그렇죠, 아저씨? 마셜 목사님은 확실히 매력적이었어요. 그런데 린드 부인이 특별히 알아봤더니 결혼도 안 하셨고 약혼도 안 하셨대요. 젊은 미혼 목사님이 에이번리에 오면 신자 중에서 결혼하실 수도 있으니 말썽이 날 거래요. 린드 부인은 정말 앞을 멀리 내다보시는 분이죠, 아저씨? 앨런 목사님을 모시기로 해서 정말 기뻐요. 설교가 재미있고, 습관처럼이 아니라 진심으로 기도하시는 것 같아서 좋았어요. 린드 부인 말로는 완벽한 분은 아니지만 1년에 750달러로 완벽한 목사님을 바랄 수는 없대요. 어쨌든 교리 문제는 린드 부인이 하나하나 꼼꼼히 물어봤으니 신학은 건전하대요. 그리고 린드 부인이 사모님 집안을 아는데, 아주 훌륭한 집안이고 여자들은 다 살림 솜씨가 좋대요. 남편은 교리가 건전하고 아내는 살림을 잘하면 목사님 가정으로서는 이상적인 조합이래요."`],
[`21-7`, `새 목사님 부부는 아직 신혼인 젊고 인상 좋은 부부였고, 스스로 택한 일에 대한 온갖 좋고 아름다운 열정으로 가득했다. 에이번리는 처음부터 이들에게 마음을 열었다. 높은 이상을 지닌 솔직하고 쾌활한 젊은 목사와, 목사관의 안주인이 된 밝고 상냥한 작은 부인을 노인도 젊은이도 모두 좋아했다. 앤은 앨런 부인을 곧바로 진심으로 사랑하게 되었다. 또 한 명의 마음이 통하는 사람을 찾아낸 것이다.`],
[`21-8`, `"앨런 사모님은 정말 사랑스러우세요." 어느 일요일 오후 앤이 선언했다. "사모님이 우리 반을 맡으셨는데, 정말 훌륭한 선생님이에요. 선생님만 질문을 다 하는 건 공평하지 않은 것 같다고 처음부터 말씀하셨어요. 아주머니, 그건 제가 늘 생각해 오던 거예요. 사모님은 우리가 묻고 싶은 건 뭐든 물어도 된다고 하셨고, 저는 정말 많이 물어봤어요. 저는 질문을 잘하거든요, 아주머니."`],
[`21-9`, `"그건 믿고말고." 마릴라가 힘주어 말했다.`],
[`21-10`, `"루비 길리스 말고는 아무도 질문을 안 했어요. 루비는 이번 여름에 주일 학교 소풍이 있냐고 물었어요. 공부랑은 아무 상관 없는 질문이라서 별로 적절하지 않다고 생각했어요. 공부는 사자 굴에 들어간 다니엘 이야기였거든요. 그런데 사모님은 그냥 웃으시면서 있을 것 같다고 하셨어요. 사모님은 웃는 모습이 정말 예뻐요. 뺨에 아주 예쁜 보조개가 있어요. 저도 뺨에 보조개가 있으면 좋겠어요, 아주머니. 처음 왔을 때보다는 절반만큼도 안 말랐지만, 아직 보조개는 없어요. 보조개가 있으면 다른 사람들한테 좋은 영향을 줄 수 있을지도 몰라요. 사모님은 우리가 언제나 다른 사람들에게 좋은 영향을 주려고 노력해야 한다고 하셨어요. 무슨 이야기든 정말 다정하게 하셨어요. 신앙이 그렇게 밝은 건 줄 처음 알았어요. 저는 늘 신앙은 좀 우울한 거라고 생각했는데, 사모님의 신앙은 안 그래요. 사모님처럼 될 수 있다면 저도 기독교인이 되고 싶어요. 벨 교장 선생님처럼은 되고 싶지 않아요."`],
[`21-11`, `"벨 씨를 두고 그런 말을 하다니 아주 못됐구나." 마릴라가 엄하게 말했다. "벨 씨는 정말 좋은 분이시다."`],
[`21-12`, `"아, 물론 좋은 분이세요." 앤이 맞장구를 쳤다. "그런데 좋은 사람이라서 기쁜 것 같지는 않아요. 제가 좋은 사람이 될 수 있다면, 기뻐서 하루 종일 춤추고 노래할 거예요. 사모님은 춤추고 노래하기엔 나이가 많으시고, 목사님 사모님이 그러면 물론 품위가 없겠죠. 그래도 사모님은 기독교인인 게 기쁘다는 게 그냥 느껴져요. 그렇게 안 해도 천국에 갈 수 있다 해도 기독교인이 되셨을 것 같아요."`],
[`21-13`, `"조만간 앨런 목사님 부부를 차 마시러 모셔야겠구나." 마릴라가 곰곰이 생각하며 말했다. "다른 집엔 거의 다 가셨는데 우리 집에만 안 오셨어. 어디 보자. 다음 주 수요일이 좋겠다. 하지만 매슈한테는 한마디도 하지 마라. 손님이 오는 걸 알면 핑계를 대고 그날 어디로 가 버릴 테니까. 벤틀리 목사님한테는 익숙해져서 괜찮았지만, 새 목사님과 친해지는 건 어려워할 거고, 새 사모님은 아마 무서워서 죽으려고 할 거다."`],
[`21-14`, `"죽은 사람처럼 입을 꼭 다물게요." 앤이 장담했다. "그런데, 아, 아주머니, 그날 제가 케이크를 만들어도 돼요? 앨런 사모님을 위해 뭔가 하고 싶어요. 아시잖아요, 이젠 제가 케이크를 꽤 잘 만든다는 거."`],
[`21-15`, `"층 케이크는 만들어도 된다." 마릴라가 약속했다.`],
[`21-16`, `월요일과 화요일, 초록 지붕 집에서는 성대한 준비가 이어졌다. 목사님 부부를 차 마시러 모시는 것은 진지하고 중요한 일이었고, 마릴라는 에이번리의 어떤 살림꾼에게도 뒤지지 않겠다고 단단히 마음먹었다. 앤은 흥분과 기쁨으로 어쩔 줄 몰랐다. 화요일 해 질 녘, 앤은 드라이어드의 샘가 커다란 붉은 돌 위에 다이애나와 나란히 앉아 전나무 진액을 묻힌 작은 나뭇가지로 물 위에 무지개를 만들며 모든 것을 이야기했다.`],
[`21-17`, `"내가 내일 아침에 만들 케이크랑, 아주머니가 차 마시기 직전에 만드실 비스킷 말고는 다 준비됐어, 다이애나. 정말이지, 아주머니랑 나는 이틀 동안 너무 바빴어. 목사님 가족을 차 마시러 모시는 건 정말 큰 책임이야. 이런 경험은 처음이야. 우리 찬장을 꼭 봐야 해. 장관이라니까. 닭고기 젤리랑 차가운 소 혓바닥 요리가 있을 거야. 빨간 젤리랑 노란 젤리 두 가지, 휘핑크림이랑 레몬 파이, 체리 파이, 쿠키 세 종류, 과일 케이크, 그리고 아주머니가 목사님들을 위해 특별히 아껴 두시는 그 유명한 노란 자두 절임, 파운드케이크랑 층 케이크, 그리고 아까 말한 비스킷. 목사님이 소화가 안 되셔서 갓 구운 빵을 못 드실 경우를 대비해서 새 빵이랑 묵은 빵도 둘 다 있어. 린드 부인 말로는 목사님들은 대부분 소화 불량이래. 하지만 앨런 목사님은 목사님이 되신 지 얼마 안 되셔서 아직 나쁜 영향은 안 받으셨을 것 같아. 층 케이크 생각만 하면 온몸이 오싹해. 아, 다이애나, 맛이 없으면 어떡하지! 어젯밤엔 머리가 커다란 층 케이크로 된 무시무시한 도깨비한테 쫓겨 다니는 꿈을 꿨어."`],
[`21-18`, `"맛있을 거야, 걱정 마." 아주 편안한 친구인 다이애나가 장담했다. "2주 전에 '한가로운 숲'에서 점심으로 먹었던 네 케이크 한 조각, 정말 근사했잖아."`],
[`21-19`, `"응. 그런데 케이크는 특히 잘돼야 할 때 꼭 망쳐 버리는 끔찍한 버릇이 있거든." 앤이 전나무 진액을 특히 듬뿍 바른 나뭇가지를 물에 띄우며 한숨을 쉬었다. "그래도 하느님께 맡기고 밀가루 넣는 것만 조심하면 되겠지. 아, 봐, 다이애나, 정말 예쁜 무지개야! 우리가 가고 나면 드라이어드가 나와서 이걸 스카프로 가져갈까?"`],
[`21-20`, `"드라이어드 같은 건 없다는 거 알잖아." 다이애나가 말했다. 다이애나의 어머니는 '유령의 숲' 일을 알고 몹시 화를 냈다. 그 뒤로 다이애나는 상상력을 흉내 내는 일을 삼갔고, 해롭지 않은 드라이어드라 해도 믿는 마음을 키우는 건 현명하지 않다고 생각했다.`],
[`21-21`, `"하지만 있다고 상상하는 건 정말 쉬운걸." 앤이 말했다. "나는 매일 밤 잠자리에 들기 전에 창밖을 내다보면서, 드라이어드가 정말 여기 앉아서 샘을 거울삼아 머리를 빗고 있을까 궁금해해. 아침엔 이슬 위에 드라이어드 발자국이 있나 찾아보기도 하고. 아, 다이애나, 드라이어드를 믿는 마음을 버리지 마!"`],
[`21-22`, `수요일 아침이 밝았다. 앤은 너무 들떠서 잠을 이룰 수가 없어 해 뜰 무렵에 일어났다. 전날 저녁 샘물에서 첨벙거린 탓에 지독한 코감기에 걸렸지만, 폐렴이라도 걸리지 않는 한 그날 아침 요리에 대한 앤의 열정은 꺾일 수 없었다. 아침을 먹고 앤은 케이크를 만들기 시작했다. 마침내 오븐 문을 닫았을 때 앤은 숨을 길게 내쉬었다.`],
[`21-23`, `"이번엔 아무것도 잊어버리지 않은 게 확실해요, 아주머니. 그런데 부풀어 오를까요? 혹시 베이킹파우더가 안 좋으면 어떡해요? 새 통에서 꺼내 썼거든요. 린드 부인 말로는 요즘은 뭐든지 섞음질을 해서 좋은 베이킹파우더를 구할 수 있을지 장담할 수 없대요. 정부가 이 문제를 다뤄야 하는데, 보수당 정부가 그럴 날은 절대 안 올 거래요. 아주머니, 케이크가 안 부풀면 어떡해요?"`],
[`21-24`, `"그거 없어도 먹을 건 충분하다." 마릴라는 담담하게 그 문제를 바라보았다.`],
[`21-25`, `하지만 케이크는 잘 부풀어 올랐고, 금빛 거품처럼 가볍고 폭신하게 오븐에서 나왔다. 기쁨으로 볼이 발그레해진 앤은 루비처럼 붉은 젤리를 층층이 바르며 케이크를 쌓아 올렸다. 그리고 상상 속에서 앨런 부인이 그 케이크를 먹고, 어쩌면 한 조각 더 달라고 하는 모습을 보았다!`],
[`21-26`, `"물론 제일 좋은 찻잔 세트를 쓰시겠죠, 아주머니?" 앤이 말했다. "고사리랑 들장미로 식탁을 꾸며도 돼요?"`],
[`21-27`, `"그런 건 다 쓸데없는 짓이다." 마릴라가 코웃음을 쳤다. "내 생각엔 중요한 건 먹을 것이지 실없는 장식이 아니다."`],
[`21-28`, `"배리 부인은 식탁을 꾸미셨대요." 뱀처럼 지혜롭지 않다고는 할 수 없는 앤이 말했다. "그랬더니 목사님이 근사한 칭찬을 하셨대요. 입뿐만 아니라 눈도 즐거운 잔치라고요."`],
[`21-29`, `"그럼, 좋을 대로 해라." 배리 부인이든 누구든 결코 지고 싶지 않았던 마릴라가 말했다. "그릇이랑 음식 놓을 자리만 남겨 두거라."`],
[`21-30`, `앤은 배리 부인의 식탁이 명함도 못 내밀 만큼 공을 들여 꾸몄다. 장미와 고사리가 넉넉했고 앤 자신이 예술적인 감각이 뛰어났기에, 차 식탁은 정말 아름다웠다. 목사님 부부는 자리에 앉자마자 입을 모아 그 아름다움에 감탄했다.`],
[`21-31`, `"앤이 한 거예요." 마릴라가 무뚝뚝하지만 공정하게 말했다. 그리고 앨런 부인의 칭찬하는 미소를 받자, 앤은 이 세상에서 누리기엔 너무 큰 행복이라고 느꼈다.`],
[`21-32`, `매슈도 그 자리에 있었다. 어떻게 끌어들였는지는 하느님과 앤만이 알 일이었다. 매슈는 수줍음과 긴장으로 어찌나 쩔쩔맸는지 마릴라는 아예 포기했지만, 앤이 그를 맡아 얼마나 잘 다독였던지 매슈는 가장 좋은 옷에 하얀 칼라를 달고 식탁에 앉아 목사님과 제법 재미있게 이야기를 나누었다. 앨런 부인에게는 한마디도 하지 않았지만, 그것까지 바랄 수는 없었으리라.`],
[`21-33`, `앤의 층 케이크가 나오기 전까지는 모든 것이 결혼식 종소리처럼 즐겁게 흘러갔다. 이미 갖가지 음식을 잔뜩 받은 앨런 부인은 케이크를 사양했다. 그러자 실망한 앤의 얼굴을 본 마릴라가 웃으며 말했다.`],
[`21-34`, `"아, 이건 꼭 한 조각 드셔야 해요, 앨런 부인. 앤이 부인을 위해 일부러 만든 거랍니다."`],
[`21-35`, `"그렇다면 꼭 맛을 봐야겠네요." 앨런 부인이 웃으며 통통한 세모 조각 하나를 덜었고, 목사님과 마릴라도 그렇게 했다.`],
[`21-36`, `한 입 먹은 앨런 부인의 얼굴에 아주 묘한 표정이 스쳤다. 하지만 부인은 한마디도 하지 않고 꿋꿋이 케이크를 먹었다. 그 표정을 본 마릴라가 서둘러 케이크를 맛보았다.`],
[`21-37`, `"앤 셜리!" 마릴라가 외쳤다. "대체 이 케이크에 뭘 넣은 거니?"`],
[`21-38`, `"요리법에 쓰인 것 말고는 아무것도 안 넣었어요, 아주머니." 앤이 괴로운 얼굴로 외쳤다. "아, 잘못됐어요?"`],
[`21-39`, `"잘못됐냐고! 그냥 끔찍하다. 앨런 부인, 드시지 마세요. 앤, 네가 직접 먹어 봐라. 무슨 향료를 넣었니?"`],
[`21-40`, `"바닐라요." 케이크를 맛본 앤이 창피해서 새빨개진 얼굴로 말했다. "바닐라만 넣었어요. 아, 아주머니, 베이킹파우더 때문일 거예요. 그 베이킹파우더가 처음부터 의심스러웠…"`],
[`21-41`, `"베이킹파우더는 무슨! 네가 쓴 바닐라 병 가져와 봐라."`],
[`21-42`, `앤은 찬장으로 달려가, 갈색 액체가 조금 남아 있고 누런 글씨로 '최고급 바닐라'라고 적힌 작은 병을 들고 돌아왔다.`],
[`21-43`, `마릴라는 병을 받아 마개를 열고 냄새를 맡았다.`],
[`21-44`, `"세상에, 앤, 너 이 케이크에 진통제 연고를 넣었구나. 지난주에 진통제 병을 깨뜨려서 남은 걸 빈 바닐라 병에 부어 놨거든. 미리 말해 주지 않았으니 내 잘못도 조금은 있다. 그래도 제발, 냄새는 왜 못 맡았니?"`],
[`21-45`, `이중의 망신에 앤은 눈물을 쏟았다.`],
[`21-46`, `"못 맡았어요. 코감기가 너무 심해서요!" 그러고는 다락방으로 달아나 침대에 엎어져, 어떤 위로도 받지 않겠다는 사람처럼 울었다.`],
[`21-47`, `얼마 뒤 가벼운 발소리가 계단에 울리더니 누군가 방으로 들어왔다.`],
[`21-48`, `"아, 아주머니." 앤이 고개도 들지 않은 채 흐느꼈다. "저는 영원히 망신을 당했어요. 절대 이 일을 씻어 낼 수 없을 거예요. 소문이 날 거예요. 에이번리에선 늘 소문이 나잖아요. 다이애나가 케이크가 어떻게 됐냐고 물으면 사실대로 말해야 해요. 저는 영원히 진통제 연고로 케이크 맛을 낸 여자애라고 손가락질 받을 거예요. 길… 학교 남자애들은 그걸로 평생 웃을 거예요. 아, 아주머니, 기독교인다운 동정심이 조금이라도 있으시다면, 이 일이 있고 나서 내려가서 설거지하라고는 하지 말아 주세요. 목사님 부부가 가시고 나면 설거지할게요. 하지만 다시는 앨런 사모님 얼굴을 볼 수 없어요. 사모님은 제가 독을 먹이려 했다고 생각하실지도 몰라요. 린드 부인 말로는 은인한테 독을 먹이려 한 고아 여자애를 안대요. 하지만 그 연고는 독이 아니에요. 먹으라고 만든 약이에요. 케이크에 넣으라고 만든 건 아니지만요. 사모님께 그렇게 말씀드려 주실래요, 아주머니?"`],
[`21-49`, `"네가 벌떡 일어나서 직접 말씀드리면 어떨까?" 즐거운 목소리가 말했다.`],
[`21-50`, `앤이 벌떡 일어나 보니, 앨런 부인이 침대 곁에 서서 웃음 띤 눈으로 앤을 내려다보고 있었다.`],
[`21-51`, `"아가, 이렇게 울면 안 돼." 앤의 비극적인 얼굴에 진심으로 마음이 쓰인 앨런 부인이 말했다. "이건 누구라도 할 수 있는 우스운 실수일 뿐이란다."`],
[`21-52`, `"아니에요, 이런 실수는 저나 하는 거예요." 앤이 쓸쓸하게 말했다. "그 케이크를 사모님께 정말 맛있게 만들어 드리고 싶었어요."`],
[`21-53`, `"그래, 알고 있단다. 그리고 정말이지, 케이크가 잘됐을 때와 똑같이 네 친절과 마음 씀씀이가 고맙구나. 자, 이제 그만 울고 나랑 같이 내려가서 네 꽃밭을 보여 주렴. 커스버트 양 말이 너만의 작은 꽃밭이 있다던데. 꼭 보고 싶구나. 나도 꽃을 무척 좋아하거든."`],
[`21-54`, `앤은 이끄는 대로 내려가 위로를 받으며, 앨런 부인이 마음이 통하는 사람이라는 게 정말 하느님의 뜻이라고 생각했다. 진통제 케이크 이야기는 더 이상 나오지 않았고, 손님들이 돌아갔을 때 앤은 그 끔찍한 사건을 생각하면 기대 이상으로 즐거운 저녁을 보냈다는 것을 깨달았다. 그래도 앤은 깊은 한숨을 쉬었다.`],
[`21-55`, `"아주머니, 내일은 아직 아무 실수도 없는 새날이라고 생각하면 기분 좋지 않아요?"`],
[`21-56`, `"장담하는데, 내일도 실수를 잔뜩 할 거다." 마릴라가 말했다. "너처럼 실수를 많이 하는 아이는 처음 본다, 앤."`],
[`21-57`, `"네, 저도 잘 알아요." 앤이 슬프게 인정했다. "그런데 아주머니, 저한테서 용기를 주는 점 하나 눈치채신 적 있어요? 저는 같은 실수를 두 번 하지는 않아요."`],
[`21-58`, `"늘 새로운 실수를 하니 그게 무슨 도움이 되겠니."`],
[`21-59`, `"아, 모르시겠어요, 아주머니? 한 사람이 할 수 있는 실수에도 한계가 있을 거예요. 그 끝에 다다르면 더는 실수를 안 하게 되겠죠. 정말 위로가 되는 생각이에요."`],
[`21-60`, `"그래, 어서 가서 그 케이크나 돼지한테 줘라." 마릴라가 말했다. "사람이 먹을 게 못 된다. 제리 부트조차 못 먹을 거다."`],
  ]
};

/* 원문 책장: 원작 27장 — 이 앱을 위해 새로 우리말로 옮김 */
BOOK.ch8 = {
  title: `허영심과 마음고생`,
  orig: `원작 27장`,
  paras: [
[`27-1`, `4월 말의 어느 저녁, 부인회 모임을 마치고 집으로 걸어오던 마릴라는 겨울이 완전히 지나갔음을 깨달았다. 봄은 가장 나이 들고 슬픈 이에게나 가장 어리고 명랑한 이에게나 어김없이 기쁨의 설렘을 안겨 준다. 마릴라는 자기 생각과 감정을 곰곰이 따져 보는 사람이 아니었다. 아마 자신은 부인회와 선교 헌금함, 교회 부속실에 새로 깔 양탄자를 생각하고 있다고 여겼으리라. 그러나 그 생각들 아래에는 기우는 햇살 속에 연보랏빛 안개로 피어오르는 붉은 들판, 시냇물 건너 풀밭 위로 길고 뾰족하게 드리운 전나무 그림자, 거울 같은 숲속 웅덩이를 둘러싼 진홍빛 꽃눈의 단풍나무들, 잿빛 잔디 아래에서 깨어나 숨 쉬기 시작하는 세상에 대한 조화로운 느낌이 깔려 있었다. 봄이 온 땅에 퍼져 있었고, 마릴라의 침착한 중년의 걸음도 그 깊고 원초적인 기쁨 덕분에 한결 가볍고 빨라졌다.`],
[`27-2`, `마릴라의 눈길은 다정하게 초록 지붕 집에 머물렀다. 집은 나무들 사이로 얼굴을 내밀고, 창문마다 햇빛을 받아 작은 영광의 불꽃처럼 반짝였다. 축축한 오솔길을 골라 디디며 마릴라는, 앤이 초록 지붕 집에 오기 전 부인회 모임이 있던 저녁들의 쓸쓸함과 달리, 이제는 탁탁 소리를 내며 타오르는 장작불과 깔끔하게 차려진 저녁상이 기다리는 집으로 간다는 것이 참으로 흐뭇하다고 생각했다.`],
[`27-3`, `그러니 부엌에 들어선 마릴라가 불은 꺼져 있고 앤은 어디에도 보이지 않는 것을 발견했을 때 실망하고 화가 난 것도 당연했다. 앤에게 다섯 시까지는 꼭 차를 준비해 두라고 일러두었는데, 이제 마릴라는 밭갈이에서 돌아올 매슈를 위해 두 번째로 좋은 옷을 서둘러 벗고 손수 저녁을 지어야 했다.`],
[`27-4`, `"앤 아가씨가 돌아오기만 해 봐라." 마릴라는 필요 이상으로 힘을 주어 고기 써는 칼로 불쏘시개를 깎으며 엄하게 말했다. 매슈는 들어와서 구석 자리에 앉아 참을성 있게 저녁을 기다리고 있었다. "또 다이애나랑 어디 쏘다니면서 이야기를 쓰거나 대사 연습을 하거나, 그런 실없는 짓을 하느라 시간도, 할 일도 까맣게 잊었겠지. 이런 일은 따끔하게 바로잡아야 해요. 앨런 사모님이 앤만큼 똑똑하고 착한 아이는 처음 봤다고 하셔도 상관없어요. 똑똑하고 착한 건 맞을지 몰라도, 머릿속이 엉뚱한 생각으로 가득 차서 다음엔 무슨 일을 벌일지 알 수가 없다니까요. 하나를 겨우 떼면 또 다른 걸 시작하고. 아니, 이런! 오늘 부인회에서 레이첼 린드가 한 말 때문에 그렇게 화가 났었는데, 내가 지금 똑같은 소리를 하고 있네요. 앨런 사모님이 앤 편을 들어 주셔서 정말 다행이었어요. 안 그랬으면 여러 사람 앞에서 레이첼한테 너무 날카로운 말을 했을 거예요. 앤한테 흠이 많은 건 하느님도 아시고, 나도 부정하지 않아요. 하지만 앤을 키우는 건 나지 레이첼 린드가 아니에요. 레이첼은 천사 가브리엘이 에이번리에 산다 해도 흠을 잡을 사람이니까. 그렇다고 해도, 오늘 오후엔 집에 있으면서 살림을 보라고 했는데 이렇게 나가 버리는 건 안 될 일이에요. 앤이 흠은 많아도 말을 안 듣거나 믿지 못할 아이라고 느낀 적은 없었는데, 이번엔 그렇다니 정말 속상하네요."`],
[`27-5`, `"글쎄다, 난 잘 모르겠다만." 참을성 있고 지혜로우며, 무엇보다 배가 고팠던 매슈가 말했다. 매슈는 마릴라가 화를 다 털어놓게 두는 편이 낫다고 여겼다. 때아닌 말다툼으로 붙잡지만 않으면 마릴라가 하던 일을 훨씬 빨리 끝낸다는 것을 경험으로 알았기 때문이다. "너무 성급하게 판단하는 건지도 모르지, 마릴라. 정말 말을 안 들었는지 확실히 알기 전엔 믿지 못할 아이라고 하지 마라. 다 설명이 될지도 모르잖니. 앤은 설명하는 데는 선수니까."`],
[`27-6`, `"내가 있으라고 했는데 없잖아요." 마릴라가 맞받았다. "그걸 내가 납득하게 설명하긴 어려울걸요. 물론 오라버니가 앤 편을 들 줄은 알았어요. 하지만 앤을 키우는 건 오라버니가 아니라 나예요."`],
[`27-7`, `저녁 준비가 끝났을 때는 이미 어두워져 있었다. 그런데도 할 일을 잊은 것을 뉘우치며 숨을 헐떡이고 통나무 다리나 '연인의 오솔길'을 서둘러 건너오는 앤의 모습은 보이지 않았다. 마릴라는 굳은 얼굴로 설거지를 하고 그릇을 정리했다. 그러고는 지하실에 내려갈 때 쓸 초가 필요해서, 보통 앤의 탁자 위에 놓여 있는 초를 가지러 동쪽 다락방으로 올라갔다. 초에 불을 붙이고 돌아선 순간, 마릴라는 앤이 베개에 얼굴을 묻고 침대에 엎드려 있는 것을 보았다.`],
[`27-8`, `"세상에." 깜짝 놀란 마릴라가 말했다. "자고 있었니, 앤?"`],
[`27-9`, `"아니요." 웅얼거리는 대답이 들려왔다.`],
[`27-10`, `"그럼 어디 아프니?" 마릴라가 걱정스럽게 물으며 침대로 다가갔다.`],
[`27-11`, `앤은 사람들의 눈에서 영원히 숨어 버리고 싶다는 듯 베개 속으로 더 깊이 파고들었다.`],
[`27-12`, `"아니요. 하지만 제발요, 아주머니, 나가 주세요. 저를 보지 마세요. 저는 절망의 구렁텅이에 빠졌어요. 이제 누가 반에서 일등을 하든, 누가 작문을 제일 잘 쓰든, 누가 주일 학교 성가대에서 노래를 하든 상관없어요. 그런 작은 일들은 이제 아무 의미도 없어요. 저는 다시는 어디에도 갈 수 없을 테니까요. 제 인생은 끝났어요. 제발요, 아주머니, 나가 주세요. 저를 보지 마세요."`],
[`27-13`, `"세상에 이런 소리를 들어 본 사람이 있을까?" 영문을 모르는 마릴라가 물었다. "앤 셜리, 대체 무슨 일이니? 무슨 짓을 한 거야? 당장 일어나서 말해 봐라. 당장, 어서. 자, 무슨 일이니?"`],
[`27-14`, `앤은 절망 속에서도 순순히 바닥으로 미끄러져 내려왔다.`],
[`27-15`, `"제 머리를 보세요, 아주머니." 앤이 속삭였다.`],
[`27-16`, `마릴라는 촛불을 들어 올려 등 뒤로 탐스럽게 흘러내린 앤의 머리카락을 유심히 살폈다. 확실히 아주 이상한 모습이었다.`],
[`27-17`, `"앤 셜리, 머리에 무슨 짓을 한 거니? 아니, 초록색이잖아!"`],
[`27-18`, `이 세상에 있는 색이라면 초록이라고 부를 수도 있겠다. 칙칙하고 구릿빛이 도는 기묘한 초록색에, 군데군데 원래의 붉은색이 줄무늬처럼 남아 있어 그 끔찍함을 더했다. 마릴라는 평생 그 순간의 앤의 머리처럼 괴상한 것을 본 적이 없었다.`],
[`27-19`, `"네, 초록색이에요." 앤이 신음했다. "빨강 머리보다 나쁜 건 없을 줄 알았어요. 그런데 이제 알겠어요. 초록 머리가 열 배는 더 나빠요. 아, 아주머니, 제가 얼마나 비참한지 모르실 거예요."`],
[`27-20`, `"네가 어쩌다 이 꼴이 됐는지는 모르겠다만, 꼭 알아내야겠다." 마릴라가 말했다. "당장 부엌으로 내려가자. 여긴 너무 추워. 그리고 네가 무슨 짓을 했는지 낱낱이 말해 봐라. 얼마 전부터 뭔가 이상한 일이 생기겠다 싶었다. 두 달 넘게 말썽이 없었으니 슬슬 하나 터질 때가 됐다 했지. 자, 그래서 머리에 무슨 짓을 한 거니?"`],
[`27-21`, `"염색했어요."`],
[`27-22`, `"염색! 머리를 염색했다고! 앤 셜리, 그게 나쁜 짓인 줄 몰랐니?"`],
[`27-23`, `"네, 조금 나쁜 짓인 줄은 알았어요." 앤이 인정했다. "하지만 빨강 머리를 없앨 수 있다면 조금 나쁜 짓을 할 가치가 있다고 생각했어요. 대가를 다 따져 봤다고요, 아주머니. 게다가 그 대신 다른 일에서 더더욱 착하게 굴려고 했어요."`],
[`27-24`, `"글쎄다." 마릴라가 비꼬듯 말했다. "내가 머리를 염색할 가치가 있다고 마음먹었다면, 적어도 점잖은 색으로 했겠다. 초록색으로는 안 했을 거야."`],
[`27-25`, `"하지만 초록색으로 물들이려던 게 아니었어요, 아주머니." 앤이 풀이 죽어 항변했다. "나쁜 짓을 할 거면 보람 있게 하려고 했죠. 그 사람이 제 머리가 아름다운 까마귀처럼 새까매질 거라고 했어요. 틀림없다고 장담했다고요. 제가 어떻게 그 사람 말을 의심할 수 있었겠어요, 아주머니? 저도 제 말을 의심받는 게 어떤 기분인지 아는걸요. 그리고 앨런 사모님은 증거가 없으면 남이 거짓말한다고 의심해선 안 된다고 하셨어요. 이제는 증거가 있죠. 초록 머리면 누구에게나 충분한 증거니까요. 하지만 그때는 증거가 없었고, 저는 그 사람 말을 하나도 빠짐없이 믿었어요."`],
[`27-26`, `"누가 그랬다는 거니? 누구 이야기를 하는 거야?"`],
[`27-27`, `"오늘 오후에 왔던 행상인이요. 그 사람한테 염색약을 샀어요."`],
[`27-28`, `"앤 셜리, 그런 이탈리아 사람들은 절대로 집에 들이지 말라고 몇 번이나 말했니! 그 사람들이 드나들게 부추기는 건 질색이다."`],
[`27-29`, `"아, 집에 들이지 않았어요. 아주머니 말씀을 기억하고, 제가 밖으로 나가서 문을 꼭 닫고 계단에서 물건을 구경했어요. 게다가 그 사람은 이탈리아 사람이 아니라 독일에서 온 유대인이었어요. 아주 재미있는 물건이 가득 든 커다란 상자를 가지고 있었는데, 독일에 있는 아내와 아이들을 데려올 돈을 벌려고 열심히 일하는 중이라고 했어요. 가족 이야기를 어찌나 애틋하게 하던지 제 마음이 뭉클했어요. 그렇게 훌륭한 목적을 돕고 싶어서 뭔가 사 주고 싶었죠. 그러다 갑자기 머리 염색약 병이 눈에 들어왔어요. 행상인은 어떤 머리든 아름다운 까마귀처럼 새까맣게 물들이고 감아도 지워지지 않는다고 보장했어요. 순식간에 저는 아름다운 새까만 머리를 한 제 모습을 떠올렸고, 그 유혹을 도저히 이길 수 없었어요. 그런데 그 병은 75센트였고, 저한테는 닭 키워서 번 돈 중에 50센트밖에 안 남아 있었어요. 행상인은 마음씨가 무척 좋은 사람 같았어요. 저니까 50센트에 팔겠다고, 그럼 거의 거저 주는 거라고 했거든요. 그래서 샀고, 그 사람이 가자마자 여기 올라와서 설명서대로 낡은 머리 솔로 발랐어요. 한 병을 다 썼어요. 그런데, 아, 아주머니, 머리가 그 끔찍한 색으로 변한 걸 보고 나쁜 짓을 한 걸 얼마나 뉘우쳤는지 몰라요. 그 뒤로 지금까지 계속 뉘우치고 있어요."`],
[`27-30`, `"그래, 그 뉘우침이 보람 있기를 바란다." 마릴라가 엄하게 말했다. "그리고 네 허영심이 너를 어디로 이끌었는지 이제 눈을 떴으면 좋겠구나, 앤. 이걸 어떻게 해야 할지 하느님만 아시겠다. 우선 머리를 잘 감아서 효과가 있는지 보자."`],
[`27-31`, `그래서 앤은 비누와 물로 머리를 힘껏 문질러 감았다. 그러나 원래의 붉은색을 씻어 내려는 것만큼이나 아무 소용이 없었다. 행상인이 다른 면에서는 어떨지 몰라도, 감아도 지워지지 않는다는 말만큼은 분명 사실이었다.`],
[`27-32`, `"아, 아주머니, 어떡해요?" 앤이 눈물을 흘리며 물었다. "이 일은 절대 잊히지 않을 거예요. 사람들은 제 다른 실수들, 진통제 케이크랑 다이애나를 취하게 한 일이랑 린드 부인께 화를 낸 일은 거의 다 잊었어요. 하지만 이건 절대 안 잊을 거예요. 저를 점잖지 못한 아이라고 생각할 거예요. 아, 아주머니, '처음 속이려 할 때 우리는 얼마나 얽히고설킨 거미줄을 짜는가.' 시지만 정말 맞는 말이에요. 그리고 아, 조시 파이가 얼마나 비웃을까요! 아주머니, 저는 조시 파이를 마주할 수 없어요. 저는 프린스에드워드섬에서 제일 불행한 여자애예요."`],
[`27-33`, `앤의 불행은 일주일 동안 이어졌다. 그동안 앤은 아무 데도 가지 않고 날마다 머리를 감았다. 바깥사람 중에서는 다이애나만이 그 치명적인 비밀을 알았지만, 다이애나는 절대 말하지 않겠다고 엄숙하게 약속했다. 그리고 여기서 밝혀 두건대, 다이애나는 그 약속을 지켰다. 일주일이 지나자 마릴라가 단호하게 말했다.`],
[`27-34`, `"소용없다, 앤. 세상에 지워지지 않는 염색약이 있다면 바로 이거다. 머리를 잘라야겠구나. 다른 방법이 없어. 그런 꼴로는 밖에 나갈 수 없잖니."`],
[`27-35`, `앤의 입술이 떨렸다. 그러나 앤은 마릴라의 말이 쓰디쓴 진실임을 알았다. 앤은 처량한 한숨을 쉬며 가위를 가지러 갔다.`],
[`27-36`, `"어서 잘라 주세요, 아주머니. 빨리 끝내 버려요. 아, 마음이 찢어지는 것 같아요. 이건 정말 하나도 낭만적이지 않은 고난이에요. 책 속의 여자애들은 열병을 앓다가 머리카락을 잃거나, 착한 일을 하려고 머리카락을 팔아 돈을 마련하잖아요. 그런 식으로 잃는다면 저도 이렇게까지 속상하진 않을 거예요. 하지만 끔찍한 색으로 염색해서 머리를 자르는 거라면 위안이 될 게 하나도 없잖아요, 그렇죠? 방해가 안 된다면 자르시는 내내 울게요. 너무나 비극적인 일 같거든요."`],
[`27-37`, `그때 앤은 울었지만, 나중에 위층으로 올라가 거울을 들여다보았을 때는 절망 속에서 차분해졌다. 마릴라는 철저하게 일을 해냈고, 머리는 될 수 있는 한 짧게 바싹 잘라야 했다. 그 결과는, 아무리 부드럽게 말해도, 어울린다고 하기 어려웠다. 앤은 곧바로 거울을 벽 쪽으로 돌려 버렸다.`],
[`27-38`, `"머리가 다시 자랄 때까지 다시는, 절대로 제 모습을 보지 않을 거야." 앤이 격하게 외쳤다.`],
[`27-39`, `그러더니 갑자기 거울을 바로 돌려놓았다.`],
[`27-40`, `"아니, 볼 거야. 그런 나쁜 짓을 한 벌을 받아야지. 방에 올 때마다 나를 보고 내가 얼마나 못생겼는지 볼 거야. 상상으로 없애려고 하지도 않을 거야. 하필 머리카락 때문에 내가 허영심을 품고 있었을 줄은 몰랐는데, 이제 알겠어. 빨갛긴 해도 길고 숱 많고 곱슬곱슬했으니까. 다음엔 코에 무슨 일이 생기겠지."`],
[`27-41`, `다음 월요일, 앤의 짧은 머리는 학교에서 큰 화제가 되었다. 그러나 다행히 아무도 진짜 이유를 짐작하지 못했다. 조시 파이조차 몰랐다. 물론 조시는 앤에게 꼭 허수아비 같다고 말해 주는 것을 잊지 않았지만.`],
[`27-42`, `"조시가 그렇게 말했을 때 저는 아무 말도 안 했어요." 그날 저녁, 앤은 두통 때문에 소파에 누워 있는 마릴라에게 털어놓았다. "그것도 제가 받는 벌의 일부니까 꾹 참아야 한다고 생각했거든요. 허수아비 같다는 말을 들으니 정말 힘들었고 뭐라고 쏘아붙이고 싶었어요. 하지만 안 했어요. 그냥 경멸하는 눈빛으로 한 번 쓱 훑어보고 용서해 줬어요. 남을 용서하면 아주 훌륭한 사람이 된 기분이 들지 않아요? 앞으로는 착해지는 데 온 힘을 쏟고 다시는 예뻐지려고 애쓰지 않을 거예요. 물론 착한 게 더 낫죠. 알아요. 하지만 알면서도 믿기 어려울 때가 있어요. 저는 정말 착해지고 싶어요, 아주머니. 아주머니랑 앨런 사모님, 스테이시 선생님처럼요. 그래서 자라서 아주머니께 자랑스러운 사람이 되고 싶어요. 다이애나가 그러는데, 머리가 자라기 시작하면 검은 벨벳 리본을 머리에 두르고 한쪽에 나비 모양으로 묶으래요. 아주 잘 어울릴 거래요. 저는 그걸 '스누드'라고 부를 거예요. 아주 낭만적으로 들리잖아요. 그런데 제가 말을 너무 많이 하나요, 아주머니? 머리가 아프세요?"`],
[`27-43`, `"이제 좀 나아졌다. 오후엔 정말 지독하게 아팠지만. 이 두통이 점점 심해지는구나. 의사한테 한번 가 봐야겠다. 네 수다는… 글쎄, 싫은 것 같지는 않다. 이젠 익숙해졌으니까."`],
[`27-44`, `그것은 앤의 이야기를 듣는 게 좋다는 마릴라 나름의 표현이었다.`],
  ]
};

/* 원문 책장: 원작 28장 — 이 앱을 위해 새로 우리말로 옮김 */
BOOK.ch9 = {
  title: `불운한 백합 아가씨`,
  orig: `원작 28장`,
  paras: [
[`28-1`, `"당연히 네가 일레인을 해야지, 앤." 다이애나가 말했다. "나는 저기를 떠내려갈 용기가 절대 안 나."`],
[`28-2`, `"나도." 루비 길리스가 몸을 떨며 말했다. "평저선에 두세 명이 같이 타고 앉아서 떠내려가는 건 괜찮아. 그땐 재미있지. 하지만 누워서 죽은 척하는 건 정말 못 하겠어. 무서워서 진짜로 죽을 거야."`],
[`28-3`, `"물론 낭만적이긴 하겠지." 제인 앤드루스가 인정했다. "하지만 나는 가만히 있지 못할 거야. 내가 어디쯤 왔는지, 너무 멀리 떠내려가는 건 아닌지 보려고 수시로 벌떡 일어날걸. 그러면 앤, 분위기가 다 깨지잖아."`],
[`28-4`, `"하지만 빨강 머리 일레인이라니 너무 우스워." 앤이 한탄했다. "떠내려가는 건 무섭지 않고, 일레인도 정말 하고 싶어. 그래도 우스운 건 우스운 거야. 일레인은 루비가 해야 해. 루비는 살결이 하얗고 길고 고운 금발이잖아. 일레인은 '빛나는 머리카락을 온통 흘러내리고' 있었다잖아. 그리고 일레인은 백합 아가씨야. 빨강 머리가 백합 아가씨일 수는 없어."`],
[`28-5`, `"네 살결도 루비만큼 하얀걸." 다이애나가 진지하게 말했다. "그리고 네 머리는 자르기 전보다 훨씬 짙어졌어."`],
[`28-6`, `"어머, 정말 그렇게 생각해?" 앤이 기쁨으로 얼굴을 붉히며 외쳤다. "나도 가끔 그런 생각을 했어. 하지만 아니라고 할까 봐 아무한테도 감히 물어보지 못했어. 다이애나, 이제는 적갈색이라고 불러도 될까?"`],
[`28-7`, `"응, 그리고 정말 예쁜 것 같아." 다이애나는 앤의 머리 위로 몽글몽글 모여 있는 짧고 보드라운 곱슬머리를 감탄하며 바라보았다. 그 머리는 아주 멋들어진 검은 벨벳 리본과 나비매듭으로 고정되어 있었다.`],
[`28-8`, `아이들은 '과수원 비탈' 아래 연못가에 서 있었다. 그곳에는 자작나무가 늘어선 작은 곶이 물가로 뻗어 나와 있었고, 그 끝에는 낚시꾼과 오리 사냥꾼들이 쓰도록 물 위로 내어 지은 작은 나무 발판이 있었다. 루비와 제인은 한여름 오후를 다이애나와 보내고 있었고, 앤은 함께 놀려고 건너온 참이었다.`],
[`28-9`, `그해 여름 앤과 다이애나는 놀이 시간 대부분을 연못과 그 주변에서 보냈다. '한가로운 숲'은 이제 과거의 일이 되었다. 봄에 벨 씨가 뒷목장의 그 작은 나무 동그라미를 가차 없이 베어 버렸기 때문이다. 앤은 그루터기 사이에 앉아 울었다. 그 낭만성도 놓치지 않으면서. 하지만 곧 마음을 달랬다. 앤과 다이애나의 말처럼, 열네 살을 바라보는 열세 살의 큰 소녀들은 소꿉놀이 집 같은 유치한 놀이를 하기엔 너무 컸고, 연못 주변에는 훨씬 매혹적인 놀이가 있었다. 다리 위에서 송어를 낚는 것도 근사했고, 두 소녀는 배리 씨가 오리 사냥에 쓰는 작은 평저선을 저어 다니는 법도 배웠다.`],
[`28-10`, `일레인을 연극으로 해 보자는 것은 앤의 생각이었다. 지난겨울 학교에서 테니슨의 시를 배웠던 것이다. 교육감이 프린스에드워드섬 학교들의 영어 과정에 그 시를 정해 두었기 때문이다. 아이들은 그 시를 분석하고 문법을 따지고 갈가리 해부해서, 그러고도 의미가 남아 있는 게 신기할 정도였다. 그래도 적어도 아름다운 백합 아가씨와 랜슬롯, 귀네비어, 아서 왕은 아이들에게 아주 생생한 사람들이 되었다. 앤은 카멜롯에서 태어나지 못한 것을 남몰래 몹시 아쉬워했다. 그 시절은 지금보다 훨씬 낭만적이었다고 앤은 말했다.`],
[`28-11`, `앤의 계획은 열렬한 환영을 받았다. 아이들은 평저선을 선착장에서 밀어내면 물살을 따라 다리 밑으로 떠내려가다가, 연못이 굽어지는 곳에 뻗어 나온 아래쪽 곶에 결국 얹힌다는 것을 알고 있었다. 이렇게 떠내려간 적이 여러 번 있었으니, 일레인 놀이에 이보다 안성맞춤인 것은 없었다.`],
[`28-12`, `"좋아, 내가 일레인을 할게." 앤이 마지못해 받아들였다. 주인공을 맡는 것은 기뻤지만, 앤의 예술적 감각은 어울리는 사람이 맡아야 한다고 요구했고, 자신의 한계 때문에 그게 불가능하다고 느꼈던 것이다. "루비는 아서 왕, 제인은 귀네비어, 다이애나는 랜슬롯을 해야 해. 하지만 먼저 너희는 오빠들과 아버지를 해야 해. 말 못 하는 늙은 하인은 뺄 수밖에 없어. 한 사람이 누우면 평저선에 두 사람이 탈 자리가 없거든. 배 전체를 가장 검은 비단으로 덮어야 해. 다이애나, 너희 어머니의 낡은 검은 숄이 딱일 거야."`],
[`28-13`, `검은 숄을 구해 오자 앤은 그것을 평저선에 펼치고 바닥에 누워, 눈을 감고 두 손을 가슴 위에 모았다.`],
[`28-14`, `"어머, 정말 죽은 것 같아." 흔들리는 자작나무 그림자 아래 하얗고 조그만 얼굴을 바라보며 루비 길리스가 불안하게 속삭였다. "얘들아, 무서워. 이런 연극을 해도 정말 괜찮을까? 린드 부인은 연극은 다 몹시 나쁜 거래."`],
[`28-15`, `"루비, 린드 부인 이야기는 하면 안 돼." 앤이 엄하게 말했다. "분위기가 깨지잖아. 지금은 린드 부인이 태어나기 수백 년 전이란 말이야. 제인, 네가 준비해 줘. 일레인이 죽었는데 말을 하는 건 우습잖아."`],
[`28-16`, `제인은 기대에 부응했다. 덮개로 쓸 금실 천은 없었지만, 노란 일본 비단으로 된 낡은 피아노 덮개가 훌륭한 대용품이 되었다. 하얀 백합은 그때 구할 수 없었지만, 앤이 모은 한 손에 키 큰 파란 붓꽃을 쥐여 주니 더할 나위 없는 효과가 났다.`],
[`28-17`, `"자, 다 됐다." 제인이 말했다. "우리가 일레인의 고요한 이마에 입을 맞춰야 해. 다이애나, 너는 '누이여, 영원히 안녕'이라고 하고, 루비, 너는 '잘 가요, 사랑스러운 누이'라고 해. 둘 다 최대한 슬프게. 앤, 제발 조금만 웃어. 일레인은 '미소 짓는 듯이 누워' 있었잖아. 그래, 그게 낫다. 이제 배를 밀어."`],
[`28-18`, `그렇게 평저선은 밀려 나갔다. 그 과정에서 물속에 박혀 있던 낡은 말뚝에 거칠게 긁혔다. 다이애나와 제인과 루비는 배가 물살을 타고 다리 쪽으로 향하는 것만 보고는, 숲을 지나 길을 건너 아래쪽 곶으로 달려 내려갔다. 그곳에서 랜슬롯과 귀네비어와 왕이 되어 백합 아가씨를 맞을 준비를 해야 했으니까.`],
[`28-19`, `몇 분 동안 앤은 천천히 떠내려가며 자신이 처한 낭만적인 상황을 한껏 즐겼다. 그러다 전혀 낭만적이지 않은 일이 벌어졌다. 평저선에 물이 새기 시작한 것이다. 곧 일레인은 허둥지둥 일어나 금실 덮개와 가장 검은 비단 덮개를 집어 들고, 물이 그야말로 쏟아져 들어오는 배 바닥의 커다란 틈을 멍하니 바라볼 수밖에 없었다. 선착장의 날카로운 말뚝이 배에 못 박아 둔 틈막이 띠를 뜯어 버린 것이었다. 앤은 그런 사정은 몰랐지만, 자신이 위험한 처지라는 것은 금세 깨달았다. 이대로라면 배는 아래쪽 곶에 닿기 훨씬 전에 물이 차서 가라앉을 것이다. 노는 어디 있지? 선착장에 두고 왔다!`],
[`28-20`, `앤은 아무도 듣지 못한 짧은 비명을 헉 하고 질렀다. 입술까지 하얗게 질렸지만 침착함을 잃지는 않았다. 기회가 하나 있었다. 단 하나.`],
[`28-21`, `"정말 끔찍하게 무서웠어요." 다음 날 앤은 앨런 부인에게 이야기했다. "배가 다리까지 떠내려가는 동안 물은 자꾸만 차오르고, 그 시간이 몇 년처럼 느껴졌어요. 저는 기도했어요, 사모님. 정말 간절하게요. 하지만 눈을 감고 기도하진 않았어요. 하느님이 저를 구하실 방법은 단 하나, 배를 다리 기둥 가까이로 보내 주셔서 제가 기둥에 기어오르게 하시는 것뿐이라는 걸 알았거든요. 아시다시피 다리 기둥은 낡은 나무줄기라서 옹이랑 부러진 가지 그루터기가 많잖아요. 기도하는 건 옳은 일이었지만, 제 몫은 눈을 크게 뜨고 지켜보는 거라는 걸 저는 잘 알았어요. 그래서 그저 '하느님, 제발 배를 기둥 가까이 보내 주세요. 나머지는 제가 할게요.' 하고 몇 번이고 되풀이했어요. 그런 상황에서는 근사한 기도문 같은 건 생각나지 않더라고요. 그런데 제 기도가 이루어졌어요. 배가 잠깐 기둥에 쿵 부딪혔고, 저는 스카프랑 숄을 어깨에 휙 걸치고 마침 하느님이 마련해 두신 듯한 큰 그루터기 위로 기어올랐어요. 그렇게 저는, 사모님, 올라갈 수도 내려갈 수도 없이 그 미끄러운 낡은 기둥에 매달려 있었어요. 아주 낭만적이지 않은 자세였지만 그때는 그런 생각도 안 났어요. 물속 무덤에서 막 빠져나왔을 땐 낭만 같은 건 생각나지 않는 법이에요. 저는 곧바로 감사 기도를 드리고, 꽉 붙잡는 데만 온 신경을 쏟았어요. 마른 땅으로 돌아가려면 아마 사람의 도움을 기다려야 할 테니까요."`],
[`28-22`, `평저선은 다리 밑을 지나 곧장 물살 한가운데에서 가라앉았다. 이미 아래쪽 곶에서 기다리고 있던 루비와 제인과 다이애나는 배가 눈앞에서 사라지는 것을 보았고, 앤도 함께 가라앉았다고 굳게 믿었다. 아이들은 잠시 백지장처럼 하얗게 질려 그 비극 앞에 얼어붙어 있다가, 목청껏 비명을 지르며 숲을 지나 미친 듯이 달려 올라갔다. 큰길을 건널 때도 다리 쪽은 한 번도 돌아보지 않았다. 위태로운 발판에 필사적으로 매달려 있던 앤은 달려가는 아이들의 모습을 보고 비명을 들었다. 곧 도움이 오겠지만, 그동안 앤의 처지는 몹시 불편했다.`],
[`28-23`, `시간이 흘렀다. 불운한 백합 아가씨에게는 일 분이 한 시간 같았다. 왜 아무도 안 오지? 애들은 어디로 갔을까? 다 같이 기절해 버렸다면? 아무도 오지 않는다면? 너무 지치고 몸이 저려서 더는 매달려 있을 수 없게 된다면? 앤은 길고 기름진 그림자가 일렁이는 발아래의 음산한 초록빛 물속을 내려다보며 몸서리쳤다. 앤의 상상력은 온갖 끔찍한 가능성을 속삭이기 시작했다.`],
[`28-24`, `그런데 팔과 손목의 통증을 정말 한순간도 더 견딜 수 없겠다고 생각한 바로 그때, 길버트 블라이스가 하먼 앤드루스 씨의 작은 배를 저으며 다리 밑으로 들어왔다!`],
[`28-25`, `위를 올려다본 길버트는 깜짝 놀랐다. 하얗고 조그만, 경멸 어린 얼굴이 겁에 질렸지만 역시 경멸이 담긴 커다란 회색 눈으로 자기를 내려다보고 있었던 것이다.`],
[`28-26`, `"앤 셜리! 대체 어떻게 거기 올라간 거야?" 길버트가 외쳤다.`],
[`28-27`, `길버트는 대답도 기다리지 않고 기둥 가까이 배를 대고 손을 내밀었다. 어쩔 수 없었다. 앤은 길버트 블라이스의 손을 붙잡고 작은 배로 기어 내려왔다. 그러고는 물이 뚝뚝 떨어지는 숄과 젖은 비단을 한 아름 안은 채, 꾀죄죄하고 화난 얼굴로 뱃고물에 앉았다. 이런 상황에서 위엄을 지키기란 정말이지 몹시 어려웠다!`],
[`28-28`, `"무슨 일이야, 앤?" 노를 집어 들며 길버트가 물었다.`],
[`28-29`, `"일레인 놀이를 하고 있었어." 앤은 구해 준 사람을 쳐다보지도 않고 차갑게 설명했다. "그래서 나는 거룻배를 타고, 아니, 평저선을 타고 카멜롯까지 떠내려가야 했어. 그런데 배에 물이 새서 기둥으로 올라갔어. 애들은 도움을 청하러 갔고. 선착장까지 저어 주면 고맙겠어."`],
[`28-30`, `길버트는 친절하게 선착장까지 배를 저어 주었다. 앤은 도움을 마다하고 날렵하게 물가로 뛰어내렸다.`],
[`28-31`, `"정말 고마워." 앤은 거만하게 말하고 돌아섰다. 그러나 길버트도 배에서 뛰어내려 앤의 팔을 붙잡았다.`],
[`28-32`, `"앤." 길버트가 다급하게 말했다. "있잖아. 우리 좋은 친구가 될 수 없을까? 그때 네 머리를 놀려서 정말 미안해. 너를 화나게 하려던 게 아니라 그냥 장난이었어. 게다가 벌써 오래전 일이잖아. 지금 네 머리는 정말 예쁜 것 같아. 진심이야. 친구가 되자."`],
[`28-33`, `한순간 앤은 망설였다. 상처 입은 자존심 아래에서, 반은 수줍고 반은 간절한 길버트의 개암빛 눈동자가 보기에 참 좋다는, 새로 깨어난 묘한 느낌이 들었다. 가슴이 빠르고 묘하게 두근거렸다. 그러나 오래된 원한의 쓰라림이 흔들리던 결심을 곧바로 굳혀 버렸다. 2년 전의 그 장면이 어제 일처럼 생생하게 되살아났다. 길버트는 나를 '홍당무'라고 불렀고, 온 학교 앞에서 창피를 당하게 했다. 다른 어른들이 보기엔 그 원인만큼이나 우스운 원한이었겠지만, 시간이 지나도 조금도 누그러지지 않은 모양이었다. 앤은 길버트 블라이스가 미웠다! 절대 용서하지 않을 것이다!`],
[`28-34`, `"싫어." 앤이 차갑게 말했다. "나는 절대 너랑 친구가 되지 않을 거야, 길버트 블라이스. 되고 싶지도 않아!"`],
[`28-35`, `"좋아!" 길버트는 화가 나서 뺨이 붉어진 채 배에 뛰어올랐다. "다시는 친구가 되자고 하지 않을게, 앤 셜리. 나도 상관없어!"`],
[`28-36`, `길버트는 거침없이 노를 저어 멀어졌고, 앤은 단풍나무 아래 고사리가 무성한 가파른 오솔길을 올라갔다. 앤은 고개를 아주 높이 쳐들었지만, 묘한 후회가 밀려오는 것을 느꼈다. 길버트에게 다르게 대답했더라면 좋았을 거라는 생각까지 들었다. 물론 길버트는 나를 지독하게 모욕했지만, 그래도…! 앤은 그냥 주저앉아 실컷 울면 속이 시원하겠다고 생각했다. 겁에 질려 저리도록 매달려 있던 것의 반동이 밀려오면서, 앤은 정말로 기진맥진해 있었다.`],
[`28-37`, `오솔길 중간쯤에서 앤은 거의 정신이 나간 채로 연못을 향해 달려 내려오는 제인과 다이애나를 만났다. 아이들은 '과수원 비탈'에 가 보았지만 배리 씨 부부가 모두 집에 없었다. 루비 길리스는 그곳에서 발작하듯 울음을 터뜨려, 알아서 진정하도록 남겨 두었다. 제인과 다이애나는 유령의 숲을 지나 시냇물을 건너 초록 지붕 집까지 날듯이 달려갔다. 그러나 그곳에도 아무도 없었다. 마릴라는 카모디에 갔고, 매슈는 뒤쪽 밭에서 건초를 만들고 있었다.`],
[`28-38`, `"아, 앤." 다이애나가 숨을 헐떡이며 앤의 목에 매달려 안도와 기쁨의 눈물을 흘렸다. "아, 앤, 우리는… 네가… 물에 빠져… 죽은 줄 알았어. 우리가… 너한테… 일레인을 하게 해서… 살인자가 된 기분이었어. 루비는 발작을 일으켰어. 아, 앤, 어떻게 빠져나왔어?"`],
[`28-39`, `"다리 기둥에 기어올랐어." 앤이 지친 목소리로 설명했다. "그리고 길버트 블라이스가 앤드루스 씨네 배를 타고 와서 나를 뭍으로 데려다줬어."`],
[`28-40`, `"어머, 앤, 길버트 정말 멋지다! 너무 낭만적이야!" 마침내 말할 숨이 돌아온 제인이 말했다. "이제부터는 당연히 길버트랑 말할 거지?"`],
[`28-41`, `"당연히 안 해." 잠시 예전의 기세를 되찾은 앤이 쏘아붙였다. "그리고 다시는 '낭만적'이라는 말은 듣고 싶지도 않아, 제인 앤드루스. 너희를 그렇게 놀라게 해서 정말 미안해. 다 내 잘못이야. 나는 분명 불운한 별 아래 태어났나 봐. 내가 하는 일마다 나나 제일 소중한 친구들을 곤란에 빠뜨려. 다이애나, 우리가 너희 아버지 평저선을 잃어버렸어. 이제 연못에서 배를 못 타게 될 것 같은 예감이 들어."`],
[`28-42`, `앤의 예감은 보통의 예감보다 훨씬 잘 들어맞았다. 그날 오후의 일이 알려지자 배리 씨네와 커스버트 씨네는 크게 놀라고 당황했다.`],
[`28-43`, `"너는 언제쯤 철이 들겠니, 앤?" 마릴라가 끙 하고 앓는 소리를 냈다.`],
[`28-44`, `"어머, 들 것 같아요, 아주머니." 앤이 낙천적으로 대답했다. 동쪽 다락방에서 고마운 혼자만의 시간을 누리며 실컷 운 덕분에, 앤의 신경은 가라앉고 평소의 명랑함이 돌아와 있었다. "철이 들 가능성이 그 어느 때보다 밝아졌다고 생각해요."`],
[`28-45`, `"어째서 그런지 모르겠구나." 마릴라가 말했다.`],
[`28-46`, `"그러니까요." 앤이 설명했다. "오늘 새롭고 값진 교훈을 얻었거든요. 초록 지붕 집에 온 뒤로 저는 계속 실수를 했지만, 실수 하나하나가 제 큰 단점을 하나씩 고쳐 주었어요. 자수정 브로치 사건으로 남의 물건에 손대는 버릇이 고쳐졌어요. 유령의 숲 실수로는 상상이 제멋대로 날뛰게 두는 버릇이 고쳐졌고요. 진통제 케이크 실수로는 요리할 때 덤벙대는 버릇이 고쳐졌어요. 머리 염색으로는 허영심이 고쳐졌어요. 이제 저는 머리나 코 생각은 안 해요. 적어도 아주 가끔밖에는요. 그리고 오늘의 실수는 너무 낭만적인 버릇을 고쳐 줄 거예요. 에이번리에서 낭만적이려고 애써 봤자 소용없다는 결론을 내렸어요. 수백 년 전 탑이 솟은 카멜롯에서는 쉬웠겠지만, 요즘엔 낭만을 알아주지 않아요. 이 점에서 제가 곧 크게 나아지는 걸 보시게 될 거예요, 아주머니."`],
[`28-47`, `"정말 그러길 바란다." 마릴라가 미심쩍은 듯 말했다.`],
[`28-48`, `그러나 구석 자리에 말없이 앉아 있던 매슈는, 마릴라가 나가자 앤의 어깨에 손을 얹었다.`],
[`28-49`, `"낭만을 다 버리지는 마라, 앤." 매슈가 수줍게 속삭였다. "조금은 좋은 거란다. 물론 너무 많으면 안 되지만. 조금은 간직하렴, 앤. 조금은 간직하렴."`],
  ]
};

/* 원문 책장: 원작 32·34·36장(발췌), 37~38장 — 이 앱을 위해 새로 우리말로 옮김 */
BOOK.ch10 = {
  title: `길모퉁이`,
  orig: `원작 32~38장`,
  paras: [
[`h`, `원작 32장 「합격자 명단 발표」 (발췌)`],
[`32-40`, `"앤, 너 합격했어." 다이애나가 외쳤다. "그것도 일등으로! 너랑 길버트 둘 다. 동점이야. 하지만 네 이름이 맨 위에 있어. 아, 정말 자랑스러워!"`],
[`32-41`, `다이애나는 신문을 탁자에 던지고 앤의 침대에 털썩 엎어졌다. 숨이 차서 더는 말도 하지 못했다. 앤은 등잔에 불을 붙이려다 성냥갑을 엎고, 떨리는 손으로 성냥을 여섯 개나 쓰고서야 겨우 불을 켰다. 그러고는 신문을 낚아챘다. 그래, 합격이었다. 이백 명의 명단 맨 꼭대기에 앤의 이름이 있었다! 그 순간은 살아 있을 보람이 있었다.`],
[`h`, `원작 34장 「퀸스 학생이 되다」 (발췌)`],
[`34-6`, `"네 시 때문에 운 게 아니다." '시 나부랭이' 따위에 약한 모습을 보이는 것은 질색인 마릴라가 말했다. "그냥 예전의 그 꼬맹이가 자꾸 생각나서 그랬다, 앤. 그 별난 버릇들을 다 지닌 채라도, 네가 그냥 꼬맹이로 있었으면 싶었어. 이제 너는 다 자라서 떠나가는구나. 그 드레스를 입으니 키도 크고 맵시도 나고, 너무… 너무 달라 보여서, 꼭 에이번리 사람이 아닌 것 같구나. 그런 생각을 하니 그만 쓸쓸해졌다."`],
[`h`, `원작 36장 「영광과 꿈」 (발췌)`],
[`36-38`, `앤은 바깥 세상과 벗하며 즐거운 하루를 보냈다. 앤은 그날을 결코 잊지 못했다. 그만큼 밝고 금빛으로 아름다웠으며, 그늘 한 점 없이 꽃이 넘쳐 나는 날이었다. 앤은 그 풍성한 시간의 얼마를 과수원에서 보냈고, 드라이어드의 샘과 버드나무 연못과 제비꽃 골짜기에 다녀왔으며, 목사관에 들러 앨런 부인과 흡족한 이야기를 나누었다. 그리고 저녁에는 매슈와 함께 '연인의 오솔길'을 지나 뒷목장으로 소를 몰러 갔다. 숲은 온통 노을빛으로 물들었고, 그 따스한 빛이 서쪽 언덕 틈으로 쏟아져 내렸다. 매슈는 고개를 숙인 채 천천히 걸었다. 키가 크고 꼿꼿한 앤은 경쾌한 걸음을 매슈에게 맞추었다.`],
[`36-39`, `"오늘 너무 무리하셨어요, 아저씨." 앤이 나무라듯 말했다. "왜 좀 쉬엄쉬엄 하지 않으세요?"`],
[`36-40`, `"글쎄다, 그게 잘 안 되는구나." 소들이 지나가도록 마당 문을 열며 매슈가 말했다. "늙어 가는 걸 자꾸 잊어버려서 그렇지, 앤. 뭐, 평생 열심히 일해 왔으니, 일하다 쓰러지는 편이 낫다."`],
[`36-41`, `"제가 아저씨가 부탁하신 남자아이였다면," 앤이 쓸쓸하게 말했다. "지금 아저씨를 많이 도와드리고 수백 가지로 덜어 드릴 수 있었을 텐데요. 그것 때문이라면 남자아이였으면 좋았겠다는 생각도 들어요."`],
[`36-42`, `"글쎄다, 나는 남자아이 열두 명보다 네가 더 좋다, 앤." 매슈가 앤의 손을 토닥이며 말했다. "그걸 꼭 기억하렴. 남자아이 열두 명보다 말이다. 그래, 에이버리 장학금을 탄 건 남자아이가 아니었지, 그렇지? 여자아이였어. 내 딸… 내가 자랑스러워하는 내 딸."`],
[`36-43`, `매슈는 수줍은 미소를 지으며 마당으로 들어갔다. 그날 밤 앤은 그 기억을 품고 방으로 올라가, 열린 창가에 오래 앉아 지난날을 생각하고 앞날을 꿈꾸었다. 밖에는 '눈의 여왕'이 달빛 속에 안개처럼 하얗게 서 있었고, '과수원 비탈' 너머 늪에서는 개구리들이 노래했다. 앤은 그 밤의 은빛 평화와 향기로운 고요를 언제까지나 기억했다. 그것은 슬픔이 앤의 삶에 닿기 전 마지막 밤이었다. 그 차갑고도 사람을 거룩하게 하는 손길이 한번 닿고 나면, 어떤 삶도 결코 예전과 같을 수 없다.`],
[`h`, `원작 37장 「죽음이라는 이름의 추수꾼」`],
[`37-1`, `"오라버니, 오라버니, 왜 그래요? 오라버니, 어디 아파요?"`],
[`37-2`, `마릴라였다. 띄엄띄엄 끊기는 말마다 불안이 묻어 있었다. 하얀 수선화를 한 아름 안고 복도를 지나오던 앤은(그 뒤로 오랫동안 앤은 하얀 수선화의 모습도 향기도 사랑할 수 없었다) 그 목소리를 들었고, 현관 문간에 서 있는 매슈를 보았다. 매슈는 접힌 종이를 손에 든 채, 얼굴이 이상하게 일그러지고 잿빛이었다. 앤은 꽃을 떨어뜨리고 마릴라와 동시에 부엌을 가로질러 매슈에게 달려갔다. 그러나 둘 다 너무 늦었다. 두 사람이 닿기도 전에 매슈는 문지방 위로 쓰러졌다.`],
[`37-3`, `"기절했어." 마릴라가 숨을 헐떡였다. "앤, 마틴을 불러와. 어서, 어서! 헛간에 있을 거다."`],
[`37-4`, `우체국에서 막 돌아온 일꾼 마틴은 곧장 의사를 부르러 떠났고, 가는 길에 '과수원 비탈'에 들러 배리 씨 부부를 보내 주었다. 마침 심부름으로 그곳에 와 있던 린드 부인도 함께 왔다. 그들이 왔을 때 앤과 마릴라는 정신없이 매슈를 깨우려 애쓰고 있었다.`],
[`37-5`, `린드 부인은 두 사람을 살며시 비켜 세우고 매슈의 맥을 짚더니, 가슴에 귀를 대었다. 그러고는 걱정스러운 두 얼굴을 슬프게 바라보았다. 부인의 눈에 눈물이 고였다.`],
[`37-6`, `"아, 마릴라." 부인이 무겁게 말했다. "우리가… 해 줄 수 있는 게 없는 것 같아요."`],
[`37-7`, `"린드 부인, 설마… 설마 아저씨가… 아저씨가…." 앤은 그 끔찍한 말을 입에 올릴 수 없었다. 앤은 속이 메스껍고 얼굴이 하얗게 질렸다.`],
[`37-8`, `"얘야, 그래, 그런 것 같구나. 얼굴을 보렴. 나만큼 그 얼굴을 자주 보고 나면 그게 무슨 뜻인지 알게 된단다."`],
[`37-9`, `앤은 고요한 얼굴을 바라보았고, 그 위에 찍힌 위대한 존재의 봉인을 보았다.`],
[`37-10`, `의사가 와서 말하기를, 죽음은 순간적이었고 아마 고통도 없었을 것이며, 무언가 갑작스러운 충격 때문인 듯하다고 했다. 그 충격의 비밀은 매슈가 쥐고 있던 종이에 있었다. 그날 아침 마틴이 우체국에서 가져온 신문이었다. 거기에는 애비 은행이 파산했다는 소식이 실려 있었다.`],
[`37-11`, `소식은 에이번리에 빠르게 퍼졌다. 하루 종일 친구들과 이웃들이 초록 지붕 집으로 몰려와, 죽은 이와 산 이를 위한 친절한 일들로 오고 갔다. 처음으로, 수줍고 조용한 매슈 커스버트가 모든 일의 중심이 되었다. 죽음의 하얀 위엄이 그에게 내려앉아, 왕관을 쓴 사람처럼 그를 따로 세워 놓았다.`],
[`37-12`, `고요한 밤이 초록 지붕 집 위로 살며시 내려앉자, 오래된 집은 숨죽인 듯 평온해졌다. 응접실에는 매슈 커스버트가 관 속에 누워 있었다. 길고 희끗한 머리카락이 평온한 얼굴을 감쌌고, 그 얼굴에는 즐거운 꿈을 꾸며 잠든 사람처럼 작고 다정한 미소가 어려 있었다. 그의 주위에는 꽃이 있었다. 그의 어머니가 갓 시집왔을 때 집 뜰에 심은, 향기로운 옛날 꽃들. 매슈가 언제나 남몰래, 말없이 사랑했던 꽃들이었다. 앤이 그 꽃들을 꺾어 그에게 가져다 놓았다. 하얀 얼굴 속에서 눈물 없는 괴로운 두 눈이 타오르고 있었다. 그것이 앤이 그를 위해 할 수 있는 마지막 일이었다.`],
[`37-13`, `그날 밤 배리 씨네와 린드 부인이 함께 머물렀다. 다이애나는 창가에 서 있는 앤에게 동쪽 다락방으로 가서 조용히 물었다.`],
[`37-14`, `"앤, 오늘 밤 같이 자 줄까?"`],
[`37-15`, `"고마워, 다이애나." 앤은 친구의 얼굴을 진지하게 바라보았다. "혼자 있고 싶다고 해도 네가 오해하지 않을 거라고 생각해. 무서운 게 아니야. 그 일이 있고 나서 한순간도 혼자 있지 못했어. 혼자 있고 싶어. 아주 조용히, 가만히 있으면서 실감해 보고 싶어. 실감이 나지 않아. 반쯤은 아저씨가 돌아가셨을 리 없다는 생각이 들고, 나머지 반쯤은 아저씨가 아주 오래전에 돌아가셔서 그 뒤로 내내 이 끔찍하고 무딘 아픔을 안고 살아온 것만 같아."`],
[`37-16`, `다이애나는 잘 이해하지 못했다. 평생의 습관과 타고난 절제를 다 무너뜨리며 폭풍처럼 터져 나오는 마릴라의 격한 슬픔이, 앤의 눈물 없는 고통보다 다이애나에게는 더 이해하기 쉬웠다. 그래도 다이애나는 다정하게 물러나, 앤이 혼자서 슬픔과 함께하는 첫 밤을 지새우도록 해 주었다.`],
[`37-17`, `앤은 혼자 있으면 눈물이 나기를 바랐다. 그토록 사랑했고 자신에게 그토록 다정했던 매슈를 위해 눈물 한 방울 흘리지 못한다는 것이 끔찍하게 느껴졌다. 어제저녁 노을 속을 함께 걸었던 매슈가, 지금은 이마에 그 무서운 평화를 얹은 채 아래층 어둑한 방에 누워 있었다. 그러나 처음에는 눈물이 나지 않았다. 어둠 속에서 창가에 무릎을 꿇고 언덕 너머 별을 올려다보며 기도할 때도 눈물은 나지 않았다. 다만 똑같이 끔찍하고 무딘 비참함의 아픔이 계속 아릴 뿐이었다. 그러다 하루의 고통과 흥분에 지친 앤은 잠이 들었다.`],
[`37-18`, `한밤중에 앤은 고요와 어둠 속에서 깨어났다. 낮의 기억이 슬픔의 파도처럼 밀려왔다. 지난 저녁 대문에서 헤어질 때 자신에게 미소 짓던 매슈의 얼굴이 보였다. "내 딸… 내가 자랑스러워하는 내 딸." 하고 말하던 목소리가 들렸다. 그제야 눈물이 쏟아졌고, 앤은 가슴이 터지도록 울었다. 그 소리를 들은 마릴라가 살며시 들어와 앤을 달랬다.`],
[`37-19`, `"자, 자, 그렇게 울지 마라, 얘야. 운다고 오라버니가 돌아오지는 않는다. 그렇게… 그렇게 우는 건 옳지 않아. 오늘 나도 그걸 알면서 그때는 어쩔 수가 없었구나. 오라버니는 늘 나한테 그렇게 착하고 다정한 오빠였는데… 하지만 하느님이 가장 잘 아시겠지."`],
[`37-20`, `"아, 그냥 울게 해 주세요, 아주머니." 앤이 흐느꼈다. "눈물은 아까 그 아픔만큼 아프지 않아요. 잠깐만 여기 같이 있어 주세요. 팔로 저를 안아 주세요. 이렇게요. 다이애나는 같이 있게 할 수 없었어요. 착하고 다정하고 고마운 친구지만, 그 애의 슬픔은 아니니까요. 다이애나는 이 슬픔 바깥에 있어서, 제 마음에 가까이 와서 도와줄 수가 없었어요. 이건 우리의 슬픔이에요. 아주머니와 저의 슬픔. 아, 아주머니, 아저씨 없이 우리 어떻게 살아요?"`],
[`37-21`, `"우리한텐 서로가 있잖니, 앤. 네가 여기 없었다면, 네가 오지 않았다면 내가 어떻게 됐을지 모르겠구나. 아, 앤, 내가 너한테 좀 엄하고 모질게 굴었을지도 모르지. 하지만 그렇다고 해서 내가 오라버니만큼 너를 사랑하지 않았다고 생각하면 안 된다. 말할 수 있을 때 지금 말해 두고 싶구나. 마음속 이야기를 꺼내는 건 나한테 늘 쉽지 않았지만, 이럴 때는 조금 쉬워지는구나. 나는 너를 내 살붙이처럼 아끼고 사랑한다. 네가 초록 지붕 집에 온 뒤로 너는 줄곧 나의 기쁨이고 위안이었다."`],
[`37-22`, `이틀 뒤, 사람들은 매슈 커스버트를 그의 집 문지방 너머로 옮겨, 그가 일구던 밭과 사랑하던 과수원과 그가 심은 나무들에게서 멀리 데려갔다. 그러고 나서 에이번리는 다시 평소의 고요함을 되찾았고, 초록 지붕 집의 일도 예전처럼 굴러가기 시작했다. 일은 해내고 의무는 전처럼 꼬박꼬박 다했지만, 언제나 '모든 익숙한 것 속의 상실'이라는 아린 느낌이 함께했다. 슬픔을 처음 겪는 앤에게는 그럴 수 있다는 것, 매슈 없이도 예전처럼 살아갈 수 있다는 것이 오히려 슬프게 느껴졌다. 전나무 뒤로 떠오르는 해와 뜰에 피어나는 연분홍 꽃봉오리를 보면 예전처럼 기쁨이 밀려든다는 것을, 다이애나가 찾아오면 반갑고 다이애나의 명랑한 말과 몸짓에 웃음이 난다는 것을 깨달았을 때, 앤은 부끄러움과 죄책감 같은 것을 느꼈다. 한마디로, 꽃과 사랑과 우정의 아름다운 세상은 앤의 마음을 즐겁게 하고 설레게 하는 힘을 조금도 잃지 않았다. 삶은 여전히 여러 목소리로 끈질기게 앤을 부르고 있었다.`],
[`37-23`, `"아저씨가 떠나신 지금 이런 것들에서 즐거움을 느끼는 게, 어쩐지 아저씨를 배신하는 것 같아요." 어느 저녁, 목사관 뜰에서 함께 있을 때 앤이 앨런 부인에게 쓸쓸하게 말했다. "아저씨가 너무 보고 싶어요. 언제나요. 그런데도, 사모님, 세상과 삶은 여전히 아름답고 재미있게 느껴져요. 오늘 다이애나가 우스운 말을 했는데 제가 웃고 있더라고요. 그 일이 있었을 땐 다시는 웃지 못할 줄 알았어요. 그리고 웃으면 안 될 것 같기도 하고요."`],
[`37-24`, `"아저씨가 여기 계셨을 때, 아저씨는 네 웃음소리를 듣는 걸 좋아하셨고, 네가 주위의 즐거운 것들에서 기쁨을 찾는 걸 좋아하셨지." 앨런 부인이 부드럽게 말했다. "지금은 그저 멀리 가 계실 뿐이란다. 그리고 여전히 똑같이 그걸 좋아하실 거야. 자연이 주는 치유의 힘에 마음을 닫아서는 안 된다고 나는 믿어. 하지만 네 마음은 이해한단다. 누구나 같은 일을 겪는 것 같구나. 사랑하는 사람이 더는 곁에서 기쁨을 함께할 수 없는데 무언가가 우리를 기쁘게 한다는 게 못마땅하고, 삶에 대한 흥미가 돌아오면 슬픔에 대해 신의를 저버리는 것만 같지."`],
[`37-25`, `"오늘 오후에 묘지에 가서 아저씨 무덤에 장미를 심었어요." 앤이 꿈꾸듯 말했다. "아저씨 어머니가 오래전에 스코틀랜드에서 가져오신 작고 하얀 스코틀랜드 장미의 꺾꽂이 가지를 가져갔어요. 아저씨는 늘 그 장미를 제일 좋아하셨어요. 가시 돋친 줄기에 피는 꽃이 아주 작고 향기로웠거든요. 그걸 무덤가에 심을 수 있어서 기뻤어요. 아저씨 가까이 가져다 드리면 아저씨가 기뻐하실 일을 하는 것 같았어요. 천국에도 그런 장미가 있으면 좋겠어요. 어쩌면 아저씨가 여러 여름 동안 사랑하셨던 그 작은 하얀 장미들의 영혼이 모두 거기서 아저씨를 맞아 주었을지도 몰라요. 이제 집에 가야겠어요. 아주머니가 혼자 계시고, 해 질 녘이면 외로워하시거든요."`],
[`37-26`, `"네가 다시 대학에 가고 나면 더 외로우시겠구나." 앨런 부인이 말했다.`],
[`37-27`, `앤은 대답하지 않았다. 앤은 저녁 인사를 하고 천천히 초록 지붕 집으로 돌아갔다. 마릴라는 현관 계단에 앉아 있었고, 앤은 그 곁에 앉았다. 뒤의 문은 열려 있었는데, 매끈한 안쪽 주름에 바다의 노을빛이 어린 커다란 분홍 소라껍데기가 문을 받쳐 두고 있었다.`],
[`37-28`, `앤은 연노랑 인동덩굴 몇 가지를 꺾어 머리에 꽂았다. 움직일 때마다 머리 위에서 하늘의 축복 같은 은은한 향기가 나는 것이 좋았다.`],
[`37-29`, `"네가 나간 사이에 스펜서 선생님이 다녀가셨다." 마릴라가 말했다. "내일 안과 전문의가 시내에 오는데, 꼭 가서 눈 검사를 받아야 한다고 고집하시는구나. 가서 해치우는 게 낫겠지. 내 눈에 맞는 안경을 맞춰 줄 수만 있다면 그보다 고마운 일은 없겠다. 내가 없는 동안 혼자 있어도 괜찮겠니? 마틴이 나를 태워다 줘야 하고, 다림질이랑 빵 굽기를 해 놔야 하는데."`],
[`37-30`, `"괜찮아요. 다이애나가 와서 같이 있어 줄 거예요. 다림질도 빵 굽기도 근사하게 해 둘게요. 손수건에 풀을 먹이거나 케이크에 진통제 연고를 넣을 걱정은 안 하셔도 돼요."`],
[`37-31`, `마릴라가 웃었다.`],
[`37-32`, `"그 시절 너는 정말 실수투성이였지, 앤. 늘 말썽에 휘말렸고. 정말 뭐에 씐 줄 알았다니까. 머리 염색했던 거 기억나니?"`],
[`37-33`, `"그럼요. 절대 못 잊죠." 앤은 단정한 머리에 감아 올린 탐스러운 땋은 머리를 만지며 미소 지었다. "지금은 가끔 머리 때문에 얼마나 속을 끓였던가 생각하면 조금 웃음이 나요. 하지만 많이 웃지는 않아요. 그때는 정말 진지한 고민이었으니까요. 저는 머리랑 주근깨 때문에 정말 지독하게 괴로웠어요. 주근깨는 정말 다 없어졌고, 사람들은 고맙게도 이제 제 머리가 적갈색이라고 해 줘요. 조시 파이만 빼고요. 조시는 어제 제 머리가 그 어느 때보다 빨갛다고, 적어도 검은 옷 때문에 더 빨개 보인다고 하더니, 빨강 머리인 사람들은 그 머리에 익숙해지기는 하냐고 묻더라고요. 아주머니, 저 조시 파이를 좋아하려는 노력은 거의 포기할까 봐요. 예전 같으면 영웅적이라고 불렀을 만큼 노력했는데, 조시 파이는 도무지 좋아할 수가 없어요."`],
[`37-34`, `"조시는 파이 집안 아이니까," 마릴라가 날카롭게 말했다. "밉살스러울 수밖에 없지. 그런 사람들도 세상에 무슨 쓸모가 있긴 하겠지만, 엉겅퀴가 어디 쓰이는지 모르는 것처럼 나는 그게 뭔지 모르겠다. 조시도 선생이 되니?"`],
[`37-35`, `"아니요. 내년에 다시 퀸스에 간대요. 무디 스퍼전이랑 찰리 슬론도요. 제인이랑 루비는 선생님이 되는데, 둘 다 학교를 구했어요. 제인은 뉴브리지, 루비는 서쪽 어딘가에요."`],
[`37-36`, `"길버트 블라이스도 선생이 된다지?"`],
[`37-37`, `"네." 짧은 대답이었다.`],
[`37-38`, `"참 잘생긴 청년이야." 마릴라가 무심한 듯 말했다. "지난 일요일 교회에서 봤는데, 키도 크고 남자다워 보이더구나. 그 나이 때 제 아버지를 꼭 닮았어. 존 블라이스는 좋은 청년이었지. 그 사람이랑 나는 정말 친한 사이였단다. 사람들은 그를 내 애인이라고 불렀지."`],
[`37-39`, `앤이 눈을 반짝이며 고개를 들었다.`],
[`37-40`, `"어머, 아주머니, 그래서 어떻게 됐어요? 왜 두 분은…."`],
[`37-41`, `"말다툼을 했단다. 그가 용서해 달라고 했을 때 나는 용서하지 않았어. 얼마 뒤엔 용서할 생각이었지. 하지만 뾰로통하고 화가 나서, 먼저 벌을 주고 싶었던 거야. 그는 다시 오지 않았다. 블라이스 집안 사람들은 다들 자존심이 아주 셌거든. 하지만 나는 늘… 좀 후회가 됐다. 기회가 있었을 때 용서할걸 하고 늘 바랐지."`],
[`37-42`, `"그럼 아주머니한테도 낭만이 있었네요." 앤이 부드럽게 말했다.`],
[`37-43`, `"그래, 그렇게 부를 수도 있겠지. 나를 보면 그렇게 생각되지 않지? 하지만 사람은 겉만 보고는 알 수 없는 법이란다. 다들 나와 존의 일은 잊어버렸어. 나도 잊고 있었고. 그런데 지난 일요일에 길버트를 보니 다 되살아나더구나."`],
[`h`, `원작 38장 「길모퉁이」`],
[`38-1`, `이튿날 마릴라는 시내에 갔다가 저녁에 돌아왔다. 다이애나와 '과수원 비탈'에 갔다가 돌아온 앤은, 부엌 식탁 앞에 앉아 손으로 머리를 괴고 있는 마릴라를 보았다. 그 맥 빠진 모습의 무언가가 앤의 가슴을 서늘하게 했다. 마릴라가 그렇게 축 늘어져 꼼짝 않고 앉아 있는 것은 처음 보았다.`],
[`38-2`, `"많이 피곤하세요, 아주머니?"`],
[`38-3`, `"그래… 아니… 모르겠다." 마릴라가 지친 얼굴로 고개를 들었다. "피곤하긴 하겠지만 그런 생각은 못 했구나. 그게 아니야."`],
[`38-4`, `"안과 선생님은 만나셨어요? 뭐라고 하세요?" 앤이 걱정스럽게 물었다.`],
[`38-5`, `"그래, 만났다. 눈을 검사하더구나. 책 읽기와 바느질, 눈을 쓰는 일은 모두 그만두고, 울지 않도록 조심하고, 준 안경을 쓰면 눈이 더 나빠지지 않을 수도 있고 두통도 나을 거라고 하더라. 하지만 그러지 않으면 여섯 달 안에 틀림없이 완전히 눈이 멀 거래. 눈이 먼다니! 앤, 생각해 보렴!"`],
[`38-6`, `처음에 놀라 짧은 탄성을 내지른 뒤, 앤은 한동안 말이 없었다. 말을 할 수 없을 것만 같았다. 그러다 목이 메었지만 용감하게 말했다.`],
[`38-7`, `"아주머니, 그런 생각은 하지 마세요. 선생님이 희망을 주셨잖아요. 조심하시면 시력을 완전히 잃지는 않을 거예요. 그리고 안경으로 두통이 낫는다면 그것만 해도 큰일이에요."`],
[`38-8`, `"그걸 희망이라고 할 수는 없지." 마릴라가 씁쓸하게 말했다. "책도 못 읽고 바느질도 못 하고 그런 일을 아무것도 못 한다면 무엇을 위해 살겠니? 차라리 눈이 머는 게… 아니면 죽는 게 낫지. 그리고 우는 건, 외로워지면 나도 어쩔 수가 없구나. 아니, 이런 얘기 해 봐야 소용없다. 차 한 잔만 가져다주면 고맙겠구나. 아주 녹초가 됐다. 그리고 당분간은 이 일을 아무한테도 말하지 마라. 사람들이 와서 이것저것 묻고 동정하고 떠드는 건 견딜 수 없으니까."`],
[`38-9`, `마릴라가 간단히 저녁을 먹자 앤은 마릴라를 설득해 잠자리에 들게 했다. 그러고는 동쪽 다락방으로 올라가 어둠 속 창가에 앉아, 눈물과 무거운 마음과 함께 홀로 있었다. 퀸스에서 돌아온 날 밤 이곳에 앉아 있었을 때와 비교하면 모든 것이 얼마나 슬프게 변했는지! 그때 앤은 희망과 기쁨으로 가득했고, 앞날은 약속으로 장밋빛이었다. 앤은 그 뒤로 몇 년을 산 것 같았다. 그러나 잠자리에 들기 전, 앤의 입가에는 미소가 떠올랐고 마음에는 평화가 깃들었다. 앤은 자신의 의무를 용감하게 마주했고, 그것이 친구임을 알게 되었다. 솔직하게 마주하면 의무는 언제나 그렇듯이.`],
[`38-10`, `며칠 뒤 어느 오후, 마릴라는 마당에서 손님과 이야기를 나누고 천천히 들어왔다. 앤도 얼굴은 아는, 카모디에 사는 존 새들러 씨였다. 대체 무슨 말을 했기에 마릴라의 얼굴이 저럴까 앤은 궁금했다.`],
[`38-11`, `"새들러 씨가 무슨 일로 오셨어요, 아주머니?"`],
[`38-12`, `마릴라는 창가에 앉아 앤을 바라보았다. 안과 의사의 금지에도 불구하고 마릴라의 눈에는 눈물이 고였고, 목소리가 갈라졌다.`],
[`38-13`, `"내가 초록 지붕 집을 판다는 소문을 듣고 사고 싶다는구나."`],
[`38-14`, `"산다고요! 초록 지붕 집을요?" 앤은 자기가 잘못 들은 게 아닌가 싶었다. "아, 아주머니, 설마 초록 지붕 집을 파시려는 건 아니죠!"`],
[`38-15`, `"앤, 달리 어떻게 해야 할지 모르겠구나. 곰곰이 생각해 봤다. 눈만 좋으면 여기 남아서 좋은 일꾼을 두고 그럭저럭 꾸려 갈 수 있겠지. 하지만 지금은 안 돼. 시력을 완전히 잃을지도 모르고, 어쨌든 농장을 꾸릴 수는 없을 거야. 아, 내 집을 팔아야 하는 날이 올 줄은 꿈에도 몰랐다. 하지만 이대로라면 점점 더 나빠져서 결국 아무도 사려 하지 않을 거야. 우리 돈은 한 푼도 남김없이 그 은행에 있었다. 게다가 오라버니가 지난가을에 써 준 어음도 갚아야 하고. 린드 부인은 농장을 팔고 어디서 하숙을 하라는구나. 아마 자기 집에서 말이지. 많이 받지는 못할 거다. 작고 건물도 낡았으니까. 그래도 내가 먹고살 만큼은 되겠지. 네가 장학금으로 앞날이 마련되어 있어서 고맙구나, 앤. 방학 때 돌아올 집이 없어지는 게 미안할 뿐이다. 그래도 어떻게든 지낼 수 있겠지."`],
[`38-16`, `마릴라는 무너지듯 서럽게 울었다.`],
[`38-17`, `"초록 지붕 집을 팔면 안 돼요." 앤이 단호하게 말했다.`],
[`38-18`, `"아, 앤, 나도 그러지 않았으면 좋겠다. 하지만 너도 알잖니. 여기 혼자 있을 수는 없어. 걱정과 외로움으로 미쳐 버릴 거다. 그리고 눈도 멀어 버리겠지. 틀림없이."`],
[`38-19`, `"혼자 계시지 않아도 돼요, 아주머니. 제가 같이 있을게요. 저 레드먼드에 안 가요."`],
[`38-20`, `"레드먼드에 안 간다고!" 마릴라는 지친 얼굴을 손에서 들어 앤을 바라보았다. "아니, 그게 무슨 소리니?"`],
[`38-21`, `"말 그대로예요. 장학금을 받지 않을 거예요. 아주머니가 시내에서 돌아오신 날 밤에 그렇게 결심했어요. 저한테 그렇게 많은 걸 해 주신 아주머니를, 힘드신데 혼자 두고 떠날 수 있다고는 설마 생각하지 않으시겠죠. 저 생각하고 계획도 세웠어요. 제 계획을 들어 보세요. 배리 아저씨가 내년에 농장을 빌리고 싶어 하세요. 그러니 농장 걱정은 안 하셔도 돼요. 그리고 저는 선생님이 될 거예요. 여기 학교에 지원했지만, 학교 이사들이 길버트 블라이스한테 주기로 약속했다니까 될 거라고는 기대하지 않아요. 하지만 카모디 학교는 될 수 있어요. 어젯밤 가게에서 블레어 씨가 그러셨어요. 물론 에이번리 학교만큼 좋거나 편하진 않겠죠. 그래도 집에서 지내면서, 적어도 날이 따뜻할 땐 직접 마차를 몰고 카모디까지 오갈 수 있어요. 겨울에도 금요일마다 집에 올 수 있고요. 그러려면 말을 한 마리 두면 돼요. 아, 계획을 다 세워 놨어요, 아주머니. 그리고 아주머니께 책을 읽어 드리고 기운을 북돋아 드릴게요. 따분하거나 외로우실 틈이 없을 거예요. 우리 둘이 여기서 정말 오순도순 행복하게 지낼 거예요."`],
[`38-22`, `마릴라는 꿈을 꾸는 사람처럼 듣고 있었다.`],
[`38-23`, `"아, 앤, 네가 여기 있다면 정말 잘 지낼 수 있겠지. 그건 알아. 하지만 나 때문에 네가 그렇게 희생하게 둘 수는 없다. 그건 너무 끔찍한 일이야."`],
[`38-24`, `"말도 안 돼요!" 앤이 명랑하게 웃었다. "희생 같은 건 없어요. 초록 지붕 집을 포기하는 것보다 나쁜 일은 없어요. 그보다 저를 아프게 할 일은 없어요. 우리는 이 정든 집을 지켜야 해요. 마음은 이미 정했어요, 아주머니. 레드먼드엔 가지 않고, 여기 남아서 가르칠 거예요. 제 걱정은 조금도 하지 마세요."`],
[`38-25`, `"하지만 네 꿈은… 그리고…."`],
[`38-26`, `"저는 여전히 꿈이 커요. 다만 꿈의 목표를 바꿨을 뿐이에요. 좋은 선생님이 될 거예요. 그리고 아주머니의 눈을 지켜 드릴 거예요. 게다가 여기 집에서 공부해서 혼자 대학 과정을 조금씩 해 나갈 생각이에요. 아, 계획이 수십 가지나 있어요, 아주머니. 일주일 동안 궁리했거든요. 저는 여기서의 삶에 최선을 다할 거예요. 그러면 삶도 저한테 최선을 돌려줄 거라고 믿어요. 퀸스를 떠날 때는 제 앞날이 곧은길처럼 쭉 뻗어 있는 것 같았어요. 그 길을 따라 이정표가 몇 개나 이어지는지 다 보이는 것 같았죠. 그런데 이제 그 길에 모퉁이가 생겼어요. 모퉁이를 돌면 무엇이 있을지는 몰라요. 하지만 가장 좋은 것이 있다고 믿을래요. 그 모퉁이에는 그 나름의 매력이 있어요, 아주머니. 그 너머 길은 어떻게 이어질까요. 어떤 초록빛 영광과, 부드럽게 아롱지는 빛과 그림자가 있을까요. 어떤 새로운 풍경과, 새로운 아름다움과, 어떤 굽이와 언덕과 골짜기가 더 나올까요."`],
[`38-27`, `"그래도 네가 그걸 포기하게 둬서는 안 될 것 같구나." 마릴라가 장학금을 두고 말했다.`],
