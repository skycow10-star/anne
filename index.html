  {id:`s1`, bg:`ch1`, w:`anne`, in:1, f:`anne_dreamy`, bk:[6],
   e:`나는 앤 셜리, 열한 살이야. 오늘 아침 고아원을 떠나 기차를 타고 여기 브라이트 리버 역까지 왔어. 기차는 벌써 떠났고, 긴 승강장에는 나 혼자뿐이야.`,
   l:`나, 앤 셜리는 열한 살이다. 그날 아침 고아원을 떠나 기차에 몸을 싣고 프린스 에드워드 섬의 브라이트 리버 역에 내렸다. 기차가 떠나고 나자 기다란 승강장에는 나 혼자만 남았다.`},
  {w:`anne`, in:1, f:`anne_sad`, bk:[16],
   e:`내 옷은 누리끼리한 회색 윈시 원피스야. 짧고, 꽉 끼고, 정말 못생겼어. 고아원 아이들은 다 이 옷을 입어야 했거든. 모자 밑으로는 빨간 머리를 두 갈래로 땋아 내렸어.`,
   l:`나는 누르스름한 회색 윈시 천으로 지은, 짧고 꽉 끼고 볼품없는 원피스를 입고 있었다. 고아원 아이들이 모두 입어야 했던 옷이다. 빛바랜 갈색 세일러 모자 아래로는 숱 많은 빨간 머리가 두 갈래로 땋여 등까지 늘어져 있었다.`},
  {w:`anne`, in:1, f:`anne_dreamy`, bk:[6],
   e:`나를 데리러 올 사람은 초록 지붕 집의 커스버트 씨래. 이제 나도 진짜 집이 생기는 거야! 나는 온 힘을 다해 기다리고 있어.`,
   l:`나를 데리러 올 사람은 에이번리 초록 지붕 집의 커스버트 씨라고 했다. 마침내 내게도 집이 생기는 것이다. 지금 할 수 있는 일은 앉아서 기다리는 것뿐이었기에, 나는 온 힘을 다해 기다렸다.`},
  {w:`station`, f:`anne_surprised`, bk:[8],
   e:`"얘야, 여기서 혼자 기다리지 말고 저기 여자 대합실 안에 들어가 있으렴. 곧 누가 데리러 오실 거야."`,
   l:`"얘야, 바깥에 그러고 있지 말고 여자 대합실에 들어가 기다리려무나. 곧 누가 데리러 올 게다."`},
  {t:`choice`, id:`C1`, kind:`act`, label:`기다릴 곳`, f:`anne_dreamy`,
   q:{e:`역장님이 대합실에 들어가 있으라고 하셨어요. 앤은 어디서 기다릴까요?`, l:`역장은 대합실에 들어가 있으라고 권합니다. 앤은 어디에서 기다리기로 할까요?`},
   note:{e:`원작의 앤은 "바깥이 상상할 여지가 더 많아요"라며 대합실에 들어가지 않고 지붕널 더미에 앉아 기다려요.`,
         l:`원작에서 앤은 "바깥이 상상할 여지가 더 많다"며 대합실 대신 지붕널 더미 위를 고집합니다. 역장은 그런 앤을 두고 "참 별난 아이"라고 말하지요.`},
   opts:[
    {type:`canon`, go:`c1a`, e:`고맙지만 괜찮다고 말하고, 바깥 지붕널 더미에 앉아서 기다린다.`, l:`정중히 사양하고, 승강장 끝 지붕널 더미 위에 앉아 기다린다.`, s:{e:`바깥 지붕널 더미에서 기다렸다`, l:`지붕널 더미 위에서 기다렸다`}},
    {type:`bal`, go:`c1b`, e:`역장님 말씀대로 여자 대합실 안에 들어가서 얌전히 기다린다.`, l:`역장의 말을 따라 여자 대합실에 들어가 얌전히 기다린다.`, s:{e:`대합실에 들어갔다가 다시 나왔다`, l:`대합실에 들어갔다가 되돌아 나왔다`}},
    {type:`imag`, go:`c1c`, e:`철길 모퉁이에 서 있는 하얀 벚나무까지 살짝 가 본다.`, l:`철길 모퉁이에 선 새하얀 산벚나무까지 몰래 걸어가 본다.`, s:{e:`벚나무 위 궁전에 올라가 봤다`, l:`산벚나무 위 궁전에 올라 보았다`}}
   ]},
  {id:`c1a`, w:`anne`, f:`anne_happy`, bk:[8],
   e:`"고맙습니다, 역장님. 하지만 저는 밖에 있을래요. 밖이 상상할 거리가 훨씬 많거든요!" 역장님은 고개를 갸웃하시더니 "참 별난 아이로군." 하고 중얼거리셨어.`,
   l:`"감사하지만 저는 바깥에 있을래요. 바깥이 상상할 여지가 더 많거든요." 역장은 고개를 갸웃하더니 참 별난 아이라며 중얼거렸다.`},
  {t:`goto`, to:`m1`},
  {id:`c1b`, w:`anne`, in:1, f:`anne_sad`, eff:{album:`waiting`},
   e:`대합실 안은 깨끗했지만 답답했어. 의자는 딱딱하고, 벽은 회색이고, 창문은 작았어. 여기서는 아무것도 상상이 안 돼!`,
   l:`대합실은 정갈했지만 숨이 막혔다. 딱딱한 의자, 잿빛 벽, 손바닥만 한 창. 그곳에는 상상이 깃들 틈이 한 뼘도 없었다.`},
  {w:`anne`, f:`anne_happy`, bk:[8],
   e:`결국 나는 살금살금 다시 밖으로 나왔어. 역장님께는 "밖이 상상할 거리가 더 많아서요." 하고 말씀드렸지. 역시 지붕널 더미 위가 훨씬 나아!`,
   l:`결국 나는 슬그머니 바깥으로 되돌아 나왔다. 역장에게는 "바깥이 상상할 여지가 더 많아서요."라고 설명했다. 지붕널 더미 위가 훨씬 나았다.`},
  {t:`goto`, to:`m1`},
  {id:`c1c`, w:`anne`, in:1, f:`anne_dreamy`, fx:`dream`, cam:`right`, eff:{album:`cherry`, flag:`cherry`},
   e:`나는 가방을 들고 철길을 따라 모퉁이까지 걸어갔어. 하얀 꽃이 가득 핀 산벚나무가 저녁 햇빛을 받아 반짝반짝 빛나고 있었어.`,
   l:`나는 가방을 든 채 철길을 따라 모퉁이까지 걸었다. 꽃을 가득 피운 산벚나무가 저녁 빛을 받아 은은하게 빛나고 있었다.`},
  {w:`anne`, in:1, f:`anne_happy`, fx:`dream`, eff:{item:`petal`}, cam:`in`,
   e:`낮은 가지를 밟고 올라가 앉으니까 꽃잎이 내 머리 위로 사르르 떨어졌어. 여긴 대리석 궁전이고, 나는 이 궁전의 공주야! 나는 벚꽃잎 하나를 주머니에 꼭 넣어 두었어.`,
   l:`낮은 가지를 디디고 올라앉자 꽃잎이 머리 위로 소리 없이 흩날렸다. 이곳은 대리석 궁전이고, 나는 그 궁전의 주인이었다. 나는 꽃잎 한 장을 주머니 깊숙이 넣어 두었다.`},
  {w:`anne`, in:1, f:`anne_surprised`, cam:`shake`,
   e:`그때 멀리 역 쪽에서 말발굽 소리가 들렸어. 혹시 나를 데리러 오신 걸까? 나는 얼른 나무에서 내려와 승강장으로 달려갔어.`,
   l:`그때 역 쪽에서 말발굽 소리가 아련히 들려왔다. 혹시 나를 데리러 온 걸까? 나는 서둘러 나무에서 내려와 승강장으로 달음질쳤다.`},
  {id:`m1`, w:`anne`, in:1, f:`anne_surprised`, bk:[6,7], cam:``,
   e:`지붕널 더미에 앉아 있는데, 키가 크고 등이 구부정한 할아버지 한 분이 나를 쳐다보지도 않고 휙 지나가셨어. 그러고는 역장님과 무슨 이야기를 나누셨어.`,
   l:`지붕널 더미에 앉아 있는데, 키 크고 등이 구부정한 노신사 한 분이 나를 쳐다보지도 않은 채 서둘러 지나쳤다. 그는 매표소를 잠그던 역장과 무언가 이야기를 나누었다.`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`matthew`, bk:[9,10,11,12,13,14], cam:`right`, eff:{flag:`metMatthew`},
   e:`역장님이 손으로 나를 가리키셨어. 할아버지는 몹시 당황한 얼굴이었어. 어깨까지 닿는 회색 머리에 부드러운 갈색 수염… 저분이 매슈 커스버트 아저씨일까?`,
   l:`역장이 손가락으로 나를 가리켰다. 노신사의 얼굴에 당혹이 번졌다. 어깨까지 닿는 쇳빛 머리, 부드러운 갈색 수염. 저분이 초록 지붕 집의 매슈 커스버트 씨일까?`},
  {t:`choice`, id:`C2`, kind:`predict`, label:`첫인사`, f:`anne_surprised`, o:`matthew`,
   q:{e:`그 할아버지가 머뭇머뭇 앤 쪽으로 걸어와요. 원작의 앤은 어떻게 했을까요?`, l:`노신사가 주저하며 다가옵니다. 원작의 앤은 어떻게 했을까요?`},
   note:{e:`원작의 앤은 매슈가 다가오자마자 먼저 벌떡 일어나 손을 내밀며 인사해요. 수줍음이 많은 매슈는 먼저 말을 꺼내지 않아도 되어서 오히려 다행이었대요.`,
         l:`원작에서 앤은 매슈가 다가오자마자 먼저 일어나 손을 내밀며 인사를 건넵니다. 여자아이를 무서워하던 수줍은 매슈는 먼저 말을 꺼내는 고역을 면하게 되지요.`},
   opts:[
    {type:`canon`, go:`m3`, e:`벌떡 일어나 가방을 쥐고, 먼저 손을 내밀며 인사한다.`, l:`먼저 일어나 한 손으로 가방을 쥐고, 다른 손을 내밀며 인사를 건넨다.`, s:{e:`먼저 손을 내밀며 인사했다`, l:`먼저 일어나 손을 내밀었다`}},
    {type:`imag`, go:`c2b`, e:`기차역의 공주님처럼 우아하게 앉아서, 할아버지가 먼저 인사하실 때까지 기다린다.`, l:`기차역의 공주처럼 우아하게 앉은 채, 신사가 먼저 예를 갖추기를 기다린다.`, s:{e:`공주님처럼 앉아서 기다렸다`, l:`공주처럼 앉아 인사를 기다렸다`}},
    {type:`bal`, go:`c2c`, e:`할아버지가 편하게 말씀하실 수 있게, 가방을 꼭 쥐고 조용히 기다린다.`, l:`상대가 먼저 말할 수 있도록 가방을 품에 안고 조용히 기다린다.`, s:{e:`조용히 기다리다 용기를 냈다`, l:`조용히 기다리다 먼저 용기를 냈다`}}
   ]},
  {id:`c2b`, w:`anne`, in:1, f:`anne_dreamy`, o:`matthew`, fx:`dream`, eff:{album:`princess`},
   e:`나는 턱을 살짝 들고, 두 손을 무릎 위에 포개고, 공주님처럼 앉아 있었어. 그런데 할아버지는 내 앞에서 모자만 만지작거리시며 한마디도 못 하셨어!`,
   l:`나는 턱을 살짝 들고 두 손을 무릎에 포갠 채 공주처럼 앉아 있었다. 그러나 신사는 내 앞에서 모자챙만 만지작거릴 뿐 한마디도 꺼내지 못했다.`},
  {w:`anne`, in:1, f:`anne_happy`, o:`matthew`,
   e:`한참을 기다리다가 나는 그만 웃음이 터졌어. 공주 놀이는 여기까지! 결국 내가 먼저 손을 내밀었지.`,
   l:`그 침묵이 너무 길어 나는 그만 웃음을 터뜨렸다. 공주 놀이는 여기까지. 결국 내가 먼저 손을 내밀었다.`},
  {t:`goto`, to:`m3`},
  {id:`c2c`, w:`anne`, in:1, f:`anne_happy`, o:`matthew`, eff:{heart:{matthew:1}},
   e:`할아버지는 내 앞에 서서 입을 열었다 닫았다 하셨어. 너무너무 수줍어하시는 것 같았어. 그래서 아저씨가 곤란하지 않게 내가 먼저 용기를 냈어.`,
   l:`신사는 내 앞에 서서 입술만 달싹였다. 지독히도 수줍음을 타는 분이었다. 나는 그분이 곤란하지 않도록 먼저 용기를 내기로 했다.`},
  {id:`m3`, w:`anne`, f:`anne_happy`, o:`matthew`, bk:[18,19], cam:`left`,
   e:`"초록 지붕 집의 매슈 커스버트 아저씨 맞으시죠? 만나서 정말 반가워요! 안 오시면 어쩌나 걱정하던 참이었어요."`,
   l:`"초록 지붕 집의 매슈 커스버트 씨지요? 만나서 정말 반가워요. 저를 데리러 오지 않으시는 건 아닐까 슬슬 걱정하던 참이었어요."`},
  {w:`anne`, f:`anne_dreamy`, o:`matthew`, bk:[19], when:s => s.flags.cherry,
   e:`"오늘 안 오시면 철길 모퉁이 산벚나무 위에서 자려고 했어요. 사실 아까 미리 올라가 봤거든요! 정말 대리석 궁전 같았어요."`,
   l:`"오늘 밤 안 오시면 모퉁이의 산벚나무에 올라가 밤을 지새울 생각이었어요. 실은 아까 미리 올라가 봤는데, 정말 대리석 궁전 같았답니다."`},
  {w:`anne`, f:`anne_dreamy`, o:`matthew`, bk:[19], when:s => !s.flags.cherry,
   e:`"오늘 안 오시면 철길 모퉁이의 커다란 산벚나무에 올라가서 자려고 했어요. 달빛 아래 하얀 꽃 속에서 자면 대리석 궁전에 사는 기분일 거예요!"`,
   l:`"오늘 밤 안 오시면 철길 모퉁이의 커다란 산벚나무에 올라가 밤을 새우려고 했어요. 달빛 속 하얀 꽃 위에서 잠들면 대리석 궁전에 산다고 상상할 수 있잖아요?"`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`matthew`, bk:[20],
   e:`아저씨는 내 손을 어색하게 잡으시고, 잠깐 무언가 망설이는 얼굴이셨어. 그때는 몰랐지만, 아저씨는 그 순간 아주 중요한 결심을 하셨던 거야.`,
   l:`아저씨는 내 앙상한 손을 어색하게 쥔 채 잠시 무언가를 망설였다. 그때의 나는 몰랐지만, 그 짧은 순간 그분은 중요한 결심을 내린 것이었다.`},
  {w:`matthew`, f:`anne_happy`, o:`matthew`, bk:[21], cam:`right`,
   e:`"늦어서 미안하구나. 가자꾸나. 말은 저쪽 마당에 있단다. 가방은 이리 주렴."`,
   l:`"늦어서 미안하구나. 가자꾸나. 말은 저쪽 마당에 있단다. 가방은 이리 다오."`},
  {w:`anne`, f:`anne_happy`, o:`matthew`, bk:[22], eff:{item:`carpetbag`}, cam:`left`,
   e:`"제가 들 수 있어요! 제 물건이 다 들어 있지만 하나도 안 무거워요. 그리고 손잡이를 딱 정해진 방법으로 잡아야 안 빠지거든요. 그 요령은 제가 제일 잘 알아요!"`,
   l:`"제가 들게요. 제 세상 재산이 전부 들었지만 무겁지 않아요. 게다가 정해진 방법으로 들지 않으면 손잡이가 빠져 버리거든요. 그 요령은 제가 정확히 알아요."`},
  {w:`anne`, f:`anne_sad`, o:`matthew`, bk:[22], cam:`in`,
   e:`"저는 한 번도 누군가의 식구였던 적이 없어요. 고아원에는 넉 달 있었는데 정말 힘들었어요. 그래서 밤마다 옆자리 아이가 사실은 백작의 딸이라고 상상하면서 버텼어요."`,
   l:`"저는 진정으로 누군가의 식구였던 적이 한 번도 없어요. 고아원에서 지낸 넉 달은 상상할 수 있는 무엇보다 나빴어요. 그래서 밤마다 옆자리 아이가 실은 납치당한 백작의 딸이라고 상상하며 잠 못 이뤘지요."`},
  /* ---------- 언덕길 ---------- */
  {bg:`ch1_road`, w:`anne`, in:1, cam:``, f:`anne_dreamy`, o:`matthew`, bk:[23,24], eff:{item:`plum`},
   e:`마차는 마을을 벗어나 언덕길을 내려갔어. 길 양쪽 둑에는 하얀 벚꽃과 가느다란 자작나무가 줄지어 서 있었어. 나는 마차 옆을 스치는 자두나무 꽃가지 하나를 똑 꺾었어.`,
   l:`마차는 마을을 벗어나 가파른 언덕길을 내려갔다. 깊게 깎인 길 양옆 둑에는 꽃 핀 산벚나무와 가냘픈 자작나무가 늘어서 머리 위로 솟아 있었다. 나는 마차를 스치는 야생 자두나무 가지 하나를 꺾어 들었다.`},
  {t:`choice`, id:`C3`, kind:`talk`, label:`마차 위 첫 질문`, f:`anne_happy`, o:`matthew`,
   q:{e:`꽃가지를 든 앤이 매슈 아저씨에게 말을 걸어요. 무엇을 물어볼까요?`, l:`꽃가지를 손에 든 앤이 말을 건넵니다. 무엇을 물어볼까요?`},
   note:{e:`원작의 앤은 하얀 야생 자두나무를 보며 "무엇이 떠오르세요?"라고 묻고, 길이 왜 빨간지, 집 근처에 시냇물이 있는지 쉴 새 없이 질문해요. 매슈의 대답은 거의 언제나 "글쎄다, 모르겠구나"였지요.`,
         l:`원작에서 앤은 하얀 야생 자두나무를 보며 무엇이 떠오르느냐고 묻습니다. 이어서 빨간 길, 시냇물, 천상의 아름다움까지 질문이 쏟아지고, 매슈는 "글쎄다, 모르겠구나"로 일관하면서도 그 수다를 즐기게 됩니다.`},
   opts:[
    {type:`canon`, go:`c3a`, eff:{heart:{matthew:1}}, e:`"아저씨, 저 하얗고 레이스 같은 나무를 보면 뭐가 떠오르세요?"`, l:`"둑에서 몸을 내민 저 하얗고 레이스 같은 나무를 보면 무엇이 떠오르세요?"`, s:{e:`하얀 나무를 보면 뭐가 떠오르는지 물었다`, l:`하얀 나무가 무엇을 떠올리게 하는지 물었다`}},
    {type:`imag`, go:`c3b`, eff:{heart:{matthew:1}}, e:`"아저씨, 이 마차가 사실은 하늘을 나는 마차라고 상상해 보실래요?"`, l:`"이 마차가 실은 구름 위를 달리는 마차라고 함께 상상해 보시겠어요?"`, s:{e:`하늘을 나는 마차 상상 놀이를 했다`, l:`구름 위를 달리는 마차를 함께 상상했다`}},
    {type:`bal`, go:`c3c`, eff:{heart:{matthew:2}}, e:`"아저씨는 뭘 좋아하세요? 아저씨 이야기도 듣고 싶어요."`, l:`"아저씨께서는 무엇을 좋아하세요? 저만 떠들었으니 이번엔 아저씨 이야기를 듣고 싶어요."`, s:{e:`아저씨가 좋아하는 것을 물었다`, l:`매슈 아저씨의 이야기를 청했다`}}
   ]},
  {id:`c3a`, w:`matthew`, f:`anne_happy`, o:`matthew`, bk:[25,26],
   b:`"글쎄다, 모르겠구나."`},
  {w:`anne`, f:`anne_dreamy`, o:`matthew`, bk:[27],
   e:`"당연히 신부죠! 안개 같은 면사포를 쓴 하얀 신부요. 저는 예쁜 옷을 한 번도 가져 본 적이 없지만, 언젠가 하얀 드레스를 꼭 입어 보고 싶어요."`,
   l:`"당연히 신부죠. 안개처럼 고운 면사포를 쓴 새하얀 신부요. 예쁜 옷이라곤 가져 본 적 없지만, 언젠가 하얀 드레스를 한 벌 갖는 게 제가 바라는 최고의 행복이에요."`},
  {t:`goto`, to:`m9`},
  {id:`c3b`, w:`anne`, f:`anne_happy`, o:`matthew`, fx:`dream`, cam:`up`, eff:{album:`flying`},
   e:`"보세요, 밤색 말 등에 커다란 날개가 돋았어요! 우리는 지금 벚꽃 구름 위를 날고 있는 거예요!"`,
   l:`"보세요, 밤색 말의 등에서 커다란 날개가 돋아났어요! 우리는 지금 벚꽃 구름 위를 달리고 있는 거예요!"`},
  {w:`matthew`, f:`anne_happy`, o:`matthew`, fx:`dream`,
   e:`"글쎄다… 그럼 날개 달린 말한테는 귀리를 두 배로 줘야겠구나."`,
   l:`"글쎄다… 그렇다면 날개 달린 말한테는 귀리를 곱절로 줘야겠구나."`},
  {w:`anne`, in:1, f:`anne_happy`, o:`matthew`,
   e:`아저씨가 수염 속으로 살짝 웃으셨어. 내 상상 놀이에 같이 올라타 준 어른은 아저씨가 처음이야!`,
   l:`아저씨의 수염 속에서 웃음이 번졌다. 내 상상 놀이에 기꺼이 올라타 준 어른은 그분이 처음이었다.`},
  {t:`goto`, to:`m9`},
  {id:`c3c`, w:`matthew`, cam:`right`, f:`anne_happy`, o:`matthew`, eff:{album:`matthewTalk`},
   e:`"나, 나 말이냐? 글쎄다… 나는 말 돌보는 거랑, 해 질 녘에 조용히 밭을 보는 게 좋구나. 누가 내 얘기를 물어봐 준 건 참 오랜만이구나."`,
   l:`"나, 나 말이냐? 글쎄다… 말을 돌보는 일이랑, 해 질 녘 조용히 밭을 바라보는 게 좋지. 누가 내 이야기를 물어 준 게 참 오랜만이구나."`},
  {w:`anne`, in:1, f:`anne_happy`, o:`matthew`,
   e:`아저씨의 귀가 살짝 빨개졌어. 수줍은 사람도 누가 궁금해해 주면 기쁜가 봐.`,
   l:`아저씨의 귓불이 살짝 붉어졌다. 아무리 수줍은 사람이라도 누군가 자신을 궁금해해 주면 기쁜 법이다.`},
  {id:`m9`, w:`anne`, cam:``, f:`anne_dreamy`, o:`matthew`, bk:[27],
   e:`"그런데 아저씨, 이 섬의 길은 왜 빨간색이에요? 스펜서 부인께 여쭤 봤더니 제발 그만 물어보라고 하셨어요."`,
   l:`"그런데 이 섬의 길들은 왜 빨간 거예요? 스펜서 부인께 여쭤 봤더니 제발 질문 좀 그만하라고 하셨어요. 하지만 질문을 안 하면 어떻게 알아내겠어요?"`},
  {w:`matthew`, f:`anne_happy`, o:`matthew`, bk:[28], b:`"글쎄다, 모르겠구나."`},
  {w:`anne`, f:`anne_happy`, o:`matthew`, bk:[29],
   e:`"그럼 언젠가 알아내야 할 것 중 하나네요! 알아낼 게 이렇게 많다니 정말 신나요. 그런데… 제가 말을 너무 많이 하나요? 싫으시면 그만할게요."`,
   l:`"그럼 그건 언젠가 알아낼 일 중 하나네요. 알아낼 것이 이토록 많다니, 살아 있다는 게 그저 기뻐요. 그런데… 제가 말을 너무 많이 하나요? 원하시면 그만할게요. 어렵긴 하지만요."`},
  {w:`matthew`, f:`anne_happy`, o:`matthew`, bk:[30,31],
   b:`"아, 하고 싶은 만큼 얼마든지 이야기하렴. 나는 괜찮단다."`},
  {w:`anne`, in:1, f:`anne_happy`, o:`matthew`, bk:[32],
   e:`와! 말하고 싶을 때 마음껏 말해도 된다니! "아이들은 조용히 해야 한다"는 말을 백만 번은 들었는데. 아저씨랑 나는 분명 잘 지낼 거야.`,
   l:`말하고 싶을 때 마음껏 말해도 된다니. "아이는 눈에 띄되 소리 내지 말라"는 말을 백만 번은 들어 온 내게 그것은 해방과도 같았다. 아저씨와 나는 틀림없이 잘 지낼 것이다.`},
  {w:`anne`, f:`anne_sad`, o:`matthew`, bk:[36,37], cam:`left`,
   e:`"지금 저는 거의 완벽하게 행복해요. 하지만 완전히 행복할 수는 없어요. 아저씨, 이건 무슨 색이에요?" 나는 땋은 머리 한 가닥을 들어 보였어.`,
   l:`"지금 저는 거의 완벽하게 행복해요. 하지만 완전히 행복할 수는 없어요. 왜냐하면… 이건 무슨 색이라고 하시겠어요?" 나는 윤기 나는 땋은 머리 한 가닥을 어깨 너머로 넘겨 아저씨 눈앞에 들어 보였다.`},
  {w:`matthew`, f:`anne_sad`, o:`matthew`, bk:[38], b:`"빨간색이지, 아니냐?"`},
  {w:`anne`, f:`anne_sad`, o:`matthew`, bk:[39,40], cam:`in`,
   e:`"네, 빨간색이에요. 주근깨랑 마른 몸은 상상으로 없앨 수 있어요. 하지만 빨간 머리만은 아무리 상상해도 안 없어져요. 이건 제 평생의 슬픔이 될 거예요."`,
   l:`"네, 빨간색이에요. 주근깨도, 초록 눈도, 깡마른 몸도 상상으로 지울 수 있어요. 하지만 빨간 머리만은 도저히 지울 수가 없어요. '내 머리는 까마귀 날개처럼 새까맣다' 아무리 되뇌어도 소용없어요. 이건 제 평생의 슬픔이 될 거예요."`},
  {w:`anne`, f:`anne_dreamy`, o:`matthew`, bk:[42,43,44,45],
   e:`"아저씨라면 뭐가 되고 싶으세요? 눈부시게 아름다운 사람, 눈부시게 똑똑한 사람, 천사처럼 착한 사람 중에서요." 아저씨는 "글쎄다, 나는… 잘 모르겠구나." 하시며 머리가 어질어질하신 것 같았어.`,
   l:`"고를 수 있다면 어떤 사람이 되고 싶으세요? 천상의 아름다움을 지닌 사람, 눈부시게 영리한 사람, 아니면 천사처럼 착한 사람?" "글쎄다, 나는… 잘 모르겠구나." 아저씨는 회전목마에서 막 내린 사람처럼 어지러워 보였다.`},
  /* ---------- 가로수길 ---------- */
  {bg:`ch1_avenue`, w:`anne`, f:`anne_surprised`, cam:`shake`, o:`matthew`, bk:[46,47],
   e:`"저도 못 고르겠어요. 스펜서 부인 말씀으로는… 아, 커스버트 아저씨! 아, 아저씨!! 아저씨!!!"`,
   l:`"저도 정하지 못하겠어요. 스펜서 부인 말씀으로는… 아, 커스버트 씨! 아, 커스버트 씨!! 아, 커스버트 씨!!!"`},
  {w:`anne`, in:1, f:`anne_dreamy`, o:`matthew`, bk:[48], cam:`up`,
   e:`모퉁이를 돌자, 커다란 사과나무들이 길 위를 지붕처럼 덮은 길이 나타났어. 머리 위는 온통 눈처럼 하얀 꽃이었고, 저 끝에서는 노을이 커다란 장미창처럼 빛나고 있었어.`,
   l:`모퉁이를 돌자 '가로수길'이 나타났다. 가지를 활짝 편 거대한 사과나무들이 길 위를 아치처럼 온통 덮고 있었다. 머리 위로는 눈처럼 희고 향기로운 꽃의 차양이 끝없이 이어졌고, 저 멀리 노을 진 하늘이 대성당 통로 끝의 커다란 장미창처럼 빛났다.`},
  {w:`anne`, in:1, f:`anne_dreamy`, o:`matthew`, bk:[49], cam:`in`,
   e:`나는 두 손을 꼭 모으고 하늘만 올려다봤어. 너무 아름다워서 한마디도 할 수 없었어. 마을을 지나고 3마일을 더 가도록 말이야. 나 같은 수다쟁이가!`,
   l:`나는 두 손을 모아 쥔 채 머리 위의 하얀 장관만 올려다보았다. 뉴브리지 마을을 지나고 다시 3마일을 달리는 동안 나는 한마디도 하지 않았다. 떠드는 만큼이나 열렬하게, 나는 침묵할 수도 있었다.`},
  {w:`matthew`, f:`anne_dreamy`, o:`matthew`, bk:[50], cam:`right`,
   e:`"꽤 피곤하고 배고픈 모양이구나. 이제 1마일만 더 가면 된단다."`,
   l:`"꽤 피곤하고 배가 고픈 모양이구나. 하지만 이제 멀지 않았다. 1마일만 더 가면 돼."`},
  {w:`anne`, f:`anne_dreamy`, o:`matthew`, bk:[51,52,54], cam:`left`,
   e:`"아저씨, 아까 그 하얀 곳은 뭐였어요? 예쁘다는 말로는 모자라요. 상상으로도 더 멋지게 만들 수 없는 곳은 처음이었어요. 가슴이 이상하게 아팠는데, 기분 좋은 아픔이었어요."`,
   l:`"아, 커스버트 씨. 아까 그 하얀 곳은 뭐였어요? '예쁘다'로도 '아름답다'로도 모자라요. 상상으로도 더 낫게 만들 수 없는 건 처음 봤어요. 가슴이 묘하게 아팠는데, 그건 기분 좋은 아픔이었어요."`},
  {w:`matthew`, f:`anne_dreamy`, o:`matthew`, bk:[53],
   e:`"글쎄다, 가로수길을 말하는 모양이구나. 꽤 예쁜 곳이지."`,
   l:`"글쎄다, 가로수길을 말하는 모양이구나. 꽤 예쁜 곳이지."`},
  {w:`anne`, in:1, f:`anne_dreamy`, o:`matthew`, bk:[56],
   e:`가로수길? 그런 이름에는 아무 뜻도 없잖아! 나는 마음에 안 드는 이름이 있으면 언제나 새 이름을 지어 줘. 이 길에도 꼭 맞는 이름을 지어 줘야겠어.`,
   l:`가로수길이라니, 그런 이름에는 아무 뜻도 담겨 있지 않다. 나는 마음에 들지 않는 이름을 만나면 언제나 새 이름을 상상해 붙여 주었다. 이 길에도 꼭 맞는 이름이 필요했다.`},
  {t:`name`, id:`N1`, key:`avenue`, label:`가로수길에 붙인 이름`, canon:`기쁨의 하얀 길`, f:`anne_dreamy`, o:`matthew`,
   q:{e:`✍️ 앤이 되어 이 길에 이름을 지어 주세요! 어떤 이름이 어울릴까요?`, l:`✍️ 앤이 되어, 이 꽃길에 꼭 맞는 이름을 지어 주세요.`},
   ph:`예: 꽃구름 터널`,
   note:{e:`원작의 앤은 이 길을 '기쁨의 하얀 길'이라고 불렀어요. 고아원에 있던 친구 '헵지바 젠킨스'도 마음속으로는 '로잘리아 드비어'라고 불렀대요.`,
         l:`원작에서 앤은 이 길을 '기쁨의 하얀 길'이라 명명합니다. 마음에 들지 않는 이름은 늘 새로 상상해 붙이는 것이 앤의 버릇이었지요. 고아원 친구 헵지바 젠킨스는 앤의 마음속에서 로잘리아 드비어였습니다.`}},
  {w:`anne`, f:`anne_happy`, o:`matthew`, bk:[56], eff:{item:`namecard`},
   e:`"다른 사람들은 가로수길이라고 부르겠지만, 저는 언제까지나 '{avenue}'{avenue|이라고} 부를 거예요!"`,
   l:`"다른 사람들은 그곳을 가로수길이라 부르겠지만, 저는 언제까지나 '{avenue}'{avenue|이라고} 부를 거예요."`},
  {w:`anne`, f:`anne_happy`, o:`matthew`, bk:[56],

   l:`언덕 마루를 넘자 강처럼 길고 구불구불한 연못이 내려다보였다. 물은 크로커스빛, 장밋빛, 투명한 초록빛으로 시시각각 바뀌었고, 아직 아무도 이름 붙이지 못한 빛깔도 어른거렸다. 늪에서는 개구리들의 구슬프고도 달콤한 합창이 들려왔고, 건너편 비탈 회색 집 창문에는 불빛 하나가 켜져 있었다.`},

  {id:`c4a`, w:`anne`, f:`anne_happy`, o:`matthew`, bk:[59],

  {id:`c4b`, w:`anne`, f:`anne_happy`, o:`matthew`, fx:`dream`,

  {id:`c4c`, w:`anne`, f:`anne_happy`, o:`matthew`, eff:{heart:{matthew:1}},

  {w:`anne`, in:1, f:`anne_happy`, o:`matthew`, bk:[62],

  {w:`matthew`, f:`anne_surprised`, o:`matthew`, bk:[63,64,65], cam:`right`,
   e:`"저 위 집이 배리 씨네란다. 열한 살쯤 된 딸이 하나 있지. 이름은 다이애나란다."`,

  {w:`anne`, f:`anne_happy`, o:`matthew`, bk:[66,68], cam:`left`,
   e:`"다이애나! 정말 완벽하게 아름다운 이름이에요!" 다리를 건널 때 나는 눈을 꼭 감았다가, 한가운데쯤에서 번쩍 떴어. 혹시 다리가 접히면 그걸 꼭 보고 싶었거든!`,
   l:`"다이애나! 정말이지 완벽하게 아름다운 이름이에요!" 다리 위에서 나는 눈을 꼭 감았다가 한가운데쯤에서 번쩍 떴다. 만약 다리가 주머니칼처럼 접힌다면, 그 장면만큼은 꼭 보고 싶었으니까.`},
  {w:`anne`, f:`anne_happy`, o:`matthew`, bk:[68],

   l:`나는 눈을 뜨고 언덕 아래 흩어진 농가들을 하나하나 살폈다. 마침내 내 눈길은 숲 어스름 속에서 꽃나무로 희미하게 하얀 한 집에 머물렀다. 그 위로 수정처럼 하얀 커다란 별 하나가 길잡이의 등불처럼 빛나고 있었다.`},

  {w:`anne`, f:`anne_happy`, o:`matthew`, bk:[76],

  {w:`anne`, f:`anne_happy`, o:`matthew`, fx:`dream`,

  {w:`anne`, in:1, f:`anne_happy`, o:`matthew`, bk:[72],

  {id:`m34`, w:`anne`, cam:`left`, f:`anne_dreamy`, o:`matthew`, bk:[76],
   e:`"꼭 꿈을 꾸는 것 같아요. 오늘 꿈일까 봐 제 팔을 하도 꼬집어서 멍이 들었을 거예요. 그러다 생각했어요. 꿈이라면 최대한 오래 꾸는 게 낫겠다고요. 그런데 이건 진짜예요!"`,
   l:`"아, 꼭 꿈을 꾸고 있는 것 같아요. 오늘 하도 여러 번 꼬집어서 제 팔은 시퍼렇게 멍이 들었을 거예요. 그러다 문득 깨달았어요. 설령 꿈이라 해도 할 수 있는 한 오래 꾸는 게 낫겠다고요. 그런데 이건 진짜예요. 우리는 이제 집에 거의 다 왔어요."`},

  {id:`g_c`, w:`anne`, f:`anne_sad`, o:`lynde`, bk:[`10-31`,`10-32`], cam:`in`,

   l:`나는 깜짝 놀란 부인 앞에 무릎을 꿇고 애원하듯 두 손을 내밀었다. "아, 린드 부인, 정말 너무너무 죄송해요. 사전 한 권을 다 쓴다 해도 제 슬픔을 다 표현할 수 없어요. 제 머리는 빨갛고, 저는 주근깨투성이에 깡마르고 못생겼어요. 부인 말씀은 다 사실이었어요. 제발, 제발 용서해 주세요. 안 그러시면 그건 제 평생의 슬픔이 될 거예요!"`},

  {w:`lynde`, f:`anne_sad`, o:`lynde`, bk:[`10-35`,`10-36`], cam:`right`,

  {w:`anne`, in:1, f:`anne_sad`, o:`marilla_warm`, cam:`in`,
   e:`아주머니도 그런 아픔이 있으셨구나. 나는 아무 말 없이 아주머니의 거친 손에 내 손을 살며시 밀어 넣었어.`,
   l:`아주머니에게도 그런 아픔이 있었구나. 나는 아무 말 없이 그 거친 손바닥에 내 손을 살며시 밀어 넣었다.`},
  {w:`anne`, f:`anne_happy`, o:`marilla_warm`, bk:[`10-52`],

  talk: {
    e: [`앤은 왜 다이애나를 만나기 전에 그렇게 떨었을까요? 새 친구를 처음 만날 때 나는 어떤 기분이었나요?`,
        `앤이 말한 '마음의 친구'는 그냥 친구와 무엇이 다를까요? 나에게 마음의 친구가 있다면 어떤 친구인가요?`,
        `"나눠 주면 두 배로 달콤할 거예요." 앤의 이 말에 공감하나요? 나눠서 더 기뻤던 경험을 이야기해 봐요.`],
    l: [`마릴라는 "다이애나보다 그 어머니가 문제"라고 말합니다. 배리 부인은 어떤 사람으로 그려졌으며, 이 묘사가 앞으로의 이야기에서 어떤 역할을 할지 예측해 봅시다.`,

        `마지막 장면에서 마릴라는 앤이 좋아지고 있다고 인정하면서도 "놀리지는 말라"고 합니다. 마릴라의 이 말투에 담긴 성격을 분석해 봅시다.`]

  nodes: [
  /* ---------- 지난 이야기 ---------- */
  {id:`b1`, bg:`ch2`, w:`anne`, in:1, f:`anne_happy`, cam:`in`,
   e:`린드 부인께 사과한 뒤로, 초록 지붕 집에서의 하루하루는 정말 즐거웠어. 마릴라 아주머니는 나한테 새 드레스를 세 벌이나 지어 주셨어. 하지만… 셋 다 수수하고 소매가 쪼그라든 드레스였어. 나는 소매가 풍선처럼 볼록한 드레스를 꼭 입어 보고 싶었는데!`,
   l:`린드 부인께 사과한 뒤로 초록 지붕 집의 나날은 즐거웠다. 마릴라 아주머니는 내게 드레스를 세 벌이나 지어 주었다. 다만 셋 모두 수수하기 짝이 없었고, 소매는 볼품없이 좁았다. 나는 풍선처럼 부푼 소매가 달린 드레스를 얼마나 입고 싶었는지 모른다.`},
  {w:`anne`, in:1, f:`anne_dreamy`, when:s => s.items.includes(`auburn`),
   e:`그래도 린드 부인이 해 주신 말을 떠올리면 힘이 났어. 내 머리가 크면 멋진 적갈색이 될지도 모른대!`,
   l:`그래도 린드 부인이 건넨 희망의 한마디를 떠올리면 기운이 났다. 내 머리가 자라면서 멋진 적갈색이 될지도 모른다니!`},
  {w:`anne`, in:1, f:`anne_happy`, cam:`out`,
   e:`지난 일요일, 나는 처음으로 혼자 주일 학교에 갔어. 그런데 가는 길에 길가에 장미랑 노란 미나리아재비가 가득 피어 있는 거야. 너무 예뻐서 그냥 지나칠 수가 없었어.`,
   l:`지난 일요일, 나는 처음으로 혼자 주일 학교에 갔다. 그런데 가는 길 양옆에 들장미와 노란 미나리아재비가 흐드러지게 피어 있었다. 그토록 고운 것을 그냥 지나칠 수는 없었다.`},

         l:`원작에서 앤은 들장미와 미나리아재비를 한 아름 꺾어 모자에 둥글게 두릅니다. 교회 사람들은 수군거렸고, 그 소문은 린드 부인을 거쳐 마릴라에게 전해지지요. (원작 11장)`},

    {type:`bal`, go:`a_b`, eff:{flag:`oneRose`}, e:`가장 예쁜 들장미 한 송이만 꺾어서 모자 리본에 살짝 꽂는다.`, l:`가장 고운 들장미 한 송이만 골라 모자 리본에 살며시 꽂는다.`, s:{e:`장미 한 송이만 살짝 꽂았다`, l:`장미 한 송이만 꽂았다`}}

   l:`나는 꽃을 한 아름 꺾어 모자에 빙 둘러 달았다. 분홍과 노랑이 어우러진 화관 모자였다. 교회에 들어서자 사람들의 시선이 쏠렸지만, 나는 그것이 감탄의 눈길이라고만 생각했다.`},
  {t:`goto`, to:`a_m`},
  {id:`a_i`, w:`anne`, in:1, f:`anne_dreamy`, fx:`dream`, cam:`up`, eff:{album:`flowerQueen`},
   e:`나는 꽃 모자를 쓰고 '들꽃 나라의 여왕'이 됐어. 뒤에서 꽃 요정들이 치맛자락을 들고 따라오고, 미나리아재비들이 고개 숙여 인사했지. 교회 문을 들어설 때까지 나는 진짜 여왕이었어!`,
   l:`꽃 모자를 쓴 나는 들꽃 나라의 여왕이었다. 꽃 요정들이 옷자락을 받쳐 들고 뒤따르고, 미나리아재비들이 일제히 고개를 숙였다. 교회 문턱을 넘을 때까지 나는 틀림없는 여왕이었다.`},
  {w:`anne`, in:1, f:`anne_surprised`,
   e:`그런데 교회 안에서 사람들이 나를 보고 수군거렸어. 여왕을 처음 봐서 그런 걸까?`,
   l:`그런데 교회 안의 사람들이 나를 보며 수군거렸다. 여왕을 처음 보아서 그런 것일까.`},
  {t:`goto`, to:`a_m`},
  {id:`a_b`, w:`anne`, in:1, f:`anne_happy`,
   e:`나는 제일 예쁜 들장미 한 송이만 골라서 모자 리본에 살짝 꽂았어. 아무도 눈치 못 챌 만큼 작지만, 나한테는 비밀 보석 같았어.`,
   l:`나는 가장 고운 들장미 한 송이만 골라 모자 리본에 살며시 꽂았다. 누구의 눈에도 띄지 않을 만큼 작았지만, 내게는 비밀스러운 보석이었다.`},
  /* ---------- 금요일, 마릴라의 꾸중 ---------- */
  {id:`a_m`, bg:`ch2`, w:`anne`, in:1, f:`anne_surprised`, o:`marilla_strict`, bk:[`12-1`], cam:``,
   e:`그리고 금요일. 린드 부인 댁에 다녀오신 마릴라 아주머니가 나를 부르셨어. 얼굴이 심상치 않았어.`,
   l:`그리고 금요일. 린드 부인 댁에서 돌아온 마릴라 아주머니가 나를 불러 세웠다. 표정이 심상치 않았다.`},
  {w:`marilla`, f:`anne_surprised`, o:`marilla_strict`, bk:[`12-2`], cam:`right`, when:s => s.flags.wreath,
   e:`"앤, 네가 지난 일요일에 장미랑 미나리아재비를 덕지덕지 단 모자를 쓰고 교회에 갔다면서? 대체 무슨 생각으로 그런 거니?"`,
   l:`"앤, 레이첼 부인 말이 네가 지난 일요일에 장미랑 미나리아재비를 덕지덕지 단 우스꽝스러운 모자를 쓰고 교회에 갔다더구나. 대체 무슨 생각으로 그런 장난을 친 거니? 볼 만한 꼴이었겠다!"`},
  {w:`marilla`, f:`anne_surprised`, o:`marilla_strict`, cam:`right`, when:s => s.flags.oneRose,
   e:`"앤, 레이첼 부인 말이 네 모자에 장미가 꽂혀 있더라는구나. 한 송이라 다행이지, 다른 애들처럼 잔뜩 달았으면 큰일 날 뻔했다. 교회에 갈 땐 단정하게 하고 가거라."`,
   l:`"앤, 레이첼 부인 말이 네 모자에 장미가 한 송이 꽂혀 있더라는구나. 한 송이였으니 망정이지, 잔뜩 달고 갔으면 온 동네 이야깃거리가 됐을 거다. 교회에 갈 땐 단정하게 하고 가거라."`},
  {w:`anne`, f:`anne_sad`, o:`marilla_strict`, bk:[`12-3`,`12-5`], when:s => s.flags.wreath,
   e:`"분홍이랑 노랑이 저한테 안 어울리는 건 알아요. 그런데 드레스에 꽃을 다는 거랑 모자에 다는 거랑 뭐가 달라요? 다른 애들은 드레스에 꽃다발을 꽂고 왔는걸요."`,
   l:`"분홍이랑 노랑이 제게 어울리지 않는다는 건 알아요. 하지만 드레스에 꽃을 다는 것과 모자에 다는 것이 무엇이 다른지 모르겠어요. 다른 여자애들은 드레스에 꽃다발을 꽂고 왔는걸요."`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`, bk:[`12-6`,`12-7`], when:s => s.flags.wreath,
   e:`"말대꾸하지 마라. 레이첼 부인이 그 꼴을 보고 바닥으로 꺼지고 싶었단다. 사람들은 내가 너를 그렇게 내보낼 만큼 생각이 없다고 여기겠지!"`,
   l:`"그렇게 말대꾸하지 마라. 레이첼 부인은 네가 들어오는 걸 보고 바닥으로 꺼져 버리고 싶었단다. 사람들은 내가 너를 그런 꼴로 내보낼 만큼 생각이 없는 사람이라고 여기겠지."`},
  {t:`choice`, id:`C2`, kind:`talk`, label:`마릴라 아주머니의 꾸중`, f:`anne_sad`, o:`marilla_strict`,
   q:{e:`마릴라 아주머니가 화가 나셨어요. 앤은 뭐라고 말할까요?`, l:`꾸중하는 마릴라 앞에서, 앤은 무슨 말을 할까요?`},
   note:{e:`원작의 앤은 눈물을 글썽이며 "저는 아주머니께 골칫거리일 뿐이에요. 차라리 고아원에 돌려보내시는 게 나을지도 몰라요"라고 말해요. 마릴라는 아이를 울린 자기 자신에게 짜증이 났대요.`,

   opts:[

  {id:`m_c`, w:`anne`, f:`anne_sad`, o:`marilla_strict`, bk:[`12-8`],
   e:`"정말 죄송해요. 아주머니가 싫어하실 줄 몰랐어요. 저는 아주머니께 골칫거리인가 봐요. 차라리 고아원에 돌려보내시는 게… 그건 너무 끔찍하겠지만요. 아마 폐병에 걸려 버릴 거예요. 보세요, 저 이렇게 말랐잖아요."`,
   l:`"아, 정말 죄송해요. 아주머니가 싫어하실 줄은 생각도 못 했어요. 저는 아주머니께 지독한 골칫거리가 될까 봐 겁나요. 차라리 고아원으로 돌려보내시는 게 나을지도 몰라요. 그건 끔찍할 거예요. 아마 폐병에 걸리고 말겠지요. 보시다시피 전 이렇게 말랐으니까요. 그래도 아주머니께 골칫거리가 되는 것보다는 나을 거예요."`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_warm`, bk:[`12-9`],
   e:`"말도 안 되는 소리! 너를 돌려보낼 생각은 조금도 없다. 다른 아이들처럼 얌전히 굴었으면 하는 것뿐이야. 자, 그만 울어라."`,

  {t:`goto`, to:`m_m`},
  {id:`m_i`, w:`anne`, f:`anne_dreamy`, o:`marilla_strict`, fx:`dream`, cam:`up`,

  {w:`marilla`, f:`anne_dreamy`, o:`marilla_strict`,

  {w:`anne`, in:1, f:`anne_surprised`, o:`marilla_strict`,

   l:`아주머니의 얼굴은 여전히 굳어 있었지만, 이상하게도 목소리는 한결 누그러져 있었다.`},

  {w:`marilla`, f:`anne_happy`, o:`marilla_warm`,

  {id:`m_m`, w:`marilla`, f:`anne_surprised`, o:`marilla_warm`, bk:[`12-9`], cam:`in`,
   e:`"그건 그렇고, 너한테 들려줄 소식이 있다. 다이애나 배리가 오늘 집에 돌아왔단다. 배리 부인한테 치마 본을 빌리러 갈 건데, 같이 가서 다이애나랑 인사하겠니?"`,
   l:`"그건 그렇고, 너한테 들려줄 소식이 있다. 다이애나 배리가 오늘 오후에 집에 돌아왔다더구나. 배리 부인한테 치마 본을 빌리러 갈 건데, 원한다면 같이 가서 다이애나와 인사를 나눠도 좋다."`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`marilla_warm`, bk:[`12-10`], cam:`shake`,

   l:`다이애나! 초록 지붕 집에 온 날부터 마음의 친구가 되기를 꿈꾸던 바로 그 아이! 나는 두 손을 맞잡고 벌떡 일어섰다. 꿰매던 행주가 바닥으로 스르르 미끄러졌다.`},
  {w:`anne`, f:`anne_surprised`, o:`marilla_warm`, bk:[`12-11`],
   e:`"아, 아주머니, 무서워요. 막상 그때가 오니까 정말 무서워요. 다이애나가 저를 안 좋아하면 어떡하죠? 그건 제 인생 최고로 비극적인 실망일 거예요!"`,
   l:`"아, 마릴라 아주머니, 무서워요. 막상 그때가 오니 정말로 무서워요. 다이애나가 절 좋아하지 않으면 어떡하죠! 그건 제 인생에서 가장 비극적인 실망이 될 거예요."`},
  {w:`marilla`, f:`anne_surprised`, o:`marilla_strict`, bk:[`12-12`],
   e:`"호들갑 떨지 마라. 그리고 제발 그렇게 어려운 말 좀 쓰지 마. 다이애나는 널 좋아할 거다. 걱정할 사람은 그 애 어머니야. 얌전하게 굴고, 사람 놀라게 하는 말은 하지 말거라."`,
   l:`"자, 호들갑 떨지 마라. 그리고 제발 그런 긴 낱말 좀 쓰지 말았으면 좋겠구나. 다이애나는 널 충분히 좋아할 거다. 신경 써야 할 사람은 그 애 어머니야. 그 부인이 널 싫어하면 다이애나가 아무리 좋아해도 소용없어. 예의 바르고 얌전하게 굴어야 한다. 사람 놀라게 하는 말은 하지 말고."`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`, when:s => s.flags.quiet,

   l:`"린드 부인 앞에서 네가 떨면서도 할 말은 다 했다는 이야기가 벌써 동네에 퍼졌을지도 모른다. 오늘만큼은 말을 아끼거라."`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`, when:s => !s.flags.quiet,
   e:`"네가 린드 부인한테 소리친 일을 배리 부인이 들었다면… 뭐라고 생각할지 모르겠구나. 아이고, 얘가 정말 떨고 있네!"`,
   l:`"네가 린드 부인한테 성질부린 일을 배리 부인이 들었다면 너를 어떻게 생각할지 모르겠구나. 아이고, 이 애가 정말로 떨고 있잖아!"`},

   l:`부엌문으로 나온 배리 부인은 키가 크고 눈과 머리카락이 까맸으며, 입매가 무척 단호했다. 아이들에게 엄하기로 소문난 분이었다. "어서 들어와요, 마릴라. 이 아이가 데려다 키운다는 그 여자아이인가 보군요?" "네, 앤 셜리예요."`},

  {w:`barry`, f:`anne_surprised`, o:`barry`, bk:[`12-19`,`12-20`],

  {w:`barry`, f:`anne_happy`, o:`barry`, bk:[`12-23`],

  {w:`anne`, f:`anne_dreamy`, o:`diana`, bk:[`12-36`],

   l:`집으로 돌아갈 때 다이애나는 통나무 다리까지 따라 나왔다. 우리는 서로의 허리에 팔을 두르고 걸었다. 시냇가에 이르러, 내일 오후를 함께 보내자는 약속을 몇 번이고 주고받으며 헤어졌다.`},

  {w:`anne`, f:`anne_happy`, o:`marilla_strict`, bk:[`12-41`], cam:`in`,
   e:`"네! 아주머니, 저는 지금 이 순간 프린스 에드워드 섬에서 제일 행복한 아이예요! 다이애나랑 내일 '{together}' 하기로 했어요. 그리고 다이애나가 책도 빌려주고, 노래도 가르쳐 주고, 예쁜 그림도 준대요!"`,
   l:`"아, 네." 나는 행복에 겨워 한숨처럼 대답했다. 아주머니의 말에 섞인 비꼬는 기색 따위는 알아차리지도 못했다. "마릴라 아주머니, 저는 지금 이 순간 프린스 에드워드 섬에서 제일 행복한 아이예요. 다이애나랑 내일 '{together}' 하기로 했어요. 다이애나가 책도 빌려주고, '개암나무 골짜기의 넬리'라는 노래도 가르쳐 주고, 연한 파란 비단 드레스를 입은 아가씨 그림도 준대요!"`},
  {w:`anne`, f:`anne_dreamy`, o:`marilla_strict`, bk:[`12-41`],
   e:`"다이애나 생일은 2월이고 제 생일은 3월이에요. 신기한 우연이죠? 그리고 통나무 다리 아래 샘은 '{spring}'{spring|이라고} 부르기로 했어요. 근사한 이름이죠? 아, 저도 다이애나한테 뭔가 줄 게 있으면 좋을 텐데."`,
   l:`"다이애나 생일은 2월이고 제 생일은 3월이에요. 정말 신기한 우연 같지 않아요? 통나무 다리 아래 샘은 '{spring}'{spring|이라고} 부르기로 했어요. 정말 우아한 이름이지 않아요? 아, 저도 다이애나에게 뭔가 줄 것이 있으면 좋을 텐데요."`},
  {w:`marilla`, f:`anne_happy`, o:`marilla_strict`, bk:[`12-42`],

   l:`"글쎄, 네가 다이애나를 말로 질리게 하지만 않으면 좋겠구나. 하지만 앤, 계획을 세울 땐 이것만은 기억해라. 너는 놀기만 하는 게 아니다. 네가 할 일이 있으니 그것부터 해야 한다."`},
  {bg:`ch2`, w:`anne`, in:1, f:`anne_surprised`, o:`matthew`, bk:[`12-43`,`12-44`], cam:`in`,
   e:`행복이 잔에 가득 찼는데, 매슈 아저씨가 그걸 넘치게 만드셨어. 카모디 가게에 다녀오신 아저씨가 쑥스러워하며 주머니에서 작은 꾸러미를 꺼내셨거든. "네가 초콜릿 사탕을 좋아한다길래 좀 사 왔다."`,
   l:`내 행복의 잔은 이미 가득 차 있었는데, 매슈 아저씨가 그 잔을 넘치게 만들었다. 카모디 가게에 다녀온 아저씨가 마릴라 아주머니의 눈치를 살피며 주머니에서 작은 꾸러미를 꺼낸 것이다. "네가 초콜릿 사탕을 좋아한다고 하길래 좀 사 왔다."`},
  {w:`marilla`, f:`anne_surprised`, o:`marilla_strict`, bk:[`12-45`],
   e:`"흥, 이가 썩고 배탈 나겠네. 아이고, 그렇게 시무룩한 얼굴 하지 마라. 매슈가 사 왔으니 먹어도 된다. 한꺼번에 다 먹지만 말거라."`,

  {w:`diana`, f:`anne_happy`, o:`diana`, bk:[`15-2`,`15-3`],
   e:`"큰길보다 이 길이 훨씬 좋지. 거긴 덥고 먼지투성이거든." 다이애나는 점심 바구니 속 산딸기 파이 세 개를 여자애 열 명이 나누면 몇 입씩일지 세어 보고 있었어.`,
   l:`"큰길로 돌아가는 것보다 훨씬 낫지. 거긴 먼지투성이에 덥거든." 다이애나는 현실적으로 대꾸하며, 바구니 속 산딸기 파이 세 개를 여자애 열 명이 나누면 몇 입씩 돌아갈지 속으로 셈하고 있었다.`},
  {w:`anne`, in:1, f:`anne_dreamy`, o:`diana`, bk:[`15-4`,`15-5`,`15-7`,`15-8`],
   e:`우리가 학교에 가는 길은 정말 아름다워. 연인의 오솔길을 지나, '{spring}'에서 다이애나를 만나고, 버드나무 연못을 지나면, 앤드루 벨 아저씨네 숲 그늘에 폭 파인 작은 초록 골짜기가 나와. 봄이면 제비꽃이 수백만 송이 핀대!`,
   l:`우리가 학교에 가는 길은 상상력으로도 더 낫게 만들 수 없을 만큼 아름다웠다. 연인의 오솔길을 내려가 '{spring}' 근처에서 다이애나를 만나고, 버드나무 연못을 지나면, 앤드루 벨 씨네 숲 그늘에 초록 보조개처럼 폭 파인 골짜기가 나타났다. 봄이면 제비꽃이 수백만 송이 핀다고 했다.`},
  {t:`name`, id:`N5`, key:`vale`, canon:`제비꽃 골짜기`, max:14, label:`숲 그늘의 작은 골짜기`, f:`anne_dreamy`, o:`diana`,
   q:{e:`✍️ 봄이면 제비꽃이 가득 피는 작은 초록 골짜기. 앤이 되어 이름을 지어 주세요!`, l:`✍️ 숲 그늘에 폭 파인 작은 초록 골짜기. 앤처럼 이름을 붙여 주세요.`},
   ph:`예: 보랏빛 요람`,
   note:{e:`원작의 앤은 이곳을 '제비꽃 골짜기'라고 이름 지어요. 다이애나는 장소에 멋진 이름 붙이는 데는 앤을 따라올 사람이 없다고 감탄하지요. 대신 '자작나무 길'은 다이애나가 지었대요.`,
         l:`원작에서 앤은 이곳을 '제비꽃 골짜기(Violet Vale)'라 부릅니다. 다이애나는 이름 짓기에서 앤을 당할 사람이 없다고 감탄하지요. 반면 '자작나무 길'은 다이애나의 작품인데, 앤은 속으로 더 시적인 이름을 찾을 수 있었을 거라 생각합니다.`}},
  {w:`diana`, f:`anne_happy`, o:`diana`,
   e:`"'{vale}'! 역시 이름 짓는 데는 너를 따라올 사람이 없어. 그 대신 이 자작나무 길은 내가 지은 거 잊지 마!"`,
   l:`"'{vale}'! 역시 장소에 이름 붙이는 데는 너를 당할 사람이 없어. 대신 이 자작나무 길은 내가 지은 거 잊지 마."`},
  {w:`anne`, in:1, f:`anne_dreamy`, o:`diana`, bk:[`15-8`],
   e:`'자작나무 길'은 좀 평범한 이름이지만… 이 길은 세상에서 제일 아름다운 곳 중 하나야. 하얀 자작나무 사이로 햇빛이 에메랄드처럼 걸러져 내려오거든.`,
   l:`'자작나무 길'은 누구라도 떠올릴 법한 이름이었지만, 이 길만큼은 세상에서 가장 아름다운 곳 가운데 하나였다. 하얀 자작나무 사이로 햇빛이 겹겹의 에메랄드 가리개를 지나 다이아몬드의 한가운데처럼 맑게 내려왔다.`},
  /* ---------- 길버트 이야기 ---------- */
  {w:`diana`, f:`anne_surprised`, o:`diana`, bk:[`15-17`,`15-18`], cam:`right`,
   e:`"오늘 길버트 블라이스가 학교에 올 거야. 여름 내내 사촌네 갔다가 돌아왔거든. 엄청 잘생겼어, 앤. 그리고 여자애들을 지독하게 놀려." 다이애나는 그게 싫지만은 않은 말투였어.`,
   l:`"오늘 길버트 블라이스가 학교에 올 것 같아. 여름 내내 뉴브런즈윅 사촌네 있다가 토요일 밤에야 돌아왔거든. 걘 엄청 잘생겼어, 앤. 그리고 여자애들을 지독하게 놀려." 그렇게 시달리는 게 오히려 싫지 않은 눈치였다.`},
  {w:`diana`, f:`anne_surprised`, o:`diana`, bk:[`15-25`],
   e:`"그리고 길버트는 늘 반에서 1등이었어. 이제부터는 1등 지키기가 쉽지 않을걸?"`,
   l:`"그리고 이제 길버트가 너희 반에 들어올 거야. 분명히 말하는데, 길버트는 늘 1등을 해 왔어. 이제부터는 1등 자리 지키기가 그렇게 쉽지 않을걸, 앤."`},
  {t:`choice`, id:`C1`, kind:`talk`, label:`길버트 블라이스라는 아이`, f:`anne_surprised`, o:`diana`,
   q:{e:`다이애나가 길버트 이야기를 해요. 앤은 뭐라고 대답할까요?`, l:`아직 만나 보지 못한 길버트 블라이스. 앤은 그에 대해 뭐라고 말할까요?`},
   note:{e:`원작의 앤은 "잘됐다! 꼬마들 사이에서 1등 하는 건 별로 자랑스럽지 않았거든"이라고 해요. 앤은 남과 겨루는 걸 은근히 좋아하는 아이였지요. 이 대화가 앞으로 길고 긴 1등 경쟁의 시작이 된답니다.`,
         l:`원작에서 앤은 "잘됐다. 아홉 살, 열 살짜리 꼬마들 사이에서 1등 하는 건 별로 자랑스럽지 않았다"고 응수합니다. 승부욕 강한 앤의 성격이 드러나는 이 대답은, 앞으로 길버트와 이어질 긴 경쟁의 첫 신호이기도 합니다.`},
   opts:[
    {type:`canon`, go:`r_c`, eff:{flag:`rival`}, e:`"잘됐다! 꼬마들 사이에서 1등 하는 건 별로 자랑스럽지 않았거든."`, l:`"잘됐다. 꼬마들 사이에서 1등 하는 건 별로 자랑스럽지 않았거든."`, s:{e:`잘됐다, 겨뤄 보겠다고 했다`, l:`경쟁을 반겼다`}},
    {type:`imag`, go:`r_i`, eff:{flag:`knight`}, e:`"길버트 블라이스… 이름이 꼭 소설 속 기사 같아! 여름 내내 용을 물리치러 다녀온 게 분명해."`, l:`"길버트 블라이스… 이름이 꼭 기사 소설의 주인공 같아. 여름 내내 먼 나라에서 용과 싸우고 온 게 틀림없어."`, s:{e:`소설 속 기사 같다고 상상했다`, l:`기사 소설의 주인공을 상상했다`}},
    {type:`bal`, go:`r_b`, eff:{flag:`fair`}, e:`"놀리는 건 나쁜 버릇이야. 하지만 직접 만나 보기 전엔 어떤 애인지 판단하지 않을래."`, l:`"남을 놀리는 건 나쁜 버릇이야. 그래도 직접 만나 보기 전에는 어떤 아이인지 판단하지 않을래."`, s:{e:`직접 만나 보고 판단하겠다고 했다`, l:`만나 보고 판단하기로 했다`}}
   ]},
  {id:`r_c`, w:`anne`, f:`anne_happy`, o:`diana`, bk:[`15-26`], eff:{album:`rival`},
   e:`"잘됐다! 고작 아홉 살, 열 살 꼬마들 사이에서 1등 하는 건 별로 자랑스럽지 않았거든. 어제는 조시 파이가 책을 몰래 훔쳐봤는데, 내가 얼음장 같은 눈길을 휙 보냈더니 결국 철자를 틀리더라!"`,
   l:`"잘됐다. 고작 아홉 살, 열 살짜리 꼬마들 사이에서 1등을 지키는 건 별로 자랑스럽지 않았거든. 어제 조시 파이가 책을 몰래 훔쳐봤는데, 내가 얼음장 같은 경멸의 눈길을 휙 보내 줬더니 홍당무처럼 빨개져서 결국 철자를 틀리더라."`},
  {t:`goto`, to:`r_m`},
  {id:`r_i`, w:`anne`, f:`anne_dreamy`, o:`diana`, fx:`dream`, cam:`up`, eff:{album:`knight`},
   e:`"길버트 블라이스… 이름이 꼭 소설 속 기사 같아! 분명 여름 내내 먼 나라에서 용을 물리치고, 은빛 갑옷을 입고 돌아왔을 거야."`,
   l:`"길버트 블라이스… 이름부터 기사 소설의 주인공 같아. 분명 여름 내내 머나먼 나라에서 용과 싸우다가, 은빛 갑옷을 번쩍이며 돌아왔을 거야."`},
  {w:`diana`, f:`anne_dreamy`, o:`diana`, fx:`dream`,
   e:`다이애나가 까르르 웃었어. "용은 무슨! 뉴브런즈윅 사촌 집에 갔다 왔대. 그리고 걘 기사가 아니라 장난꾸러기야."`,
   l:`다이애나가 까르르 웃었다. "용은 무슨! 뉴브런즈윅 사촌네 다녀온 거야. 게다가 걘 기사가 아니라 장난꾸러기라니까."`},
  {t:`goto`, to:`r_m`},
  {id:`r_b`, w:`anne`, f:`anne_happy`, o:`diana`, eff:{album:`fair`},
   e:`"놀리는 건 나쁜 버릇이야. 하지만 다른 사람 말만 듣고 미리 판단하는 것도 좋지 않잖아. 직접 만나 보고 생각할래."`,
   l:`"남을 놀리는 건 나쁜 버릇이야. 하지만 남의 말만 듣고 미리 판단하는 것도 공평하지 않잖아. 직접 만나 보고 생각할래."`},
  {id:`r_m`, w:`anne`, f:`anne_sad`, o:`diana`, bk:[`15-20`],
   e:`"그런데 주근깨 얘기는 하지 마. 주근깨가 이렇게 많은 사람 앞에서 그건 예의가 아니야."`,
   l:`"그런데 나한테 주근깨 이야기는 하지 마. 주근깨가 이렇게 많은 사람 앞에서 그건 예의가 아니야."`},
  /* ---------- 교실 ---------- */
  {bg:`ch4`, w:`anne`, in:1, f:`anne_surprised`, o:`diana`, bk:[`15-9`,`15-28`,`15-29`], cam:`in`,
   e:`하얗게 칠한 우리 학교. 책상 뚜껑마다 옛날 학생들이 새긴 이름이 가득해. 필립스 선생님이 뒤쪽에서 프리시 언니의 라틴어를 봐 주는 사이, 다이애나가 속삭였어. "저기 통로 건너편이 길버트야. 잘생겼지?"`,
   l:`하얗게 회칠을 한 에이번리 학교. 책상 뚜껑마다 3대에 걸친 학생들의 머리글자가 빼곡했다. 필립스 선생님이 교실 뒤쪽에서 프리시 앤드루스의 라틴어를 봐 주는 사이, 다이애나가 속삭였다. "통로 건너 바로 네 옆에 앉은 애가 길버트 블라이스야. 잘생기지 않았니?"`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`gilbert`, bk:[`15-30`], cam:`right`, eff:{met:`gilbert`},
   e:`길버트는 앞자리 루비의 노란 머리채를 몰래 의자에 핀으로 꽂고 있었어. 키가 크고, 갈색 곱슬머리에, 장난기 가득한 눈. 루비가 일어서다 "꺅!" 하고 넘어지자, 길버트는 시치미를 뚝 떼고 있다가… 나를 보고 윙크했어!`,
   l:`길버트 블라이스는 앞자리 루비 길리스의 노란 머리채를 의자 등받이에 몰래 핀으로 꽂고 있었다. 키가 크고, 갈색 곱슬머리에, 장난기 어린 담갈색 눈. 루비가 일어서다 비명을 지르며 주저앉자, 길버트는 세상에서 제일 진지한 얼굴로 역사책을 보고 있다가… 나를 향해 익살맞게 윙크했다.`},
  {w:`anne`, f:`anne_angry`, o:`diana`, bk:[`15-31`], when:s => !s.flags.knight,
   e:`"너희 길버트, 잘생기긴 했네." 내가 다이애나에게 소곤거렸어. "그런데 아주 뻔뻔해. 처음 보는 여자애한테 윙크하는 건 예의가 아니야."`,
   l:`"너희 길버트 블라이스, 잘생기긴 했네." 나는 다이애나에게 털어놓았다. "그런데 아주 뻔뻔한 것 같아. 처음 보는 여자애한테 윙크하는 건 예의가 아니야."`},
  {w:`anne`, f:`anne_angry`, o:`diana`, when:s => s.flags.knight,
   e:`"기사는 무슨!" 내가 다이애나에게 소곤거렸어. "기사는 숙녀 머리를 의자에 꽂지 않아. 게다가 처음 보는 여자애한테 윙크라니, 정말 뻔뻔해!"`,
   l:`"기사는 무슨." 나는 다이애나에게 속삭였다. "기사는 숙녀의 머리채를 의자에 꽂지 않아. 처음 보는 여자애한테 윙크하는 것도 기사도와는 거리가 멀고."`},
  {w:`anne`, in:1, f:`anne_dreamy`, bk:[`15-32`,`15-33`], cam:`up`,
   e:`오후가 되었어. 선생님은 구석에서 프리시 언니에게 문제를 설명하고 계셨고, 아이들은 풋사과를 먹거나 귀뚜라미를 실에 매어 몰고 다녔어. 나는 턱을 괴고 창밖으로 보이는 '{pond}'를 바라보며 꿈나라를 여행하고 있었지.`,
   l:`오후였다. 선생님은 구석에서 프리시에게 대수 문제를 설명하고 있었고, 아이들은 풋사과를 먹고 소곤거리고, 실로 맨 귀뚜라미를 통로에서 몰고 다녔다. 나는 두 손으로 턱을 괴고 서쪽 창 너머 파랗게 빛나는 '{pond}'에 눈을 고정한 채, 화려한 꿈나라 저 멀리를 거닐고 있었다.`},
  {w:`gilbert`, f:`anne_dreamy`, o:`gilbert`, bk:[`15-34`,`15-35`,`15-36`], cam:`right`,
   e:`그때 누가 내 땋은 머리 끝을 홱 잡아 올렸어. 그리고 날카롭게 속삭였어. "홍당무! 홍당무!"`,
   l:`그때였다. 통로 너머로 뻗어 온 손이 내 기다란 빨간 머리채 끝을 집어 들어 올렸다. 그리고 날카로운 속삭임. "홍당무! 홍당무!"`},
  {w:`anne`, f:`anne_angry`, o:`gilbert`, bk:[`15-37`,`15-38`], cam:`shake`,
   e:`나는 벌떡 일어났어. 아름다운 꿈은 와르르 무너졌고, 화가 나서 눈에서 불꽃이 튀다가… 분한 눈물이 차올랐어.`,
   l:`나는 벌떡 일어섰다. 찬란하던 공상은 산산이 부서져 다시는 되살릴 수 없었다. 나는 성난 눈빛을 길버트에게 쏘아 보냈고, 그 불꽃은 곧 그만큼 분한 눈물에 꺼져 들었다.`},
  {w:`anne`, f:`anne_angry`, o:`gilbert`, bk:[`15-39`], b:`"이 비열하고 못된 녀석! 네가 감히!"`},
  {t:`choice`, id:`C2`, kind:`act`, label:`"홍당무!"라는 말을 들은 순간`, f:`anne_angry`, o:`gilbert`,
   q:{e:`"홍당무!" 길버트가 앤을 놀렸어요. 앤은 어떻게 할까요?`, l:`"홍당무!" 가장 아픈 곳을 찔린 앤. 이 순간 앤은 어떻게 할까요?`},
   note:{e:`원작의 앤은 석판으로 길버트의 머리를 "퍽!" 내리쳤어요. 석판이 쩍 갈라졌대요. (머리 말고 석판이요!) 그 일로 앤은 오후 내내 칠판 앞에 서 있는 벌을 받아요.`,
         l:`원작에서 앤은 석판으로 길버트의 머리를 내리쳐 석판을 두 동강 냅니다. 작가는 "석판이, 머리 말고 석판이"라고 짓궂게 덧붙이지요. 길버트는 "제 잘못"이라고 나서지만, 선생님은 앤에게만 벌을 줍니다.`},
   opts:[

    {type:`imag`, go:`h_i`, eff:{item:`slate`, flag:`slam`}, e:`나는 불을 뿜는 용이라고 상상하며, 석판을 내 책상에 "쾅!" 내리쳐 버린다.`, l:`불을 뿜는 성난 용이 되었다고 상상하며, 석판을 제 책상에 힘껏 내리친다.`, s:{e:`용이 되어 석판을 책상에 내리쳤다`, l:`용처럼 석판을 책상에 내리쳤다`}},

  {id:`h_c`, w:`anne`, f:`anne_angry`, o:`gilbert`, bk:[`15-40`,`15-41`], cam:`shake`,
   e:`퍽! 나는 석판으로 길버트의 머리를 내리쳤어. 석판이 쩍 갈라졌어. 머리 말고 석판이! 교실 전체가 "어머!" 하고 소리쳤고, 루비는 울음을 터뜨렸고, 토미는 귀뚜라미를 몽땅 놓쳐 버렸어.`,
   l:`퍽! 내 석판이 길버트의 머리 위로 떨어졌고, 석판은, 머리가 아니라 석판은, 한가운데가 쩍 갈라졌다. 언제나 구경거리를 즐기는 에이번리 학교가 겁에 질리면서도 신이 나서 "어머!" 하고 외쳤다. 다이애나는 숨을 삼켰고, 루비 길리스는 울음을 터뜨렸고, 토미 슬론은 귀뚜라미 마차를 몽땅 놓쳐 버렸다.`},
  {t:`goto`, to:`h_m`},
  {id:`h_i`, w:`anne`, f:`anne_angry`, o:`gilbert`, fx:`dream`, cam:`up`, eff:{album:`dragon`},
   e:`그 순간 나는 불을 뿜는 용이 됐어! 콧김에서 불꽃이 튀고, 비늘이 빨갛게 번쩍였지. 용은 꼬리를 휘둘러… 석판을 내 책상에 "쾅!" 내리쳤어.`,
   l:`그 순간 나는 불을 뿜는 용이었다. 콧김에서 불꽃이 튀고, 붉은 비늘이 노을처럼 번쩍였다. 용은 꼬리를 휘둘러… 석판을 제 책상 위에 힘껏 내리쳤다.`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`gilbert`, cam:`shake`,
   e:`쾅! 석판이 쩍 갈라졌어. 정신을 차려 보니 나는 용이 아니라, 교실 한가운데 서서 씩씩거리는 빨간 머리 여자애였어. 교실 전체가 "어머!" 하고 나를 쳐다봤어.`,
   l:`쾅! 석판이 두 동강 났다. 정신을 차려 보니 나는 용이 아니라, 교실 한가운데서 씩씩대는 빨간 머리 소녀일 뿐이었다. 모든 눈이 "어머!" 하는 탄성과 함께 내게 쏠렸다.`},
  {t:`goto`, to:`h_m`},
  {id:`h_b`, w:`anne`, f:`anne_angry`, o:`gilbert`, cam:`in`, eff:{album:`sayIt`},
   e:`나는 석판을 꽉 쥔 손을 천천히 내렸어. 그리고 온 교실이 다 들리게 또박또박 말했어. "내 머리로 놀리지 마. 당장 사과해!"`,
   l:`석판을 움켜쥔 손을 천천히 내렸다. 그리고 온 교실이 다 듣도록 또박또박 말했다. "내 머리로 놀리지 마. 당장 사과해!"`},
  {w:`gilbert`, f:`anne_angry`, o:`gilbert`,
   e:`길버트가 눈을 동그랗게 떴어. 교실이 쥐 죽은 듯 조용해졌다가, 곧 웅성웅성 난리가 났어.`,
   l:`길버트의 눈이 휘둥그레졌다. 교실은 쥐 죽은 듯 고요해졌다가, 이내 와글와글 소란스러워졌다.`},
  {id:`h_m`, w:`phillips`, f:`anne_angry`, o:`phillips`, bk:[`15-42`,`15-43`], cam:`right`,
   e:`필립스 선생님이 성큼성큼 걸어와 내 어깨를 꽉 잡으셨어. "앤 셜리, 이게 무슨 짓이냐?"`,
   l:`필립스 선생님이 통로를 성큼성큼 걸어와 내 어깨에 묵직하게 손을 얹었다. "앤 셜리, 이게 무슨 짓이냐?"`},
  {w:`anne`, in:1, f:`anne_sad`, o:`phillips`, bk:[`15-44`],
   e:`나는 아무 대답도 할 수 없었어. 온 학교 앞에서 '홍당무'라고 불렸다고 어떻게 말해?`,
   l:`나는 아무 대답도 하지 않았다. 온 학교 앞에서 '홍당무'라고 불렸노라 고백하라는 건 사람으로서 너무 가혹한 일이었다.`},
  {w:`gilbert`, f:`anne_sad`, o:`gilbert`, bk:[`15-45`], cam:`left`, eff:{heart:{gilbert:1}},
   e:`그때 길버트가 당당하게 나섰어. "제 잘못이에요, 필립스 선생님. 제가 놀렸어요."`,
   l:`대신 당당하게 나선 것은 길버트였다. "제 잘못이에요, 필립스 선생님. 제가 놀렸어요."`},
  {w:`phillips`, f:`anne_sad`, o:`phillips`, bk:[`15-46`,`15-47`], cam:`right`,
   e:`하지만 선생님은 길버트의 말은 들은 척도 안 하셨어. "내 학생이 이런 성질을 부리다니 유감이구나. 앤, 오후 내내 칠판 앞에 나가 서 있어라."`,
   l:`그러나 선생님은 길버트의 말에 아무 관심도 기울이지 않았다. "내 학생이 이런 성질머리와 이런 앙심을 드러내다니 유감이구나. 앤, 오늘 오후 내내 칠판 앞 교단에 나가 서 있어라."`},
  {w:`phillips`, f:`anne_sad`, o:`phillips`, when:s => s.flags.spoke,
   e:`"수업 시간에 소리를 지르는 것도 성질을 못 다스린 거다."`,
   l:`"수업 중에 소리를 지르는 것 역시 성질을 다스리지 못한 것이다."`},
  {w:`anne`, in:1, f:`anne_angry`, o:`phillips`, bk:[`15-48`,`15-49`], cam:`in`,
   e:`선생님은 내 머리 위 칠판에 이렇게 쓰셨어. "앤 셜리(Ann Shirley)는 성질이 아주 나쁘다. 앤 셜리는 성질을 다스리는 법을 배워야 한다." 그리고 1학년 꼬마들까지 알아듣게 소리 내어 읽으셨어.`,
   l:`선생님은 분필을 들어 내 머리 위 칠판에 썼다. "앤 셜리(Ann Shirley)는 성질이 아주 나쁘다. 앤 셜리는 성질을 다스리는 법을 배워야 한다." 그리고 글씨를 못 읽는 1학년 꼬마들까지 알아듣도록 소리 내어 읽었다.`},
  {w:`anne`, in:1, f:`anne_angry`, bk:[`15-50`],
   e:`나는 울지도, 고개를 숙이지도 않았어. 화가 너무 뜨거워서 오히려 버틸 수 있었어. 다시는 길버트 블라이스를 쳐다보지 않을 거야! 다시는 말도 안 할 거야!`,
   l:`나는 울지도 고개를 숙이지도 않았다. 가슴속 분노가 아직 너무 뜨거웠고, 바로 그 분노가 끔찍한 굴욕 속에서 나를 버티게 했다. 길버트 블라이스는 쳐다보지도 않았다. 다시는 그 애를 쳐다보지 않을 거야! 다시는 그 애와 말도 하지 않을 거야!`},

   l:`수업이 끝나자 길버트가 현관문에서 나를 가로막았다. "네 머리를 놀려서 정말 미안해, 앤." 뉘우치는 속삭임이었다. "진심이야. 이제 그만 화 풀어, 응?"`},

   note:{e:`원작의 앤은 쳐다보지도 않고 쌀쌀맞게 지나쳐 버려요. "나는 길버트 블라이스를 절대 용서하지 않을 거야!" 이 결심은 아주아주 오래 이어진답니다.`,

  {w:`diana`, f:`anne_angry`, o:`diana`, bk:[`15-53`,`15-54`],
   e:`"아, 어떻게 그럴 수가 있어, 앤?" 다이애나가 반쯤은 나무라듯, 반쯤은 감탄하듯 말했어. "나는 절대 저 부탁은 못 뿌리칠 거야." "나는 길버트 블라이스를 절대 용서하지 않을 거야."`,
   l:`"아, 어떻게 그럴 수가 있어, 앤?" 다이애나가 반은 나무라듯, 반은 감탄하듯 숨죽여 말했다. 다이애나라면 길버트의 부탁을 절대 뿌리치지 못했으리라. "나는 길버트 블라이스를 절대 용서하지 않을 거야." 내가 단호하게 말했다.`},

  {w:`gilbert`, f:`anne_dreamy`, o:`gilbert`, fx:`dream`,

   l:`길버트는 잠시 멍하니 서 있다가 피식 웃었다. "별 백 개라… 알았어. 하나씩 세어 보지, 뭐."`},
  {w:`diana`, f:`anne_happy`, o:`diana`,
   e:`"앤! 너 정말 별나다! 길버트한테 그런 말 한 애는 네가 처음일 거야!" 다이애나가 감탄했어.`,
   l:`"앤, 너 정말 별나다. 길버트에게 그런 말을 한 애는 네가 처음일 거야." 다이애나가 반쯤 감탄하며 말했다.`},

  {w:`gilbert`, f:`anne_sad`, o:`gilbert`,

   e:`"게다가 선생님은 내 이름을 e도 없이 썼어. 쇠붙이가 내 영혼에 박혔어, 다이애나." "길버트는 나도 까마귀라고 놀려." "까마귀랑 홍당무는 하늘과 땅 차이야!"`,
   l:`"게다가 필립스 선생님은 내 이름을 e도 없이 썼어. 쇠붙이가 내 영혼에 박혔어, 다이애나." 다이애나는 무슨 뜻인지 몰랐지만 끔찍한 일이라는 것만은 알아들었다. "길버트는 나도 까마귀라고 놀려." "까마귀라고 불리는 것과 홍당무라고 불리는 건 하늘과 땅 차이야."`},

  {bg:`ch4_spruce`, w:`anne`, in:1, f:`anne_happy`, bk:[`15-58`,`15-59`,`15-60`], cam:`out`,
   e:`다음 날 점심시간. 선생님은 늦게 오는 사람은 벌을 주겠다고 하셨어. 하지만 아이들은 여느 때처럼 벨 아저씨네 가문비나무 숲에 송진 껌을 따러 갔어.`,
   l:`이튿날, 필립스 선생님은 발작처럼 찾아오는 개혁의 열정에 사로잡혀 선언했다. 자기가 돌아왔을 때 자리에 없는 학생은 벌을 받으리라고. 그러나 아이들은 여느 때처럼 벨 씨네 가문비나무 숲으로 송진 껌을 따러 갔다.`},
  {w:`anne`, in:1, f:`anne_dreamy`, bk:[`15-62`], fx:`dream`, cam:`up`, eff:{item:`ricelily`},
   e:`나는 껌은 따지 않고, 숲 저편 허리까지 오는 고사리 사이를 거닐며 혼자 노래를 불렀어. 머리에는 하얀 쌀백합 화관을 쓰고. 꼭 그늘진 숲의 여신이 된 것 같았어.`,
   l:`나는 송진을 따는 대신 숲 저편 끝에서 허리까지 오는 고사리 사이를 거닐며 나직이 노래했다. 머리에는 쌀백합 화관을 쓰고, 마치 그늘진 곳에 사는 숲의 여신처럼.`},
  {w:`anne`, in:1, f:`anne_surprised`, when:s => s.flags.wreath,
   e:`또 머리에 꽃을… 마릴라 아주머니가 아시면 뭐라고 하실까? 그래도 숲속엔 보는 사람이 없으니까 괜찮겠지.`,
   l:`또 머리에 꽃이라니, 마릴라 아주머니가 아시면 뭐라 하실까. 그래도 숲속엔 보는 눈이 없으니 괜찮으리라.`},
  {w:`jimmy`, f:`anne_surprised`, bk:[`15-61`], cam:`shake`, b:`"선생님 온다!"`},
  {w:`anne`, in:1, f:`anne_surprised`, bk:[`15-62`], cam:`in`,
   e:`늙은 가문비나무 꼭대기에서 지미 글로버가 외쳤어! 여자애들은 벌써 뛰어갔고, 나는 제일 늦었어. 하지만 나는 사슴처럼 빨리 달릴 수 있거든. 학교 문 앞에서 남자애들을 따라잡아, 선생님이 막 모자를 거실 때 남자애들 틈에 휩쓸려 들어갔어.`,
   l:`늙은 가문비나무 꼭대기에서 지미 글로버가 외쳤다. 땅에 있던 여자애들은 이미 출발했고, 나무에서 내려와야 했던 남자애들은 그보다 늦었고, 나는 가장 늦었다. 그러나 나는 사슴처럼 달릴 수 있었다. 문 앞에서 남자애들을 따라잡아, 선생님이 막 모자를 걸려는 순간 그 틈에 휩쓸려 교실로 들어섰다.`},
  {bg:`ch4`, w:`phillips`, f:`anne_surprised`, o:`phillips`, bk:[`15-63`,`15-64`], cam:`right`,
   e:`선생님은 열두 명을 다 벌주기는 귀찮으셨나 봐. 대신 헐떡거리며 앉은 나를 보셨어. 쌀백합 화관이 한쪽 귀에 비뚜름하게 걸려 있었지. "앤 셜리, 남자애들하고 어울리는 게 그렇게 좋으면 오늘 오후엔 실컷 어울리게 해 주마. 꽃 떼고, 길버트 블라이스 옆에 앉아라."`,
   l:`선생님은 학생 열두 명을 벌주는 수고는 하고 싶지 않았다. 하지만 체면은 세워야 했기에 희생양을 찾아 두리번거렸고, 숨을 헐떡이며 주저앉은 나를 찾아냈다. 깜빡 잊은 화관이 한쪽 귀 위로 비뚜름하게 걸려 있었다. "앤 셜리, 남자애들하고 어울리는 게 그렇게 좋은 모양이니, 오늘 오후엔 그 취향을 마음껏 즐기게 해 주마. 머리에서 그 꽃 떼고, 길버트 블라이스 옆에 가서 앉아라."`},
  {w:`diana`, f:`anne_sad`, o:`diana`, bk:[`15-65`],
   e:`남자애들이 킥킥거렸어. 다이애나가 하얗게 질린 얼굴로 내 머리에서 화관을 떼어 주고, 내 손을 꼭 잡았어.`,
   l:`남자애들이 킥킥거렸다. 다이애나가 안쓰러움에 하얗게 질린 얼굴로 내 머리에서 화관을 떼어 내고, 내 손을 꼭 쥐었다.`},
  {w:`phillips`, f:`anne_sad`, o:`phillips`, bk:[`15-66`,`15-67`,`15-68`],
   e:`"내 말 못 들었니, 앤?" "들었어요, 선생님. 하지만 진심이신 줄은 몰랐어요." "진심이고말고. 당장 시키는 대로 해."`,
   l:`"내 말 못 들었니, 앤?" "들었어요, 선생님." 나는 천천히 대답했다. "하지만 진심으로 하신 말씀인 줄은 몰랐어요." "진심이고말고." 아이들 모두가 싫어하는 그 비꼬는 말투였다. "당장 시키는 대로 해."`},
  {t:`choice`, id:`C4`, kind:`act`, label:`길버트 옆자리로`, f:`anne_angry`, o:`phillips`,

   note:{e:`원작의 앤은 잠깐 버티는 듯하다가, 어쩔 수 없다는 걸 알고 도도하게 일어나 길버트 옆에 앉아요. 그리고 책상에 팔을 괴고 얼굴을 파묻었지요. 앤에게는 세상이 끝난 것 같은 순간이었어요.`,
         l:`원작에서 앤은 잠시 거역할 듯 서 있다가, 어쩔 도리가 없음을 깨닫고 도도하게 통로를 건너 길버트 옆에 앉아 책상에 얼굴을 묻습니다. 작가는 이 장면을 앤에게 "세상의 끝"이었다고 씁니다.`},

    {type:`imag`, go:`s_i`, e:`길버트와 나 사이에 '보이지 않는 유리벽'이 있다고 상상하며 앉는다.`, l:`길버트와 자신 사이에 '보이지 않는 유리벽'을 세웠다고 상상하며 앉는다.`, s:{e:`보이지 않는 유리벽을 세웠다`, l:`상상의 유리벽을 세웠다`}},

  {id:`s_c`, w:`anne`, in:1, f:`anne_sad`, o:`gilbert`, bk:[`15-69`,`15-70`], cam:`in`,
   e:`잠깐 버텼지만 소용없었어. 나는 고개를 꼿꼿이 들고 통로를 건너가 길버트 옆에 앉았어. 그리고 책상에 얼굴을 파묻었어. 열두 명 중에 나만 벌받은 것도 억울한데, 하필 길버트 옆이라니. 세상이 끝난 것 같았어.`,
   l:`잠시 버텨 보았지만 소용없었다. 나는 도도하게 일어나 통로를 건너 길버트 블라이스 옆에 앉고는, 책상 위 팔에 얼굴을 묻었다. 똑같이 잘못한 열두 명 가운데 혼자만 벌을 받은 것도 억울한데, 남자애 옆에, 그것도 하필 길버트 블라이스 옆에. 세상의 끝이었다.`},

  {id:`s_i`, w:`anne`, in:1, f:`anne_dreamy`, o:`gilbert`, fx:`dream`, cam:`up`, eff:{album:`glassWall`},

   l:`길버트 옆에 앉으며 나는 상상했다. 우리 사이로 보이지 않는 두꺼운 유리벽이 쿵 내려앉았다고. 벽 너머의 소년은 소리도 닿지 않고 손도 미치지 않는다. 나는 유리 성에 홀로 깃든 공주였다.`},
  {w:`anne`, in:1, f:`anne_sad`, o:`gilbert`, bk:[`15-70`],
   e:`하지만 아이들이 킥킥대는 소리는 유리벽을 뚫고 들어왔어. 나는 결국 책상에 얼굴을 파묻었어.`,
   l:`그러나 아이들의 킥킥거림만은 유리벽을 뚫고 스며들었다. 나는 끝내 책상에 얼굴을 묻었다.`},

  {w:`phillips`, f:`anne_angry`, o:`phillips`,
   e:`교실이 술렁였어. 선생님 얼굴이 빨개지셨어. "말대꾸까지 하는구나. 어서 앉아!" 나는 길버트 옆에 앉았지만, 이번엔 고개를 숙이지 않았어.`,
   l:`교실이 술렁였다. 선생님의 얼굴이 붉어졌다. "말대꾸까지 하는구나. 어서 앉아!" 나는 길버트 옆에 앉았다. 하지만 이번만큼은 고개를 숙이지 않았다.`},
  {id:`s_m`, w:`anne`, in:1, f:`anne_sad`, o:`gilbert`, bk:[`15-71`], cam:``,
   e:`한참 뒤, 아무도 안 볼 때 길버트가 내 팔꿈치 아래로 뭔가를 슬쩍 밀어 넣었어. 금빛 글씨로 "너는 달콤해"라고 쓰인 작은 분홍 하트 사탕이었어.`,
   l:`한참 뒤 아무도 보지 않을 때, 길버트가 책상에서 무언가를 꺼내 내 팔꿈치 안쪽으로 슬쩍 밀어 넣었다. 금빛 글씨로 '너는 달콤해'라고 적힌 작은 분홍 하트 사탕이었다.`},

   note:{e:`원작의 앤은 사탕을 손끝으로 집어 바닥에 떨어뜨리고, 구두 뒤꿈치로 짓이겨 가루로 만들어 버려요. 그러고는 길버트에게 눈길 한 번 주지 않았대요.`,
         l:`원작에서 앤은 하트를 손끝으로 조심스럽게 집어 바닥에 떨어뜨리고, 구두 뒤꿈치로 짓이겨 가루로 만든 뒤 아무렇지 않게 원래 자세로 돌아갑니다. 길버트에게는 눈길 한 번 주지 않지요.`},

  {id:`c_c`, w:`anne`, in:1, f:`anne_angry`, o:`gilbert`, bk:[`15-71`], cam:`shake`,

  {id:`c_i`, w:`anne`, in:1, f:`anne_dreamy`, o:`gilbert`, fx:`dream`,

  {w:`anne`, in:1, f:`anne_surprised`, o:`gilbert`,

   l:`풀숲에서 참새 한 마리가 사탕을 콕콕 쪼아 댔다. 저 참새는 저주에 걸려 길버트를 용서하게 될까.`},

   l:`나는 아무 말 없이 사탕을 길버트 쪽으로 도로 밀어 놓았다. 받을 수는 없었다. 그러나 짓밟고 싶지도 않았다. 사탕에게는 아무 죄가 없었으니까.`},

   l:`길버트는 잠시 사탕을 내려다보더니 조용히 주머니에 넣었다. 그리고 다시 분수 문제로 고개를 숙였다.`},
  /* ---------- 학교를 그만두다 ---------- */
  {id:`c_m`, bg:`ch4_yard`, w:`anne`, f:`anne_angry`, o:`diana`, bk:[`15-72`,`15-73`,`15-74`], cam:`out`,
   e:`수업이 끝나자, 나는 책상 안의 물건을 몽땅 꺼내 금 간 석판 위에 쌓았어. 길에 나서자 다이애나가 물었어. "그걸 다 왜 가져가?" "나 이제 학교에 안 다닐 거야."`,
   l:`수업이 끝나자 나는 보란 듯이 책상 속 물건을 몽땅 꺼냈다. 책과 공책, 펜과 잉크, 성경과 산수책을 모두 꺼내 석판 위에 가지런히 쌓았다. 길에 나서자 다이애나가 그제야 물었다. "그걸 다 왜 집에 가져가는 거야, 앤?" "나 이제 학교에 안 다닐 거야."`},
  {w:`diana`, f:`anne_sad`, o:`diana`, bk:[`15-78`,`15-80`], eff:{item:`pansy`},
   e:`"아, 앤! 너 정말 너무해. 나는 어떡하라고? 우리 시냇가에 새 소꿉놀이 집도 짓고, 공놀이도 하고, 새 '팬지' 책도 같이 소리 내어 읽기로 했잖아. 제발 돌아와."`,
   l:`"아, 앤!" 다이애나는 금방이라도 울 것 같았다. "너 정말 너무해. 나는 어떡하라고? 선생님은 나를 그 끔찍한 거티 파이 옆에 앉힐 거야. 시냇가에 제일 예쁜 새 소꿉놀이 집도 짓고, 다음 주엔 공놀이도 하고, 새 '팬지' 책을 한 장씩 돌아가며 소리 내어 읽기로 했잖아. 너 소리 내어 읽는 거 정말 좋아하잖아. 제발 돌아와, 앤."`},
  {w:`diana`, f:`anne_sad`, o:`diana`, when:s => !!s.names.together && s.names.together !== `…`,
   e:`"우리 '{together}' 하기로 한 것도 아직 다 못 했잖아…"`,
   l:`"우리 '{together}' 하기로 한 것도 아직 다 못 했잖아…"`},
  {w:`anne`, f:`anne_sad`, o:`diana`, bk:[`15-79`], cam:`in`,
   e:`"너를 위해서라면 세상에서 거의 무슨 일이든 할 수 있어, 다이애나. 하지만 이것만은 안 돼. 제발 부탁하지 마. 내 영혼이 찢어질 것 같아."`,
   l:`"너를 위해서라면 세상에서 거의 무슨 일이든 할 수 있어, 다이애나. 너에게 도움이 된다면 내 팔다리가 갈가리 찢겨도 좋아. 하지만 이것만은 안 돼. 그러니 제발 부탁하지 마. 네가 그러면 내 영혼이 갈기갈기 찢어져."`},
  {w:`anne`, in:1, f:`anne_sad`, o:`diana`, when:s => s.flags.vow || s.flags.pinky || s.flags.lilyCrown,
   e:`'해와 달이 있는 한' 다이애나 편이 되겠다고 맹세했는데… 오늘만은 다이애나의 부탁을 들어줄 수가 없었어.`,
   l:`해와 달이 있는 한 다이애나에게 충실하겠다고 맹세했건만, 오늘만큼은 그 부탁을 들어줄 수가 없었다.`},
  /* ---------- 초록 지붕 집 ---------- */
  {bg:`ch2`, w:`marilla`, f:`anne_angry`, o:`marilla_strict`, bk:[`15-81`,`15-82`,`15-83`,`15-84`],
   e:`"말도 안 되는 소리. 내일 평소처럼 학교에 가거라." "말도 안 되는 소리가 아니에요, 아주머니. 저는 모욕을 당했어요!"`,
   l:`"말도 안 되는 소리." 마릴라 아주머니가 말했다. "전혀 말도 안 되는 소리가 아니에요." 나는 엄숙하고 원망 어린 눈으로 아주머니를 바라보았다. "모르시겠어요? 저는 모욕을 당했어요." "모욕은 무슨! 내일 평소처럼 학교에 가거라."`},
  {w:`anne`, f:`anne_sad`, o:`marilla_strict`, bk:[`15-85`],
   e:`"아니에요. 공부는 집에서 할게요. 최대한 착하게 지내고, 될 수 있으면 입도 꼭 다물게요. 하지만 학교에는 다시 안 가요."`,
   l:`"아, 아니에요." 나는 부드럽게 고개를 저었다. "저는 다시 안 가요, 아주머니. 공부는 집에서 할게요. 할 수 있는 한 착하게 굴고, 될 수만 있다면 내내 입도 다물게요. 하지만 학교에는 다시 안 가요. 정말이에요."`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`, bk:[`15-86`,`15-87`], cam:`right`,
   e:`(아주머니는 속으로 생각하셨대. '지금은 설득해 봐야 소용없겠어. 저 애는 한번 마음먹으면 지독하게 고집을 부릴 거야. 오늘 저녁에 레이첼한테 가서 상의해 봐야겠다.')`,
   l:`마릴라는 앤의 작은 얼굴에서 꺾이지 않는 고집을 보았다. '지금 앤을 설득해 봐야 소용없어. 이야기를 들어 보니 필립스 선생이 꽤 고압적으로 굴었던 것 같지만, 앤한테 그렇게 말할 수는 없지. 자식을 열이나 학교에 보낸 레이첼한테 가서 상의해 봐야겠다.'`},
  {bg:`ch2_lynde`, w:`lynde`, f:`marilla_strict`, o:`lynde`, bk:[`15-88`,`15-91`,`15-92`], cam:``,
   e:`린드 부인은 이불을 뜨고 계셨어. "학교 소동 때문에 왔지? 틸리 볼터가 다 얘기해 줬어." "레이첼, 어떻게 하면 좋겠어?"`,
   l:`린드 부인은 여느 때처럼 부지런하고 쾌활하게 이불을 뜨고 있었다. "학교에서 앤이 일으킨 소동 때문이겠지. 틸리 볼터가 들러서 다 이야기해 줬어." "저 애를 어떻게 해야 할지 모르겠어. 레이첼, 어떻게 하면 좋겠어?"`},
  {w:`lynde`, f:`marilla_strict`, o:`lynde`, bk:[`15-93`], cam:`in`,
   e:`린드 부인은 조언해 달라는 말을 제일 좋아하셨어. "내 생각엔 필립스 선생이 잘못했어. 성질부린 걸로 벌준 건 그렇다 쳐도, 늦은 다른 애들도 똑같이 벌을 받았어야지. 틸리 말로는 아이들이 다 앤 편이래. 앤이 아이들한테 꽤 인기가 있나 봐."`,
   l:`린드 부인은 누가 조언을 청하는 걸 무엇보다 좋아했다. "내가 보기엔 필립스 선생이 잘못했어. 어제 성질부린 걸로 벌준 건 잘한 일이지만, 오늘은 달랐어. 늦은 다른 애들도 앤과 똑같이 벌을 받았어야 했어. 그리고 벌로 여자애를 남자애 옆에 앉히는 건 점잖지 못한 일이야. 틸리 말로는 학생들이 다 앤 편이래. 어쩐 일인지 앤이 아이들한테 아주 인기가 좋은 모양이야."`},
  {w:`lynde`, f:`marilla_strict`, o:`lynde`, when:s => s.flags.askedFair,
   e:`"게다가 앤이 선생한테 '왜 저만 벌을 받냐'고 물었다며? 틸리가 그러는데, 그 말에 아무도 대답을 못 했대. 틀린 말이 아니었으니까."`,
   l:`"게다가 앤이 선생한테 '왜 저만 벌을 받느냐'고 물었다면서? 틸리 말로는 그 물음에 교실 누구도 토를 달지 못했대. 틀린 말이 아니었으니까."`},
  {w:`lynde`, f:`marilla_strict`, o:`lynde`, bk:[`15-95`],
   e:`"앤이 먼저 학교 얘기를 꺼낼 때까지 아무 말도 하지 마. 일주일쯤 지나면 마음이 풀려서 제 발로 학교에 가겠다고 할 거야. 틀림없어."`,
   l:`"앤이 먼저 꺼내기 전까지는 학교의 '학' 자도 꺼내지 마. 장담하는데, 일주일쯤 지나면 마음이 가라앉아서 제 발로 돌아가겠다고 할 거야. 억지로 보냈다간 또 무슨 생떼를 부릴지 누가 알겠어. 소란은 덜 피울수록 좋아."`},
  /* ---------- 가을 해 질 녘 ---------- */
  {bg:`ch2_room`, w:`anne`, in:1, f:`anne_sad`, bk:[`15-97`], cam:`out`,
   e:`그 뒤로 아무도 나한테 학교 얘기를 안 했어. 나는 집에서 공부하고, 집안일을 하고, 보랏빛 가을 저녁이면 다이애나와 놀았어. 길에서 길버트를 만나면 얼음장처럼 차갑게 지나쳤어.`,
   l:`그 뒤로 아무도 내게 학교 이야기를 꺼내지 않았다. 나는 집에서 공부하고, 집안일을 하고, 쌀쌀한 보랏빛 가을 해 질 녘이면 다이애나와 놀았다. 길에서 길버트 블라이스를 만나면 얼음장 같은 경멸을 담아 지나쳤다.`},
  {w:`anne`, in:1, f:`anne_sad`, when:s => s.flags.needTime,
   e:`길버트는 "기다릴게"라고 했었지. 정말로 기다리는 것 같았어. 그래서 더 화가 났는지도 몰라.`,
   l:`"기다릴게." 길버트는 그렇게 말했었다. 그리고 정말로 기다리는 듯했다. 그래서 오히려 더 마음이 복잡했는지도 모른다.`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`, bk:[`15-98`,`15-99`], cam:`in`,
   e:`어느 날 저녁, 사과 바구니를 들고 들어오신 아주머니가 동쪽 창가에서 혼자 엉엉 울고 있는 나를 발견하셨어. "이번엔 또 무슨 일이니, 앤?"`,
   l:`어느 날 저녁, 사과 한 바구니를 들고 과수원에서 들어온 마릴라 아주머니가 해 질 녘 동쪽 창가에서 홀로 서럽게 우는 나를 발견했다. "이번엔 또 무슨 일이니, 앤?"`},
  {t:`choice`, id:`C6`, kind:`predict`, label:`앤이 우는 까닭`, f:`anne_sad`, o:`marilla_strict`,
   q:{e:`앤은 왜 울고 있었을까요? 원작의 앤이 말한 까닭을 맞혀 보세요!`, l:`해 질 녘 창가에서 우는 앤. 원작의 앤은 무엇 때문에 울고 있었을까요?`},
   note:{e:`원작의 앤은 "다이애나가 어른이 되면 결혼해서 저를 두고 떠나 버릴 거예요!"라며 울어요. 아직 일어나지도 않은 일을 상상하며 우는 앤을 보고, 마릴라는 웃음을 참지 못하지요.`,
         l:`원작에서 앤은 먼 훗날 다이애나가 결혼해 떠나는 장면을 결혼식 들러리 드레스의 볼록한 소매까지 생생하게 상상하며 웁니다. 마릴라는 웃음을 터뜨리고 "걱정을 빌려 오려면 가까운 데서 빌려 오라"고 하지요.`},
   opts:[
    {type:`canon`, go:`w_c`, e:`"다이애나가 어른이 되면 결혼해서 저를 두고 떠나 버릴 거예요!"`, l:`"다이애나가 어른이 되면 결혼해서 저를 두고 떠나 버릴 거예요!"`, s:{e:`다이애나의 결혼을 상상하며 울었다`, l:`다이애나의 먼 결혼식을 상상해 울었다`}},
    {type:`imag`, go:`w_i`, e:`"다이애나가 마법에 걸려서 먼 나라 공주가 되어 떠나는 꿈을 꿨어요!"`, l:`"다이애나가 마법에 걸려 먼 나라의 공주가 되어 떠나는 꿈을 꾸었어요!"`, s:{e:`다이애나가 공주가 되어 떠나는 꿈 때문에`, l:`공주가 된 다이애나를 상상해 울었다`}},
    {type:`bal`, go:`w_b`, eff:{flag:`missSchool`}, e:`"학교에 안 가니까… 다이애나랑 함께 있는 시간이 너무 줄었어요."`, l:`"학교에 가지 않으니… 다이애나와 함께할 시간이 너무 줄어들었어요."`, s:{e:`다이애나와 함께할 시간이 줄어서`, l:`다이애나와의 시간이 줄어서 울었다`}}
   ]},
  {id:`w_c`, w:`anne`, f:`anne_sad`, o:`marilla_strict`, bk:[`15-100`],
   e:`"다이애나 때문이에요. 저는 다이애나 없인 못 살아요. 그런데 어른이 되면 다이애나는 결혼해서 저를 두고 떠날 거예요! 저는 다이애나 남편이 미워요. 정말 미치도록 미워요!"`,
   l:`"다이애나 때문이에요." 나는 실컷 흐느꼈다. "저는 다이애나 없이는 절대 못 살아요. 그런데 우리가 어른이 되면 다이애나는 결혼해서 저를 두고 멀리 떠나 버릴 거예요. 그럼 저는 어떡해요? 저는 다이애나 남편이 미워요. 정말 미치도록 미워요."`},
  {w:`anne`, f:`anne_dreamy`, o:`marilla_strict`, bk:[`15-100`], cam:`up`,
   e:`"다 상상해 봤어요. 다이애나는 눈처럼 하얀 드레스에 면사포를 쓰고 여왕처럼 아름다워요. 저는 신부 들러리예요. 소매가 볼록한 예쁜 드레스를 입었지만, 웃는 얼굴 뒤에 찢어지는 가슴을 숨기고… 다이애나에게 작별 인사를 해요. 안녀어어엉…"`,
   l:`"저는 다 상상해 봤어요. 결혼식이랑 모든 걸요. 다이애나는 눈처럼 새하얀 드레스에 면사포를 쓰고 여왕처럼 위엄 있어 보여요. 저는 신부 들러리예요. 소매가 볼록한 예쁜 드레스를 입었지만, 웃는 얼굴 뒤에 찢어지는 가슴을 숨기고 있어요. 그리고 다이애나에게 작별 인사를 해요, 안녀어어엉…"`},
  {t:`goto`, to:`w_m`},
  {id:`w_i`, w:`anne`, f:`anne_dreamy`, o:`marilla_strict`, fx:`dream`, cam:`up`,
   e:`"방금 꿈을 꿨어요! 다이애나가 마법에 걸려서 먼 바다 건너 왕국의 공주가 됐어요. 하얀 배를 타고 떠나는데, 저는 부두에 서서 손수건을 흔들었어요. 안녀어어엉…"`,
   l:`"방금 생생한 꿈을 꾸었어요. 다이애나가 마법에 걸려 바다 건너 왕국의 공주가 되었어요. 하얀 돛배를 타고 떠나는데, 저는 부두에 서서 손수건을 흔들었어요. 안녀어어엉…"`},
  {t:`goto`, to:`w_m`},
  {id:`w_b`, w:`anne`, f:`anne_sad`, o:`marilla_strict`,
   e:`"학교에 안 가니까… 다이애나랑 함께 있는 시간이 너무 줄었어요. 다이애나는 학교에서 '팬지' 책도 읽고 공놀이도 할 텐데, 저만 여기 있어요."`,
   l:`"학교에 가지 않으니… 다이애나와 함께할 시간이 너무 줄었어요. 다이애나는 학교에서 '팬지' 책도 읽고 공놀이도 할 텐데, 저만 여기 혼자 있어요."`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_warm`,
   e:`아주머니는 한참 나를 보시다가, 아주 조용히 말씀하셨어. "…그럼 네가 어떻게 하고 싶은지, 스스로 생각해 보려무나."`,
   l:`아주머니는 한참 나를 바라보다가 아주 조용히 말했다. "…그렇다면 네가 어떻게 하고 싶은지, 스스로 생각해 보려무나."`},
  {id:`w_m`, t:`ending`},

  /* ---------- 결말: 원작 ---------- */
  {id:`E_canon`, bg:`ch2_room`, w:`anne`, in:1, f:`anne_surprised`, o:`marilla_warm`, bk:[`15-101`], cam:`shake`, eff:{album:`e_canon`},

  {id:`p_m`, bg:`ch5`, w:`anne`, in:1, f:`anne_happy`, o:`diana`, bk:[`16-13`], cam:`out`,

   l:`우리는 처음 만난 사람들처럼 엄숙하게 악수를 나누었다. "어머님은 안녕하시니?" 그날 아침 배리 부인이 아주 건강하게 사과 따는 모습을 보았으면서도 나는 공손하게 물었다. "아주 잘 지내셔, 고마워. 커스버트 아저씨는 오늘 오후에 백합 모래톱으로 감자를 실어 나르시는 모양이지?"`},

   l:`그러나 10분도 못 가서 나는 점잔 빼는 걸 잊고 벌떡 일어났다. "과수원에 가서 빨간 달콤이 사과 따자, 다이애나. 그리고 마실 건… 손님한테 미리 말하는 건 예의가 아니니까 말 안 할게. 산딸기로 만든 새빨간 거라는 것만 알려 줄게. 새빨간 음료는 다른 색보다 두 배는 맛있잖아."`},

    {type:`bal`, go:`d_b`, eff:{flag:`tasted`}, e:`자리가 달라서 조금 이상하다고 생각하고, 내가 먼저 한 모금 맛을 본다.`, l:`자리가 다른 게 마음에 걸려, 먼저 한 모금 맛을 본다.`, s:{e:`이상해서 먼저 맛을 봤다`, l:`의심하고 먼저 맛보았다`}}
   ]},
  {id:`d_c`, w:`anne`, f:`anne_happy`, o:`diana`, bk:[`16-22`,`16-23`,`16-24`],
   e:`"자, 어서 마셔, 다이애나. 나는 사과를 너무 먹어서 지금은 안 마실래." 다이애나는 새빨간 빛깔을 감탄하며 바라보다가 얌전하게 홀짝였어. "정말 맛있는 산딸기 주스다, 앤!"`,
   l:`"자, 어서 마셔, 다이애나. 나는 사과를 그렇게 먹었더니 생각이 없네." 다이애나는 잔에 가득 따라 그 새빨간 빛깔을 감탄하며 바라보고는 얌전하게 홀짝였다. "정말 맛있는 산딸기 주스다, 앤. 산딸기 주스가 이렇게 맛있는 줄 몰랐어."`},
  {t:`goto`, to:`d_m`},
  {id:`d_i`, w:`anne`, f:`anne_dreamy`, o:`diana`, fx:`dream`, cam:`up`, eff:{album:`rubyPotion`},
   e:`"공주님, 이것은 마법의 루비 물약이옵니다! 한 모금 마시면 영원한 우정의 힘이 생기지요!" 나는 사과 때문에 배가 불러서 마시는 시늉만 하고, 다이애나에게 잔을 가득 채워 줬어.`,
   l:`"공주님, 이것은 마법의 루비 물약이옵니다. 한 모금이면 영원한 우정의 힘이 깃들지요." 나는 사과로 배가 불러 마시는 시늉만 하고, 다이애나의 잔을 가득 채워 주었다.`},
  {w:`diana`, f:`anne_dreamy`, o:`diana`, fx:`dream`,
   e:`"음, 정말 마법 같은 맛이야, 앤 여왕 폐하!" 다이애나가 잔을 높이 들었어.`,
   l:`"음, 정말 마법 같은 맛이에요, 앤 여왕 폐하!" 다이애나가 잔을 높이 들었다.`},
  {t:`goto`, to:`d_m`},
  {id:`d_b`, w:`anne`, f:`anne_surprised`, o:`diana`, eff:{album:`oddTaste`},
   e:`나는 먼저 한 모금 맛을 봤어. 음… 달콤한데 목이 뜨끈해지는 이상한 맛이었어. 하지만 나는 산딸기 주스를 마셔 본 적이 없으니, 원래 이런 맛인지도 몰랐어.`,
   l:`나는 먼저 한 모금 맛을 보았다. 달콤하면서도 목구멍이 뜨끈해지는 낯선 맛이었다. 그러나 산딸기 주스라는 걸 마셔 본 적이 없으니, 본래 이런 맛인지 알 도리가 없었다.`},
  {w:`anne`, f:`anne_surprised`, o:`diana`,
   e:`"다이애나, 이거 좀 이상한 맛이 나는 것 같아. 딱 한 잔만 마시자." 다이애나는 한 잔을 맛있게 마셨어. 그런데 한 잔만으로도 볼이 발그레해졌어.`,
   l:`"다이애나, 이거 맛이 좀 이상한 것 같아. 딱 한 잔만 마시자." 다이애나는 한 잔을 맛있게 비웠다. 그런데 그 한 잔만으로도 볼이 발그레해졌다.`},
  {id:`d_m`, w:`anne`, f:`anne_happy`, o:`diana`, bk:[`16-25`,`16-26`,`16-27`], when:s => s.flags.threeGlass,
   e:`내가 부엌에서 불을 들쑤시고 오는 사이, 다이애나는 두 번째 잔을 마시고 있었어. 내가 더 권하자 세 번째 잔도 마셨어. "이렇게 맛있는 건 처음이야. 린드 부인 것보다 훨씬 맛있어!"`,
   l:`부엌에서 불을 들쑤시고 돌아와 보니 다이애나는 두 번째 잔을 마시고 있었다. 내가 더 권하자 세 번째 잔도 딱히 마다하지 않았다. 잔은 큼직했고, 주스는 정말 맛있었다. "이렇게 맛있는 건 처음 마셔 봐. 린드 부인 것보다 훨씬 맛있어."`},
  {w:`anne`, f:`anne_happy`, o:`diana`, bk:[`16-28`], cam:`in`,
   e:`나는 신이 나서 이야기를 쏟아 냈어. "지난번에 케이크를 만들다가 밀가루를 빼먹었어! 너랑 나에 대한 슬픈 이야기를 상상하느라고. 그리고 푸딩 소스에 생쥐가 빠졌는데, 손님 앞에서 '그 소스 쓰시면 안 돼요! 생쥐가 빠졌었어요!'라고 소리쳐 버렸지 뭐야!"`,
   l:`나는 신이 나서 이야기를 쏟아 냈다. 너와 나에 대한 슬픈 이야기를 상상하다가 케이크에 밀가루 넣는 걸 잊은 일, 수녀가 되는 상상을 하다가 푸딩 소스 뚜껑을 덮지 않아 생쥐가 빠져 죽은 일, 그리고 멋쟁이 체스터 로스 부인 앞에서 "아주머니, 그 소스 쓰시면 안 돼요! 생쥐가 빠져 죽어 있었어요!"라고 외쳐 버린 일까지.`},
  {w:`diana`, f:`anne_surprised`, o:`diana`, bk:[`16-29`,`16-30`], cam:`shake`,
   e:`그런데 다이애나가 휘청거리며 일어나더니, 다시 털썩 주저앉아 머리를 감쌌어. "나… 나 너무 어지러워. 당장 집에 가야겠어."`,
   l:`그런데 다이애나가 몹시 비틀거리며 일어섰다가, 다시 주저앉아 두 손으로 머리를 감쌌다. "나… 나 너무 어지러워." 혀가 조금 꼬인 목소리였다. "나… 당장 집에 가야겠어."`},
  {w:`anne`, f:`anne_sad`, o:`diana`, bk:[`16-31`,`16-35`,`16-37`],
   e:`"차도 안 마시고 가면 안 돼! 혹시 천연두에 걸린 거야? 그럼 내가 간호해 줄게!" 하지만 다이애나는 "집에 가야겠어."라는 말만 되풀이했어. 나는 배리 씨네 울타리까지 바래다주고, 돌아오는 내내 울었어.`,
   l:`"차도 안 마시고 가면 안 돼! 혹시 정말 천연두에 걸린 거니? 그렇다면 내가 가서 간호해 줄게. 절대 너를 버리지 않을 거야." 그러나 다이애나는 "집에 가야겠어"라는 말만 되풀이했다. 나는 실망의 눈물을 글썽이며 배리 씨네 울타리까지 바래다주고, 초록 지붕 집으로 돌아오는 내내 울었다.`},
  /* ---------- 월요일 ---------- */
  {bg:`ch2`, w:`anne`, in:1, f:`anne_sad`, o:`marilla_strict`, bk:[`16-38`,`16-42`,`16-43`], cam:`shake`,
   e:`월요일, 린드 부인 댁에 심부름 갔던 나는 엉엉 울며 돌아와 소파에 엎어졌어. "배리 부인이… 제가 다이애나를 술에 취하게 했대요! 저는 뼛속까지 못된 아이니까, 다시는 다이애나랑 못 놀게 하겠대요!"`,
   l:`월요일 오후, 린드 부인 댁에 심부름을 갔던 나는 눈물을 뚝뚝 흘리며 날듯이 돌아와 소파에 엎어졌다. "배리 부인이… 제가 토요일에 다이애나를 술에 취하게 해서 창피한 꼴로 집에 보냈대요. 저는 뼛속까지 나쁘고 못된 아이니까, 다시는, 다시는 다이애나랑 못 놀게 하겠대요."`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`, bk:[`16-45`,`16-46`,`16-47`], cam:`right`,
   e:`"술에 취하게 했다고? 대체 뭘 준 거니?" "산딸기 주스밖에 안 줬어요!" 아주머니는 거실 벽장으로 성큼성큼 가시더니… 병을 들고 얼굴이 씰룩씰룩해서 돌아오셨어.`,
   l:`"다이애나를 술에 취하게 했다고! 대체 그 애한테 뭘 준 거니?" "산딸기 주스밖에 안 줬어요." 아주머니는 거실 벽장으로 성큼성큼 걸어갔다. 선반 위의 병을 보는 순간 아주머니는 알아보았다. 그것은 에이번리에서 이름난 자기 집 3년 묵은 까치밥나무 열매 포도주였다. 그리고 산딸기 주스는 찬장이 아니라 지하실에 내려놓았다는 것도 그제야 생각났다.`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`, bk:[`16-49`,`16-51`],
   e:`"앤, 넌 정말 말썽에 휘말리는 데는 천재로구나. 산딸기 주스가 아니라 까치밥나무 열매 포도주를 준 거다. 그래도 울지 마라. 네 잘못은 없다. 그 큰 잔으로 세 잔이면 주스라도 탈이 났을 거다."`,
   l:`"앤, 넌 정말 말썽에 휘말리는 데는 천재로구나. 산딸기 주스가 아니라 까치밥나무 열매 포도주를 준 거다." 아주머니의 얼굴이 저도 모르게 씰룩였다. "세 잔씩이나 마셔 댄 다이애나도 욕심이 과했다. 자, 자, 울지 마라. 네 잘못은 없는 것 같다."`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`, when:s => s.flags.tasted,
   e:`"네가 맛이 이상하다고 한 잔만 마시게 했다고? …그래, 그건 잘했다. 그렇게 말씀드리마."`,
   l:`"맛이 이상하다고 한 잔에서 멈추게 했다고? …그래, 그건 잘한 일이다. 배리 부인께도 그대로 말씀드리마."`},
  {w:`anne`, f:`anne_sad`, o:`marilla_strict`, bk:[`16-52`],
   e:`"제 가슴이 찢어졌어요. 운명의 별들이 저를 거슬러 싸우고 있어요. 다이애나랑 저는 영원히 헤어졌어요. 처음 맹세할 때는 이런 일이 생길 줄 꿈에도 몰랐어요."`,
   l:`"울어야겠어요. 제 가슴이 찢어졌어요. 운명의 별들이 저를 거슬러 싸우고 있어요, 아주머니. 다이애나랑 저는 영원히 헤어졌어요. 아, 처음 우정을 맹세할 때는 이런 일이 생길 줄 꿈에도 몰랐어요."`},
  {w:`marilla`, f:`anne_surprised`, o:`marilla_strict`, bk:[`16-55`,`16-56`,`16-58`], cam:`in`,
   e:`아주머니가 배리 부인께 대신 설명하러 가셨어. 하지만 돌아오신 얼굴을 보니 소용없었다는 걸 알 수 있었어. "그렇게 막무가내인 여자는 처음 봤다! 실수였다고 해도 도무지 믿질 않아!"`,
   l:`아주머니가 대신 과수원 비탈 집에 다녀왔다. 그러나 돌아온 얼굴만 보아도 소용없었다는 걸 알 수 있었다. "배리 부인이라니, 원! 내가 본 여자들 중에 그렇게 막무가내인 사람은 처음이다. 다 실수였고 네 잘못이 아니라고 했는데, 도무지 믿질 않는구나."`},
  /* ---------- 해 질 녘, 배리 씨네 문간 ---------- */
  {bg:`ch5_dusk`, w:`anne`, in:1, f:`anne_sad`, bk:[`16-59`], cam:`out`,
   e:`나는 모자도 안 쓰고 쌀쌀한 가을 어스름 속으로 나갔어. 시든 토끼풀 밭을 지나, 통나무 다리를 건너, 창백한 작은 달빛을 받으며 가문비나무 숲을 올라갔어. 그리고 배리 씨네 문을 똑똑 두드렸어.`,
   l:`나는 모자도 쓰지 않은 채 쌀쌀한 가을 어스름 속으로 걸어 나갔다. 시든 토끼풀 밭을 내려가 통나무 다리를 건너고, 서쪽 숲 위에 낮게 걸린 창백한 달빛을 받으며 가문비나무 숲을 올랐다. 그리고 머뭇머뭇 문을 두드렸다.`},
  {w:`barry`, f:`anne_sad`, o:`barry`, bk:[`16-60`,`16-61`], cam:`right`,
   e:`문을 연 배리 부인의 얼굴이 딱딱하게 굳었어. "무슨 일이니?"`,
   l:`문을 연 배리 부인의 얼굴이 굳어졌다. 부인은 편견과 싫어하는 마음이 강한 사람이었고, 그 분노는 차갑고 뚱하게 오래가는 종류였다. 공평하게 말하자면, 부인은 내가 정말로 일부러 다이애나를 취하게 했다고 믿고 있었다. "무슨 일이니?"`},
  {t:`choice`, id:`C4`, kind:`talk`, label:`배리 부인께 용서를 빌다`, f:`anne_sad`, o:`barry`,
   q:{e:`화가 난 배리 부인 앞이에요. 앤은 어떻게 용서를 빌까요?`, l:`차갑게 굳은 배리 부인 앞. 앤은 어떤 말로 용서를 구할까요?`},
   note:{e:`원작의 앤은 두 손을 모으고 "부인이 가엾은 고아 소녀라고 상상해 보세요. 세상에 단 하나뿐인 친구를 일부러 취하게 하시겠어요?"라고 애원해요. 하지만 배리 부인은 앤의 어려운 말과 극적인 몸짓을 보고 자기를 놀린다고 생각해서 더 화가 났대요.`,
         l:`원작에서 앤은 "부인이 입양된 가엾은 고아이고 세상에 마음의 친구가 단 하나뿐이라고 상상해 보시라"며 극적으로 애원합니다. 린드 부인이라면 단숨에 마음이 녹았을 말이었지만, 배리 부인은 앤이 자기를 조롱한다고 여겨 더욱 굳어지지요.`},
   opts:[
    {type:`canon`, go:`f_c`, eff:{heart:{barry:-1}}, e:`두 손을 모으고 "부인이 가엾은 고아 소녀라고 상상해 보세요!"라고 온 마음을 다해 애원한다.`, l:`두 손을 맞잡고 "부인이 가엾은 고아 소녀라고 상상해 보세요"라며 절절히 애원한다.`, s:{e:`고아 소녀라고 상상해 보시라 애원했다`, l:`극적으로 애원했다`}},
    {type:`imag`, go:`f_i`, e:`"용서해 주신다면, 백 일 동안 한마디도 하지 않고 지내겠어요!" 침묵의 맹세를 바친다.`, l:`"용서해 주신다면 백 일 동안 한마디도 하지 않겠어요!" 침묵의 맹세를 바친다.`, s:{e:`백 일 동안 침묵하겠다고 맹세했다`, l:`백 일의 침묵을 맹세했다`}},
    {type:`bal`, go:`f_b`, eff:{flag:`factsOnly`, heart:{barry:1}}, e:`짧고 차분하게, 있었던 일을 있는 그대로 말씀드리고 다이애나는 혼내지 말아 달라고 부탁한다.`, l:`짧고 차분하게 사실만 말씀드리고, 다이애나는 꾸짖지 말아 달라고 청한다.`, s:{e:`있는 그대로 차분하게 말씀드렸다`, l:`사실만 차분히 전했다`}}
   ]},
  {id:`f_c`, w:`anne`, f:`anne_sad`, o:`barry`, bk:[`16-62`,`16-63`], cam:`in`,
   e:`나는 두 손을 꼭 모았어. "아, 배리 부인, 제발 용서해 주세요. 부인이 친절한 분들에게 입양된 가엾은 고아 소녀이고, 이 세상에 마음의 친구가 단 한 명뿐이라고 상상해 보세요. 그 친구를 일부러 취하게 하시겠어요? 제 인생이 슬픔의 먹구름으로 뒤덮이고 말 거예요!"`,

   e:`나는 다이애나가 안 보일 때까지 서서 지켜봤어. 다이애나가 뒤돌아볼 때마다 슬프게 손을 흔들었어.`,
   l:`나는 다이애나가 보이지 않을 때까지 서서 지켜보았다. 다이애나가 뒤돌아볼 때마다 슬프게 손을 흔들었다.`},
  {bg:`ch2`, w:`marilla`, f:`anne_sad`, o:`marilla_strict`, bk:[`17-15`,`17-16`],
   e:`"다 끝났어요. 저는 다시는 친구를 못 사귈 거예요. 아마 오래 못 살 거예요…" "말을 그렇게 잘하는 걸 보니, 슬퍼서 죽을 걱정은 없겠구나." 아주머니가 무정하게 말씀하셨어.`,
   l:`"다 끝났어요. 저는 다시는 친구를 못 사귈 거예요. 진짜 친구를 사귀고 나니 상상 속 소녀들로는 마음이 채워지지 않아요. 저는 오래 살 것 같지 않아요." "말을 그렇게 잘하는 걸 보니 슬퍼서 죽을 걱정은 별로 없겠구나, 앤." 아주머니가 무정하게 말했다.`},
  /* ---------- 다시 학교로 ---------- */
  {w:`anne`, f:`anne_sad`, o:`marilla_warm`, bk:[`17-17`,`17-18`,`17-19`], cam:`in`,
   e:`다음 월요일, 나는 책 바구니를 들고 내려왔어. "저 다시 학교에 갈래요. 학교에서는 다이애나를 바라볼 수라도 있으니까요." 아주머니는 기쁜 걸 감추시며 "석판 깨는 소동만 없으면 좋겠다."라고 하셨어.`,
   l:`다음 월요일, 나는 책 바구니를 팔에 걸고 입술을 꼭 다문 채 내려왔다. "저 다시 학교에 갈래요. 친구를 무자비하게 빼앗긴 지금, 제 삶에 남은 건 그것뿐이에요. 학교에서는 다이애나를 바라보며 지나간 날을 떠올릴 수 있으니까요." 아주머니는 기쁜 마음을 감추며 말했다. "지나간 날 대신 공부나 곰곰이 떠올리려무나. 사람 머리에 석판 깨는 소동은 더 듣지 않길 바란다."`},
  {w:`anne`, in:1, f:`anne_happy`, o:`marilla_warm`, when:s => s.flags.schoolNews || s.flags.missSchool,
   e:`다들 나를 보고 싶어 한다던 다이애나의 말이 떠올랐어. 조금은 용기가 났어.`,
   l:`모두가 나를 그리워한다던 다이애나의 말이 떠올랐다. 조금은 용기가 났다.`},
  {bg:`ch4`, w:`anne`, in:1, f:`anne_happy`, bk:[`17-20`,`17-21`,`17-22`], cam:`out`,
   e:`학교에서는 모두가 두 팔 벌려 나를 반겨 줬어! 루비는 파란 자두 세 개를 몰래 건네고, 엘라 메이는 커다란 노란 팬지 그림을 주고, 줄리아 벨은 연분홍 종이에 시를 적어 줬어. "황혼이 저녁 장막을 드리우고 / 별 하나로 그 자락을 꽂아 둘 때 / 기억해 줘, 너에게는 친구가 있다는 걸."`,
   l:`학교는 두 팔 벌려 나를 맞아 주었다. 놀이에는 내 상상력이, 노래에는 내 목소리가, 점심시간의 책 읽기에는 내 연기가 그리웠던 것이다. 루비 길리스는 파란 자두 세 개를, 엘라 메이는 꽃 카탈로그에서 오린 커다란 노란 팬지를 건넸고, 줄리아 벨은 물결무늬 연분홍 종이에 시를 옮겨 적어 주었다. "황혼이 저녁 장막을 드리우고 / 별 하나로 그 자락을 꽂아 둘 때 / 기억해 줘, 너에게는 친구가 있다는 걸 / 그 친구가 아무리 멀리 있어도."`},
  {w:`anne`, in:1, f:`anne_surprised`, bk:[`17-24`], cam:`in`,
   e:`그런데 점심시간이 끝나고 자리에 가 보니, 책상 위에 크고 빨간 '딸기 사과'가 놓여 있었어. 한 입 베어 물려다가 생각났어. 에이번리에서 딸기 사과가 열리는 곳은… 블라이스 씨네 과수원뿐이라는 걸!`,
   l:`점심시간이 끝나고 자리에 가 보니 책상 위에 크고 먹음직스러운 딸기 사과가 놓여 있었다. 한 입 베어 물려던 찰나, 생각이 났다. 에이번리에서 딸기 사과가 자라는 곳은 반짝이는 호수 건너편, 블라이스 씨네 오래된 과수원뿐이라는 것을.`},
  {t:`choice`, id:`C6`, kind:`predict`, label:`블라이스 과수원의 딸기 사과`, f:`anne_angry`, o:`gilbert`,
   q:{e:`길버트가 몰래 놓고 간 딸기 사과! 원작의 앤은 이 사과를 어떻게 했을까요?`, l:`블라이스 과수원에서 온 딸기 사과. 원작의 앤은 어떻게 했을까요?`},
   note:{e:`원작의 앤은 시뻘겋게 단 숯이라도 되는 듯 사과를 떨어뜨리고, 보란 듯이 손수건으로 손가락을 닦아요. 사과는 다음 날 아침 청소 당번 꼬마가 가져갔대요. 반면 찰리 슬론이 준 줄무늬 석필은 웃으며 받았지요!`,
         l:`원작에서 앤은 뜨거운 숯을 놓치듯 사과를 떨어뜨리고, 보란 듯이 손수건으로 손을 닦습니다. 반면 찰리 슬론의 2센트짜리 줄무늬 석필은 너그럽게 받아 미소로 답하지요. 작가는 이 대비로 앤의 고집을 익살스럽게 보여 줍니다.`},
   opts:[
    {type:`canon`, go:`a_c`, eff:{heart:{gilbert:-1}}, e:`뜨거운 숯처럼 사과를 떨어뜨리고, 보란 듯이 손수건으로 손을 닦는다.`, l:`뜨거운 숯을 놓치듯 사과를 떨어뜨리고, 보란 듯이 손수건으로 손을 닦는다.`, s:{e:`사과를 떨어뜨리고 손을 닦았다`, l:`사과를 숯처럼 내던졌다`}},
    {type:`imag`, go:`a_i`, e:`사과에 잉크로 얼굴을 그려 '길버트 사과'라고 이름 붙이고, 창틀에 세워 둔다.`, l:`사과에 잉크로 얼굴을 그려 '길버트 사과'라 이름 짓고 창틀에 세워 둔다.`, s:{e:`얼굴을 그려 창틀에 세웠다`, l:`얼굴 그린 사과를 세웠다`}},
    {type:`bal`, go:`a_b`, eff:{heart:{gilbert:1}}, e:`먹지는 않고, "고맙지만 받을 수 없어."라는 쪽지를 붙여 길버트 책상에 돌려놓는다.`, l:`먹지 않고 "고맙지만 받을 수 없어"라는 쪽지를 붙여 돌려놓는다.`, s:{e:`쪽지를 붙여 돌려주었다`, l:`쪽지와 함께 돌려주었다`}}
   ]},
  {id:`a_c`, w:`anne`, in:1, f:`anne_angry`, o:`gilbert`, bk:[`17-24`],
   e:`나는 시뻘겋게 단 숯이라도 되는 듯 사과를 툭 떨어뜨리고, 보란 듯이 손수건으로 손가락을 닦았어. 대신 찰리 슬론이 보낸 줄무늬 석필은 웃으며 받아 줬지. 찰리는 기뻐서 받아쓰기를 엉망으로 틀렸대!`,
   l:`나는 시뻘겋게 단 숯이라도 되는 듯 사과를 떨어뜨리고 보란 듯이 손수건으로 손가락을 닦았다. 반면 찰리 슬론이 보낸 2센트짜리 줄무늬 석필은 너그럽게 받아 미소로 답했다. 그 미소에 일곱 번째 하늘까지 날아오른 찰리는 받아쓰기를 엉망으로 틀려 방과 후에 남아야 했다.`},
  {t:`goto`, to:`a_m`},
  {id:`a_i`, w:`anne`, in:1, f:`anne_dreamy`, o:`gilbert`, fx:`dream`, eff:{album:`appleFace`},
   e:`나는 사과에 잉크로 눈, 코, 그리고 놀리는 듯한 입을 그렸어. 그리고 '길버트 사과'라고 이름 붙여서 창틀에 세워 뒀지. 길버트 사과는 하루 종일 창밖만 바라보며 반성했어.`,
   l:`나는 사과에 잉크로 눈과 코, 그리고 비죽이 웃는 입을 그려 넣었다. 그리고 '길버트 사과'라 이름 붙여 창틀에 세워 두었다. 길버트 사과는 하루 종일 창밖만 바라보며 반성하는 신세가 되었다.`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`gilbert`,
   e:`그런데 길버트가 그 사과를 보더니 킥킥 웃었어. 화를 낼 줄 알았는데! 정말 알 수 없는 애야.`,
   l:`그런데 길버트가 그 사과를 보더니 소리 죽여 웃는 게 아닌가. 화를 낼 줄 알았는데. 정말 알 수 없는 아이였다.`},
  {t:`goto`, to:`a_m`},
  {id:`a_b`, w:`anne`, in:1, f:`anne_sad`, o:`gilbert`,
   e:`나는 사과를 먹지 않았어. 대신 쪽지에 "고맙지만 받을 수 없어."라고 적어 붙이고, 길버트 책상에 살짝 돌려놓았어. 무시하는 것과 거절하는 건 다르니까.`,
   l:`나는 사과를 먹지 않았다. 대신 "고맙지만 받을 수 없어"라고 적은 쪽지를 붙여 길버트의 책상에 조용히 돌려놓았다. 무시하는 것과 거절하는 것은 다른 일이니까.`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`gilbert`, when:s => s.items.includes(`candy`),
   e:`하트 사탕에 이어 두 번째로 돌려준 선물이었어. 길버트는 쪽지를 읽고 고개를 끄덕였어.`,
   l:`하트 사탕에 이어 두 번째로 돌려준 선물이었다. 길버트는 쪽지를 읽고 말없이 고개를 끄덕였다.`},
  /* ---------- 다이애나의 쪽지 ---------- */
  {id:`a_m`, w:`anne`, in:1, f:`anne_sad`, o:`diana`, bk:[`17-27`,`17-28`],
   e:`그래도 거티 파이 옆에 앉은 다이애나한테서는 눈길 한 번 오지 않았어. "다이애나가 한 번쯤은 웃어 줄 수도 있었을 텐데…" 그런데 다음 날 아침, 꼬깃꼬깃 접힌 쪽지와 작은 꾸러미가 내게 건네져 왔어!`,
   l:`그러나 거티 파이와 짝이 된 다이애나 배리에게서만은 아무 선물도 눈길도 오지 않았고, 그것이 나의 작은 승리를 씁쓸하게 했다. "다이애나가 한 번쯤은 웃어 줄 수도 있었을 텐데." 그런데 이튿날 아침, 무시무시하게 꼬이고 접힌 쪽지와 작은 꾸러미가 내게 건네져 왔다.`},
  {w:`diana`, f:`anne_happy`, o:`diana`, bk:[`17-28`,`17-29`,`17-30`], cam:`in`, eff:{item:`bookmark`, heart:{diana:1}},
   e:`"사랑하는 앤에게. 엄마가 학교에서도 너랑 말하지 말래. 내 잘못이 아니니까 화내지 마. 나는 예전과 똑같이 너를 사랑해. 빨간 종이로 새 책갈피를 만들었어. 이걸 볼 때마다 기억해 줘. 너의 진정한 친구, 다이애나 배리."`,
   l:`"사랑하는 앤에게. 엄마가 학교에서도 너랑 놀거나 말하지 말래. 내 잘못이 아니니까 나한테 화내지 마. 나는 예전과 똑같이 너를 사랑해. 비밀을 다 털어놓을 네가 너무너무 보고 싶어. 빨간 얇은 종이로 새 책갈피를 하나 만들었어. 이걸 볼 때마다 기억해 줘. 너의 진정한 친구, 다이애나 배리."`},
  {w:`diana`, f:`anne_happy`, o:`diana`, when:s => s.flags.mailbox,
   e:`쪽지 끝에는 작게 이렇게 적혀 있었어. "추신: 통나무 다리 우체통에도 편지 넣어 뒀어!"`,
   l:`쪽지 끄트머리에는 작은 글씨가 덧붙어 있었다. "추신: 통나무 다리 우체통에도 편지 넣어 뒀어!"`},
  {w:`anne`, f:`anne_happy`, o:`diana`, bk:[`17-32`,`17-33`,`17-34`,`17-35`,`17-36`],
   e:`나는 책갈피에 입을 맞추고 곧바로 답장을 보냈어. "나의 사랑하는 다이애나에게. 너는 엄마 말씀을 따라야 하니까 당연히 화나지 않았어. 우리 영혼은 서로 통할 수 있어. 죽음이 우리를 갈라놓을 때까지 너의, 앤 또는 코델리아 셜리."`,
   l:`나는 쪽지를 읽고 책갈피에 입을 맞춘 뒤 곧바로 교실 건너편으로 답장을 보냈다. "나의 사랑하는 다이애나에게. 너는 엄마 말씀을 따라야 하니까 당연히 너한테 화나지 않았어. 우리의 영혼은 서로 통할 수 있어. 너의 예쁜 선물은 영원히 간직할게. 죽음이 우리를 갈라놓을 때까지 너의, 앤 또는 코델리아 셜리."`},
  {w:`anne`, in:1, f:`anne_happy`, o:`gilbert`, bk:[`17-40`], cam:`right`,
   e:`그 뒤로 나는 온 마음을 다해 공부했어. 길버트 블라이스한테는 어느 과목에서도 지지 않을 거야! 철자도, 산수도, 1등은 우리 둘 사이를 오락가락했어. 어느 끔찍한 날엔 동점이 되어 칠판에 이름이 나란히 쓰이기까지 했어!`,
   l:`그 뒤로 나는 길버트 블라이스에게만은 어느 과목에서도 지지 않겠다고 마음먹고 공부에 뛰어들었다. 영광은 두 사람 사이를 오락가락했다. 어떤 날은 길버트가 철자 1등, 어떤 날은 내가 긴 빨간 머리를 휙 넘기며 그를 꺾었다. 어느 끔찍한 날에는 동점이 되어 칠판에 이름이 나란히 적혔다. '주목하시오'만큼이나 끔찍한 일이었다.`},
  {w:`anne`, in:1, f:`anne_angry`, o:`gilbert`, bk:[`17-40`], when:s => (s.hearts.gilbert || 0) >= 2,
   e:`둘째 달 시험에서 내가 5점 차로 이겼을 때, 길버트가 온 학교 앞에서 진심으로 축하해 줬어. 분했어. 차라리 분해하는 얼굴을 봤으면 훨씬 달콤했을 텐데!`,
   l:`둘째 달 시험에서 내가 5점 차로 이기자, 길버트는 온 학교 앞에서 진심으로 축하해 주었다. 그 바람에 승리의 맛이 바래 버렸다. 그가 패배의 쓴맛을 느꼈더라면 훨씬 달콤했을 텐데.`},
  {t:`ending`},

  /* ---------- 결말: 원작 ---------- */

  try{
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); if(!d) return;
    if(d.S) S = Object.assign(fresh(), d.S);
    if(d.P) P = Object.assign(freshP(), d.P);
    if(d.level === "easy" || d.level === "lit") level = d.level;
    if(typeof d.soundOn === "boolean") soundOn = d.soundOn;

    if(typeof d.fxOn === "boolean") fxOn = d.fxOn;

/* =========================================================
   2. 사운드 (Web Audio API)
   ========================================================= */
let actx = null;
function unlockAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  if(!actx){ try{ actx = new AC(); }catch(e){ return null; } }
  if(actx.state === "suspended") actx.resume().catch(() => {});
  return actx;
}
["pointerdown","touchstart","keydown","click"].forEach(ev => window.addEventListener(ev, unlockAudio, {passive:true, capture:true}));
function tone(f, t, d, v, type){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + 0.02);
}
let lastTick = 0;
function sfx(kind){
  if(!soundOn) return;
  const ctx = unlockAudio(); if(!ctx || ctx.state !== "running") return;
  const t = ctx.currentTime;
  try{
    if(kind === "type"){ if(t - lastTick < 0.05) return; lastTick = t; tone(1100 + Math.random()*500, t, 0.035, 0.035, "square"); tone(220, t, 0.03, 0.03, "triangle"); }
    else if(kind === "select"){ tone(659, t, 0.12, 0.12, "triangle"); tone(988, t + 0.07, 0.18, 0.1, "triangle"); }
    else if(kind === "chime"){ [784, 988, 1175, 1568].forEach((f,i) => tone(f, t + i*0.08, 0.35, 0.07, "sine")); }
    else if(kind === "page"){ tone(523, t, 0.15, 0.06, "sine"); tone(784, t + 0.1, 0.25, 0.06, "sine"); }
    else if(kind === "item"){ tone(1047, t, 0.1, 0.08, "sine"); tone(1319, t + 0.08, 0.1, 0.08, "sine"); tone(1568, t + 0.16, 0.2, 0.08, "sine"); }
    else if(kind === "dream"){ [523, 659, 784, 1047, 784].forEach((f,i) => tone(f, t + i*0.11, 0.5, 0.04, "sine")); }
    else if(kind === "end"){ [392, 523, 659, 784, 1047].forEach((f,i) => tone(f, t + i*0.14, 0.7, 0.07, "triangle")); }
  }catch(e){}
}

/* =========================================================
   3. 이미지 (업로드 > 내장 > 같은 폴더 > SVG)
   ========================================================= */
const EMB = (window.EMBEDDED_IMAGES && typeof window.EMBEDDED_IMAGES === "object") ? window.EMBEDDED_IMAGES : {};
const FILES = (window.IMAGE_FILES && typeof window.IMAGE_FILES === "object") ? window.IMAGE_FILES : {};
const uploaded = {}, folderFound = {};
function imgFor(k){ return uploaded[k] || EMB[k] || FILES[k] || folderFound[k] || null; }
/* 앱(웹) 판: 그림이 별도 파일이라, 장에 들어갈 때 그 장 그림을 미리 불러오고 쉬는 동안 나머지도 받아 둔다(오프라인용) */
const preloaded = {};
function preloadKeys(keys){ keys.forEach(k => { const s = FILES[k]; if(s && !preloaded[s] && !uploaded[k] && !EMB[k]){ preloaded[s] = new Image(); preloaded[s].src = s; } }); }
function preloadChapter(){
  const ks = new Set(CH.bgKeys || []);
  CH.nodes.forEach(n => { if(n.bg) ks.add(n.bg); if(n.f) ks.add(n.f); if(n.o) ks.add(n.o); });
  preloadKeys([...ks]);
}
function warmCache(){
  if(!/^https?:$/.test(location.protocol)) return;
  const urls = Object.values(FILES).concat(CHAPTERS.map(c => c.bgm).filter(Boolean));
  if(!urls.length) return;
  let i = 0;
  const next = () => { if(i >= urls.length) return; const u = urls[i++]; fetch(u).catch(() => {}).finally(() => setTimeout(next, 150)); };
  setTimeout(next, 5000);
}
function probe(key, list){
  if(imgFor(key)) return;
  let i = 0;
  const next = () => { if(i >= list.length) return; const src = list[i++]; const im = new Image();
    im.onload = () => { if(!uploaded[key] && !EMB[key]){ folderFound[key] = src; renderScene(true); } }; im.onerror = next; im.src = src; };
  next();
}
function probeFolder(){
  BG_KEYS.forEach(k => probe(k, [k + ".png", "bg_" + k + ".png", k + ".jpg"]));
  SPRITE_KEYS.forEach(k => probe(k, [k + ".png"]));
}
function normalizeKey(name){
  let n = name.toLowerCase().replace(/\.[a-z0-9]+$/, "").trim().replace(/\s+/g, "_");
  const m = n.match(/^(?:bg_)?ch0?(\d{1,2})(_[a-z]+)?$/);
  if(m) return "ch" + parseInt(m[1], 10) + (m[2] || "");
  return n;
}
const isBgKey = k => /^ch\d+(_[a-z]+)?$/.test(k);
const loadImg = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
function removeEdgeWhite(ctx, w, h){
  const id = ctx.getImageData(0, 0, w, h), d = id.data;
  const isBg = p => { const i = p*4; if(d[i+3] < 16) return true; const r = d[i], g = d[i+1], b = d[i+2], mn = Math.min(r,g,b), mx = Math.max(r,g,b); return mn > 226 && mx - mn < 26; };
  const corners = [0, w-1, (h-1)*w, h*w-1];
  if(corners.filter(p => d[p*4+3] > 200 && isBg(p)).length < 3) return;
  const seen = new Uint8Array(w*h), st = [];
  const push = p => { if(!seen[p] && isBg(p)){ seen[p] = 1; st.push(p); } };
  for(let x=0; x<w; x++){ push(x); push((h-1)*w + x); }
  for(let y=0; y<h; y++){ push(y*w); push(y*w + w - 1); }
  let bgR = 0, bgG = 0, bgB = 0, bgN = 0;
  while(st.length){ const p = st.pop(), q = p*4; if(d[q+3] > 200 && bgN < 200000){ bgR += d[q]; bgG += d[q+1]; bgB += d[q+2]; bgN++; } d[q+3] = 0; const x = p % w, y = (p - x) / w;
    if(x>0) push(p-1); if(x<w-1) push(p+1); if(y>0) push(p-w); if(y<h-1) push(p+w); }
  /* 팔과 몸 사이처럼 테두리와 이어지지 않은 '갇힌 배경'도 찾아서 지움.
     배경색과 거의 같은 순백색이고 일정 크기 이상인 덩어리만 지우므로, 눈 흰자처럼 작은 부분은 남음 */
  if(bgN){
    const br = bgR/bgN, bgg = bgG/bgN, bb = bgB/bgN, smallMin = Math.max(40, Math.round(w*h*0.00006));
    const strict = p => { const i = p*4; if(d[i+3] < 16) return false; const r = d[i], g = d[i+1], b = d[i+2];
      return Math.min(r,g,b) > 212 && Math.max(r,g,b) - Math.min(r,g,b) < 20 && Math.abs(r-br) < 16 && Math.abs(g-bgg) < 16 && Math.abs(b-bb) < 16; };
    const lab = new Uint8Array(w*h);
    for(let s0 = 0; s0 < w*h; s0++){
      if(seen[s0] || lab[s0] || !strict(s0)) continue;
      const comp = [s0], stack = [s0]; lab[s0] = 1;
      while(stack.length){ const p = stack.pop(), x = p % w, y = (p - x) / w;
        const nb = [x>0 ? p-1 : -1, x<w-1 ? p+1 : -1, y>0 ? p-w : -1, y<h-1 ? p+w : -1];
        for(const q of nb){ if(q >= 0 && !seen[q] && !lab[q] && strict(q)){ lab[q] = 1; stack.push(q); comp.push(q); } } }
      /* 덩어리의 평균 색이 배경 종이색과 같으면(따뜻한 기가 없으면) 배경 틈으로 보고 지움.
         이(치아)·눈 흰자처럼 살짝 노르스름하거나 회색빛인 부분은 평균 색이 달라서 남음 */
      if(comp.length < smallMin) continue;
      let sr = 0, sg = 0, sb = 0; for(const p of comp){ sr += d[p*4]; sg += d[p*4+1]; sb += d[p*4+2]; }
      const mr = sr/comp.length, mg = sg/comp.length, mb = sb/comp.length;
      const warm = (mr - mb) - (br - bb), dim = Math.min(br, bgg, bb) - Math.min(mr, mg, mb);
      if(warm > 4.6 || dim > 8) continue;
      /* 눈 흰자 보호: 배경 틈은 펜 선(진한 테두리)에 둘러싸여 있고, 눈 흰자는 대부분 피부색에 둘러싸여 있음 */
      const inC = new Set(comp), ringSeen = new Set(); let dark = 0, tot = 0;
      for(const p of comp){ const x = p % w, y = (p - x) / w;
        for(let dy=-3; dy<=3; dy++) for(let dx=-3; dx<=3; dx++){ const xx = x+dx, yy = y+dy; if(xx<0||yy<0||xx>=w||yy>=h) continue;
          const q = yy*w + xx; if(inC.has(q) || ringSeen.has(q)) continue; ringSeen.add(q); tot++;
          if((d[q*4] + d[q*4+1] + d[q*4+2]) / 3 < 90) dark++; } }
      if(tot && dark / tot >= 0.18){ for(const p of comp){ seen[p] = 1; d[p*4+3] = 0; } }
    }
  }
  for(let pass = 0; pass < 2; pass++){
    const edge = [];
    for(let y=1; y<h-1; y++) for(let x=1; x<w-1; x++){ const p = y*w + x; if(seen[p]) continue;
      if(seen[p-1] || seen[p+1] || seen[p-w] || seen[p+w]) edge.push(p); }
    for(const p of edge){ const i = p*4, mn = Math.min(d[i], d[i+1], d[i+2]);
      if(mn > 200){ d[i+3] = Math.round(d[i+3] * Math.max(0.1, (255 - mn) / 55)); if(mn > 238) seen[p] = 1; }
      else if(mn > 170 && pass === 0) d[i+3] = Math.round(d[i+3] * Math.max(0.35, (255 - mn) / 85)); }
  }
  ctx.putImageData(id, 0, 0);
}
async function processImage(src, key){
  const im = await loadImg(src), bg = isBgKey(key);
  const sc = Math.min(1, (bg ? 1600 : 1200) / im.naturalWidth, (bg ? 900 : 1000) / im.naturalHeight);
  const w = Math.max(1, Math.round(im.naturalWidth * sc)), h = Math.max(1, Math.round(im.naturalHeight * sc));
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d", {willReadFrequently: !bg});
  if(bg){ ctx.fillStyle = "#fbf6ec"; ctx.fillRect(0, 0, w, h); }
  ctx.drawImage(im, 0, 0, w, h);
  if(bg) return cv.toDataURL("image/jpeg", 0.86);
  removeEdgeWhite(ctx, w, h);
  return cv.toDataURL("image/png");
}
async function handleFiles(files){
  const list = Array.from(files || []).filter(f => /^image\//.test(f.type) || /\.(png|jpe?g|webp|gif)$/i.test(f.name));
  if(!list.length) return;
  toast("이미지를 정리하는 중이에요… (" + list.length + "개)");
  const ok = [], fail = [];
  for(const f of list){
    const key = normalizeKey(f.name), url = URL.createObjectURL(f);
    try{ uploaded[key] = await processImage(url, key); ok.push(key); }catch(e){ fail.push(f.name); }finally{ URL.revokeObjectURL(url); }
  }
  renderScene(true);
  const known = ok.filter(k => BG_KEYS.includes(k) || SPRITE_KEYS.includes(k)), other = ok.filter(k => !known.includes(k));
  let msg = `<p><b>${ok.length}개</b>의 이미지를 불러와 화면에 바로 반영했어요.</p>`;
  if(known.length) msg += `<div class="img-list">${known.map(k => `<span>${k}</span>`).join("")}</div>`;
  if(other.length) msg += `<p style="margin-top:8px">아래 이미지는 아직 쓰이는 장면이 없지만, 배포용 파일에는 함께 저장돼요. (앞으로 만들 장에서 쓸 수 있어요)</p><div class="img-list">${other.map(k => `<span class="miss">${k}</span>`).join("")}</div>`;
  if(fail.length) msg += `<p style="margin-top:8px;color:#b9473f">읽지 못한 파일: ${esc(fail.join(", "))}</p>`;
  modal("🖼️ 이미지 불러오기 완료", msg, [{label:"확인", cls:"big alt"}]);
}

function josa(word, form){

}

/* ---------- 중간 보고서 (1~5장) ---------- */
const NAME_LABELS = [
  {k:`avenue`, ch:1, what:`꽃이 핀 가로수길`, canon:`기쁨의 하얀 길`},
  {k:`pond`, ch:1, what:`배리 씨네 연못`, canon:`반짝이는 호수`},

  {k:`together`, ch:3, what:`다이애나와 하고 싶은 일`, free:true},
  {k:`vale`, ch:4, what:`숲 그늘의 작은 골짜기`, canon:`제비꽃 골짜기`}

const READER_TYPE = {
  canon:{emoji:`📖`, name:`원작 탐정형`, e:`원작 속 앤의 마음을 정확히 읽어 내는 독자예요. 인물이 왜 그렇게 행동하는지 꼼꼼히 따라가며 읽었어요.`, l:`인물의 성격과 동기를 정확히 읽어 내는 독자입니다. 원작의 흐름을 존중하며 앤의 선택이 지닌 의미를 따라갔습니다.`},
  imag:{emoji:`✨`, name:`상상 모험가형`, e:`앤처럼 세상을 새로 이름 짓는 독자예요. 원작 바깥으로 나만의 오솔길을 여러 번 냈어요.`, l:`앤처럼 세상에 새 이름을 붙이는 독자입니다. 원작의 빈틈에서 다른 가능성을 상상하며 이야기를 넓혀 갔습니다.`},
  bal:{emoji:`⚖️`, name:`마음 다리형`, e:`앤의 마음과 주변 사람들의 마음을 함께 생각한 독자예요. 서로를 잇는 다리 같은 선택을 많이 했어요.`, l:`앤의 열정과 타인의 입장 사이에서 균형을 찾는 독자입니다. 갈등을 풀어 가는 성숙한 길을 자주 골랐습니다.`}
};
function MID(){ P.mid = P.mid || {}; P.mid[CH.key] = P.mid[CH.key] || {name:"", a:[]}; return P.mid[CH.key]; }
function fallbackCopy(txt, done){ const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); done(); }catch(e){ toast("복사하지 못했어요. 길게 눌러 직접 복사해 주세요."); } ta.remove(); }
function renderMidReport(){
  const lit = level === "lit", upto = CHAPTERS.slice(0, S.ch + 1);

  const top = ["canon","imag","bal"].reduce((a, b) => sum[b] > sum[a] ? b : a, "canon");
  const tie = ["canon","imag","bal"].filter(k => sum[k] === sum[top]).length > 1;
  const type = READER_TYPE[tie ? "bal" : top];
  const tot = sum.canon + sum.imag + sum.bal || 1;
  const pct = k => Math.round(sum[k] / tot * 100);
  const total = S.canon + S.imag, gc = Math.round(S.canon / total * 100);
  const timeline = upto.map(c => { const h = S.hist[c.key];
    if(!h) return `<div class="tl-row"><div class="tl-ch">${c.num}장</div><div class="tl-body"><b>${c.title}</b><br><small>아직 끝까지 읽지 않았어요</small></div></div>`;
    const E = c.endings[h.ending], t = h.tally || {canon:0, imag:0, bal:0}, n = (t.canon + t.imag + t.bal) || 1;

      <div class="tl-bar"><span style="width:${t.canon/n*100}%;background:#d9645c"></span><span style="width:${t.bal/n*100}%;background:#8cb68a"></span><span style="width:${t.imag/n*100}%;background:#6aa5dc"></span></div></div></div>`; }).join("");
  const names = NAME_LABELS.filter(x => x.ch <= CH.num).map(x => { const v = S.names[x.k];
    return `<div class="c">${x.ch}장 · ${x.what}</div><div class="mine">${v ? `'${esc(v)}'` : `<span style="color:#a08770">—</span>`}</div><div class="orig">${x.free ? `<span style="color:#a08770">정답 없음</span>` : `'${x.canon}'`}</div>`; }).join("");
  const endCount = upto.reduce((s, c) => s + ["canon","imag","bal"].filter(k => P.endings[c.key + "_" + k]).length, 0);
  const itemIcons = S.items.map(k => ITEMS[k] ? `<span title="${esc(ITEMS[k].name)}">${ITEMS[k].ic}</span>` : "").join(" ");
  const qs = lit
    ? [`1~${CH.num}장에서 앤이 가장 크게 성장했다고 생각하는 장면을 고르고, 그 근거를 원작 문장에서 찾아 써 봅시다.`,
       `내가 고른 선택 가운데 원작과 가장 달랐던 것 하나를 골라, 그 선택이 이후 이야기에 어떤 영향을 줄 수 있었을지 써 봅시다.`,
       `다이애나와 헤어지고 길버트와 경쟁하게 된 앤. 6~10장에서 두 관계가 어떻게 변할지 근거를 들어 예측해 봅시다.`]
    : [`1~${CH.num}장에서 앤이 가장 많이 자랐다고 생각하는 장면은 어디인가요? 왜 그렇게 생각하나요?`,
       `내가 고른 선택 중에 원작과 가장 달랐던 것 하나를 골라 보세요. 왜 그 길을 골랐나요?`,
       `앞으로 앤과 다이애나는 다시 친구가 될 수 있을까요? 앤과 길버트는 어떻게 될까요? 예측해 봐요.`];
  el.report.innerHTML = `<div class="rp-wrap mid">
    <div class="rp-head"><small>MID-TERM READING REPORT</small><h2>📜 중간 보고서 · 1~${CH.num}장 나의 독서 여정</h2>
      <p style="font-size:.86rem;color:#6e5b4b;margin-top:6px">원작 2장부터 17장까지, 앤이 초록 지붕 집에 와서 첫 친구를 사귀고 잃기까지의 이야기</p></div>
    <div class="type-card"><div class="type-emoji">${type.emoji}</div><div style="flex:1">
      <h3>나의 독서 유형: ${type.name}</h3><p>${lit ? type.l : type.e}</p>
      <div class="rp-gauge"><span style="width:${pct("canon")}%;background:linear-gradient(90deg,#c9504a,#ec8d84)"></span><span style="width:${pct("bal")}%;background:linear-gradient(90deg,#9cc49a,#5b8a5e)"></span><span style="width:${pct("imag")}%;background:linear-gradient(90deg,#8cbbe6,#3f78b0)"></span></div>
      <div class="rp-legend"><span style="color:#b9473f">📖 원작 ${sum.canon}번</span><span style="color:#5b8a5e">⚖️ 균형 ${sum.bal}번</span><span style="color:#3d73a8">✨ 상상 ${sum.imag}번</span></div>
      <p style="font-size:.8rem;color:#8a7461;margin-top:6px">게이지 누적: 원작 ${gc}% · 상상 ${100 - gc}%</p>
    </div></div>
    <div class="card"><h4>🗺️ 장별 여정</h4><div class="timeline">${timeline}</div></div>
    <div class="card"><h4>✍️ 내가 지어 준 이름과 생각</h4><div class="cmp"><div class="h">장면</div><div class="h">나의 이름·생각</div><div class="h">원작</div>${names}</div></div>
    <div class="grid2">
      <div class="card"><h4>💞 쌓아 온 마음</h4>${heartsHtml()}</div>
      <div class="card"><h4>🎁 모은 추억 (${S.items.length}개)</h4><p style="font-size:1.5rem;letter-spacing:4px;line-height:1.6">${itemIcons || "—"}</p>
        <h4 style="margin-top:12px">🎬 만난 결말 ${endCount}/${upto.length * 3}</h4><p style="font-size:.84rem;color:#6e5b4b">다른 선택으로 장을 다시 하면 숨은 결말을 더 만날 수 있어요.</p></div>
    </div>
    <div class="card"><h4>📝 돌아보며 쓰기</h4>
      <div class="mid-who">이름: <input id="midName" maxlength="20" placeholder="이름을 써 주세요" value="${esc(MID().name || "")}"><span class="print-name" style="display:none">${esc(MID().name || "")}</span></div>
      ${qs.map((q, i) => `<div class="mid-q"><p><b>${i + 1}.</b> ${q}</p><textarea class="mid-ans" data-i="${i}" rows="3" placeholder="여기에 내 생각을 써 보세요.">${esc(MID().a[i] || "")}</textarea><div class="mid-print" id="midP${i}">${esc(MID().a[i] || "")}</div></div>`).join("")}
      <div class="mid-saved" id="midSaved"></div>
      <p style="font-size:.8rem;color:#8a7461;margin-top:4px">쓴 내용은 이 기기에 저절로 저장돼요. 인쇄하면 쓴 글이 함께 인쇄되고, [📋 내 글 복사]로 선생님께 보낼 수도 있어요.</p></div>
    <div class="rp-btns">
      <button type="button" class="big alt" id="midPrint">🖨️ 중간 보고서 인쇄</button>
      <button type="button" class="big" id="midCopy">📋 내 글 복사</button>
      <button type="button" class="big sky" id="midBack">⬅ ${CH.num}장 리포트로</button>
      ${CHAPTERS[S.ch + 1] ? `<button type="button" class="big sky" id="midNext">➡ ${CH.num + 1}장으로</button>` : `<button type="button" class="big alt" disabled>➡ ${CH.num + 1}장 (준비 중)</button>`}
    </div></div>`;

  el.report.querySelectorAll(".mid-ans").forEach(ta => {

    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done)); else fallbackCopy(txt, done);
