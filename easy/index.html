  {w:`anne`, f:`anne_happy`, o:`diana`, bk:[`16-28`], cam:`in`,
   e:`나는 신이 나서 이야기를 쏟아 냈어. "지난번에 케이크를 만들다가 밀가루를 빼먹었어! 너랑 나에 대한 슬픈 이야기를 상상하느라고. 그리고 푸딩 소스에 생쥐가 빠졌는데, 손님 앞에서 '그 소스 쓰시면 안 돼요! 생쥐가 빠졌었어요!'라고 소리쳐 버렸지 뭐야!"`,
   l:`나는 신이 나서 이야기를 쏟아 냈다. 너와 나에 대한 슬픈 이야기를 상상하다가 케이크에 밀가루 넣는 걸 잊은 일, 수녀가 되는 상상을 하다가 푸딩 소스 뚜껑을 덮지 않아 생쥐가 빠져 죽은 일, 그리고 멋쟁이 체스터 로스 부인 앞에서 "아주머니, 그 소스 쓰시면 안 돼요! 생쥐가 빠져 죽어 있었어요!"라고 외쳐 버린 일까지.`},
  {w:`diana`, f:`anne_surprised`, o:`diana`, bk:[`16-29`,`16-30`], cam:`shake`,
   e:`그런데 다이애나가 휘청거리며 일어나더니, 다시 털썩 주저앉아 머리를 감쌌어. "나… 나 너무 어지러워. 당장 집에 가야겠어."`,
   l:`그런데 다이애나가 몹시 비틀거리며 일어섰다가, 다시 주저앉아 두 손으로 머리를 감쌌다. "나… 나 너무 어지러워." 혀가 조금 꼬인 목소리였다. "나… 당장 집에 가야겠어."`},
  {w:`anne`, f:`anne_sad`, o:`diana`, bk:[`16-31`,`16-35`,`16-37`],
   e:`"차도 안 마시고 가면 안 돼! 혹시 천연두에 걸린 거야? 그럼 내가 간호해 줄게!" 하지만 다이애나는 "집에 가야겠어."라는 말만 되풀이했어. 나는 배리 씨네 울타리까지 바래다주고, 돌아오는 내내 울었어.`,
   l:`"차도 안 마시고 가면 안 돼! 혹시 정말 천연두에 걸린 거니? 그렇다면 내가 가서 간호해 줄게. 절대 너를 버리지 않을 거야." 그러나 다이애나는 "집에 가야겠어"라는 말만 되풀이했다. 나는 실망의 눈물을 글썽이며 배리 씨네 울타리까지 바래다주고, 초록 지붕 집으로 돌아오는 내내 울었다.`},
  /* ---------- 월요일 ---------- */
  {bg:`ch2`, w:`anne`, in:1, f:`anne_sad`, o:`marilla_strict`, bk:[`16-38`,`16-42`,`16-43`], cam:`shake`,
   e:`월요일, 린드 부인 댁에 심부름 갔던 나는 엉엉 울며 돌아와 소파에 엎어졌어. "배리 부인이… 제가 다이애나를 술에 취하게 했대요! 저는 뼛속까지 못된 아이니까, 다시는 다이애나랑 못 놀게 하겠대요!"`,
   l:`월요일 오후, 린드 부인 댁에 심부름을 갔던 나는 눈물을 뚝뚝 흘리며 날듯이 돌아와 소파에 엎어졌다. "배리 부인이… 제가 토요일에 다이애나를 술에 취하게 해서 창피한 꼴로 집에 보냈대요. 저는 뼛속까지 나쁘고 못된 아이니까, 다시는, 다시는 다이애나랑 못 놀게 하겠대요."`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`, bk:[`16-45`,`16-46`,`16-47`], cam:`right`,
   e:`"술에 취하게 했다고? 대체 뭘 준 거니?" "산딸기 주스밖에 안 줬어요!" 아주머니는 거실 벽장으로 성큼성큼 가시더니… 병을 들고 얼굴이 씰룩씰룩해서 돌아오셨어.`,
   l:`"다이애나를 술에 취하게 했다고! 대체 그 애한테 뭘 준 거니?" "산딸기 주스밖에 안 줬어요." 아주머니는 거실 벽장으로 성큼성큼 걸어갔다. 선반 위의 병을 보는 순간 아주머니는 알아보았다. 그것은 에이번리에서 이름난 자기 집 3년 묵은 까치밥나무 열매 포도주였다. 그리고 산딸기 주스는 찬장이 아니라 지하실에 내려놓았다는 것도 그제야 생각났다.`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`, bk:[`16-49`,`16-51`],
   e:`"앤, 넌 정말 말썽에 휘말리는 데는 천재로구나. 산딸기 주스가 아니라 까치밥나무 열매 포도주를 준 거다. 그래도 울지 마라. 네 잘못은 없다. 그 큰 잔으로 세 잔이면 주스라도 탈이 났을 거다."`,
   l:`"앤, 넌 정말 말썽에 휘말리는 데는 천재로구나. 산딸기 주스가 아니라 까치밥나무 열매 포도주를 준 거다." 아주머니의 얼굴이 저도 모르게 씰룩였다. "세 잔씩이나 마셔 댄 다이애나도 욕심이 과했다. 자, 자, 울지 마라. 네 잘못은 없는 것 같다."`},
  {w:`marilla`, f:`anne_sad`, o:`marilla_strict`, when:s => s.flags.tasted,
   e:`"네가 맛이 이상하다고 한 잔만 마시게 했다고? …그래, 그건 잘했다. 그렇게 말씀드리마."`,
   l:`"맛이 이상하다고 한 잔에서 멈추게 했다고? …그래, 그건 잘한 일이다. 배리 부인께도 그대로 말씀드리마."`},
  {w:`anne`, f:`anne_sad`, o:`marilla_strict`, bk:[`16-52`],
   e:`"제 가슴이 찢어졌어요. 운명의 별들이 저를 거슬러 싸우고 있어요. 다이애나랑 저는 영원히 헤어졌어요. 처음 맹세할 때는 이런 일이 생길 줄 꿈에도 몰랐어요."`,
   l:`"울어야겠어요. 제 가슴이 찢어졌어요. 운명의 별들이 저를 거슬러 싸우고 있어요, 아주머니. 다이애나랑 저는 영원히 헤어졌어요. 아, 처음 우정을 맹세할 때는 이런 일이 생길 줄 꿈에도 몰랐어요."`},
  {w:`marilla`, f:`anne_surprised`, o:`marilla_strict`, bk:[`16-55`,`16-56`,`16-58`], cam:`in`,
   e:`아주머니가 배리 부인께 대신 설명하러 가셨어. 하지만 돌아오신 얼굴을 보니 소용없었다는 걸 알 수 있었어. "그렇게 막무가내인 여자는 처음 봤다! 실수였다고 해도 도무지 믿질 않아!"`,
   l:`아주머니가 대신 과수원 비탈 집에 다녀왔다. 그러나 돌아온 얼굴만 보아도 소용없었다는 걸 알 수 있었다. "배리 부인이라니, 원! 내가 본 여자들 중에 그렇게 막무가내인 사람은 처음이다. 다 실수였고 네 잘못이 아니라고 했는데, 도무지 믿질 않는구나."`},
  /* ---------- 해 질 녘, 배리 씨네 문간 ---------- */
  {bg:`ch5_dusk`, w:`anne`, in:1, f:`anne_sad`, bk:[`16-59`], cam:`out`,
   e:`나는 모자도 안 쓰고 쌀쌀한 가을 어스름 속으로 나갔어. 시든 토끼풀 밭을 지나, 통나무 다리를 건너, 창백한 작은 달빛을 받으며 가문비나무 숲을 올라갔어. 그리고 배리 씨네 문을 똑똑 두드렸어.`,
   l:`나는 모자도 쓰지 않은 채 쌀쌀한 가을 어스름 속으로 걸어 나갔다. 시든 토끼풀 밭을 내려가 통나무 다리를 건너고, 서쪽 숲 위에 낮게 걸린 창백한 달빛을 받으며 가문비나무 숲을 올랐다. 그리고 머뭇머뭇 문을 두드렸다.`},
  {w:`barry`, f:`anne_sad`, o:`barry`, bk:[`16-60`,`16-61`], cam:`right`,
   e:`문을 연 배리 부인의 얼굴이 딱딱하게 굳었어. "무슨 일이니?"`,
   l:`문을 연 배리 부인의 얼굴이 굳어졌다. 부인은 편견과 싫어하는 마음이 강한 사람이었고, 그 분노는 차갑고 뚱하게 오래가는 종류였다. 공평하게 말하자면, 부인은 내가 정말로 일부러 다이애나를 취하게 했다고 믿고 있었다. "무슨 일이니?"`},
  {t:`choice`, id:`C4`, kind:`talk`, label:`배리 부인께 용서를 빌다`, f:`anne_sad`, o:`barry`,
   q:{e:`화가 난 배리 부인 앞이에요. 앤은 어떻게 용서를 빌까요?`, l:`차갑게 굳은 배리 부인 앞. 앤은 어떤 말로 용서를 구할까요?`},
   note:{e:`원작의 앤은 두 손을 모으고 "부인이 가엾은 고아 소녀라고 상상해 보세요. 세상에 단 하나뿐인 친구를 일부러 취하게 하시겠어요?"라고 애원해요. 하지만 배리 부인은 앤의 어려운 말과 극적인 몸짓을 보고 자기를 놀린다고 생각해서 더 화가 났대요.`,
         l:`원작에서 앤은 "부인이 입양된 가엾은 고아이고 세상에 마음의 친구가 단 하나뿐이라고 상상해 보시라"며 극적으로 애원합니다. 린드 부인이라면 단숨에 마음이 녹았을 말이었지만, 배리 부인은 앤이 자기를 조롱한다고 여겨 더욱 굳어지지요.`},
   opts:[
    {type:`canon`, go:`f_c`, eff:{heart:{barry:-1}}, e:`두 손을 모으고 "부인이 가엾은 고아 소녀라고 상상해 보세요!"라고 온 마음을 다해 애원한다.`, l:`두 손을 맞잡고 "부인이 가엾은 고아 소녀라고 상상해 보세요"라며 절절히 애원한다.`, s:{e:`고아 소녀라고 상상해 보시라 애원했다`, l:`극적으로 애원했다`}},
    {type:`imag`, go:`f_i`, e:`"용서해 주신다면, 백 일 동안 한마디도 하지 않고 지내겠어요!" 침묵의 맹세를 바친다.`, l:`"용서해 주신다면 백 일 동안 한마디도 하지 않겠어요!" 침묵의 맹세를 바친다.`, s:{e:`백 일 동안 침묵하겠다고 맹세했다`, l:`백 일의 침묵을 맹세했다`}},
    {type:`bal`, go:`f_b`, eff:{flag:`factsOnly`, heart:{barry:1}}, e:`짧고 차분하게, 있었던 일을 있는 그대로 말씀드리고 다이애나는 혼내지 말아 달라고 부탁한다.`, l:`짧고 차분하게 사실만 말씀드리고, 다이애나는 꾸짖지 말아 달라고 청한다.`, s:{e:`있는 그대로 차분하게 말씀드렸다`, l:`사실만 차분히 전했다`}}
   ]},
  {id:`f_c`, w:`anne`, f:`anne_sad`, o:`barry`, bk:[`16-62`,`16-63`], cam:`in`,
   e:`나는 두 손을 꼭 모았어. "아, 배리 부인, 제발 용서해 주세요. 부인이 친절한 분들에게 입양된 가엾은 고아 소녀이고, 이 세상에 마음의 친구가 단 한 명뿐이라고 상상해 보세요. 그 친구를 일부러 취하게 하시겠어요? 제 인생이 슬픔의 먹구름으로 뒤덮이고 말 거예요!"`,
   l:`나는 두 손을 꼭 맞잡았다. "아, 배리 부인, 제발 저를 용서해 주세요. 저는 다이애나를… 취하게 하려던 게 아니에요. 부인이 친절한 분들에게 입양된 가엾은 고아 소녀이고, 이 세상에 마음의 친구가 단 한 명뿐이라고 상상해 보세요. 그 친구를 일부러 취하게 하시겠어요? 제발 다이애나와 놀지 못하게 하겠다는 말씀만은 마세요. 그러시면 제 인생은 슬픔의 먹구름으로 뒤덮이고 말 거예요."`},
  {w:`barry`, f:`anne_sad`, o:`barry`, bk:[`16-64`,`16-65`], cam:`right`,
   e:`하지만 배리 부인은 내 어려운 말과 몸짓이 자기를 놀리는 거라고 생각하셨나 봐. 얼굴이 더 차가워졌어. "너는 다이애나가 어울릴 만한 아이가 아닌 것 같구나. 집에 가서 얌전히 지내거라."`,
   l:`마음씨 좋은 린드 부인이었다면 눈 깜짝할 사이에 녹았을 말이었다. 그러나 배리 부인은 내 어려운 낱말과 극적인 몸짓을 의심했고, 내가 자기를 놀린다고 여겼다. "너는 다이애나가 어울릴 만한 아이가 아닌 것 같구나. 집에 가서 얌전히 지내거라."`},
  {t:`goto`, to:`f_m`},
  {id:`f_i`, w:`anne`, f:`anne_dreamy`, o:`barry`, fx:`dream`, cam:`up`, eff:{album:`silence`},
   e:`"배리 부인, 저를 용서해 주신다면… 저는 백 일 동안 한마디도 하지 않겠어요! 침묵의 맹세를 바칠게요. 저처럼 말 많은 아이에게 그건 탑에 갇히는 것보다 더 큰 벌이에요!"`,
   l:`"배리 부인, 용서해 주신다면… 백 일 동안 한마디도 하지 않겠어요. 침묵의 맹세를 바칠게요. 저처럼 말 많은 아이에게 그건 탑에 갇히는 것보다 무거운 벌이랍니다."`},
  {w:`barry`, f:`anne_dreamy`, o:`barry`,
   e:`"백 일이라. 지금 한 말만 해도 백 마디는 넘겠구나." 부인은 눈썹 하나 까딱하지 않으셨어. "다이애나는 너와 어울릴 수 없다."`,
   l:`"백 일이라. 지금 한 말만 해도 백 마디는 넘겠구나." 부인은 눈썹 하나 움직이지 않았다. "다이애나는 너와 어울릴 수 없다."`},
  {t:`goto`, to:`f_m`},
  {id:`f_b`, w:`anne`, f:`anne_sad`, o:`barry`, eff:{album:`factsOnly`},
   e:`나는 숨을 고르고, 짧고 차분하게 말씀드렸어. "벽장 맨 위 칸에 있던 병을 주스인 줄 알고 드렸어요. 일부러 그런 게 아니에요. 다이애나는 아무 잘못이 없으니, 다이애나는 혼내지 말아 주세요."`,
   l:`나는 숨을 고르고 짧고 차분하게 말했다. "벽장 맨 위 칸에 있던 병을 주스인 줄 알고 내놓았어요. 일부러 그런 게 아니에요. 다이애나에게는 아무 잘못이 없으니, 다이애나만은 꾸짖지 말아 주세요."`},
  {w:`anne`, f:`anne_sad`, o:`barry`, when:s => s.flags.tasted,
   e:`"맛이 이상해서 한 잔만 마시게 했어요. 그래도 제가 더 일찍 알아차렸어야 했어요. 죄송합니다."`,
   l:`"맛이 이상해서 한 잔에서 멈추게 했어요. 그래도 더 일찍 알아차렸어야 했어요. 죄송합니다."`},
  {w:`barry`, f:`anne_sad`, o:`barry`, cam:`right`,
   e:`배리 부인은 잠깐 나를 내려다보셨어. 굳은 입매가 아주 조금, 정말 아주 조금 흔들린 것 같았어. 하지만 부인은 고개를 저으셨어. "…그래도 안 된다. 집에 가거라."`,
   l:`배리 부인은 잠시 나를 내려다보았다. 굳게 다문 입매가 아주 조금, 정말 아주 조금 흔들린 듯했다. 그러나 부인은 고개를 저었다. "…그래도 안 된다. 집에 가거라."`},
  {id:`f_m`, w:`anne`, f:`anne_sad`, o:`barry`, bk:[`16-66`,`16-67`,`16-68`], cam:`in`,
   e:`내 입술이 떨렸어. "작별 인사를 하게… 딱 한 번만 다이애나를 만나게 해 주시면 안 될까요?" "다이애나는 아빠랑 카모디에 갔다." 문이 쾅 닫혔어.`,
   l:`내 입술이 떨렸다. "작별 인사를 하게 딱 한 번만 다이애나를 만나게 해 주시면 안 될까요?" "다이애나는 아빠랑 카모디에 갔다." 배리 부인은 그렇게 말하고 들어가 문을 닫아 버렸다.`},
  {bg:`ch2_room`, w:`anne`, in:1, f:`anne_sad`, bk:[`16-69`,`16-70`], cam:`out`,
   e:`나는 절망 속에서 오히려 차분해져서 돌아왔어. "마지막 희망이 사라졌어요, 아주머니." 그날 밤 나는 울다 지쳐 잠이 들었어.`,
   l:`나는 절망 속에서 오히려 고요해진 채 초록 지붕 집으로 돌아왔다. "마지막 희망이 사라졌어요, 아주머니." 그날 밤 나는 울다 지쳐 잠들었다.`},
  {w:`anne`, in:1, f:`anne_sad`, o:`marilla_warm`, bk:[`16-72`,`16-73`], cam:`in`,
   e:`나중에 매슈 아저씨가 살짝 알려 주셨어. 그날 밤 아주머니가 내 방에 몰래 들어와서, 눈물 자국 난 내 얼굴에서 머리카락을 쓸어 넘기며 "가엾은 것." 하고 중얼거리셨대. 그리고… 내 뺨에 입을 맞추셨대.`,
   l:`나중에 매슈 아저씨가 살며시 알려 주었다. 그날 밤 아주머니가 동쪽 다락방에 몰래 들어와, 눈물 자국 난 내 얼굴에서 흘러내린 곱슬머리를 걷어 올리며 "가엾은 것" 하고 중얼거렸다고. 그리고 몸을 숙여, 베개 위의 발그레한 내 뺨에 입을 맞추었다고.`},
  /* ---------- 샘가의 작별 ---------- */
  {bg:`ch3_bridge`, w:`anne`, in:1, f:`anne_surprised`, o:`diana`, bk:[`17-1`,`17-2`,`17-3`,`17-4`], cam:`out`,
   e:`다음 날 오후, '{spring}'에서 다이애나가 손짓하고 있었어! 나는 희망을 품고 날아갔지만, 다이애나의 얼굴을 보자 희망이 사그라졌어. "엄마가 다시는 너랑 놀지 말래. 딱 10분만 작별 인사하고 오래. 시계를 보면서 재고 계셔."`,
   l:`이튿날 오후, 부엌 창가에서 조각보를 꿰매다 내다보니 '{spring}'에서 다이애나가 수수께끼처럼 손짓하고 있었다. 나는 눈 깜짝할 새 달려 내려갔지만, 다이애나의 풀 죽은 얼굴에 희망은 사그라졌다. "엄마가 다시는 너랑 놀지 말래. 작별 인사만 하고 오게 해 달라고 겨우 졸랐어. 딱 10분만 있으래. 엄마가 시계를 보면서 재고 계셔."`},
  {w:`diana`, f:`anne_sad`, o:`diana`, when:s => s.flags.factsOnly,
   e:`"그런데 앤, 어젯밤에 엄마가 한참 동안 창밖을 보시더라. '그 애가 다이애나는 혼내지 말라고 하더구나' 하고 혼잣말을 하셨어."`,
   l:`"그런데 앤, 어젯밤 엄마가 한참 창밖을 보시더니 혼잣말을 하셨어. '그 애가 다이애나만은 꾸짖지 말라고 하더구나' 하고."`},
  {w:`anne`, f:`anne_sad`, o:`diana`, bk:[`17-5`,`17-6`],
   e:`"영원한 작별 인사를 하기에 10분은 너무 짧아. 다이애나, 더 소중한 친구가 생겨도 나를 절대 잊지 않겠다고 약속해 줄래?" "물론이지! 나는 다른 마음의 친구는 절대 안 사귈 거야. 너만큼 누구를 사랑할 수는 없어."`,
   l:`"영원한 작별 인사를 하기에 10분은 너무 짧아." 나는 눈물을 글썽였다. "다이애나, 앞으로 더 소중한 친구들이 그대를 아껴 주더라도 어린 시절의 친구인 나를 절대 잊지 않겠다고 약속해 줄래?" "물론이지. 나는 다른 마음의 친구는 절대 안 사귈 거야. 너만큼 누군가를 사랑할 수는 없을 거야."`},
  {w:`anne`, f:`anne_surprised`, o:`diana`, bk:[`17-7`,`17-8`], cam:`in`,
   e:`"다이애나… 너, 나를 사랑하니?" "그럼, 당연하지. 몰랐어?"`,
   l:`"아, 다이애나." 나는 두 손을 맞잡았다. "너 나를 사랑하니?" "그럼, 당연하지. 몰랐어?"`},
  {w:`anne`, f:`anne_happy`, o:`diana`, bk:[`17-9`,`17-10`], cam:`up`,
   e:`"응, 몰랐어. 나는 누가 나를 사랑할 수 있을 거라고 생각해 본 적이 없어. 내가 기억하는 한, 나를 사랑해 준 사람은 아무도 없었거든. 아, 한 번만 더 말해 줘." "나는 너를 진심으로 사랑해, 앤. 앞으로도 언제나."`,
   l:`"응." 나는 숨을 길게 들이쉬었다. "네가 나를 좋아한다고는 생각했지만, 사랑해 주리라고는 감히 바라지도 못했어. 나는 누가 나를 사랑할 수 있다고 생각해 본 적이 없어. 내가 기억하는 한 나를 사랑해 준 사람은 아무도 없었거든. 아, 이건 그대와 갈라진 어두운 길을 영원히 비춰 줄 한 줄기 빛이야. 한 번만 더 말해 줘." "나는 너를 진심으로 사랑해, 앤. 앞으로도 언제나 그럴 거야."`},
  {t:`choice`, id:`C5`, kind:`act`, label:`작별의 정표`, f:`anne_sad`, o:`diana`,
   q:{e:`이제 헤어져야 해요. 앤은 다이애나와 어떤 작별의 정표를 나눌까요?`, l:`10분의 작별. 앤은 어떤 정표로 이 순간을 간직할까요?`},
   note:{e:`원작의 앤은 앞치마 주머니에 있던 조각보 가위로 다이애나의 까만 곱슬머리 한 타래를 잘라요. "작은 주머니에 꿰매서 평생 목에 걸고 다닐 거예요!"`,
         l:`원작에서 앤은 "그대의 칠흑 같은 머리카락을 한 타래 달라"고 청하고, 다이애나는 "자를 게 있어?" 하고 현실적으로 되묻습니다. 앤은 조각보 가위로 곱슬머리 한 가닥을 엄숙하게 잘라 내지요.`},
   opts:[
    {type:`canon`, go:`k_c`, eff:{item:`lock`}, e:`조각보 가위로 다이애나의 곱슬머리 한 타래를 잘라 영원히 간직하기로 한다.`, l:`조각보 가위로 다이애나의 곱슬머리 한 타래를 잘라 정표로 간직한다.`, s:{e:`다이애나의 머리카락을 간직했다`, l:`머리카락 한 타래를 정표로 삼았다`}},
    {type:`imag`, go:`k_i`, eff:{item:`pebble`}, e:`샘가의 조약돌 두 개에 서로의 이름을 새겨 하나씩 나눠 갖는다.`, l:`샘가의 조약돌 두 개에 서로의 이름을 새겨 하나씩 나눠 갖는다.`, s:{e:`이름 새긴 조약돌을 나눴다`, l:`조약돌을 정표로 나눴다`}},
    {type:`bal`, go:`k_b`, eff:{flag:`mailbox`, heart:{diana:1}}, e:`통나무 다리 밑 틈을 '비밀 우체통'으로 정하고, 편지를 주고받자고 약속한다.`, l:`통나무 다리 밑 틈을 비밀 우체통으로 삼아, 편지를 주고받기로 약속한다.`, s:{e:`비밀 우체통을 정했다`, l:`편지로 이어지기로 했다`}}
   ]},
  {id:`k_c`, w:`anne`, f:`anne_dreamy`, o:`diana`, bk:[`17-11`,`17-12`,`17-13`],
   e:`"다이애나, 작별의 정표로 그대의 까만 머리카락을 한 타래 주겠어?" "자를 게 있어?" "응, 앞치마 주머니에 조각보 가위가 있어." 나는 엄숙하게 곱슬머리 한 가닥을 잘랐어. "잘 있거라, 사랑하는 나의 친구여."`,
   l:`"다이애나, 작별의 정표로 영원히 간직할 수 있게, 그대의 칠흑 같은 머리카락을 한 타래 주겠어?" "자를 게 있어?" 다이애나가 눈물을 닦으며 현실로 돌아와 물었다. "다행히 앞치마 주머니에 조각보 가위가 있어." 나는 엄숙하게 곱슬머리 한 가닥을 잘랐다. "잘 있거라, 사랑하는 나의 친구여. 이제부터 우리는 이웃에 살면서도 남남처럼 지내야 하리. 하지만 내 마음은 언제나 그대에게 충실하리라."`},
  {t:`goto`, to:`k_m`},
  {id:`k_i`, w:`anne`, f:`anne_dreamy`, o:`diana`, fx:`dream`, cam:`up`, eff:{album:`pebble`},
   e:`나는 샘가에서 반질반질한 조약돌 두 개를 주웠어. 하나에는 '다이애나', 하나에는 '앤'이라고 새겼지. "샘의 요정이 이 돌에 우리 우정을 봉인해 줄 거야. 서로의 이름을 품고 다니자."`,
   l:`나는 샘가에서 반질반질한 조약돌 두 개를 주웠다. 하나에는 '다이애나', 하나에는 '앤'이라 새겼다. "샘의 요정이 이 돌에 우리의 우정을 봉인해 줄 거야. 서로의 이름을 품고 다니자."`},
  {w:`diana`, f:`anne_dreamy`, o:`diana`, fx:`dream`,
   e:`다이애나는 '앤'이 새겨진 돌을 두 손으로 꼭 쥐었어. "평생 간직할게."`,
   l:`다이애나는 '앤'이 새겨진 돌을 두 손으로 꼭 감싸 쥐었다. "평생 간직할게."`},
  {t:`goto`, to:`k_m`},
  {id:`k_b`, w:`anne`, f:`anne_happy`, o:`diana`, eff:{album:`mailbox`},
   e:`"다이애나, 우리 영원히 헤어지는 게 아니야. 통나무 다리 밑 저 틈을 우리 둘만의 비밀 우체통으로 하자. 편지는 주고받을 수 있잖아!"`,
   l:`"다이애나, 우리는 영원히 헤어지는 게 아니야. 통나무 다리 밑 저 틈을 우리 둘만의 비밀 우체통으로 삼자. 만날 수는 없어도 편지는 주고받을 수 있잖아."`},
  {w:`diana`, f:`anne_happy`, o:`diana`,
   e:`다이애나의 눈이 반짝였어. "좋아! 매일 들러 볼게. 엄마가 기다리라고 하시면… 기다리면서 편지 쓸게."`,
   l:`다이애나의 눈이 반짝였다. "좋아, 매일 들러 볼게. 엄마가 기다리라고 하시면… 기다리면서 편지를 쓸게."`},
  {id:`k_m`, w:`anne`, in:1, f:`anne_sad`, o:`diana`, bk:[`17-14`], cam:``,
   e:`나는 다이애나가 안 보일 때까지 서서 지켜봤어. 다이애나가 뒤돌아볼 때마다 슬프게 손을 흔들었어.`,
   l:`나는 다이애나가 보이지 않을 때까지 서서 지켜보았다. 다이애나가 뒤돌아볼 때마다 슬프게 손을 흔들었다.`},
  {bg:`ch2`, w:`marilla`, f:`anne_sad`, o:`marilla_strict`, bk:[`17-15`,`17-16`],
   e:`"다 끝났어요. 저는 다시는 친구를 못 사귈 거예요. 아마 오래 못 살 거예요…" "말을 그렇게 잘하는 걸 보니, 슬퍼서 죽을 걱정은 없겠구나." 아주머니가 무정하게 말씀하셨어.`,
   l:`"다 끝났어요. 저는 다시는 친구를 못 사귈 거예요. 진짜 친구를 사귀고 나니 상상 속 소녀들로는 마음이 채워지지 않아요. 저는 오래 살 것 같지 않아요." "말을 그렇게 잘하는 걸 보니 슬퍼서 죽을 걱정은 별로 없겠구나, 앤." 아주머니가 무정하게 말했다.`},
  /* ---------- 다시 학교로 ---------- */
  {w:`anne`, f:`anne_sad`, o:`marilla_warm`, bk:[`17-17`,`17-18`,`17-19`], cam:`in`,
   e:`다음 월요일, 나는 책 바구니를 들고 내려왔어. "저 다시 학교에 갈래요. 학교에서는 다이애나를 바라볼 수라도 있으니까요." 아주머니는 기쁜 걸 감추시며 "석판 깨는 소동만 없으면 좋겠다."라고 하셨어.`,
   l:`다음 월요일, 나는 책 바구니를 팔에 걸고 입술을 꼭 다문 채 내려왔다. "저 다시 학교에 갈래요. 친구를 무자비하게 빼앗긴 지금, 제 삶에 남은 건 그것뿐이에요. 학교에서는 다이애나를 바라보며 지나간 날을 떠올릴 수 있으니까요." 아주머니는 기쁜 마음을 감추며 말했다. "지나간 날 대신 공부나 곰곰이 떠올리려무나. 사람 머리에 석판 깨는 소동은 더 듣지 않길 바란다."`},
  {w:`anne`, in:1, f:`anne_happy`, o:`marilla_warm`, when:s => s.flags.schoolNews || s.flags.missSchool,
   e:`다들 나를 보고 싶어 한다던 다이애나의 말이 떠올랐어. 조금은 용기가 났어.`,
   l:`모두가 나를 그리워한다던 다이애나의 말이 떠올랐다. 조금은 용기가 났다.`},
  {bg:`ch4`, w:`anne`, in:1, f:`anne_happy`, bk:[`17-20`,`17-21`,`17-22`], cam:`out`,
   e:`학교에서는 모두가 두 팔 벌려 나를 반겨 줬어! 루비는 파란 자두 세 개를 몰래 건네고, 엘라 메이는 커다란 노란 팬지 그림을 주고, 줄리아 벨은 연분홍 종이에 시를 적어 줬어. "황혼이 저녁 장막을 드리우고 / 별 하나로 그 자락을 꽂아 둘 때 / 기억해 줘, 너에게는 친구가 있다는 걸."`,
   l:`학교는 두 팔 벌려 나를 맞아 주었다. 놀이에는 내 상상력이, 노래에는 내 목소리가, 점심시간의 책 읽기에는 내 연기가 그리웠던 것이다. 루비 길리스는 파란 자두 세 개를, 엘라 메이는 꽃 카탈로그에서 오린 커다란 노란 팬지를 건넸고, 줄리아 벨은 물결무늬 연분홍 종이에 시를 옮겨 적어 주었다. "황혼이 저녁 장막을 드리우고 / 별 하나로 그 자락을 꽂아 둘 때 / 기억해 줘, 너에게는 친구가 있다는 걸 / 그 친구가 아무리 멀리 있어도."`},
  {w:`anne`, in:1, f:`anne_surprised`, bk:[`17-24`], cam:`in`,
   e:`그런데 점심시간이 끝나고 자리에 가 보니, 책상 위에 크고 빨간 '딸기 사과'가 놓여 있었어. 한 입 베어 물려다가 생각났어. 에이번리에서 딸기 사과가 열리는 곳은… 블라이스 씨네 과수원뿐이라는 걸!`,

  {id:`a_b`, w:`anne`, in:1, f:`anne_sad`, o:`gilbert`,

  {id:`a_m`, w:`anne`, in:1, f:`anne_sad`, o:`diana`, bk:[`17-27`,`17-28`],
   e:`그래도 거티 파이 옆에 앉은 다이애나한테서는 눈길 한 번 오지 않았어. "다이애나가 한 번쯤은 웃어 줄 수도 있었을 텐데…" 그런데 다음 날 아침, 꼬깃꼬깃 접힌 쪽지와 작은 꾸러미가 내게 건네져 왔어!`,
   l:`그러나 거티 파이와 짝이 된 다이애나 배리에게서만은 아무 선물도 눈길도 오지 않았고, 그것이 나의 작은 승리를 씁쓸하게 했다. "다이애나가 한 번쯤은 웃어 줄 수도 있었을 텐데." 그런데 이튿날 아침, 무시무시하게 꼬이고 접힌 쪽지와 작은 꾸러미가 내게 건네져 왔다.`},
  {w:`diana`, f:`anne_happy`, o:`diana`, bk:[`17-28`,`17-29`,`17-30`], cam:`in`, eff:{item:`bookmark`, heart:{diana:1}},
   e:`"사랑하는 앤에게. 엄마가 학교에서도 너랑 말하지 말래. 내 잘못이 아니니까 화내지 마. 나는 예전과 똑같이 너를 사랑해. 빨간 종이로 새 책갈피를 만들었어. 이걸 볼 때마다 기억해 줘. 너의 진정한 친구, 다이애나 배리."`,
   l:`"사랑하는 앤에게. 엄마가 학교에서도 너랑 놀거나 말하지 말래. 내 잘못이 아니니까 나한테 화내지 마. 나는 예전과 똑같이 너를 사랑해. 비밀을 다 털어놓을 네가 너무너무 보고 싶어. 빨간 얇은 종이로 새 책갈피를 하나 만들었어. 이걸 볼 때마다 기억해 줘. 너의 진정한 친구, 다이애나 배리."`},
  {w:`diana`, f:`anne_happy`, o:`diana`, when:s => s.flags.mailbox,
   e:`쪽지 끝에는 작게 이렇게 적혀 있었어. "추신: 통나무 다리 우체통에도 편지 넣어 뒀어!"`,
   l:`쪽지 끄트머리에는 작은 글씨가 덧붙어 있었다. "추신: 통나무 다리 우체통에도 편지 넣어 뒀어!"`},
  {w:`anne`, f:`anne_happy`, o:`diana`, bk:[`17-32`,`17-33`,`17-34`,`17-35`,`17-36`],
   e:`나는 책갈피에 입을 맞추고 곧바로 답장을 보냈어. "나의 사랑하는 다이애나에게. 너는 엄마 말씀을 따라야 하니까 당연히 화나지 않았어. 우리 영혼은 서로 통할 수 있어. 죽음이 우리를 갈라놓을 때까지 너의, 앤 또는 코델리아 셜리."`,
   l:`나는 쪽지를 읽고 책갈피에 입을 맞춘 뒤 곧바로 교실 건너편으로 답장을 보냈다. "나의 사랑하는 다이애나에게. 너는 엄마 말씀을 따라야 하니까 당연히 너한테 화나지 않았어. 우리의 영혼은 서로 통할 수 있어. 너의 예쁜 선물은 영원히 간직할게. 죽음이 우리를 갈라놓을 때까지 너의, 앤 또는 코델리아 셜리."`},
  {w:`anne`, in:1, f:`anne_happy`, o:`gilbert`, bk:[`17-40`], cam:`right`,
   e:`그 뒤로 나는 온 마음을 다해 공부했어. 길버트 블라이스한테는 어느 과목에서도 지지 않을 거야! 철자도, 산수도, 1등은 우리 둘 사이를 오락가락했어. 어느 끔찍한 날엔 동점이 되어 칠판에 이름이 나란히 쓰이기까지 했어!`,
   l:`그 뒤로 나는 길버트 블라이스에게만은 어느 과목에서도 지지 않겠다고 마음먹고 공부에 뛰어들었다. 영광은 두 사람 사이를 오락가락했다. 어떤 날은 길버트가 철자 1등, 어떤 날은 내가 긴 빨간 머리를 휙 넘기며 그를 꺾었다. 어느 끔찍한 날에는 동점이 되어 칠판에 이름이 나란히 적혔다. '주목하시오'만큼이나 끔찍한 일이었다.`},

   l:`둘째 달 시험에서 내가 5점 차로 이기자, 길버트는 온 학교 앞에서 진심으로 축하해 주었다. 그 바람에 승리의 맛이 바래 버렸다. 그가 패배의 쓴맛을 느꼈더라면 훨씬 달콤했을 텐데.`},

  {id:`E_canon`, bg:`ch2`, w:`anne`, f:`anne_sad`, o:`marilla_warm`, bk:[`17-41`,`17-42`], cam:`in`, eff:{album:`e_canon`},
   e:`학기가 끝날 무렵, 나는 길버트와 함께 5학년 반으로 올라가 기하를 배우게 됐어. "아주머니, 기하는 정말 끔찍해요! 상상할 여지가 하나도 없어요. 다이애나도 저보다 잘해요. 하지만 다이애나한테 지는 건 괜찮아요. 저는 여전히 꺼지지 않는 사랑으로 다이애나를 사랑하거든요."`,
   l:`학기가 끝날 무렵, 나는 길버트와 함께 5학년 반으로 올라가 라틴어, 기하, 프랑스어, 대수를 배우기 시작했다. 그리고 기하에서 나는 나의 워털루를 만났다. "정말 끔찍한 과목이에요, 아주머니. 상상할 여지가 하나도 없어요. 다이애나도 저보다 잘해요. 하지만 다이애나에게 지는 건 괜찮아요. 지금은 남남처럼 지내도, 저는 여전히 꺼지지 않는 사랑으로 다이애나를 사랑하니까요."`},
  {w:`anne`, f:`anne_happy`, o:`marilla_warm`, bk:[`17-42`], cam:`up`,
   e:`"다이애나 생각을 하면 가끔 정말 슬퍼요. 하지만 정말이지, 아주머니, 이렇게 흥미로운 세상에서 오래 슬퍼하고 있을 수는 없잖아요, 그렇죠?"`,
   l:`"다이애나를 생각하면 가끔 정말 슬퍼요. 하지만 정말이지, 아주머니, 이렇게 흥미로운 세상에서 오래 슬퍼하고 있을 수는 없잖아요, 그렇죠?"`},

   e:`그날 밤 나는 새 이야기를 썼어. 제목은 '얼음 성의 마녀 왕비'. 마녀 왕비는 두 공주가 만나지 못하게 성문을 꽁꽁 얼려 버려. 하지만 어느 겨울밤, 어린 왕자가 열병에 걸려 아무도 고치지 못할 때, 빨간 머리 공주가 나타나 왕자를 구해.`,
   l:`그날 밤 나는 새 이야기를 지었다. 제목은 '얼음 성의 마녀 왕비'. 마녀 왕비는 두 공주가 만나지 못하도록 성문을 꽁꽁 얼려 버린다. 그러나 어느 겨울밤, 어린 왕자가 아무도 고치지 못하는 열병에 걸렸을 때, 빨간 머리 공주가 눈보라를 뚫고 나타나 왕자를 구해 낸다.`},
  {w:`anne`, in:1, f:`anne_happy`, fx:`dream`, when:s => s.items.includes(`pebble`),

   l:`나는 '다이애나'라 새긴 조약돌을 꼭 쥐었다. 이야기 속에서는 바로 그 순간, 마녀 왕비의 얼음 같은 마음이 사르르 녹아내린다.`},
  {w:`anne`, in:1, f:`anne_dreamy`, fx:`dream`,
   e:`이야기는 거기서 끝났어. 마녀 왕비가 성문을 활짝 열고, 두 공주는 다시 손을 잡았지. 언젠가… 정말로 그런 날이 올까?`,

  talk: {
    e: [`앤은 어떻게 미니 메이를 구할 수 있었을까요? 고아원과 해먼드 아주머니네에서 힘들게 지낸 시간이 이날 어떻게 도움이 되었는지 이야기해 봐요.`,

  nodes: [
  /* ---------- 1월의 밤 ---------- */
  {id:`b1`, bg:`ch6`, w:`anne`, in:1, f:`anne_happy`, bk:[`18-1`,`18-2`], cam:`out`,
   e:`1월이 되었어. 캐나다의 수상이 샬럿타운에 와서 큰 연설을 한대. 마릴라 아주머니는 진짜 수상을 볼 수 있는 기회라며 린드 부인이랑 시내로 가셨어. 집에는 매슈 아저씨랑 나만 남았지.`,
   l:`1월, 캐나다의 수상이 샬럿타운에서 대규모 집회를 연다는 소식이 섬을 들썩이게 했다. 에이번리 사람들 대부분이 시내로 몰려갔고, 진짜 살아 있는 수상을 볼 유일한 기회일지 모른다며 마릴라 아주머니도 린드 부인을 따라나섰다. 집에는 매슈 아저씨와 나만 남았다.`},
  {w:`anne`, in:1, f:`anne_sad`, when:s => s.flags.mailbox,

   l:`다이애나와는 여전히 학교에서도 말을 나눌 수 없었다. 그래도 통나무 다리 아래 우체통에는 이따금 편지가 와 있었다.`},
  {w:`anne`, in:1, f:`anne_sad`, when:s => !s.flags.mailbox,
   e:`다이애나랑은 아직 학교에서도 말을 못 해. 교실 건너편에서 가끔 눈이 마주치면 다이애나가 슬프게 웃어 줄 뿐이야.`,
   l:`다이애나와는 여전히 학교에서도 말을 나눌 수 없었다. 교실 건너편에서 눈이 마주칠 때면 다이애나는 그저 슬프게 웃어 보일 뿐이었다.`},
  {w:`anne`, in:1, f:`anne_dreamy`, o:`matthew`, bk:[`18-3`], cam:`in`,
   e:`부엌 난로에선 불이 환하게 타고, 창유리엔 하얀 서리꽃이 반짝였어. 아저씨는 소파에서 신문을 들고 꾸벅꾸벅 조셨고, 나는 기하 공부를 했어. 그런데 시계 선반 위에 제인이 빌려준 새 책이 있었어. 읽으면 가슴이 떨린다는 바로 그 책!`,
   l:`옛날식 난로에서 불이 환히 타오르고 창유리에는 푸르스름한 서리꽃이 반짝였다. 매슈 아저씨는 소파에서 농업 신문을 든 채 꾸벅꾸벅 졸았고, 나는 굳은 결심으로 기하를 공부했다. 하지만 시계 선반 위에는 제인 앤드루스가 빌려준 새 책이 놓여 있었다. 그 책을 펼치면 내일 길버트 블라이스가 이길 것이다.`},
  {w:`anne`, f:`anne_sad`, o:`matthew`, bk:[`18-4`,`18-5`,`18-6`,`18-7`],
   e:`"아저씨, 기하 공부해 보셨어요? 기하가 제 인생에 먹구름을 드리우고 있어요." "글쎄다… 필립스 선생이 그러던데, 네가 학교에서 제일 똑똑하고 실력이 쑥쑥 늘고 있다더구나."`,
   l:`"아저씨, 학교 다니실 때 기하 공부해 보셨어요? 기하가 제 인생 전체에 먹구름을 드리우고 있어요." "글쎄다, 지난주에 필립스 선생이 그러더라. 네가 학교에서 제일 똑똑한 학생이고 실력이 쑥쑥 늘고 있다고." 아저씨는 나를 칭찬하는 사람이면 누구든 괜찮은 사람이라고 여겼다.`},
  {w:`anne`, f:`anne_dreamy`, o:`matthew`, bk:[`18-11`,`18-13`,`18-14`],
   e:`"아저씨는 어느 당에 투표하세요?" "보수당." "그럼 저도 보수당이에요! …아저씨는 구애해 보신 적 있어요?" "글쎄다, 해 본 적 없는 것 같구나." 아저씨는 그런 건 평생 생각해 본 적도 없는 얼굴이셨어.`,
   l:`"아저씨는 어느 당에 투표하세요?" "보수당." 아저씨에게 보수당 투표는 신앙의 일부나 다름없었다. "그럼 저도 보수당이에요." 나는 단호하게 말했다. "아저씨는 구애해 보신 적 있어요?" "글쎄다, 아니, 해 본 적 없는 것 같구나." 평생 그런 일은 한 번도 떠올려 본 적 없는 얼굴이었다.`},
  {t:`choice`, id:`C1`, kind:`act`, label:`시계 선반 위의 새 책`, f:`anne_dreamy`, o:`matthew`,
   q:{e:`읽고 싶은 새 책이 눈앞에! 하지만 공부를 마쳐야 해요. 앤은 어떻게 할까요?`, l:`가슴 떨리게 한다는 새 책의 유혹. 공부를 마쳐야 하는 앤은 어떻게 할까요?`},
   note:{e:`원작의 앤은 책을 거실 잼 찬장에 넣고 잠근 다음, 열쇠를 매슈 아저씨께 맡겨요. "제가 무릎 꿇고 애원해도 공부 끝나기 전엔 주시면 안 돼요!" 유혹은 열쇠가 없을 때 훨씬 이기기 쉽대요.`,
         l:`원작에서 앤은 책을 잼 찬장에 넣어 잠그고 열쇠를 매슈에게 맡기며, 무릎 꿇고 애원해도 주지 말라고 당부합니다. "유혹을 이겨 내라고 말하기는 쉽지만, 열쇠가 없으면 훨씬 쉽게 이겨 낼 수 있다"는 앤다운 지혜가 담긴 장면이지요.`},
   opts:[
    {type:`canon`, go:`k_c`, eff:{item:`jamKey`}, e:`책을 잼 찬장에 넣고 잠근 다음, 열쇠를 매슈 아저씨께 맡긴다.`, l:`책을 잼 찬장에 넣어 잠그고, 열쇠를 매슈 아저씨께 맡긴다.`, s:{e:`책을 잠그고 열쇠를 맡겼다`, l:`책을 잠가 유혹을 끊었다`}},
    {type:`imag`, go:`k_i`, e:`책을 '봉인된 마법서'라고 상상하고, 공부를 다 해야 풀리는 주문을 건다.`, l:`책을 '봉인된 마법서'라 상상하고, 공부를 마쳐야 풀리는 주문을 건다.`, s:{e:`봉인된 마법서로 만들었다`, l:`상상의 봉인을 걸었다`}},
    {type:`bal`, go:`k_b`, eff:{heart:{matthew:1}}, e:`"기하 문제 세 개 풀 때마다 한 장씩 읽을게요!" 아저씨와 약속한다.`, l:`"기하 문제 세 개마다 한 장씩." 아저씨와 공정한 약속을 맺는다.`, s:{e:`세 문제에 한 장씩 약속했다`, l:`공부와 책 사이에 약속을 맺었다`}}
   ]},
  {id:`k_c`, w:`anne`, f:`anne_happy`, o:`matthew`, bk:[`18-18`],
   e:`"이 책을 잼 찬장에 넣고 잠근 다음 열쇠를 아저씨께 드릴게요. 제가 무릎 꿇고 애원해도 공부 끝나기 전엔 절대 주시면 안 돼요! 유혹을 이기라는 말은 쉽지만, 열쇠가 없으면 훨씬 쉽거든요."`,
   l:`"이 책을 거실 잼 찬장에 넣고 잠근 다음 열쇠를 아저씨께 드릴게요. 제 공부가 끝나기 전에는, 제가 무릎 꿇고 애원해도 주시면 안 돼요. 유혹을 이겨 내라고 말하기는 쉽지만, 열쇠가 없으면 훨씬 쉽게 이겨 낼 수 있거든요."`},
  {t:`goto`, to:`k_m`},
  {id:`k_i`, w:`anne`, f:`anne_dreamy`, o:`matthew`, fx:`dream`, cam:`up`, eff:{album:`sealedBook`},
   e:`"이건 이제 봉인된 마법서예요! 기하 문제를 다 풀어야만 봉인이 풀리는 주문을 걸었어요. 수리수리… 피타고라스!" 아저씨가 신문 너머로 빙그레 웃으셨어.`,
   l:`"이제부터 이건 봉인된 마법서예요. 기하 문제를 모두 풀어야만 봉인이 풀리는 주문을 걸었거든요. 수리수리… 피타고라스!" 아저씨가 신문 너머로 빙그레 웃었다.`},
  {t:`goto`, to:`k_m`},
  {id:`k_b`, w:`anne`, f:`anne_happy`, o:`matthew`, eff:{album:`pageDeal`},
   e:`"아저씨, 우리 약속해요. 기하 문제 세 개 풀 때마다 딱 한 장씩만 읽을게요. 아저씨가 심판이에요!" "글쎄다… 그거 공평하구나."`,
   l:`"아저씨, 약속해요. 기하 문제 세 개를 풀 때마다 딱 한 장씩만 읽을게요. 아저씨가 심판이에요." "글쎄다… 그거 참 공평하구나."`},
  {id:`k_m`, w:`anne`, f:`anne_happy`, o:`matthew`, bk:[`18-18`,`18-19`],
   e:`"그 대신 지하실에서 회색 사과 좀 가져올까요?" "글쎄다, 먹고 싶을지도 모르겠구나." 아저씨는 회색 사과를 안 드시지만, 내가 좋아하는 걸 아셨거든.`,
   l:`"그런 다음 지하실에서 회색 사과를 좀 가져올까요?" "글쎄다, 먹고 싶을지도 모르겠구나." 아저씨는 회색 사과를 드시지 않았지만, 내가 그 사과를 좋아한다는 걸 알고 있었다.`},
  /* ---------- 다이애나가 뛰어들다 ---------- */
  {w:`anne`, in:1, f:`anne_surprised`, o:`diana`, bk:[`18-20`], cam:`shake`,
   e:`내가 사과 접시를 들고 지하실에서 올라오는 순간, 부엌문이 벌컥 열렸어. 다이애나였어! 얼굴은 하얗게 질리고 숨을 헐떡이고 있었어. 너무 놀라 촛불이랑 접시를 놓쳐 버렸어. 와장창!`,
   l:`사과 한 접시를 들고 의기양양하게 지하실을 올라오는 순간, 얼어붙은 판자 길 위로 다급한 발소리가 들리더니 부엌문이 벌컥 열렸다. 숄을 허겁지겁 두른 다이애나였다. 얼굴은 하얗게 질리고 숨이 턱에 닿아 있었다. 나는 너무 놀라 촛불과 접시를 놓쳤고, 모두 지하실 사다리 아래로 와르르 굴러떨어졌다.`},
  {w:`diana`, f:`anne_surprised`, o:`diana`, bk:[`18-21`,`18-22`], cam:`in`, eff:{met:`diana`},
   e:`"앤, 빨리 와 줘! 미니 메이가 너무 아파. 크루프래! 아빠 엄마는 시내에 가셨고, 의사 선생님을 부르러 갈 사람이 없어. 메리 조 언니는 어떻게 해야 할지 몰라. 나 너무 무서워!"`,
   l:`"아, 앤, 빨리 좀 와 줘. 미니 메이가 너무 아파. 크루프래, 메리 조 언니가 그랬어. 아빠랑 엄마는 시내에 가셨고 의사 선생님을 부르러 갈 사람이 아무도 없어. 메리 조 언니는 어떻게 해야 할지 몰라. 아, 앤, 나 너무 무서워!"`},
  {w:`anne`, in:1, f:`anne_surprised`, o:`matthew`, bk:[`18-23`,`18-24`],
   e:`매슈 아저씨는 아무 말 없이 모자와 외투를 집어 들고 어둠 속으로 나가셨어. 의사 선생님을 모시러 말에 마구를 채우러 가신 거야. 말씀 안 하셔도 알아. 아저씨랑 나는 마음이 통하거든.`,
   l:`매슈 아저씨는 한마디 말도 없이 모자와 외투를 집어 들고 마당의 어둠 속으로 사라졌다. 의사를 모시러 밤색 암말에 마구를 채우러 간 것이다. 말하지 않아도 알 수 있었다. 아저씨와 나는 마음이 통하는 사이니까.`},
  {w:`diana`, f:`anne_sad`, o:`diana`, bk:[`18-25`],
   e:`"카모디에 가도 의사 선생님은 없을 거야. 다들 시내에 가셨거든. 린드 부인도 안 계시고… 아, 앤!"`,
   l:`"카모디에서 의사 선생님을 못 찾으실 거야." 다이애나가 흐느꼈다. "블레어 선생님도 스펜서 선생님도 시내에 가셨을 거고, 린드 부인도 안 계셔. 아, 앤!"`},
  {t:`choice`, id:`C2`, kind:`talk`, label:`겁에 질린 다이애나에게`, f:`anne_surprised`, o:`diana`,
   q:{e:`다이애나가 울고 있어요. 앤은 뭐라고 말할까요?`, l:`두려움에 떠는 다이애나. 앤은 어떤 말로 다이애나를 붙잡아 줄까요?`},
   note:{e:`원작의 앤은 씩씩하게 말해요. "울지 마, 다이. 크루프는 내가 어떻게 해야 하는지 정확히 알아. 해먼드 아주머니가 쌍둥이를 세 번이나 낳으셨잖아!" 고아원에 오기 전 앤은 해먼드 아주머니네서 쌍둥이 세 쌍을 돌봤거든요.`,
         l:`원작에서 앤은 "울지 마, 다이"라며 씩씩하게 나섭니다. 해먼드 부인의 쌍둥이 세 쌍을 돌보며 크루프를 숱하게 겪었던 것이지요. 앤의 고단했던 과거가 이날 밤 생명을 구하는 힘이 됩니다.`},
   opts:[
    {type:`canon`, go:`t_c`, e:`"울지 마, 다이. 크루프는 내가 어떻게 해야 하는지 정확히 알아. 쌍둥이 세 쌍을 돌봤거든!"`, l:`"울지 마, 다이. 크루프에는 어떻게 해야 하는지 정확히 알아. 쌍둥이를 세 쌍이나 돌봤으니까."`, s:{e:`"내가 정확히 알아!" 하고 안심시켰다`, l:`경험을 믿고 씩씩하게 나섰다`}},
    {type:`imag`, go:`t_i`, e:`"걱정 마, 다이! 오늘 밤 우리는 눈 덮인 들판을 달리는 겨울밤 구조대야!"`, l:`"걱정 마, 다이. 오늘 밤 우리는 겨울밤을 달리는 구조대야!"`, s:{e:`겨울밤 구조대를 선언했다`, l:`구조대가 되어 용기를 북돋웠다`}},
    {type:`bal`, go:`t_b`, eff:{heart:{diana:1}}, e:`"다이애나, 숨부터 크게 쉬자. 미니 메이 지금 어때? 열이 나? 숨소리는 어때?"`, l:`"다이애나, 숨부터 크게 쉬자. 미니 메이 상태는 어때? 열은? 숨소리는?"`, s:{e:`차분하게 상태부터 물었다`, l:`차분히 상태를 확인했다`}}
   ]},
  {id:`t_c`, w:`anne`, f:`anne_happy`, o:`diana`, bk:[`18-26`], cam:`in`,
   e:`"울지 마, 다이. 크루프에는 어떻게 해야 하는지 내가 정확히 알아. 해먼드 아주머니가 쌍둥이를 세 번이나 낳으셨잖아. 쌍둥이 세 쌍을 돌보다 보면 경험이 저절로 쌓여. 토근 시럽만 챙겨 갈게!"`,
   l:`"울지 마, 다이." 나는 씩씩하게 말했다. "크루프에는 어떻게 해야 하는지 정확히 알아. 해먼드 아주머니가 쌍둥이를 세 번이나 낳으셨다는 거 잊었니? 쌍둥이 세 쌍을 돌보다 보면 저절로 경험이 쌓여. 그 애들은 툭하면 크루프에 걸렸거든. 토근 시럽 병만 챙겨 갈게."`},
  {t:`goto`, to:`t_m`},
  {id:`t_i`, w:`anne`, f:`anne_dreamy`, o:`diana`, fx:`dream`, cam:`up`, eff:{album:`rescueTeam`},
   e:`"걱정 마, 다이! 오늘 밤 우리는 겨울밤 구조대야. 눈보라를 뚫고 달려가 아기 공주님을 구하는 거지! 그리고 이 구조대장은… 쌍둥이 세 쌍을 돌본 경험이 있다고!"`,
   l:`"걱정 마, 다이. 오늘 밤 우리는 겨울밤 구조대야. 눈 덮인 들판을 가로질러 아기 공주님을 구하러 가는 거야. 게다가 이 구조대장은 쌍둥이 세 쌍을 돌본 백전노장이라고!"`},
  {w:`diana`, f:`anne_dreamy`, o:`diana`, fx:`dream`,
   e:`다이애나가 눈물을 닦으며 고개를 끄덕였어. "구조대… 좋아. 빨리 가자!"`,
   l:`다이애나가 눈물을 훔치며 고개를 끄덕였다. "구조대… 좋아. 어서 가자!"`},
  {t:`goto`, to:`t_m`},
  {id:`t_b`, w:`anne`, f:`anne_happy`, o:`diana`, eff:{album:`calmQs`},
   e:`나는 다이애나의 두 손을 꼭 잡았어. "다이애나, 숨부터 크게 쉬자. 미니 메이 지금 어때? 열이 나? 숨소리는?" "열이 펄펄 나고… 숨 쉴 때 쉰 소리가 나." "그럼 크루프가 맞아. 걱정 마, 나 해 봤어."`,
   l:`나는 다이애나의 두 손을 꼭 잡았다. "숨부터 크게 쉬자. 미니 메이는 지금 어때? 열은? 숨소리는?" "열이 펄펄 나고… 숨 쉴 때마다 쉰 소리가 나." "그럼 크루프가 맞아. 걱정 마. 나 이거 해 봤어."`},
  /* ---------- 눈 덮인 들판 ---------- */
  {id:`t_m`, bg:`ch6_snow`, w:`anne`, in:1, f:`anne_dreamy`, o:`diana`, bk:[`18-27`,`18-28`], cam:`out`,
   e:`우리는 손을 꼭 잡고 연인의 오솔길을 지나, 눈이 딱딱하게 언 들판을 가로질러 달렸어. 하늘엔 커다란 별들이 빛나고, 전나무 가지마다 눈가루가 반짝였어. 미니 메이가 걱정됐지만… 오랫동안 떨어져 있던 다이애나와 다시 함께 달리니 가슴이 벅찼어.`,
   l:`우리는 손을 맞잡고 연인의 오솔길을 지나 눈이 딱딱하게 언 들판을 가로질렀다. 칠흑 같은 그림자와 은빛 비탈, 고요한 들판 위의 커다란 별들, 눈가루를 얹은 뾰족한 전나무들. 미니 메이가 진심으로 걱정되면서도, 오랫동안 떨어져 있던 마음의 친구와 이 신비 속을 함께 달린다는 사실이 가슴을 벅차게 했다.`},
  {w:`anne`, in:1, f:`anne_dreamy`, o:`diana`, when:s => s.items.includes(`lock`),
   e:`목에 건 작은 주머니 속 다이애나의 머리카락이 달리는 내내 가슴께에서 콩닥거렸어.`,
   l:`목에 건 작은 주머니 속 다이애나의 머리카락이 달리는 내내 가슴께에서 함께 뛰었다.`},
  {w:`anne`, in:1, f:`anne_dreamy`, o:`diana`, when:s => s.items.includes(`pebble`),
   e:`주머니 속 '다이애나' 조약돌을 꼭 쥐었어. 샘의 요정이 우리를 지켜 주고 있는 것 같았어.`,
   l:`주머니 속 '다이애나' 조약돌을 꼭 쥐었다. 샘의 요정이 우리를 지켜 주는 것만 같았다.`},
  /* ---------- 배리 씨네 부엌 ---------- */
  {bg:`ch6_barry`, w:`anne`, in:1, f:`anne_surprised`, o:`minnie_may`, bk:[`18-29`], cam:`in`,
   e:`세 살배기 미니 메이는 정말 많이 아팠어. 부엌 소파에 누워 열에 들떠 뒤척였고, 쉰 숨소리가 온 집 안에 울렸어. 메리 조 언니는 어쩔 줄 몰라 발만 동동 구르고 있었어.`,
   l:`세 살배기 미니 메이는 정말 몹시 아팠다. 부엌 소파에 누워 열에 들떠 뒤척였고, 쉰 숨소리가 온 집 안에 들렸다. 아이들을 돌보러 와 있던 메리 조는 당황한 나머지 무엇을 해야 할지 생각도 못 하고 있었다.`},
  {t:`choice`, id:`C3`, kind:`act`, label:`배리 씨네 부엌에서`, f:`anne_surprised`, o:`minnie_may`,
   q:{e:`미니 메이가 몹시 아파요. 앤은 가장 먼저 무엇을 할까요?`, l:`위급한 미니 메이. 앤은 어떻게 일을 시작할까요?`},
   note:{e:`원작의 앤은 솜씨 있고 재빠르게 일을 시작해요. 주전자에 물을 가득 채우고, 메리 조에게 장작을 넣게 하고, 다이애나에게 부드러운 천을 찾아 달라고 한 뒤, 미니 메이에게 토근 시럽을 먹이지요.`,
         l:`원작에서 앤은 "솜씨 있고 재빠르게" 일을 시작합니다. 뜨거운 물부터 준비하고, 메리 조와 다이애나에게 할 일을 맡기고, 미니 메이에게 토근 시럽을 먹이지요. 메리 조에게 "상상력이 있었다면 미리 생각했을 것"이라고 한마디 덧붙이는 것도 잊지 않고요.`},
   opts:[
    {type:`canon`, go:`r_c`, e:`주전자에 물을 가득 채우고 메리 조 언니에게 장작을 넣게 한 뒤, 토근 시럽을 먹인다.`, l:`물을 끓이고 장작을 넣게 한 뒤, 곧장 토근 시럽을 먹인다.`, s:{e:`물을 끓이고 토근 시럽을 먹였다`, l:`재빠르게 치료를 시작했다`}},
    {type:`imag`, go:`r_i`, eff:{heart:{diana:1}}, e:`무서워하는 미니 메이에게 '용감한 아기 공주 이야기'를 들려주며 토근 시럽을 먹인다.`, l:`겁먹은 미니 메이에게 '용감한 아기 공주 이야기'를 들려주며 약을 먹인다.`, s:{e:`이야기를 들려주며 약을 먹였다`, l:`이야기로 아기를 달랬다`}},
    {type:`bal`, go:`r_b`, eff:{heart:{diana:1}}, e:`메리 조 언니는 불과 물, 다이애나는 플란넬 천, 나는 미니 메이. 할 일을 셋으로 나눈다.`, l:`메리 조는 불과 물, 다이애나는 천, 자신은 미니 메이. 할 일을 셋으로 나눈다.`, s:{e:`셋이 할 일을 나눴다`, l:`역할을 나눠 함께 했다`}}
   ]},
  {id:`r_c`, w:`anne`, f:`anne_happy`, o:`minnie_may`, bk:[`18-30`,`18-31`], cam:`in`,
   e:`"크루프가 틀림없어. 꽤 심하지만 더 심한 것도 봤어. 우선 뜨거운 물이 많이 필요해. 어머, 주전자에 물이 한 컵도 없잖아! 메리 조 언니, 난로에 장작 좀 넣어 줘요. 다이애나, 부드러운 플란넬 천 좀 찾아 줘. 나는 토근 시럽부터 먹일게."`,
   l:`"미니 메이는 크루프가 틀림없어. 꽤 심하지만 더 심한 것도 봤어. 우선 뜨거운 물이 많이 있어야 해. 세상에, 주전자에 한 컵도 안 남았잖아! 메리 조 언니, 난로에 장작 좀 넣어 줘요. 기분 상하게 하려는 건 아니지만, 상상력이 조금만 있었다면 이걸 미리 생각했을 거예요. 다이애나, 부드러운 플란넬 천을 찾아 줘. 무엇보다 먼저 토근 시럽을 먹일 거야."`},
  {t:`goto`, to:`r_m`},
  {id:`r_i`, w:`anne`, f:`anne_dreamy`, o:`minnie_may`, fx:`dream`, eff:{album:`braveTale`},
   e:`미니 메이는 쓴 약이 싫다고 고개를 저었어. 나는 속삭였어. "옛날 옛날에 용감한 아기 공주가 살았는데, 마법의 물약을 꿀꺽 마시면 목 속의 심술쟁이 용이 도망간대." 미니 메이가 눈을 동그랗게 뜨더니… 꿀꺽!`,
   l:`미니 메이는 쓴 약이 싫다며 고개를 저었다. 나는 귓가에 속삭였다. "옛날 옛적에 용감한 아기 공주가 있었는데, 마법의 물약을 꿀꺽 삼키면 목 속에 숨은 심술쟁이 용이 달아났단다." 미니 메이가 눈을 동그랗게 뜨더니, 꿀꺽.`},
  {t:`goto`, to:`r_m`},
  {id:`r_b`, w:`anne`, f:`anne_happy`, o:`diana`, eff:{album:`teamwork`},
   e:`"우리 셋이 나눠서 하자! 메리 조 언니는 난로에 불을 지피고 물을 끓여 주세요. 다이애나는 부드러운 플란넬 천을 찾아 줘. 나는 미니 메이를 돌볼게." 메리 조 언니의 얼굴이 조금 밝아졌어. 할 일이 생기니까 덜 무서운가 봐.`,
   l:`"셋이 나눠서 하자. 메리 조 언니는 불을 지피고 물을 끓여 주세요. 다이애나는 플란넬 천을 찾아 줘. 나는 미니 메이를 돌볼게." 메리 조의 얼굴이 한결 밝아졌다. 할 일이 생기자 두려움이 조금 물러난 모양이었다.`},
  {id:`r_m`, w:`anne`, in:1, f:`anne_sad`, o:`minnie_may`, bk:[`18-32`], cam:`out`,
   e:`그 길고 불안한 밤 동안, 나는 다이애나와 함께 미니 메이를 돌보고 또 돌봤어. 토근 시럽을 몇 번이나 먹였는지 몰라. 메리 조 언니는 병원 하나를 채울 만큼 물을 데웠고.`,
   l:`길고 불안한 밤이었다. 다이애나와 나는 아파하는 미니 메이 곁을 끈기 있게 지켰고, 토근 시럽은 한 번이 아니라 여러 번 넘어갔다. 메리 조는 크루프에 걸린 아기들로 가득한 병원 하나를 돌보고도 남을 만큼 물을 데웠다.`},
  {w:`anne`, in:1, f:`anne_sad`, o:`minnie_may`, bk:[`18-34`], cam:`shake`,
   e:`그런데 미니 메이가 점점 더 나빠졌어. 해먼드네 쌍둥이들보다도 더 심했어. 정말 숨이 막혀 버리는 줄 알았어. 병에 남은 토근 시럽은… 이제 마지막 한 숟가락뿐이었어.`,

  {w:`doctor`, f:`anne_happy`, o:`doctor`, bk:[`18-33`,`18-35`,`18-36`], cam:`right`,
   e:`새벽 3시, 매슈 아저씨가 스펜서베일까지 가서 의사 선생님을 모시고 오셨어. 미니 메이는 이미 곤히 잠들어 있었지. 내 설명을 들은 의사 선생님은 말로 표현할 수 없다는 눈빛으로 나를 바라보셨어.`,
   l:`새벽 3시, 스펜서베일까지 가야 했던 매슈 아저씨가 마침내 의사를 모시고 왔다. 다급한 고비는 이미 지나 있었고, 미니 메이는 곤히 잠들어 있었다. "말로 표현할 수 없는 것들이 있잖아요, 선생님." 의사는 고개를 끄덕이며, 나에 대해 말로 표현할 수 없는 무언가를 생각하는 듯한 눈길로 나를 바라보았다.`},
  {w:`doctor`, f:`anne_happy`, o:`doctor`, bk:[`18-37`],

   l:`나중에 의사는 그 생각을 배리 씨 부부에게 말로 옮겼다. "커스버트 씨네 그 빨간 머리 꼬마 아가씨가 아기 목숨을 구했다고 분명히 말씀드리죠. 제가 왔을 때는 이미 늦었을 겁니다. 그 나이에 그런 솜씨와 침착함이라니, 정말 놀랍습니다."`},

  {bg:`ch6_morning`, w:`anne`, f:`anne_happy`, o:`matthew`, bk:[`18-38`,`18-39`], cam:`out`,
   e:`하얗게 서리 내린 겨울 아침, 아저씨와 집으로 돌아가는 길. "아, 아저씨, 정말 멋진 아침이지 않아요? 하느님이 자기 즐거움을 위해 방금 상상해 내신 세상 같아요! 해먼드 아주머니가 쌍둥이를 세 쌍이나 낳으셔서 다행이에요."`,
   l:`하얗게 서리 내린 겨울 아침, 연인의 오솔길 단풍나무들이 이룬 반짝이는 요정의 아치 아래를 걸으며 나는 지칠 줄 모르고 재잘거렸다. "아, 아저씨, 정말 멋진 아침이지 않아요? 하느님이 자기 즐거움을 위해 방금 상상해 내신 세상 같아요. 저 나무들은 숨 한 번이면 날려 버릴 수 있을 것 같아요. 후! 해먼드 아주머니가 쌍둥이를 세 쌍이나 낳으셔서 결국 정말 다행이에요."`},
  {w:`matthew`, f:`anne_sad`, o:`matthew`, bk:[`18-40`], eff:{heart:{matthew:1}},
   e:`"너무 졸려요… 그래도 학교에 안 가면 길… 다른 애들이 1등을 하는데." "글쎄다, 넌 잘 해낼 거다. 어서 들어가 푹 자거라. 집안일은 내가 다 하마."`,
   l:`"그런데 너무 졸려요. 학교에 못 가면 길… 다른 애들이 1등을 차지할 텐데." 아저씨는 하얗게 질린 내 작은 얼굴과 눈 밑의 그늘을 바라보았다. "글쎄다, 넌 잘 해낼 거다. 어서 들어가 푹 자거라. 집안일은 내가 다 하마."`},

  {bg:`ch6`, w:`marilla`, f:`anne_surprised`, o:`marilla_warm`, bk:[`18-41`,`18-42`,`18-43`], cam:`in`,
   e:`한참 자고 일어나니 마릴라 아주머니가 돌아와 계셨어. "수상은 얼굴 덕에 수상이 된 건 아니더구나. 코가 어찌나 크던지! 어젯밤 일은 매슈한테 들었다. 네가 어떻게 할지 알아서 정말 다행이었어. 자, 점심부터 먹어라."`,
   l:`깨어 보니 오후가 한참 기울어 있었고, 그사이 돌아온 아주머니가 뜨개질을 하고 있었다. "글쎄, 얼굴 덕에 수상이 된 건 아니더구나. 코가 어찌나 크던지! 하지만 연설은 잘하더라. 어젯밤 일은 매슈한테 들었다. 네가 어떻게 해야 할지 알았다니 정말 다행이었구나. 자, 점심 다 먹을 때까지는 말하지 마라."`},
  {w:`marilla`, f:`anne_surprised`, o:`marilla_warm`, bk:[`18-44`], cam:`right`,
   e:`내가 자두 절임까지 다 먹고 나서야 아주머니가 말씀하셨어. "오늘 오후에 배리 부인이 다녀갔다. 네가 미니 메이 목숨을 구했다고, 포도주 일 때 그렇게 대해서 정말 미안하다고 하더구나. 다이애나랑 다시 좋은 친구로 지내 달래."`,
   l:`파란 자두 한 접시를 다 비우고 나서야 아주머니가 입을 열었다. "오늘 오후에 배리 부인이 왔었다, 앤. 네가 미니 메이의 목숨을 구했다면서, 포도주 일 때 그렇게 대한 걸 정말 미안해하더구나. 네가 일부러 그런 게 아니었다는 걸 이제 알았다고, 용서해 주고 다이애나와 다시 좋은 친구로 지내 주면 좋겠다는구나. 자, 앤 셜리, 제발 하늘로 훨훨 날아가 버리지는 마라."`},
  {w:`marilla`, f:`anne_surprised`, o:`marilla_warm`, when:s => s.flags.factsOnly || (s.hearts.barry || 0) >= 2,
   e:`"그리고… 배리 부인이 그러더라. 그날 밤 네가 '다이애나만은 꾸짖지 말아 달라'고 했던 말이 계속 마음에 걸렸다고."`,
   l:`"그리고 배리 부인이 이런 말도 하더구나. 그날 밤 네가 '다이애나만은 꾸짖지 말아 달라'고 했던 말이 내내 마음에 걸렸다고."`},
  {w:`anne`, f:`anne_happy`, o:`marilla_warm`, bk:[`18-45`,`18-46`,`18-47`], cam:`shake`,
   e:`"아주머니, 지금 당장 가도 돼요? 설거지는 다녀와서 할게요! 이렇게 가슴 떨리는 순간에 설거지처럼 낭만 없는 일은 못 해요!" "앤 셜리, 모자라도 쓰고 가야지!" …나는 벌써 과수원을 달리고 있었어.`,
   l:`"아, 아주머니, 지금 당장 가도 돼요? 설거지 안 하고요? 이렇게 가슴 떨리는 순간에 설거지처럼 낭만 없는 일에 매여 있을 수는 없어요." "그래, 그래, 어서 가거라. 앤 셜리, 너 정신 나갔니? 뭐라도 걸치고 가!" 바람에게 소리치는 편이 나았으리라. 나는 이미 머리카락을 휘날리며 과수원을 가로지르고 있었다.`},

   l:`나는 몹시 쑥스러웠지만 최대한 공손하게 말했다. "배리 부인, 저는 부인께 아무 원한도 없어요. 다이애나를 취하게 하려던 게 아니었다는 것만 이번 한 번 분명히 말씀드릴게요. 그리고 이제부터 지난 일은 망각의 망토로 덮어 버리겠어요." 배리 부인 머리 위에 숯불을 쌓아 드리는 기분이었다.`},

  {w:`anne`, f:`anne_sad`, o:`marilla_strict`, bk:[`21-1`,`21-2`], cam:`in`,
   e:`그리고 6월 마지막 날, 필립스 선생님이 학교를 떠나셨어. 나는 흠뻑 젖은 손수건으로 눈을 닦으며 집에 왔어. "오늘 손수건을 하나 더 가져가길 정말 잘했어요. 필요할 것 같은 예감이 들었거든요." "네가 필립스 선생님을 그렇게 좋아하는 줄은 몰랐구나."`,
   l:`6월 마지막 날, 필립스 선생님이 학교를 떠났다. 나는 흠뻑 젖은 손수건으로 빨개진 눈을 닦으며 석판과 책을 부엌 식탁에 내려놓았다. "린드 부인 말씀대로 이 세상엔 만남과 이별밖에 없나 봐요. 오늘 손수건을 하나 더 가져가길 정말 다행이었어요. 필요할 거라는 예감이 들었거든요." "네가 필립스 선생님을 그렇게 좋아해서 손수건이 두 장이나 필요할 줄은 몰랐구나."`},

   l:`"선생님을 정말 좋아해서 운 건 아닌 것 같아요. 다른 애들이 다 우니까 따라 운 거예요. 루비 길리스가 시작했는데, 루비는 늘 선생님이 싫다고 했었거든요. 저는 선생님이 저를 길… 남자애 옆에 앉히셨던 일, 칠판에 제 이름을 e도 없이 쓰셨던 일을 떠올리며 버텨 보려 했어요. 그런데 어쩐지 안 되더라고요."`},

  {id:`f_b`, w:`anne`, f:`anne_sad`, o:`marilla_warm`, eff:{album:`twoSides`},

   l:`"미운 일도 많았어요. 하지만 돌이켜 보니 선생님 반에서 공부도 많이 늘었고, 시도 많이 배웠어요. 미운 점과 고마운 점이 한꺼번에 떠오르니 눈물이 났나 봐요." 아주머니는 잠시 나를 바라보다 고개를 끄덕였다.`},
  {id:`f_m`, w:`anne`, f:`anne_happy`, o:`marilla_warm`, bk:[`21-3`], cam:`in`,

   l:`"그래도 두 달 방학을 앞두고 완전히 절망의 구렁텅이에 빠질 수는 없잖아요. 게다가 역에서 오시는 새 목사님과 사모님을 만났어요. 사모님은 정말 예쁘세요. 볼록한 소매가 달린 파란 모슬린 드레스에 장미로 꾸민 모자를 쓰셨어요. 제인은 사모님에게 볼록한 소매는 너무 세속적이라고 했지만, 저는 그런 박정한 말은 하지 않았어요. 볼록한 소매를 얼마나 갖고 싶은지 저는 아니까요."`},

  {bg:`ch2`, w:`anne`, in:1, f:`anne_happy`, o:`allan`, bk:[`21-7`], cam:`out`, eff:{met:`allan`},

   l:`새 목사님은 높은 이상을 지닌 쾌활한 젊은이였고, 목사관의 안주인이 된 부인은 밝고 상냥했다. 에이번리는 처음부터 두 사람에게 마음을 열었다. 그리고 나는 앨런 부인을 곧바로, 온 마음으로 사랑하게 되었다. 또 한 사람의 마음이 통하는 이를 찾아낸 것이다.`},
  {w:`anne`, f:`anne_happy`, o:`marilla_warm`, bk:[`21-8`,`21-10`],

   l:`"앨런 사모님은 정말 사랑스러우세요. 우리 반을 맡으셨는데, 선생님만 질문을 다 하는 건 공평하지 않다고 하셨어요. 그건 제가 늘 생각해 온 거예요. 사모님 뺨엔 예쁜 보조개가 있어요. 그리고 다른 사람들에게 좋은 영향을 주려고 노력해야 한다고 하셨어요. 신앙이 그렇게 밝은 것인 줄 처음 알았어요."`},

   opts:[

  {id:`q_i`, w:`anne`, f:`anne_dreamy`, o:`allan`, fx:`dream`, cam:`up`, eff:{album:`lionNames`},
   e:`"사모님, 사자 굴에 들어간 다니엘은 밤새 사자들이랑 같이 있었잖아요. 무서워서 사자들한테 이름을 지어 주지 않았을까요? 저라면 '황금 갈기'랑 '부드러운 발'이라고 지었을 거예요!" 사모님이 보조개를 지으며 웃으셨어. "정말 멋진 질문이구나, 앤."`,
   l:`"사모님, 다니엘은 밤새 사자 굴에 있었잖아요. 무서움을 달래려고 사자들에게 이름을 지어 주지 않았을까요? 저라면 '황금 갈기'와 '부드러운 발'이라고 지었을 거예요." 사모님이 보조개를 지으며 웃었다. "정말 멋진 질문이구나, 앤."`},

  {id:`q_b`, w:`anne`, f:`anne_happy`, o:`allan`, eff:{album:`waitTurn`},

   l:`묻고 싶은 것이 산더미였지만 나는 다른 아이들이 먼저 물을 수 있도록 기다렸다. 그리고 마지막에 가장 궁금한 것 하나를 물었다. 사모님이 나를 보며 고개를 끄덕였다. "기다려 줘서 고맙구나, 앤."`},
  {id:`q_m`, w:`marilla`, f:`anne_surprised`, o:`marilla_warm`, bk:[`21-13`,`21-14`,`21-15`], cam:`right`,

   l:`"조만간 앨런 목사님 부부를 차 마시러 모셔야겠구나. 다음 주 수요일이 좋겠다. 하지만 매슈한테는 한마디도 하지 마라. 알면 핑계를 대고 어디로 가 버릴 테니까. 새 사모님은 아마 무서워서 죽으려고 할 거다." "죽은 사람처럼 입을 꼭 다물게요. 그런데 아주머니, 사모님을 위해 케이크를 만들어도 돼요?" "층 케이크는 만들어도 된다."`},

  {bg:`ch7_spring`, w:`anne`, f:`anne_happy`, o:`diana`, bk:[`21-16`,`21-17`], cam:`out`,
   e:`화요일 해 질 녘, 나는 다이애나랑 '{spring}' 옆 붉은 돌에 앉아 전나무 진액 묻힌 나뭇가지로 물 위에 무지개를 만들며 이야기했어. "닭고기 젤리, 레몬 파이, 체리 파이, 쿠키 세 종류에 아주머니의 유명한 노란 자두 절임까지! 그런데 층 케이크 생각만 하면 오싹해. 어젯밤엔 케이크 머리를 한 도깨비한테 쫓기는 꿈을 꿨어!"`,
   l:`화요일 해 질 녘, 나는 다이애나와 '{spring}' 곁 커다란 붉은 돌에 앉아 전나무 진액을 묻힌 나뭇가지로 물 위에 무지개를 만들며 이야기했다. "닭고기 젤리, 빨간 젤리와 노란 젤리, 레몬 파이와 체리 파이, 쿠키 세 종류, 그리고 아주머니가 목사님들께만 내놓는 유명한 노란 자두 절임까지 다 준비됐어. 그런데 층 케이크 생각만 하면 온몸이 오싹해. 어젯밤엔 머리가 커다란 층 케이크인 도깨비한테 쫓기는 꿈을 꿨다니까."`},
  {w:`diana`, f:`anne_happy`, o:`diana`, bk:[`21-18`],
   e:`"맛있을 거야, 걱정 마. 2주 전에 먹은 네 케이크, 정말 근사했잖아." 다이애나는 언제나 마음 편하게 해 주는 친구야.`,
   l:`"맛있을 거야, 걱정 마." 언제나 마음을 편하게 해 주는 친구인 다이애나가 장담했다. "2주 전에 '한가로운 숲'에서 먹은 네 케이크, 정말 근사했잖아."`},
  {w:`anne`, f:`anne_dreamy`, o:`diana`, bk:[`21-19`,`21-20`], cam:`up`, eff:{item:`rainbow`},
   e:`"봐, 다이애나, 정말 예쁜 무지개야! 우리가 가고 나면 드라이어드가 나와서 이걸 스카프로 가져갈까?" 그런데 다이애나가 고개를 저었어. "드라이어드 같은 건 없다는 거 알잖아." 유령의 숲 일로 배리 부인께 혼난 뒤로, 다이애나는 상상하는 걸 조심하게 됐거든.`,
   l:`"아, 봐, 다이애나, 정말 예쁜 무지개야! 우리가 가고 나면 드라이어드가 나와서 이걸 스카프로 가져갈까?" "드라이어드 같은 건 없다는 거 알잖아." 유령의 숲 일을 알게 된 배리 부인이 몹시 화를 낸 뒤로, 다이애나는 해롭지 않은 드라이어드조차 믿지 않는 편이 현명하다고 여기게 되었다.`},
  {t:`choice`, id:`C3`, kind:`talk`, label:`"드라이어드 같은 건 없어"`, f:`anne_sad`, o:`diana`,
   q:{e:`다이애나가 드라이어드는 없다고 해요. 앤은 뭐라고 할까요?`, l:`상상을 경계하게 된 다이애나. 앤은 어떻게 대답할까요?`},
   note:{e:`원작의 앤은 "있다고 상상하는 건 정말 쉬운걸! 나는 매일 밤 창밖을 보며 드라이어드가 샘을 거울삼아 머리를 빗고 있을까 궁금해해. 다이애나, 드라이어드를 믿는 마음을 버리지 마!"라고 말해요.`,
         l:`원작에서 앤은 "있다고 상상하는 건 정말 쉽다"며, 매일 밤 드라이어드가 샘을 거울삼아 머리를 빗는 모습을 그려 본다고 고백합니다. 유령의 숲 사건으로 혼쭐이 났어도 아름다운 상상만은 포기하지 않는 앤이지요.`},
   opts:[
    {type:`canon`, go:`d_c`, e:`"있다고 상상하는 건 정말 쉬운걸! 다이애나, 드라이어드를 믿는 마음을 버리지 마!"`, l:`"있다고 상상하는 건 정말 쉬운걸. 드라이어드를 믿는 마음만은 버리지 마!"`, s:{e:`믿는 마음을 버리지 말라고 했다`, l:`상상을 지켜 달라 청했다`}},
    {type:`imag`, go:`d_i`, e:`"그럼 증거를 남겨 두자! 무지개를 걸어 두고, 내일 아침 사라졌는지 확인하는 거야."`, l:`"그럼 증거를 남겨 두자. 무지개를 걸어 두고 내일 아침 사라졌는지 보는 거야."`, s:{e:`무지개 스카프로 증거를 남겼다`, l:`드라이어드의 증거를 남겼다`}},
    {type:`bal`, go:`d_b`, eff:{heart:{diana:1}}, e:`"유령의 숲은 내가 지나쳤어. 미안해. 그래도 무섭지 않고 예쁜 상상은 괜찮지 않을까?"`, l:`"유령의 숲은 내가 지나쳤어. 그래도 무섭지 않은 고운 상상은 괜찮지 않을까?"`, s:{e:`지나쳤던 걸 사과하고 고운 상상만 하자 했다`, l:`상상의 선을 함께 정했다`}}
   ]},
  {id:`d_c`, w:`anne`, f:`anne_dreamy`, o:`diana`, bk:[`21-21`],
   e:`"하지만 있다고 상상하는 건 정말 쉬운걸. 나는 매일 밤 창밖을 보며, 드라이어드가 정말 여기 앉아서 샘을 거울삼아 머리를 빗고 있을까 궁금해해. 아침엔 이슬 위에 발자국이 있나 찾아보기도 하고. 다이애나, 드라이어드를 믿는 마음을 버리지 마!"`,
   l:`"하지만 있다고 상상하는 건 정말 쉬운걸. 나는 매일 밤 잠자리에 들기 전 창밖을 내다보며, 드라이어드가 정말 여기 앉아 샘을 거울삼아 머리를 빗고 있을까 궁금해해. 아침엔 이슬 위에 드라이어드 발자국이 있나 찾아보기도 하고. 아, 다이애나, 드라이어드를 믿는 마음을 버리지 마!"`},
  {t:`goto`, to:`d_m`},
  {id:`d_i`, w:`anne`, f:`anne_dreamy`, o:`diana`, fx:`dream`, cam:`up`, eff:{album:`dryadScarf`},
   e:`"그럼 증거를 남겨 두자! 이 무지개를 버드나무 가지에 걸어 두는 거야. 내일 아침에 무지개가 사라졌으면, 드라이어드가 스카프로 가져간 거지!" 다이애나가 웃음을 참으며 말했어. "…해 뜨면 원래 사라지는 거 아니야?"`,
   l:`"그럼 증거를 남겨 두자. 이 무지개를 버드나무 가지에 걸어 두는 거야. 내일 아침 사라졌다면 드라이어드가 스카프로 가져간 거고!" 다이애나가 웃음을 참으며 말했다. "…해가 뜨면 원래 사라지는 거 아니야?"`},
  {t:`goto`, to:`d_m`},
  {id:`d_b`, w:`anne`, f:`anne_sad`, o:`diana`,
   e:`"유령의 숲은 내가 정말 지나쳤어. 너까지 혼나게 해서 미안해. 그래도… 샘에서 머리를 빗는 예쁜 드라이어드 같은 상상은 괜찮지 않을까? 무섭지 않은 상상만 하기로 약속할게." 다이애나가 빙그레 웃었어. "그런 거라면 좋아."`,
   l:`"유령의 숲은 내가 지나쳤어. 너까지 혼나게 해서 미안해. 그래도 샘가에서 머리를 빗는 고운 드라이어드 같은 상상은 괜찮지 않을까? 무섭지 않은 상상만 하기로 약속할게." 다이애나가 빙그레 웃었다. "그런 거라면 좋아."`},
  /* ---------- 수요일 아침 ---------- */
  {id:`d_m`, bg:`ch2`, w:`anne`, in:1, f:`anne_sad`, o:`marilla_strict`, bk:[`21-22`,`21-23`], cam:`in`,
   e:`수요일 아침, 나는 해 뜰 때 일어났어. 어제 샘물에서 첨벙거린 탓에 지독한 코감기에 걸렸지만, 그런 걸로 케이크를 포기할 순 없지! 오븐 문을 닫으며 숨을 길게 내쉬었어. "이번엔 아무것도 안 잊었어요. 밀가루도 넣었고요! 그런데 안 부풀면 어떡해요?"`,
   l:`수요일 아침, 너무 들떠 잠을 이룰 수 없었던 나는 해 뜰 무렵 일어났다. 전날 샘물에서 첨벙거린 탓에 지독한 코감기에 걸렸지만, 폐렴이라도 걸리지 않는 한 그날 아침의 요리 열정은 꺾일 수 없었다. 오븐 문을 닫으며 나는 숨을 길게 내쉬었다. "이번엔 아무것도 잊지 않았어요, 아주머니. 그런데 부풀어 오를까요? 베이킹파우더가 안 좋으면 어떡해요?"`},
  {w:`anne`, in:1, f:`anne_happy`, bk:[`21-24`,`21-25`],
   e:`"그거 없어도 먹을 건 충분하다." 아주머니는 담담하셨어. 하지만 케이크는 금빛 거품처럼 폭신하게 부풀어 올랐어! 나는 루비처럼 붉은 젤리를 층층이 바르며, 사모님이 한 조각 더 달라고 하시는 모습을 상상했어.`,
   l:`"그거 없어도 먹을 건 충분하다." 아주머니는 담담했다. 그러나 케이크는 금빛 거품처럼 가볍고 폭신하게 부풀어 올랐다. 나는 기쁨으로 볼이 달아오른 채 루비 같은 젤리를 층층이 바르며, 앨런 사모님이 그 케이크를 먹고 어쩌면 한 조각 더 청하는 모습을 그려 보았다.`},
  {w:`anne`, f:`anne_happy`, o:`marilla_strict`, bk:[`21-26`,`21-27`,`21-28`,`21-29`],
   e:`"아주머니, 고사리랑 들장미로 식탁을 꾸며도 돼요?" "쓸데없는 짓이다." "배리 부인은 식탁을 꾸미셨는데, 목사님이 눈도 즐거운 잔치라고 칭찬하셨대요." …"좋을 대로 해라." 아주머니는 배리 부인한테 지는 건 싫으셨나 봐.`,
   l:`"고사리랑 들장미로 식탁을 꾸며도 돼요?" "그런 건 쓸데없는 짓이다." "배리 부인은 식탁을 꾸미셨는데, 목사님이 입뿐 아니라 눈도 즐거운 잔치라고 칭찬하셨대요." 뱀처럼 지혜로운 한마디였다. "그럼, 좋을 대로 해라." 배리 부인이든 누구든 결코 지고 싶지 않은 아주머니였다.`},
  {t:`choice`, id:`C4`, kind:`act`, label:`차 식탁 꾸미기`, f:`anne_happy`, o:`marilla_strict`,
   q:{e:`목사님 부부를 맞을 차 식탁! 앤은 어떻게 꾸밀까요?`, l:`목사님 부부를 맞는 식탁. 앤은 어떤 식탁을 차릴까요?`},
   note:{e:`원작의 앤은 장미와 고사리로 배리 부인 식탁보다 훨씬 멋지게 꾸며요. 목사님 부부는 앉자마자 입을 모아 감탄했고, 마릴라 아주머니는 "앤이 한 거예요."라고 공정하게 말해 주셨대요.`,
         l:`원작에서 앤은 넉넉한 장미와 고사리로 배리 부인의 식탁이 "명함도 못 내밀" 만큼 아름답게 꾸밉니다. 목사님 부부가 감탄하자 마릴라는 무뚝뚝하지만 공정하게 "앤이 한 거예요"라고 말하지요.`},
   opts:[
    {type:`canon`, go:`t_c`, e:`장미와 고사리를 듬뿍 써서, 배리 부인 식탁보다 훨씬 멋지게 꾸민다.`, l:`장미와 고사리를 아낌없이 써서 누구의 식탁보다 아름답게 꾸민다.`, s:{e:`장미와 고사리로 화려하게 꾸몄다`, l:`화려한 꽃 식탁을 차렸다`}},
    {type:`imag`, go:`t_i`, e:`식탁을 '요정 여왕의 만찬'으로 상상하고, 음식마다 들꽃 이름표를 붙인다.`, l:`'요정 여왕의 만찬'을 상상하며 음식마다 들꽃 이름표를 붙인다.`, s:{e:`요정 여왕의 만찬으로 꾸몄다`, l:`요정의 만찬을 차렸다`}},
    {type:`bal`, go:`t_b`, eff:{heart:{matthew:1}}, e:`음식 놓을 자리는 넉넉히 남기고, 수줍은 매슈 아저씨 자리에 아저씨가 좋아하는 꽃을 둔다.`, l:`그릇 놓을 자리는 넉넉히 두고, 매슈 아저씨 자리에 아저씨가 좋아하는 꽃을 놓는다.`, s:{e:`아저씨 자리에 꽃을 두었다`, l:`손님과 가족 모두를 배려했다`}}
   ]},
  {id:`t_c`, bg:`ch7`, w:`allan`, f:`anne_happy`, o:`allan`, bk:[`21-30`,`21-31`], cam:`in`,
   e:`장미와 고사리가 넘치는 식탁에 앉으신 목사님 부부가 입을 모아 감탄하셨어. "세상에, 정말 아름다워요!" "앤이 한 거예요." 아주머니가 무뚝뚝하지만 공정하게 말씀하셨어. 사모님의 미소를 받으니, 이 세상에서 누리기엔 너무 큰 행복 같았어.`,
   l:`넉넉한 장미와 고사리로 꾸민 식탁에 앉자마자 목사님 부부는 입을 모아 감탄했다. "앤이 한 거예요." 아주머니가 무뚝뚝하지만 공정하게 말했다. 앨런 사모님의 칭찬하는 미소를 받자, 나는 이 세상에서 누리기엔 너무 큰 행복이라고 느꼈다.`},
  {t:`goto`, to:`t_m`},
  {id:`t_i`, bg:`ch7`, w:`allan`, f:`anne_dreamy`, o:`allan`, fx:`dream`, eff:{album:`fairyFeast`},
   e:`나는 음식마다 들꽃 이름표를 붙였어. 체리 파이엔 '장미 요정의 보석', 노란 자두 절임엔 '해님의 눈물'. 사모님이 이름표를 하나하나 읽으시더니 소리 내어 웃으셨어. "요정 여왕의 만찬에 초대받은 기분이구나!"`,
   l:`나는 음식마다 들꽃으로 엮은 이름표를 붙였다. 체리 파이에는 '장미 요정의 보석', 노란 자두 절임에는 '해님의 눈물'. 이름표를 하나하나 읽던 사모님이 소리 내어 웃었다. "요정 여왕의 만찬에 초대받은 기분이구나!"`},
  {t:`goto`, to:`t_m`},
  {id:`t_b`, bg:`ch7`, w:`anne`, in:1, f:`anne_happy`, o:`matthew`, eff:{album:`matthewSeat`},
   e:`나는 그릇 놓을 자리를 넉넉히 남겨 두고, 매슈 아저씨 자리 앞에 아저씨가 좋아하시는 노란 들국화를 한 송이 놓았어. 쭈뼛거리며 앉으신 아저씨가 꽃을 보고 살짝 웃으셨어. 조금은 덜 떨리시나 봐.`,
   l:`나는 그릇 놓을 자리를 넉넉히 남기고, 매슈 아저씨 자리 앞에 아저씨가 좋아하는 노란 들국화 한 송이를 놓았다. 쭈뼛거리며 앉은 아저씨가 꽃을 보고 살짝 웃었다. 조금은 마음이 놓이는 모양이었다.`},
  {id:`t_m`, w:`anne`, in:1, f:`anne_happy`, o:`matthew`, bk:[`21-32`], cam:`right`,
   e:`매슈 아저씨도 그 자리에 계셨어! 어떻게 모셔 왔는지는 하느님과 나만 알아. 아저씨는 제일 좋은 옷에 하얀 칼라를 달고 목사님과 꽤 재미있게 이야기를 나누셨어. 사모님께는 한마디도 못 하셨지만.`,
   l:`매슈 아저씨도 그 자리에 있었다. 어떻게 끌어들였는지는 하느님과 나만이 알 일이었다. 아저씨는 가장 좋은 옷에 하얀 칼라를 달고 목사님과 제법 재미있게 이야기를 나누었다. 앨런 사모님께는 한마디도 못 했지만, 그것까지 바랄 수는 없었으리라.`},
  {w:`marilla`, f:`anne_happy`, o:`allan`, bk:[`21-33`,`21-34`,`21-35`],
   e:`드디어 내 층 케이크 차례! 사모님은 이미 많이 드셔서 사양하셨지만, 아주머니가 내 얼굴을 보시고 웃으며 말씀하셨어. "이건 꼭 드셔 보세요. 앤이 사모님을 위해 일부러 만들었거든요." "그렇다면 꼭 맛을 봐야겠네요!"`,
   l:`모든 것이 결혼식 종소리처럼 즐겁게 흘러가다가, 마침내 내 층 케이크가 나왔다. 이미 갖가지 음식을 받은 사모님이 사양하자, 실망한 내 얼굴을 본 아주머니가 웃으며 말했다. "이건 꼭 한 조각 드셔야 해요. 앤이 사모님을 위해 일부러 만든 거랍니다." "그렇다면 꼭 맛을 봐야겠네요." 사모님이 통통한 세모 조각을 덜었다.`},
  {w:`allan`, f:`anne_surprised`, o:`allan`, bk:[`21-36`], cam:`in`,
   e:`사모님이 한 입 드시더니… 얼굴에 아주 묘한 표정이 스쳤어. 그런데도 한마디도 안 하시고 꿋꿋이 드셨어.`,
   l:`한 입을 먹은 사모님의 얼굴에 아주 묘한 표정이 스쳤다. 그러나 사모님은 한마디도 하지 않고 꿋꿋이 케이크를 먹었다.`},
  {w:`marilla`, f:`anne_surprised`, o:`marilla_strict`, bk:[`21-37`,`21-38`,`21-39`,`21-40`], cam:`shake`,
   e:`표정을 보신 아주머니가 서둘러 맛을 보시더니 외치셨어. "앤 셜리! 대체 이 케이크에 뭘 넣은 거니?" "요리법대로만 했어요! 바닐라만 넣었어요…"`,
   l:`그 표정을 본 아주머니가 서둘러 케이크를 맛보았다. "앤 셜리! 대체 이 케이크에 뭘 넣은 거니?" "요리법에 쓰인 것 말고는 아무것도 안 넣었어요." 나는 괴로운 얼굴로 외쳤다. 직접 맛을 보니 얼굴이 새빨개졌다. "바닐라만 넣었어요."`},
  {t:`choice`, id:`C5`, kind:`predict`, label:`케이크의 정체`, f:`anne_surprised`, o:`marilla_strict`,
   q:{e:`케이크 맛이 이상해요! 원작에서는 무엇이 잘못됐던 걸까요?`, l:`끔찍한 맛의 층 케이크. 원작에서 밝혀진 원인은 무엇일까요?`},
   note:{e:`원작에서 '최고급 바닐라' 병에는 사실 진통제 연고가 들어 있었어요! 마릴라 아주머니가 진통제 병을 깨뜨려서 빈 바닐라 병에 옮겨 담아 두었는데, 앤은 코감기 때문에 냄새를 못 맡았던 거예요.`,
         l:`원작에서 '최고급 바닐라'라고 적힌 병의 정체는 진통제 연고였습니다. 마릴라가 깨진 병의 연고를 빈 바닐라 병에 옮겨 두었던 것이지요. 앤은 하필 지독한 코감기로 냄새를 맡지 못했습니다. 작은 우연들이 겹친 '향료의 새로운 출발'이었던 셈입니다.`},
   opts:[
    {type:`canon`, go:`m_c`, eff:{item:`bottle`}, e:`바닐라 병에 든 게 사실은 진통제 연고였다.`, l:`바닐라 병의 내용물이 사실은 진통제 연고였다.`, s:{e:`바닐라 병 속 진통제 연고를 맞혔다`, l:`진통제 연고를 맞혔다`}},
    {type:`imag`, go:`m_i`, eff:{item:`bottle`}, e:`새 통의 베이킹파우더가 마법에 걸려 있었다.`, l:`새 베이킹파우더가 심술쟁이 요정의 마법에 걸려 있었다.`, s:{e:`마법에 걸린 베이킹파우더라 했다`, l:`마법의 탓으로 돌렸다`}},
    {type:`bal`, go:`m_b`, eff:{item:`bottle`}, e:`코감기 때문에 냄새를 못 맡아서, 무언가를 잘못 넣었다.`, l:`코감기로 냄새를 맡지 못해 무언가를 잘못 넣었다.`, s:{e:`코감기 탓에 잘못 넣었다고 짐작했다`, l:`코감기를 원인으로 짚었다`}}
   ]},
  {id:`m_c`, w:`marilla`, f:`anne_surprised`, o:`marilla_strict`, bk:[`21-41`,`21-42`,`21-43`,`21-44`],
   e:`아주머니가 '최고급 바닐라'라고 쓰인 병의 냄새를 맡으셨어. "세상에, 앤! 진통제 연고를 넣었구나. 지난주에 진통제 병을 깨뜨려서 남은 걸 빈 바닐라 병에 부어 놨거든. 미리 말 안 한 내 잘못도 있다만… 냄새는 왜 못 맡았니?"`,
   l:`아주머니가 누런 글씨로 '최고급 바닐라'라고 쓰인 병의 마개를 열어 냄새를 맡았다. "세상에, 앤, 너 이 케이크에 진통제 연고를 넣었구나. 지난주에 진통제 병을 깨뜨려서 남은 걸 빈 바닐라 병에 부어 놨거든. 미리 말해 주지 않았으니 내 잘못도 조금은 있다. 그래도 제발, 냄새는 왜 못 맡았니?"`},
  {t:`goto`, to:`m_m`},
  {id:`m_i`, w:`anne`, f:`anne_dreamy`, o:`marilla_strict`, fx:`dream`, eff:{album:`magicPowder`},
   e:`"베이킹파우더예요! 분명 심술쟁이 요정이 새 통에 마법을 걸어 둔 거예요!" 그런데 아주머니가 병 냄새를 맡으시더니 말씀하셨어. "요정 탓이 아니다, 앤. 이건 진통제 연고야. 깨진 진통제를 바닐라 병에 옮겨 담아 뒀었거든."`,
   l:`"베이킹파우더예요! 심술쟁이 요정이 새 통에 마법을 걸어 둔 게 틀림없어요!" 그러나 병의 냄새를 맡은 아주머니가 고개를 저었다. "요정 탓이 아니다, 앤. 이건 진통제 연고야. 깨진 진통제 병의 남은 걸 바닐라 병에 옮겨 담아 뒀었지."`},
  {t:`goto`, to:`m_m`},
  {id:`m_b`, w:`anne`, f:`anne_sad`, o:`marilla_strict`, eff:{album:`lessonLearned`},
   e:`"제가 코감기 때문에 냄새를 못 맡았어요. 뭔가 잘못 넣은 것 같아요." 아주머니가 병 냄새를 맡으셨어. "맞다. 진통제 연고다. 깨진 진통제를 바닐라 병에 옮겨 놓고 말을 안 했으니… 내 잘못도 있구나."`,
   l:`"코감기 때문에 냄새를 못 맡았어요. 무언가를 잘못 넣은 것 같아요." 아주머니가 병의 냄새를 맡더니 한숨을 쉬었다. "네 말이 맞다. 진통제 연고야. 깨진 진통제를 바닐라 병에 옮겨 놓고 말해 주지 않았으니… 내 잘못도 있구나."`},
  {id:`m_m`, bg:`ch2_room`, w:`anne`, in:1, f:`anne_sad`, bk:[`21-45`,`21-46`,`21-48`], cam:`shake`,
   e:`나는 다락방으로 달아나 침대에 엎어져 엉엉 울었어. 이제 나는 진통제로 케이크 맛을 낸 여자애로 영원히 손가락질 받을 거야. 길… 학교 남자애들은 평생 웃겠지. 사모님은 내가 독을 먹이려 했다고 생각하실지도 몰라!`,
   l:`나는 다락방으로 달아나 침대에 엎어진 채, 어떤 위로도 받지 않겠다는 사람처럼 울었다. 소문은 날 것이다. 에이번리에선 늘 그러니까. 나는 영원히 진통제 연고로 케이크 맛을 낸 여자애로 손가락질 받으리라. 길… 학교 남자애들은 평생 그 이야기로 웃을 것이다. 사모님은 내가 독을 먹이려 했다고 생각할지도 몰랐다.`},
  {w:`allan`, f:`anne_surprised`, o:`allan`, bk:[`21-49`,`21-50`,`21-51`], cam:`in`,
   e:`"네가 벌떡 일어나서 직접 말씀드리면 어떨까?" 즐거운 목소리에 고개를 드니, 앨런 사모님이 웃음 띤 눈으로 서 계셨어. "아가, 이렇게 울면 안 돼. 이건 누구라도 할 수 있는 우스운 실수일 뿐이란다."`,
   l:`"네가 벌떡 일어나서 직접 말씀드리면 어떨까?" 즐거운 목소리에 벌떡 일어나 보니, 앨런 사모님이 침대 곁에서 웃음 띤 눈으로 나를 내려다보고 있었다. "아가, 이렇게 울면 안 돼. 이건 누구라도 할 수 있는 우스운 실수일 뿐이란다."`},
  {t:`choice`, id:`C6`, kind:`talk`, label:`위로하러 오신 사모님`, f:`anne_sad`, o:`allan`,
   q:{e:`사모님이 위로해 주세요. 앤은 뭐라고 대답할까요?`, l:`다락방까지 올라온 사모님의 위로. 앤은 어떻게 답할까요?`},
   note:{e:`원작의 앤은 "아니에요, 이런 실수는 저나 하는 거예요. 사모님께 정말 맛있는 케이크를 만들어 드리고 싶었어요."라고 쓸쓸하게 말해요. 사모님은 "잘됐을 때와 똑같이 네 마음이 고맙구나."라며 앤의 꽃밭을 보러 가자고 하시지요.`,
         l:`원작에서 앤은 "이런 실수는 저나 하는 것"이라며 낙담합니다. 앨런 부인은 결과가 아니라 마음을 고마워한다고 말하고, 화제를 앤의 꽃밭으로 돌려 자연스럽게 앤을 일으켜 세우지요. 진정한 위로가 무엇인지 보여 주는 장면입니다.`},
   opts:[
    {type:`canon`, go:`a_c`, eff:{item:`garden`, heart:{allan:1}}, e:`"이런 실수는 저나 하는 거예요. 사모님께 정말 맛있는 케이크를 만들어 드리고 싶었는데…"`, l:`"이런 실수는 저나 하는 거예요. 사모님께 꼭 맛있는 케이크를 드리고 싶었는데…"`, s:{e:`이런 실수는 나나 한다며 슬퍼했다`, l:`낙담을 털어놓았다`}},
    {type:`imag`, go:`a_i`, eff:{item:`garden`, heart:{allan:1}}, e:`"사모님, 이 케이크는 사실 '아픈 곳을 낫게 하는 마법 케이크'였던 거예요…"`, l:`"사모님, 사실 이건 '아픈 곳을 낫게 하는 마법 케이크'였던 거예요…"`, s:{e:`마법 케이크였다고 둘러댔다`, l:`상상으로 실수를 감쌌다`}},
    {type:`bal`, go:`a_b`, eff:{item:`garden`, heart:{allan:2}}, e:`"다음엔 병 냄새부터 꼭 확인할게요. 제 마음을 알아주셔서 감사해요."`, l:`"다음엔 병부터 꼭 확인할게요. 마음을 알아주셔서 감사해요."`, s:{e:`다음엔 냄새부터 확인하겠다고 했다`, l:`실수에서 배울 점을 찾았다`}}
   ]},
  {id:`a_c`, w:`allan`, f:`anne_sad`, o:`allan`, bk:[`21-52`,`21-53`],
   e:`"아니에요, 이런 실수는 저나 하는 거예요. 그 케이크를 사모님께 정말 맛있게 만들어 드리고 싶었어요." "그래, 알고 있단다. 케이크가 잘됐을 때와 똑같이 네 마음이 고맙구나. 자, 이제 그만 울고 네 꽃밭을 보여 주렴. 나도 꽃을 무척 좋아하거든."`,
   l:`"아니에요, 이런 실수는 저나 하는 거예요." 나는 쓸쓸하게 말했다. "그 케이크를 사모님께 정말 맛있게 만들어 드리고 싶었어요." "그래, 알고 있단다. 그리고 정말이지, 케이크가 잘됐을 때와 똑같이 네 친절과 마음 씀씀이가 고맙구나. 자, 이제 그만 울고 나랑 같이 내려가서 네 꽃밭을 보여 주렴."`},
  {t:`goto`, to:`a_m`},
  {id:`a_i`, w:`anne`, f:`anne_dreamy`, o:`allan`, fx:`dream`,
   e:`"사모님, 사실 그 케이크는… '아픈 곳을 낫게 하는 마법 케이크'였던 거예요. 사모님이 어디 아프시면 바로 나으실 거예요…" 사모님이 웃음을 터뜨리셨어. "그렇다면 내 마음의 걱정은 벌써 다 나았구나! 자, 마법사 아가씨, 네 꽃밭을 보여 주겠니?"`,
   l:`"사모님, 사실 그 케이크는 '아픈 곳을 낫게 하는 마법 케이크'였어요. 어디 편찮으신 데가 있으시다면 곧 나으실 거예요…" 사모님이 웃음을 터뜨렸다. "그렇다면 내 마음의 걱정은 벌써 다 나았구나. 자, 꼬마 마법사님, 네 꽃밭을 보여 주겠니?"`},
  {t:`goto`, to:`a_m`},
  {id:`a_b`, w:`anne`, f:`anne_sad`, o:`allan`,
   e:`나는 눈물을 닦았어. "다음엔 병에 쓰인 글씨만 믿지 않고, 냄새부터 꼭 확인할게요. 그리고… 제 마음을 알아주셔서 정말 감사해요." 사모님이 내 손을 꼭 잡으셨어. "실수에서 배울 줄 아는 사람은 정말 멋진 사람이란다. 자, 네 꽃밭을 보여 주렴."`,
   l:`나는 눈물을 닦았다. "다음엔 병의 글씨만 믿지 않고 냄새부터 꼭 확인할게요. 그리고 제 마음을 알아주셔서 정말 감사해요." 사모님이 내 손을 꼭 잡았다. "실수에서 배울 줄 아는 사람은 정말 멋진 사람이란다. 자, 네 꽃밭을 보여 주렴."`},
  {id:`a_m`, bg:`ch7_garden`, w:`anne`, in:1, f:`anne_happy`, o:`allan`, bk:[`21-54`], cam:`out`,
   e:`나는 사모님 손에 이끌려 내려가 꽃밭을 보여 드렸어. 사모님이 마음이 통하는 분이라는 게 정말 다행이었어. 아무도 진통제 케이크 이야기는 다시 꺼내지 않았고, 손님들이 돌아가실 땐 생각보다 즐거운 저녁이었다는 걸 깨달았어.`,
   l:`나는 사모님의 손에 이끌려 내려가 꽃밭을 보여 드렸다. 사모님이 마음이 통하는 분이라는 것이 참으로 하느님의 뜻처럼 여겨졌다. 진통제 케이크 이야기는 더 나오지 않았고, 손님들이 돌아갈 무렵 나는 그 끔찍한 사건을 생각하면 뜻밖에 즐거운 저녁이었음을 깨달았다.`},
  {w:`anne`, f:`anne_happy`, o:`marilla_warm`, bk:[`21-55`], cam:`up`,

   l:`그러나 부엌의 불은 꺼져 있었고 앤은 어디에도 없었다. "다섯 시까지 차를 준비하라고 일렀는데! 또 다이애나와 쏘다니며 이야기를 쓰거나 대사 연습을 하고 있겠지. 앤이 흠은 많아도 말을 듣지 않거나 믿지 못할 아이라고 느낀 적은 없었는데, 정말 속상하구나."`},

   l:`"자고 있었니, 앤? 그럼 어디 아프니?" "아니요. 제발 나가 주세요, 아주머니. 저를 보지 마세요. 저는 절망의 구렁텅이에 빠졌어요. 이제 누가 반에서 일등을 하든, 누가 작문을 잘 쓰든 상관없어요. 저는 다시는 어디에도 갈 수 없을 테니까요. 제 인생은 끝났어요."`},
  {w:`marilla`, f:`anne_green_hair`, o:`marilla_strict`, bk:[`27-13`,`27-14`,`27-15`,`27-16`,`27-17`], cam:`shake`,
   e:`"당장 일어나서 말해 봐라!" 나는 바닥으로 미끄러져 내려와 속삭였어. "제 머리를 보세요." 촛불에 비친 내 머리는… "앤 셜리! 아니, 초록색이잖아!" 칙칙한 구릿빛 초록에 군데군데 빨간 줄무늬까지. 빨강 머리보다 나쁜 건 없을 줄 알았는데, 초록 머리가 열 배는 더 나빠!`,
   l:`"당장 일어나서 말해 봐라!" 나는 바닥으로 미끄러져 내려와 속삭였다. "제 머리를 보세요, 아주머니." 촛불을 들어 올린 아주머니가 외쳤다. "앤 셜리, 머리에 무슨 짓을 한 거니? 아니, 초록색이잖아!" 칙칙하고 구릿빛이 도는 기묘한 초록에, 군데군데 원래의 붉은 줄무늬가 남아 끔찍함을 더했다. "빨강 머리보다 나쁜 건 없을 줄 알았어요. 그런데 초록 머리가 열 배는 더 나빠요."`},
  {w:`marilla`, f:`anne_green_hair`, o:`marilla_strict`, bk:[`27-17`,`27-18`,`27-19`],

  {id:`r_c`, w:`marilla`, f:`anne_green_hair`, o:`marilla_strict`, bk:[`27-20`,`27-21`],

   l:`"대가를 다 따져 봤어요, 아주머니. 그 대신 다른 일에서 더더욱 착하게 굴려고 했고요." "글쎄다." 아주머니가 비꼬듯 말했다. "내가 염색할 가치가 있다고 마음먹었다면, 적어도 점잖은 색으로 했겠다. 초록색으로는 안 했을 거야."`},

  {id:`r_i`, w:`anne`, f:`anne_green_hair`, o:`marilla_strict`, fx:`dream`, cam:`up`, eff:{album:`ravenPrincess`},

   l:`"저는 늘 까마귀처럼 새까만 머리의 코딜리아 공주가 되는 상상을 했어요. 이야기책엔 빨강 머리 공주가 한 명도 없거든요. 단 하루만이라도 진짜 공주처럼…" 아주머니가 한숨을 쉬었다. "그래서 지금은 개구리 공주가 됐구나."`},

  {id:`r_m`, w:`anne`, f:`anne_green_hair`, o:`marilla_strict`, bk:[`27-22`,`27-23`,`27-24`,`27-25`],
   e:`"그 사람이 아름다운 까마귀처럼 새까매진다고 장담했어요. 어떻게 의심하겠어요? 앨런 사모님도 증거 없이 남을 의심하면 안 된다고 하셨는걸요. 이젠 증거가 있죠. 초록 머리요." "누가 그랬다는 거니?" "오늘 오후에 온 행상인이요."`,
   l:`"그 사람이 아름다운 까마귀처럼 새까매질 거라고 장담했어요. 제가 어떻게 의심할 수 있었겠어요? 앨런 사모님도 증거가 없으면 남을 의심하지 말라고 하셨어요. 이제는 증거가 있죠. 초록 머리면 충분한 증거니까요." "누가 그랬다는 거니?" "오늘 오후에 왔던 행상인이요. 그 사람한테 염색약을 샀어요."`},

  {bg:`ch8_porch`, w:`anne`, in:1, f:`anne_happy`, fx:`dream`, bk:[`27-26`], cam:`out`,

   l:`그날 오후, 행상인이 찾아왔다. 나는 아주머니의 당부대로 그를 집에 들이지 않고, 밖으로 나가 문을 꼭 닫고 계단에서 물건을 구경했다. 그는 독일에 있는 아내와 아이들을 데려올 돈을 버는 중이라고 했고, 그 애틋한 이야기에 내 마음이 뭉클해졌다. 그때 머리 염색약 병이 눈에 들어왔다. 어떤 머리든 까마귀처럼 새까맣게, 감아도 지워지지 않는다고 했다.`},
  {t:`choice`, id:`C3`, kind:`act`, label:`행상인의 염색약`, f:`anne_happy`,
   q:{e:`75센트짜리 염색약! 앤에겐 50센트뿐인데, 아저씨가 50센트에 주겠대요. 앤은 어떻게 할까요?`, l:`75센트짜리 병을 50센트에 주겠다는 행상인. 앤은 어떻게 할까요?`},

    {type:`imag`, go:`p_i`, eff:{item:`dye`}, e:`'마법의 까마귀 물약'이라고 상상하며, 주문을 외우고 바른다.`, l:`'마법의 까마귀 물약'이라 여기며 주문을 외우고 바른다.`, s:{e:`마법 물약이라 상상하며 발랐다`, l:`물약의 주문을 외웠다`}},

  {w:`diana`, f:`anne_sad`, o:`diana`, bk:[`28-1`,`28-2`,`28-3`,`28-4`], cam:`in`,

  {bg:`ch9_drift`, w:`anne`, in:1, f:`anne_dreamy`, bk:[`28-19`], cam:`up`,
   e:`몇 분 동안 나는 천천히 떠내려가며 낭만적인 기분을 한껏 즐겼어. 그런데… 등이 축축했어. 벌떡 일어나 보니, 배 바닥 커다란 틈으로 물이 콸콸 들어오고 있었어! 아까 그 말뚝이 배 바닥을 뜯어 놓은 거야. 이러다간 곶에 닿기 전에 가라앉을 거야. 노는? 선착장에 두고 왔어!`,
   l:`몇 분 동안 나는 천천히 떠내려가며 그 낭만을 한껏 누렸다. 그러다 전혀 낭만적이지 않은 일이 일어났다. 배에 물이 새기 시작한 것이다. 허둥지둥 일어난 나는 물이 쏟아져 들어오는 배 바닥의 커다란 틈을 멍하니 바라보았다. 이대로라면 배는 아래쪽 곶에 닿기 훨씬 전에 가라앉으리라. 노는 어디 있지? 선착장에 두고 왔다!`},

  talk: {
    e: [`앤은 왜 레드먼드 대학에 가지 않기로 했을까요? 내가 앤이라면 어떤 결정을 했을까요?`,
        `마릴라 아주머니가 처음으로 "너를 사랑한다"고 말한 장면을 읽고 어떤 느낌이 들었나요?`,
        `앤과 길버트가 드디어 친구가 됐어요. 5년 동안 화해하지 못했던 까닭과, 마침내 화해할 수 있었던 까닭을 생각해 봐요.`],
    l: [`앤의 결정은 '희생'일까요, '선택'일까요? "꿈의 목표를 바꿨을 뿐"이라는 앤의 말을 근거로 논해 봅시다.`,
        `마릴라와 존 블라이스의 이야기는 앤과 길버트의 이야기와 어떻게 겹치고 또 갈라지나요? 작가가 이 일화를 마지막 두 장에 배치한 의도를 생각해 봅시다.`,
        `'곧은길'과 '길모퉁이'라는 비유를 통해 이 소설 전체의 주제를 정리해 봅시다.`]

  /* ---------- 지난 이야기 ---------- */
  {id:`b1`, bg:`ch4`, w:`anne`, in:1, f:`anne_happy`, cam:`out`,
   e:`백합 아가씨 사건 뒤로 3년이 흘렀어. 스테이시 선생님의 퀸스 반에서 열심히 공부한 끝에, 나는 퀸스 학원 입학시험에 합격했어. 그것도 이백 명 중 일등으로! 길버트랑 동점이었지만, 내 이름이 맨 위에 있었어.`,
   l:`백합 아가씨 사건 뒤로 3년이 흘렀다. 스테이시 선생님의 퀸스 반에서 공부한 끝에, 나는 퀸스 학원 입학시험에 합격했다. 이백 명 가운데 일등으로. 길버트와 동점이었지만 내 이름이 맨 위에 있었다.`},
  {bg:`ch10_home`, w:`anne`, in:1, f:`anne_grown`, bk:[`32-40`,`32-41`], cam:`in`,
   e:`그 순간은 정말 살아 있을 보람이 있었어. 퀸스로 떠나기 전날, 마릴라 아주머니는 내 모습을 보고 우셨어. "네가 그냥 꼬맹이로 있었으면 싶었다. 이제 너는 다 자라서 떠나가는구나." 그리고 퀸스에서 1년 만에 1급 교사 자격증을 따고, 영문학 최고상인 에이버리 장학금까지 탔어! 가을엔 레드먼드 대학에 가게 됐어.`,
   l:`그 순간은 살아 있을 보람이 있었다. 퀸스로 떠나던 무렵, 아주머니는 나를 보며 눈물을 보였다. "네가 그냥 꼬맹이로 있었으면 싶었다. 이제 너는 다 자라서 떠나가는구나." 그리고 나는 퀸스에서 한 해 만에 1급 교사 자격증을 따고, 영문학 최고 성적에 주는 에이버리 장학금까지 받았다. 가을이면 레드먼드 대학에 간다.`},
  {w:`anne`, in:1, f:`anne_grown`, when:s => s.flags.gilbertSoft || s.flags.gilbertMaybe,
   e:`길버트는 아버지 형편 때문에 대학 대신 선생님이 된대. 그 연못가에서 사과를 받아 준 뒤로 우리는 인사 정도는 하는 사이가 됐지만, 아직 진짜 친구는 아니야. 경쟁할 길버트가 없는 대학이라니, 조금 김빠질 것 같아.`,
   l:`길버트는 아버지의 형편 때문에 대학 대신 교사가 된다고 했다. 연못가에서 사과를 받아 준 뒤로 우리는 인사 정도는 나누었지만, 진짜 친구라고 하기는 어려웠다. 그 친구이자 적이 없는 대학 생활은 조금 김빠질 것만 같았다.`},
  {w:`anne`, in:1, f:`anne_grown`, when:s => !(s.flags.gilbertSoft || s.flags.gilbertMaybe),
   e:`길버트는 아버지 형편 때문에 대학 대신 선생님이 된대. 그 연못가에서 내가 거절한 뒤로, 우리는 길에서 마주쳐도 모르는 척 지나쳤어. 그런데 이상하지. 경쟁할 길버트가 없는 대학이라니, 조금 김빠질 것 같아.`,
   l:`길버트는 아버지의 형편 때문에 대학 대신 교사가 된다고 했다. 연못가에서 내가 거절한 뒤로, 우리는 길에서 열두 번을 마주쳐도 아는 척하지 않았다. 그런데 이상하게도, 그 친구이자 적이 없는 대학 생활은 김빠질 것만 같았다.`},

  {bg:`ch10_pasture`, w:`anne`, in:1, f:`anne_grown`, o:`matthew`, bk:[`36-38`], cam:`out`, eff:{item:`avery`},
   e:`집에 돌아온 날, 나는 그리운 곳들을 모두 찾아다녔어. 드라이어드의 샘, 제비꽃 골짜기, 목사관… 그리고 저녁엔 매슈 아저씨와 '연인의 오솔길'을 지나 소를 몰러 갔어. 숲은 온통 노을빛이었어. 아저씨는 고개를 숙이고 천천히 걸으셨어. 요즘 아저씨 심장이 안 좋으시대.`,
   l:`집에 돌아온 날, 나는 정든 곳들을 모두 찾아다녔다. 드라이어드의 샘과 제비꽃 골짜기, 목사관. 그리고 저녁에는 매슈 아저씨와 '연인의 오솔길'을 지나 뒷목장으로 소를 몰러 갔다. 숲은 온통 노을빛이었다. 아저씨는 고개를 숙인 채 천천히 걸었고, 나는 경쾌한 걸음을 아저씨에게 맞추었다. 이번 봄, 아저씨는 심장 때문에 몇 번이나 몹시 아팠다고 했다.`},
  {w:`matthew`, f:`anne_grown`, o:`matthew`, bk:[`36-39`,`36-40`],
   e:`"오늘 너무 무리하셨어요, 아저씨. 좀 쉬엄쉬엄 하세요." "글쎄다, 그게 잘 안 되는구나. 늙어 가는 걸 자꾸 잊어버려서 그렇지."`,
   l:`"오늘 너무 무리하셨어요, 아저씨. 왜 좀 쉬엄쉬엄 하지 않으세요?" "글쎄다, 그게 잘 안 되는구나." 마당 문을 열며 아저씨가 말했다. "늙어 가는 걸 자꾸 잊어버려서 그렇지, 앤."`},
  {t:`choice`, id:`C1`, kind:`talk`, label:`노을 속의 매슈`, f:`anne_grown`, o:`matthew`,
   q:{e:`힘들어 보이는 매슈 아저씨. 앤은 뭐라고 말할까요?`, l:`지쳐 보이는 매슈에게, 앤은 무엇이라 말할까요?`},
   note:{e:`원작의 앤은 "제가 아저씨가 부탁하신 남자아이였다면 지금 많이 도와드릴 수 있었을 텐데요."라고 말해요. 그러자 매슈 아저씨는 앤의 손을 토닥이며, 앤의 일생에서 가장 소중한 말을 해 주세요.`,
         l:`원작에서 앤은 "제가 그 남자아이였다면 아저씨를 도와드릴 수 있었을 텐데"라고 말합니다. 1장, 남자아이 대신 역에 서 있던 앤을 떠올리게 하는 말이지요. 매슈는 그 말에 이 소설에서 가장 유명한 대답으로 응합니다.`},
   opts:[
    {type:`canon`, go:`m_c`, e:`"제가 아저씨가 부탁하신 남자아이였다면, 지금 많이 도와드릴 수 있었을 텐데요."`, l:`"제가 그때 그 남자아이였다면, 지금 아저씨를 많이 도와드릴 수 있었을 텐데요."`, s:{e:`남자아이였다면 좋았겠다고 했다`, l:`남자아이였다면 하고 말했다`}},
    {type:`imag`, go:`m_i`, eff:{album:`dozenBoys`}, e:`"걱정 마세요! 저 혼자서 남자아이 열두 명 몫을 해낼 거예요!"`, l:`"걱정 마세요. 저 혼자 남자아이 열두 명 몫을 해낼게요!"`, s:{e:`열두 명 몫을 하겠다고 했다`, l:`열두 명 몫을 장담했다`}},
    {type:`bal`, go:`m_b`, eff:{album:`restMatthew`, heart:{matthew:1}}, e:`"아저씨, 이제 좀 쉬세요. 오늘부터 소는 제가 몰게요."`, l:`"아저씨, 이제 쉬세요. 오늘부터 소는 제가 몰게요."`, s:{e:`오늘부터 소는 내가 몰겠다고 했다`, l:`아저씨의 짐을 덜었다`}}

  {id:`m_c`, w:`anne`, f:`anne_grown`, o:`matthew`, bk:[`36-41`],
   e:`"제가 아저씨가 부탁하신 남자아이였다면, 지금 아저씨를 많이 도와드리고 수백 가지로 덜어 드릴 수 있었을 텐데요. 그것 때문이라면 남자아이였으면 좋았겠다는 생각도 들어요."`,
   l:`"제가 아저씨가 부탁하신 남자아이였다면," 나는 쓸쓸하게 말했다. "지금 아저씨를 많이 도와드리고 수백 가지로 덜어 드릴 수 있었을 텐데요. 그것 때문이라면 남자아이였으면 좋았겠다는 생각도 들어요."`},

   l:`"걱정 마세요, 아저씨. 1급 교사 자격증도 있고 에이버리 장학금도 탔잖아요. 저 혼자서 남자아이 열두 명 몫쯤은 거뜬히 해낼 거예요!" 아저씨가 쿡쿡 웃었다.`},

  {id:`m_b`, w:`anne`, f:`anne_grown`, o:`matthew`,
   e:`나는 아저씨 손에서 소 막대기를 살며시 받아 들었어. "아저씨, 이제 좀 쉬세요. 오늘부터 소는 제가 몰게요." 아저씨가 잠시 나를 바라보셨어. 눈가에 주름이 가득한 다정한 눈으로.`,
   l:`나는 아저씨 손에서 소 막대기를 살며시 받아 들었다. "아저씨, 이제 좀 쉬세요. 오늘부터 소는 제가 몰게요." 아저씨가 잠시 나를 바라보았다. 눈가에 주름이 가득한 다정한 눈이었다.`},
  {id:`m_m`, w:`matthew`, f:`anne_grown`, o:`matthew`, bk:[`36-42`], cam:`in`,
   e:`"글쎄다, 나는 남자아이 열두 명보다 네가 더 좋다, 앤." 아저씨가 내 손을 토닥이셨어. "그걸 꼭 기억하렴. 남자아이 열두 명보다 말이다. 에이버리 장학금을 탄 건 남자아이가 아니었지? 여자아이였어. 내 딸… 내가 자랑스러워하는 내 딸."`,
   l:`"글쎄다, 나는 남자아이 열두 명보다 네가 더 좋다, 앤." 아저씨가 내 손을 토닥였다. "그걸 꼭 기억하렴. 남자아이 열두 명보다 말이다. 그래, 에이버리 장학금을 탄 건 남자아이가 아니었지, 그렇지? 여자아이였어. 내 딸… 내가 자랑스러워하는 내 딸."`},
  {bg:`ch2_room`, w:`anne`, in:1, f:`anne_grown`, bk:[`36-43`], cam:`up`,
   e:`아저씨는 수줍게 웃으며 마당으로 들어가셨어. 그날 밤 나는 열린 창가에 오래 앉아 있었어. 달빛 속에 '눈의 여왕' 벚나무가 하얗게 서 있고, 개구리들이 노래했지. 나는 그 은빛 밤을 언제까지나 기억해. 그건… 슬픔이 내 삶에 닿기 전, 마지막 밤이었거든.`,
   l:`아저씨는 수줍은 미소를 지으며 마당으로 들어갔다. 그날 밤 나는 열린 창가에 오래 앉아 지난날을 생각하고 앞날을 꿈꾸었다. 달빛 속에 '눈의 여왕'이 안개처럼 하얗게 서 있었고, 늪에서는 개구리들이 노래했다. 나는 그 밤의 은빛 평화를 언제까지나 기억한다. 그것은 슬픔이 내 삶에 닿기 전 마지막 밤이었다.`},

  {bg:`ch2`, w:`marilla`, in:1, f:`anne_grown`, o:`marilla_strict`, bk:[`37-1`,`37-2`,`37-3`], cam:`shake`, eff:{item:`narcissus`},
   e:`다음 날 아침, 하얀 수선화를 한 아름 안고 복도를 지나는데 아주머니의 외침이 들렸어. "오라버니, 왜 그래요? 어디 아파요?" 현관에 서 계신 아저씨는 접힌 신문을 손에 들고, 얼굴이 잿빛이었어. 우리가 달려가기도 전에, 아저씨는 문지방 위로 쓰러지셨어.`,
   l:`이튿날 아침, 하얀 수선화를 한 아름 안고 복도를 지나던 나는 아주머니의 외침을 들었다. "오라버니, 왜 그래요? 어디 아파요?" 현관 문간에 선 아저씨는 접힌 신문을 손에 쥐고 있었고, 얼굴은 이상하게 일그러진 잿빛이었다. 나는 꽃을 떨어뜨리고 달려갔다. 그러나 우리가 닿기도 전에 아저씨는 문지방 위로 쓰러졌다.`},
  {w:`lynde`, f:`anne_grown`, o:`lynde`, bk:[`37-4`,`37-5`,`37-6`,`37-7`,`37-8`,`37-9`,`37-10`],
   e:`달려온 린드 부인이 아저씨의 가슴에 귀를 대 보시더니, 눈물을 글썽이셨어. "아, 마릴라… 우리가 해 줄 수 있는 게 없는 것 같아요." 의사 선생님은 갑작스러운 충격 때문이라고 하셨어. 아저씨가 쥐고 있던 신문에는, 우리 집 돈을 모두 맡겨 둔 애비 은행이 망했다는 소식이 실려 있었어.`,
   l:`달려온 린드 부인이 아저씨의 맥을 짚고 가슴에 귀를 대더니, 눈물을 글썽였다. "아, 마릴라… 우리가 해 줄 수 있는 게 없는 것 같아요." 의사는 갑작스러운 충격 때문이며, 아마 고통은 없었을 거라고 했다. 아저씨가 쥐고 있던 신문에는, 우리 집 돈을 모두 맡겨 둔 애비 은행이 파산했다는 소식이 실려 있었다.`},
  {w:`anne`, in:1, f:`anne_grown`, bk:[`37-11`,`37-12`], cam:`in`,
   e:`그날 처음으로, 수줍고 조용한 매슈 아저씨가 에이번리 모든 사람의 한가운데에 있었어. 밤이 되자 아저씨는 응접실에 누워 계셨어. 즐거운 꿈을 꾸며 잠든 것 같은, 작고 다정한 미소를 지은 채로. 나는 아저씨 어머니가 심으셨고 아저씨가 말없이 사랑하셨던 옛날 꽃들을 꺾어 곁에 놓아 드렸어. 그게 내가 해 드릴 수 있는 마지막 일이었어.`,
   l:`그날 처음으로, 수줍고 조용한 매슈 커스버트는 모든 일의 한가운데에 있었다. 밤이 오자 아저씨는 응접실에 누워 있었다. 즐거운 꿈을 꾸며 잠든 사람처럼, 작고 다정한 미소를 머금은 채로. 나는 아저씨의 어머니가 심었고 아저씨가 남몰래 말없이 사랑했던 옛날 꽃들을 꺾어 곁에 놓았다. 그것이 내가 아저씨를 위해 할 수 있는 마지막 일이었다.`},
  {bg:`ch2_room`, w:`diana`, f:`anne_grown`, o:`diana_grown`, bk:[`37-13`,`37-14`],
   e:`그날 밤, 다락방 창가에 서 있는 나에게 다이애나가 조용히 물었어. "앤, 오늘 밤 같이 자 줄까?"`,
   l:`그날 밤, 다락방 창가에 서 있는 나에게 다이애나가 조용히 물었다. "앤, 오늘 밤 같이 자 줄까?"`},
  {t:`choice`, id:`C2`, kind:`talk`, label:`슬픔의 첫 밤`, f:`anne_grown`, o:`diana_grown`,

   note:{e:`원작의 앤은 "고마워. 하지만 오해하지 말아 줘. 혼자 있고 싶어. 아직 실감이 나지 않아."라고 말해요. 그리고 다음 장면에서, 그 슬픔이 '누구의 슬픔'인지 깨닫게 되지요.`,
         l:`원작에서 앤은 혼자 있고 싶다고 말합니다. 눈물조차 나지 않는 "무딘 아픔" 속에서 실감하려 애쓰지요. 그리고 한밤중, 이 슬픔을 진정으로 함께 나눌 수 있는 사람이 누구인지 깨닫게 됩니다.`},
   opts:[
    {type:`canon`, go:`n_c`, e:`"고마워, 다이애나. 하지만 혼자 있고 싶어. 아직 실감이 나지 않아."`, l:`"고마워. 하지만 혼자 있고 싶어. 아직 실감이 나지 않아."`, s:{e:`혼자 있고 싶다고 했다`, l:`홀로 슬픔을 마주했다`}},
    {type:`imag`, go:`n_i`, eff:{album:`starLetter`}, e:`"고마워. 오늘은 혼자서 별을 보며 아저씨께 편지를 쓰고 싶어."`, l:`"고마워. 오늘은 혼자 별을 보며 아저씨께 편지를 쓰고 싶어."`, s:{e:`별을 보며 편지를 쓰고 싶다고 했다`, l:`별에게 편지를 썼다`}},
    {type:`bal`, go:`n_b`, eff:{album:`quietDiana`, heart:{diana:1}}, e:`"잠깐만 곁에 있어 줘. 아무 말 안 해도 돼."`, l:`"잠깐만 곁에 있어 줘. 아무 말도 안 해도 돼."`, s:{e:`말없이 곁에 있어 달라고 했다`, l:`친구의 곁을 받아들였다`}}
   ]},
  {id:`n_c`, w:`anne`, f:`anne_grown`, o:`diana_grown`, bk:[`37-15`,`37-16`,`37-17`],
   e:`"고마워, 다이애나. 혼자 있고 싶다고 해도 오해하지 않을 거지? 무서운 게 아니야. 아직 실감이 나지 않아. 반쯤은 아저씨가 돌아가셨을 리 없다는 생각이 들고, 반쯤은 아주 오래전부터 이 무딘 아픔을 안고 살아온 것 같아." 다이애나는 다정하게 물러나 주었어. 나는 혼자 창가에 앉아 있었지만, 눈물은 나지 않았어.`,
   l:`"고마워, 다이애나. 혼자 있고 싶다고 해도 네가 오해하지 않을 거라 믿어. 무서운 게 아니야. 실감이 나지 않아. 반쯤은 아저씨가 돌아가셨을 리 없다는 생각이 들고, 반쯤은 아주 오래전부터 이 끔찍하고 무딘 아픔을 안고 살아온 것만 같아." 다이애나는 다정하게 물러났다. 나는 창가에 무릎을 꿇고 별을 올려다보며 기도했지만, 눈물은 나지 않았다.`},
  {t:`goto`, to:`n_m`},
  {id:`n_i`, w:`anne`, in:1, f:`anne_grown`, fx:`dream`, cam:`up`,
   e:`나는 혼자 창가에 앉아 별을 올려다보며 마음속으로 편지를 썼어. '아저씨, 저를 데리러 역에 와 주셨던 날을 기억하세요? 그날 아저씨는 저를 남자아이 대신 데려가 주셨죠….' 그런데 이상하게도, 눈물은 한 방울도 나지 않았어.`,
   l:`나는 홀로 창가에 앉아 별을 올려다보며 마음속으로 편지를 썼다. '아저씨, 저를 데리러 역에 오셨던 날을 기억하세요? 그날 아저씨는 남자아이 대신 저를 데려가 주셨지요….' 그러나 이상하게도 눈물은 한 방울도 나지 않았다.`},
  {t:`goto`, to:`n_m`},
  {id:`n_b`, w:`diana`, f:`anne_grown`, o:`diana_grown`,
   e:`"잠깐만 곁에 있어 줘. 아무 말 안 해도 돼." 다이애나는 정말로 아무 말 없이 내 옆에 앉아 손을 잡아 주었어. 한참 뒤 다이애나가 돌아가고 나서도 그 손의 온기가 남아 있었어. 하지만 눈물은 나지 않았어.`,
   l:`"잠깐만 곁에 있어 줘. 아무 말도 안 해도 돼." 다이애나는 정말 아무 말 없이 곁에 앉아 내 손을 잡았다. 한참 뒤 다이애나가 돌아간 뒤에도 그 손의 온기가 남아 있었다. 그러나 눈물은 나지 않았다.`},
  {id:`n_m`, w:`anne`, in:1, f:`anne_grown`, bk:[`37-18`], cam:`in`,
   e:`한밤중에 깨어났을 때, 지난 저녁 대문 앞에서 웃으시던 아저씨의 얼굴이 떠올랐어. "내 딸… 내가 자랑스러워하는 내 딸." 그제야 눈물이 쏟아졌어. 나는 가슴이 터지도록 울었어. 그 소리를 들은 아주머니가 살며시 들어오셨어.`,
   l:`한밤중에 깨어났을 때, 지난 저녁 대문에서 헤어질 때 내게 미소 짓던 아저씨의 얼굴이 떠올랐다. "내 딸… 내가 자랑스러워하는 내 딸." 그제야 눈물이 쏟아졌다. 나는 가슴이 터지도록 울었다. 그 소리를 들은 아주머니가 살며시 들어와 나를 달랬다.`},
  {w:`anne`, f:`anne_grown`, o:`marilla_warm`, bk:[`37-19`,`37-20`],
   e:`"아, 그냥 울게 해 주세요, 아주머니. 눈물은 아까 그 아픔만큼 아프지 않아요. 잠깐만 저를 안아 주세요. 이건 다이애나의 슬픔이 아니에요. 우리의 슬픔이에요. 아주머니와 저의. 아, 아저씨 없이 우리 어떻게 살아요?"`,
   l:`"아, 그냥 울게 해 주세요, 아주머니. 눈물은 아까 그 아픔만큼 아프지 않아요. 잠깐만 팔로 저를 안아 주세요. 이렇게요. 다이애나는 착하고 다정하지만, 이건 그 애의 슬픔이 아니에요. 이건 우리의 슬픔이에요. 아주머니와 저의 슬픔. 아, 아주머니, 아저씨 없이 우리 어떻게 살아요?"`},
  {w:`marilla`, f:`anne_grown`, o:`marilla_warm`, bk:[`37-21`], cam:`in`, eff:{heart:{marilla:1}},
   e:`"우리한텐 서로가 있잖니, 앤. 네가 오지 않았다면 내가 어떻게 됐을지 모르겠구나. 내가 너한테 좀 엄하게 굴었을지도 모르지. 하지만 내가 오라버니만큼 너를 사랑하지 않았다고 생각하면 안 된다. 말할 수 있을 때 말해 두고 싶구나. 나는 너를 내 살붙이처럼 사랑한다. 네가 온 뒤로 너는 줄곧 나의 기쁨이고 위안이었다."`,
   l:`"우리한텐 서로가 있잖니, 앤. 네가 여기 없었다면, 네가 오지 않았다면 내가 어떻게 됐을지 모르겠구나. 내가 너한테 좀 엄하고 모질게 굴었을지도 모르지. 하지만 그렇다고 내가 오라버니만큼 너를 사랑하지 않았다고 생각하면 안 된다. 마음속 이야기를 꺼내는 건 늘 쉽지 않았지만, 이럴 때는 조금 쉬워지는구나. 나는 너를 내 살붙이처럼 사랑한다. 네가 초록 지붕 집에 온 뒤로 너는 줄곧 나의 기쁨이고 위안이었다."`},

  {bg:`ch7_garden`, w:`allan`, in:1, f:`anne_grown`, o:`allan`, bk:[`37-22`,`37-23`,`37-24`], cam:`out`,
   e:`시간이 흐르고, 나는 해돋이가 여전히 아름답고 다이애나의 농담에 웃음이 난다는 게 부끄러웠어. "아저씨를 배신하는 것 같아요." 앨런 사모님이 부드럽게 말씀하셨어. "아저씨는 네 웃음소리를 좋아하셨지. 지금은 그저 멀리 가 계실 뿐이란다. 그리고 여전히 똑같이 그걸 좋아하실 거야."`,
   l:`시간이 흘렀다. 전나무 뒤로 떠오르는 해가 여전히 기쁨을 주고 다이애나의 농담에 웃음이 난다는 것이, 나는 부끄러웠다. "아저씨를 배신하는 것만 같아요." 목사관 뜰에서 앨런 사모님이 부드럽게 말했다. "아저씨는 네 웃음소리를 좋아하셨고, 네가 즐거운 것들에서 기쁨을 찾는 걸 좋아하셨지. 지금은 그저 멀리 가 계실 뿐이란다. 그리고 여전히 똑같이 그걸 좋아하실 거야."`},

    {type:`bal`, go:`r_b`, eff:{item:`scotchRose`, album:`cowsAgain`, heart:{marilla:1}}, e:`아저씨가 하던 일, 저녁마다 소 몰기를 내가 이어서 한다.`, l:`아저씨가 하던 저녁 소 몰기를 내가 이어받는다.`, s:{e:`아저씨의 일을 이어받았다`, l:`아저씨의 자리를 이었다`}}

  {id:`r_c`, w:`anne`, f:`anne_grown`, o:`allan`, bk:[`37-25`],
   e:`"오늘 아저씨 곁에 장미를 심었어요. 아저씨 어머니가 스코틀랜드에서 가져오신 작고 하얀 장미요. 아저씨가 제일 좋아하셨거든요. 어쩌면 아저씨가 여러 여름 동안 사랑하셨던 그 장미들의 영혼이, 천국에서 아저씨를 맞아 주었을지도 몰라요."`,
   l:`"오늘 오후에 아저씨 곁에 장미를 심었어요. 아저씨 어머니가 오래전에 스코틀랜드에서 가져오신 작고 하얀 장미예요. 아저씨는 늘 그 장미를 제일 좋아하셨어요. 어쩌면 아저씨가 여러 여름 동안 사랑하셨던 그 작은 장미들의 영혼이, 천국에서 아저씨를 맞아 주었을지도 몰라요."`},

  {id:`r_i`, w:`anne`, in:1, f:`anne_grown`, fx:`dream`, cam:`up`,
   e:`나는 아저씨가 말없이 사랑하던 뜰의 옛날 꽃들 앞에 앉아 이야기를 들려줬어. "있잖아, 너희를 제일 좋아하던 분이 계셨어. 그분은 처음 만난 여자아이를 위해 볼록한 소매 드레스를 사 오셨대…." 바람이 불자 꽃들이 고개를 끄덕이는 것 같았어. 그리고 나는 하얀 장미 가지 하나를 꺾어 아저씨 곁에 심었어.`,
   l:`나는 아저씨가 말없이 사랑하던 뜰의 옛 꽃들 앞에 앉아 이야기를 들려주었다. "너희를 가장 사랑하던 분이 계셨어. 그분은 처음 만난 여자아이에게 볼록한 소매 드레스를 사다 주셨지…." 바람이 불자 꽃들이 고개를 끄덕이는 듯했다. 그리고 나는 하얀 장미 가지 하나를 아저씨 곁에 심었다.`},

  {id:`r_b`, bg:`ch10_pasture`, w:`anne`, in:1, f:`anne_grown`,

  /* ---------- 현관의 저녁, 마릴라의 비밀 ---------- */
  {id:`r_m`, bg:`ch10`, w:`marilla`, in:1, f:`anne_grown`, o:`marilla_warm`, bk:[`37-27`,`37-28`,`37-29`,`37-30`,`37-31`,`37-32`], cam:`out`,
   e:`그날 저녁, 아주머니와 현관 계단에 나란히 앉았어. "그 시절 너는 정말 실수투성이였지. 머리 염색했던 거 기억나니?" "그럼요, 절대 못 잊죠." 나는 감아 올린 땋은 머리를 만지며 웃었어. 이제 사람들은 내 머리가 적갈색이라고 해. 조시 파이만 빼고!`,
   l:`그날 저녁, 아주머니와 나는 현관 계단에 나란히 앉았다. "그 시절 너는 정말 실수투성이였지, 앤. 머리 염색했던 거 기억나니?" "그럼요, 절대 못 잊죠." 나는 단정하게 감아 올린 탐스러운 땋은 머리를 만지며 웃었다. 주근깨는 다 사라졌고, 사람들은 이제 내 머리가 적갈색이라고 했다. 조시 파이만 빼고.`},
  {w:`marilla`, f:`anne_grown`, o:`marilla_warm`, bk:[`37-36`,`37-37`,`37-38`,`37-39`], cam:`in`,
   e:`"길버트 블라이스도 선생이 된다지?" "네." "참 잘생긴 청년이야. 그 나이 때 제 아버지를 꼭 닮았어. 존 블라이스… 그 사람이랑 나는 정말 친한 사이였단다. 사람들은 그를 내 애인이라고 불렀지." "어머, 아주머니! 그래서 어떻게 됐어요?"`,
   l:`"길버트 블라이스도 선생이 된다지?" "네." 짧은 대답이었다. "참 잘생긴 청년이야. 그 나이 때 제 아버지를 꼭 닮았구나. 존 블라이스는 좋은 청년이었지. 그 사람이랑 나는 정말 친한 사이였단다. 사람들은 그를 내 애인이라고 불렀지." 나는 눈을 반짝이며 고개를 들었다. "어머, 아주머니, 그래서 어떻게 됐어요?"`},
  {t:`choice`, id:`C4`, kind:`predict`, label:`마릴라의 옛 낭만`, f:`anne_grown`, o:`marilla_warm`,
   q:{e:`마릴라 아주머니와 존 블라이스 사이에는 무슨 일이 있었을까요?`, l:`마릴라와 존 블라이스. 원작에서 두 사람은 어떻게 되었을까요?`},
   note:{e:`원작에서 두 사람은 말다툼을 했어요. 존이 용서해 달라고 했지만 아주머니는 화가 나서 용서하지 않았고, 존은 다시 오지 않았대요. 아주머니는 "기회가 있었을 때 용서할걸" 하고 늘 후회했대요. 어디서 많이 들어 본 이야기 같지 않나요?`,
         l:`원작에서 마릴라는 존과 다툰 뒤 용서를 청하는 그를 벌주려 했고, 자존심 센 존은 다시 오지 않았습니다. "기회가 있을 때 용서할걸" 하는 마릴라의 오랜 후회는, 연못가에서 길버트를 거절한 앤의 모습과 정확히 겹칩니다.`},
   opts:[
    {type:`canon`, go:`j_c`, eff:{album:`johnBlythe`}, e:`다툰 뒤 존이 용서를 빌었지만 마릴라가 용서하지 않았다.`, l:`다툰 뒤 용서를 청한 존을 마릴라가 끝내 용서하지 않았다.`, s:{e:`용서하지 않아 헤어졌다고 맞혔다`, l:`엇갈린 용서를 맞혔다`}},
    {type:`imag`, go:`j_i`, eff:{album:`johnBlythe`}, e:`존이 먼 바다로 모험을 떠나 돌아오지 못했다.`, l:`존이 먼 바다로 모험을 떠나 돌아오지 못했다.`, s:{e:`존이 바다로 떠났다고 상상했다`, l:`바다의 이별을 상상했다`}},
    {type:`bal`, go:`j_b`, eff:{album:`johnBlythe`}, e:`둘 다 자존심이 세서 서로 먼저 말을 걸지 못했다.`, l:`둘 다 자존심이 세서 먼저 다가가지 못했다.`, s:{e:`둘 다 자존심 때문이라 짐작했다`, l:`서로의 자존심을 짚었다`}}
   ]},
  {id:`j_c`, w:`marilla`, f:`anne_grown`, o:`marilla_warm`, bk:[`37-40`],
   e:`"말다툼을 했단다. 그가 용서해 달라고 했을 때 나는 용서하지 않았어. 얼마 뒤엔 용서할 생각이었지. 하지만 화가 나서 먼저 벌을 주고 싶었던 거야. 그는 다시 오지 않았다. 블라이스 집안은 자존심이 아주 셌거든. 나는 늘… 기회가 있었을 때 용서할걸 하고 후회했다."`,
   l:`"말다툼을 했단다. 그가 용서해 달라고 했을 때 나는 용서하지 않았어. 얼마 뒤엔 용서할 생각이었지만, 뾰로통하고 화가 나서 먼저 벌을 주고 싶었던 거야. 그는 다시 오지 않았다. 블라이스 집안 사람들은 다들 자존심이 아주 셌거든. 하지만 나는 늘 좀 후회가 됐다. 기회가 있었을 때 용서할걸 하고."`},
  {t:`goto`, to:`j_m`},
  {id:`j_i`, w:`marilla`, f:`anne_grown`, o:`marilla_warm`,
   e:`"바다로 떠났다고? 하하, 그랬다면 차라리 낭만적이었겠구나." 아주머니가 쓸쓸하게 웃으셨어. "아니다. 말다툼을 했단다. 그가 용서해 달라고 했는데 내가 용서하지 않았어. 그는 다시 오지 않았지. 기회가 있었을 때 용서할걸… 늘 그렇게 후회했다."`,
   l:`"바다로 떠났다고? 그랬다면 차라리 낭만적이었겠구나." 아주머니가 쓸쓸하게 웃었다. "아니다. 말다툼을 했단다. 그가 용서해 달라고 했는데 나는 용서하지 않았어. 그는 다시 오지 않았지. 기회가 있었을 때 용서할걸, 늘 그렇게 후회했다."`},

  {id:`j_b`, w:`marilla`, f:`anne_grown`, o:`marilla_warm`,
   e:`"그래, 자존심이 문제였지. 말다툼을 했는데, 그가 용서해 달라고 했을 때 나는 먼저 벌을 주고 싶어서 용서하지 않았단다. 블라이스 집안도 자존심이 세서 그는 다시 오지 않았어. 기회가 있었을 때 용서할걸… 늘 그렇게 바랐다."`,
   l:`"그래, 자존심이 문제였지. 다툰 뒤 그가 용서를 청했는데, 나는 먼저 벌을 주고 싶어 용서하지 않았단다. 블라이스 집안도 자존심이 셌으니 그는 다시 오지 않았어. 기회가 있을 때 용서할걸, 늘 그렇게 바랐다."`},
  {id:`j_m`, w:`anne`, f:`anne_grown`, o:`marilla_warm`, bk:[`37-41`,`37-42`], cam:`in`,
   e:`"그럼 아주머니한테도 낭만이 있었네요." "그래, 그렇게 부를 수도 있겠지. 사람은 겉만 보고는 알 수 없는 법이란다. 지난 일요일에 길버트를 보니 다 되살아나더구나." 나는 아무 말도 할 수 없었어. 연못가에서 길버트에게 "절대 친구 안 해!"라고 했던 내 모습이 떠올랐거든.`,
   l:`"그럼 아주머니한테도 낭만이 있었네요." 내가 부드럽게 말했다. "그래, 그렇게 부를 수도 있겠지. 나를 보면 그렇게 생각되지 않지? 하지만 사람은 겉만 보고는 알 수 없는 법이란다. 지난 일요일에 길버트를 보니 다 되살아나더구나." 나는 아무 말도 할 수 없었다. 연못가에서 길버트에게 등을 돌리던 내 모습이 떠올랐기 때문이다.`},
  /* ---------- 마릴라의 눈, 그리고 결심 ---------- */
  {bg:`ch2`, w:`marilla`, in:1, f:`anne_grown`, o:`marilla_strict`, bk:[`38-1`,`38-4`,`38-5`,`38-6`,`38-7`], cam:`shake`,
   e:`다음 날 안과 의사를 만나고 오신 아주머니는 식탁에 힘없이 앉아 계셨어. "책 읽기도 바느질도 그만두고, 울지도 말고, 안경을 쓰면 더 나빠지지 않을 수도 있대. 하지만 그러지 않으면 여섯 달 안에 눈이 완전히 멀 거래. 앤, 생각해 보렴!"`,
   l:`이튿날 안과 의사를 만나고 돌아온 아주머니는 손으로 머리를 괸 채 식탁에 맥없이 앉아 있었다. "책 읽기와 바느질을 그만두고, 울지 않도록 조심하고, 안경을 쓰면 눈이 더 나빠지지 않을 수도 있대. 하지만 그러지 않으면 여섯 달 안에 틀림없이 완전히 눈이 먼다는구나. 앤, 생각해 보렴!"`},
  {w:`marilla`, f:`anne_grown`, o:`marilla_strict`, bk:[`38-11`,`38-13`,`38-14`], cam:`in`,
   e:`며칠 뒤, 카모디의 새들러 씨가 다녀간 뒤 아주머니가 울먹이며 말씀하셨어. "초록 지붕 집을 사고 싶다는구나. 앤, 달리 방법이 없다. 우리 돈은 모두 그 은행에 있었고, 눈이 이러니 농장을 꾸릴 수도 없어. 네가 장학금이 있어서 다행이다. 방학 때 돌아올 집이 없어지는 게 미안할 뿐이구나."`,
   l:`며칠 뒤, 카모디의 존 새들러 씨가 다녀간 뒤 아주머니가 눈물을 참지 못하고 말했다. "내가 초록 지붕 집을 판다는 소문을 듣고 사고 싶다는구나. 앤, 달리 방법이 없다. 우리 돈은 한 푼도 남김없이 그 은행에 있었고, 눈이 이러니 농장을 꾸릴 수도 없어. 네가 장학금으로 앞날이 마련되어 있어서 고맙구나. 방학 때 돌아올 집이 없어지는 게 미안할 뿐이다."`},
  {t:`choice`, id:`C5`, kind:`act`, label:`초록 지붕 집의 운명`, f:`anne_grown`, o:`marilla_strict`,
   q:{e:`초록 지붕 집을 팔아야 한대요. 앤은 어떻게 할까요?`, l:`초록 지붕 집을 팔겠다는 마릴라. 앤의 결정은?`},
   note:{e:`원작의 앤은 "초록 지붕 집을 팔면 안 돼요. 저 레드먼드에 안 가요!"라고 말해요. 장학금을 포기하고 근처 학교 선생님이 되어 아주머니 곁에 남기로 하지요. 아주머니가 눈 진찰을 받고 온 그날 밤에 이미 결심했대요.`,
         l:`원작에서 앤은 장학금과 대학을 포기하고 집에 남아 가르치기로 합니다. 앤은 이것이 희생이 아니라 "꿈의 목표를 바꾼 것"이라 말하지요. 이 장의 제목 '길모퉁이'가 바로 이 결심에서 나옵니다.`},
   opts:[
    {type:`canon`, go:`h_c`, eff:{item:`bend`}, e:`"초록 지붕 집을 팔면 안 돼요. 저 레드먼드에 안 가요. 여기 남아서 가르칠게요."`, l:`"초록 지붕 집을 팔아선 안 돼요. 레드먼드엔 가지 않고, 남아서 가르칠게요."`, s:{e:`대학을 포기하고 남기로 했다`, l:`장학금을 내려놓았다`}},
    {type:`imag`, go:`h_i`, eff:{item:`bend`, album:`dreamSchool`}, e:`"초록 지붕 집을 '초록 지붕 대학'으로 만들어요! 저는 여기서 가르치고, 여기서 공부할게요."`, l:`"이곳을 '초록 지붕 대학'으로 만들어요. 여기서 가르치고, 여기서 배울게요."`, s:{e:`초록 지붕 대학을 세웠다`, l:`집을 대학으로 상상했다`}},
    {type:`bal`, go:`h_b`, eff:{item:`bend`, album:`oneYear`}, e:`"제가 남을게요. 그리고 한 해 뒤에 아주머니 눈이 좋아지면, 그때 대학 일은 같이 다시 생각해요."`, l:`"제가 남을게요. 한 해 뒤 아주머니 눈이 나아지면, 그때 대학은 함께 다시 생각해요."`, s:{e:`남되, 한 해 뒤 다시 생각하자 했다`, l:`함께 결정하자고 했다`}}
   ]},
  {id:`h_c`, w:`anne`, f:`anne_grown`, o:`marilla_strict`, bk:[`38-15`,`38-17`,`38-19`], cam:`in`,
   e:`"초록 지붕 집을 팔면 안 돼요. 혼자 계시지 않아도 돼요, 아주머니. 제가 같이 있을게요. 저 레드먼드에 안 가요." "레드먼드에 안 간다고!" "아주머니가 시내에서 돌아오신 날 밤에 결심했어요. 배리 아저씨가 농장을 빌리고 싶어 하시고, 저는 카모디 학교에서 가르칠 거예요. 아주머니께 책을 읽어 드리면서, 우리 둘이 오순도순 행복하게 지내요."`,
   l:`"초록 지붕 집을 팔면 안 돼요. 혼자 계시지 않아도 돼요, 아주머니. 제가 같이 있을게요. 저 레드먼드에 안 가요." "레드먼드에 안 간다고! 그게 무슨 소리니?" "아주머니가 시내에서 돌아오신 날 밤에 그렇게 결심했어요. 배리 아저씨가 내년에 농장을 빌리고 싶어 하시고, 저는 카모디 학교에서 가르칠 거예요. 아주머니께 책을 읽어 드리고 기운을 북돋아 드릴게요. 우리 둘이 여기서 오순도순 행복하게 지낼 거예요."`},

   e:`"초록 지붕 집을 팔다니요! 차라리 여기를 '초록 지붕 대학'으로 만들어요. 낮에는 제가 카모디 학교에서 가르치고, 밤에는 여기서 라틴어랑 그리스어를 공부하는 거예요. 아주머니는 명예 학장님이시고요!" 아주머니가 눈물을 닦으며 어이없다는 듯 웃으셨어. "레드먼드는 어쩌고?" "레드먼드엔 안 가요."`,
   l:`"초록 지붕 집을 팔다니요! 차라리 이곳을 '초록 지붕 대학'으로 만들어요. 낮에는 카모디 학교에서 가르치고, 밤에는 여기서 라틴어와 그리스어를 공부하는 거예요. 아주머니는 명예 학장님이시고요." 아주머니가 눈물을 닦으며 어이없다는 듯 웃었다. "레드먼드는 어쩌고?" "레드먼드엔 가지 않아요."`},

  {id:`h_b`, w:`anne`, f:`anne_grown`, o:`marilla_warm`,

  {id:`h_m`, w:`marilla`, f:`anne_grown`, o:`marilla_warm`, bk:[`38-21`,`38-22`,`38-23`], cam:`in`,

  {w:`anne`, in:1, f:`anne_grown`, bk:[`38-23`], fx:`dream`, cam:`up`,
   e:`"퀸스를 떠날 때는 제 앞날이 곧은길처럼 쭉 뻗어 있는 것 같았어요. 그런데 이제 그 길에 모퉁이가 생겼어요. 모퉁이를 돌면 무엇이 있을지는 몰라요. 하지만 가장 좋은 것이 있다고 믿을래요. 그 모퉁이엔 나름의 매력이 있어요, 아주머니. 그 너머 길엔 어떤 초록빛 영광과, 어떤 새로운 풍경이 있을까요?"`,
   l:`"퀸스를 떠날 때는 제 앞날이 곧은길처럼 쭉 뻗어 있는 것 같았어요. 이정표가 몇 개나 이어지는지 다 보이는 것 같았죠. 그런데 이제 그 길에 모퉁이가 생겼어요. 모퉁이를 돌면 무엇이 있을지는 몰라요. 하지만 가장 좋은 것이 있다고 믿을래요. 그 모퉁이에는 나름의 매력이 있어요, 아주머니. 그 너머엔 어떤 초록빛 영광과 아롱지는 빛과 그림자가, 어떤 새로운 풍경과 굽이와 언덕과 골짜기가 있을까요."`},
  {w:`marilla`, f:`anne_grown`, o:`marilla_warm`, bk:[`38-25`,`38-26`],

   l:`"막으실 수 없어요. 저는 열여섯 살 반이고, 린드 부인 말씀대로 '노새처럼 고집이 세거든요.' 아, 아주머니, 저를 불쌍하게 여기지 마세요. 정든 초록 지붕 집에 남는다고 생각만 해도 마음속 깊이 기뻐요." "이 축복받은 아이야!" 아주머니가 마침내 물러섰다. "새 삶을 얻은 것 같구나."`},

  {bg:`ch10`, w:`lynde`, in:1, f:`anne_grown`, o:`lynde`, bk:[`38-28`,`38-29`,`38-33`,`38-34`,`38-35`], cam:`out`,
   e:`어느 여름 저녁, 현관에 앉은 우리에게 린드 부인이 찾아오셨어. "앤, 너 에이번리 학교에서 가르치게 됐다. 길버트가 네가 지원했다는 말을 듣자마자 이사들을 찾아가서, 자기는 화이트샌즈로 가겠다며 너한테 양보했다는구나. 네가 마릴라 곁에 있고 싶어 하는 걸 알고 말이야. 화이트샌즈에선 하숙비도 내야 하는데, 참 사려 깊은 일이지!"`,
   l:`어느 여름 저녁, 현관에 앉은 우리에게 린드 부인이 찾아왔다. "앤, 너는 바로 여기 에이번리에서 가르치게 될 거다. 길버트가 네가 지원했다는 말을 듣자마자 이사들을 찾아가 자기 지원을 철회하고, 네 걸 받아 달라고 했다는구나. 자기는 화이트샌즈에서 가르치겠다면서. 네가 마릴라와 함께 있고 싶어 한다는 걸 알고 양보한 거지. 화이트샌즈에선 하숙비도 내야 하는데, 정말 사려 깊은 일이야, 내 말이."`},
  {w:`anne`, f:`anne_grown`, o:`lynde`, bk:[`38-36`,`38-37`,`38-42`,`38-43`,`38-44`,`38-45`],
   e:`"제가… 길버트가 저를 위해 그런 희생을 하게 두면 안 될 것 같아요." "이제 와서 막을 수는 없다. 벌써 계약서에 서명했거든." 그날 밤 린드 부인은 남편에게 이렇게 말씀하셨대. "마릴라 커스버트는 부드러워졌어요. 그렇다니까요."`,
   l:`"길버트가 저를… 저를 위해 그런 희생을 하게 두면 안 될 것 같아요." "이제 와서 막을 수는 없다. 벌써 화이트샌즈 이사들과 계약서에 서명했거든." 그날 밤 린드 부인은 남편 토머스에게 말했다고 한다. "마릴라 커스버트는 부드러워졌어요. 그렇다니까요."`},

   l:`이튿날 저녁, 나는 아저씨 곁의 스코틀랜드 장미에 물을 주고 '반짝이는 호수'로 이어지는 긴 언덕을 걸어 내려왔다. 해 진 뒤의 에이번리가 꿈같은 저녁 빛 속에 펼쳐져 있었다. 나무 사이로 집집의 등불이 반짝였고, 그 너머로 안개 낀 보랏빛 바다가 끝없이 웅얼거렸다. "정든 세상아, 너는 정말 아름다워. 네 안에 살아 있어서 기뻐."`},
  {w:`gilbert`, f:`anne_grown`, o:`gilbert_grown`, bk:[`38-48`,`38-49`,`38-50`,`38-51`], cam:`in`, eff:{met:`gilbert`},
   e:`언덕 중간, 블라이스 씨네 대문에서 휘파람을 불며 키 큰 청년이 나왔어. 길버트였어. 나를 알아본 길버트는 휘파람을 멈추고 모자를 들어 인사하고는 그냥 지나가려 했어. 나는 멈춰 서서 손을 내밀었어. "길버트, 나를 위해 학교를 양보해 줘서 고마워." 길버트가 내 손을 반갑게 잡았어. "이제 우리 친구가 되는 거야? 내 옛날 잘못, 정말 용서해 준 거야?"`,

function esc(s){ return String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m])); }
function T(o){ if(!o) return ""; if(o.b) return o.b; return (level === "lit" ? (o.l || o.e) : (o.e || o.l)) || ""; }
const JOSA = {"이라고":"라고", "아":"야", "은":"는", "이":"가", "을":"를", "으로":"로", "과":"와", "이에요":"예요"};
function josa(word, form){
  const c = String(word || "").trim().slice(-1).charCodeAt(0);
  if(!(c >= 0xAC00 && c <= 0xD7A3)) return JOSA[form] || form;
  const jong = (c - 0xAC00) % 28;
  if(form === "으로" && jong === 8) return "로";
  return jong ? form : (JOSA[form] || form);
}
function fill(t){
  return t.replace(/\{(\w+)\|([^}]+)\}/g, (m, k, f) => josa(S.names[k] || DEFAULT_NAMES[k] || "", f))
          .replace(/\{(\w+)\}/g, (m, k) => S.names[k] || DEFAULT_NAMES[k] || "…");
}
function gloss(html){ return html.replace(GLOSS_RE, m => `<span class="gl" tabindex="0" data-g="${esc(GLOSS[m])}">${m}</span>`); }

function applyEff(eff){
  if(!eff) return;
  if(eff.flag){ S.flags[eff.flag] = true; if(eff.flag === "metMatthew") S.met.matthew = true; }
  if(eff.met){ S.met[eff.met] = true; if(S.hearts[eff.met] === undefined) S.hearts[eff.met] = CHARS[eff.met] ? CHARS[eff.met].start : 0; setTimeout(() => bumpHud(eff.met), 50); }

/* ---------- 배경 음악 ---------- */
const BGM = {el:null, gain:null, cur:null, urls:{}, vol:0.32, fading:false};
function bgmWant(){ return (musicOn && S.started && !document.hidden && !document.body.classList.contains("covering") && CH.bgm) ? CH.bgm : null; }
function bgmSetVol(v, sec){
  if(BGM.gain && actx){ const g = BGM.gain.gain, t = actx.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(v, t + sec); }
  else if(BGM.el){ BGM.el.volume = Math.max(0, Math.min(1, v)); }
}
async function bgmSrc(f){
  if(BGM.urls[f]) return BGM.urls[f];
  if(/^https?:$/.test(location.protocol)){
    try{ const r = await fetch(f); if(!r.ok) throw 0; BGM.urls[f] = URL.createObjectURL(await r.blob()); return BGM.urls[f]; }catch(e){ return null; }
  }
  return f;
}
async function bgmUpdate(){
  const want = bgmWant();
  if(want === BGM.cur) return;
  const prev = BGM.el; BGM.cur = want;
  if(prev){ bgmSetVol(0, 0.8); setTimeout(() => { if(BGM.el === prev && BGM.cur !== prev.dataset.f) prev.pause(); }, 850); }
  if(!want) return;
  const src = await bgmSrc(want);
  if(BGM.cur !== want) return;
  if(!src){ BGM.cur = null; return; }
  if(!BGM.el){
    BGM.el = new Audio(); BGM.el.loop = true; BGM.el.preload = "auto";
    const ctx = unlockAudio();
    if(ctx && /^https?:$/.test(location.protocol)){ try{ BGM.gain = ctx.createGain(); BGM.gain.gain.value = 0; ctx.createMediaElementSource(BGM.el).connect(BGM.gain); BGM.gain.connect(ctx.destination); }catch(e){ BGM.gain = null; } }
    BGM.el.addEventListener("timeupdate", () => {
      const a = BGM.el; if(!a.duration || BGM.cur !== a.dataset.f) return;
      if(a.duration - a.currentTime < 2.2 && !BGM.fading){ BGM.fading = true; bgmSetVol(0.02, 2); }
      else if(a.currentTime < 1.5 && BGM.fading){ BGM.fading = false; bgmSetVol(BGM.vol, 2.5); }
    });
  }
  const a = BGM.el;
  if(a.dataset.f !== want){ a.src = src; a.dataset.f = want; BGM.fading = false; }
  if(!BGM.gain) a.volume = 0;
  a.play().then(() => bgmSetVol(BGM.vol, 2)).catch(() => { BGM.cur = null; });
}
document.addEventListener("visibilitychange", bgmUpdate);
window.addEventListener("pointerdown", () => { if(!BGM.cur) bgmUpdate(); }, {passive:true});

const CARRY = ["canon","imag","hearts","met","items","flags","names","hist"];
function carry(){ const o = {}; CARRY.forEach(k => o[k] = JSON.parse(JSON.stringify(S[k]))); return o; }
function startChapter(ci, snap){
  setChapter(ci); preloadChapter();
  const base = fresh();
  S = Object.assign(base, snap ? JSON.parse(JSON.stringify(snap)) : {});
  S.ch = ci; S.started = true; S.pos = 0; S.phase = "play"; S.bg = (CH.nodes[0] && CH.nodes[0].bg) || CH.key;
  S.snap = carry();
  P.reached[CH.key] = true; P.snaps[CH.key] = S.snap;
  closeBook(); curBg = null; el.cover.classList.add("hide"); document.body.classList.remove("covering"); el.stage.hidden = false; el.report.hidden = true;
  showChapterCard(); enter(0);
}
function startNew(){ startChapter(0, null); }
function jumpChapter(ci){ unlockAudio(); startChapter(ci, ci === 0 ? null : (P.snaps[CHAPTERS[ci].key] || null)); }

  const inPlay = S.phase !== "cover";

    <div class="chgrid">${CHAPTERS.map((c, i) => { const ends = ["canon","imag","bal"].filter(k => P.endings[c.key + "_" + k]).length;
      return `<button type="button" data-ci="${i}" class="${inPlay && i === S.ch ? "cur" : ""}"><b>${c.num}장 · ${esc(c.title)}</b><small>${esc(c.orig)}${c.finalReport ? " · 최종 보고서" : c.midReport ? " · 중간 보고서" : ""}</small>${ends ? `<span class="st">🎬 결말 ${ends}/3</span>` : P.reached[c.key] ? `<span class="st">✔ 읽은 적 있음</span>` : ""}</button>`; }).join("")}</div>`;

function replay(){ startChapter(S.ch, S.snap); }
function nextChapter(){ if(CHAPTERS[S.ch + 1]) startChapter(S.ch + 1, carry()); }
