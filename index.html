<script>
/* 원문 책장: L. M. 몽고메리 《Anne of Green Gables》(1908) 2장 — 이 앱을 위해 새로 우리말로 옮김 */
BOOK.ch1 = {
  title: `매슈 커스버트, 깜짝 놀라다`,
  orig: `원작 2장`,
  paras: [
[2, `매슈 커스버트와 밤색 암말은 브라이트 리버까지 8마일 길을 느긋하게 달렸다. 아늑한 농가들 사이로 난 아름다운 길이었다. 이따금 향긋한 전나무 숲을 지나기도 하고, 야생 자두나무가 하늘하늘한 꽃을 늘어뜨린 우묵한 골짜기를 지나기도 했다. 공기는 수많은 사과 과수원이 내쉬는 숨결로 달콤했고, 초원은 저 멀리 진줏빛과 보랏빛 지평선 안개 속으로 비스듬히 펼쳐져 있었다. 그리고`],
[3, `“작은 새들은 노래했네, 마치 그날이<br>한 해에 단 하루뿐인 여름날인 듯이.”`],
[4, `매슈는 나름의 방식으로 이 마찻길을 즐겼다. 다만 길에서 여자들을 마주쳐 고개를 숙여 인사해야 하는 순간만은 예외였다. 프린스 에드워드 섬에서는 아는 사이든 모르는 사이든 길에서 만나는 사람이면 누구에게나 고개를 끄덕여 인사하는 것이 예의였기 때문이다.`],
[5, `매슈는 마릴라와 레이첼 부인을 뺀 세상의 모든 여자를 무서워했다. 그 알 수 없는 존재들이 속으로 자기를 비웃고 있다는 불편한 느낌이 들었던 것이다. 어쩌면 그 생각이 틀리지 않았을지도 모른다. 매슈는 꽤 별나 보이는 사람이었으니까. 몸집은 어색하게 컸고, 쇳빛이 도는 회색 머리카락은 길게 자라 구부정한 어깨에 닿았으며, 스무 살 때부터 길러 온 부드럽고 숱 많은 갈색 수염이 얼굴을 덮고 있었다. 사실 그는 스무 살 때나 예순 살인 지금이나 생김새가 거의 같았다. 스무 살 때 머리가 조금 덜 희었을 뿐이다.`],
[6, `브라이트 리버에 닿았을 때 기차는 그림자도 보이지 않았다. 너무 일찍 왔나 보다 생각한 매슈는 브라이트 리버의 작은 여관 마당에 말을 매어 두고 역사로 걸어갔다. 기다란 승강장은 거의 텅 비어 있었다. 눈에 띄는 살아 있는 것이라고는 승강장 맨 끝에 쌓인 지붕널 더미 위에 앉아 있는 여자아이 하나뿐이었다. 매슈는 그게 여자아이라는 것만 겨우 알아채고는 쳐다보지도 않은 채 될 수 있는 대로 빨리 그 곁을 지나쳤다. 만약 쳐다보았다면, 아이의 자세와 표정에 서린 팽팽한 긴장과 기대를 놓치기는 어려웠을 것이다. 아이는 무언가를, 혹은 누군가를 기다리며 앉아 있었다. 그 순간 할 수 있는 일이라고는 앉아서 기다리는 것뿐이었기에, 아이는 온 힘을 다해 앉아서 기다리고 있었다.`],
[7, `매슈는 저녁을 먹으러 집에 가려고 매표소 문을 잠그던 역장을 만나, 다섯 시 반 기차가 곧 들어오느냐고 물었다.`],
[8, `“다섯 시 반 기차는 삼십 분 전에 들어왔다가 떠났습니다.” 그 부지런한 역장이 대답했다. “그런데 댁 앞으로 내린 승객이 하나 있어요. 어린 여자아이인데, 저기 지붕널 더미에 앉아 있지요. 여자 대합실에 들어가 있으라고 했더니, 밖에 있는 게 더 좋다고 아주 진지하게 말하더군요. ‘바깥이 상상할 여지가 더 많거든요.’라나요. 참 별난 아이예요.”`],
[9, `“나는 여자아이를 기다린 게 아닌데요.” 매슈가 멍하니 말했다. “내가 데리러 온 건 사내아이입니다. 여기 와 있어야 하는데. 알렉산더 스펜서 부인이 노바스코샤에서 데려다주기로 했거든요.”`],
[10, `역장이 휘파람을 불었다.`],
[11, `“뭔가 착오가 있었나 보네요.” 그가 말했다. “스펜서 부인이 저 여자아이와 함께 기차에서 내려서 저한테 맡기고 갔어요. 댁과 댁 누이가 고아원에서 저 아이를 입양하기로 했고, 곧 데리러 올 거라고 하더군요. 제가 아는 건 그게 전부예요. 그리고 이 근처에 고아를 더 숨겨 두지도 않았고요.”`],
[12, `“무슨 영문인지 모르겠군요.” 매슈는 어쩔 줄 몰라 하며 말했다. 이럴 때 마릴라가 곁에 있어서 대신 처리해 주면 좋으련만.`],
[13, `“그럼 아이한테 직접 물어보시죠.” 역장이 대수롭지 않게 말했다. “그 애라면 설명할 수 있을 겁니다. 말솜씨가 보통이 아니거든요, 그건 확실해요. 어쩌면 댁이 원하던 종류의 사내아이가 다 떨어졌나 보죠.”`],
[14, `배가 고팠던 역장은 경쾌한 걸음으로 가 버렸다. 그리고 불운한 매슈에게는 사자 굴에 들어가 사자 수염을 잡아당기는 것보다도 어려운 일이 남았다. 여자아이에게, 그것도 낯선 여자아이에게, 그것도 고아 여자아이에게 걸어가서 왜 사내아이가 아니냐고 따져 묻는 일 말이다. 매슈는 속으로 끙끙 앓으며 돌아서서, 승강장을 따라 아이 쪽으로 조심조심 발을 끌며 걸어갔다.`],
[15, `아이는 매슈가 자기 곁을 지나간 순간부터 줄곧 그를 지켜보고 있었고, 지금도 눈을 떼지 않고 있었다. 매슈는 아이를 보고 있지 않았고, 설령 보았다 한들 아이가 정말 어떤 모습인지 알아보지 못했을 것이다. 하지만 평범한 관찰자라면 이런 모습을 보았으리라.`],
[16, `열한 살쯤 된 아이였다. 누르스름한 회색 윈시 천으로 만든, 아주 짧고 아주 꽉 끼고 아주 볼품없는 원피스를 입고 있었다. 색이 바랜 갈색 세일러 모자를 썼는데, 모자 아래로 아주 숱이 많고 누가 봐도 빨간 머리카락이 두 갈래로 땋아져 등까지 늘어져 있었다. 얼굴은 작고 하얗고 야위었으며 주근깨투성이였다. 입이 컸고 눈도 컸는데, 그 눈은 빛과 기분에 따라 초록빛으로도 보이고 회색빛으로도 보였다.`],
[17, `평범한 관찰자의 눈에는 여기까지만 보였을 것이다. 하지만 비범한 관찰자라면 더 많은 것을 알아보았을 것이다. 턱이 아주 뾰족하고 또렷하다는 것, 커다란 눈에 생기와 활기가 가득하다는 것, 입술이 다정하고 표정이 풍부하다는 것, 이마가 넓고 반듯하다는 것. 한마디로, 눈 밝은 비범한 관찰자라면 수줍은 매슈 커스버트가 우스울 만큼 겁내고 있는 이 길 잃은 소녀의 몸 안에 결코 평범하지 않은 영혼이 깃들어 있다고 결론지었을 것이다.`],
[18, `그러나 매슈는 먼저 말을 꺼내는 고역을 치르지 않아도 되었다. 그가 자기에게 오고 있다는 것을 알아차리자마자 아이가 벌떡 일어났기 때문이다. 아이는 가냘프고 햇볕에 그을린 한 손으로 낡고 구식인 융단 가방의 손잡이를 움켜쥐고, 다른 한 손을 그에게 내밀었다.`],
[19, `“초록 지붕 집의 매슈 커스버트 씨지요?” 아이가 유난히 맑고 고운 목소리로 말했다. “만나서 정말 반가워요. 아저씨가 저를 데리러 오지 않으시는 게 아닐까 슬슬 걱정이 되기 시작해서, 아저씨가 못 오시게 된 온갖 이유를 상상하고 있었어요. 만약 오늘 밤에 아저씨가 안 오시면, 철길을 따라 저 모퉁이에 있는 커다란 산벚나무까지 가서 나무 위로 올라가 밤을 새우기로 마음먹었었어요. 조금도 무섭지 않았을 거예요. 달빛 속에서 하얀 꽃이 활짝 핀 산벚나무 위에서 잠드는 건 정말 멋질 거예요, 그렇죠? 대리석 궁전에 살고 있다고 상상할 수도 있잖아요. 그리고 오늘 밤에 안 오시더라도 아침에는 꼭 저를 데리러 오실 거라고 굳게 믿고 있었어요.”`],
[20, `매슈는 앙상한 작은 손을 어색하게 잡았다. 그리고 그 자리에서 어떻게 할지 결정했다. 반짝이는 눈을 한 이 아이에게 착오가 있었다고 말할 수는 없었다. 일단 집에 데려가서 그 일은 마릴라에게 맡기기로 했다. 무슨 착오가 있었든 아이를 브라이트 리버에 두고 갈 수는 없는 노릇이었다. 그러니 묻고 설명하는 일은 모두 무사히 초록 지붕 집에 돌아간 뒤로 미루는 편이 나았다.`],
[21, `“늦어서 미안하구나.” 매슈가 수줍게 말했다. “가자꾸나. 말은 저쪽 마당에 있단다. 가방은 이리 주렴.”`],
[22, `“아, 제가 들 수 있어요.” 아이가 쾌활하게 대답했다. “무겁지 않아요. 제 세상 재산이 몽땅 들어 있지만 무겁지는 않아요. 그리고 꼭 정해진 방법으로 들지 않으면 손잡이가 빠져 버리거든요. 그러니까 요령을 정확히 아는 제가 드는 게 나아요. 아주아주 오래된 융단 가방이거든요. 아, 아저씨가 와 주셔서 정말 기뻐요. 산벚나무 위에서 자는 것도 멋졌겠지만요. 꽤 먼 길을 가야 하죠? 스펜서 부인이 8마일이라고 하셨어요. 저는 마차 타는 걸 정말 좋아하니까 기뻐요. 아, 제가 아저씨네와 함께 살고 아저씨네 식구가 된다니 정말 꿈만 같아요. 저는 한 번도 누군가의 식구였던 적이 없거든요. 정말로요. 그중에서도 고아원이 제일 끔찍했어요. 겨우 넉 달 있었지만 그걸로 충분했어요. 아저씨는 고아원에서 지내 본 적 없으시죠? 그러니 그게 어떤 건지 절대 모르실 거예요. 상상할 수 있는 그 어떤 것보다도 나빠요. 스펜서 부인은 제가 그런 식으로 말하는 건 나쁜 거라고 하셨지만, 저는 나쁘게 굴려던 게 아니었어요. 모르는 사이에 나쁜 아이가 되기란 정말 쉽잖아요, 그렇죠? 고아원 사람들은 좋은 분들이었어요. 하지만 고아원에는 상상할 거리가 너무 없어요. 다른 고아 아이들밖에 없거든요. 그 아이들에 대해 이것저것 상상하는 건 꽤 재미있었어요. 이를테면 옆자리에 앉은 여자아이가 사실은 백작의 딸인데, 아기였을 때 못된 유모에게 납치당했고, 그 유모는 사실을 털어놓기도 전에 죽어 버렸다고 상상하는 거예요. 밤마다 잠 못 들고 누워서 그런 걸 상상하곤 했어요. 낮에는 그럴 시간이 없었으니까요. 아마 그래서 제가 이렇게 마른가 봐요. 저 정말 끔찍하게 말랐죠, 그렇죠? 뼈에 살이 한 점도 없어요. 저는 제가 통통하고, 팔꿈치에 보조개가 쏙 들어가 있다고 상상하는 걸 정말 좋아해요.”`],
[23, `여기까지 말하고 매슈의 길동무는 입을 다물었다. 숨이 차기도 했고, 마차에 다 왔기 때문이기도 했다. 아이는 마을을 벗어나 가파른 언덕길을 내려갈 때까지 한마디도 하지 않았다. 그 길은 부드러운 흙을 깊이 깎아 낸 길이라, 꽃 핀 산벚나무와 가느다란 하얀 자작나무가 줄지어 선 양쪽 둑이 머리보다 몇 자나 높이 솟아 있었다.`],
[24, `아이가 손을 뻗어 마차 옆을 스치는 야생 자두나무 가지 하나를 꺾었다.`],
[25, `“아름답지 않아요? 둑에서 몸을 내민 저 나무, 온통 하얗고 레이스 같은 저 나무를 보니 무엇이 떠오르세요?” 아이가 물었다.`],
[26, `“글쎄다, 모르겠구나.” 매슈가 말했다.`],
[27, `“어머, 당연히 신부죠. 안개 같은 고운 면사포를 쓰고 온통 하얀 옷을 입은 신부요. 저는 신부를 한 번도 본 적은 없지만, 어떤 모습일지는 상상할 수 있어요. 저는 제가 신부가 될 거라고는 기대하지 않아요. 저는 너무 못생겨서 아무도 저랑 결혼하고 싶어 하지 않을 테니까요. 외국에 나가는 선교사라면 몰라도요. 외국 선교사라면 그렇게 까다롭게 고르지 않을 것 같아요. 그래도 언젠가 하얀 드레스를 한 벌 가져 보고 싶어요. 그게 제가 이 세상에서 바라는 최고의 행복이에요. 저는 예쁜 옷이 정말 좋아요. 그런데 기억나는 한 예쁜 옷을 한 번도 가져 본 적이 없어요. 하지만 그만큼 더 기대할 게 많은 거잖아요, 그렇죠? 그리고 제가 화려하게 차려입었다고 상상할 수도 있고요. 오늘 아침 고아원을 떠날 때 이 끔찍하고 낡은 윈시 원피스를 입어야 해서 너무 창피했어요. 고아원 아이들은 모두 이 옷을 입어야 했거든요. 지난겨울에 호프턴의 한 상인이 고아원에 윈시 천 300야드를 기부했대요. 팔리지 않아서 그랬다는 사람들도 있었지만, 저는 그분이 따뜻한 마음에서 그러셨다고 믿고 싶어요. 아저씨도 그렇죠? 기차에 탔을 때는 모든 사람이 저를 쳐다보며 불쌍하게 여기는 것 같았어요. 그래서 저는 곧바로 상상을 시작했어요. 제가 아주 아름다운 연하늘색 비단 드레스를 입고 있다고요. 이왕 상상할 거라면 정말 근사한 걸 상상하는 게 낫잖아요. 꽃과 하늘거리는 깃털로 장식한 커다란 모자도 쓰고, 금시계도 차고, 부드러운 가죽 장갑과 구두도 신었다고요. 그랬더니 금세 기운이 나서 섬까지 오는 여행을 마음껏 즐겼어요. 배를 타고 건너올 때도 멀미를 조금도 안 했어요. 스펜서 부인도 안 하셨어요. 평소에는 늘 하신대요. 제가 배에서 떨어지지 않나 지켜보느라 멀미할 틈이 없었다고 하셨어요. 저처럼 여기저기 쏘다니는 애는 처음 봤대요. 그래도 그 덕분에 부인이 멀미를 안 하셨으니 제가 돌아다닌 게 다행이죠, 그렇죠? 저는 그 배에서 볼 수 있는 건 전부 보고 싶었어요. 다시 그런 기회가 올지 몰랐으니까요. 아, 저기 꽃이 활짝 핀 벚나무가 또 잔뜩 있어요! 이 섬은 정말 꽃이 가득한 곳이에요. 벌써 이 섬이 정말 좋아요. 여기서 살게 돼서 너무 기뻐요. 프린스 에드워드 섬이 세상에서 제일 아름다운 곳이라고 늘 들었고, 여기서 사는 상상도 했었지만, 정말로 그렇게 될 거라고는 생각 못 했어요. 상상이 현실이 되는 건 정말 기쁜 일이에요, 그렇죠? 그런데 저 빨간 길들은 정말 신기해요. 샬럿타운에서 기차를 탔는데 빨간 길이 휙휙 지나가기 시작하자, 스펜서 부인께 길이 왜 빨가냐고 여쭤 봤어요. 부인은 모르겠다고, 제발 더는 질문하지 말라고 하셨어요. 제가 벌써 천 개는 물어봤을 거라고요. 사실 그랬을지도 몰라요. 하지만 질문을 안 하면 어떻게 이것저것 알아내겠어요? 그런데 정말 길은 왜 빨간 거예요?”`],
[28, `“글쎄다, 모르겠구나.” 매슈가 말했다.`],
[29, `“그럼, 그건 언젠가 알아내야 할 것 중 하나네요. 알아낼 것들이 이렇게 많다고 생각하면 정말 멋지지 않아요? 그런 생각을 하면 살아 있다는 게 그냥 기뻐져요. 세상은 정말 재미있는 곳이에요. 우리가 모든 걸 다 안다면 세상이 지금의 반만큼도 재미있지 않을 거예요, 그렇죠? 그러면 상상할 여지가 하나도 없을 테니까요, 안 그래요? 그런데 제가 말을 너무 많이 하나요? 사람들이 늘 그렇다고 하거든요. 제가 말을 안 하는 게 좋으세요? 그렇다고 하시면 그만할게요. 마음만 먹으면 그만할 수 있어요. 어렵긴 하지만요.”`],
[30, `매슈는 스스로도 놀랍게도 이 시간이 즐거웠다. 말수 적은 사람들이 대개 그렇듯, 그는 말 많은 사람을 좋아했다. 단, 그들이 자기 몫까지 기꺼이 떠들어 주고 그에게 맞장구를 기대하지 않을 때에 한해서였다. 하지만 어린 여자아이와 함께 있는 게 즐거울 줄은 꿈에도 몰랐다. 여자들도 충분히 곤란했지만, 어린 여자아이들은 더 곤란했다. 그 애들은 그를 곁눈질하며 쭈뼛쭈뼛 옆으로 지나가곤 했는데, 마치 한마디라도 했다가는 그가 자기들을 한입에 꿀꺽 삼켜 버릴 거라고 생각하는 것 같았다. 매슈는 그런 모습이 정말 싫었다. 그게 에이번리의 얌전하게 자란 여자아이들의 모습이었다. 하지만 이 주근깨투성이 꼬마 마녀는 아주 달랐다. 재빠르게 돌아가는 아이의 생각을 굼뜬 머리로 따라가기는 꽤 버거웠지만, 그래도 매슈는 아이의 수다가 ‘왠지 좋다’고 생각했다. 그래서 여느 때처럼 수줍게 말했다.`],
[31, `“아, 하고 싶은 만큼 얼마든지 이야기하렴. 나는 괜찮단다.”`],
[32, `“아, 정말 기뻐요. 아저씨랑 저는 아주 잘 지낼 거라는 걸 알겠어요. 말하고 싶을 때 말할 수 있다니, 그리고 ‘아이들은 눈에 띄되 소리를 내서는 안 된다’는 말을 듣지 않아도 된다니 정말 속이 시원해요. 그 말을 백만 번은 들었을 거예요. 그리고 사람들은 제가 어려운 낱말을 쓴다고 비웃어요. 하지만 큰 생각을 하면 그걸 표현하려면 큰 낱말을 써야 하잖아요, 그렇죠?”`],
[33, `“글쎄다, 그건 일리가 있는 말 같구나.” 매슈가 말했다.`],
[34, `“스펜서 부인은 제 혀가 가운데에 매달려 있는 게 틀림없다고 하셨어요. 하지만 아니에요. 한쪽 끝에 단단히 붙어 있어요. 스펜서 부인이 아저씨네 집 이름이 초록 지붕 집이라고 하셨어요. 그래서 그 집에 대해 이것저것 다 여쭤 봤죠. 집 둘레에 나무가 빙 둘러 있다고 하셔서 더더욱 기뻤어요. 저는 나무가 정말 좋거든요. 고아원 둘레에는 나무가 하나도 없었어요. 앞마당에 하얗게 회칠한 새장 같은 울타리를 두른 조그맣고 가엾은 나무 몇 그루가 있었을 뿐이에요. 그 나무들도 꼭 고아처럼 보였어요. 그 나무들을 보면 울고 싶어지곤 했어요. 저는 나무들에게 이렇게 말하곤 했어요. ‘아, 가엾은 작은 나무들아! 너희가 커다란 숲속에서 다른 나무들에게 둘러싸여 있고, 뿌리 위로는 작은 이끼와 린네풀이 자라고, 가까이에 시냇물이 흐르고, 가지에서는 새들이 노래한다면 너희도 쑥쑥 자랄 수 있을 텐데. 그렇지? 하지만 거기서는 그럴 수가 없구나. 작은 나무들아, 나는 너희 마음을 정말 잘 알아.’ 오늘 아침 그 나무들을 두고 떠나려니 마음이 아팠어요. 그런 것들에도 정이 들잖아요, 그렇죠? 초록 지붕 집 근처에 시냇물이 있나요? 스펜서 부인께 그걸 여쭤 보는 걸 깜빡했어요.”`],
[35, `“글쎄다, 그래, 집 바로 아래에 하나 있지.”`],
[36, `“어머나! 시냇가에 사는 건 늘 꿈꾸던 일 중 하나였어요. 정말 그렇게 될 줄은 몰랐지만요. 꿈은 좀처럼 이루어지지 않잖아요, 그렇죠? 이루어진다면 얼마나 좋을까요? 그래도 지금 저는 거의 완벽하게 행복해요. 완전히 완벽하게 행복할 수는 없어요. 왜냐하면, 음… 이건 무슨 색이라고 하시겠어요?”`],
[37, `아이는 윤기 나는 기다란 땋은 머리 한 가닥을 야윈 어깨 너머로 휙 넘겨 매슈의 눈앞에 들어 보였다. 매슈는 숙녀의 머리 색깔을 판정하는 일에 익숙하지 않았지만, 이번에는 의심의 여지가 별로 없었다.`],
[38, `“빨간색이지, 아니냐?” 매슈가 말했다.`],
[39, `아이는 한숨을 쉬며 땋은 머리를 다시 떨어뜨렸다. 발끝에서부터 올라와 세상의 모든 슬픔을 내뿜는 듯한 한숨이었다.`],
[40, `“네, 빨간색이에요.” 아이가 체념한 듯 말했다. “이제 왜 제가 완벽하게 행복할 수 없는지 아시겠죠. 빨간 머리를 가진 사람은 아무도 그럴 수 없어요. 다른 건 별로 신경 쓰이지 않아요. 주근깨도, 초록 눈도, 깡마른 몸도요. 그런 건 상상으로 없앨 수 있거든요. 제 피부가 장미 꽃잎처럼 곱고 눈은 별처럼 반짝이는 보랏빛이라고 상상할 수 있어요. 하지만 빨간 머리만큼은 도저히 상상으로 없앨 수가 없어요. 최선을 다해 봐요. ‘내 머리는 까마귀 날개처럼 새까만, 눈부신 흑발이야.’ 하고 속으로 생각하죠. 하지만 그러는 내내 그냥 빨간색이라는 걸 알고 있어서 가슴이 찢어져요. 이건 제 평생의 슬픔이 될 거예요. 언젠가 소설에서 평생의 슬픔을 지닌 여자아이 이야기를 읽은 적이 있는데, 그 애의 슬픔은 빨간 머리가 아니었어요. 그 애 머리는 설화석고 같은 이마에서 뒤로 물결치는 순금빛이었대요. 설화석고 같은 이마가 뭐예요? 아무리 해도 알아낼 수가 없었어요. 아저씨는 아세요?”`],
[41, `“글쎄다, 나도 모르겠구나.” 매슈가 말했다. 그는 머리가 조금 어질어질해지고 있었다. 젊은 시절 철없던 때, 소풍에서 다른 남자아이의 꾐에 넘어가 회전목마를 탔을 때와 비슷한 기분이었다.`],
[42, `“어쨌든 그게 뭐든 멋진 거였을 거예요. 그 아이는 천상의 아름다움을 지녔다고 했거든요. 천상의 아름다움을 지니면 어떤 기분일지 상상해 보신 적 있으세요?”`],
[43, `“글쎄다, 아니, 없구나.” 매슈가 순진하게 털어놓았다.`],
[44, `“저는 자주 해요. 아저씨라면, 고를 수 있다면 어떤 사람이 되고 싶으세요? 천상의 아름다움을 지닌 사람, 눈부시게 똑똑한 사람, 아니면 천사처럼 착한 사람?”`],
[45, `“글쎄다, 나는… 잘 모르겠구나.”`],
[46, `“저도요. 아무리 해도 못 정하겠어요. 하지만 별 상관없어요. 어느 쪽도 될 것 같지 않거든요. 천사처럼 착한 사람이 절대 못 될 건 확실해요. 스펜서 부인 말씀으로는… 아, 커스버트 씨! 아, 커스버트 씨!! 아, 커스버트 씨!!!”`],
[47, `스펜서 부인이 그렇게 말했다는 것은 아니었다. 아이가 마차에서 굴러떨어진 것도, 매슈가 무슨 놀라운 일을 한 것도 아니었다. 그저 길모퉁이를 돌았더니 ‘가로수길’이 나타난 것이었다.`],
[48, `뉴브리지 사람들이 ‘가로수길’이라고 부르는 그곳은 400~500야드쯤 이어지는 길이었는데, 오래전 한 괴짜 늙은 농부가 심은, 가지를 넓게 뻗은 커다란 사과나무들이 길 위를 완전히 아치처럼 덮고 있었다. 머리 위로는 눈처럼 희고 향기로운 꽃이 기다란 차양처럼 끝없이 이어졌다. 나뭇가지 아래의 공기는 보랏빛 어스름으로 가득했고, 저 멀리 앞쪽으로는 노을로 물든 하늘이 대성당 통로 끝의 커다란 장미창처럼 빛나고 있었다.`],
[49, `그 아름다움에 아이는 말문이 막힌 것 같았다. 아이는 마차 등받이에 몸을 기대고, 야윈 두 손을 앞으로 모아 쥔 채, 머리 위의 하얀 장관을 향해 황홀하게 얼굴을 들었다. 가로수길을 빠져나와 뉴브리지로 이어지는 긴 비탈을 내려갈 때도 아이는 꼼짝도 하지 않고 말도 없었다. 여전히 넋을 잃은 얼굴로, 노을 진 서쪽 하늘 저 멀리를 바라보았다. 그 눈은 빛나는 하늘을 배경으로 화려하게 줄지어 지나가는 환상들을 보고 있었다. 개들이 짖어 대고, 꼬마들이 소리를 지르고, 호기심 어린 얼굴들이 창문 밖을 내다보는 북적이는 작은 마을 뉴브리지를 지나는 동안에도 둘은 말없이 달렸다. 다시 3마일을 더 달렸는데도 아이는 입을 열지 않았다. 아이는 떠들 때만큼이나 열렬하게 침묵을 지킬 수도 있는 게 분명했다.`],
[50, `“꽤 피곤하고 배가 고픈 모양이구나.” 마침내 매슈가 용기를 내어 말했다. 아이가 오랫동안 말이 없는 까닭을 그는 그것 말고는 떠올릴 수 없었다. “하지만 이제 그리 멀지 않았단다. 1마일만 더 가면 돼.”`],
[51, `아이는 깊은 한숨과 함께 공상에서 깨어나, 별에 이끌려 먼 곳을 헤매다 돌아온 영혼처럼 꿈꾸는 눈빛으로 매슈를 바라보았다.`],
[52, `“아, 커스버트 씨.” 아이가 속삭였다. “아까 지나온 그곳, 그 하얀 곳은 뭐였어요?”`],
[53, `“글쎄다, 가로수길을 말하는 모양이구나.” 매슈가 한참 깊이 생각한 끝에 말했다. “꽤 예쁜 곳이지.”`],
[54, `“예쁘다고요? 아, ‘예쁘다’는 맞는 말이 아닌 것 같아요. ‘아름답다’도 아니고요. 그런 말로는 모자라요. 아, 그건 굉장했어요, 정말 굉장했어요. 제가 본 것 중에 상상으로도 더 낫게 만들 수 없는 건 그게 처음이에요. 그냥 여기가 꽉 차는 느낌이에요.” 아이는 한 손을 가슴에 얹었다. “이상하고 묘하게 아팠어요. 그런데 기분 좋은 아픔이었어요. 아저씨도 그런 아픔을 느껴 보신 적 있어요, 커스버트 씨?”`],
[55, `“글쎄다, 그런 적이 있었는지 도무지 기억이 안 나는구나.”`],
[56, `“저는 자주 느껴요. 정말 근사하게 아름다운 걸 볼 때마다요. 그런데 그렇게 멋진 곳을 ‘가로수길’이라고 부르면 안 돼요. 그런 이름에는 아무 뜻도 없잖아요. 그곳은 이렇게 불러야 해요. 음, 어디 보자… ‘기쁨의 하얀 길’. 정말 상상력 넘치는 멋진 이름이지 않아요? 저는 어떤 장소나 사람의 이름이 마음에 안 들면 늘 새 이름을 상상해서 그 이름으로 생각해요. 고아원에 헵지바 젠킨스라는 여자아이가 있었는데, 저는 늘 그 애를 로잘리아 드비어라고 상상했어요. 다른 사람들은 그곳을 가로수길이라고 부르겠지만, 저는 언제까지나 기쁨의 하얀 길이라고 부를 거예요. 정말 1마일만 더 가면 집에 도착하는 거예요? 기쁘기도 하고 아쉽기도 해요. 이 마찻길이 너무 즐거웠으니까 아쉬워요. 저는 즐거운 일이 끝날 때면 늘 아쉬워요. 뒤에 더 즐거운 일이 올 수도 있지만 그건 아무도 장담할 수 없잖아요. 그리고 더 즐겁지 않은 경우가 아주 많고요. 적어도 제 경험으로는 그랬어요. 그래도 집에 간다고 생각하니 기뻐요. 저는 기억하는 한 진짜 집을 가져 본 적이 한 번도 없거든요. 정말 진짜인 집에 간다는 생각만 해도 그 기분 좋은 아픔이 또 느껴져요. 어머, 저기 정말 예쁘다!”`],
[57, `언덕 꼭대기를 넘자 아래로 연못 하나가 보였다. 어찌나 길고 구불구불한지 거의 강처럼 보였다. 연못 한가운데에는 다리가 걸쳐 있었고, 다리에서 아래쪽 끝까지, 호박색 모래 언덕이 띠처럼 둘러 저 너머 짙푸른 만과 갈라놓은 곳까지, 물빛은 시시각각 변하는 수많은 색으로 찬란했다. 크로커스와 장미와 투명한 초록빛이 어우러진 더없이 신비로운 빛깔들, 그리고 아직 아무도 이름 붙이지 못한 미묘한 빛깔들이었다. 다리 위쪽으로 연못은 가장자리를 두른 전나무와 단풍나무 숲까지 이어졌고, 일렁이는 나무 그림자 속에 어둡고 투명하게 누워 있었다. 군데군데 야생 자두나무가 둑에서 몸을 내밀고 있었는데, 그 모습이 마치 하얀 옷을 입은 소녀가 발끝으로 서서 물에 비친 제 모습을 들여다보는 것 같았다. 연못 위쪽 늪에서는 맑고도 구슬프게 달콤한 개구리들의 합창이 들려왔다. 건너편 비탈에는 하얀 사과 과수원 뒤로 작은 회색 집 한 채가 빼꼼 얼굴을 내밀고 있었는데, 아직 완전히 어둡지 않은데도 창문 하나에서 불빛이 비치고 있었다.`],
[58, `“저건 배리 씨네 연못이란다.” 매슈가 말했다.`],
[59, `“아, 그 이름도 마음에 안 들어요. 저는 이렇게 부를래요. 음, 어디 보자… ‘반짝이는 호수’. 그래요, 그게 딱 맞는 이름이에요. 전율이 느껴지니까 알아요. 딱 들어맞는 이름이 떠오르면 전율이 느껴지거든요. 아저씨도 무언가에 전율을 느끼신 적 있어요?”`],
[60, `매슈는 곰곰이 생각했다.`],
[61, `“글쎄다, 그래. 오이밭을 삽으로 파 엎을 때 나오는 그 징그러운 하얀 굼벵이들을 보면 늘 좀 전율이 느껴지지. 그 생김새가 정말 싫거든.”`],
[62, `“아, 그건 정확히 같은 종류의 전율은 아닌 것 같아요. 같은 거라고 생각하세요? 굼벵이랑 반짝이는 호수는 별로 관계가 없는 것 같잖아요, 그렇죠? 그런데 다른 사람들은 왜 저걸 배리 씨네 연못이라고 불러요?”`],
[63, `“아마 배리 씨가 저 위에 있는 집에 살아서 그럴 게다. 그 집 이름은 ‘과수원 비탈’이란다. 저 뒤에 커다란 덤불만 없으면 여기서 초록 지붕 집이 보일 텐데. 하지만 다리를 건너 큰길로 돌아가야 하니까 반 마일쯤 더 가야 한단다.”`],
[64, `“배리 씨네는 어린 여자아이가 있어요? 음, 아주 어리지 않아도 돼요. 제 또래쯤이요.”`],
[65, `“열한 살쯤 된 딸이 하나 있지. 이름은 다이애나란다.”`],
[66, `“어머나!” 아이는 숨을 길게 들이마셨다. “정말 완벽하게 아름다운 이름이에요!”`],
[67, `“글쎄다, 난 잘 모르겠구나. 내 보기엔 어딘가 지독히 이교도 같은 이름이야. 나라면 제인이나 메리처럼 착실한 이름이 더 좋겠다. 그런데 다이애나가 태어났을 때 그 집에 하숙하던 학교 선생이 있었는데, 그 사람한테 이름을 지어 달라고 했더니 다이애나라고 지었다는구나.”`],
[68, `“그럼 제가 태어났을 때도 그런 선생님이 근처에 계셨더라면 좋았을 텐데요. 아, 다리에 다 왔어요. 눈을 꼭 감을 거예요. 저는 다리를 건널 때마다 늘 무서워요. 우리가 딱 한가운데에 왔을 때 다리가 주머니칼처럼 접혀서 우리를 꽉 물어 버릴지도 모른다는 상상을 멈출 수가 없거든요. 그래서 눈을 감아요. 하지만 한가운데쯤 왔다 싶으면 결국 늘 눈을 뜨고 말아요. 왜냐하면, 만약 정말로 다리가 접힌다면 접히는 걸 보고 싶으니까요. 덜컹덜컹 소리가 정말 신나요! 저는 늘 이 덜컹거리는 부분이 좋아요. 세상에 좋아할 게 이렇게 많다니 정말 멋지지 않아요? 다 건넜다. 이제 뒤돌아볼래요. 잘 자, 사랑하는 반짝이는 호수야. 저는 사랑하는 것들에게 늘 잘 자라고 인사해요. 사람에게 하듯이요. 그것들도 좋아할 것 같거든요. 저 물이 저를 보고 웃고 있는 것 같아요.”`],
[69, `건너편 언덕을 올라 모퉁이를 돌았을 때 매슈가 말했다.`],
[70, `“이제 집에 거의 다 왔다. 저기 보이는 게 초록 지붕—”`],
[71, `“아, 말하지 마세요.” 아이가 숨 가쁘게 그의 말을 가로막았다. 아이는 반쯤 들어 올린 매슈의 팔을 붙잡고, 그가 가리키는 손짓을 보지 않으려고 눈을 감았다. “제가 맞혀 볼게요. 꼭 맞힐 수 있을 거예요.”`],
[72, `아이는 눈을 뜨고 주위를 둘러보았다. 둘은 언덕 꼭대기에 있었다. 해는 진 지 좀 되었지만, 은은한 잔광 속에서 풍경은 아직 또렷했다. 서쪽으로는 금잔화 빛 하늘을 배경으로 교회의 검은 첨탑이 솟아 있었다. 아래로는 작은 골짜기가 있었고, 그 너머로 완만하게 오르는 긴 비탈을 따라 아늑한 농가들이 흩어져 있었다. 아이의 눈은 간절하고도 애틋하게 이 집에서 저 집으로 바삐 옮겨 다녔다. 마침내 그 눈길은 길에서 멀리 떨어진 왼쪽의 한 집에 머물렀다. 주위 숲의 어스름 속에서 꽃 핀 나무들로 희미하게 하얀 집이었다. 그 집 위, 티 없이 맑은 남서쪽 하늘에는 수정처럼 하얀 커다란 별 하나가 길잡이와 약속의 등불처럼 빛나고 있었다.`],
[73, `“저기죠, 맞죠?” 아이가 손으로 가리키며 말했다.`],
[74, `매슈는 신이 나서 밤색 암말의 등을 고삐로 찰싹 쳤다.`],
[75, `“글쎄다, 맞혔구나! 하지만 스펜서 부인이 알아볼 수 있게 설명해 줬겠지.”`],
[76, `“아니에요, 안 해 주셨어요. 정말이에요. 부인이 해 주신 말씀은 저기 다른 집들 대부분에 해당될 만한 얘기였어요. 저는 그 집이 어떻게 생겼는지 전혀 몰랐어요. 그런데 보자마자 바로 우리 집이라는 느낌이 들었어요. 아, 꼭 꿈을 꾸고 있는 것 같아요. 그거 아세요? 제 팔은 팔꿈치 위로 시퍼렇게 멍이 들었을 거예요. 오늘 하도 여러 번 꼬집어서요. 자꾸만 끔찍하고 메스꺼운 기분이 밀려와서, 이게 다 꿈일까 봐 너무 무서웠어요. 그래서 진짜인지 확인하려고 저를 꼬집었어요. 그러다 문득 깨달았어요. 설령 이게 꿈이라 해도 할 수 있는 한 오래오래 꿈을 꾸는 게 낫겠다는 걸요. 그래서 꼬집는 걸 그만뒀어요. 그런데 이건 진짜예요. 그리고 우리는 이제 집에 거의 다 왔어요.”`],
[77, `황홀한 한숨과 함께 아이는 다시 말없이 잠겨 들었다. 매슈는 불안하게 몸을 뒤척였다. 이 세상의 떠돌이 아이에게, 그토록 바라던 집이 결국 네 집이 아니라고 말해야 할 사람이 자기가 아니라 마릴라라는 사실이 다행스러웠다. 둘은 이미 꽤 어두워진 린드 골짜기를 지났다. 그래도 레이첼 부인이 창가 명당자리에서 둘을 못 알아볼 만큼 어둡지는 않았다. 마차는 언덕을 올라 초록 지붕 집으로 이어지는 긴 오솔길로 들어섰다. 집에 다다를 무렵 매슈는 다가오는 그 폭로의 순간이 자기도 이해할 수 없을 만큼 두려워 몸이 움츠러들었다. 이 착오가 마릴라나 자기에게 가져올 골칫거리를 생각한 게 아니었다. 아이가 얼마나 실망할지를 생각한 것이었다. 아이의 눈에 깃든 그 황홀한 빛이 꺼지는 모습을 떠올리자, 무언가를 죽이는 일에 손을 보태게 될 것 같은 불편한 기분이 들었다. 새끼 양이나 송아지, 그 밖의 죄 없는 작은 생명을 잡아야 할 때 밀려오던 바로 그 기분이었다.`],
[78, `마차가 마당으로 들어섰을 때 마당은 아주 어두웠고, 사방에서 포플러 잎이 비단결처럼 사각사각 소리를 내고 있었다.`],
[79, `“나무들이 잠꼬대하는 소리 좀 들어 보세요.” 매슈가 아이를 땅에 내려 줄 때 아이가 속삭였다. “얼마나 좋은 꿈을 꾸고 있을까요!”`],
[80, `그러고는 ‘세상 재산 전부’가 든 융단 가방을 꼭 쥐고 아이는 매슈를 따라 집 안으로 들어갔다.`]
  ],
  extra: [
[`x1`, `원작 3장 첫 장면 (다음 이야기)`, `매슈가 문을 열자 마릴라가 바삐 걸어 나왔다. 그러나 뻣뻣하고 볼품없는 옷에 기다란 빨간 머리를 땋아 내리고 간절하게 반짝이는 눈을 한 이상한 작은 아이를 보는 순간, 마릴라는 깜짝 놀라 우뚝 멈춰 섰다. “매슈 커스버트, 그 애는 누구예요?” 마릴라가 소리쳤다. “사내아이는 어디 있고요?”`]
  ]
};

/* 원문 책장: 원작 9~10장 — 이 앱을 위해 새로 우리말로 옮김 */
BOOK.ch2 = {
  title: `레이첼 린드 부인, 기겁하다 · 앤의 사과`,
  orig: `원작 9~10장`,
  paras: [
[`h`, `원작 9장 「레이첼 린드 부인, 기겁하다」`],
[`9-1`, `앤이 초록 지붕 집에 온 지 두 주가 지나서야 린드 부인이 앤을 살펴보러 왔다. 공정하게 말하자면 레이첼 부인 탓은 아니었다. 지난번 초록 지붕 집을 다녀간 뒤로 철에 맞지 않는 지독한 독감에 걸려 집 안에만 갇혀 지냈던 것이다. 레이첼 부인은 좀처럼 앓는 일이 없었고 아픈 사람들을 대놓고 업신여겼다. 하지만 독감만큼은 이 세상 어떤 병과도 다른, 하느님이 특별히 내리신 시련으로밖에 볼 수 없다는 것이 부인의 주장이었다. 의사가 바깥에 발을 내디뎌도 좋다고 허락하자마자, 부인은 매슈와 마릴라네 고아를 보고 싶은 호기심에 터질 듯한 마음으로 초록 지붕 집으로 서둘러 올라갔다. 그 고아에 대해서는 에이번리에 온갖 이야기와 추측이 나돌고 있었다.`],
[`9-2`, `앤은 그 두 주 동안 깨어 있는 매 순간을 알차게 보냈다. 벌써 집 둘레의 나무와 덤불을 하나하나 다 알게 되었다. 사과 과수원 아래로 오솔길이 하나 나 있어 숲 사이로 이어진다는 것도 알아냈다. 그리고 그 길을 맨 끝까지 탐험했다. 시냇물과 다리, 전나무 덤불과 산벚나무 아치, 고사리가 우거진 모퉁이, 단풍나무와 마가목 사이로 갈라지는 샛길까지, 그 길이 부리는 온갖 즐거운 변덕을 남김없이 맛보았다.`],
[`9-3`, `앤은 골짜기 아래 샘물과도 친구가 되었다. 깊고 맑고 얼음처럼 차가운 그 멋진 샘은 매끄러운 붉은 사암으로 둘러싸여 있었고, 야자수 잎 같은 커다란 물고사리 덤불이 가장자리를 두르고 있었다. 그 너머에는 시냇물 위로 통나무 다리가 놓여 있었다.`],
[`9-4`, `그 다리를 건너면 앤의 춤추는 발걸음은 숲이 우거진 언덕으로 이어졌다. 곧게 빽빽이 자란 전나무와 가문비나무 아래로는 늘 어스름이 깔려 있었다. 그곳에 피는 꽃이라고는 수줍고 향긋한 숲속 꽃인 가냘픈 '린네풀'이 무수히 피어 있는 것과, 지난해 핀 꽃들의 넋처럼 창백하고 하늘하늘한 별꽃 몇 송이가 전부였다. 나무 사이로는 거미줄이 은실처럼 반짝였고, 전나무 가지와 꽃술은 다정하게 말을 건네는 것 같았다.`],
[`9-5`, `이 황홀한 탐험은 모두 놀아도 좋다고 허락받은 짬짬이 30분 동안 이루어졌다. 앤은 자기가 발견한 것들을 이야기하느라 매슈와 마릴라의 귀가 반쯤 먹먹해질 만큼 떠들었다. 물론 매슈는 불평하지 않았다. 그는 말없이 즐거운 미소를 띤 채 그 이야기를 다 들어 주었다. 마릴라는 그 '수다'를 참아 주다가, 자기가 너무 이야기에 빠져든다 싶으면 곧바로 "입 좀 다물어라" 하고 짧게 명령해 앤의 입을 막았다.`],
[`9-6`, `레이첼 부인이 왔을 때 앤은 과수원에 나가 있었다. 붉은 저녁 햇살이 흩뿌려진, 무성하게 일렁이는 풀밭 사이를 마음 내키는 대로 거닐고 있었던 것이다. 그래서 그 선량한 부인은 자기 병 이야기를 마음껏 늘어놓을 수 있었다. 아팠던 곳 하나하나, 맥박 하나하나를 어찌나 신나게 설명하는지, 마릴라는 독감에도 나름의 보상이 있나 보다 생각했을 정도였다. 자세한 이야기가 바닥나자 레이첼 부인은 찾아온 진짜 이유를 꺼냈다.`],
[`9-7`, `"자네와 매슈에 대해 놀라운 이야기를 듣고 있다네."`],
[`9-8`, `"놀라기로는 나만큼이야 하겠어요." 마릴라가 말했다. "이제 조금씩 놀란 마음이 가라앉는 중이에요."`],
[`9-9`, `"그런 착오가 생기다니 참 안됐네." 레이첼 부인이 동정하듯 말했다. "돌려보낼 수는 없었나?"`],
[`9-10`, `"그럴 수도 있었겠지만, 그러지 않기로 했어요. 매슈가 그 아이를 마음에 들어 했거든요. 그리고 솔직히 나도 그 애가 좋아요. 물론 단점도 있다는 건 인정하지만요. 집이 벌써 딴 곳처럼 달라졌어요. 정말 영리한 아이예요."`],
[`9-11`, `마릴라는 처음 마음먹은 것보다 더 많은 말을 해 버렸다. 레이첼 부인의 얼굴에 못마땅한 기색이 떠올랐기 때문이다.`],
[`9-12`, `"엄청난 책임을 떠맡았구먼." 부인이 침울하게 말했다. "특히 아이를 키워 본 적도 없으면서 말이야. 그 아이에 대해서도, 그 애의 진짜 성품에 대해서도 잘 모를 테고, 그런 아이가 커서 어떻게 될지는 아무도 모르는 법이지. 그렇다고 자네 기를 꺾으려는 건 절대 아니야, 마릴라."`],
[`9-13`, `"기 꺾일 일 없어요." 마릴라가 무뚝뚝하게 대답했다. "나는 한번 마음먹으면 바꾸지 않으니까요. 앤을 보고 싶으시겠지요. 불러올게요."`],
[`9-14`, `곧 앤이 뛰어 들어왔다. 과수원을 쏘다닌 기쁨으로 얼굴이 반짝이고 있었다. 하지만 뜻밖에 낯선 사람이 있는 것을 보고는 당황해서 문 안쪽에 멈춰 섰다. 고아원에서부터 입고 온 짧고 꽉 끼는 윈시 원피스 아래로 깡마른 다리가 볼품없이 길어 보여서, 정말이지 별나게 생긴 아이였다. 주근깨는 그 어느 때보다 많고 도드라져 보였다. 모자를 쓰지 않은 머리는 바람에 헝클어져 지나치게 눈부신 엉망이 되어 있었다. 그 순간만큼 앤의 머리가 빨개 보인 적은 없었다.`],
[`9-15`, `"세상에, 생김새 보고 고른 건 아닌 게 확실하구먼." 레이첼 린드 부인이 단호하게 말했다. 레이첼 부인은 누구 눈치도 보지 않고 할 말은 하는 것을 자랑으로 여기는, 유쾌하고 인기 있는 사람들 가운데 하나였다. "지독하게 말랐고 못생겼네, 마릴라. 이리 와 봐라, 얘야. 어디 좀 보자. 맙소사, 세상에 이런 주근깨를 본 적이 있나? 머리는 또 홍당무처럼 빨갛고! 이리 오라니까, 얘야."`],
[`9-16`, `앤은 '갔다'. 그러나 레이첼 부인이 기대한 방식은 아니었다. 앤은 단숨에 부엌 바닥을 가로질러 레이첼 부인 앞에 섰다. 얼굴은 분노로 새빨갰고, 입술은 떨렸고, 가냘픈 온몸이 머리부터 발끝까지 부들부들 떨리고 있었다.`],
[`9-17`, `"아주머니가 미워요." 앤이 목멘 소리로 외치며 발을 쿵 굴렀다. "미워요, 미워요, 미워요." 밉다고 외칠 때마다 발 구르는 소리가 더 커졌다. "어떻게 저더러 말라깽이에 못생겼다고 하실 수 있어요? 어떻게 주근깨투성이에 빨간 머리라고 하실 수 있어요? 아주머니는 무례하고 버릇없고 인정머리 없는 분이에요!"`],
[`9-18`, `"앤!" 마릴라가 깜짝 놀라 소리쳤다.`],
[`9-19`, `그러나 앤은 꿋꿋하게 레이첼 부인을 마주 보고 서 있었다. 고개를 쳐들고, 두 눈은 이글거리고, 두 주먹을 꽉 쥔 채, 온몸에서 격렬한 분노가 아지랑이처럼 피어오르고 있었다.`],
[`9-20`, `"어떻게 저한테 그런 말을 하실 수 있어요?" 앤이 맹렬하게 되풀이했다. "누가 아주머니한테 그런 말을 하면 좋으시겠어요? 아주머니더러 뚱뚱하고 굼뜨고 상상력이라곤 한 톨도 없을 거라고 하면 좋으시겠어요? 이렇게 말해서 아주머니 마음이 상해도 상관없어요! 상했으면 좋겠어요. 아주머니는 제 마음을 그 어느 때보다도 아프게 했어요. 토머스 아주머니네 술주정뱅이 남편보다도 더요. 저는 절대로 아주머니를 용서하지 않을 거예요. 절대로, 절대로요!"`],
[`9-21`, `쿵! 쿵!`],
[`9-22`, `"세상에 이런 성질머리를 본 적이 있나!" 레이첼 부인이 기겁해서 외쳤다.`],
[`9-23`, `"앤, 네 방에 올라가서 내가 갈 때까지 거기 있어라." 마릴라가 간신히 말문을 되찾고 말했다.`],
[`9-24`, `앤은 울음을 터뜨리며 복도 문으로 달려가더니, 바깥 현관 벽에 걸린 양철 그릇들이 덩달아 덜그럭거릴 만큼 문을 쾅 닫고, 회오리바람처럼 복도를 지나 계단을 뛰어 올라갔다. 위층에서 둔탁하게 쾅 하는 소리가 들려, 동쪽 다락방 문도 똑같이 세차게 닫혔다는 것을 알려 주었다.`],
[`9-25`, `"글쎄, 저런 걸 키워야 하다니 하나도 안 부럽구먼, 마릴라." 레이첼 부인이 더없이 엄숙하게 말했다.`],
[`9-26`, `마릴라는 사과인지 변명인지 자기도 모를 말을 하려고 입을 열었다. 그런데 정작 입에서 나온 말은 그때도, 그 뒤로도 내내 마릴라 자신을 놀라게 했다.`],
[`9-27`, `"아이 생김새를 가지고 놀리시면 안 됐어요, 레이첼."`],
[`9-28`, `"마릴라 커스버트, 방금 우리가 본 그 끔찍한 성질을 편들겠다는 말은 아니겠지?" 레이첼 부인이 분개해서 따졌다.`],
[`9-29`, `"아니에요." 마릴라가 천천히 말했다. "그 애를 감싸려는 게 아니에요. 아주 버릇없게 굴었으니 단단히 타일러야겠지요. 하지만 그 애 사정도 헤아려 줘야 해요. 그 애는 무엇이 옳은지 한 번도 배운 적이 없거든요. 그리고 레이첼, 당신도 그 애한테 너무 심했어요."`],
[`9-30`, `마릴라는 마지막 한마디를 덧붙이지 않을 수 없었다. 그러고는 또다시 그런 자신에게 놀랐다. 레이첼 부인은 기분이 상했다는 듯 위엄 있게 자리에서 일어났다.`],
[`9-31`, `"그래, 앞으로는 말조심을 단단히 해야겠구먼, 마릴라. 어디서 왔는지도 모르는 고아의 고상한 기분을 무엇보다 먼저 헤아려야 하니 말이야. 아, 아니, 화난 거 아니야. 걱정 말게. 자네가 너무 딱해서 화낼 틈도 없어. 저 애 때문에 자네 고생 좀 할 거야. 하지만 내 충고를 듣겠다면, 안 듣겠지만, 내가 아이를 열 명이나 키우고 둘을 묻었다네, 자네가 말한 그 '타이르기'는 꽤 굵은 자작나무 회초리로 하게. 저런 아이한테는 그게 제일 잘 통하는 말일 거야. 성질이 꼭 머리 색깔 같구먼. 그럼, 잘 있게, 마릴라. 전처럼 자주 놀러 오게. 하지만 나는 한동안 여기 올 생각 없네. 이런 식으로 달려들어 모욕을 당할 수도 있다면 말이야. 내 평생 처음 겪는 일일세."`],
[`9-32`, `그러고는 레이첼 부인은 휙 나가 버렸다. 늘 뒤뚱뒤뚱 걷는 뚱뚱한 부인을 두고 '휙' 나갔다고 할 수 있다면 말이다. 마릴라는 아주 엄숙한 얼굴로 동쪽 다락방으로 향했다.`],
[`9-33`, `계단을 올라가며 마릴라는 어떻게 해야 할지 불안하게 곰곰이 생각했다. 방금 벌어진 일에 적잖이 당황스러웠다. 하필이면 레이첼 린드 부인 앞에서 앤이 그런 성질을 부리다니, 이 무슨 불운이란 말인가! 그러다 마릴라는 문득 불편하고 부끄러운 사실을 깨달았다. 앤의 성품에 그런 심각한 결점이 있다는 걸 알게 된 슬픔보다, 망신을 당했다는 창피함이 더 크다는 것이었다. 그리고 앤을 어떻게 벌해야 할까? 자작나무 회초리를 쓰라는 친절한 충고는, 그 효과라면 레이첼 부인의 아이들이 모두 쓰라리게 증언할 수 있겠지만, 마릴라의 마음을 끌지 못했다. 아이를 때릴 수 있을 것 같지 않았다. 아니, 앤이 자기 잘못이 얼마나 큰지 제대로 깨닫게 할 다른 벌을 찾아야 했다.`],
[`9-34`, `마릴라가 들어가 보니 앤은 침대에 엎드려 서럽게 울고 있었다. 깨끗한 침대보 위에 흙 묻은 신발을 올려놓은 것도 까맣게 모른 채였다.`],
[`9-35`, `"앤." 마릴라가 그리 엄하지 않게 불렀다.`],
[`9-36`, `대답이 없었다.`],
[`9-37`, `"앤." 이번에는 더 엄하게. "당장 침대에서 내려와서 내 말 들어라."`],
[`9-38`, `앤은 꼼지락거리며 침대에서 내려와 옆 의자에 뻣뻣하게 앉았다. 얼굴은 퉁퉁 붓고 눈물 자국투성이였으며, 눈은 고집스럽게 바닥만 노려보고 있었다.`],
[`9-39`, `"이게 무슨 버릇이니, 앤! 부끄럽지도 않니?"`],
[`9-40`, `"그 아주머니는 저더러 못생겼다고, 빨간 머리라고 할 권리가 없었어요." 앤이 대답을 피하며 반항적으로 맞받았다.`],
[`9-41`, `"너도 그렇게 길길이 날뛰며 그분께 그런 식으로 말할 권리는 없었다, 앤. 네가 부끄러웠다. 정말 부끄러웠어. 린드 부인께 얌전하게 굴길 바랐는데, 너는 나를 망신시켰어. 린드 부인이 너더러 빨간 머리에 못생겼다고 했다고 왜 그렇게 성을 내는지 모르겠구나. 너도 그런 말을 입에 달고 살면서."`],
[`9-42`, `"아, 하지만 자기가 그렇게 말하는 거랑 남한테서 그런 말을 듣는 건 완전히 달라요." 앤이 울부짖었다. "그게 사실이라는 걸 알아도, 다른 사람들은 그렇게까지 생각하지 않았으면 하고 바랄 수밖에 없잖아요. 제가 성질이 지독하다고 생각하시겠지만, 어쩔 수 없었어요. 그분이 그런 말을 하니까 뭔가가 속에서 확 치밀어 올라서 숨이 막혔어요. 그분한테 달려들 수밖에 없었어요."`],
[`9-43`, `"그래, 아주 볼만한 구경거리가 됐구나. 린드 부인은 이제 여기저기 다니며 네 이야기를 신나게 할 거다. 정말로 할 거야. 그렇게 성질을 부린 건 끔찍한 일이었다, 앤."`],
[`9-44`, `"누가 아주머니 면전에서 말라깽이에 못생겼다고 하면 어떤 기분이실지 상상해 보세요." 앤이 눈물을 글썽이며 애원했다.`],
[`9-45`, `옛 기억 하나가 갑자기 마릴라 앞에 떠올랐다. 아주 어렸을 때, 이모 한 분이 다른 이모에게 자기를 두고 하는 말을 들은 적이 있었다. "가엾게도 저 애는 어쩜 저렇게 까무잡잡하고 못생겼을까." 마릴라는 쉰 살이 다 되어서야 그 기억의 아픔에서 벗어날 수 있었다.`],
[`9-46`, `"린드 부인이 너한테 한 말이 꼭 옳았다고는 하지 않겠다, 앤." 마릴라가 한결 부드러운 목소리로 인정했다. "레이첼은 말이 너무 거침없지. 하지만 그렇다고 네가 그렇게 행동한 게 용서되는 건 아니다. 그분은 낯선 사람이고, 어른이고, 내 손님이었어. 셋 다 네가 그분을 공손히 대했어야 할 충분한 이유지. 너는 무례하고 버릇없었어. 그러니까" 마릴라에게 구원 같은 벌이 떠올랐다. "그분께 가서 성질부린 걸 정말 죄송하다고 말씀드리고 용서를 빌어야 한다."`],
[`9-47`, `"그건 절대 못 해요." 앤이 단호하고 어둡게 말했다. "어떤 벌이든 내리셔도 좋아요, 마릴라. 뱀과 두꺼비가 우글거리는 어둡고 축축한 지하 감옥에 가두고 빵과 물만 주셔도 불평하지 않을게요. 하지만 린드 부인께 용서해 달라고는 못 하겠어요."`],
[`9-48`, `"우리는 사람을 어둡고 축축한 지하 감옥에 가두는 버릇이 없단다." 마릴라가 무뚝뚝하게 말했다. "게다가 에이번리엔 그런 감옥이 좀처럼 없거든. 하지만 린드 부인께는 꼭 사과해야 하고, 또 사과하게 될 거다. 사과할 마음이 생겼다고 나한테 말할 수 있을 때까지 이 방에 있거라."`],
[`9-49`, `"그럼 저는 영원히 여기 있어야겠네요." 앤이 구슬프게 말했다. "그런 말을 해서 죄송하다고 린드 부인께 말할 수 없으니까요. 어떻게 그래요? 저는 죄송하지 않은걸요. 아주머니를 속상하게 해서 죄송하긴 해요. 하지만 그분께 그 말을 그대로 해 준 건 기뻐요. 정말 속이 시원했어요. 죄송하지 않은데 죄송하다고 할 수는 없잖아요? 죄송하다고 상상하는 것조차 안 돼요."`],
[`9-50`, `"아침이 되면 네 상상력이 좀 더 제대로 돌아가겠지." 마릴라가 나가려고 일어서며 말했다. "밤새 네 행동을 곰곰이 생각하고 마음을 고쳐먹어라. 우리가 초록 지붕 집에 있게 해 주면 아주 착한 아이가 되려고 노력하겠다고 했지만, 오늘 저녁엔 아무래도 그래 보이지 않는구나."`],
[`9-51`, `이 마지막 한 방을 앤의 폭풍 같은 가슴에 꽂아 두고, 마릴라는 마음이 몹시 괴롭고 심란한 채로 부엌에 내려갔다. 앤에게 화가 난 만큼 자기 자신에게도 화가 났다. 레이첼 부인의 어안이 벙벙한 얼굴이 떠오를 때마다 입꼬리가 씰룩거리며, 아주 못마땅하게도 웃고 싶은 마음이 들었기 때문이다.`],
[`h`, `원작 10장 「앤의 사과」`],
[`10-1`, `마릴라는 그날 저녁 매슈에게 이 일에 대해 아무 말도 하지 않았다. 하지만 다음 날 아침에도 앤이 계속 고집을 부리자, 앤이 아침 식탁에 나타나지 않은 까닭을 설명해야 했다. 마릴라는 매슈에게 자초지종을 다 이야기하며, 앤의 행동이 얼마나 끔찍했는지 제대로 알아듣게 하려고 애를 썼다.`],
[`10-2`, `"레이첼 린드가 한 소리 들은 건 잘된 일이지. 그 사람은 참견 잘하는 늙은 수다쟁이니까." 매슈가 위로하듯 대꾸했다.`],
[`10-3`, `"매슈 커스버트, 오라버니한테 놀랐어요. 앤이 한 짓이 끔찍했다는 걸 알면서 그 애 편을 들다니요! 다음엔 그 애를 아예 벌주지 말자고 하시겠네요."`],
[`10-4`, `"글쎄다, 아니, 꼭 그런 건 아니고." 매슈가 불안하게 말했다. "조금은 벌을 받아야겠지. 하지만 너무 모질게 하지는 마라, 마릴라. 그 애는 옳은 걸 가르쳐 준 사람이 한 번도 없었다는 걸 기억해라. 너, 너 그 애 먹을 건 갖다줄 거지?"`],
[`10-5`, `"내가 굶겨서 버릇 고친다는 소리 들어 본 적 있어요?" 마릴라가 발끈했다. "끼니는 꼬박꼬박 먹을 거고, 내가 직접 들고 올라갈 거예요. 하지만 린드 부인께 사과하겠다고 할 때까지는 거기 있어야 해요. 그걸로 끝이에요, 오라버니."`],
[`10-6`, `아침, 점심, 저녁 식사가 모두 아주 조용했다. 앤이 여전히 고집을 꺾지 않았기 때문이다. 식사 때마다 마릴라는 음식을 가득 담은 쟁반을 동쪽 다락방에 갖다 놓았고, 나중에 가지고 내려올 때 보면 음식은 별로 줄어 있지 않았다. 매슈는 마지막 쟁반이 내려오는 것을 걱정스러운 눈으로 지켜보았다. 앤이 뭘 먹기는 한 걸까?`],
[`10-7`, `그날 저녁 마릴라가 뒷목장에서 소를 몰고 오려고 나가자, 헛간 근처를 서성이며 지켜보던 매슈는 도둑처럼 슬그머니 집 안으로 들어가 위층으로 살금살금 올라갔다. 평소 매슈는 부엌과 복도 옆 자기 작은 침실 사이만 오갔다. 목사님이 차를 마시러 오시면 가끔 마지못해 거실에 들어가는 정도였다. 그러나 자기 집 위층에 올라온 것은 마릴라를 도와 손님방에 벽지를 바른 그해 봄 이후 처음이었다. 4년 전의 일이었다.`],
[`10-8`, `매슈는 발끝으로 복도를 걸어가 동쪽 다락방 문밖에 몇 분 동안이나 서 있다가, 겨우 용기를 내어 손가락으로 문을 똑똑 두드리고 살그머니 문을 열어 안을 들여다보았다.`],
[`10-9`, `앤은 창가의 노란 의자에 앉아 슬픈 얼굴로 정원을 내다보고 있었다. 무척 작고 불행해 보여서 매슈는 가슴이 아팠다. 그는 문을 살며시 닫고 발끝으로 앤에게 다가갔다.`],
[`10-10`, `"앤." 누가 엿들을까 봐 겁나는 듯 매슈가 속삭였다. "좀 어떠냐, 앤?"`],
[`10-11`, `앤은 힘없이 웃었다.`],
[`10-12`, `"그럭저럭 지내요. 이것저것 상상을 많이 하니까 시간이 좀 가요. 물론 꽤 외롭긴 해요. 하지만 이제 익숙해지는 게 좋겠죠."`],
[`10-13`, `앤은 앞으로 펼쳐질 기나긴 독방 생활을 용감하게 마주하며 다시 미소 지었다.`],
[`10-14`, `매슈는 마릴라가 일찍 돌아오기 전에 하러 온 말을 얼른 해야 한다는 것을 떠올렸다.`],
[`10-15`, `"글쎄다, 앤, 그냥 해 버리고 끝내는 게 어떻겠니?" 그가 속삭였다. "어차피 언젠가는 해야 할 거다. 마릴라는 지독히 고집이 센 사람이거든. 지독하게 말이다, 앤. 당장 해 버리고 끝내라, 응?"`],
[`10-16`, `"린드 부인께 사과하라는 말씀이세요?"`],
[`10-17`, `"그래, 사과. 바로 그 말이다." 매슈가 반갑게 말했다. "말하자면 그냥 좋게 마무리하라는 거지. 내가 하려던 말이 그거다."`],
[`10-18`, `"아저씨를 위해서라면 할 수도 있을 것 같아요." 앤이 생각에 잠겨 말했다. "죄송하다고 말하는 건 거짓말이 아니에요. 지금은 정말 죄송하거든요. 어젯밤엔 조금도 죄송하지 않았어요. 속속들이 화가 났고, 밤새 화가 나 있었어요. 세 번 깼는데 깰 때마다 화가 펄펄 났으니까 확실해요. 그런데 오늘 아침엔 다 사라졌어요. 더는 화가 나지 않았어요. 그리고 뭔가 텅 빈 끔찍한 느낌이 남았어요. 제 자신이 너무 부끄러웠어요. 하지만 린드 부인께 가서 그렇게 말씀드린다는 건 도저히 생각할 수 없었어요. 너무 굴욕적일 테니까요. 그럴 바엔 여기 영원히 갇혀 있겠다고 마음먹었어요. 그래도… 아저씨를 위해서라면 뭐든 할게요. 정말로 원하신다면…"`],
[`10-19`, `"글쎄다, 물론 원하지. 네가 없으니 아래층이 지독히 쓸쓸하구나. 가서 좋게 마무리하렴. 착하지."`],
[`10-20`, `"좋아요." 앤이 체념한 듯 말했다. "마릴라 아주머니가 들어오시자마자 뉘우쳤다고 말씀드릴게요."`],
[`10-21`, `"그래, 그래야지, 앤. 그런데 내가 이런 말 했다고 마릴라한테는 말하지 마라. 내가 참견했다고 생각할 거다. 참견 안 하겠다고 약속했거든."`],
[`10-22`, `"야생마가 끌어도 이 비밀은 안 말할게요." 앤이 엄숙하게 약속했다. "그런데 야생마가 어떻게 사람한테서 비밀을 끌어낼까요?"`],
[`10-23`, `그러나 매슈는 이미 사라지고 없었다. 자기가 해낸 일에 스스로 겁을 먹은 것이다. 그는 마릴라가 무슨 일을 꾸몄는지 눈치채지 못하도록 말 목장의 가장 먼 구석으로 허겁지겁 달아났다. 마릴라는 집에 돌아왔다가 난간 너머로 "마릴라 아주머니" 하고 부르는 애처로운 목소리를 듣고 기분 좋게 놀랐다.`],
[`10-24`, `"그래?" 마릴라가 복도로 나가며 말했다.`],
[`10-25`, `"성질부리고 무례한 말을 해서 죄송해요. 린드 부인께 가서 그렇게 말씀드릴게요."`],
[`10-26`, `"좋다." 마릴라의 딱딱한 말투에서는 안도하는 기색이 조금도 드러나지 않았다. 앤이 끝내 굽히지 않으면 대체 어떻게 해야 하나 고민하던 참이었다. "젖 짜고 나서 데려가마."`],
[`10-27`, `그리하여 젖을 다 짠 뒤, 마릴라와 앤은 오솔길을 걸어 내려갔다. 마릴라는 꼿꼿하고 의기양양했고, 앤은 고개를 푹 숙인 채 풀이 죽어 있었다. 그런데 반쯤 내려갔을 때 앤의 풀 죽은 모습이 마법처럼 사라졌다. 앤은 고개를 들고 사뿐사뿐 걸었다. 두 눈은 노을 진 하늘에 고정되어 있었고, 어딘지 모르게 들뜬 기운이 감돌았다. 마릴라는 그 변화가 못마땅했다. 이건 마음이 상한 린드 부인 앞에 데려가야 할 얌전한 참회자의 모습이 아니었다.`],
[`10-28`, `"무슨 생각을 하니, 앤?" 마릴라가 날카롭게 물었다.`],
[`10-29`, `"린드 부인께 뭐라고 말씀드릴지 상상하고 있어요." 앤이 꿈꾸듯 대답했다.`],
[`10-30`, `만족스러운 대답이었다. 아니, 만족스러워야 했다. 하지만 마릴라는 자기가 짠 벌의 계획이 어딘가 어긋나고 있다는 생각을 떨칠 수 없었다. 앤이 저렇게 황홀하고 환한 얼굴을 할 까닭이 없었다.`],
[`10-31`, `앤은 린드 부인 바로 앞에 이를 때까지 황홀하고 환한 얼굴을 하고 있었다. 부인은 부엌 창가에 앉아 뜨개질을 하고 있었다. 그때 환한 빛이 사라졌다. 얼굴 구석구석에 구슬픈 뉘우침이 떠올랐다. 말 한마디 꺼내기도 전에 앤은 깜짝 놀란 레이첼 부인 앞에 갑자기 무릎을 꿇고 애원하듯 두 손을 내밀었다.`],
[`10-32`, `"아, 린드 부인, 정말 너무너무 죄송해요." 앤이 떨리는 목소리로 말했다. "제 슬픔을 다 표현할 수는 없어요. 사전 한 권을 다 쓴다 해도 안 될 거예요. 그냥 상상해 주셔야 해요. 저는 부인께 끔찍하게 굴었어요. 그리고 제가 남자아이가 아닌데도 초록 지붕 집에 있게 해 준 소중한 분들, 매슈 아저씨와 마릴라 아주머니께 망신을 드렸어요. 저는 지독하게 못되고 은혜를 모르는 아이예요. 벌을 받아 마땅하고, 점잖은 사람들한테 영원히 쫓겨나야 마땅해요. 부인께서 사실을 말씀하셨다고 성질을 부린 건 정말 못된 짓이었어요. 그건 사실이었어요. 부인이 하신 말씀은 한마디 한마디 다 사실이었어요. 제 머리는 빨갛고, 저는 주근깨투성이에 깡마르고 못생겼어요. 제가 부인께 한 말도 사실이긴 했지만, 그런 말을 하지 말았어야 했어요. 아, 린드 부인, 제발, 제발 용서해 주세요. 용서해 주지 않으시면 그건 제 평생의 슬픔이 될 거예요. 아무리 성질이 지독하다 해도, 가엾은 어린 고아 소녀에게 평생의 슬픔을 안기고 싶지는 않으시겠죠? 아, 분명 그러실 거예요. 제발 용서한다고 말씀해 주세요, 린드 부인."`],
[`10-33`, `앤은 두 손을 맞잡고 고개를 숙인 채 심판의 말을 기다렸다.`],
[`10-34`, `앤의 진심은 틀림없었다. 목소리 한 마디 한 마디에 진심이 묻어났다. 마릴라도 린드 부인도 그 틀림없는 울림을 알아들었다. 그러나 마릴라는 앤이 이 굴욕의 골짜기를 실제로 즐기고 있다는 것, 철저하게 몸을 낮추는 것에 푹 빠져 있다는 것을 알아차리고 당황했다. 마릴라 자신이 그토록 뿌듯해하던 그 건전한 벌은 어디로 갔단 말인가? 앤은 그것을 일종의 즐거움으로 바꿔 놓고 만 것이다.`],
[`10-35`, `눈치가 그리 빠르지 않은 선량한 린드 부인은 그것을 알아채지 못했다. 앤이 아주 철저하게 사과했다는 것만 알아차렸을 뿐이다. 그러자 조금 참견하기 좋아하긴 해도 친절한 부인의 마음에서 노여움이 말끔히 사라졌다.`],
[`10-36`, `"자, 자, 일어나라, 얘야." 부인이 시원스레 말했다. "물론 용서하고말고. 아무튼 나도 너한테 좀 심했던 것 같구나. 내가 워낙 말을 거침없이 하는 사람이라서 말이다. 내 말은 그냥 마음에 두지 마라. 네 머리가 지독하게 빨간 건 부정할 수 없다만, 내가 아는 여자아이가 하나 있었는데, 사실 학교 동창이다만, 어릴 땐 머리가 너만큼이나 빨갰는데 크면서 정말 멋진 적갈색으로 짙어지더구나. 네 머리도 그렇게 된대도 나는 조금도 놀라지 않을 거다. 조금도."`],
[`10-37`, `"아, 린드 부인!" 앤은 일어서며 숨을 길게 들이마셨다. "부인께서 제게 희망을 주셨어요. 부인은 언제까지나 제 은인이세요. 아, 크면 제 머리가 멋진 적갈색이 될 거라고만 생각할 수 있다면 무엇이든 견딜 수 있어요. 머리가 멋진 적갈색이라면 착하게 사는 게 훨씬 쉬울 것 같지 않으세요? 그런데 부인과 마릴라 아주머니가 이야기 나누시는 동안 정원에 나가서 사과나무 아래 벤치에 앉아 있어도 될까요? 바깥이 상상할 여지가 훨씬 많거든요."`],
[`10-38`, `"아무렴, 그래라, 얘야. 저쪽 구석에 핀 하얀 유월 백합도 마음에 들면 한 다발 꺾어 가려무나."`],
[`10-39`, `앤이 나가고 문이 닫히자 린드 부인은 바지런히 일어나 등불을 켰다.`],
[`10-40`, `"정말 별난 아이야. 이 의자에 앉게, 마릴라. 자네가 앉은 것보다 편하다네. 그건 일꾼 아이 앉으라고 둔 거야. 그래, 확실히 별난 아이야. 그래도 어딘가 사람 마음을 끄는 데가 있어. 이제는 자네와 매슈가 저 애를 데리고 있겠다는 게 그리 놀랍지 않아. 자네가 그렇게 딱하지도 않고. 잘 자랄지도 모르지. 물론 말하는 투가 좀 별나긴 하지. 좀, 그러니까, 좀 지나치게 힘이 들어가 있다고나 할까. 하지만 이제 점잖은 사람들 사이에서 살게 됐으니 차차 나아지겠지. 그리고 성질이 꽤 급한 것 같아. 하지만 한 가지 다행인 건, 성질이 급한 아이는 확 타올랐다가 금세 식어 버리니까 음흉하거나 남을 속이는 일은 없다는 거야. 음흉한 아이만은 질색이야, 정말이지. 대체로 보면, 마릴라, 나는 저 애가 좀 마음에 드네."`],
[`10-41`, `마릴라가 집에 가려고 나서자, 앤은 향기로운 과수원의 어스름 속에서 흰 수선화 한 아름을 안고 나왔다.`],
[`10-42`, `"저 사과 꽤 잘했죠, 그렇죠?" 오솔길을 내려가며 앤이 뿌듯하게 말했다. "어차피 해야 한다면 철저하게 하는 게 낫겠다고 생각했어요."`],
[`10-43`, `"철저하게 하긴 했지, 그래." 마릴라가 대꾸했다. 마릴라는 그 장면을 떠올리며 웃고 싶어지는 자신에게 당황했다. 사과를 너무 잘했다고 앤을 꾸짖어야 할 것 같은 불편한 기분도 들었다. 하지만 그건 말도 안 되는 일이었다! 그래서 양심과 타협하는 셈 치고 엄하게 말했다.`],
[`10-44`, `"앞으로는 이런 사과를 할 일이 많지 않았으면 좋겠구나. 이제부터는 성질을 다스리도록 노력해라, 앤."`],
[`10-45`, `"사람들이 제 생김새를 가지고 놀리지만 않으면 그리 어렵지 않을 거예요." 앤이 한숨을 쉬며 말했다. "다른 일로는 화가 안 나요. 그런데 머리 가지고 놀림받는 데는 정말 지쳤어요. 그런 말을 들으면 속이 부글부글 끓어 넘쳐요. 정말 제가 크면 머리가 멋진 적갈색이 될까요?"`],
[`10-46`, `"생김새를 너무 신경 쓰면 안 된다, 앤. 너는 허영심이 아주 많은 아이 같구나."`],
[`10-47`, `"못생긴 걸 아는데 어떻게 허영심이 있겠어요?" 앤이 항변했다. "저는 예쁜 게 좋아요. 그래서 거울을 봤는데 예쁘지 않은 게 보이면 싫어요. 그러면 너무 서글퍼져요. 못생긴 걸 볼 때랑 똑같이요. 아름답지 않아서 가엾게 느껴지거든요."`],
[`10-48`, `"생김새보다 행실이 고와야 아름다운 거다." 마릴라가 옛말을 인용했다.`],
[`10-49`, `"전에도 그 말을 들어 봤지만, 저는 좀 의심스러워요." 앤이 수선화 향기를 맡으며 미심쩍다는 듯 말했다. "아, 이 꽃 정말 향기롭지 않아요! 린드 부인께서 주시다니 정말 고마운 일이에요. 이제 린드 부인께 서운한 마음은 하나도 없어요. 사과하고 용서받는 건 참 기분 좋고 마음 편한 일이네요, 그렇죠? 오늘 밤 별이 참 밝지 않아요? 별에 가서 살 수 있다면 어느 별을 고르시겠어요? 저는 저 어두운 언덕 위에 있는 크고 맑은 예쁜 별이 좋아요."`],
[`10-50`, `"앤, 제발 입 좀 다물어라." 앤의 생각이 빙글빙글 돌아가는 걸 따라가느라 녹초가 된 마릴라가 말했다.`],
[`10-51`, `둘이 자기네 오솔길로 접어들 때까지 앤은 더 말하지 않았다. 이슬 젖은 어린 고사리의 알싸한 향기를 실은 떠돌이 바람이 오솔길을 따라 내려와 둘을 맞았다. 저 멀리 그늘 속, 나무 사이로 초록 지붕 집 부엌 불빛이 반갑게 반짝였다. 앤이 갑자기 마릴라에게 바싹 다가와 그녀의 거친 손바닥에 자기 손을 쏙 밀어 넣었다.`],
[`10-52`, `"집에 가는데, 그곳이 집이라는 걸 아는 건 참 좋네요." 앤이 말했다. "저는 벌써 초록 지붕 집이 좋아요. 지금까지 어떤 곳도 좋아해 본 적이 없었어요. 어떤 곳도 집 같지 않았거든요. 아, 마릴라 아주머니, 저 정말 행복해요. 지금 당장 기도하라고 해도 조금도 어렵지 않을 것 같아요."`],
[`10-53`, `작고 야윈 손이 자기 손에 닿자 마릴라의 가슴속에서 따뜻하고 기분 좋은 무언가가 솟아올랐다. 어쩌면 그녀가 놓쳐 버린 모성의 떨림이었을지도 모른다. 너무 낯설고 달콤해서 오히려 마음이 흔들렸다. 마릴라는 서둘러 교훈을 늘어놓으며 마음을 평소처럼 차분하게 되돌리려 했다.`],
[`10-54`, `"착한 아이가 되면 언제나 행복할 거다, 앤. 그리고 기도하는 게 어려워서는 안 되는 거란다."`],
[`10-55`, `"기도문을 외는 거랑 기도하는 건 꼭 같지 않아요." 앤이 생각에 잠겨 말했다. "그런데 저는 지금부터 저 나무 꼭대기에 부는 바람이라고 상상할 거예요. 나무가 지겨워지면 여기 아래 고사리 사이에서 살랑살랑 흔들린다고 상상하고, 그다음엔 린드 부인네 정원으로 날아가서 꽃들을 춤추게 하고, 그다음엔 토끼풀 밭 위로 한 번에 휙 날아가고, 그다음엔 반짝이는 호수 위로 불어서 반짝이는 잔물결을 일으킬 거예요. 아, 바람에는 상상할 여지가 정말 많아요! 그러니까 지금은 더 말하지 않을게요, 마릴라 아주머니."`],
[`10-56`, `"아이고, 고마워라." 마릴라가 진심으로 안도하며 숨을 내쉬었다.`]
  ]
};

/* 원문 책장: 원작 12장 — 이 앱을 위해 새로 우리말로 옮김 */
BOOK.ch3 = {
  title: `엄숙한 맹세와 약속`,
  orig: `원작 12장`,
  paras: [
[`12-1`, `마릴라가 꽃 장식 모자 이야기를 들은 것은 그다음 금요일이 되어서였다. 린드 부인 댁에 다녀온 마릴라는 앤을 불러 따져 물었다.`],
[`12-2`, `"앤, 레이첼 부인 말이 네가 지난 일요일에 장미랑 미나리아재비를 덕지덕지 단 우스꽝스러운 모자를 쓰고 교회에 갔다더구나. 대체 무슨 생각으로 그런 장난을 친 거니? 볼 만한 꼴이었겠다!"`],
[`12-3`, `"아, 분홍색이랑 노란색이 저한테 안 어울린다는 건 알아요." 앤이 말을 꺼냈다.`],
[`12-4`, `"어울리기는 무슨! 색깔이 어떻든, 모자에 꽃을 달았다는 것 자체가 우스꽝스럽다는 거다. 넌 정말 사람 속을 뒤집어 놓는 아이로구나!"`],
[`12-5`, `"드레스에 꽃을 다는 거랑 모자에 꽃을 다는 게 뭐가 그렇게 다른지 모르겠어요." 앤이 항변했다. "거기 있던 여자애들 중에 드레스에 꽃다발을 꽂은 애들이 많았어요. 뭐가 다른데요?"`],
[`12-6`, `마릴라는 확실하고 구체적인 이야기에서 벗어나 애매한 추상의 오솔길로 끌려 들어갈 생각이 없었다.`],
[`12-7`, `"그렇게 말대꾸하지 마라, 앤. 그런 짓을 한 건 아주 어리석었어. 다시는 그런 장난을 치다 내 눈에 띄지 말거라. 레이첼 부인 말이, 네가 그렇게 꾸미고 들어오는 걸 보고 바닥으로 꺼져 버리고 싶었단다. 너무 멀리 있어서 꽃을 떼라고 말해 줄 수도 없었고, 그땐 이미 늦었다는구나. 사람들이 그 이야기를 아주 고약하게들 했대. 당연히 사람들은 내가 너를 그런 꼴로 내보낼 만큼 생각이 없는 사람이라고 여기겠지."`],
[`12-8`, `"아, 정말 죄송해요." 앤의 눈에 눈물이 고였다. "아주머니가 싫어하실 줄은 생각도 못 했어요. 장미랑 미나리아재비가 너무 향기롭고 예뻐서 모자에 달면 근사할 줄 알았어요. 여자애들 중에는 모자에 조화를 단 애도 많았거든요. 저는 아주머니께 지독한 골칫거리가 될까 봐 겁나요. 차라리 저를 고아원으로 돌려보내시는 게 나을지도 몰라요. 그건 끔찍할 거예요. 견딜 수 없을 것 같아요. 아마 폐병에 걸리고 말 거예요. 보시다시피 전 이렇게 말랐잖아요. 그래도 아주머니께 골칫거리가 되는 것보다는 나을 거예요."`],
[`12-9`, `"말도 안 되는 소리." 마릴라는 아이를 울린 자신에게 짜증이 났다. "널 고아원에 돌려보낼 생각은 조금도 없다. 내가 바라는 건 네가 다른 여자애들처럼 얌전히 굴고 남의 웃음거리가 되지 않는 것뿐이야. 이제 그만 울어라. 너한테 들려줄 소식이 있다. 다이애나 배리가 오늘 오후에 집에 돌아왔다더구나. 내가 배리 부인한테 치마 본을 빌리러 갈 건데, 원한다면 같이 가서 다이애나와 인사를 나눠도 좋다."`],
[`12-10`, `앤은 두 손을 꼭 맞잡고 벌떡 일어섰다. 뺨에는 아직 눈물이 반짝이고 있었다. 단을 꿰매던 행주가 바닥으로 스르르 떨어졌지만 앤은 알아차리지도 못했다.`],
[`12-11`, `"아, 마릴라 아주머니, 무서워요. 막상 그때가 오니까 정말로 무서워요. 다이애나가 절 좋아하지 않으면 어떡하죠! 그건 제 인생에서 가장 비극적인 실망이 될 거예요."`],
[`12-12`, `"자, 호들갑 떨지 마라. 그리고 제발 그런 긴 낱말 좀 쓰지 말았으면 좋겠구나. 어린 여자애가 그러면 우스워 보인다. 다이애나는 널 충분히 좋아할 거다. 신경 써야 할 사람은 그 애 어머니야. 그 부인이 널 싫어하면 다이애나가 아무리 좋아해도 소용없어. 네가 린드 부인한테 성질부린 일이랑 미나리아재비를 두르고 교회에 간 일을 들었다면 너를 어떻게 생각할지 모르겠구나. 예의 바르고 얌전하게 굴어야 한다. 사람 놀라게 하는 말은 하지 말고. 아이고, 이 애가 정말로 떨고 있잖아!"`],
[`12-13`, `앤은 떨고 있었다. 얼굴이 하얗게 질리고 잔뜩 굳어 있었다.`],
[`12-14`, `"아, 마릴라 아주머니도 마음의 친구가 되었으면 하는 여자애를 만나러 가는데, 그 애 어머니가 아주머니를 싫어할지도 모른다면 떨리실 거예요." 앤은 그렇게 말하며 서둘러 모자를 가지러 갔다.`],
[`12-15`, `두 사람은 시냇물을 건너고 전나무 숲 언덕을 올라가는 지름길로 과수원 비탈 집에 갔다. 마릴라가 문을 두드리자 배리 부인이 부엌문으로 나왔다. 키가 크고 눈과 머리카락이 까맣고, 입매가 무척 단호해 보이는 부인이었다. 아이들에게 아주 엄격하다는 평판이 나 있었다.`],
[`12-16`, `"안녕하세요, 마릴라?" 부인이 반갑게 말했다. "어서 들어와요. 이 아이가 데려다 키운다는 그 여자아이인가 보군요?"`],
[`12-17`, `"네, 앤 셜리예요." 마릴라가 말했다.`],
[`12-18`, `"끝에 e가 붙는 앤이에요." 앤이 숨을 몰아쉬며 말했다. 떨리고 들떠 있었지만, 그 중요한 점에 대해서만큼은 오해가 없도록 하겠다고 굳게 마음먹었던 것이다.`],
[`12-19`, `배리 부인은 그 말을 듣지 못했는지 알아듣지 못했는지, 그저 악수를 하며 다정하게 말했다.`],
[`12-20`, `"잘 지내니?"`],
[`12-21`, `"몸은 건강하지만 마음은 꽤 구겨져 있어요. 고맙습니다, 부인." 앤은 진지하게 대답했다. 그러고는 다 들리게 마릴라에게 속삭였다. "방금 그 말은 놀랄 만한 말 아니었죠, 아주머니?"`],
[`12-22`, `다이애나는 소파에 앉아 책을 읽고 있다가 손님들이 들어오자 책을 내려놓았다. 무척 예쁜 아이였다. 어머니를 닮은 까만 눈과 까만 머리카락, 장밋빛 뺨, 그리고 아버지에게서 물려받은 명랑한 표정을 지니고 있었다.`],
[`12-23`, `"우리 딸 다이애나예요." 배리 부인이 말했다. "다이애나, 앤을 데리고 정원에 나가서 네 꽃들을 보여 주렴. 그 책에 눈을 혹사하는 것보다 그게 낫겠다. 이 애는 책을 너무 많이 읽어요." 이 말은 아이들이 나간 뒤 마릴라에게 한 말이었다. "말릴 수가 없어요. 애 아빠가 거들고 부추기니까요. 늘 책에만 코를 박고 있어요. 같이 놀 친구가 생길 것 같아 기뻐요. 그러면 밖에서 노는 시간이 좀 늘겠지요."`],
[`12-24`, `서쪽의 오래된 전나무 사이로 부드러운 노을빛이 흘러드는 정원에, 앤과 다이애나가 서 있었다. 둘은 화려한 참나리 덤불을 사이에 두고 수줍게 서로를 바라보았다.`],
[`12-25`, `배리 씨네 정원은 꽃들이 우거진 그늘진 숲 같아서, 운명이 이렇게 무겁게 걸린 순간만 아니었다면 언제라도 앤의 마음을 기쁘게 했을 것이다. 정원은 커다란 늙은 버드나무와 키 큰 전나무들로 둘러싸여 있었고, 그 아래에서는 그늘을 좋아하는 꽃들이 무성하게 자랐다. 조개껍데기로 가장자리를 단정하게 두른 반듯한 오솔길들이 촉촉한 붉은 리본처럼 정원을 가로질렀고, 그 사이 꽃밭마다 옛날 꽃들이 마음껏 피어 있었다. 장밋빛 금낭화와 크고 화려한 진홍색 작약, 향기로운 하얀 수선화와 가시 돋친 향긋한 스코틀랜드 장미, 분홍과 파랑과 하양의 매발톱꽃과 연보랏빛 비누풀, 개사철쑥과 줄무늬 갈대와 박하 덤불, 보랏빛 난초와 수선화, 그리고 깃털처럼 여린 하얀 꽃송이로 덮인 향기로운 전동싸리가 가득했다. 불꽃 같은 창을 내던지는 주홍 동자꽃이 새하얀 사향꽃 위로 솟아 있었다. 햇빛이 머물다 가고 벌들이 윙윙대며, 바람마저 홀려서 어슬렁거리며 가르랑거리고 바스락대는 그런 정원이었다.`],
[`12-26`, `"아, 다이애나." 마침내 앤이 두 손을 꼭 맞잡고 거의 속삭이듯 말했다. "너, 혹시… 아, 나를 조금이라도 좋아할 수 있을 것 같니? 마음의 친구가 될 만큼?"`],
[`12-27`, `다이애나가 웃었다. 다이애나는 언제나 말하기 전에 먼저 웃었다.`],
[`12-28`, `"그럼, 그럴 것 같아." 다이애나가 솔직하게 말했다. "네가 초록 지붕 집에 와서 살게 돼서 정말 기뻐. 같이 놀 사람이 생기면 신날 거야. 근처에 같이 놀 만한 여자애가 아무도 없고, 나는 같이 놀 만큼 큰 여동생도 없거든."`],
[`12-29`, `"영원히 내 친구가 되겠다고 맹세할래?" 앤이 간절하게 물었다.`],
[`12-30`, `다이애나는 깜짝 놀란 얼굴이 되었다.`],
[`12-31`, `"어머, 맹세하는 건 아주 나쁜 짓이잖아." 다이애나가 나무라듯 말했다.`],
[`12-32`, `"아니, 그런 맹세 말고. 맹세에는 두 가지가 있거든."`],
[`12-33`, `"나는 한 가지밖에 못 들어 봤는데." 다이애나가 미심쩍은 듯 말했다.`],
[`12-34`, `"정말로 다른 게 있어. 아, 전혀 나쁜 게 아니야. 그냥 엄숙하게 서약하고 약속한다는 뜻이야."`],
[`12-35`, `"그런 거라면 해도 괜찮아." 다이애나가 안심하며 동의했다. "어떻게 하는 건데?"`],
[`12-36`, `"손을 잡아야 해. 이렇게." 앤이 진지하게 말했다. "원래는 흐르는 물 위에서 해야 하지만, 이 길이 흐르는 물이라고 상상하자. 내가 먼저 맹세할게. 나는 해와 달이 있는 한, 내 마음의 친구 다이애나 배리에게 변함없이 충실할 것을 엄숙히 맹세합니다. 이제 네가 해. 내 이름을 넣어서."`],
[`12-37`, `다이애나는 그 '맹세'를 하면서 앞뒤로 웃음을 터뜨렸다. 그러고는 말했다.`],
[`12-38`, `"넌 참 별난 애구나, 앤. 별나다는 말은 전에도 들었어. 그래도 나 너를 정말 많이 좋아하게 될 것 같아."`],
[`12-39`, `마릴라와 앤이 집으로 돌아갈 때, 다이애나는 통나무 다리까지 따라 나왔다. 두 아이는 서로 팔로 허리를 감싸 안고 걸었다. 시냇가에 이르러, 둘은 내일 오후를 함께 보내자는 약속을 몇 번이고 주고받으며 헤어졌다.`],
[`12-40`, `"그래, 다이애나가 마음이 통하는 친구 같더냐?" 초록 지붕 집 정원을 지나 올라가며 마릴라가 물었다.`],
[`12-41`, `"아, 네." 앤은 한숨을 쉬듯 말했다. 마릴라의 말에 비꼬는 기색이 섞여 있다는 것은 조금도 눈치채지 못한 채 행복에 젖어 있었다. "아, 마릴라 아주머니, 저는 지금 이 순간 프린스 에드워드 섬에서 제일 행복한 아이예요. 오늘 밤엔 정말 기쁜 마음으로 기도할 거예요. 다이애나랑 저는 내일 윌리엄 벨 아저씨네 자작나무 숲에 소꿉놀이 집을 지을 거예요. 장작 헛간에 있는 깨진 그릇 조각들 가져가도 돼요? 다이애나 생일은 2월이고 제 생일은 3월이에요. 정말 신기한 우연 같지 않아요? 다이애나가 책도 빌려준대요. 정말 멋지고 엄청나게 흥미진진한 책이래요. 숲속 깊은 곳에 쌀백합이 피는 곳도 보여 준대요. 다이애나 눈이 참 그윽하다고 생각하지 않으세요? 저도 그윽한 눈을 가졌으면 좋겠어요. 다이애나가 '개암나무 골짜기의 넬리'라는 노래도 가르쳐 준대요. 제 방에 걸 그림도 준대요. 정말 아름다운 그림이래요. 연한 파란 비단 드레스를 입은 고운 아가씨 그림인데, 재봉틀 판매원이 줬대요. 저도 다이애나한테 뭔가 줄 게 있으면 좋겠어요. 저는 다이애나보다 1인치 더 크지만, 다이애나는 저보다 훨씬 통통해요. 다이애나는 날씬한 게 훨씬 우아하니까 자기도 날씬하고 싶다고 했지만, 아마 제 기분을 달래 주려고 한 말 같아요. 언젠가 바닷가에 조개껍데기도 주우러 갈 거예요. 통나무 다리 아래에 있는 샘은 '드라이어드의 샘'이라고 부르기로 했어요. 정말 우아한 이름이지 않아요? 예전에 그런 이름의 샘이 나오는 이야기를 읽은 적이 있어요. 드라이어드는 다 자란 요정 같은 거래요."`],
[`12-42`, `"글쎄, 네가 다이애나를 말로 질리게 하지만 않으면 좋겠구나." 마릴라가 말했다. "하지만 앤, 이런저런 계획을 세울 때 이건 꼭 기억해라. 너는 놀기만 하는 게 아니다. 노는 시간이 대부분이어서도 안 되고. 네가 할 일이 있으니 그것부터 해야 한다."`],
[`12-43`, `앤의 행복의 잔은 가득 차 있었는데, 매슈가 그 잔을 넘치게 만들었다. 카모디의 가게에 다녀온 매슈가 주머니에서 작은 꾸러미를 쑥스러운 듯 꺼내 앤에게 건넸다. 마릴라 눈치를 살피는 표정이었다.`],
[`12-44`, `"네가 초콜릿 사탕을 좋아한다고 하길래 좀 사 왔다." 매슈가 말했다.`],
[`12-45`, `"흥." 마릴라가 코웃음을 쳤다. "이가 썩고 배탈이 날 거다. 아이고, 얘야, 그렇게 시무룩한 얼굴 하지 마라. 매슈가 사 왔으니 먹어도 된다. 차라리 박하사탕을 사 오지 그랬어요. 그게 몸에 더 좋은데. 한꺼번에 다 먹고 탈 나지나 마라."`],
[`12-46`, `"아, 그럼요, 안 그럴게요." 앤이 신이 나서 말했다. "오늘 밤엔 딱 한 개만 먹을게요. 그리고 다이애나한테 반 나눠 줘도 되죠? 나머지 반은 다이애나한테 나눠 주면 저한테 두 배로 달콤할 거예요. 다이애나한테 줄 게 생겼다고 생각하니 정말 기뻐요."`],
[`12-47`, `"이건 인정해야겠어요." 앤이 다락방으로 올라가자 마릴라가 말했다. "저 애는 인색하지 않아요. 다행이에요. 아이의 잘못 중에 나는 인색한 게 제일 싫거든요. 세상에, 저 애가 온 지 겨우 3주밖에 안 됐는데, 꼭 원래부터 여기 있었던 것 같아요. 저 애가 없는 이 집은 상상도 안 돼요. 자, 매슈, '그것 봐라' 하는 얼굴은 하지 말아요. 여자가 그래도 꼴 보기 싫은데, 남자가 그러는 건 도저히 못 참아요. 저 애를 맡기로 한 게 기쁘다는 것도, 저 애가 점점 좋아진다는 것도 기꺼이 인정할게요. 하지만 그걸로 놀리지는 말아요, 매슈 커스버트."`],
  ]
};

/* 원문 책장: 원작 15장 — 이 앱을 위해 새로 우리말로 옮김 */
BOOK.ch4 = {
  title: `학교 찻잔 속의 폭풍`,
  orig: `원작 15장`,
  paras: [
[`15-1`, `"정말 근사한 날이야!" 앤이 숨을 길게 들이쉬며 말했다. "이런 날 그냥 살아 있기만 해도 좋지 않니? 아직 태어나지 않은 사람들이 이날을 놓치는 게 불쌍할 정도야. 물론 그 사람들에게도 좋은 날이 오겠지만, 바로 오늘은 절대 가질 수 없잖아. 게다가 이렇게 예쁜 길로 학교에 가니까 더 근사하지 않니?"`],
[`15-2`, `"큰길로 빙 돌아가는 것보다 훨씬 낫지. 거긴 먼지투성이에 덥거든." 다이애나가 현실적으로 말했다. 다이애나는 점심 바구니를 슬쩍 들여다보며, 그 안에 든 즙 많고 맛있는 산딸기 파이 세 개를 여자애 열 명이 나누면 한 사람당 몇 입씩 돌아갈지 속으로 셈하고 있었다.`],
[`15-3`, `에이번리 학교 여자애들은 늘 점심을 한데 모아 나눠 먹었다. 산딸기 파이 세 개를 혼자 먹거나, 단짝 하고만 나눠 먹기라도 했다가는 그 애는 영원히 '지독한 구두쇠'라는 낙인이 찍혔다. 그런데 파이 세 개를 열 명이 나누면, 감질날 만큼만 입에 들어올 뿐이었다.`],
[`15-4`, `앤과 다이애나가 학교에 가는 길은 무척 아름다웠다. 앤은 다이애나와 함께 학교를 오가는 그 길은 상상력으로도 더 낫게 만들 수 없다고 생각했다. 큰길로 돌아가는 건 너무나 낭만이 없었을 것이다. 하지만 연인의 오솔길과 버드나무 연못, 제비꽃 골짜기와 자작나무 길을 지나가는 것만큼 낭만적인 일은 세상에 다시없었다.`],
[`15-5`, `연인의 오솔길은 초록 지붕 집 과수원 아래에서 시작해 커스버트 농장 끝의 숲속까지 멀리 이어져 있었다. 소들을 뒤쪽 목초지로 몰고 가거나 겨울에 땔나무를 실어 나르던 길이었다. 앤은 초록 지붕 집에 온 지 한 달도 되기 전에 그 길에 '연인의 오솔길'이라는 이름을 붙였다.`],
[`15-6`, `"진짜 연인들이 거길 걷는 건 아니에요." 앤이 마릴라에게 설명했다. "그런데 다이애나랑 제가 정말 멋진 책을 읽고 있는데, 거기 '연인의 오솔길'이 나오거든요. 그래서 저희도 하나 갖고 싶었어요. 정말 예쁜 이름이지 않아요? 아주 낭만적이에요! 연인들은 상상으로 그 길에 데려다 놓으면 돼요. 저는 그 길이 좋아요. 거기선 생각을 소리 내어 말해도 아무도 저를 미쳤다고 하지 않거든요."`],
[`15-7`, `아침에 혼자 집을 나선 앤은 연인의 오솔길을 따라 시냇가까지 내려갔다. 거기서 다이애나를 만나, 두 아이는 단풍나무 잎이 아치를 이룬 오솔길을 따라 올라갔다. "단풍나무는 정말 사교적인 나무야." 앤이 말했다. "늘 바스락거리면서 우리한테 속삭이잖아." 그렇게 소박한 다리에 이르면 오솔길을 벗어나 배리 씨네 뒷밭을 지나 버드나무 연못을 지나갔다. 버드나무 연못 너머에는 제비꽃 골짜기가 있었다. 앤드루 벨 씨네 큰 숲 그늘에 폭 파인 작은 초록 보조개 같은 곳이었다. "물론 지금은 거기 제비꽃이 하나도 없어요." 앤이 마릴라에게 말했다. "그런데 다이애나 말이 봄이 되면 수백만 송이가 핀대요. 아, 아주머니, 그 꽃들이 눈앞에 보이는 것 같지 않으세요? 저는 정말 숨이 막혀요. 제가 거기를 제비꽃 골짜기라고 이름 지었어요. 다이애나가 그러는데 장소에 멋진 이름 붙이는 데는 저를 따라올 사람이 없대요. 무언가를 잘한다는 건 기분 좋은 일이죠? 하지만 자작나무 길은 다이애나가 이름 지었어요. 다이애나가 짓고 싶어 해서 그러라고 했어요. 그래도 저라면 그냥 '자작나무 길'보다는 훨씬 시적인 이름을 찾아냈을 거예요. 그런 이름은 아무나 생각해 낼 수 있잖아요. 하지만 자작나무 길은 세상에서 제일 아름다운 곳 중 하나예요, 아주머니."`],
[`15-8`, `정말 그랬다. 우연히 그 길에 들어선 다른 사람들도 앤과 똑같이 생각했다. 그것은 벨 씨네 숲을 곧장 가로질러 긴 언덕을 굽이굽이 내려가는 좁고 꼬불꼬불한 작은 길이었다. 햇빛은 겹겹의 에메랄드 빛 가리개를 지나 걸러져 내려와, 다이아몬드의 한가운데처럼 티 없이 맑았다. 길 양옆에는 하얀 줄기에 가지가 낭창낭창한 어린 자작나무들이 끝까지 늘어서 있었다. 고사리와 별꽃, 야생 은방울꽃, 새빨간 비둘기열매가 길가에 빽빽이 자랐다. 공기에는 늘 기분 좋은 향긋함이 감돌았고, 새들의 노랫소리와 머리 위 나뭇가지 사이로 숲의 바람이 소곤대고 웃는 소리가 들려왔다. 조용히만 있으면 이따금 토끼가 길을 깡충 가로지르는 것도 볼 수 있었다. 물론 앤과 다이애나가 조용히 있는 일은 가뭄에 콩 나듯 드물었지만. 골짜기 아래에서 길은 큰길과 만났고, 거기서 가문비나무 언덕만 올라가면 학교였다.`],
[`15-9`, `에이번리 학교는 하얗게 회칠을 한 건물로, 처마는 낮고 창은 넓었다. 안에는 여닫을 수 있는 튼튼하고 편안한 옛날식 책상들이 놓여 있었는데, 뚜껑마다 3대에 걸친 학생들이 새긴 이름 머리글자와 알 수 없는 그림 문자들이 빼곡했다. 학교는 길에서 조금 물러나 있었고, 뒤쪽에는 어둑한 전나무 숲과 시냇물이 있었다. 아이들은 아침마다 그 시냇물에 우유병을 담가 두어 점심때까지 시원하고 신선하게 보관했다.`],
[`15-10`, `9월 1일, 학교에 가는 앤을 배웅하면서 마릴라는 속으로 걱정이 많았다. 앤은 워낙 별난 아이였다. 다른 아이들과 잘 지낼 수 있을까? 그리고 대체 수업 시간 동안 어떻게 입을 다물고 있을까?`],
[`15-11`, `하지만 일은 마릴라가 걱정한 것보다 잘 풀렸다. 그날 저녁 앤은 신이 나서 집에 돌아왔다.`],
[`15-12`, `"여기 학교가 좋아질 것 같아요." 앤이 선언했다. "선생님은 별로지만요. 선생님은 계속 콧수염을 배배 꼬면서 프리시 앤드루스한테 눈짓만 해요. 프리시는 다 큰 언니예요. 열여섯 살인데, 내년에 샬럿타운에 있는 퀸스 아카데미 입학시험을 보려고 공부하고 있어요. 틸리 볼터 말로는 선생님이 프리시한테 홀딱 반했대요. 프리시는 피부가 정말 곱고 갈색 곱슬머리를 아주 우아하게 올려 묶어요. 프리시는 뒤쪽 긴 의자에 앉는데, 선생님도 대부분 거기 앉아 있어요. 공부를 설명해 주려고 그런다나요. 그런데 루비 길리스가 그러는데, 선생님이 프리시 석판에 뭔가를 쓰는 걸 봤대요. 프리시가 그걸 읽더니 홍당무처럼 빨개져서 킥킥거렸대요. 루비 길리스는 그게 공부랑은 아무 상관 없는 내용이었을 거래요."`],
[`15-13`, `"앤 셜리, 다시는 선생님을 두고 그런 식으로 말하는 걸 내가 듣지 않게 해라." 마릴라가 날카롭게 말했다. "학교는 선생님 흉을 보러 가는 데가 아니다. 선생님은 너한테 가르칠 게 있을 거고, 너는 그걸 배우면 되는 거야. 그리고 처음부터 분명히 해 두자. 선생님 이야기를 집에 와서 고자질하듯 늘어놓지 마라. 그런 건 절대 용납 못 한다. 얌전히 굴었기를 바란다."`],
[`15-14`, `"그럼요." 앤이 태평하게 말했다. "생각하시는 것만큼 어렵지도 않았어요. 저는 다이애나랑 같이 앉아요. 우리 자리는 창가라서 반짝이는 호수가 내려다보여요. 학교엔 착한 여자애들이 많고, 점심시간엔 정말 신나게 놀았어요. 같이 놀 여자애들이 많다는 건 참 좋아요. 하지만 물론 저는 다이애나가 제일 좋고 앞으로도 그럴 거예요. 다이애나를 정말 사랑해요. 저는 다른 애들보다 공부가 한참 뒤처져 있어요. 다른 애들은 다 5권을 배우는데 저는 4권이에요. 좀 창피한 것 같아요. 하지만 저만큼 상상력이 풍부한 애는 하나도 없어요. 그건 금방 알았어요. 오늘은 읽기랑 지리, 캐나다 역사, 받아쓰기를 했어요. 필립스 선생님이 제 철자가 엉망이라면서, 빨간 표시가 잔뜩 된 제 석판을 모두가 보도록 높이 들어 보이셨어요. 정말 굴욕적이었어요, 아주머니. 처음 온 아이한테는 좀 더 예의를 갖추실 수도 있었을 텐데요. 루비 길리스는 사과를 하나 줬고, 소피아 슬론은 '집까지 바래다줘도 될까요?'라고 쓰인 예쁜 분홍 카드를 빌려줬어요. 내일 돌려주기로 했어요. 그리고 틸리 볼터는 오후 내내 구슬 반지를 끼고 있게 해 줬어요. 다락방에 있는 낡은 바늘꽂이에서 진주 구슬 몇 개 떼어다가 반지 만들어도 돼요? 그리고 아, 아주머니, 제인 앤드루스가 그러는데, 미니 맥퍼슨이 프리시 앤드루스가 세라 길리스한테 제 코가 아주 예쁘다고 말하는 걸 들었대요. 아주머니, 그건 제가 태어나서 처음 들어 본 칭찬이에요. 얼마나 이상한 기분이 들었는지 상상도 못 하실 거예요. 아주머니, 제 코가 정말 예뻐요? 아주머니는 솔직하게 말씀해 주실 거잖아요."`],
[`15-15`, `"코는 그만하면 됐다." 마릴라가 짧게 대답했다. 속으로는 앤의 코가 유난히 예쁘다고 생각했지만, 그 말을 해 줄 생각은 조금도 없었다.`],
[`15-16`, `그게 3주 전 일이었고, 지금까지는 모든 게 순조로웠다. 그리고 지금, 상쾌한 9월 아침, 앤과 다이애나는 에이번리에서 가장 행복한 두 소녀가 되어 자작나무 길을 사뿐사뿐 내려가고 있었다.`],
[`15-17`, `"오늘 길버트 블라이스가 학교에 올 것 같아." 다이애나가 말했다. "여름 내내 뉴브런즈윅에 있는 사촌들 집에 가 있다가 토요일 밤에야 돌아왔거든. 걘 엄청 잘생겼어, 앤. 그리고 여자애들을 지독하게 놀려. 우리를 아주 못살게 군다니까."`],
[`15-18`, `다이애나의 목소리로 보아, 다이애나는 그렇게 시달리는 게 오히려 싫지 않은 눈치였다.`],
[`15-19`, `"길버트 블라이스?" 앤이 말했다. "현관 벽에 줄리아 벨 이름이랑 같이 쓰여 있고, 그 위에 큼직하게 '주목하시오'라고 적힌 그 이름 아니야?"`],
[`15-20`, `"맞아." 다이애나가 고개를 홱 쳐들며 말했다. "그래도 길버트가 줄리아 벨을 그렇게 좋아하는 것 같지는 않아. 줄리아 벨 주근깨로 구구단을 외웠다고 말하는 걸 들었거든."`],
[`15-21`, `"아, 나한테 주근깨 이야기는 하지 마." 앤이 애원했다. "주근깨가 이렇게 많은 사람 앞에서 그건 예의가 아니야. 그런데 남자애랑 여자애 이름을 벽에 '주목하시오'라고 써 붙이는 건 정말 제일 바보 같은 짓이라고 생각해. 누가 감히 내 이름을 남자애 이름이랑 같이 써 붙이는지 보고 싶다니까. 물론," 앤은 서둘러 덧붙였다. "그럴 사람도 없겠지만."`],
[`15-22`, `앤은 한숨을 쉬었다. 자기 이름이 벽에 쓰이는 건 싫었다. 하지만 그럴 위험이 전혀 없다는 걸 아는 건 조금 자존심이 상했다.`],
[`15-23`, `"말도 안 돼." 다이애나가 말했다. 다이애나는 까만 눈과 윤기 나는 머리채로 에이번리 남학생들의 마음을 어찌나 흔들어 놓았는지, 현관 벽에 붙은 '주목하시오' 여섯 개에 다이애나의 이름이 올라 있었다. "그냥 장난으로 쓰는 거야. 그리고 네 이름이 절대 안 쓰일 거라고 너무 장담하지 마. 찰리 슬론이 너한테 홀딱 반했거든. 찰리가 자기 엄마한테, 글쎄 자기 엄마한테 말이야, 네가 학교에서 제일 똑똑한 애라고 했대. 그건 예쁜 것보다 더 좋은 거야."`],
[`15-24`, `"아니, 그렇지 않아." 뼛속까지 여자아이인 앤이 말했다. "나는 똑똑한 것보다 예쁜 게 더 좋아. 그리고 나는 찰리 슬론이 싫어. 눈이 툭 튀어나온 남자애는 질색이야. 누가 내 이름을 찰리 이름이랑 같이 써 붙이면 나는 평생 못 잊을 거야, 다이애나 배리. 하지만 반에서 1등을 지키는 건 기분 좋아."`],
[`15-25`, `"이제부터는 길버트가 너희 반에 들어올 거야." 다이애나가 말했다. "분명히 말하는데, 길버트는 늘 반에서 1등을 해 왔어. 열네 살이 다 됐는데 아직 4권밖에 안 배워. 4년 전에 길버트 아버지가 아프셔서 건강 때문에 앨버타로 가셔야 했는데, 길버트도 따라갔거든. 거기서 3년을 지내는 동안 길버트는 학교를 거의 못 다녔어. 이제부터는 1등 지키기가 그렇게 쉽지 않을걸, 앤."`],
[`15-26`, `"잘됐다." 앤이 얼른 말했다. "고작 아홉 살, 열 살짜리 꼬마들 사이에서 1등 하는 건 별로 자랑스럽지가 않았거든. 어제 '비등'이라는 낱말 철자를 맞혀서 내가 1등 자리로 올라갔어. 조시 파이가 1등이었는데, 글쎄 책을 몰래 훔쳐봤지 뭐야. 필립스 선생님은 못 보셨어. 프리시 앤드루스만 보고 계셨으니까. 하지만 나는 봤어. 그래서 얼음장 같은 경멸의 눈길을 한 번 휙 보내 줬더니, 조시가 홍당무처럼 빨개져서는 결국 철자를 틀리더라."`],
[`15-27`, `"파이네 여자애들은 하나같이 다 반칙쟁이야." 큰길 울타리를 넘으며 다이애나가 분개해서 말했다. "어제 거티 파이가 글쎄 시냇물에 있는 내 자리에 자기 우유병을 갖다 놨다니까. 그런 거 본 적 있어? 이제 거티랑 말 안 해."`],
[`15-28`, `필립스 선생님이 교실 뒤쪽에서 프리시 앤드루스의 라틴어를 봐 주고 있을 때, 다이애나가 앤에게 속삭였다.`],
[`15-29`, `"저기 통로 건너편에 바로 너랑 나란히 앉은 애가 길버트 블라이스야, 앤. 한번 봐 봐. 잘생기지 않았는지."`],
[`15-30`, `앤은 그 말대로 쳐다보았다. 마침 잘 볼 수 있는 기회였다. 길버트 블라이스는 앞자리에 앉은 루비 길리스의 기다란 노란 머리채를 의자 등받이에 몰래 핀으로 꽂아 두느라 정신이 팔려 있었다. 키가 크고, 갈색 곱슬머리에, 장난기 어린 담갈색 눈, 그리고 놀리는 듯한 미소로 입꼬리가 비뚜름하게 올라간 소년이었다. 곧 루비 길리스가 선생님께 산수 답을 보여 드리려고 일어서다가, 머리카락이 뿌리째 뽑힌 줄 알고 작은 비명을 지르며 의자로 도로 넘어졌다. 모두가 루비를 쳐다보았고, 필립스 선생님이 어찌나 무섭게 노려보았는지 루비는 울음을 터뜨렸다. 길버트는 핀을 잽싸게 감추고 세상에서 제일 진지한 얼굴로 역사책을 공부하고 있었다. 그러다 소동이 가라앉자 앤을 바라보며 말할 수 없이 익살맞게 윙크를 했다.`],
[`15-31`, `"너희 길버트 블라이스, 잘생기긴 했네." 앤이 다이애나에게 털어놓았다. "그런데 아주 뻔뻔한 것 같아. 처음 보는 여자애한테 윙크하는 건 예의가 아니야."`],
[`15-32`, `하지만 정말 일이 벌어지기 시작한 것은 오후가 되어서였다.`],
[`15-33`, `필립스 선생님은 구석에서 프리시 앤드루스에게 대수 문제를 설명하고 있었고, 나머지 학생들은 거의 제멋대로였다. 풋사과를 먹거나, 소곤거리거나, 석판에 그림을 그리거나, 실로 맨 귀뚜라미를 통로에서 이리저리 몰고 다녔다. 길버트 블라이스는 앤 셜리가 자기를 쳐다보게 하려고 애를 쓰고 있었지만 완전히 허탕이었다. 그 순간 앤은 길버트 블라이스가 이 세상에 있다는 것은 물론, 에이번리 학교의 다른 모든 학생과 에이번리 학교 자체도 까맣게 잊고 있었기 때문이다. 앤은 두 손으로 턱을 괴고, 서쪽 창 너머로 파랗게 언뜻 보이는 반짝이는 호수에 눈을 고정한 채, 화려한 꿈나라 저 멀리에서 자기만의 멋진 환상 말고는 아무것도 보지도 듣지도 않고 있었다.`],
[`15-34`, `길버트 블라이스는 여자애가 자기를 보게 하려고 애쓰다가 실패하는 일에 익숙하지 않았다. 저 애는 나를 봐야 해. 뾰족한 작은 턱에, 에이번리 학교의 어떤 여자애와도 다른 커다란 눈을 가진 저 빨간 머리 셜리라는 애 말이야.`],
[`15-35`, `길버트는 통로 너머로 손을 뻗어 앤의 기다란 빨간 머리채 끝을 집어 들더니, 팔을 쭉 뻗어 들어 올리고는 날카롭게 속삭였다.`],
[`15-36`, `"홍당무! 홍당무!"`],
[`15-37`, `그러자 앤이 길버트를 쳐다보았다. 그것도 아주 매섭게!`],
[`15-38`, `앤은 쳐다보는 것으로 끝나지 않았다. 벌떡 일어선 것이다. 찬란하던 공상은 산산이 부서져 다시는 되살릴 수 없게 되었다. 앤은 성난 눈빛을 길버트에게 번쩍 쏘아 보냈다. 그 눈에서 불꽃처럼 튀던 분노는 곧 그만큼 분한 눈물에 꺼져 버렸다.`],
[`15-39`, `"이 비열하고 못된 녀석!" 앤이 격렬하게 외쳤다. "네가 감히!"`],
[`15-40`, `그리고 그때, 퍽! 앤이 석판으로 길버트의 머리를 내리쳤고, 석판은, 머리 말고 석판은, 가운데가 쩍 갈라지고 말았다.`],
[`15-41`, `에이번리 학교는 언제나 구경거리를 즐겼다. 이건 특히나 즐거운 구경거리였다. 모두가 겁에 질리면서도 신이 나서 "어머!" 하고 소리쳤다. 다이애나는 숨을 헉 들이켰다. 쉽게 흥분하는 루비 길리스는 울음을 터뜨렸다. 토미 슬론은 입을 떡 벌리고 그 광경을 쳐다보느라 귀뚜라미 마차를 몽땅 놓쳐 버렸다.`],
[`15-42`, `필립스 선생님이 성큼성큼 통로를 걸어와 앤의 어깨에 묵직하게 손을 얹었다.`],
[`15-43`, `"앤 셜리, 이게 무슨 짓이냐?" 선생님이 화난 목소리로 말했다.`],
[`15-44`, `앤은 아무 대답도 하지 않았다. 온 학교 앞에서 자기가 '홍당무'라고 불렸다고 말하라는 건 사람으로서 너무 가혹한 일이었다. 대신 당당하게 나선 것은 길버트였다.`],
[`15-45`, `"제 잘못이에요, 필립스 선생님. 제가 놀렸어요."`],
[`15-46`, `필립스 선생님은 길버트의 말에 아무 관심도 기울이지 않았다.`],
[`15-47`, `"내 학생이 이런 성질머리와 이런 앙심을 드러내다니 유감이구나." 선생님은 엄숙한 말투로 말했다. 마치 자기 학생이라는 사실만으로도 작고 불완전한 인간들의 마음에서 온갖 나쁜 감정이 뿌리째 뽑혀야 마땅하다는 듯이. "앤, 오늘 오후 내내 칠판 앞 교단에 나가 서 있어라."`],
[`15-48`, `앤은 차라리 매를 맞는 편이 백배 나았을 것이다. 이 벌을 받는 동안 앤의 예민한 마음은 채찍을 맞은 것처럼 떨렸다. 앤은 하얗게 질려 굳은 얼굴로 시키는 대로 했다. 필립스 선생님은 분필을 집어 들고 앤의 머리 위 칠판에 이렇게 썼다.`],
[`15-49`, `"앤 셜리(Ann Shirley)는 성질이 아주 나쁘다. 앤 셜리는 성질을 다스리는 법을 배워야 한다." 그리고 글씨를 못 읽는 1학년 꼬마들까지 알아듣도록 그것을 소리 내어 읽었다.`],
[`15-50`, `앤은 그 글귀를 머리 위에 인 채 오후 내내 서 있었다. 울지도 고개를 숙이지도 않았다. 그러기엔 마음속 분노가 아직 너무 뜨거웠고, 그 분노가 끔찍한 굴욕 속에서 앤을 버티게 해 주었다. 앤은 원망 어린 눈과 분노로 새빨개진 뺨으로, 다이애나의 안쓰러워하는 눈길도, 찰리 슬론의 분개한 끄덕임도, 조시 파이의 심술궂은 미소도 똑같이 마주했다. 길버트 블라이스는 쳐다보지도 않았다. 다시는 그 애를 쳐다보지 않을 거야! 다시는 그 애랑 말도 하지 않을 거야!!`],
[`15-51`, `수업이 끝나자 앤은 빨간 머리를 꼿꼿이 쳐들고 걸어 나갔다. 길버트 블라이스가 현관문에서 앤을 가로막으려 했다.`],
[`15-52`, `"네 머리를 놀려서 정말 미안해, 앤." 길버트가 뉘우치며 속삭였다. "진심이야. 이제 그만 화 풀어, 응?"`],
[`15-53`, `앤은 쳐다보지도, 들은 척도 하지 않고 쌀쌀맞게 지나쳐 버렸다. "아, 어떻게 그럴 수가 있어, 앤?" 길을 내려가며 다이애나가 반쯤은 나무라듯, 반쯤은 감탄하듯 숨죽여 말했다. 다이애나는 자기라면 길버트의 부탁을 절대 뿌리치지 못했을 거라고 생각했다.`],
[`15-54`, `"나는 길버트 블라이스를 절대 용서하지 않을 거야." 앤이 단호하게 말했다. "게다가 필립스 선생님은 내 이름을 e도 없이 썼어. 쇠붙이가 내 영혼에 박혔어, 다이애나."`],
[`15-55`, `다이애나는 앤이 무슨 말을 하는지 전혀 몰랐지만, 뭔가 끔찍한 일이라는 것만은 알아들었다.`],
[`15-56`, `"길버트가 네 머리를 놀린 건 신경 쓰지 마." 다이애나가 달래듯 말했다. "걘 모든 여자애를 다 놀려. 내 머리가 너무 까맣다고 나도 놀려. 나를 까마귀라고 부른 게 열두 번은 될 거야. 그리고 길버트가 무슨 일로든 사과하는 건 나도 처음 들어 봤어."`],
[`15-57`, `"까마귀라고 불리는 것과 홍당무라고 불리는 건 하늘과 땅 차이야." 앤이 위엄 있게 말했다. "길버트 블라이스는 내 마음에 견딜 수 없는 상처를 줬어, 다이애나."`],
[`15-58`, `다른 일이 일어나지 않았다면 이 일은 더 큰 상처 없이 그냥 지나갔을지도 모른다. 하지만 일이란 한번 벌어지기 시작하면 줄줄이 이어지기 마련이다.`],
[`15-59`, `에이번리 학생들은 점심시간이면 언덕 너머 벨 씨네 넓은 목초지를 가로질러 그 가문비나무 숲에 가서 송진 껌을 따곤 했다. 거기서는 선생님이 하숙하는 에번 라이트 씨네 집이 잘 보였다. 필립스 선생님이 그 집에서 나오는 게 보이면 아이들은 학교로 달려갔다. 하지만 거리가 라이트 씨네 길보다 세 배는 멀어서, 아이들은 대개 숨을 헐떡이며 3분쯤 늦게 도착하곤 했다.`],
[`15-60`, `다음 날 필립스 선생님은 가끔 발작처럼 찾아오는 '개혁의 열정'에 사로잡혀, 점심을 먹으러 집에 가기 전에 이렇게 선언했다. 자기가 돌아왔을 때 모든 학생이 자리에 앉아 있어야 하며, 늦게 들어오는 사람은 벌을 받을 거라고.`],
[`15-61`, `남자애들은 전부, 그리고 여자애들 몇몇은 여느 때처럼 벨 씨네 가문비나무 숲으로 갔다. 다들 '씹을 것 한 조각'만 따고 금방 돌아올 생각이었다. 하지만 가문비나무 숲은 사람을 홀리고, 노란 송진 덩어리는 사람을 꾀는 법이다. 아이들은 송진을 따고, 꾸물거리고, 이리저리 헤매었다. 그리고 여느 때처럼 시간이 흘렀다는 걸 처음 일깨워 준 것은, 늙은 가문비나무 꼭대기에서 지미 글로버가 외친 소리였다. "선생님 온다!"`],
[`15-62`, `땅에 있던 여자애들이 먼저 출발해서, 간신히, 정말 1초도 남기지 않고 제시간에 학교에 닿았다. 허둥지둥 나무에서 기어 내려와야 했던 남자애들은 그보다 늦었다. 그리고 송진은 따지도 않고 숲 저편 끝에서 허리까지 오는 고사리 사이를 행복하게 거닐며 혼자 조용히 노래를 부르고 있던 앤이 가장 늦었다. 앤은 머리에 쌀백합 화관을 쓰고 있어서, 마치 그늘진 곳에 사는 숲의 여신 같았다. 하지만 앤은 사슴처럼 빨리 달릴 수 있었다. 앤은 정말로 달렸고, 그 결과 짓궂게도 문 앞에서 남자애들을 따라잡아, 필립스 선생님이 막 모자를 걸고 있을 때 남자애들 틈에 휩쓸려 교실로 들어가게 되었다.`],
[`15-63`, `필립스 선생님의 짧은 개혁 의지는 이미 끝나 있었다. 학생 열두 명을 벌주는 수고는 하고 싶지 않았다. 하지만 자기가 한 말을 지키려면 뭔가는 해야 했기에, 선생님은 희생양을 찾아 두리번거리다가 앤을 찾아냈다. 앤은 숨을 헐떡이며 자리에 털썩 주저앉아 있었는데, 깜빡 잊은 백합 화관이 한쪽 귀 위로 비뚜름하게 걸려 있어서 유난히 제멋대로이고 흐트러진 모습이었다.`],
[`15-64`, `"앤 셜리, 남자애들하고 어울리는 게 그렇게 좋은 모양이니, 오늘 오후엔 그 취향을 마음껏 즐기게 해 주마." 선생님이 비꼬듯 말했다. "머리에서 그 꽃 떼고, 길버트 블라이스 옆에 가서 앉아라."`],
[`15-65`, `다른 남자애들이 킥킥거렸다. 다이애나는 안쓰러움에 하얗게 질려서 앤의 머리에서 화관을 떼어 내고 앤의 손을 꼭 쥐었다. 앤은 돌로 변한 것처럼 선생님을 빤히 쳐다보았다.`],
[`15-66`, `"내 말 못 들었니, 앤?" 필립스 선생님이 엄하게 물었다.`],
[`15-67`, `"들었어요, 선생님." 앤이 천천히 말했다. "하지만 진심으로 하신 말씀인 줄은 몰랐어요."`],
[`15-68`, `"진심이고말고." 여전히 비꼬는 말투였다. 아이들 모두가, 특히 앤이 정말 싫어하는 그 말투였다. 그 말투가 앤의 아픈 데를 후벼 팠다. "당장 시키는 대로 해."`],
[`15-69`, `잠깐 동안 앤은 따르지 않을 것처럼 보였다. 하지만 어쩔 수 없다는 걸 깨닫고는 도도하게 일어나 통로를 건너가 길버트 블라이스 옆에 앉더니, 책상 위에 팔을 괴고 얼굴을 파묻었다. 얼굴이 파묻히기 직전에 그 얼굴을 언뜻 본 루비 길리스는 하굣길에 다른 아이들에게 "진짜로 그런 얼굴은 처음 봤어. 새하얀데 무시무시한 빨간 점들이 박혀 있었어"라고 말했다.`],
[`15-70`, `앤에게 그것은 세상의 끝이었다. 똑같이 잘못한 열두 명 가운데서 혼자만 콕 집어 벌을 받은 것도 억울했다. 남자애 옆에 가서 앉으라는 건 더 심했다. 그런데 그 남자애가 하필 길버트 블라이스라니, 그건 상처에 모욕을 쌓아 올리는 것이어서 도저히 견딜 수가 없었다. 앤은 견딜 수 없을 것 같았고, 견디려 애써 봐야 소용없다고 느꼈다. 온몸이 수치와 분노와 굴욕으로 부글부글 끓었다.`],
[`15-71`, `처음에는 다른 학생들이 쳐다보고, 소곤거리고, 킥킥대고, 서로 옆구리를 찔렀다. 하지만 앤은 한 번도 고개를 들지 않았고, 길버트는 온 정신을 오로지 분수 문제에만 쏟는 것처럼 문제를 풀었기 때문에, 아이들은 곧 자기 공부로 돌아갔고 앤은 잊혔다. 필립스 선생님이 역사반을 불러냈을 때 앤도 나갔어야 했다. 하지만 앤은 꼼짝도 하지 않았고, 반을 불러내기 전에 '프리실라에게'라는 시를 쓰고 있던 필립스 선생님은 아직 잘 맞지 않는 운율을 궁리하느라 앤이 없다는 것도 알아차리지 못했다. 한번은 아무도 보지 않을 때, 길버트가 책상에서 '너는 달콤해'라는 금빛 글귀가 적힌 작은 분홍 하트 사탕을 꺼내 앤의 팔꿈치 안쪽으로 슬쩍 밀어 넣었다. 그러자 앤은 일어나서 분홍 하트를 손끝으로 조심스럽게 집어 바닥에 떨어뜨리고, 구두 뒤꿈치로 짓이겨 가루로 만들어 버렸다. 그러고는 길버트에게 눈길 한 번 주지 않고 다시 원래 자세로 돌아갔다.`],
[`15-72`, `수업이 끝나자 앤은 자기 책상으로 성큼성큼 걸어가, 보란 듯이 안에 든 것을 몽땅 꺼냈다. 책과 공책, 펜과 잉크, 성경과 산수책까지 모두 꺼내 금이 간 석판 위에 가지런히 쌓았다.`],
[`15-73`, `"그걸 다 왜 집에 가져가는 거야, 앤?" 길에 나서자마자 다이애나가 물었다. 그전까지는 감히 물어볼 엄두가 나지 않았던 것이다.`],
[`15-74`, `"나 이제 학교에 안 다닐 거야." 앤이 말했다.`],
[`15-75`, `다이애나는 숨을 헉 들이켜고, 진심인지 확인하려고 앤을 빤히 쳐다보았다.`],
[`15-76`, `"마릴라 아주머니가 집에 있게 해 주실까?" 다이애나가 물었다.`],
[`15-77`, `"그러셔야 할 거야." 앤이 말했다. "다시는 그 사람한테 배우러 학교에 가지 않을 거야."`],
[`15-78`, `"아, 앤!" 다이애나는 금방이라도 울 것 같았다. "너 정말 너무해. 나는 어떡하라고? 필립스 선생님은 나를 그 끔찍한 거티 파이 옆에 앉힐 거야. 거티가 혼자 앉아 있으니까 분명 그럴 거야. 제발 돌아와, 앤."`],
[`15-79`, `"너를 위해서라면 세상에서 거의 무슨 일이든 할 수 있어, 다이애나." 앤이 슬프게 말했다. "너한테 도움이 된다면 내 팔다리가 갈가리 찢겨도 좋아. 하지만 이것만은 안 돼. 그러니까 제발 부탁하지 마. 네가 그러면 내 영혼이 갈기갈기 찢어져."`],
[`15-80`, `"놓치게 될 재미있는 일들을 생각해 봐." 다이애나가 슬퍼하며 말했다. "우리 시냇가에 세상에서 제일 예쁜 새 소꿉놀이 집을 지을 거야. 그리고 다음 주엔 공놀이를 할 건데, 너 공놀이 한 번도 안 해 봤잖아, 앤. 엄청엄청 신난다니까. 그리고 새 노래도 배울 거야. 제인 앤드루스가 지금 연습하고 있어. 그리고 앨리스 앤드루스가 다음 주에 새 '팬지' 책을 가져오면, 우리 모두 시냇가에서 한 장씩 돌아가며 소리 내어 읽을 거야. 너 소리 내어 읽는 거 정말 좋아하잖아, 앤."`],
[`15-81`, `그 무엇도 앤의 마음을 조금도 움직이지 못했다. 앤은 마음을 정했다. 다시는 필립스 선생님에게 배우러 학교에 가지 않겠다고. 앤은 집에 돌아와 마릴라에게도 그렇게 말했다.`],
[`15-82`, `"말도 안 되는 소리." 마릴라가 말했다.`],
[`15-83`, `"전혀 말도 안 되는 소리가 아니에요." 앤이 엄숙하고 원망 어린 눈으로 마릴라를 바라보며 말했다. "모르시겠어요, 아주머니? 저는 모욕을 당했어요."`],
[`15-84`, `"모욕은 무슨! 내일 평소처럼 학교에 가거라."`],
[`15-85`, `"아, 아니에요." 앤이 부드럽게 고개를 저었다. "저는 다시 안 가요, 아주머니. 공부는 집에서 할게요. 할 수 있는 한 착하게 굴고, 될 수만 있다면 내내 입도 다물고 있을게요. 하지만 학교에는 다시 안 가요. 정말이에요."`],
[`15-86`, `마릴라는 앤의 작은 얼굴에 꺾이지 않는 고집 같은 것이 어려 있는 것을 보았다. 그 고집을 꺾으려면 꽤 애를 먹으리라는 걸 알았다. 하지만 마릴라는 현명하게도 당장은 더 이상 아무 말도 하지 않기로 했다.`],
[`15-87`, `'오늘 저녁에 레이첼한테 가서 상의해 봐야겠어.' 마릴라는 생각했다. '지금 앤을 설득해 봐야 소용없어. 너무 흥분했으니까. 저 애가 한번 마음먹으면 지독하게 고집을 부릴 수 있겠다는 생각이 들어. 저 애 이야기를 들어 보니, 필립스 선생이 꽤 고압적으로 일을 처리한 것 같아. 하지만 앤한테 그렇게 말할 수는 없지. 레이첼하고 이야기해 봐야겠다. 자식을 열 명이나 학교에 보낸 사람이니 뭘 좀 알 거야. 게다가 지금쯤이면 이야기도 다 들었을 테고.'`],
[`15-88`, `마릴라가 가 보니 린드 부인은 여느 때처럼 부지런하고 쾌활하게 이불을 뜨고 있었다.`],
[`15-89`, `"내가 무슨 일로 왔는지 알겠지." 마릴라가 조금 쑥스러워하며 말했다.`],
[`15-90`, `레이첼 부인이 고개를 끄덕였다.`],
[`15-91`, `"학교에서 앤이 일으킨 소동 때문이겠지." 부인이 말했다. "틸리 볼터가 학교에서 돌아가는 길에 들러서 다 이야기해 줬어."`],
[`15-92`, `"저 애를 어떻게 해야 할지 모르겠어." 마릴라가 말했다. "다시는 학교에 안 가겠다고 우기는 거야. 그렇게까지 흥분한 아이는 처음 봐. 학교에 다니기 시작한 뒤로 언젠가는 말썽이 날 줄 알았어. 일이 너무 순조로워서 오래 못 갈 줄 알았지. 워낙 예민한 애니까. 레이첼, 어떻게 하면 좋겠어?"`],
[`15-93`, `"글쎄, 나한테 조언을 구한다니 말인데, 마릴라." 린드 부인이 상냥하게 말했다. 린드 부인은 누가 조언을 청하는 걸 무엇보다 좋아했다. "나 같으면 처음엔 조금 비위를 맞춰 주겠어. 그게 내 생각이야. 내가 보기엔 필립스 선생이 잘못했어. 물론 아이들한테 그렇게 말하면 안 되지. 그리고 어제 성질부린 걸로 앤을 벌준 건 물론 잘한 일이야. 하지만 오늘은 달랐어. 늦은 다른 애들도 앤과 똑같이 벌을 받았어야 했어. 그게 맞지. 그리고 벌로 여자애를 남자애 옆에 앉히는 건 나는 찬성 못 해. 그건 점잖지 못한 일이야. 틸리 볼터가 정말 분개하더라고. 처음부터 끝까지 앤 편을 들면서, 학생들도 다 그렇다고 했어. 어쩐 일인지 앤이 아이들한테 아주 인기가 좋은 모양이야. 그렇게 잘 어울릴 줄은 생각도 못 했는데."`],
[`15-94`, `"그러니까 정말 집에 있게 하는 게 낫다는 거야?" 마릴라가 깜짝 놀라 물었다.`],
[`15-95`, `"그래. 그러니까 앤이 먼저 학교 이야기를 꺼내기 전까지는 학교의 '학' 자도 꺼내지 말라는 거야. 장담하는데, 마릴라, 일주일쯤 지나면 앤은 마음이 가라앉아서 제 발로 학교에 돌아가겠다고 할 거야. 틀림없어. 그런데 지금 당장 억지로 보내면, 그 애가 다음엔 또 무슨 별난 짓이나 생떼를 부려서 더 큰 말썽을 일으킬지 누가 알겠어. 내 생각엔 소란을 덜 피울수록 좋아. 학교에 안 간다고 해서 앤이 크게 놓치는 것도 없어. 필립스 선생은 선생으로선 영 꽝이거든. 교실 질서는 엉망이지, 그게 맞아. 그리고 꼬맹이들은 내팽개치고, 퀸스에 보낼 큰 학생들한테만 시간을 다 쏟아. 삼촌이 학교 이사가 아니었으면 1년 더 그 자리를 맡지도 못했을 거야. 그냥 이사가 아니라 '바로 그' 이사지. 나머지 두 사람을 코를 꿰어 끌고 다니니까. 정말이지, 이 섬의 교육이 어떻게 되려는지 모르겠어."`],
[`15-96`, `레이첼 부인은 고개를 저었다. 마치 자기가 이 주의 교육을 책임지기만 하면 모든 게 훨씬 잘 돌아갈 거라고 말하는 것 같았다.`],
[`15-97`, `마릴라는 레이첼 부인의 조언을 따랐다. 그리고 학교에 다시 가라는 말은 앤에게 한마디도 하지 않았다. 앤은 집에서 공부하고, 집안일을 하고, 쌀쌀한 보랏빛 가을 해 질 녘이면 다이애나와 놀았다. 하지만 길에서 길버트 블라이스를 만나거나 주일 학교에서 마주치면, 얼음장 같은 경멸을 담아 그냥 지나쳐 버렸다. 앤의 마음을 풀어 주고 싶어 하는 길버트의 기색이 뻔히 보였지만, 그 얼음은 조금도 녹지 않았다. 다이애나가 화해를 시키려고 애써도 소용없었다. 앤은 평생 길버트 블라이스를 미워하기로 마음먹은 게 분명했다.`],
[`15-98`, `그러나 길버트를 미워하는 만큼, 앤은 다이애나를 사랑했다. 좋아하는 것도 싫어하는 것도 똑같이 뜨거운, 그 정열적인 작은 가슴의 온 사랑을 다해서. 어느 날 저녁, 사과 한 바구니를 들고 과수원에서 들어온 마릴라는 해 질 녘 동쪽 창가에 혼자 앉아 서럽게 울고 있는 앤을 발견했다.`],
[`15-99`, `"이번엔 또 무슨 일이니, 앤?" 마릴라가 물었다.`],
[`15-100`, `"다이애나 때문이에요." 앤이 실컷 흐느끼며 말했다. "저는 다이애나를 정말 사랑해요, 아주머니. 다이애나 없이는 절대 못 살아요. 그런데 우리가 어른이 되면 다이애나는 결혼해서 저를 두고 멀리 떠나 버릴 거예요. 그럼 저는 어떡해요? 저는 다이애나 남편이 미워요. 정말 미치도록 미워요. 저는 다 상상해 봤어요. 결혼식이랑 모든 걸요. 다이애나는 눈처럼 새하얀 드레스에 면사포를 쓰고, 여왕처럼 아름답고 위엄 있어 보여요. 그리고 저는 신부 들러리예요. 저도 예쁜 드레스를 입었는데, 소매도 볼록해요. 하지만 웃는 얼굴 뒤에 찢어지는 가슴을 숨기고 있어요. 그리고 다이애나에게 작별 인사를 해요, 안녀어어엉…" 여기서 앤은 완전히 무너져 더 서럽게 울었다.`],
[`15-101`, `마릴라는 씰룩거리는 얼굴을 감추려고 얼른 돌아섰다. 하지만 소용없었다. 마릴라는 가장 가까운 의자에 털썩 주저앉아, 평소와 달리 아주 크고 시원하게 웃음을 터뜨렸다. 그 소리에 마당을 가로지르던 매슈가 깜짝 놀라 걸음을 멈췄다. 마릴라가 저렇게 웃는 소리를 들어 본 게 언제였더라?`],
[`15-102`, `"원, 앤 셜리." 마릴라는 겨우 말을 할 수 있게 되자 말했다. "걱정을 꼭 빌려 와야겠거든, 제발 좀 가까운 데서 빌려 오너라. 너한테 상상력이 있긴 있구나, 정말."`],
  ]
};

/* 원문 책장: 원작 16~17장 — 이 앱을 위해 새로 우리말로 옮김 */
BOOK.ch5 = {
  title: `다이애나를 초대한 다과회의 비극 · 삶의 새로운 재미`,
  orig: `원작 16~17장`,
  paras: [
[`h`, `원작 16장 「다이애나를 초대한 다과회의 비극」`],
[`16-1`, `초록 지붕 집의 10월은 아름다웠다. 골짜기의 자작나무들은 햇빛처럼 금빛으로 물들고, 과수원 뒤의 단풍나무들은 장엄한 진홍빛이 되고, 오솔길을 따라 선 산벚나무들은 짙은 붉은빛과 청동빛 도는 초록으로 더없이 곱게 차려입었다. 그리고 들판은 두 번째로 자란 풀 위로 햇볕을 쬐고 있었다.`],
[`16-2`, `앤은 주위의 온갖 빛깔 속에서 마음껏 즐거워했다.`],
[`16-3`, `"아, 아주머니." 어느 토요일 아침, 앤이 화려한 나뭇가지를 한 아름 안고 춤추듯 들어오며 외쳤다. "10월이 있는 세상에 살아서 정말 기뻐요. 9월에서 곧장 11월로 건너뛰어 버린다면 끔찍하지 않겠어요? 이 단풍나무 가지 좀 보세요. 가슴이 짜릿하지 않으세요? 여러 번 짜릿하지 않으세요? 이걸로 제 방을 꾸밀 거예요."`],
[`16-4`, `"지저분하게시리." 아름다움을 느끼는 감각이 그다지 발달하지 않은 마릴라가 말했다. "넌 바깥 물건들로 방을 너무 어지럽혀, 앤. 침실은 잠자라고 있는 거다."`],
[`16-5`, `"아, 꿈꾸라고도 있는 거예요, 아주머니. 그리고 예쁜 것들이 있는 방에서는 꿈을 훨씬 더 잘 꿀 수 있어요. 이 가지들은 낡은 파란 물주전자에 꽂아서 제 탁자 위에 둘 거예요."`],
[`16-6`, `"그럼 계단에 잎사귀 떨어뜨리지 않게 조심해라. 앤, 나는 오늘 오후에 카모디에서 열리는 부인회 모임에 간다. 아마 해 지기 전엔 못 돌아올 거야. 매슈하고 제리 저녁은 네가 차려 줘야 한다. 그러니 지난번처럼 식탁에 앉을 때까지 차 우리는 걸 잊어버리지 않도록 조심해라."`],
[`16-7`, `"그걸 잊어버린 건 정말 끔찍한 일이었어요." 앤이 미안해하며 말했다. "하지만 그날 오후엔 제비꽃 골짜기 이름을 생각해 내려고 애쓰느라 다른 생각이 다 밀려나 버렸거든요. 매슈 아저씨는 정말 좋으셨어요. 조금도 꾸짖지 않으셨어요. 아저씨가 직접 차를 우리시면서, 조금 기다리는 것도 괜찮다고 하셨어요. 그리고 기다리는 동안 제가 아름다운 요정 이야기를 해 드렸더니, 아저씨는 시간이 하나도 길게 느껴지지 않으셨대요. 정말 아름다운 요정 이야기였어요, 아주머니. 끝을 잊어버려서 제가 끝을 지어냈는데, 아저씨는 어디서부터 지어낸 건지 하나도 모르겠다고 하셨어요."`],
[`16-8`, `"매슈는 네가 한밤중에 일어나서 저녁을 먹겠다고 해도 괜찮다고 할 거다, 앤. 하지만 이번엔 정신 바짝 차려라. 그리고… 이게 잘하는 짓인지는 모르겠다만… 너를 더 들뜨게 만들지도 모르지만… 다이애나를 불러서 오후를 같이 보내고 여기서 차를 마셔도 좋다."`],
[`16-9`, `"아, 아주머니!" 앤이 두 손을 꼭 맞잡았다. "정말 근사해요! 아주머니도 상상할 줄 아시는군요. 그렇지 않으면 제가 바로 그걸 얼마나 바랐는지 아실 리가 없잖아요. 정말 어른스럽고 멋질 거예요. 손님이 오면 차 우리는 걸 잊을 걱정은 없어요. 아, 아주머니, 장미 꽃봉오리 무늬 찻잔 세트를 써도 돼요?"`],
[`16-10`, `"절대 안 된다! 장미 꽃봉오리 찻잔이라니! 원, 다음엔 또 뭘 달라고 할 테냐? 그건 목사님이나 부인회 손님이 올 때만 쓰는 거 알잖니. 낡은 갈색 찻잔 세트를 내놓아라. 하지만 노란 작은 항아리에 든 체리 절임은 열어도 된다. 어차피 이제 먹을 때가 됐어. 슬슬 발효되기 시작한 것 같으니까. 그리고 과일 케이크를 좀 자르고, 쿠키랑 생강 과자도 내놓으렴."`],
[`16-11`, `"제가 식탁 윗자리에 앉아서 차를 따르는 모습이 눈에 선해요." 앤이 황홀한 듯 눈을 감으며 말했다. "그리고 다이애나한테 설탕 넣겠냐고 묻는 거예요! 안 넣는다는 건 알지만, 물론 모르는 척하고 물어볼 거예요. 그리고 과일 케이크 한 조각 더, 체리 절임 한 숟가락 더 먹으라고 권하는 거예요. 아, 아주머니, 생각만 해도 정말 황홀해요. 다이애나가 오면 모자 벗어 놓으라고 손님방에 데려가도 돼요? 그리고 앉을 때는 응접실로 가도 돼요?"`],
[`16-12`, `"안 된다. 너랑 네 손님은 거실이면 충분해. 하지만 지난번 교회 친목회 때 남은 산딸기 주스가 반쯤 든 병이 하나 있다. 거실 벽장 두 번째 칸에 있으니, 원하면 오후에 다이애나랑 쿠키 하나씩 곁들여 마셔도 좋다. 매슈는 배에 감자를 실어 나르느라 아마 저녁 차 시간에 늦게 들어올 테니까."`],
[`16-13`, `앤은 골짜기로 날듯이 내려가 드라이어드의 샘을 지나고 가문비나무 오솔길을 올라 과수원 비탈 집으로 다이애나를 초대하러 갔다. 그 결과, 마릴라가 마차를 타고 카모디로 떠나자마자 다이애나가 건너왔다. 두 번째로 좋은 옷을 차려입고, 차 마시러 초대받은 손님이 갖춰야 할 모습 그대로였다. 다른 때 같으면 노크도 없이 부엌으로 뛰어 들어왔을 텐데, 지금은 현관문을 얌전하게 두드렸다. 그리고 역시 두 번째로 좋은 옷을 입은 앤이 그만큼 얌전하게 문을 열어 주자, 두 아이는 처음 만난 사람들처럼 엄숙하게 악수를 나누었다. 이 어색한 엄숙함은 다이애나가 모자를 벗어 놓으러 동쪽 다락방에 다녀온 뒤 거실에서 발끝을 가지런히 모으고 10분을 앉아 있을 때까지 이어졌다.`],
[`16-14`, `"어머님은 안녕하시니?" 앤이 공손하게 물었다. 그날 아침 배리 부인이 아주 건강하고 기운찬 모습으로 사과를 따는 걸 보지 못한 사람처럼.`],
[`16-15`, `"아주 잘 지내셔, 고마워. 커스버트 아저씨는 오늘 오후에 백합 모래톱으로 감자를 실어 나르시는 모양이지?" 다이애나가 말했다. 다이애나는 그날 아침 매슈의 마차를 얻어 타고 하먼 앤드루스 씨 댁까지 다녀온 참이었다.`],
[`16-16`, `"응. 올해는 우리 감자 농사가 아주 잘됐어. 너희 아버지 감자 농사도 잘됐으면 좋겠다."`],
[`16-17`, `"그럭저럭 잘됐어, 고마워. 너희는 사과를 벌써 많이 땄니?"`],
[`16-18`, `"아, 아주 많이!" 앤은 점잔 빼는 것도 잊고 벌떡 일어났다. "과수원에 가서 빨간 달콤이 사과 좀 따자, 다이애나. 아주머니가 나무에 남은 건 다 따 먹어도 된대. 아주머니는 정말 인심이 후하신 분이야. 차 마실 때 과일 케이크랑 체리 절임도 먹어도 된다고 하셨어. 하지만 손님한테 뭘 먹을지 미리 말하는 건 예의가 아니니까, 마실 건 뭐라고 하셨는지 말 안 할게. 산딸기로 만든 거고 새빨간 색이라는 것만 알려 줄게. 난 새빨간 음료가 정말 좋아. 너도 그렇지? 다른 색보다 두 배는 맛있잖아."`],
[`16-19`, `가지가 땅에 닿도록 열매가 휘어지게 달린 과수원은 정말 즐거워서, 두 아이는 오후 대부분을 그곳에서 보냈다. 서리를 피해 아직 초록빛이 남아 있고 부드러운 가을 햇살이 따뜻하게 머무는 풀밭 구석에 앉아, 사과를 먹으며 쉴 새 없이 이야기를 나누었다. 다이애나는 학교에서 일어난 일을 앤에게 잔뜩 들려주었다. 거티 파이랑 짝이 됐는데 정말 싫다는 것, 거티가 석필로 계속 끽끽 소리를 내서 피가 다 얼어붙는 것 같다는 것. 루비 길리스가 개울가에 사는 메리 조 할머니한테 받은 마법의 조약돌로 사마귀를 모두 없앴다는 것, 정말이라는 것. 사마귀를 조약돌로 문지른 다음, 초승달이 뜰 때 그 돌을 왼쪽 어깨 너머로 던지면 사마귀가 다 사라진다는 것. 찰리 슬론의 이름이 엠 화이트의 이름이랑 같이 현관 벽에 쓰여서 엠 화이트가 엄청 화났다는 것. 샘 볼터가 수업 시간에 필립스 선생님한테 말대꾸를 했다가 회초리를 맞았는데, 샘의 아버지가 학교로 찾아와서 다시 한번 자기 아이들한테 손을 대 보라고 선생님한테 따졌다는 것. 매티 앤드루스가 새 빨간 두건이랑 술 달린 파란 숄을 새로 장만했는데 그걸로 잘난 척하는 꼴이 정말 못 봐주겠다는 것. 리지 라이트가 메이미 윌슨이랑 말을 안 한다는 것. 메이미 윌슨의 다 큰 언니가 리지 라이트의 다 큰 언니의 남자 친구를 가로챘기 때문이라는 것. 그리고 모두들 앤을 무척 보고 싶어 하고 앤이 다시 학교에 오기를 바란다는 것. 그리고 길버트 블라이스가…`],
[`16-20`, `하지만 앤은 길버트 블라이스 이야기는 듣고 싶지 않았다. 앤은 서둘러 일어나서, 이제 들어가서 산딸기 주스를 마시자고 말했다.`],
[`16-21`, `앤은 거실 찬장 두 번째 칸을 살펴보았지만, 거기에 산딸기 주스 병은 없었다. 찾아보니 맨 위 칸 안쪽 깊숙이에 병이 하나 있었다. 앤은 그것을 쟁반에 담아 큰 유리잔 하나와 함께 식탁에 놓았다.`],
[`16-22`, `"자, 어서 마셔, 다이애나." 앤이 공손하게 말했다. "나는 지금은 안 마실래. 사과를 그렇게 먹었더니 생각이 없네."`],
[`16-23`, `다이애나는 잔에 가득 따라서, 그 새빨간 빛깔을 감탄하며 바라보고는 얌전하게 홀짝였다.`],
[`16-24`, `"정말 맛있는 산딸기 주스다, 앤." 다이애나가 말했다. "산딸기 주스가 이렇게 맛있는 줄 몰랐어."`],
[`16-25`, `"마음에 든다니 정말 기뻐. 마시고 싶은 만큼 마셔. 나는 나가서 불 좀 들쑤셔 놓고 올게. 집안 살림을 맡으면 신경 쓸 게 정말 많아, 그렇지?"`],
[`16-26`, `앤이 부엌에서 돌아와 보니 다이애나는 두 번째 잔을 마시고 있었다. 그리고 앤이 더 마시라고 권하자, 세 번째 잔을 마시는 것도 딱히 마다하지 않았다. 잔은 큼직했고, 산딸기 주스는 확실히 아주 맛있었다.`],
[`16-27`, `"이렇게 맛있는 건 처음 마셔 봐." 다이애나가 말했다. "린드 부인 것보다 훨씬 맛있어. 린드 부인은 자기 주스 자랑을 그렇게 하시는데. 린드 부인 것하고는 맛이 하나도 안 비슷해."`],
[`16-28`, `"마릴라 아주머니의 산딸기 주스가 린드 부인 것보다 아마 훨씬 맛있을 거야." 앤이 의리 있게 말했다. "아주머니는 이름난 요리 솜씨를 가지셨거든. 나한테도 요리를 가르쳐 주시려고 하는데, 정말이지, 다이애나, 그건 산을 오르는 것처럼 힘든 일이야. 요리에는 상상할 여지가 거의 없어. 그냥 규칙대로만 해야 하거든. 지난번에 케이크를 만들 때는 밀가루 넣는 걸 잊어버렸어. 너랑 나에 대한 정말 아름다운 이야기를 생각하고 있었거든, 다이애나. 네가 천연두에 걸려서 몹시 아픈데 모두가 너를 버리고 떠나. 하지만 나는 용감하게 네 머리맡으로 가서 너를 간호해 살려 내지. 그리고 내가 천연두에 걸려서 죽어. 나는 묘지의 포플러나무 아래 묻히고, 너는 내 무덤가에 장미 덤불을 심고 네 눈물로 물을 줘. 그리고 너는 너를 위해 목숨을 바친 어린 시절 친구를 절대, 절대 잊지 않아. 아, 정말 슬픈 이야기였어, 다이애나. 케이크 반죽을 섞는 동안 눈물이 뺨 위로 비 오듯 쏟아졌어. 그런데 밀가루를 잊어버려서 케이크는 비참하게 실패했어. 알다시피 케이크에는 밀가루가 꼭 있어야 하잖아. 아주머니는 몹시 화가 나셨는데, 그럴 만도 해. 나는 아주머니께 커다란 골칫거리야. 지난주엔 푸딩 소스 때문에 아주머니가 엄청 창피를 당하셨어. 화요일 점심에 자두 푸딩을 먹었는데, 푸딩이 반이랑 소스가 한 주전자 남았어. 아주머니가 그거면 한 끼 더 먹을 수 있겠다고 하시면서, 찬장 선반에 올려놓고 뚜껑을 덮어 두라고 하셨어. 나는 정말 꼭 덮을 생각이었어, 다이애나. 그런데 그걸 들고 가면서 내가 수녀라고 상상하고 있었어. 물론 나는 개신교도지만 가톨릭 신자라고 상상했지. 찢어진 마음을 묻으려고 수녀원에 들어가는 거야. 그러느라 푸딩 소스 덮는 걸 까맣게 잊어버렸어. 다음 날 아침에 생각이 나서 찬장으로 달려갔어. 다이애나, 그 푸딩 소스에 생쥐가 한 마리 빠져 죽어 있는 걸 봤을 때 내가 얼마나 끔찍했을지 상상해 봐! 나는 숟가락으로 생쥐를 건져서 마당에 내던지고, 숟가락을 물에 세 번 씻었어. 아주머니는 젖을 짜러 나가 계셨는데, 들어오시면 그 소스를 돼지한테 줄지 여쭤볼 생각이었어. 그런데 아주머니가 들어오셨을 때 나는 서리 요정이 되어 숲을 지나며 나무들을 원하는 대로 빨갛게, 노랗게 물들이는 상상을 하고 있었어. 그래서 푸딩 소스 생각은 다시는 안 났고, 아주머니는 나한테 사과를 따 오라고 하셨지. 그런데 그날 아침에 스펜서베일에 사는 체스터 로스 씨 부부가 오셨어. 알지, 아주 멋쟁이 분들이잖아. 특히 체스터 로스 부인이. 아주머니가 나를 부르셨을 때는 점심이 다 차려져 있었고 모두 식탁에 앉아 있었어. 나는 최대한 예의 바르고 품위 있게 굴려고 애썼어. 예쁘지는 않아도 숙녀다운 아이라고 체스터 로스 부인이 생각해 줬으면 했거든. 모든 게 잘되어 가다가, 아주머니가 한 손에는 자두 푸딩을, 다른 손에는 데운 푸딩 소스 주전자를 들고 오시는 걸 봤어. 다이애나, 그건 정말 끔찍한 순간이었어. 모든 게 다 생각났어. 그래서 나는 그 자리에서 벌떡 일어나 소리쳤어. '아주머니, 그 푸딩 소스 쓰시면 안 돼요. 거기 생쥐가 빠져 죽어 있었어요. 아까 말씀드리는 걸 잊어버렸어요.' 아, 다이애나, 백 살까지 산다 해도 그 끔찍한 순간은 절대 못 잊을 거야. 체스터 로스 부인은 나를 빤히 쳐다보기만 하셨고, 나는 창피해서 바닥으로 꺼져 버리고 싶었어. 그분은 완벽한 살림꾼인데, 우리 집을 어떻게 생각하셨을지 상상해 봐. 아주머니는 얼굴이 불처럼 빨개지셨지만 아무 말도 안 하셨어. 그때는. 그냥 소스랑 푸딩을 들고 나가시더니 딸기 절임을 가지고 오셨어. 나한테도 권하셨는데, 한 숟가락도 넘어가지 않았어. 머리 위에 숯불을 쌓는 것 같았어. 체스터 로스 부인이 가신 뒤에 아주머니는 나를 무섭게 꾸짖으셨어. 어머, 다이애나, 왜 그래?"`],
[`16-29`, `다이애나가 몹시 비틀거리며 일어섰다가, 다시 주저앉아 두 손으로 머리를 감쌌다.`],
[`16-30`, `"나… 나 너무 어지러워." 다이애나가 조금 혀 꼬부라진 소리로 말했다. "나… 나… 당장 집에 가야겠어."`],
[`16-31`, `"아, 차도 안 마시고 집에 가다니 그건 꿈도 꾸지 마." 앤이 어쩔 줄 몰라 하며 외쳤다. "지금 바로 차를 차릴게. 지금 당장 가서 차를 우릴게."`],
[`16-32`, `"집에 가야겠어." 다이애나가 멍하지만 단호하게 되풀이했다.`],
[`16-33`, `"그럼 간식이라도 좀 먹어." 앤이 애원했다. "과일 케이크 한 조각이랑 체리 절임이라도 줄게. 소파에 잠깐 누워 있으면 괜찮아질 거야. 어디가 아파?"`],
[`16-34`, `"집에 가야겠어." 다이애나가 말했다. 다이애나는 그 말밖에 하지 않았다. 앤이 아무리 애원해도 소용없었다.`],
[`16-35`, `"차도 안 마시고 집에 가는 손님은 처음 들어 봐." 앤이 슬퍼하며 말했다. "아, 다이애나, 혹시 정말로 천연두에 걸린 건 아닐까? 만약 그렇다면 내가 가서 간호해 줄게. 그건 믿어도 돼. 나는 절대 너를 버리지 않을 거야. 그래도 차 마실 때까지만 있다 가면 좋겠는데. 어디가 아파?"`],
[`16-36`, `"너무 어지러워." 다이애나가 말했다.`],
[`16-37`, `정말로 다이애나는 몹시 비틀거리며 걸었다. 앤은 실망의 눈물을 글썽이며 다이애나의 모자를 가져다주고, 배리 씨네 마당 울타리까지 바래다주었다. 그리고 초록 지붕 집으로 돌아오는 내내 울었다. 집에 와서는 남은 산딸기 주스를 슬프게 찬장에 도로 넣고, 매슈와 제리의 저녁을 차렸다. 신나는 마음은 하나도 남아 있지 않았다.`],
[`16-38`, `다음 날은 일요일이었는데, 새벽부터 해 질 녘까지 비가 억수같이 쏟아져서 앤은 초록 지붕 집 밖으로 한 발짝도 나가지 않았다. 월요일 오후, 마릴라는 앤에게 린드 부인 댁에 심부름을 보냈다. 그런데 금세 앤이 눈물을 뚝뚝 흘리며 오솔길을 날듯이 달려 돌아왔다. 앤은 부엌으로 뛰어 들어와 소파에 엎어지더니 괴로워 몸부림쳤다.`],
[`16-39`, `"이번엔 또 뭐가 잘못됐니, 앤?" 마릴라가 불안하고 당황해서 물었다. "설마 린드 부인한테 또 버릇없이 굴고 온 건 아니겠지."`],
[`16-40`, `앤은 대답 대신 더 많은 눈물을 흘리며 더 거세게 흐느낄 뿐이었다!`],
[`16-41`, `"앤 셜리, 내가 물으면 대답을 해야지. 당장 똑바로 앉아서 왜 우는지 말해 봐라."`],
[`16-42`, `앤은 비극 그 자체인 얼굴로 일어나 앉았다.`],
[`16-43`, `"린드 부인이 오늘 배리 부인을 만나러 갔는데, 배리 부인이 엄청 화가 나 있었대요." 앤이 울부짖었다. "제가 토요일에 다이애나를 술에 취하게 만들어서 창피한 꼴로 집에 보냈대요. 그리고 저는 뼛속까지 나쁘고 못된 아이가 틀림없으니까, 다시는, 다시는 다이애나가 저랑 놀지 못하게 하겠대요. 아, 아주머니, 저는 슬픔에 짓눌려 죽을 것 같아요."`],
[`16-44`, `마릴라는 너무 놀라 멍하니 앤을 쳐다보았다.`],
[`16-45`, `"다이애나를 술에 취하게 했다고!" 마릴라가 겨우 목소리를 되찾아 말했다. "앤, 네가 미친 거냐, 배리 부인이 미친 거냐? 대체 그 애한테 뭘 준 거니?"`],
[`16-46`, `"산딸기 주스밖에 안 줬어요." 앤이 흐느꼈다. "산딸기 주스를 마시고 취할 거라고는 생각도 못 했어요, 아주머니. 다이애나처럼 큰 잔으로 세 잔을 마셨대도요. 아, 그렇게 말하니까 꼭… 꼭… 토머스 아주머니네 남편 같잖아요! 하지만 저는 다이애나를 취하게 하려던 게 아니에요."`],
[`16-47`, `"취하기는 무슨!" 마릴라는 거실 찬장으로 성큼성큼 걸어갔다. 거기 선반 위에 있는 병을 보자마자 마릴라는 그것이 3년 묵은 자기 집 수제 까치밥나무 열매 포도주라는 걸 알아보았다. 그 포도주는 에이번리에서 이름이 나 있었지만, 배리 부인을 비롯한 몇몇 엄격한 사람들은 그걸 몹시 못마땅해했다. 그리고 그와 동시에, 마릴라는 산딸기 주스 병을 앤에게 말한 대로 찬장에 넣지 않고 지하실에 내려놓았다는 것이 생각났다.`],
[`16-48`, `마릴라는 포도주 병을 손에 들고 부엌으로 돌아왔다. 마릴라의 얼굴이 저도 모르게 씰룩거렸다.`],
[`16-49`, `"앤, 넌 정말 말썽에 휘말리는 데는 천재로구나. 다이애나한테 산딸기 주스가 아니라 까치밥나무 열매 포도주를 준 거다. 너는 그 차이도 몰랐니?"`],
[`16-50`, `"저는 맛도 안 봤어요." 앤이 말했다. "저는 주스인 줄 알았어요. 저는 그저… 그저… 손님을 정성껏 대접하고 싶었어요. 다이애나는 몹시 아파서 집에 가야 했어요. 배리 부인은 린드 부인한테 다이애나가 곤드레만드레 취했었다고 했대요. 엄마가 무슨 일이냐고 물으니까 바보처럼 실실 웃더니 쓰러져서 몇 시간이나 잤대요. 배리 부인이 다이애나 입에서 나는 냄새를 맡고 취했다는 걸 아셨대요. 다이애나는 어제 하루 종일 머리가 깨질 듯이 아팠대요. 배리 부인은 정말 화가 많이 나셨어요. 제가 일부러 그랬다고 굳게 믿으실 거예요."`],
[`16-51`, `"나라면 무엇이 됐든 세 잔씩이나 마셔 댄 다이애나의 욕심을 혼내겠다." 마릴라가 짧게 말했다. "그 큰 잔으로 세 잔이면 주스였어도 탈이 났을 거야. 원, 이 일로 내가 포도주 담근다고 흉보던 사람들은 좋은 꼬투리를 잡았겠구나. 목사님이 못마땅해하신다는 걸 안 뒤로는 3년 동안 담그지도 않았는데 말이야. 그 병은 그냥 아플 때 쓰려고 남겨 둔 거였어. 자, 자, 얘야, 울지 마라. 일이 이렇게 된 건 안됐지만, 네 잘못은 없는 것 같다."`],
[`16-52`, `"울어야겠어요." 앤이 말했다. "제 가슴이 찢어졌어요. 운명의 별들이 저를 거슬러 싸우고 있어요, 아주머니. 다이애나랑 저는 영원히 헤어졌어요. 아, 아주머니, 처음 우정을 맹세할 때는 이런 일이 생길 줄 꿈에도 몰랐어요."`],
[`16-53`, `"바보 같은 소리 마라, 앤. 배리 부인도 네 잘못이 아니라는 걸 알면 생각을 고쳐먹을 거다. 아마 네가 짓궂은 장난이나 그 비슷한 걸 쳤다고 생각하는 모양이야. 오늘 저녁에 올라가서 어떻게 된 일인지 말씀드리는 게 좋겠다."`],
[`16-54`, `"다이애나의 상처 입은 어머니를 마주할 생각을 하니 용기가 사라져요." 앤이 한숨을 쉬었다. "아주머니가 가 주셨으면 좋겠어요. 아주머니는 저보다 훨씬 위엄이 있으시잖아요. 아마 제 말보다 아주머니 말씀을 더 빨리 들으실 거예요."`],
[`16-55`, `"그래, 내가 가마." 마릴라는 아마 그편이 더 현명하겠다고 생각하며 말했다. "더는 울지 마라, 앤. 다 괜찮아질 거다."`],
[`16-56`, `과수원 비탈 집에서 돌아올 무렵, 마릴라는 다 괜찮아질 거라는 생각을 바꾸었다. 마릴라를 기다리고 있던 앤이 현관문으로 날아가 맞이했다.`],
[`16-57`, `"아, 아주머니, 얼굴을 보니 소용없었다는 걸 알겠어요." 앤이 슬프게 말했다. "배리 부인이 저를 용서하지 않으신대요?"`],
[`16-58`, `"배리 부인이라니, 원!" 마릴라가 쏘아붙였다. "내가 본 여자들 중에 그렇게 막무가내인 사람은 처음이다. 다 실수였고 네 잘못이 아니라고 말했는데, 내 말을 전혀 안 믿더구나. 그리고 내 포도주 이야기를 꺼내서, 내가 늘 그 포도주는 아무한테도 조금도 해롭지 않다고 했던 걸 두고두고 들먹이더라. 그래서 똑똑히 말해 줬지. 까치밥나무 열매 포도주는 큰 잔으로 세 잔씩 마시라고 만든 게 아니라고. 그리고 내가 맡은 아이가 그렇게 욕심을 부렸으면, 볼기를 단단히 때려서 정신 차리게 했을 거라고."`],
[`16-59`, `몹시 속이 상한 마릴라는 부엌으로 휙 들어가 버렸고, 현관에는 정신이 아득해진 작은 영혼 하나가 남겨졌다. 이윽고 앤은 모자도 쓰지 않고 쌀쌀한 가을 어스름 속으로 걸어 나갔다. 앤은 아주 단호하고 침착하게, 시들어 버린 토끼풀 밭을 내려가 통나무 다리를 건너고, 서쪽 숲 위에 낮게 걸린 창백한 작은 달빛을 받으며 가문비나무 숲을 올라갔다. 머뭇머뭇 두드리는 노크 소리에 문을 연 배리 부인은, 입술이 하얗게 질리고 눈빛이 간절한 탄원자가 문간에 서 있는 것을 보았다.`],
[`16-60`, `배리 부인의 얼굴이 굳어졌다. 배리 부인은 편견과 싫어하는 마음이 강한 사람이었고, 부인의 분노는 차갑고 뚱하게 오래가는 종류여서 언제나 풀기가 가장 어려웠다. 공평하게 말하자면, 부인은 앤이 순전히 미리 작정한 악의로 다이애나를 취하게 했다고 정말로 믿고 있었다. 그리고 그런 아이와 더 친하게 지내다가 어린 딸이 물들지 않도록 지키려고 진심으로 애쓰고 있었다.`],
[`16-61`, `"무슨 일이니?" 부인이 딱딱하게 말했다.`],
[`16-62`, `앤은 두 손을 꼭 맞잡았다.`],
[`16-63`, `"아, 배리 부인, 제발 저를 용서해 주세요. 저는 다이애나를… 다이애나를… 취하게 하려던 게 아니에요. 제가 어떻게 그럴 수 있겠어요? 부인이 친절한 분들에게 입양된 가엾은 고아 소녀이고, 이 세상에 마음의 친구가 단 한 명뿐이라고 상상해 보세요. 그 친구를 일부러 취하게 하시겠어요? 저는 그게 산딸기 주스인 줄로만 알았어요. 산딸기 주스라고 굳게 믿었어요. 아, 제발 다이애나가 다시는 저랑 못 놀게 하겠다는 말씀만은 하지 말아 주세요. 그러시면 제 인생은 슬픔의 먹구름으로 뒤덮이고 말 거예요."`],
[`16-64`, `마음씨 좋은 린드 부인이었다면 눈 깜짝할 사이에 마음이 녹았을 이 말은, 배리 부인을 더 짜증 나게 했을 뿐이었다. 부인은 앤의 어려운 낱말과 극적인 몸짓을 의심스러워했고, 이 아이가 자기를 놀리고 있다고 생각했다. 그래서 차갑고 매정하게 말했다.`],
[`16-65`, `"너는 다이애나가 어울릴 만한 아이가 아닌 것 같구나. 집에 가서 얌전히 지내거라."`],
[`16-66`, `앤의 입술이 떨렸다.`],
[`16-67`, `"작별 인사를 하게 딱 한 번만 다이애나를 만나게 해 주시면 안 될까요?" 앤이 애원했다.`],
[`16-68`, `"다이애나는 아빠랑 카모디에 갔다." 배리 부인은 그렇게 말하고 들어가 문을 닫아 버렸다.`],
[`16-69`, `앤은 절망 속에서 오히려 차분해진 채 초록 지붕 집으로 돌아갔다.`],
[`16-70`, `"마지막 희망이 사라졌어요." 앤이 마릴라에게 말했다. "제가 직접 올라가서 배리 부인을 만났는데, 저를 아주 모욕적으로 대하셨어요. 아주머니, 저는 그분이 교양 있는 분이라고 생각하지 않아요. 이제 기도하는 수밖에 없는데, 그것도 별로 희망이 없어요. 왜냐하면, 아주머니, 배리 부인처럼 고집 센 사람은 하느님도 어떻게 하실 수 없을 것 같거든요."`],
[`16-71`, `"앤, 그런 말 하면 못쓴다." 마릴라는 꾸짖으면서도, 자꾸만 비어져 나오는 웃음을 참느라 애를 먹었다. 그리고 실제로 그날 밤 매슈에게 모든 이야기를 들려주면서 마릴라는 앤의 시련을 두고 실컷 웃었다.`],
[`16-72`, `하지만 잠자리에 들기 전 동쪽 다락방에 살며시 들어가, 울다 지쳐 잠든 앤을 보았을 때 마릴라의 얼굴에는 익숙하지 않은 부드러움이 번졌다.`],
[`16-73`, `"가엾은 것." 마릴라는 눈물 자국 난 아이의 얼굴에서 흘러내린 곱슬머리 한 가닥을 걷어 올려 주며 중얼거렸다. 그리고 몸을 숙여, 베개 위의 발그레한 뺨에 입을 맞추었다.`],
[`h`, `원작 17장 「삶의 새로운 재미」`],
[`17-1`, `다음 날 오후, 부엌 창가에서 조각보를 꿰매던 앤은 우연히 밖을 내다보다가, 드라이어드의 샘가에서 다이애나가 수수께끼처럼 손짓하는 것을 보았다. 앤은 눈 깜짝할 사이에 집을 뛰쳐나가 골짜기로 날듯이 달려 내려갔다. 표정이 풍부한 앤의 눈에는 놀라움과 희망이 뒤엉켜 있었다. 하지만 다이애나의 풀 죽은 얼굴을 보자 희망은 사그라졌다.`],
[`17-2`, `"어머님 마음이 안 풀리셨어?" 앤이 숨을 헐떡이며 물었다.`],
[`17-3`, `다이애나는 슬프게 고개를 저었다.`],
[`17-4`, `"응. 그리고, 아, 앤, 엄마가 다시는 너랑 놀지 말래. 나 울고 또 울면서 네 잘못이 아니라고 말씀드렸는데 소용없었어. 너한테 작별 인사만 하고 오게 해 달라고 엄마를 조르느라 얼마나 힘들었는지 몰라. 딱 10분만 있다 오래. 엄마가 시계를 보면서 재고 계셔."`],
[`17-5`, `"영원한 작별 인사를 하기에 10분은 너무 짧아." 앤이 눈물을 글썽이며 말했다. "아, 다이애나, 앞으로 더 소중한 친구들이 그대를 아껴 주더라도, 어린 시절의 친구인 나를 절대 잊지 않겠다고 굳게 약속해 줄래?"`],
[`17-6`, `"물론이지." 다이애나가 흐느꼈다. "그리고 나는 다른 마음의 친구는 절대 안 사귈 거야. 사귀고 싶지도 않아. 너만큼 누군가를 사랑할 수는 없을 거야."`],
[`17-7`, `"아, 다이애나." 앤이 두 손을 맞잡으며 외쳤다. "너 나를 사랑하니?"`],
[`17-8`, `"그럼, 당연하지. 몰랐어?"`],
[`17-9`, `"응." 앤이 숨을 길게 들이쉬었다. "물론 네가 나를 좋아한다고는 생각했지만, 사랑해 주리라고는 감히 바라지도 못했어. 정말이야, 다이애나, 나는 누가 나를 사랑할 수 있을 거라고 생각해 본 적이 없어. 내가 기억하는 한 나를 사랑해 준 사람은 아무도 없었거든. 아, 정말 놀라워! 이건 그대와 갈라진 어두운 길을 영원히 비춰 줄 한 줄기 빛이야, 다이애나. 아, 한 번만 더 말해 줘."`],
[`17-10`, `"나는 너를 진심으로 사랑해, 앤." 다이애나가 굳건하게 말했다. "앞으로도 언제나 그럴 거야. 그건 믿어도 돼."`],
[`17-11`, `"그리고 나도 언제나 그대를 사랑할게, 다이애나." 앤이 엄숙하게 손을 내밀며 말했다. "앞으로 오랜 세월 동안 그대의 추억은 내 외로운 삶 위에서 별처럼 빛나리라. 우리가 함께 읽은 마지막 이야기에 나오는 것처럼. 다이애나, 작별의 정표로 영원히 간직할 수 있게, 그대의 칠흑 같은 머리카락을 한 타래 주겠어?"`],
[`17-12`, `"자를 게 있어?" 앤의 감동적인 말투에 다시 흘러내린 눈물을 닦으며, 다이애나가 현실로 돌아와 물었다.`],
[`17-13`, `"응. 다행히 앞치마 주머니에 조각보 가위가 있어." 앤이 말했다. 앤은 엄숙하게 다이애나의 곱슬머리 한 가닥을 잘라 냈다. "잘 있거라, 사랑하는 나의 친구여. 이제부터 우리는 이웃에 살면서도 남남처럼 지내야 하리. 하지만 내 마음은 언제나 그대에게 충실하리라."`],
[`17-14`, `앤은 서서 다이애나가 보이지 않을 때까지 지켜보았다. 다이애나가 뒤돌아볼 때마다 슬프게 손을 흔들었다. 그러고는 집으로 돌아왔다. 이 낭만적인 이별 덕분에 앤은 당분간 적잖이 위로를 받았다.`],
[`17-15`, `"다 끝났어요." 앤이 마릴라에게 알렸다. "저는 다시는 친구를 못 사귈 거예요. 사실 전보다 훨씬 더 나빠졌어요. 이젠 케이티 모리스도 비올레타도 없으니까요. 그리고 있다고 해도 예전 같지는 않을 거예요. 진짜 친구를 사귀고 나니까, 상상 속 소녀들로는 어쩐지 마음이 채워지지 않아요. 다이애나랑 저는 샘가에서 정말 가슴 뭉클한 작별을 했어요. 그 이별은 제 기억 속에서 영원히 신성하게 남을 거예요. 저는 생각할 수 있는 가장 애절한 말을 쓰고, '그대'라고 불렀어요. '그대'는 '너'보다 훨씬 낭만적인 것 같아요. 다이애나가 머리카락을 한 타래 줬는데, 작은 주머니에 꿰매 넣어서 평생 목에 걸고 다닐 거예요. 제가 죽으면 꼭 함께 묻어 주세요. 저는 오래 살 것 같지 않거든요. 제가 차갑게 죽어 누워 있는 걸 보면, 배리 부인도 자기가 한 일을 뉘우치고 다이애나를 제 장례식에 오게 해 줄지도 몰라요."`],
[`17-16`, `"말을 그렇게 잘하는 걸 보니 슬퍼서 죽을 걱정은 별로 없겠구나, 앤." 마릴라가 무정하게 말했다.`],
[`17-17`, `그다음 월요일, 앤은 책 바구니를 팔에 걸고 결심한 듯 입술을 꼭 다문 채 자기 방에서 내려와 마릴라를 놀라게 했다.`],
[`17-18`, `"저 다시 학교에 갈래요." 앤이 선언했다. "친구를 무자비하게 빼앗긴 지금, 제 삶에 남은 건 그것뿐이에요. 학교에서는 다이애나를 바라보며 지나간 날들을 곰곰이 떠올릴 수 있으니까요."`],
[`17-19`, `"지나간 날 대신 공부랑 산수 문제나 곰곰이 떠올리려무나." 마릴라가 이렇게 일이 풀린 것이 기쁜 걸 감추며 말했다. "학교에 다시 간다니, 사람 머리에 석판을 깨뜨리는 그런 소동은 더는 듣지 않게 되길 바란다. 얌전히 굴고 선생님 말씀 잘 들어라."`],
[`17-20`, `"모범생이 되도록 노력할게요." 앤이 침울하게 동의했다. "별로 재미는 없을 것 같아요. 필립스 선생님이 미니 앤드루스가 모범생이라고 하셨는데, 미니는 상상력이나 생기라고는 눈곱만큼도 없어요. 그냥 따분하고 굼뜨고, 즐거워 보이는 적이 한 번도 없어요. 하지만 지금은 마음이 너무 우울하니까 오히려 쉽게 될지도 몰라요. 학교는 큰길로 돌아서 갈 거예요. 자작나무 길을 혼자 걷는 건 견딜 수 없어요. 그랬다간 쓰라린 눈물을 흘리고 말 거예요."`],
[`17-21`, `앤은 학교에서 두 팔 벌려 환영을 받았다. 놀이를 할 때는 앤의 상상력이, 노래를 부를 때는 앤의 목소리가, 점심시간에 책을 소리 내어 읽을 때는 앤의 연기 솜씨가 몹시 그리웠던 것이다. 루비 길리스는 성경 읽기 시간에 파란 자두 세 개를 몰래 건네주었다. 엘라 메이 맥퍼슨은 꽃 카탈로그 표지에서 오려 낸 커다란 노란 팬지를 주었다. 에이번리 학교에서 아주 귀하게 여기는 책상 장식이었다. 소피아 슬론은 앞치마 단을 장식하기에 딱 좋은, 정말 우아한 새 레이스 뜨개 무늬를 가르쳐 주겠다고 했다. 케이티 볼터는 석판 닦을 물을 담아 두라고 향수병을 주었고, 줄리아 벨은 가장자리를 물결 모양으로 오린 연분홍 종이에 다음 시를 정성껏 옮겨 적어 주었다.`],
[`17-22`, `"앤에게`],
[`17-23`, `"황혼이 저녁 장막을 드리우고 / 별 하나로 그 자락을 꽂아 둘 때 / 기억해 줘, 너에게는 친구가 있다는 걸 / 그 친구가 아무리 멀리 있어도."`],
[`17-24`, `"인정받는다는 건 정말 기분 좋은 일이에요." 그날 밤 앤은 황홀하게 한숨을 쉬며 마릴라에게 말했다.`],
[`17-25`, `앤을 '인정'해 준 것은 여학생들만이 아니었다. 점심시간이 끝나고 자리에 가 보니, 앤은 필립스 선생님의 지시로 모범생 미니 앤드루스와 함께 앉게 되었는데, 책상 위에 크고 먹음직스러운 '딸기 사과'가 하나 놓여 있었다. 앤은 한 입 베어 물려고 사과를 집어 들었다가, 에이번리에서 딸기 사과가 자라는 곳은 반짝이는 호수 건너편에 있는 블라이스 씨네 오래된 과수원뿐이라는 게 생각났다. 앤은 시뻘겋게 단 숯이라도 되는 듯 사과를 떨어뜨리고, 보란 듯이 손수건으로 손가락을 닦았다. 사과는 다음 날 아침까지 아무도 손대지 않은 채 책상에 놓여 있다가, 학교를 쓸고 불을 지피는 꼬마 티모시 앤드루스가 수고비 삼아 챙겨 갔다. 점심시간이 끝난 뒤 찰리 슬론이 보낸 석필은 그보다 나은 대접을 받았다. 빨강과 노랑 줄무늬 종이로 화려하게 감싼, 보통 석필은 1센트인데 2센트나 하는 석필이었다. 앤은 너그럽게 그것을 받아 주고, 보낸 사람에게 미소를 지어 보였다. 그 미소에 홀딱 반한 소년은 곧장 일곱 번째 하늘까지 기쁨으로 날아올랐고, 그 바람에 받아쓰기에서 어찌나 끔찍한 실수를 저질렀는지 필립스 선생님은 방과 후에 남아서 다시 쓰게 했다.`],
[`17-26`, `하지만,`],
[`17-27`, `"브루투스의 흉상이 빠진 카이사르의 행렬이 / 로마에게 가장 훌륭한 아들을 더욱 떠올리게 했듯이,"`],
[`17-28`, `거티 파이와 짝이 되어 앉아 있는 다이애나 배리에게서만 아무런 선물도 눈길도 오지 않는다는 사실이 앤의 작은 승리를 씁쓸하게 만들었다.`],
[`17-29`, `"다이애나가 나한테 한 번쯤은 웃어 줄 수도 있었을 텐데." 그날 밤 앤은 마릴라에게 슬프게 말했다. 그런데 다음 날 아침, 무시무시하고 신기하게 꼬이고 접힌 쪽지 하나와 작은 꾸러미 하나가 앤에게 건네져 왔다.`],
[`17-30`, `"사랑하는 앤에게." 쪽지에는 이렇게 쓰여 있었다. "엄마가 학교에서도 너랑 놀거나 말하지 말래. 내 잘못이 아니니까 나한테 화내지 마. 나는 예전과 똑같이 너를 사랑해. 내 비밀을 다 털어놓을 네가 너무너무 보고 싶고, 거티 파이는 하나도 안 좋아. 빨간 얇은 종이로 새 책갈피를 하나 만들었어. 요즘 엄청 유행인데, 학교에서 만들 줄 아는 여자애는 셋밖에 없어. 이걸 볼 때마다 기억해 줘.`],
[`17-31`, `"너의 진정한 친구,`],
[`17-32`, `"다이애나 배리."`],
[`17-33`, `앤은 쪽지를 읽고 책갈피에 입을 맞춘 다음, 교실 건너편으로 곧바로 답장을 보냈다.`],
[`17-34`, `"나의 사랑하는 다이애나에게`],
[`17-35`, `"너는 엄마 말씀을 따라야 하니까 당연히 너한테 화나지 않았어. 우리의 영혼은 서로 통할 수 있어. 너의 예쁜 선물은 영원히 간직할게. 미니 앤드루스는 아주 착한 아이야. 상상력은 없지만. 하지만 다이애나의 '마음에 친구'였던 내가 미니의 마음의 친구가 될 수는 없어. 철자가 틀린 건 이해해 줘. 내 철자 실력이 아직 별로 좋지 않거든. 그래도 많이 '느렀어'.`],
[`17-36`, `"죽음이 우리를 갈라놓을 때까지 너의,`],
[`17-37`, `"앤 또는 코델리아 셜리.`],
[`17-38`, `"추신: 오늘 밤엔 네 편지를 베개 밑에 두고 잘 거야.`],
[`17-39`, `"앤 또는 코델리아 셜리."`],
[`17-40`, `마릴라는 앤이 다시 학교에 다니기 시작했으니 또 말썽이 생길 거라고 비관적으로 기다렸다. 하지만 아무 일도 일어나지 않았다. 어쩌면 앤이 미니 앤드루스에게서 '모범생' 정신을 조금 옮아 왔는지도 모른다. 적어도 그 뒤로 앤은 필립스 선생님과 아주 잘 지냈다. 앤은 길버트 블라이스에게는 어느 과목에서도 지지 않겠다고 마음먹고 온 마음을 다해 공부에 뛰어들었다. 두 사람의 경쟁은 곧 모두의 눈에 드러났다. 길버트 쪽에서는 순전히 선의의 경쟁이었다. 하지만 앤 쪽도 그렇다고 하기는 어려웠다. 앤은 원한을 잊지 못하는 칭찬할 수 없는 끈질김을 분명히 가지고 있었다. 앤은 미워하는 것도 사랑하는 것만큼 뜨거웠다. 앤은 공부로 길버트와 겨루겠다는 마음을 굳이 인정하지 않았다. 그걸 인정하면, 앤이 끝까지 무시하고 있는 길버트의 존재를 인정하는 셈이 되기 때문이었다. 하지만 경쟁은 분명히 있었고, 영광은 두 사람 사이를 오락가락했다. 어떤 날은 길버트가 철자 반에서 1등을 했고, 어떤 날은 앤이 긴 빨간 머리를 휙 넘기며 길버트를 철자로 이겼다. 어느 날 아침에는 길버트가 산수 문제를 모두 맞혀 칠판의 우등생 명단에 이름이 올랐다. 그러면 그다음 날 아침에는 전날 저녁 내내 소수와 씨름한 앤이 1등을 차지했다. 어느 끔찍한 날에는 두 사람이 동점이 되어 이름이 나란히 칠판에 쓰였다. 그건 거의 '주목하시오'만큼이나 나빴고, 앤의 굴욕감은 길버트의 흐뭇함만큼이나 뻔히 드러났다. 달마다 치르는 필기시험 때는 긴장감이 엄청났다. 첫 달에는 길버트가 3점 앞섰다. 둘째 달에는 앤이 5점 차로 이겼다. 하지만 앤의 승리는 길버트가 온 학교 앞에서 진심으로 축하해 주는 바람에 빛이 바랬다. 길버트가 패배의 쓴맛을 느꼈더라면 앤에게 훨씬 더 달콤했을 텐데.`],
[`17-41`, `필립스 선생님이 그다지 좋은 선생님은 아니었을지 모른다. 하지만 앤처럼 배우겠다고 굳게 마음먹은 학생이라면 어떤 선생님 아래에서든 실력이 늘 수밖에 없었다. 학기가 끝날 무렵, 앤과 길버트는 둘 다 5학년 반으로 올라가 '교과목'의 기초를 배우게 되었다. 라틴어, 기하, 프랑스어, 대수를 말하는 것이었다. 기하에서 앤은 자신의 워털루를 만났다.`],
[`17-42`, `"정말 끔찍한 과목이에요, 아주머니." 앤이 끙끙거렸다. "저는 절대로 그걸 이해하지 못할 거예요. 상상할 여지가 하나도 없어요. 필립스 선생님은 제가 기하를 이렇게 못하는 학생은 처음 봤대요. 그리고 길… 아니, 다른 애들 중에는 기하를 엄청 잘하는 애들이 있어요. 정말 창피해요, 아주머니. 다이애나도 저보다 잘해요. 하지만 다이애나한테 지는 건 괜찮아요. 지금은 남남처럼 지내지만, 저는 여전히 꺼지지 않는 사랑으로 다이애나를 사랑해요. 다이애나를 생각하면 가끔 정말 슬퍼져요. 하지만 정말이지, 아주머니, 이렇게 흥미로운 세상에서 오래 슬퍼하고 있을 수는 없잖아요, 그렇죠?"`],
  ]
};
